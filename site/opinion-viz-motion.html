<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Socra · AI 탁상공론 시각화 프로토타입</title>
<style>
  /* ===== prism 토큰 매핑 (theme.css 값) — 하드코딩 대신 토큰값을 변수로 ===== */
  :root{
    --bg:#F3F4F6;            /* prism-color-bg-surface-muted */
    --card:#ffffff;          /* prism-color-bg-surface */
    --ink:#0E0E17;           /* text-primary */
    --sub:#52555C;           /* text-muted */
    --line:#E1E5EC;          /* border-control */
    --line-strong:#C8CCD0;
    --radius:8px;            /* radius-control */
    --action:#0E0E17;        /* action-primary-bg */
    --action-fg:#ffffff;
    --shadow-sm:0px 2px 12px rgba(0,0,0,.06);
    --shadow-md:0px 4px 12px rgba(0,0,0,.10);
    --warning:#D47300; --warning-muted:#FFF3EB; --warning-fg:#8a4b00;
    /* 모델 프로필 토큰 */
    --m-gemini:#3186FF; --m-gemini-bg:#ECF5FF;
    --m-gpt:#0E0E17;    --m-gpt-bg:#EAEDF2;
    --m-claude:#D97757; --m-claude-bg:#FFF3EB;
    --m-perp:#22B8CD;   --m-perp-bg:#EBFAF1;
    --m-exp:#52555C;    --m-exp-bg:#EAEDF2;
  }
  body.dark{
    --bg:#0E0E17; --card:#1b1b24; --ink:#F3F4F6; --sub:#9FA2AA;
    --line:#24242D; --line-strong:#31313A; --action:#F3F4F6; --action-fg:#000;
    --shadow-sm:0px 2px 12px rgba(0,0,0,.4); --shadow-md:0px 8px 24px rgba(0,0,0,.5);
    --warning:#FF993F; --warning-muted:#2a1c0a; --warning-fg:#FFCB97;
  }
  body.dark .avatar{background:#191922 !important}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#e9eaee;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink)}
  body.dark{background:#000}
  .wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:26px 16px 60px}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .caption{font-size:13px;color:#6b7180;max-width:360px;text-align:center;line-height:1.55}
  body.dark .caption{color:#9FA2AA}

  .phone{width:360px;height:740px;background:var(--card);border-radius:38px;
    box-shadow:0 24px 60px rgba(20,24,34,.22);overflow:hidden;position:relative;
    border:1px solid var(--line);display:flex;flex-direction:column}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 4px;font-size:13px;font-weight:600;color:var(--ink)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 28px}
  .screen::-webkit-scrollbar{display:none}

  .question{font-size:13px;color:var(--sub);margin:8px 0 4px;line-height:1.45}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
    padding:6px 12px;border-radius:999px;background:var(--bg);color:var(--ink);margin:2px 0 8px}
  .pill .d{width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .brief{font-size:19px;font-weight:800;line-height:1.45;letter-spacing:-.2px;margin:0 0 8px}

  .warn{display:flex;gap:8px;align-items:flex-start;background:var(--warning-muted);
    color:var(--warning-fg);border:1px solid var(--warning);border-radius:var(--radius);
    padding:10px 12px;font-size:13px;font-weight:700;line-height:1.45;margin:6px 0 2px}

  .stage{position:relative;width:100%;margin:8px 0 2px}
  .stageQuick{height:330px}
  .stageDeep{height:350px}
  .links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  .node{position:absolute;transform:translate(-50%,-50%);border-radius:50%;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;font-weight:800;line-height:1.1;opacity:0;
    box-shadow:var(--shadow-md);
    transition:left .85s cubic-bezier(.22,.7,.25,1),top .85s cubic-bezier(.22,.7,.25,1),
      width .85s cubic-bezier(.34,1.25,.5,1),height .85s cubic-bezier(.34,1.25,.5,1),opacity .4s ease}
  .node .nm{font-size:11px;font-weight:700;opacity:.96;padding:0 7px}
  .node .pc{font-size:17px;font-weight:900;margin-top:1px}
  .node .em{font-size:18px;line-height:1}
  .stage.calm .node{transition:left .8s ease,top .8s ease,width .8s ease,height .8s ease,opacity .45s ease}

  .center{background:var(--action);color:var(--action-fg);z-index:4;font-size:14px;
    line-height:1.25;white-space:pre-line;box-shadow:var(--shadow-md)}
  .center.soft{background:var(--card);color:var(--ink);border:2px dashed var(--line-strong);box-shadow:var(--shadow-sm)}

  .avatar{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
    z-index:5;border:2px solid rgba(255,255,255,.7);box-shadow:var(--shadow-sm);opacity:0;
    transition:left .7s cubic-bezier(.22,.7,.25,1),top .7s cubic-bezier(.22,.7,.25,1),opacity .4s ease}
  .avatar.talking{animation:talk .9s ease-in-out infinite}
  @keyframes talk{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.09)}}
  .avatar.seed{width:30px;height:30px;font-size:10px;z-index:7}

  .node.tension{animation:tense 1.7s ease-in-out infinite}
  @keyframes tense{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}

  .chiprow{position:absolute;transform:translate(-50%,-50%);display:flex;z-index:6;opacity:0;transition:opacity .4s ease}
  .chip{position:static;transform:none;width:18px;height:18px;font-size:9px;border-width:1.5px;
    margin-left:-5px;box-shadow:none;opacity:1}
  .chip:first-child{margin-left:0}
  .chip.more{background:var(--bg);color:var(--sub);border-color:var(--card)}

  /* list */
  .sec{font-size:15px;font-weight:800;margin:18px 0 10px}
  .rank{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .rank:first-of-type{border-top:none}
  .rk{width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
  .rinfo{flex:1;min-width:0}
  .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .rname{font-size:14px;font-weight:700}
  .rpc{font-size:14px;font-weight:900}
  .rbar{height:6px;border-radius:6px;background:var(--bg);margin-top:7px;overflow:hidden}
  .rbar i{display:block;height:100%;border-radius:6px;width:0;transition:width .9s ease .2s}
  .rdesc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}
  .rmodels{display:flex;align-items:center;gap:5px;margin-top:7px}
  .rmodels .lab{font-size:11px;color:var(--sub)}
  .rmodels .mini{display:flex}
  .rmodels .mini .avatar{position:static;transform:none;width:18px;height:18px;font-size:9px;border-width:1.5px;margin-left:-5px;box-shadow:none;opacity:1}
  .rmodels .mini .avatar:first-child{margin-left:0}

  .list{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
  .list.show{opacity:1;transform:none}

  .foot{display:flex;gap:8px;margin-top:18px}
  .foot .ghost{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);
    font-weight:700;font-size:13px;padding:11px;border-radius:var(--radius);text-align:center}

  /* controls */
  .ctrls{display:flex;flex-direction:column;gap:10px;width:360px}
  .row{display:flex;gap:8px}
  .btn{flex:1;border:1px solid var(--line-strong);background:var(--card);color:var(--sub);font-weight:700;
    font-size:13px;padding:10px;border-radius:12px;cursor:pointer;transition:.15s}
  .btn.on{background:var(--action);color:var(--action-fg);border-color:var(--action)}
  .replay,.theme{border:1px dashed var(--line-strong);background:transparent;color:var(--sub);
    font-weight:700;font-size:13px;padding:10px;border-radius:12px;cursor:pointer}
  .theme{flex:0 0 92px}
  .hint{font-size:12px;color:#6b7180;text-align:center;line-height:1.55}
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="ctrls">
        <div class="row">
          <button class="btn on" data-mode="quick">퀵체크 · 버블 회의</button>
          <button class="btn" data-mode="deep">딥체크 · 클러스터 회의</button>
        </div>
        <div class="row" id="states"></div>
        <div class="row">
          <button class="replay" id="replay" style="flex:1">↺ 회의 다시 재생</button>
          <button class="theme" id="theme">🌙 다크</button>
        </div>
        <div class="hint">AI 아바타가 <b>원탁에 둘러앉아</b> 각자 의견을 던지고 → 가운데로 <b>모여 토론</b> → <b>합의로 정착·성장</b>합니다. 퀵체크는 <b>아바타를 탭</b>하면 그 모델의 선택이 보여요.</div>
      </div>
    </div>

    <div class="col">
      <div class="phone">
        <div class="statusbar"><span>4:18</span><span>●●● LTE ▮</span></div>
        <div class="screen" id="screen"></div>
      </div>
      <div class="caption" id="cap"></div>
    </div>
  </div>

<script>
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVGNS='http://www.w3.org/2000/svg';

/* ===== 모델 레지스트리 (prism 모델 프로필 토큰) ===== */
const MODELS={
  Gemini:{c:'var(--m-gemini)',bg:'var(--m-gemini-bg)',s:'G'},
  GPT:{c:'var(--m-gpt)',bg:'var(--m-gpt-bg)',s:'GPT'},
  Claude:{c:'var(--m-claude)',bg:'var(--m-claude-bg)',s:'C'},
  Perplexity:{c:'var(--m-perp)',bg:'var(--m-perp-bg)',s:'P'},
};
const EXP=k=>({c:'var(--m-exp)',bg:'var(--m-exp-bg)',s:k.slice(0,1)});
const model=k=>MODELS[k]||EXP(k);
function avatarEl(k,cls){
  const m=model(k), e=document.createElement('div');
  e.className='avatar'+(cls?(' '+cls):''); e.style.background=m.bg; e.style.color=m.c;
  e.textContent=m.s; e.title=k; return e;
}

/* ===== 색 (브랜드 그라디언트 토큰) ===== */
const QUICK_FILL=[ 'linear-gradient(135deg,#14C8FF 0%,#006DFF 100%)','#2F86FF','#5AA7FF','#8FC4FF','#BBDBFF' ];
const QUICK_TXT =[ '#fff','#fff','#fff','#0E0E17','#0E0E17' ];
const DEEP_GRAD=[
  'linear-gradient(135deg,#B48CFF 0%,#4D28B5 100%)',
  'linear-gradient(135deg,#14C8FF 0%,#006DFF 100%)',
  'linear-gradient(135deg,#55E6F2 0%,#007A99 100%)',
  'linear-gradient(135deg,#FF8AC7 0%,#D600D8 100%)',
];
const DEEP_LINE=['#6F53D4','#006DFF','#007A99','#D600D8'];

/* ===== 데이터 ===== */
const QUICK={
  strong:{ pill:'강한 합의', q:'친구랑 갈 해외 여행지 추천해줘',
    brief:'세 모델 모두 <b>후쿠오카</b>로 의견이 모였어요.',
    items:[
      {name:'후쿠오카',score:70,by:['Gemini','GPT','Claude'],desc:'이동이 편하고 음식·쇼핑·근교가 두루 무난해요.'},
      {name:'오사카',score:18,by:['GPT'],desc:'맛집·쇼핑·테마파크 중심 여행에 좋아요.'},
      {name:'다낭',score:12,by:['Gemini'],desc:'가성비·휴양을 챙기기 좋은 대안.'},
    ]},
  contest:{ pill:'의견 경합', q:'주말에 오사카 vs 후쿠오카 어디가 나을까?',
    brief:'<b>오사카</b>와 <b>후쿠오카</b>가 팽팽해요. 한쪽으로 강하게 모이지 않았어요.',
    items:[
      {name:'오사카',score:38,by:['GPT','Claude'],desc:'쇼핑·테마파크 비중이면 우세.'},
      {name:'후쿠오카',score:36,by:['Gemini','Claude'],desc:'동선·휴식 비중이면 우세.'},
      {name:'다낭',score:26,by:['Gemini'],desc:'해외 휴양을 원하면 별개 선택지.'},
    ]},
  dispersed:{ pill:'의견 분산', q:'아무데나 3박4일 여행 추천!',
    brief:'의견이 <b>고르게 갈렸어요.</b> 뚜렷한 1위 없이 취향에 따라 갈려요.',
    items:[
      {name:'후쿠오카',score:26,by:['Gemini'],desc:'무난한 근거리 선택.'},
      {name:'오사카',score:24,by:['GPT'],desc:'쇼핑·테마파크.'},
      {name:'다낭',score:22,by:['Claude'],desc:'가성비 휴양.'},
      {name:'방콕',score:16,by:['Gemini'],desc:'활동적인 도시 여행.'},
      {name:'타이베이',score:12,by:['GPT'],desc:'짧고 편한 미식 여행.'},
    ]},
  risk:{ pill:'강한 합의', risk:true,
    q:'급한 불부터 끄려고 남편 빚 550만원을 먼저 갚아줬어요. 이 돈 다 돌려받을 수 있나요?',
    warn:'추가 송금은 멈추고, 550만원이 "빌려준 돈"이라는 기록부터 확보하세요.',
    brief:'세 모델 모두 <b>기록 확보가 1순위</b>라고 봤어요. 금액·차트보다 먼저 행동이 필요해요.',
    items:[
      {name:'차용증·기록 확보',score:70,by:['Gemini','GPT','Claude'],desc:'1순위 조치 — 지금 바로 대화·이체 내역을 확보하세요.'},
      {name:'재산 보전 검토',score:30,by:['GPT'],desc:'2순위 — 증거 확보 후 변호사 상담과 함께 검토할 단계예요.'},
    ]},
};
const DEEP={
  high:{ pill:'높은 합의', center:'비상자금\n먼저 확보', q:'30대 일본인, 노후·은퇴 준비 뭐부터 해야 할까요?',
    brief:'대부분의 AI가 <b>비상자금 확보</b>를 1순위로 꼽았어요. 그 다음 NISA·iDeCo로 장기 투자.',
    clusters:[
      {name:'비상자금 확보',emoji:'🛟',score:70,by:['Gemini','GPT','Claude','세무사','FP','보험'],desc:'대부분의 모델이 1순위로 지목. 투자 전 6~12개월 생활비 확보로 변동성 대응.'},
      {name:'절세 계좌',emoji:'💳',score:16,by:['Claude','세무사'],desc:'신NISA·iDeCo로 장기 투자 세제 혜택.'},
      {name:'지출 통제',emoji:'✂️',score:8,by:['GPT'],desc:'고정비 점검으로 투자 여력 확보.'},
      {name:'공적연금',emoji:'🏛️',score:6,by:['FP'],desc:'예상 연금 확인으로 부족분 계산.'},
    ]},
  split:{ pill:'쟁점 분산', center:'쟁점이\n갈려요', soft:true, q:'여윳돈 5천만원, 지금 뭐부터 해야 할까요?',
    brief:'<b>전문가 의견이 갈렸어요.</b> 위험 성향·부채 상황에 따라 우선순위가 달라져요.',
    clusters:[
      {name:'공격적 투자',emoji:'📈',score:30,by:['GPT','펀드매니저'],desc:'장기·고성장 자산 비중을 높이자는 관점.'},
      {name:'안전 우선',emoji:'🛡️',score:28,by:['FP','보험'],desc:'현금·채권 비중을 지키자는 관점.'},
      {name:'부채 상환',emoji:'💸',score:22,by:['세무사','Claude'],desc:'고금리 부채부터 정리하자는 관점.'},
      {name:'주거 매입',emoji:'🏠',score:20,by:['Gemini','자산운용'],desc:'실거주 자산을 먼저 확보하자는 관점.'},
    ]},
};

/* ===== helpers ===== */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sizeFor=s=>clamp(15.5*Math.sqrt(s),46,132);
let current={mode:'quick',state:'strong'}, timers=[];
const clearT=()=>{timers.forEach(clearTimeout);timers=[];};
const after=(ms,fn)=>timers.push(setTimeout(fn,ms));

/* ===== shell ===== */
function renderShell(){
  const screen=document.getElementById('screen'), q=current.mode==='quick';
  const d=q?QUICK[current.state]:DEEP[current.state];
  screen.innerHTML=`
    <div class="question">${d.q}</div>
    ${d.warn?`<div class="warn"><span>⚠️</span><span>${d.warn}</span></div>`:''}
    <div class="pill"><span class="d"></span>${q?'빠른 종합 결과':'딥체크 종합'} · ${d.pill}${d.risk?' · 고위험':''}</div>
    <div class="brief">${d.brief}</div>
    <div class="stage ${q?'stageQuick':'stageDeep'}${d.risk?' calm':''}" id="stage"><svg class="links" id="links"></svg></div>
    <div class="sec">${q?'의견 순위':'핵심 근거'}</div>
    <div class="list" id="list"></div>
    <div class="foot"><div class="ghost">${d.risk?'⚖️ 변호사 상담 연결':(q?'다른 관점으로 다시 보기':'모델별 요약 보기')}</div><div class="ghost">모델 답변 보기</div></div>`;
  q?playQuick():playDeep();
}

/* ===== QUICK : 모델이 의견을 던지는 원탁 회의 ===== */
function playQuick(){
  clearT();
  const stage=document.getElementById('stage'), svg=document.getElementById('links');
  const W=stage.clientWidth,H=stage.clientHeight,cx=W/2,cy=H/2,Rr=Math.min(W,H)/2-18;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const items=[...QUICK[current.state].items].sort((a,b)=>b.score-a.score);
  const avs=['Gemini','GPT','Claude'];

  // 원탁(faint table)
  const table=document.createElementNS(SVGNS,'circle');
  table.setAttribute('cx',cx);table.setAttribute('cy',cy);table.setAttribute('r',Rr);
  table.setAttribute('fill','none');table.setAttribute('stroke','var(--line)');
  table.setAttribute('stroke-dasharray','3 6');table.setAttribute('stroke-width','1.5');
  svg.appendChild(table);

  // 아바타 착석 (패널)
  const apos={};
  const avEls=avs.map((k,i)=>{
    const a=(-90+i*120)*Math.PI/180, x=cx+Rr*Math.cos(a), y=cy+Rr*Math.sin(a);
    apos[k]={x,y};
    const e=avatarEl(k); stage.appendChild(e);
    e.style.left=x+'px';e.style.top=y+'px';e.style.animationDelay=(i*0.18)+'s';
    requestAnimationFrame(()=>e.style.opacity=1);
    return e;
  });

  // 각 모델의 대표 의견 index (가장 높게 지지한 의견)
  const topIdx={};
  avs.forEach(k=>{let b=0,bs=-1;items.forEach((it,oi)=>{if(it.by.includes(k)&&it.score>bs){bs=it.score;b=oi;}});topIdx[k]=b;});

  // 최종 의견 버블 (중앙에서 숨김 상태로 시작)
  const place=(e,x,y,d,op)=>{e.style.left=x+'px';e.style.top=y+'px';e.style.width=d+'px';e.style.height=d+'px';if(op!=null)e.style.opacity=op;
    e.querySelector('.nm').style.display=d<58?'none':'block';};
  const els=items.map((it,i)=>{
    const e=document.createElement('div'); e.className='node';
    e.style.background=QUICK_FILL[i]; e.style.color=QUICK_TXT[i];
    e.innerHTML=`<div class="nm">${it.name}</div><div class="pc">${it.score}%</div>`;
    stage.appendChild(e); place(e,cx,cy,24,0); return e;
  });

  // 씨앗 = 각 모델이 던지는 자기 의견 (모델 색, 자기 자리에서 출발)
  const seeds=avs.map(k=>{
    const s=avatarEl(k,'seed'); stage.appendChild(s);
    s.style.left=apos[k].x+'px'; s.style.top=apos[k].y+'px';
    requestAnimationFrame(()=>s.style.opacity=1);
    return {k,el:s};
  });

  const settlePos=()=>{
    const st=current.state; return items.map((it,i)=>{
      const d=sizeFor(it.score);
      if(st==='dispersed'){const N=items.length,a=(-90+i*360/N)*Math.PI/180;return{x:cx+92*Math.cos(a),y:cy+92*Math.sin(a),d};}
      if(st==='contest'){if(i===0)return{x:cx-58,y:cy-6,d};if(i===1)return{x:cx+58,y:cy-6,d};return{x:cx,y:cy+88,d};}
      if(i===0)return{x:cx,y:cy,d};const k=i-1,N=items.length-1,a=(-55+k*(360/N))*Math.PI/180;return{x:cx+108*Math.cos(a),y:cy+108*Math.sin(a),d};
    });
  };
  const P=settlePos();

  // 탭하면 그 모델이 고른 의견으로 선이 보임 (평소엔 숨김)
  const toggleLink=(k)=>{
    const ex=svg.querySelector('[data-ln="'+k+'"]'); if(ex){ex.remove();return;}
    const ti=topIdx[k];
    const ln=document.createElementNS(SVGNS,'line'); ln.setAttribute('data-ln',k);
    ln.setAttribute('x1',apos[k].x);ln.setAttribute('y1',apos[k].y);
    ln.setAttribute('x2',P[ti].x);ln.setAttribute('y2',P[ti].y);
    ln.setAttribute('stroke',model(k).c);ln.setAttribute('stroke-width','2');
    ln.setAttribute('stroke-linecap','round');ln.style.opacity='0';ln.style.transition='opacity .35s ease';
    svg.appendChild(ln); requestAnimationFrame(()=>ln.style.opacity='0.55');
  };

  // 가운데로 모여 토론(jostle)
  const seatHuddle=(s)=>seeds.forEach(sd=>{sd.el.style.left=(cx+rand(-s,s))+'px';sd.el.style.top=(cy+rand(-s,s))+'px';});
  // 흩어지며 결론으로 — 씨앗은 자기 대표 의견 위치로 가며 사라지고, 최종 버블이 성장
  const resolve=()=>{
    seeds.forEach(sd=>{const p=P[topIdx[sd.k]];sd.el.style.left=p.x+'px';sd.el.style.top=p.y+'px';sd.el.style.opacity='0';});
    els.forEach((e,i)=>place(e,P[i].x,P[i].y,P[i].d,1));
  };
  const finish=()=>{
    avEls.forEach(e=>e.classList.remove('talking'));
    if(current.state==='contest'&&!RM){els[0].classList.add('tension');els[1].classList.add('tension');}
    avEls.forEach((e,i)=>{e.style.cursor='pointer';e.onclick=()=>toggleLink(avs[i]);});
    fillList(items,true);
  };

  if(RM){resolve();finish();return;}
  avEls.forEach(e=>e.classList.add('talking'));
  after(450,()=>seatHuddle(30));   // 모임
  after(820,()=>seatHuddle(40));   // 토론 jostle
  after(1120,()=>seatHuddle(26));
  after(1500,resolve);             // 흩어지며 결론으로
  after(1950,finish);
}

/* ===== DEEP : 중앙 결론 + 둘러싼 근거 도우(arc) ===== */
function playDeep(){
  clearT();
  const stage=document.getElementById('stage'), svg=document.getElementById('links');
  const W=stage.clientWidth,H=stage.clientHeight,cx=W/2,cy=H/2;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const d=DEEP[current.state], items=[...d.clusters].sort((a,b)=>b.score-a.score);
  const N=items.length, S=items.reduce((a,it)=>a+it.score,0);
  const R=90, SW=30, GAP=(d.soft?30:15)*Math.PI/180, avail=2*Math.PI-N*GAP;
  const polar=(ang,r=R)=>[cx+r*Math.cos(ang), cy+r*Math.sin(ang)];

  // 중앙 결론 (hero) — 합의 신호는 '중앙이 단단한가'로
  const center=document.createElement('div');
  center.className='node center'+(d.soft?' soft':''); center.textContent=d.center;
  stage.appendChild(center);
  const CD=d.soft?96:112;
  center.style.left=cx+'px';center.style.top=cy+'px';center.style.width='12px';center.style.height='12px';center.style.opacity='0';

  // 근거 도우 (호 길이 = 비중) + 아이콘 배지
  let ang=-Math.PI/2;
  const segs=items.map((it,i)=>{
    const segRad=it.score/S*avail, a0=ang+GAP/2, a1=a0+segRad, mid=(a0+a1)/2;
    const [x0,y0]=polar(a0),[x1,y1]=polar(a1), large=segRad>Math.PI?1:0;
    const p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d',`M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`);
    p.setAttribute('fill','none');p.setAttribute('stroke',DEEP_LINE[i%4]);
    p.setAttribute('stroke-width',SW);p.setAttribute('stroke-linecap','round');
    svg.appendChild(p);
    const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p.style.transition='stroke-dashoffset .65s ease';
    ang=a1+GAP/2; return {p,mid,it,i};
  });

  // 아이콘 배지 (흩어졌다 → 모임 → 도우 위로)
  const place=(e,x,y)=>{e.style.left=x+'px';e.style.top=y+'px';};
  const badges=segs.map(s=>{
    const b=document.createElement('div'); b.className='avatar';
    b.style.background='var(--card)'; b.style.color='var(--ink)';
    b.style.border='2px solid '+DEEP_LINE[s.i%4]; b.textContent=s.it.emoji;
    stage.appendChild(b); place(b,rand(50,W-50),rand(40,H-40)); requestAnimationFrame(()=>b.style.opacity=1);
    return b;
  });

  const huddle=(sp)=>badges.forEach(b=>place(b,cx+rand(-sp,sp),cy+rand(-sp,sp)));
  const settle=()=>{
    center.style.width=CD+'px';center.style.height=CD+'px';center.style.opacity='1';
    segs.forEach((s,i)=>after(120*i,()=>{s.p.style.strokeDashoffset='0';}));   // 도우가 감싸며 그려짐
    badges.forEach((b,i)=>{const [x,y]=polar(segs[i].mid);place(b,x,y);});
    fillList(items,false);
  };

  if(RM){settle();return;}
  after(450,()=>huddle(34));
  after(820,()=>huddle(42));
  after(1120,()=>huddle(30));
  after(1500,settle);
}

/* ===== 리스트 (시각화 + 텍스트 항상 병행) ===== */
function fillList(items,q){
  const list=document.getElementById('list'), max=items[0].score;
  list.innerHTML=items.map((it,i)=>{
    const color=q?(i<3?'#2F86FF':'#8FC4FF'):DEEP_LINE[i%4];
    const bar=q?QUICK_FILL[i]:DEEP_GRAD[i%4];
    return `<div class="rank">
      <div class="rk" style="background:${color}">${i+1}</div>
      <div class="rinfo">
        <div class="rtop"><span class="rname">${q?it.name:(it.emoji+' '+it.name)}</span><span class="rpc">${it.score}%</span></div>
        <div class="rbar"><i style="background:${bar}" data-w="${Math.round(it.score/max*100)}"></i></div>
        <div class="rdesc">${it.desc}</div>
        <div class="rmodels"><span class="lab">참여 모델</span><span class="mini" data-by='${JSON.stringify(it.by)}'></span></div>
      </div></div>`;
  }).join('');
  list.querySelectorAll('.mini').forEach(m=>JSON.parse(m.dataset.by).forEach(k=>m.appendChild(avatarEl(k))));
  requestAnimationFrame(()=>{list.classList.add('show');list.querySelectorAll('.rbar i').forEach(b=>b.style.width=b.dataset.w+'%');});
}

/* ===== controls ===== */
const STATES={quick:[['strong','강한 합의'],['contest','의견 경합'],['dispersed','의견 분산'],['risk','고위험']],
  deep:[['high','높은 합의'],['split','쟁점 분산']]};
const CAP={quick:'퀵체크 — 3개 모델이 원탁에서 각자 의견(씨앗)을 던지고 가운데로 모여 토론 → 흩어지며 결론으로 성장. 강한 합의=한 곳으로 모임 · 경합=둘로 갈림+진동 · 분산=제각각. 아바타를 탭하면 그 모델이 고른 의견이 선으로 보여요.',
  deep:'딥체크 — 중앙은 합의된 결론, 주변은 그 결론을 떠받치는 근거 "도우(arc)". 합의 신호는 클러스터 크기가 아니라 중앙이 또렷하고 도우가 촘촘히 감싸는가로 봐요. 높은 합의=촘촘히 감쌈 · 쟁점 분산=중앙 점선(보류)+도우 사이가 벌어짐. 호 길이=강조 비중, 참여 모델은 아래 리스트.'};
function renderStates(){
  const box=document.getElementById('states');
  box.innerHTML=STATES[current.mode].map(([k,l])=>`<button class="btn ${k===current.state?'on':''}" data-state="${k}">${l}</button>`).join('');
  box.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{current.state=b.dataset.state;renderStates();renderShell();});
  document.getElementById('cap').textContent=CAP[current.mode];
}
document.querySelectorAll('.row .btn[data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.btn[data-mode]').forEach(x=>x.classList.toggle('on',x===b));
  current.mode=b.dataset.mode; current.state=STATES[current.mode][0][0]; renderStates(); renderShell();
});
document.getElementById('replay').onclick=renderShell;
document.getElementById('theme').onclick=function(){
  document.body.classList.toggle('dark');
  this.textContent=document.body.classList.contains('dark')?'☀️ 라이트':'🌙 다크';
  renderShell();
};
renderStates(); renderShell();
</script>
