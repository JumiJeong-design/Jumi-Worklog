운\n                                  무엇인가를 창조하는 것’이라는 디자인의 공통 개념으로, 목표 대상물을 의도와\n                                  계획대로 설계하는 것을 말한다.\n\n\n                                  DESIGN = INTENTION (의도,의미) + DRAWING (실제도출, 그리기)\n\n\n\n3                                 디자인은 학문적 또는 어원적 의미로만 사용되기 보다는 실제 활용되는 상황에\nJohn Heskett(2002),\n《Design:A Very Short              따라 다양한 해석이 가 능한 개념이다. 헤스켓(John Heskett, 2002) 3 은\nIntroduction》, Oxford\n                                  대상이 명확해서 그 의미가 바로 전달되는 ‘사랑’과 같은 단어와 달리 ‘디자인’은\nUniversity Press\n                                  사용할 때마다 맥락적으로 대상이 달라지고, 상황별로 의미가 달라 혼란의\n                                  근원이 된다고 하였다. 그는 단어 ‘디자인’으로 구성한 문장인 ‘Design is\n                                  to design a design to produce a design.’ 을 통해 문장에 사용된 단어\n                                  ‘디자인(design)’이 사용 목적에 따라 의미가 모두 다를 수 있음을 설명한다.\n\n\n\n                                      Design is to design a design to produce a design.\n\n                                       [명사/주어]   [동사/서술어]   [명사/목적어]           [명사/목적어]\n                                     (일반적) 디자인    행동, 과정     제안, 계획            완성품, 결과물\n\n\n\n                                      디자인은 디자인(결과물)을 만들기 위해 디자인(계획)을 디자인(행동)한다.\n\n\n\n\n                                                                        서비스·경험디자인 이론서     15\n\f                          이와 같이 디자인은 의미상 명사와 동사로 구분하여 이해할 수 있는데, 명사적\n                          의미에서 디자인은 계획과 설계의 결과물을 말하며, 동사적 의미에서 디자인은\n                          디자인 행위와 방법, 일련의 과정(프로세스)을 의미한다. 앞서 모조타가 정의한\n                          ‘계획의 결과물’로서의 명사적 의미를 넘어 1960년대 영국의 디자인 리서치\n                          소사이어티(Design Research Society)의 활동을 기점으로 디자인의 개념은\n                          동사적 의미를 포괄하여 확장되었다.\n\n\n4                         크리스토퍼 존스(John Chris Jones, 1970) 4는 디자인 분야의 주요한 새로운\nJohn Chris Jones(1970),\n《Design Methods》, Wiley   텍스트로 과학적 사고방식을 통해 인간의 창조에 포괄적으로 접근하는 방법인\n                          디자인 방법론을 제시하였다. 부분적 개량과 변화를 목적으로 하는 전문영역의\n                          경계를 넘어, 디자인은 개인적 경험이나 내적 세계를 포함해야 하고, 경영, 공학,\n                          사회과학 등 타 분야와의 교류를 통해 전체 상황을 파악해야 한다는 새로운\n                          목적이 대두되었기 때문이다.\n\n\n                          디자인은 개인의 철학이나 가치에 따라 학문적 정의나 통용되는 의미가 다양할\n                          수 있지만 앞서 언급한 진화한 디자인의 의미를 포함하여 산업 기반의 디자인을\n                          정의하면 다음과 같다.\n\n\n\n                            “산업디자인”이란 제품 및 서비스 등의 미적ㆍ기능적ㆍ경제적 가치를 최적화함으로써\n                             생산자 및 소비자의 물질적ㆍ심리적 욕구를 충족시키기 위한 창작 및 개선 행위\n                             (창작ㆍ개선을 위한 기술개발행위를 포함한다)와 그 결과물을 말하며,\n                             제품디자인ㆍ포장디자인ㆍ환경디자인ㆍ시각디자인ㆍ서비스디자인 등을 포함한다.\n\n                                                                     산업디자인진흥법\n\n\n\n\n16    Part 1. 왜 서비스디자인인가?\n\f                           1.2 디자인의 분류와 특성\n\n                           디자 인은 목 적에 따 라 분 류 형태가 다 양 할 수 있다. 우 선, 세 계의 주요\n                           표준산업분류에서 디자인업을 살펴보면 디자인은 아래와 같이 구분되어 있다.\n                           디자인은 전문 디자인업으로 분류되며 세부 분류에서 인테리어, 제품, 시각\n                           디자인은 공통으로 나타나는 반면 패션 디자인은 분류체계에 따라 다른 양상을\n                           보인다. UN, 한국, 유럽연합 표준에는 패션 디자인이 포함되어 있으나 북미\n                           산업분류에는 패션 디자인이 아닌 기타 디자인이 포함되어 있다.\n\n5\n                           CODE        UN 국제표준산업분류 (ISIC)                CODE      한국표준산업분류 (KSIC 10차)\n한국디자인진흥원(2020), 《디자인\n이 궁금해》                      7410      Specialized design activities      7320              전문디자인업\n\n                           7410.1            Fashion design              73201           인테리어 디자인업\n\n                           7410.2           Industrial design            73202             제품 디자인업\n\n                           7410.3    Activities of graphic designers     73203             시각 디자인업\n\n                           7410.4    Activities of interior decorators   73204    패션, 섬유류 및 기타 전문 디자인업\n\n                           CODE       유럽연합 표준산업분류 (NACE)                 CODE        북미 표준산업분류 (NAICS)\n\n                            74.10     Specialised design activities      5414       Specialized design services\n\n                           74.10.1           Fashion design              54141       Interior design services\n\n                           74.10.2          Industrial design            54142      Industrial design services\n\n                           74.10.3   Activities of graphic designers     54143       Graphic design services\n\n                           74.10.4   Activities of interior decorators   54149   Other specialized design services\n\n                           [ 각국의 전문디자인 산업 분류체계 5 ]\n\n\n\n6                          디자인업의 범위를 넘어 디자인산업 6 (창의적인 디자인을 기반으 로 다양한\n산업통상자원부/한국디자인진흥원.\n(2013), 《디자인 분류체계 및 산업별    비즈니스 영역에서 새로운 가치를 창출하는 산업으로서, 전문디자인기업과\n디자인 가치 측정 연구》\n                           디자인 활용기업, 공공부문을 포함)을 위한 디자인 정책을 시행하는 우리나라\n                           정부 부처와 기관은 업무 특성에 따라 다음 표와 같이 기관별 분류 체계와\n                           명칭을 각기 다르게 설정하여 운영하고 있다.\n\n\n7                          디자인 관련 법령은 2021년 현재 산업디자인진흥법(약칭: 산업디자인법,\n산업디자인진흥법(law.go.kr),\n2021.12월 기준                주관: 산업통 상자원부 엔지니어링디자인과) 7 과 공 공디자인의 진흥에 관한\n\n8\n                           법률(약칭: 공공디자인법, 주관: 문화체육관광부 시각예술디자인과) 8이 있다.\n공공디자인의 진흥에 관한 법률\n                           산업디자인법은 산업디자인의 연구 및 개발을 촉진하고, 산업디자인을 진흥하기\n(law.go.kr), 2021.12월 기준\n                           위한 사업을 지원함으로써 산업의 경쟁력 강화에 이바지함을 목적으로 한다.\n                           공공 디자인법은 공공디자인의 문화적 공공성과 심미성 향상에 필요한 사항을\n                           정함으로써 국가 및 지역 정체성과 품격을 제고하고 국민의 문화 향유권을\n                           증대하는 데 이바지함을 목적으로 한다.\n\n\n\n\n                                                                                      서비스·경험디자인 이론서               17\n\f9\n                              구분                            분류\n한국디자인진흥원, 디자인문화\n콘텐츠 산업인적자원개발위원회\n                                       디자인산업특수분류: (대분류) 8개 (제품디자인, 시각디자인, 공간디자인,\n(2019), 《디자인분류체계 재정비\n                           산업통상자원부     패션/텍스타일 디자인, 서비스/경험디자인, 디자인인프라(기반기술), 디지털/\n(안) 연구사업》\ ement)\n   Design Context       기반적 요소와 유통· 전시· 소비· 활용 등 이와     • 디자인 교육/정책 (Design Education &\n                        관련된 활동                            Policy)\n\n\n\n     디지털미디어/            다양한 종류의 디지털 환경에서 제공되는           • 디지털미디어디자인 (Digital Media Design)\n     콘텐츠디자인             서비스·콘텐츠를 사용 목적과 용도에 맞게          • 콘텐츠디자인 (Contents Design)\n    Digital Media/      최적화하여 디자인하고 효과적으로 구현하는          • 게임디자인 (Game Design)\n   Contents Design      산업활동                            • 영상디자인 (Video/Film Design)\n\n\n                                                        • 금속공예디자인 (Metal Craft Design)\n                        문화적 요소가 반영된 기법, 기술, 소재, 문양 등을   • 도자공예디자인 (Ceramic Craft Design)\n    산업공예디자인\n                        바탕으로 기능성과 장식성을 추구하여 수작업으로       • 섬유공예디자인 (Fabric Craft Design)\n    Craft Design\n                        물품을 만드는 산업활동                    • 목공예디자인 (Wood Craft Design)\n                                                        • 기타 공예디자인 (Other Craft Design)\n\n\n                        제품과 서비스의 전반적인 생태계를 디자인할\n     융합디자인                                              • 기술융합디자인\n                        수 있도록 기술과 인문학, 감성 등을 융합하여\n    Convergence                                         • 인문융합디자인\n                        디자인의 산업적 가치와 역량을 향상시키는\n      Design                                            • 감성융합디자인\n                        통합적인 디자인 활동\n\n\n[ 디자인 분류체계10 ]\n\n\n                                                                     서비스·경험디자인 이론서           19\n\f02\n디자인의 진화\n2장에서는 시대의 요구에 따라 확대되고 있는 디자인 영역에 대하여 살펴보고, 서비스\n디자인의 실행에 각 영역이 어떤 영향을 미치는지 그 역할에 대하여 알아본다.\n\n\n\n\n20   Part 1. 왜 서비스디자인인가?\n\f                        2.1 디자인의 흐름\n\n11                      19 0 7 년 설립 된 독일 공 작 연맹 에 의 해 ‘ 현대 디 자 인 ’이 라 는 호칭 이\n와까미야 노부하루. (1990), 현대\n디자인사, 조형사               생겼으며, 독일 바우하우스를 거쳐 1920년대 후반 미국에서 ‘인더스트리얼\n                        디자인(Industrial Design, 산업디자인)’이라는 용어가 의식적으로 사용되기\n                        시작하였다.11 이로부터 디자인 영역은 산업의 발전 형태나 정책의 방향에 따라\n                        주요 디자인 분야로 진화해왔다. 예컨대, 대량 생산을 위해 산업혁명 시대 때\n                        디자인은 세분화된 전문성을 요구받았으며, 그에 따라 기업의 전략적 핵심\n                        분야에 디자인이 활용되면서 디자인경영 시대가 열렸다.\n\n\n                        경제적 성장만을 추구했던 산업과 사회의 분위기는 이후 공공성과 인간 중심\n                        사고를 바탕으로 하는 디자인 시대로 변화·발전하였으며, 정보화혁명과 4차\n                        산 업혁명 시대를 맞 이하 여 디지털 분 야의 디자 인과 유 (有)·무형(無 形) 을\n                        아우르는 경험 및 서비스디자인의 시대로 발전하고 있다. 이는 기존 디자인\n                        분야가 사라진다거나 중요하지 않다기보다는 디자인의 영역과 역할이 시대의\n                        요구에 따라 확대되고 있음을 의미한다.\n\n\n\n\n                                       연 평균 소득   $10,000   $10,000   $20,000   $30,000\n\n\n\n\n[ 시대별 디자인의 흐름 ]\n\n\n\n\n                                                                     서비스·경험디자인 이론서       21\n\f12                                  리처드 뷰캐넌(Richard Buchanan)은 앞으로 우리가 해결해야 할 문제는\nRichard Buchanan(1992),\n<Wicked Problems in Design          매우 복잡하고 어려운 문제(Wicked Problem)12이며, 이를 해결하기 위해서는\nThinking>, Design Issues, Vol. 8,\nNo. 2, (Spring), pp. 5-21\n                                    환경과 시스템을 위한 디자인에 다음의 중층적 분류를 포함할 것이 요구된다고\n                                    보았다. 디자인 분류의 중층성에 대한 구체적인 설명은 다음과 같다.\n\n\n                                    첫 번째는 기호와 이미지를 그래픽으로 다루는 커뮤니케이션(Communication)\n                                    디 자 인이다. 두 번 째 는 공 학, 건 축 및 대량으 로 생 산되 는 산 업 제 품의\n                                    디자인이다. 세 번째는 20세기 중반 이후 서비스의 활동과 과정을 디자인하는\n                                    데 ‘인간과 컴퓨터의 상호작용’이 적용될 수 있음을 깨닫게 되면서, 특정한\n                                    관계나 그 관계를 뒷받침하 는 것들 을 디자인하 는 인터랙션(Interaction,\n                                    상호작용)의 디자인이다. 마지막으로 네 번째는 앞서 언급한 모든 디자인 분류가\n                                    존재하 는 환경과 시스템의 디자인이다. 따라서 미래사회의 복잡한 질문은\n                                    비즈니스, 조직, 교육, 정책과 같은 시스템의 작동 방식 및 핵심 아이디어와의\n                                    연결을 비롯해 가치가 무엇인가를 이해하고 다룰 수 있는 디자인을 통해 접근할\n                                    수 있을 것이다.\n\n\n\n\n[ 디자인 분류의 진화(Four Orders of Design) ]\n\n\n\n\n22     Part 1. 왜 서비스디자인인가?\n\f                           2.2 디자인의 역할\n\n                           2.2.1 디자인의 역할과 활용\n\n                           디자인은 사회, 경제, 문화 등 시대의 상황과 흐름을 같이 하며, 이에 따라\n                           디자 인의 역할 또한 진화하고 있다. 디자 인은 전문 성을 바탕으 로 미래를\n                           위한 개념과 시나리오를 제안하고 제품이나 서비스의 부가가치를 높인다. 이\n                           과정에서 디자인은 인간을 중심으로 한 윤리적 방향으로 사회를 이끌며 조직과\n                           사회에 문화적 영향을 미친다. 이러한 디자인의 역할은 먼저 국가와 산업, 기업의\n                           경쟁력을 강화하기 위한 역할과 인간 중심의 기술 사용과 사회의 다양한 문제를\n                           해결하기 위한 역할로 구분할 수 있는데, 디자인이 경제적·사회적 가치 실현을\n                           위해 활용된다는 점을 알 수 있다.\n\n\n13                         덴마크 디자 인 센터는 디자 인 사 다리 모델(20 01년) 13 을 통 해 기업에 서\n덴마크 디자인 센터,\n<design_ladder.2016.pdf>   디자인의 역할과 활용 단계를 설명하였다. 이는 기업이 이익을 창출하는 데\n(danskdesigncenter.dk)\n                           디자인이 긍정적으로 기여한다는 가설을 바탕으로 한 것으로, 비즈니스에서\n                           디자 인을 전략적으 로 활용할 때의 단계적 특 성과 역할을 정의하고 있다.\n                           각 단계별로 살펴보면 1단계는 '디자인 미활용 단계'로 디자인을 의도 없이\n                           비체계적으로 적용하는 상황을 말하며, 2단계는 '디자인을 스타일(style)'로\n                           활용하는 단계로 심미적인 목적이 우선인 상황을 말한다. 3단계는 ‘디자인을\n                           프로세스(process)'로 활용하는 단계로 기업의 주요 프로세스 안에 디자인이\n                           포함되는 상황을 말하며, 4단계는 '디자인을 전략(strategy)'으로 활용하는\n                           단계로 기업의 비전이나 전략을 수립하는 데 있어 디자인이 핵심적 역할을\n                           수행하여 혁신하는 상황을 말한다.\n\n\n\n\n                                                           서비스·경험디자인 이론서   23\n\f14                       영국 디자인 카운슬(Design Council)은 사회적 가치 실현을 위한 '공공을\n덴마크 디자인 센터, <Design\nfor Public Good.pdf>     위한 디자인' (2013년)14에서 디자인의 활용 상황을 3단계로 제시하였다. 이에\n(danskdesigncenter.dk)\n                         따르면, 공공 영역에서 디자인 주도 혁신은 비교적 작은 문제해결부터 복잡한\n                         정책 결정에 이르기까지 두루 활용될 수 있다. 먼저 1단계는 '문제해결을 위한\n                         디자인‘ 단계로 개별 프로젝트에 일회성으로 디자인을 활용하는 것을 말한다.\n                         다음으로 2단계는 '조직 역량(일하는 방법, 조직문화)으로서의 디자인' 단계로\n                         조직 내 직원이 디자인을 이해하고 활용하여 전체적인 기관의 문화가 되는 것을\n                         말하며, 마지막 3단계는 '정책을 위한 디자인' 단계로 전통적인 정책 설계의\n                         구조적인 문제를 극복하기 위한 전략적 접근을 말한다.\n\n\n\n\n                                기업의 디자인 역할과 활용          공공 영역의 디자인 역할과 활용\n\n                               덴마크 디자인 센터(2001년)         영국 디자인 카운슬(2013년)\n                                   디자인 사다리                 공공 영역 디자인 사다리\n                                 (Design Ladder)     (The Public Sector Design Ladder)\n\n\n                             재화를 생산하는 가치창출 과정에서    가치 창출의 주체와 이해관계자의 조직, 문화를\n                               디자인의 역할을 표현한 모델      변화시키는 디자인의 역할을 표현한 모델\n\n\n\n\n                         [ 디자인 역할과 활용 사다리 모델 ]\n\n\n\n\n24    Part 1. 왜 서비스디자인인가?\n\f                     2.2.2 디자인의 사회적 기능과 윤리\n\n                     ‘계획’하 는 일이라 는 점에서 디자 인에는 어떤 방 향이 올바른가 에 대하 여\n                     끊임없이 생각 해야 할 책임이 부여된다. 현대 디자인은 산업 발전과 양적\n                     성장을 위한 경제적 가치 향상의 도구로써 매우 현실적이고 물질적 측면에서의\n                     역할을 하였다. 디자인의 인본주의는 기계나 공급의 원칙에 따라 개발한 제품과\n                     서비스를 인간 중심의 관점에서 사용 가치를 높이고 사회와 연결하려는 것으로,\n                     좋은 세상을 만들기 위해 창의적 사고를 발휘하는 분야가 바로 디자인이라는\n                     점을 분명히 한다. 공공성을 바탕에 둔 디자인의 사회적 기능과 관련하여 사회적\n                     책임과 역할에 대해 논의해야 할 지점을 몇 가지 기조로 분류해 보면 다음 그림\n                     및 표의 내용과 같다. 이는 지구적 환경 보호, 윤리와 책임, 사회 문제 해결 등의\n                     영역을 다루고 있으며, 사회적 기능을 위한 디자인의 역할이 커져야 함을 보여\n                     준다.\n\n\n\n\n[ 디자인의 사회적 기능 이슈의 흐름 ]\n\n\n\n\n                                                    서비스·경험디자인 이론서   25\n\f     년도                제목                                            내용\n\n\n                                          - 미국의 빅터 파파넥은 『인간을 위한 디자인』 출판을 통해 디자이너의\n                                           사회적 책임과 윤리에 대해 강조.\n     1971        인간을 위한 디자인\n                                          - 지역 재료를 활용하여 화산 폭발의 위험을 알리는 5센트짜리 통라디오를\n                                           디자인하여 적정디자인에 대한 개념 적용.\n\n\n                                          - ‘Powers of Ten’이라는 영상을 제작하여 거시적, 미시적 관점을 통합한\n     1977         찰스 & 레이 임즈\n                                           디자인 씽킹의 기본 개념을 표현.\n\n\n\n                                          - 영국의 나이젤 휘틀리(Whiteley, Nigel)는 소비주의 디자인을 넘어\n                 사회를 위한 디자인\n     1993                                  환경과 여성, 윤리, 사회적 책임까지 생각하는 지속 가능한 디자인의\n               (Design for Society)\n                                           모색을 주장함.\n\n\n\n                                          - 미국의 건축가인 로널드 메이스(Ronald L. Mace)은 \"모든 나이와\n                                           능력에 대응하는 디자인\"(Design for All ages and abilities)을\n                  유니버설디자인\n     1997                                  위해 유니버설디자인이란 용어를 창안. 노스캐롤라이나 주립\n                (Universal Design)\n                                           대학교의 유니버설디자인 센터에서 7대 원칙을 만들어 발표하여\n                                           디자인 가이드라인으로 활용.\n\n\n\n                                          - 영국의 헬렌햄린센터는 인클루시브(Inclusive, 포용)디자인 개념을\n                 인클루시브디자인\n     1999                                  정립, 연구하는 기관으로 다양한 상황의 모든 사람을 포용하여 인간\n                (Inclusive Design)\n                                           삶의 향상을 위한 디자인 역할과 활동을 주도.\n\n\n\n                                          - d.school과 IDEO는 ‘모든 사람은 디자이너이다’라는 개념을 바탕으로\n                    디자인씽킹\n     2004                                  사회적 문제해결을 위한 방법론으로 디자인씽킹을 정의하고 프레임\n                 (Design Thinking)\n                                           워크를 구축함.\n\n\n\n                                          - 미국의 스미소니언 박물관은 전시와 출판물을 통해 디자인의 사회적\n     2007    소외된 90%를 위한 디자인               책임을 선포. 이제까지 디자이너의 90%는 상위 10% 만을 위한\n                                           디자인을 해왔으며, 나머지 90%를 위한 디자인 혁명을 주장.\n\n\n\n                                          - ‘Designs of the Time, 이 시대의 디자인’을 주제로 디자인의 사회적\n                      Dott07               역할을 정립함. 영국 디자인 정부지원기관인 디자인카운슬과 뉴캐슬\n     2007\n            (Designs of the Time, 2007)    지역의 다양한 환경, 지역, 사회 문제를 해결하기 위해 디자인을 활용한\n                                           프로젝트.\n\n\n\n                                          - 미국의 나단 쉐드로프는 『Design is the Problem』책을 통해 의미 없는\n                                           무언가를 계속 만들어내기만 하는 디자인은 자신들이 대단한 일을 하는\n     2007     Design is the Problem\n                                           것으로 생각하지만 중고차 딜러보다 못한 존재라고 비판, 계획하는 사람\n                                           으로서의 환경·윤리·사회적 책임을 가질 것을 주장.\n\n\n\n\n26    Part 1. 왜 서비스디자인인가?\n\f                                - 심미적, 유희적 감성디자인의 대표적 스타 디자이너인 필립 스탁이 독일\n                                 일간지와 TED강연에서 크리스마스 선물같이 화려하지만 별 쓸모없는\n                                 이제까지의 디자인을 모두 후회한다고 하며, 물질주의의 생산자로서의\n  2008      필립 스탁의 은퇴선언\n                                 디자인을 포기하겠다고 선언.\n                                - 앞으로 눈을 높이 들어 더 멀리 바라보고 사회, 공동체, 문명화를 위한\n                                 활동을 할 것이라고 다짐.\n\n\n\n                                - 트리스탄 해리스(Tristan harris)는 구글의 디자인윤리학자로 행동경제학,\n                                 사회심리학 등을 연구하여 기술이 사람들의 생각과 행동을 어떻게\n  2014        디자인 윤리학자\n                                 윤리적으로 이끌어야 하는지에 대한 프레임워크를 개발. 중독적 UI를\n                                 개선하는 아이디어 도출.\n\n\n\n\n                                - 한국의 국민디자인단은 사회 문제 해결을 위한 참여디자인 방법론으로\n                                 서비스디자인을 활용하여 다양한 이해관계자와 함께 정책 디자인을\n  2014        국민디자인단\n                                 하는 공공분야의 혁신적 체계와 프로세스 구축으로 사회적 디자인\n                                 역할을 정립.\n\n\n\n                                - 한국은 지속 가능한 발전을 위한 사회적, 윤리적 가치를 반영하는\n                                 비재무적 요소인 환경(Environment)·사회(Social)·지배구(Gove-\n              ESG 경영공시\n  2021                           rnance)에 대한 평가를 경영 공시에 의무화를 도입.\n                의무화\n                                - 2000년 영국을 기점으로 2006년 UN에서 공식기구를 만들어 ESG를\n                                 고려한 사회책임 투자를 장려.\n\n\n[ 디자인의 사회적 기능과 윤리에 대한 주요 내용 ]\n\n\n\n\n                                                                 서비스·경험디자인 이론서    27\n\f         지속가능한 디자인\n\n\n\n더 알아보기\n                                  무분별한 자원 낭비, 환경오염, 오존층 파괴, 천연자원 고갈 등 전 세계적으로\n                                  환경문제에 관한 관심이 높아지고 있고, 이러한 문제에 대해 디자 이너의\n                                  사회적, 도덕적, 윤리적인 책임 의식이 점점 더 대두되고 있다. 이와 관련해\n                                  디자이너가 실행할 수 있는 문제 해결의 방안으로 언급되는 것이 바로 지속\n                                  가능한 디자인이다. 지속 가능한 디자인은 산업적 관점에서 자연을 파괴하지\n                                  않고 인간의 존엄성을 훼손하지 않으면서 지속적인 경제발전을 이룩하고자 하는\n                                  녹색성장을 위한 노력의 하나이다.\n\n\n\n                                    Sustainable Design\n                                    인류와 사회의 지속 가능한 발전이 가능하도록 제품·서비스와 관계된 전 과정의\n                                    사회적, 경제적, 환경적 요인을 고려하는 디자인\n\n\n\n\n         15                       지속 가 능한 디자인(Sustainable Design)은 이익, 사람, 지구라는 3대\n         알라스테어 풔드 루크(2010), 《디자\n         인 액티비즘》, 미술문화, p. 45     기본 축의 균형을 맞추어15 인류와 사회의 지속 가 능한 발전이 가 능하도록\n                                  사회적, 경제적, 환경적 관점에서 오랜 기간 동안 사용할 수 있는 것을 목표로\n         16\n         경제정보센터(2015), 《적정기술은     하는 디자인으로, 모든 대상에 현재보다 미래를 위한 사회적 선을 실현하는\n         ‘인간’의 얼굴을 한 ‘기술’》\n                                  디자인이라고 할 수 있다.\n                                  * 적정기술 : 적당한 기술, 알맞은 기술이라는 말로 정치적, 문화적, 환경적\n                                  조건을 고려해 해당 지역에서 지속적인 생산과 소비가 가능하도록 만들어진\n                                  기술로 인간의 삶과 질을 궁극적으로 향상시킬 수 있는 기술16\n\n\n\n\n                                    3R Design\n                                    자원의 소재, 쓰임새 등을 재활용(Recycle), 또는 재사용(Reuse)하고\n                                    소요되는 부품이나 폐기물 양을 줄이는 것(Reduce)을 목적으로 하는 디자인\n\n\n\n\n         17                       지속 가능한 디자인을 설명하 는 데 흔히 사용되는 3R-[재활용(Recycle),\n         디자인DB, <디자인 트렌드, 사회\n         를 배려하는 디자인-지구를 살리        재사용(Reuse), 절감(Reduce)] 디자인은 실천적인 내용을 담고 있지만\n         는 디자인은 어떻게 가능한가요?>,\n                                  일반적으로는 사용된 제품의 폐기 주기를 지연시키는 방법일 뿐이다.17\n         2021.12월 기준\n\n\n\n\n         28   Part 1. 왜 서비스디자인인가?\n\f                           Green Design\n                           환경 영향력을 최소화하는 프로세스를 통해 환경친화적인 제품과 서비스를\n                           개발하는 디자인\n\n\n\n18                       그린디 자 인(Green D esign) 이란 환 경친 화 적 디 자 인으 로 환 경 문제 를\n홍동식(2011), <시각디자인에 있어\n서의 에코디자인 및 그린 디자인의       최소화하고, 제품이나 그 외의 서비스가 자연의 순환 과정에 잘 스며들 수\n동향>, 한국콘텐츠학회 제9권 제3\n호, pp. 37-38\n                         있도록 디자인하는 활동이라고 할 수 있다.18 그린디자인에서 친환경성, 경제성,\n                         공정성은 모두 동등하게 중요한 요소로서 인간의 삶과 자연의 공존, 차별적\n                         가치의 인정, 행복의 의미를 추구함으로써 더 나은 미래를 디자인하는 것이다.\n\n\n\n                           Eco Design\n                           제품의 생산부터 유통 폐기 전까지의 전 과정에 걸쳐 환경 영향력을 최소화하고\n                           친환경적인 가치와 라이프스타일을 지향하는 디자인\n\n\n\n\n19                       에코디자인(Eco Design)이란 제품이 생산되어 유통, 폐기되는 전 과정에서\n환경부(2001), 《에코디자인 가이\n드》, p. 25, 2021.12월 기준   나타날 수 있는 환경 측면의 피해를 줄이면서 비용, 품질 경쟁력을 높이는\n                         환경친화 디자인으로, 여러 가지 통합적인 요소들을 고려하여 환경·경제적으로\n                         우수한 제품을 디자인, 생산 및 판매하는 기업경영의 새로운 전략 기법이다.19\n                         유해 물질 사용을 줄이고, 사용 기간을 늘리며, 사용이 끝난 후 폐기나 재활용이\n                         쉽게 이루어질 수 있게 하는 등 사용상의 안전성을 최대화하고 환경에 미치는\n                         영향 들을 고려하여 인간의 건강과 환경의 보호를 동시에 구현하고자 하 는\n                         것이다.\n\n\n20                       사 회 와 환 경에 책 임 을 지 는 디 자 인 을 강 력하 게 주 장 한 빅터 파 파 넥 은\n알라스테어 풔드 루크(2010), 《디자\n인 액티비즘》, 미술문화, p. 74\n                         디자이너들의 사회적, 도덕적 책임 의식을 강조하며, 경제적 이익을 위해\n                         쓸모없는 상품을 디자인하 는 시간을 줄이고 대신 전 세계의 소외계층이나\n                         혜택을 받지 못하는 사람들이 진정으로 필요로 하는 것을 반영하는 디자인에\n                         신경 써야 한다고 주장한다. 이러한 그의 주장은 디자이너 집단의 사고방식에 큰\n                         충격을 주게 되었고, 보편적 디자인, 포괄적 디자인, 그리고 사용자 중심 디자인\n                         등의 디자인 접근 방법을 촉발하는 계기가 되었다.20\n\n\n\n\n                                                            서비스·경험디자인 이론서   29\n\f         유니버설디자인(Universal Design; UD) 21\n\n\n\n더 알아보기\n         21                             유니버설디자인(Universal Design)이란 장애·연령·성별·언어 등에 관계없이\n         The Centre for Excellence\n         in Universal Design(CEUD),     환경의 시설물이나 제품 또는 서비스를 사용하려는 모든 사람의 요구 사항을\n         2021.12월 기준 (https://\n         universaldesign.ie/what-is-\n                                        충족하여 편리하게 이용할 수 있도록 설계하는 것을 의미한다.22\n         universal-design/definition-\n         and-overview/definition-and-\n                                        ‘Universal’은 '일반적인, 보편적인'이라는 의미를 가진 단어로 성별·연령·국적\n         overview.html)\n                                        ·신체크기·왼손잡이·질병 등에 의한 차이뿐만이 아니라 개인의 다양성에 의한\n         22\n         행정안전부(2018), 《공공청사 유           체격, 이동 및 인지능력, 일시적 불편사항23 등 다양한 사람들을 고려한 모두를\n         니버설디자인 적용 안내책자》,\n         2021.12월 기준\n                                        위한 디자인(Design for All)이라고도 할 수 있다.\n\n         23\n         서울특별시(2017), 《서울시 유니           미국 노스캐롤라이나 주립대학의 로널드 메이스 교수에 의해 처음으로 정의된\n         버셜 디자인 통합 가이드라인》,\n                                        유니버설디자인을 통해 달라진 가장 중요한 변화 중 하나는 신체가 불편한\n         2021.12월 기준\n                                        사람들에게 '특별한 요구'라는 라벨을 없애주었다는 것이다. 이 말은 장애인들의\n                                        특별한 요구를 일반인들이 들어줘야 한다는 것이 아니라, 유니버설디자인을\n                                        통해 특별한 대우 없이도 모든 사람이 편안하게 이용할 수 있어야한다는 데에 그\n                                        핵심이 있다는 것이다.\n\n\n\n\n                                        [ 7원칙 : 미국 North Carolina 대학 유니버설디자인센터 ]\n\n\n\n\n         30    Part 1. 왜 서비스디자인인가?\n\f                              유니버설디자인의 7원칙과 지침 :\n                              미국 North Carolina 대학 유니버설디자인 센터 제시\n\n                              ① 공평한 사용                       ⑤ 실수에 대한 관대함\n                                다양한 능력을 지닌 사람들에게 용하고          위험한 상황이나 의도하지 않은 조작에\n                                판매될 수 있는 디자인                  의한 나쁜 결과를 최소화 하는 디자인\n\n                              ② 사용의 융통성                      ⑥ 적은 신체적 노력\n                                폭넓은 개인의 선호도와 능력을              피로 없이 편안하고 효과적으로 사용할\n                                수용하는 디자인                      수 있는 디자인\n\n                              ③ 간단하고 직관적인 사용                 ⑦ 접근과 사용을 위한 크기와 공간\n                                사용자의 경험·지식·언어 등과 관계없이         사용자의 신체·이동 능력 등에 관계없이\n                                이해하기 쉬운 디자인                   이동·사용할 수 있는 적정 크기와\n                                                              공간을 제공\n                              ④ 인지할 수 있는 정보\n                                필요한 정보를 사용자에게 효과적으로\n                                전달하는 디자인\n\n\n\n\n                              인클루시브디자인(Inclusive Design : 포용적 디자인)과 유니버설디자인(UD)\n\n24                            인클루 시브디자 인은 신체 적, 인지적 능력의 제한 없이 다 양 한 사 용자 를\n중앙선데이(2019.12.26.), “샴푸\n인지 화장품인지...시각장애인에             포괄하며 디자인을 통해 소외된 계층을 포용한다는 포용적 디자인 개념을\n게’ 구별‘을 허하라”, 2021.12월\n기준 (https://news.joins.com/\n                              가지고 있다. 인클루시브 디자인은 공존과 상생의 철학을 기초로 하고 있으며,\narticle/23615660)             특히 사회적 약자를 배려하는 개념을 포함하고 있다.24 이는 현 시대의 흐름과\n25                            사회적 요구에 따라 환경, 제품과 서비스를 디자인할 때 상대적으로 배제되었던\n김선아(2019), 디자인 씽킹을 활용\n한 인클루시브 디자인 콘셉트 개발,\n                              특이 상황의 사용자를 포용하는 디자인을 통해 주류로 통합하여 사회의 건전한\n기초조형학연구 21권 3호\n                              발전을 추구하고자 하는 것에 목적이 있다.\n\n\n\n                                구분           인클루시브 디자인                유니버설디자인\n\n\n                                         다양한 다수의 사용자를 포괄하여      가능한 최대한의 사용자가 보편적으로\n                                정의\n                                          누구나 사용하기 편리한 디자인           사용하는 디자인\n\n                                주요\n                                           환경, 제품, 시각, 서비스             환경, 제품\n                               적용 분야\n\n                                주요\n                                                 유럽                        북미\n                               활용국가\n\n                              [ 인클루시브디자인과 유니버설디자인의 비교25 ]\n\n\n\n\n                                                                    서비스·경험디자인 이론서     31\n\f                          베리어프리(Barrier Free 또는 BF ; 무장애)와 유니버설디자인(UD)의 비교\n\n                          베리어프리와 유니버설디자 인은 비슷하지만 많은 부 분에서 차 이가 있다.\n                          베리어프리는 장 애인에 대한 법적 기준과 표준 을 기본으 로 하 여 제 시된\n                          개념이지만, 유니버설디자인은 다양한 사람들을 포괄하는 개념이자 창의적인\n                          해결안으로 사람들의 만족도 향상을 포함하는 사람 중심의 디자인에 초점을 둔\n                          것이다.\n\n\n\n     구분                        베리어프리                               유니버설디자인\n\n\n             • 신체적 불편 또는 장애가 있는 사람이 안전하고              • 누구에게나 공평하고 이용하기 쉽고, 쾌적한 물리적,\n              쉽게 사용하도록 장애물 없는 물리적 환경 만들기               사회적 환경 만들기\n      개념     • 장애인을 주 대상으로 평등한 환경을 조성하기               • 가능한 많은 사람의 요구에 만족시키기 위한 디자인\n              위한 법규 및 명령에 근거한 디자인으로 주로                 철학이자 접근 방법\n              표준을 통한 기준 설정                            • 다양한 선택지를 통한 기회 제공\n\n\n             • 주로 장애인, 노인 등의 신체적, 정신적 어려움을            • 성별, 연령, 국적, 장애의 유무에 관계 없는 모든\n              가진 사람들                                   사람들\n     대상\n             • 건축물, 공공시설 등에 존재하는 물리적 환경(시설,           • 건축, 공공시설물 등의 물리적 환경을 비롯한 행정,\n              설비, 정보)의 장애물 제거                          교육, 복지 등의 사회적 환경 가치 제고\n\n\n             • 장애인 노인 임산부 등의 편의증진 보장에 관한\n              법률\n                                                      • 각 지자체의 유니버설디자인 관련. 조례\n     법적근거    • 교통약자의 이동편의 증진법\n                                                      • 서울특별시 유니버설디자인 도시 조성 기본 조례\n             • 장애물 없는 생활환경 인증에 관한 규칙 제정\n              (BF인증제도)\n\n                                                      • 유니버설디자인은 BF의 장애에 대한 한정적인\n             • 1974년 UN 장애인 생활환경 전문가 협회에 의해\n                                                      시각에서 벗어나 보편성의 관점에서 1980년대\n              \"장벽이 없는 건축 설계\" 라는 보고서 알려지면서\n                                                      유니버설디자인의 개념이 정립되기 시작\n              건축분야에 사용되기 시작\n                                                      • 1997년 North carolina 주립대학 로널드메이스가\n             • 90년대에 관련 이론이 정립되면서 건축을\n                                                      현재와 같은 유니버설디자인의 정의를 완성하고\n              중심으로 Barrier Free(무장애) 명명\n                                                      원칙을 설정\n     태생배경    • 장애인의 이동 및 접근을 위한 미국의 the\n                                                      • 법적기준으로는 해결할 수 없는 사안들에 대한\n              Americans with Disabilities Act(ADA)에\n                                                      디자인적인 사고와 해결안으로서, 사용자의 차별감\n              근간하여 요구사항을 구현하는 규정에서 비롯해\n                                                      해소 및 자존감 향상의 필요에서 출발\n              주로 접근성 보장을 위한 표준적인 기준 제시\n                                                      • 다양한 사용자의 이용편의 증진과 사회적 참여의\n             • 한국에서도 ADA의 기준을 바탕으로 법적 기준\n                                                      보장을 위해 환경과 제품 디자인 분야에서 서비스\n              마련\n                                                      전달까지 확장\n\n\n             무장애는 그 범위를 확대하여 '모든 사람을 위한 디자인(Design for All)이라고 정의하며,\n     추세\n             물리적 공간뿐만 아닌 제품과 인간 주변의 모든 환경을 대상으로 하는 유니버설디자인 개념으로 발전\n\n\n[ 베리어프리와 유니버설디자인의 비교 ]\n\n* 출처 : 서울시 유니버설디자인 통합가이드라인(2021)\n\n\n\n\n32   Part 1. 왜 서비스디자인인가?\n\f                                 베리어프리(Barrier Free 또는 BF)와 유니버설디자인(UD)\n\n\n                                                                     Universal Design\n                                                                     연령, 심신의 능력, 사용환경에 상관없이\n                                                                     가능한 많은 사람들이 손쉽게 사용할 수\n                                                                     있도록 잠재적인 불만까지 제거한 디자인\n\n                                         Universal Design\n\n\n                                                                     Barrier Free\n                                                                     장애인이나 노인 등이 일상생활을 하면서\n                                                                     불편이 될 수 있는 장애물이 처음부터\n                                            Barrier Free             설치되지 않도록 하거나, 설치된 장애물에\n                                                                     대해서는 편의시설을 설치하여 장애물을\n                                                                     없애는 것을 말함\n\n\n\n\n                                 [ 베리어프리와 유니버설디자인의 범위 ]\n                                 * 출처 : 공공청사 유니버설디자인 적용 안내책자(2021)\n\n\n\n\n26                               유니버설디자인은 만능인 하나의 디자인을 추구하 는 것이 아니라 최대한\nNDA, The Centre for Excellence\nin Universal Design(CEUD),       광범위한 사용자를 수용할 수 있는 최적의 디자인을 추구하는 것이다. 또한 사람\n2021.12월 기준 (https://\nuniversaldesign.ie/what-is-\n                                 중심의 접근 방식으로 다양한 사람들과 다양한 능력에 대한 인식이 요구되는\nuniversal-design/definition-\n                                 과정에서 생겨난 개념이다. 따라서 유니버설디자인은 모든 사람에게 동일한,\nand-overview/definition-and-\noverview.html)                   동등한 경험, 활동 및 서비스를 제공하는 것이며 특정 분야의 디자이너가 아닌\n                                 모든 디자이너가 달성하고자 하는 목표가 되어야 한다.26\n\n\n\n\n                                                                          서비스·경험디자인 이론서       33\n\f03\n서비스·경험디자인의 개념과 발전\n산업, 경제, 사회 문제 등 패러다임의 변화에 따라 발전하는 서비스디자인의\n개념과 활용을 연도별로 살펴보고 비교해 본다.\n\n\n\n\n34   Part 1. 왜 서비스디자인인가?\n\f                     3.1 서비스디자인의 산업\n\n                     3.1.1 서비스디자인 개념 및 산업의 발전\n\n27                   과거에는 서비스를 부수적이거나 간접적인 것으로 인식하여, 주요한 상품을\nISTANS(산업통계 분석시스템)\n(www.istans.or.kr)   구매하면 무료 로 주어지는 것, 직접 가치를 만들어내지 못하지만 경제에\n                     간접적으로 도움을 주는 활동 정도로 받아들였다. 하지만 최근 산업 전체에서\n                     서비스업이 차지하 는 비중이 증가하며 그 중요 도가 상승하였고 서비스는\n                     제조업을 넘어 산업의 중심이 되었다. 한국 고용 비중을 기준으로 서비스업은\n                     2000년 61.2%에서 2019년 70.28%로 성장하였으나, 제조업은 16.33%에\n                     그치고 있다. 세계의 다른 선진국들도 대부분 70% 이상의 높은 서비스업\n                     비 중 을 보이 고 있다. 2 7 특 히 온 라 인 과 모 바 일 기 술의 보편 화 로 디 지털\n                     서비스로의 변화가 가속화되며 서비스에 대한 패러다임의 변화가 진행 중이다.\n\n\n                   효용(utility)의 제공\n                                  ‘제조’ 활동이란 유형적인 물질적 재화(goods)로 효용을 창출하는 것이고\n                                  ‘서비스’는 이 물 질적 재화 에 무형적인 효용 을 더하 는 ‘비제조’ 활동으 로\n                                  인식되었다. 제품은 물질적 재화, 서비스는 비물질적 재화라는 이분적 사고는\n                                  20세기 전반까지 이어졌다.\n\n\n                                  20세기 초, 산업(industry)과 기업(firm)의 개념\n30                                재화 를 만들어내는 방식은 개인이나 소규모의 공 동체가 수작 업으 로 소량\n위키피디아 “Three-sector model”\n(https://en.wikipedia.org/wiki/   생 산하 던 작 업 방식에서 대규모의 사 람들이 함께 기계를 이용하 여 대량\nThree-sector_model）\n                                  생산하 는 방식으로 변화되었다. 산업은 이처럼 ‘크고, 새로운 제조기업’을\n                                  말하며, 기계산업, 전자산업, 섬유산업 등 전체를 포괄하여 통칭하는 개념으로\n                                  사용되었다.\n                                  이때 부터 크 고 복 잡 한 기업 조 직이나 생 산과 정 을 과 학적 으 로 분 석하고\n                                  효 율 적 으 로 관 리 하 는 기 법 들 이 만 들 어 지 고 ‘산 업 공 학 ( I n d u s t r i a l\n                                  Engineering)’이 등 장 하게 되었다. 하지만 이때까지의 산업은 제조업을\n                                  의미하였다.\n                                  20 세기 중반, 산 업의 종 류가 다 양 해지고, 규모가 커지면서 전체 산 업을\n                                  성격과 내용의 차이에 따라 몇 가지 유형으로 구분하였고 서비스산업이라는\n                                  개념이 정착하게 되었다. 영국의 경제학자 클라크(Collin Grant Clark)는 알란\n                                  피셔(Allan Fisher), 장 포레스티(Jean Fourastie)와 함께 3분류 모델(1951,\n                                  The Three-sector model in economics)을 개발하여 산업을 3개의 분야로\n                                  구분하였다.30\n\n\n\n\n36    Part 1. 왜 서비스디자인인가?\n\f                            • 1차 산업 : 농업, 광업, 어업 등 (Primary sector : raw materials) : 토지나\n                              바다 등의 자연환경에서 노동력을 동원하여 필요한 자원을 얻거나 물건을\n                              생산하는 데 필요한 원자재를 채취하는 분야\n\n\n                            • 2차 산업 : 제조업, 건설업 등 (Secondary sector : manufacturing) :\n                              1차 산업에서 얻은 산출물을 가공하여 인간에게 필요한 제품을 생산하거나\n                              건물이나 설비, 시설 등을 세우는 분야\n\n\n                            • 3차 산업 : 서비스 (Tertiary sector : services) : 1, 2차 산업을 제외한\n                              나머지 분야로 서비스업을 의미함. 도매 및 소매업, 숙박 및 음식점업, 운송업,\n                              통신업, 금융업, 부동산업, 공공 행정, 교육 서비스업, 보건 및 사회 복지 사업,\n                              문화, 오락, 예술 및 운동 관련 서비스업 등\n\n31                          클 라 크 는 ‘ 3 차 산 업 증 가 의 법 칙 ’을 바 탕 으 로 서 비 스 산 업 의 발 달 을\n위키피디아 “Quaternary sector\nof the economy” (https://   예상하였는데, 이는 산업구조가 고도화될수록 서비스산업이 고용에서 차지하는\nen.wikipedia.org/wiki/\nQuaternary_sector_of_the_   비중이 커지게 된다는 것이다.\neconomy)\n                            클 라 크 의 분 류 는 21세 기의 산 업 분 류 에 는 맞지 않는 다 는 비판도\n                            있 으 나 오 늘 날 에 도 기 본 구 분 법 은 통 용되 고 있 으 며 4 차 산 업 : 정 보\n                            서비스(Quaternary sector : information services), 5차 산업 : 휴먼\n                            서비스(Quinary sector : human services)로 확장하여 사용되기도 한다.31\n\n\n\n\n                                                                                    Tertiary Activities\n\n                                                                                    Deindustrialization\n\n                                                                                    Secondary Activities\n\n                                                                                    Quaternary Activities\n\n                                                                                    Primary Activites\n\n\n\n\n                            [ Colin Clark's sector model of an economy undergoing technological change.\n                            In later stages, the quaternary sector of the economy grows – shown in red. ]\n\n\n\n\n                                                                                         서비스·경험디자인 이론서      37\n\f                                  20세기 중반 이후\n32                                산업의 종류가 더 다양해지고 새로운 산업들이 생성되면서 산업을 세 가지\n위키피디아 “Standard Industrial\nClassification” (https://         분류로만 구분하기에는 한계가 있어 새로운 분류체계가 개발되었다. 1937년\nen.wikipedia.org/wiki/Standard_\nIndustrial_Classification)        미국에서 시작된 표준산업분류(Standard Industry Classification: SIC)는 모든\n                                  산업에 4자리의 숫자(code)를 부여하고 대분류, 중분류, 소분류, 세분류 등의\n                                  계층적 구조로 구분하였는데, 이에 따라 세계 각국에서는 거의 유사한 ‘표준적’인\n                                  기준이 사용되었다.32\n\n\n                                     Range of SIC Codes                   Division\n\n                                          0100-0999           Agriculture, Forestry and Fishing\n\n                                          1000-1499                        Minig\n\n                                          1500-1799                     Construction\n\n                                          1800-1999                       not used\n\n                                          2000-3999                    Manufacturing\n\n                                                          Transportation, Communications, Electric,\n                                          4000-4999\n                                                                  Gas and Sanitary service\n\n                                          5000-5199                   Wholesale Trade\n\n                                          5200-5999                     Retail Trade\n\n                                          6000-6799          Finance, Insurance and Real Estate\n\n                                          7000-8999                       Services\n\n                                          9100-9729                 Public Administration\n\n                                          9900-9999                    Nonclassifiable\n\n                                  [ SIC Codes Range ]\n\n\n\n                                  현재 우리나라 표준산업분류의 대분류는 A부터 T까지 20가지로 이루어져 있으며,\n                                  A와 B가 1차 산업, C부터 F가 2차 산업이고 나머지 G부터 T가 모두 3차 산업에\n                                  해당한다.\n\n\n                                  20세기 후반 이후\n                                  경제구조가 변화하고 사회구성이 다양해짐에 따라 서비스산업은 급격하게\n                                  발전하였다. 이런 현상은 선진국을 중심으로 두드러지게 나타나고 있으며 전\n                                  세계적으로 ‘경제의 서비스화(shift to service)’가 급속도로 진행 중이다. 이는\n                                  산업 구조가 제조 중심에서 서비스 중심으로 변화하면서 서비스산업의 중요성이\n                                  부각되었기 때문이다. 그로 인해 산업 전반에서 서비스 부문의 상대적 위상이\n                                  높아지게 되었다. 해당 인력 수요 또한 증가하고 있는데, 이러한 현상은 기업\n                                  내부에서 서비스에 대한 전략적 중요성이 커졌음을 의미한다.\n\n\n38    Part 1. 왜 서비스디자인인가?\n\f                         가치생산에 영향을 미치는 비중은 현재 공급자로부터 수요자 쪽으로 확대되고\n                         있는 추세이다. IT 기술, 미디어 혁명 등 각종 과학기술의 발전은 사회, 문화,\n                         생활 전 영역에서 수요자의 힘을 강화시키고 있으며 서비스에 대한 기대치는\n                         그 어느 때보다 높다. 미국은 이미 국민총생산의 3분의 1이 지식산업으로부터\n                         창출되고 있다. 더불어 인터넷과 모바일로 대표되는 디지털, 온라인 기술의\n                         등장으로 서비스의 패러다임이 바뀌고 있다. 우리는 모바일 세상에서 디지털\n                         서비스를 시간, 장소의 구애 없이 소비하고 있으며, 이미 물리적인 시장보다\n                         무형의 시장에서 유통되는 서비스가 많아지고 있다.\n\n\n                         우리나라 서비스산업\n33                       우리나라는 OECD 주요국과 비교하 여 서비스 산업의 생산 및 교역 규모,\n2023년 및 중기 경제전망 Ⅲ\n(2022.10) 국회예산정책처 | 경제   노동 생산성 등이 아직은 다소 낮은 수 준에 머물고 있다. 또한 서비스산업\n전망\n                         취업자는 우리나라 전체 취업자의 약 70%를 차지하고 있지만, 도소매, 음식 및\n                         숙박업 등에 고용이 편중되어 있으며 고부가가치 지식기반 서비스산업의 고용\n                         비중은 OECD 주요국 중 하위권을 기록하고 있다.33\n\n\n\n                              국가           2017         2018          2019     2020    2021\n\n                                                                                              (%)\n                              미국           77.0         76.7          77.2     80.1     -\n\n                              영국           70.9         70.9          70.9     72.7    71.6\n\n                              독일           61.8         62.1          62.3     63.3    63.0\n\n                             프랑스           70.3         70.1          70.0     71.2    70.2\n\n                              일본           69.5         69.4          69.4     69.5     -\n\n                            대한민국           54.8         55.7          57.2     57.0    57.0\n\n\n                         [ 서비스산업 GDP 비중 ]\n                         * 부가가치 기준 * 일본, 미국은 2015년 기준\n                         * 자료 : World Bank, 한국은행\n                         * 출처 : 경제활동별 국내총생산(’71~’22), 국가통계포털(KOSIS)\n\n\n\n\n                                                                             서비스·경험디자인 이론서     39\n\f                           GDP 비중 및 노동생산성\n                           우리나라 서비스산업의 전체 GDP 대비 비중(부가가치 기준)은 1980년 47.3%,\n                           2000년 54.4%, 2007년 57.6%, 2016년 59.1%로 꾸준히 성장하고 있으며,\n                           2010년 이후 주요국에 비해 빠르게 성장하면서 2010~2016년 사이의 평균\n                           성장률은 3.1%에 달했다. 그러나 이는 아직 OECD 평균(75.2%)에 비해 낮은\n                           수준으로, 제조업 위주의 산업구조를 보이는 독일(약 69%)과 비교해도 낮은\n                           수치이다.\n\n\n\n\n                           * 부가가치 기준 * 일본, 미국은 2015년까지의 성장률\n                           * 자료 : World Bank, 한국은행\n                           * 출처 : 우리나라 서비스산업의 국제적 위상과 일자리 창출 효과, IIT, 국제무역연구원(2017.10)\n\n\n\n\n                           B. 서비스 경영\n\n34                         서비스 마케팅34\n박용태 외(2012), 《서비스 공학 – 개\n정2판》, pp. 32-33            서비 스 마 케팅 (S e r v i c e M a r ket i n g ) 이라 는 개념이 등 장 하 게 되면 서\n                           경영 학 에 서 도 서비 스 를 다 루 기 시 작 했 다. 최 초 마 케팅 이 론 과 기법 은\n                           농 산물(agricultural products)의 판매를 위해서 생겨났으나, 산업혁명,\n                           공업화가 진행되며 물리적 제품(physical products)인 공 산품의 판매가\n                           마케팅의 중심이 되었다.\n                           서비스 마케팅에 대한 논의가 시작된 것은 50년대 후반에서 60년대 초반\n                           사이이다. 70년대부터 “상품 은 서비스 와 다른 것인가?(Are goods and\n                           services different?)”라는 질문의 내용처럼 서비스 마케팅과 제품 마케팅의\n                           근본적 차이에 대한 논쟁이 시작되면서 70년대 말 서비스 마케팅은 독자적이고\n                           차별적인 분야로 자리 잡게 되었다. 서비스 마케팅 분야는 80년대 중반 이후\n                           양적, 질적으로 급성장하였고, 전통적인 마케팅의 영역에 속하지 않았던 다양한\n                           주제들도 포괄하게 되었다. 대표적으로 서비스 품질이나 고객에 대한 분석 등이\n                           그것이다.\n\n\n\n40   Part 1. 왜 서비스디자인인가?\n\f- 서비스 품질(service quality) : 공산품의 품질과는 본질적으로 다른 측면이\n  많다. 따라서 품질의 정의, 측정하는 방법, 평가하는 기준 등이 달라져야 한다.\n- 고객(customer)에 대한 분석 : 서비스는 제품과 비교하여 고객과의 접촉이\n  훨씬 중요하며, 따라서 고객의 심리와 행위에 대한 연구가 필요하다. 고객과\n  서비스 제공자 간의 상호작용(interaction)을 분석하고 이를 토대로 양자 간의\n  인터페이스(interface)를 설계하는 문제에 대한 연구가 활발히 이루어졌다.\n\n서비스 마케팅은 어느 한 분야만이 아니라 학제간(cross-disciplinary) 연구가\n필요한 특성을 지닌다. 특히 사회심리학, 조직행위론, 인사관리론 등과 같은\n사회과학 분야와 산업공학, 통계학 등과 같은 공학/자연과학 분야가 공동으로\n참여하는 일이 많았다.\n\n\n\n\n서비스 프로세스 관리\n마케팅에 비해서는 다소 늦긴 하지만 산업공학 내부에서 생산 관리(production\nmanagement)에 대한 관심이 고조되면서, 70년대 말부터 80년대 초에는 경영\n차원에서 생산 관리의 분야로 서비스를 다루기 시작하였다. 제조 공정에서만\n이루어지는 좁은 의미의 활동에서 다양한 형태의 공정에서 다양한 종류의\n산출물을 만들어 내는 넓은 의미의 활동으로 확장되었고, 이 ‘다양한 산출물’의\n대상 가운데 하나가 바로 서비스였다. 이에 따라 점차 생산 관리(production\nmanagement)보다 운영 관리(operation management)라 는 용어를\n사용하게 된다. 이 시기에는 서비스 공정인 서비스 시스템(service system)과\n서비스 프로세스(service process)의 설계에 관한 연구가 중심이 되었다.\n\n\n서비스 시스템이나 프로세스를 설계하는 2가지 기본 방식\n- 생산 라인(production line) 방식 : 시스템을 제조 시스템과 비슷하다고\n 가정하며, 공장의 생산 라인과 유사한 방식으로 설계한다. 시스템의 효율성\n 높이기, 서비스 품질의 일관성 확보 등이 주요 목표이다. 고객과의 접촉을\n 최소화하고, 사람보다 기술과 기계를 사용하며, 작업을 잘게 나누어 전문화와\n 표준화를 추구한다.\n\n\n- 서비스 라인(service line) 방식 : 성격과 목적 면에서 제조 공정과 다르다고\n 가정하며, 효율성 보다 고객의 만족도를 높이는 것을 목표로 한다. 또한 주력\n 고객과의 접촉이 중요하다. 고객의 감성을 최대로 만족시킬 수 있는 실내\n 디자인, 전문적 고급 인력의 확보, 신축적인 운영 방식 등을 강조한다.\n\n\n\n\n                                   서비스·경험디자인 이론서     41\n\f                                  서비스 비즈니스\n                                  온라인 서비스의 등장으로 새로운 비즈니스나 서비스 방식이 등장하게 되며\n                                  서비스는 커다란 발전과 성장을 맞이한다. 기존에도 서비스는 비즈니스인 경우가\n                                  많이 있었지만 웹과 인터넷을 통한 전자상거래(E-commerce) 등의 발전으로\n                                  기업과 정부, 기업과 개인, 개인과 개인 거래가 가능하게 되었고 물리적 공간에서\n                                  사람이나 기계가 직접 대면하지 않고도, 즉 시간과 공간의 제약을 받지 않고\n                                  서비스를 주고받을 수 있게 되었다. 또한 상품 대신 정보나 지식을 알려주거나\n                                  연결해주는 서비스만으로도 사업이 가능하게 되었다. 이처럼 시장의 모습도 크게\n                                  바뀌게 되었고, 단순 지원 서비스를 넘어 본격적인 서비스 비즈니스(service\n                                  business) 시대가 도래하게 되었다.\n\n\n                                  서비스 사이언스(Service Science)\n35                                서비스 사이언스는 모든 서비스를 과학의 대상으로 간주하고 과학적 접근법을\n네이버지식백과 “서비스사이언스”\n(https://terms.naver.com/entry.   적용해 서비스의 생산성과 효율성을 높이는 방법을 연구하는 분야로서, 서비스\nnaver?docId=932950&cid=4366\n                                  산업의 운영, 성과, 혁신을 개선하고 생산성을 향상시키기 위해 다양한 분야의\n7&categoryId=43667)\n                                  지식을 수집, 활용하는 다학제적 신학문 분야이다.\n\n                                  2004년 IBM연구소가 주최한 온 디맨드(On Demand) 비즈니스 학술대회에서\n                                  ‘On Demand Business Architecture’에 대한 논의 중 서비스산업의 생산성\n                                  향상을 위한 기업 및 개인의 연구활동 영역을 ‘Service Sciences’로 언급하면서\n                                  서비스 사이언스 분야가 널리 알려지게 되었다. 현재 서비스산업의 규모는\n                                  커졌으나 서비스의 특성상 제조업에 비해 그 효율성이 낮기 때문에 서비스 분야의\n                                  기술혁신(technological innovation)이 중요한 과제가 되었다.35\n\n\n\n                                  서비스 혁신(Service Innovation)\n36                                서비스 혁신은 많은 것을 의미하 는 데 사 용되는데 대표적으 로 ‘서비스나\n위키피디아 “Service innovation”\n(https://en.wikipedia.org/wiki/   서 비 스 제 품 에 있 어 서 의 혁 신 ’, ‘서 비 스 프 로 세 스 에 있 어 서 의 혁 신 ’,\nService_innovation)\n                                  ‘서비스기업·조직·산업에 있어서의 혁신’이 그것이다. 36 핀란드 연구기관인\n                                  TEKES는 서비스 혁신을 ‘실제로 적용되는 새롭거나 상당히 개선된 서비스\n                                  개념’이라 정의했다. 이 새로운 개념에는 새로운 고객 상호 작용 채널, 유통시스템\n                                  또는 기술 개념 또는 이들의 조합 등이 있을 수 있다. 서비스에서 혁신은 반드시\n                                  기술적인 것에 관련된 것은 아니며 종종 비기술적 영역에서 이루어지기도 한다.\n\n\n\n\n42     Part 1. 왜 서비스디자인인가?\n\f서비스 혁신을 생산성의 차원에서 살펴보자면, 서비스 사이언스가 주로 기업\n차원의 비즈니스 문제를 다룬다면 서비스 혁신은 국가 내지 산업 차원의 생산성\n제고 문제에 초점을 맞춘다. 특히 미국, 일본, EU 등의 선진국들과 OECD와 같은\n국제기구가 서비스 혁신을 주도하고 있다.\n\n\n\n                       서비스 혁신의 중요 정책 과제\n\n\n       제조업에 비해 상대적으로 낮은 생산성을 올릴 수 있는 혁신(innovation) 필요\n\n\n       경제체제가 지식기반경제(knowledge-based economy)로 진입함에 따라\n           산업 경쟁력의 원천이 지식서비스(통신, 금융, 디자인 등)로 이동함\n\n\n          사회 서비스(삶의 질과 관련된 교육, 의료, 문화 등)의 중요성 대두됨\n             지식서비스 산업의 확충을 위한 서비스 혁신의 중요성 부각\n\n\n                디지털 컨버전스를 통한 정보통신 서비스의 진화\n\n\n          소극적 방식 : 정보통신 기술을 활용하여 시스템의 효율을 올리는 것\n\n\n    적극적 방식 : 정보통신 기반의 새로운 비즈니스를 창출하여 경제 성장의 동력을 찾는 것\n\n\n             기술융합을 통해 새로운 산업과 영역을 찾아내는 노력 강화\n\n\n[ 서비스 혁신의 중요 정책 과제 ]\n\n\n\n서비스 공학(Service Engineering)\n서비스 공학은 ‘서비스에 관한 이론과 실무를 공학의 접근 방법과 지식 체계에\n맞게 특화시킨 학문’이다. 즉 서비스 사이언스를 공학의 성격과 목적에 맞추어\n특화시킨 것으로 서비스의 생산성을 혁신하기 위한 실무적인 기법과 기술적인\n방식을 제시하는 분야이다. 따라서 서비스 공학은 서비스 사이언스나 서비스\n경영과 비교하여 공학의 관점으로 접근한다.\n\n\n\n\n                                          서비스·경험디자인 이론서   43\n\f                              서비스 공학의 차별성\n\n\n                              - 기술집약적(technology-intensive) 접근 : 서비스 경영과 비교하여 기술적\n                                요소와 기술적 지식을 강조함. 특히 정보통신 기술은 서비스 공학의 기반이\n                                되는 기술.\n                              - 지식집약적(knowledge-intensive) 접근 : 오늘날의 서비스는 전문직\n                                (고임금-고기술) 서비스가 증가하는 추세.\n                              - 과학적(scientific) 접근: 서비스 공학에서는 정성적 통찰력과 함께 정량적\n                                분 석을 필요 로 함. 수학적 모델과 수리적 알고리즘 을 이용하여 최적의\n                                해법(optimal solution)을 찾아야 하는 경우가 많음(경영과학, 컴퓨터 과학,\n                                통계학 등의 이론 활용). 직관적이고 경험적인 접근보다 과학적인 기법으로\n                                분석하고, 체계적인 도구로 모델링하고, 정량적인 기준으로 평가하는 전략을\n                                강조함.\n                              - 공학적(engineering-oriented) 접근 : 서비스 시스템의 규모가 커지고\n                                내용이 복 잡 해지면서 머리와 손만으 로 설계/분 석하 는 것이 어려워짐.\n                                공학에서 사용하는 도구를 사용하여 서비스 시스템을 분석하고 설계하는\n                                접근 필요. 상황의 변화에 따라 기존의 설계도를 신축적으로 수정해야 하는\n                                경우, 여러 개의 프로세스 가운데 최적의 프로세스를 선정하는 작업 등이\n                                이에 해당함.\n\n\n\n                              SSME(Service Science, Management and Engineering)\n\n37                            서비스를 혁신하는 학문 중 서비스 사이언스와 서비스 경영, 서비스 마케팅,\n위키피디아 “Service science,\nmanagement and engineering”   서비스 엔지니어링 등의 학문 을 총 칭해서 SSME라 한다. 이러한 분야 는\n(https://en.wikipedia.org/\nwiki/Service_science,_\n                              생산성과 효율성에 집중한다는 점에서 비슷한 관점을 공유한다.\nmanagement_and_engineering)\n                              SSME는 서비스 시스템의 연구 및 혁신에 대한 학제간 접근방식을 설명하기\n                              위해 IBM에서 처음 도입한 용어이다. 오늘날 SSME는 학계, 산업계 및 정부에\n                              서비스 부문(service sector)에 대해 보다 체계적으로 접근하기를 촉구하고\n                              있다.37\n                              서비스 고도화를 위한 학문이 다양하게 나타나기 전에는 신상품 기획 팀, 마케팅\n                              팀, 디자인 팀 등의 기업 내부조직 또는 외부의 경영 컨설팅 기업이 그 역할을\n                              수행하였다.\n\n\n\n\n44     Part 1. 왜 서비스디자인인가?\n\f                        이렇게 기존의 제조산업을 고도화하는 데 기여했던 경영, 마케팅, 디자인 등의\n                        학문이 오늘날 서비스산업의 중요성이 커짐에 따라 각자의 영역에서 발전하고\n                        있다.\n                        제조산업에서 경영, 마케팅이 디자인과 구별되는 각기 다른 역할을 해 온 것처럼\n                        서비스산업 혁신에 있어 서비스 경영, 서비스 마케팅도 서비스디자인과 다른\n                        차별점을 가지고 있으며 다른 역할을 수행한다.\n\n38\n윤성원(2014), 보이지않는 서비스,         SSME(기존)의 서비스 혁신 방법                     서비스디자인의 차별점\n보이는 디자인\n                                  생산성과 효율성 향상,\n                                 품질 개선에 초점을 두는                      감성, 심리, 경험에 집중하여\n                                  공급자 중심 혁신 방법                          서비스를 설계하는\n                           (예 : 서비스 사이언스, 서비스 엔지니어링,                  수요자 중심의 혁신 방법\n                                서비스 경영, 서비스 마케팅 등)\n\n                        [ 기존 서비스 혁신 방법과 서비스디자인의 차별점38 ]\n\n\n\n\n                        디자인산업 측면\n                        우리나라 전체 디자인산업 규모는 2000년대 경제의 발전과 함께 지속적으로\n                        증가해 왔다.\n\n\n\n\n                              2004   6.2\n                              2010   7.1\n                              2013   13.07\n                              2014   14.37\n                              2015   15.63\n                              2016   16.91\n                              2017   17.55\n                              2018   17.86\n                              2019   18.29\n                              2020   19.42\n                              2021   21.63\n                              2022   20.87\n                        * 2013년 일반업체 조사대상의 확대로 해석상 유의 필요\n                          - 2004년 일반업체 대상 업종 : 제조업, 건설업, 사업 서비스업\n                          - 2010년 일반업체 대상 업종 : 제조업, 건설업, 출판/영상/방송통신 및 정보 서비스업, 전문/과학 및 기술 서비스업,\n                            사업 시설 관리 및 사업 지원 서비스업\n                          - 2013년 디자인 산업 분류 도입으로 디자인 활용 업체 업종 대폭 확대\n                        * 출처 : 2023 디자인산업통계 총괄/요약보고서(2022년 기준), 한국디자인진흥원\n\n\n\n\n                                                                         서비스·경험디자인 이론서            45\n\f39                           디자 인산 업통계조 사 (2020년, 아래 표 참조) 를 바탕으 로 디자 인 산 업을\n2023 디자인산업통계 총괄/요약\n보고서(2022년 기준), 한국디자인         살펴보면 규모적으로는 '제품 디자인'이 가장 크고, 다음은 '디자인 인프라',\n진흥원 (https://www.designdb.\ncom/)                        '서비스/경험디자인', '공간디자인' 순으로 나타난다.39\n\n\n\n                                         2021년                                2022년\n                                                                                                      전년대비\n             구분              디자인 활용      평균 디자인                  디자인 활용      평균 디자인\n                                                     산업규모                                산업규모         증감률\n                              업체 수        투자금액                    업체 수
