2. 게이즈 플롯(gaze plot): 시선 이동 순서와 경로를 선과 원으로 연결한 도표로, 시선이 멈춘 지점은 원으로, 이동 과정은 선으로 표시하며 원 안의 번호로 정보 탐색 흐름을 추적한다.`,same:["아이트래킹","안구 운동 측정"],similar:[],related:["관심 영역(AOI)","아이트래커","히트맵","게이즈 플롯","f-패턴","시각적 위계","첫 응시 시간(TTFF)"]},{id:140,ko:"시놉시스",en:"Synopsis",initial:"ㅅ",definition:"사용자가 제품이나 시스템과 주고받는 상호작용의 흐름을 서사적 구조로 압축한 시나리오 초안.",description:"본격적인 설계에 앞서 상호작용의 주요 흐름과 맥락(context)을 간결하게 정리한 결과물로, 제작자와 이해관계자(stakeholder) 사이의 인식을 조율하는 소통 수단이자 프로젝트 방향에 관한 의사결정을 지원하는 도구로 기능한다. 세부 설계 이전 단계에서 시나리오의 핵심 구조를 공유함으로써 방향성을 확인하고 이후 상세 시나리오 작성의 준거로 활용된다.",same:["사용자 시나리오 초안"],similar:["스토리보드"],related:["내러티브","퍼소나"]},{id:141,ko:"실증적 연구",en:"Empirical research",initial:"ㅅ",definition:"이론적 추론을 넘어 관찰이나 실험 등 경험적 증거로 대상을 검증하는 과학적 연구 방법론.",description:"현장에서 데이터를 수집하고 분석하는 과정을 수반하며, 가설(hypothesis)을 현실 증거로 검증해 지식을 확장하고 실질적 문제 해결의 근거를 마련한다. 사용자 삶의 맥락(context)이나 서비스 접점(touchpoint)에서 발생하는 사건을 관찰하고 실험해 객관적 증거를 확보하는 데 집중한다. 검증된 절차를 통해 타당성과 신뢰성을 확보함으로써 결과의 설득력을 높이며, 데이터 성격에 따라 수치화된 데이터를 다루는 정량 방식과 대상의 의미를 해석하는 정성 방식으로 구분되며, 두 방식을 병행하는 혼합 방식으로 수행되기도 한다.",same:["경험적 연구"],similar:["현장 기반 연구","근거 기반 연구","실험 연구","가설 검증 연구"],related:["정량적 연구","정성적 연구","객관성","재현 가능성","데이터 분석","가설 검증","타당성과 신뢰성"]},{id:142,ko:"심층 면접",en:"In-depth interview",initial:"ㅅ",definition:"연구자와 참여자가 직접 소통하며 맥락(context)을 파악하고 내면의 심리, 태도, 욕구, 동기를 심층적으로 탐색하는 정성 조사 기법.",description:"반구조화 형식을 취하며 피면접자와 신뢰 관계를 구축하는 라포(rapport) 형성이 수반된다. 개방형 질문으로 시작해 주제를 좁혀가는 구조를 활용하는 동시에 답변에 대한 추가 질문을 이어가며 경험(experience)에 기반한 진술을 도출한다. 언어적 응답뿐만 아니라 제스처, 표정, 어조 같은 비언어적 행동을 관찰해 정서와 반응을 분석한다.",same:["심층 인터뷰"],similar:["정성 면접","반구조화 면접","내러티브 면접"],related:["포커스 그룹 면접(FGI)","에스노그라피","맥락적 면접","프로빙"]},{id:143,ko:"아이데이션",en:"Ideation",initial:"ㅇ",definition:"발상을 자유롭게 생성하고 발전시키는 창의적 사고 활동.",description:"아이디어와 행동을 결합한 용어로 단순한 구상을 해결책으로 발전시키는 과정이다. 과제를 해결하거나 가치를 발견하고자 발상을 생성하는 데 목적을 두며, 브레인스토밍(brainstorming) 같은 기법으로 의견을 나누며 형상화한다. 대안 가운데 타당한 안을 선정해 방향성을 확립한다.",same:["아이디어 발상"],similar:["브레인스토밍","확산적 사고","수평적 사고","창의적 문제 해결"],related:["아이디어 발상법","아이디어 워크숍","HMW 질문","아이디어 스케치","유추"]},{id:144,ko:"아이스브레이킹",en:"Icebreaking",initial:"ㅇ",definition:"집단 활동의 도입부에서 참여자 간의 어색함과 사회적 긴장을 해소하고 상호작용을 촉진하기 위해 수행하는 기법.",description:"얼음을 깨뜨린다'는 의미와 같이 굳어 있는 분위기를 편안하게 전환해 생산적인 그룹 토의와 발상을 위한 심리적으로 안전한 환경을 조성한다. 참여자 사이의 신뢰와 라포(rapport)를 형성해 연결감을 부여하고 발언을 주저하는 구성원의 참여를 촉진하는 동시에 집단 역동을 활성화한다. 구성원의 활기를 높이고 과업에 대한 공동 집중과 정보 교환을 끌어냄으로써 협업(collaboration)의 질을 높이는 바탕이 된다.",same:[],similar:["오프닝 세션","워밍업"],related:["공동디자인 워크숍","라포 형성","퍼실리테이션","심리적 안전감"]},{id:145,ko:"암묵적 요구",en:"Implicit needs",initial:"ㅇ",definition:"언어로 직접 표현되지 않지만, 내면에 실재하는 생각, 느낌, 행동 양식으로 이루어진 심층적인 욕구.",description:`스스로 인지하고 있으나 언어화하기 어려운 영역에 존재하며 직접적인 질문보다는 은유와 이미지를 활용해 단서를 수집한다. 무의식에 내포된 정서를 탐색하는 ZMET¹이나 일상을 기록하는 컬처럴 프로브를 활용해 내면의 의미를 발굴한다. 요구 자체를 인지하지 못하는 잠재적 요구(latent needs)와 달리 현재 경험(experience) 속에 실재하면서도 발화되지 않은 상태를 의미하며 차별화된 가치 제안의 근거로 활용된다. 

각주
1. ZMET: 하버드 경영대학원의 잘트먼(Zaltman) 교수가 개발한 정성적 연구 방법으로, 시각적 은유와 이미지를 활용해 무의식에 내포된 욕구와 정서를 탐색한다.`,same:["암묵적 니즈","내재적 요구"],similar:["무의식적 요구","비언어적 요구","심층 욕구"],related:["맥락적 조사","관찰 조사","행동 단서","섀도잉","에스노그라피"]},{id:146,ko:"애자일 개발",en:"Agile development",initial:"ㅇ",definition:"사용자 피드백을 바탕으로 짧은 주기의 반복 개발과 테스트를 수행하며 변화에 유연하게 대응하고 점진적으로 완성도를 높이는 프로젝트 관리 방법.",description:`전통적인 폭포수 모델¹과 달리 적응성과 협업을 중시하며, 작업을 백로그²로 관리하고 우선순위에 따라 스프린트³ 주기 동안 개발을 수행한다. 팀 중심 문화를 바탕으로 상황을 공유하며 주기적인 회고를 거쳐 프로세스를 개선한다.

각주
1. 폭포수 모델(waterfall model): 요구사항 분석 → 설계 → 개발 → 테스트 → 배포의 단계를 차례대로 진행하는 선형적 소프트웨어 개발 방법론이다. 각 단계가 완전히 완료된 후에야 다음 단계로 넘어가는 비반복적 구조로 초기 요구사항이 명확하고 변경 가능성이 낮은 프로젝트에 적합하다.
2. 백로그(backlog): 개발해야 할 기능, 작업, 요구사항을 우선순위에 따라 정렬한 목록이다. 스크럼 프레임워크에서는 제품 전체의 요구사항을 담은 제품 백로그와 각 스프린트에서 수행할 작업을 추출한 스프린트 백로그로 구분된다.
3. 스프린트(sprint): 애자일 개발에서 사용하는 반복적인 짧은 개발 주기로, 일반적으로 1~4주 단위로 설정한다. 각 스프린트는 계획 → 실행 → 검토 → 회고의 4단계로 구성되며, 해당 기간 내에 동작할 수 있는 결과물을 산출하는 것을 목표로 한다.`,same:[],similar:["린 UX","스크럼(Scrum)"],related:["폭포수 모델","스프린트","백로그"]},{id:147,ko:"어포던스",en:"Affordance",initial:"ㅇ",definition:"사물이나 시스템이 지닌 특성을 통해 사용자가 취할 수 있는 행동을 지각하게 하는 성질.",description:"깁슨(Gibson)이 제시한 뒤 노먼(Norman)이 디자인 영역으로 확장해 체계화한 개념으로 물리적 형태와 시각적 요소를 통해 가능한 행위에 대한 직관적 단서를 제공한다. 별도의 학습 없이도 대상을 마주하는 순간 기능을 파악하고 상호작용할 수 있도록 하며, 디자인 단계에 반영해 오류를 방지하고 사용성을 높인다. 사용자와 대상 사이의 간극을 메우고 의도한 행위를 전달하는 소통 기제로 기능한다.",same:["행동 유도성"],similar:["직관적 유도","기표","디자인 메타포","시각적 단서"],related:["가시성","일관성","피드백","멘탈 모델","안티 어포던스"]},{id:148,ko:"에스노그라피",en:"Ethnography",initial:"ㅇ",definition:"대상자의 환경과 현장에서 행동, 경험, 상호작용을 관찰하고 기록함으로써 내부자 관점에서 문화적 맥락(context)에 내재한 잠재적 요구(latent needs)와 인사이트를 도출하는 연구 방법.",description:"문화인류학에서 유래한 현장 조사 방법론으로 연구자가 대상 집단의 문화적 의미 체계를 내부자 관점에서 해석하는 것을 핵심으로 삼는다. 대상자의 라이프스타일과 가치관을 이해하기 위해 물리적 환경과 디지털 공간에서 경험(experience)을 공유하거나 비디오, 모바일 기기를 활용해 관찰 기록을 수집하며 동기, 감정, 행동 패턴을 분석한다. 수집된 데이터는 대상자의 숨겨진 의도를 발견하고 디자인 기회를 발굴하며 해결 과제를 정의하는 데 활용된다.",same:["민족지학","문화기술지"],similar:["모바일 에스노그라피","비디오 에스노그라피","넷노그라피"],related:["맥락적 조사","심층 관찰","현장 관찰"]},{id:149,ko:"엑셀러레이터",en:"Accelerator",initial:"ㅇ",definition:"초기 스타트업의 성장을 가속화하고자 유망 기업을 선발해 멘토링, 교육, 투자를 연계 지원하는 프로그램.",description:`공간 제공 중심의 인큐베이터와 달리 프로그램 설계와 운영을 통해 성과를 도출하는 데 목적을 두며, 소액 자금 지원과 지분 투자를 연계해 투자자와 스타트업 사이의 연결자 역할을 수행한다. 딜 플로우¹ 확보를 통해 투자 시장에 활력을 제공한다. 참여 기업은 피드백과 학습을 거쳐 비즈니스 모델(business model)을 검증하고 프로그램 종료 후에도 네트워크를 유지한다.

각주
1. 딜 플로우(deal flow): 투자자에게 유입되는 검토 가능한 투자 제안이나 기업 발굴의 흐름을 지칭하며, 확보 수준에 따라 우수한 스타트업에 투자할 기회가 결정되므로 역량을 평가하는 지표로 활용된다.`,same:[],similar:["인큐베이터"],related:["벤처 캐피털(VC)","엔젤 투자자","시드 투자","피벗"]},{id:150,ko:"역할놀이",en:"Role-playing",initial:"ㅇ",definition:"제공 경험(experience)의 특정 상황을 설정해 참여자가 가상 인물을 맡아 발화 및 행동하며 직접 체험하는 실연 기법.",description:`상황에 따라 서비스 스테이징¹,  바디스토밍(bodystorming) 등 기법을 접목해 활용한다. 가상 인물을 기반으로 상황에 몰입하고 상호작용을 나누어 대상자에 대한 공감대를 형성한다. 데스크톱 워크스루²부터 환경을 구축한 연극 형태 리허설까지 여러 방식으로 수행한다. 이해관계자(stakeholder)가 대상자 관점에서 직접 체험하고 평가함으로써 잠재 문제를 조기 발견하고 제공 흐름을 검증한다.

각주
1. 서비스 스테이징(service staging): 실제 환경을 연출해 가구 배치, 동선, 환경 요소가 가치 전달에 미치는 영향을 점검하는 기법이다.
2. 데스크톱 워크스루(desktop walkthrough): 축소 모형 등을 활용해 복합적인 과정을 단계적으로 검토하는 기법이다.`,same:["롤플레잉","역할연기","역할극"],similar:["경험 시뮬레이션","경험 프로토타이핑","서비스 역할극"],related:["스토리보드","서비스 시나리오"]},{id:151,ko:"예비 조사",en:"Pilot test",initial:"ㅇ",definition:"소규모로 연구 설계나 서비스 프로토타입(prototype)을 사전 점검하는 시험 과정.",description:`[1] 학문적 활용: 면접(interview)이나 설문조사(survey) 등, 본격적인 연구 수행 전 소수의 참여자를 대상으로 연구 설계, 절차, 도구 등을 사전에 검증함으로써 연구의 시간과 자원 낭비를 줄인다.
[2] 프로젝트 활용: 베타 서비스나 내부 테스트 형태로 진행되며 사용성 평가(usability evaluation)와 시장 수용도 검증을 목적으로 한다. 참여자의 피드백과 실시간 모니터링을 통해 예외 사례를 발견하고 본격 실행을 위한 개선 근거를 마련한다.`,same:[],similar:["타당성 검토","알파 테스트","베타 테스트","목업 테스트"],related:["신뢰도 및 타당도 분석","사용성 평가","프로토타입"]},{id:152,ko:"온보딩",en:"Onboarding",initial:"ㅇ",definition:"신규 사용자가 서비스 가치를 이해하고 목표를 달성하도록 초기 진입 경험을 디자인하고 지원하는 과정.",description:"가치를 인지하고 지속적으로 참여하도록 흐름, 메시지, 상호작용 전략을 디자인하는 활동이다. 퍼소나(persona)와 시나리오를 설정하고 여정 지도를 통해 행동과 감정 변화를 분석하며 기능 안내를 넘어 경험 흐름을 형성한다. 정보 과부하를 줄이고 성취감을 제공하며 이탈을 방지하고 지속적 관계를 구축하는 바탕이 된다.",same:[],similar:["튜토리얼","워크스루"],related:["가입 절차","개인화","단계적 정보 공개"]},{id:153,ko:"옴니채널 서비스",en:"Omni-channel service",initial:"ㅇ",definition:"온라인과 오프라인의 모든 접점(touchpoint)을 통합하여 사용자의 맥락(context)과 데이터가 끊김이 없이 이어지도록 디자인함으로써 단일한 브랜드 경험을 제공하는 전사적 서비스 체계.",description:"채널 전반의 데이터를 통합하고 접점(touchpoint)별 경험을 일관되게 설계하는 것을 전제로 하며, 이용자 여정에 따라 이용 이력과 선호를 실시간으로 반영하는 데 중점을 둔다. 개별 채널을 병렬적으로 운영하는 단계를 넘어 각 접점이 상호 보완을 하는 구조를 구축한다.",same:["통합 채널 서비스"],similar:["멀티채널","크로스채널","O2O(Online to Offline)","O4O(Online for Offline)"],related:["심리스 경험","일관성","접점 관리"]},{id:154,ko:"요구",en:"Needs",initial:"ㅇ",definition:"대상자가 특정 목적을 달성하고자 행동을 유발하는 근본적 동기이자 결핍 상태로 겉으로 드러난 표면적 차원부터 인지하지 못하는 잠재적 차원까지 포괄하는 개념.",description:"서비스디자인(service design) 관점에서는 대상자의 인지(cognition) 및 발화 여부에 따라 언어로 표현되는 명시적 차원, 당연하게 여겨져 겉으로 드러나지 않는 암묵적 차원, 본인조차 인지하지 못하는 잠재적 차원으로 구분한다.",same:["니즈"],similar:["욕구","원츠","페인 포인트","결핍","기대"],related:["사용자 조사","매슬로우의 욕구 단계 이론","인사이트","가치 제안"]},{id:155,ko:"웨이파인딩",en:"Wayfinding",initial:"ㅇ",definition:"장소의 특성과 상황적 맥락(context)을 반영한 단서를 활용해 현재 위치를 인식하고 목적지까지의 경로를 탐색하는 인지적 의사결정 과정.",description:"안내 표지물과 지도뿐만 아니라 지형, 조명, 건축적 특징 등 다양한 요소를 유기적으로 연계해 공간의 방향 단서를 제공하고 심리적 안정감을 부여한다. 물리적 환경과 인지 능력을 연결해 이동을 지원하고 공간 기능을 향상하는 디자인의 바탕이 된다.",same:["길찾기"],similar:["경로 탐색","사인 시스템","내비게이션"],related:["정보디자인","랜드마크","경로","결절점","구역","심적 지도","심리적 안정감"]},{id:156,ko:"유니버설 디자인",en:"Universal design",initial:"ㅇ",definition:"연령, 국적, 신체 조건에 관계없이 누구나 편리하고 안전하게 이용할 수 있도록 보편적으로 디자인하는 접근 방식.",description:"로널드 메이스(Mace)가 1985년 체계화한 개념으로 특정 대상을 위해 물리적 장벽을 제거하는 무장애 디자인을 넘어 제품, 건축물, 서비스 전반에서 발생하는 불편함을 최소화하는 데 주력한다. 모든 이용자를 디자인의 기본 전제로 삼아 존엄성을 존중하는 실천 방법으로 기능한다.",same:["모두를 위한 디자인","보편적 디자인"],similar:["무장애 디자인","포용적 디자인"],related:["유니버설 디자인 7대 원칙","디지털 유니버설 디자인","어포던스","보조 공학","인간 존엄성"]},{id:157,ko:"유용성",en:"Usefulness",initial:"ㅇ",definition:"제품이나 서비스를 통해 목적을 달성하고 문제를 해결하는 기능적 편익으로 사용자의 요구(needs)를 충족시켜 실질적인 가치를 제공하는 속성.",description:"의도한 목표를 완수할 수 있는지를 나타내는 척도로서, 명시적 요구(explicit needs)·잠재적 요구(latent needs)의 충족 정도로 판단한다. 조작의 용이성을 다루는 사용성(usability)과 구분되며 기능의 적합성과 목적 부합성을 평가하는 준거로 기능한다. 약속한 혜택에 부합하는 디자인 기능을 제공하여 제품의 가치를 형성하는 토대가 된다.",same:[],similar:["효용성","실용성","목적 부합성"],related:["사용성","기능 적합성","가치제안","요구(니즈) 충족","문제 해결"]},{id:158,ko:"이니셔티브",en:"Initiative",initial:"ㅇ",definition:"사회 문제 해결을 위해 다양한 이해관계자(stakeholder)가 주도적으로 참여하여 협력적 디자인 과정을 통해 공공 혁신을 이끄는 실천 전략.",description:"아이디어를 제안하는 단계를 넘어 실행 방안을 계획하고 추진하며, 정책, 서비스, 지역사회 전반에 걸친 긍정적 변화를 목표로 한다. 실행 과정에서 구성원이 주체적으로 문제를 해결하는 역량을 기르며, 수동적 수용자가 아닌 능동적 변화 주체로서 사회적 가치를 형성한다.",same:[],similar:["추진 과제","주도적 실행","주도권"],related:["오너십","거버넌스","우선순위","리빙 랩","시민 주도 과제","사회적 디자인","공공 서비스 혁신"]},{id:159,ko:"이미지 기반 면접",en:"Image-based interview",initial:"ㅇ",definition:"시각 자료를 매개로 대상자의 기억 회상을 돕고 언어로 표현하기 어려운 잠재적 요구(latent needs)와 감정을 도출하는 면접 기법.",description:"언어 중심 조사의 한계를 보완하고자 활용하는 방법으로, 제시된 시각 자료는 기억을 자극하여 과거 상황을 선명하게 떠올리도록 돕는다. 복잡한 경험(experience)을 설명하기 어려워하는 참여자가 방어적 태도를 낮추고 내면의 상태를 드러내도록 지원한다. 시각적 매개체는 대상자의 흥미를 유발하고 주제의 초점을 유지해 피로도를 낮추며, 연구자와 대상자 간 소통의 오해를 줄여 심층적인 경험 데이터를 수집하는 데 기여한다.",same:["이미지 기반 인터뷰","시각적 면접"],similar:["무드보드 면접","사진 투영 면접"],related:["콜라주","투사 기법","시각적 자극물"]},{id:160,ko:"이해관계자",en:"Stakeholder",initial:"ㅇ",definition:"서비스나 프로젝트 전 과정에 직간접적으로 관여하며 상호 영향을 주고받는 모든 내외부 개인과 조직.",description:"고객과 서비스 제공 직원을 비롯해 관리자, 협력 파트너, 관련 기관 등 다양한 주체를 포괄하며, 각기 다른 요구와 관점을 지니고 상충하는 가치와 이해를 내포한다. 이들 간의 다층적 관계는 총체적 관점에서 문제를 진단하고 지속 가능한 서비스 생태계(service ecosystem)를 구축하는 데에 토대가 된다.",same:[],similar:["사용자","고객","파트너","관련 주체"],related:["이해관계자 지도","의사결정자","수혜자","가치 교환"]},{id:161,ko:"이해관계자 지도",en:"Stakeholder map",initial:"ㅇ",definition:"서비스나 프로젝트에 관여하는 모든 주체를 식별하고 이들 간 상호작용 구조와 가치 교환 관계를 파악하여 시각화할 수 있는 도구.",description:"관련 주체를 1, 2차로 분류하고 영향력과 중요도를 준거로 배치하며, 참여자 간 역할, 관계, 가치 흐름을 연결한 도식이다. 전체 시스템과 서비스 맥락(context) 분석하고 숨겨진 참여자를 발견하며, 상충하는 요구의 조정 및 의사결정 구조를 파악하기 위한 근거로 활용된다.",same:["이해관계자 맵"],similar:["액터 네트워크 지도","생태계 지도"],related:["서비스 시스템 지도","서비스 생태계 지도"]},{id:162,ko:"인간 중심 디자인",en:"Human-centered design",initial:"ㅇ",definition:"디자인 대상이 되는 인간의 행동 패턴, 상황적 맥락(context), 잠재 욕구를 깊이 이해하는 것을 출발점으로 삼아 최적의 해결안을 도출하는 접근 방식.",description:"조작 편의성 중심의 사용자 경험 기획을 넘어 복잡한 시스템 속에서 인간에게 유효한 가치를 제공하도록 디자인한다. 인간의 요구(needs)를 바탕으로 기술 구현 가능성, 사업 목표, 지속 가능성을 균형 있게 조율하며, 문제 정의부터 해결안 도출에 이르는 전 과정을 아우르는 방법론으로 활용된다.",same:["HCD"],similar:["사용자 중심 디자인"],related:["디자인사고","공감 디자인","경험디자인","어포던스","인지적 부하"]},{id:163,ko:"인지",en:"Cognition",initial:"ㅇ",definition:"환경과의 상호작용을 통해 외부 자극을 받아들여 유의미한 정보로 변환하고 처리하는 일련의 정신적 과정.",description:"기억, 사고, 정서가 결합한 고차원적 마음의 작용을 포괄하며, 뇌에서 외부 세계에 대한 내적 표상을 형성함으로써 상황을 해석하고 정보를 분석, 판단하며 문제를 해결하는 복합적인 정보 처리 체계로 기능한다.",same:[],similar:["주의 집중","지각","식별","인식"],related:["멘탈 모델","인지적 처리","직관","인지적 매핑","인지 부하","스키마","작업 기억","어포던스"]},{id:164,ko:"인지 부하",en:"Cognitive load",initial:"ㅇ",definition:"대상자가 정보를 습득하거나 과제를 수행할 때 작업 기억에 가해지는 정신적 노력의 총량.",description:"과제 자체의 복잡성과 난이도에서 비롯되는 내재적 부하, 불필요한 인터페이스 구조나 정보 설계에서 발생하는 외재적 부하, 학습 과정에서 장기 기억 형성을 촉진하는 본유적 부하로 구분된다. 디자이너는 내재적 부하를 고려해 과제의 복잡성을 적정 수준으로 조율하고, 외재적 부하를 낮추고 본유적 부하를 높이는 방향으로 인터페이스와 정보 구조를 설계하며, 서비스 성격에 맞춰 전체 부하량을 조절함으로써 대상자의 피로도를 낮추고 원활한 목표 달성을 지원한다.",same:[],similar:["작업 기억 부하","정보 과부하","인지적 마찰","사용 피로도"],related:["내재적 인지 부하","외재적 인지 부하","본유적 인지 부하","작업 기억"]},{id:165,ko:"인지 심리",en:"Cognitive psychology",initial:"ㅇ",definition:"지각, 기억, 사고, 판단 등 정신 활동의 원리를 탐구하는 분야.",description:"외부 환경에서 유입되는 자극을 해석해 유의미한 정보로 변환하는 과정과 이를 내적 표상으로 저장하고 인출해 과제 수행에 활용하는 메커니즘을 분석한다. 초기의 정보처리 패러다임에서 출발해 신체, 환경, 사회적 맥락과의 상호작용을 강조하는 체화 인지 등으로 연구 범위가 확장되었다.",same:[],similar:["인지 과학","정보처리 이론","인지론적 관점"],related:["인간-컴퓨터 상호작용(HCI)","행동 심리학","지각 심리학","환경 심리학","인지 공학","멘탈 모델"]},{id:166,ko:"인지 평가 이론",en:"Cognitive evaluation theory",initial:"ㅇ",definition:"외부 자극을 통제적 또는 정보적 요인으로 인식함에 따라 자기 결정감과 내재적 동기가 변화하는 원리를 설명하는 심리학 이론.",description:"데시와 라이언(Deci & Ryan)이 제안한 이론으로, 외부 자극이 행동을 제약하는 통제적 요인으로 작용하는지, 능력을 확인하는 정보적 요인으로 작용하는지에 따라 심리적 반응이 달라진다는 점에 주목한다. 특정 보상이나 환경이 행동을 강요하는 통제 수단으로 인식되면 외적 인과성이 높아져 자기 결정감이 낮아지고 참여 동기가 약해진다. 반면 자신의 유능감을 확인하는 정보적 요인으로 수용하면 내적 인과성이 강화되어 내재적 동기가 촉진된다.",same:[],similar:["자기 결정 이론(SDT)","내재적 동기 이론"],related:["자율성","유능감","구축 효과"]},{id:167,ko:"인지적 공감",en:"Cognitive empathy",initial:"ㅇ",definition:"타인의 관점에서 심리 상태를 파악하고 이해하여 의도와 행동을 예측하는 능력.",description:"정서적 동화보다 대상의 상황을 분석하고 파악하는 과정에 집중하며 상대방 관점에서 사고 흐름과 의도를 유추해 나타날 반응을 예측한다. 자신의 정서적 반응을 유보하고 사용자 행동을 이해하는 준거로 기능하며, 상호작용 체계 설계와 사용자 모델링의 토대가 된다.",same:[],similar:["관점 수용"],related:["정서적 공감","사회적 지능","멘탈 모델","사용자 모델링"]},{id:168,ko:"인지적 어포던스",en:"Cognitive affordance",initial:"ㅇ",definition:"서비스 환경 내 대상의 기능과 조작 방식을 파악하고 판단하도록 돕는 지각적 단서이자 디자인 특성.",description:"버튼, 라벨, 픽토그램 같은 상징 정보를 활용해 목적과 의미를 전달하며 형태나 구조가 암시하는 바를 통해 오류 없이 행동을 이어가도록 안내한다. 인지 부하(cognitive load)를 줄이고 사용자와 시스템 간 상호작용 과정에서 발생할 수 있는 혼란을 방지하는 구조적 장치로 기능한다.",same:["인지적 행동 유도성"],similar:["디자인 메타포","지각된 어포던스"],related:["사용자 인터페이스(UI) 패턴","레이블링","시각적 위계","기표"]},{id:169,ko:"인터랙션",en:"Interaction",initial:"ㅇ",definition:"제품이나 서비스와 행동 및 반응을 주고받는 양방향 소통 과정.",description:"인간과 인간, 또는 인간과 시스템 간 상호작용을 포괄하며, 물리적, 디지털 인터페이스와 서비스 접점(touchpoint)을 매개로 시간 흐름에 따라 연속적으로 전개된다. 축적될 때 유의미한 경험(experience)이 되며, 긍정적인 서비스 경험을 구축하는 토대로 기능한다.",same:["상호작용"],similar:["인터랙티브","반응성"],related:["사용성","피드백","피드포워드","어포던스","제스처 인터랙션","터치 인터랙션","마이크로 인터랙션"]},{id:170,ko:"인터랙션디자인",en:"Interaction design",initial:"ㅇ",definition:"사람과 시스템 사이에서 발생하는 교류 과정과 행동 양식을 기획해 사용자와 시스템을 연결하는 디자인 분야.",description:"사용 맥락(context)과 환경에 맞춰 인터페이스와 서비스 접점(touchpoint)을 디자인하며 기능 구현을 넘어 유의미한 경험(experience)을 전달해 사용자와 시스템 간 지속적 관계를 형성한다. 가시적 결과물과 함께 교류 조건을 규정하고 개발하는 구조적 방법론을 포괄한다.",same:["상호작용 디자인","인터랙션디자인(IxD)"],similar:["행동디자인","사용자인터페이스(UI)디자인","사용자경험(UX)디자인"],related:["어포던스","피드백","피드포워드","멘탈 모델","마이크로 인터랙션","인간-컴퓨터 상호작용(HCI)"]},{id:171,ko:"인터랙티브 디자인",en:"Interactive design",initial:"ㅇ",definition:"디지털 기술을 활용해 행동과 감각에 반응하는 몰입감 있는 매체 환경을 구축하는 경험디자인(experience design) 방식.",description:"시스템의 기능적 효율성보다 콘텐츠 전달 과정에서 일어나는 심미적 체험과 감성적 소통에 비중을 두며, 공간이나 제품에 시청각 요소를 배치해 이용자가 관찰자에 머무르지 않고 행동에 참여하도록 한다. 움직임이나 소리에 반응해 변화하는 자극을 통해 몰입감을 형성한다.",same:[],similar:["인터랙션디자인","몰입형 디자인","뉴미디어 디자인"],related:["실시간 반응성","피드백 루프","능동적 참여","생성형 디자인","피지컬 컴퓨팅"]},{id:172,ko:"잠재적 요구",en:"Latent needs",initial:"ㅈ",definition:"이용자가 스스로 인식하지 못하다가 적절한 해결책이 제시되었을 때 비로소 자각하게 되는 드러나지 않은 요구",description:"필요한 요구의 존재를 알고 있으나 표현하지 않는 암묵적 요구(implicit needs)와 달리 이용자 스스로 무엇이 필요한지조차 인식하지 못하는 요구 유형이다. 일상적 행동과 맥락(context)을 직접 관찰하고 분석하는 탐구 과정이나, 이용자가 직접 제작하고 표현에 참여하는 공동 창출(co-creation) 기반의 제너레이티브 세션 같은 기법을 통해 발굴할 수 있다. 표면적으로 드러나지 않은 문제를 선제적으로 해결해 서비스 혁신의 기회로 기능한다.",same:["미인지 니즈"],similar:["잠재 욕구"],related:["투사적 기법","맥락적 면접","참여형 디자인","생성적 도구","프로브"]},{id:173,ko:"접점",en:"Touchpoint",initial:"ㅈ",definition:"고객이 서비스 여정에서 상호작용을 하게 되는 모든 물리적, 디지털적, 인적 요소.",description:"서비스 여정 전반에 걸쳐 시간의 흐름에 따라 이용자가 마주치는 모든 요소로, 특정 공간과 채널에서 추상적인 가치를 제품, 정보, 사람, 환경과 같은 구체적인 증거로 변환해 이용자에게 전달되는 매개로 기능한다. 이러한 상호작용의 순간들이 모여 총체적인 서비스 경험의 질과 가치를 결정하며, 고객 여정 지도(customer journey map)를 구성하는 기본 단위가 된다.",same:[],similar:["상호작용 지점","서비스 증거","진실의 순간(MOT)"],related:["서비스 채널","고객 여정 지도","서비스 청사진","인터페이스"]},{id:174,ko:"전방 영역",en:"Front stage",initial:"ㅈ",definition:"서비스 청사진(service blueprint)의 가시선(line of visibility) 위쪽에 위치해 제공자와 고객 간 교류가 발생하며 서비스 경험이 구축되는 가시적 접점(touchpoint) 환경.",description:`시각적으로 노출되는 모든 서비스 접점(touchpoint)과 물리적 증거¹를 포괄하는 무대를 뜻하며 일선 직원과 고객이 대면해 상호작용을 하는 서비스 프로세스의 최전선으로 기능한다. 시간 흐름에 따라 제공자와 고객의 행동이 연동되며 서비스 경험을 형성한다. 

각주 
1. 물리적 증거(physical evidence): 고객이 서비스 여정 단계마다 상호작용을 하는 모든 시각적, 물리적 접점 요소를 지칭한다. 무형의 서비스 품질을 가시적으로 인지하게 하는 매개체로, 매장 환경, 웹·앱 화면, 유니폼, 영수증 등이 해당하며 서비스 청사진의 최상단 영역에 도식화된다.`,same:["고객 접점 영역","전면 무대","가시 영역"],similar:[],related:["서비스 청사진","후방 영역","물리적 증거","상호작용선"]},{id:175,ko:"정규화",en:"Normalization",initial:"ㅈ",definition:"수집한 데이터의 중복을 배제해 구조를 정비하거나 값의 범위를 통일해 분석에 적합한 상태로 가공하는 전처리 과정.",description:"데이터베이스 설계 측면에서는 속성 간 종속 관계를 분석해 중복을 제거하고 데이터 간 논리적 연결성을 강화해 무결성을 유지한다. 데이터 분석 및 기계 학습 측면에서는 서로 다른 단위를 가진 변수의 범위를 재조정해 모델 성능과 분석 신뢰도를 높인다. 서비스·경험디자인에서는 이용자 행동 데이터, 설문 응답, 로그 데이터 등 이질적인 출처의 데이터를 통합 분석할 때 비교 가능한 형태로 전환하는 데 활용된다.",same:[],similar:["표준화","규격화","최적화","단순화","데이터 정제"],related:["DB 정규화","정보 구조화","데이터 스케일링","중복 제거","데이터 무결성"]},{id:176,ko:"정량적 연구",en:"Quantitative research",initial:"ㅈ",definition:"대상의 행동과 태도를 수치화된 데이터와 통계 기법으로 측정해 현상의 규모와 패턴을 파악하는 실증적 조사 방법.",description:"현상 이면을 탐구하는 정성적 연구(qualitative research)와 달리 대규모 표본을 바탕으로 설문(survey), 실험, 로그 데이터 등을 통해 수집한 데이터로 변수 간 관계를 수량화하는 분석 과정에 집중한다. 연역적 논리에 기반해 가설(hypothesis)을 검증하고 주관적 직관을 배제한다.",same:["양적 연구"],similar:["통계(적) 기반 연구","연역적 연구","실험 연구"],related:["가설","서베이","통계적 유의성","일반화","로그 데이터 분석","A/B 테스트","데이터 주도 디자인"]},{id:177,ko:"정서적 공감",en:"Emotional empathy",initial:"ㅈ",definition:"타인의 상황과 감정을 목격했을 때 인지적 분석 없이 유사한 심리 상태로 자연스럽게 동화되는 반응 기제.",description:"타인의 감정 상태를 마주했을 때 의식적인 노력 없이 유사한 정서가 공유되는 현상으로, 인지적 공감과 달리 무의식적 반응을 통해 상대방의 감정이 자연스럽게 내면화된다. 이를 바탕으로 상대가 겪는 불편이나 기쁨이 자신의 경험처럼 느껴지며, 표면적으로 드러나지 않은 심리적 결핍을 깊이 있게 이해하는 데 기여한다.",same:["감정적 공감"],similar:["정서적 공유","감정 전염","감정 이입"],related:["인지적 공감","거울 뉴런","연민","동정"]},{id:178,ko:"정성적 연구",en:"Qualitative research",initial:"ㅈ",definition:"표면적 행동 이면에 내재된 동기와 환경 맥락(context)을 규명해 현상의 의미를 해석하는 질적 조사 방법.",description:"수치로 환산하기 어려운 태도, 감정, 행동의 이유를 파악하고자 심층 면접(in-depth interview)이나 현장 관찰 같은 방식을 활용하며, 대규모 데이터를 통계적으로 분석하는 정량적 연구(quantitative research)와 달리 소수 대상을 탐구해 겉으로 드러나지 않은 경험의 본질과 복합적인 인과관계를 규명한다. 귀납적 논리에 기반해 수집한 비수치적 데이터를 분석해 의미 있는 패턴을 발견하고 인사이트를 도출한다.",same:["질적 연구"],similar:["맥락적 리서치","해석적 연구","귀납적 연구","현상학적 연구"],related:["맥락","인사이트","비언어적 단서","에스노그라피","심층 면접"]},{id:179,ko:"정보 시각화",en:"Information visualization",initial:"ㅈ",definition:"복잡하고 방대한 데이터를 그래프나 인포그래픽 등의 시각적 형태로 변환해 패턴과 의미를 직관적으로 전달하는 시각적 표현 방법.",description:"단순히 정보를 심미적으로 표현하는 것을 넘어 텍스트나 수치만으로는 발견하기 어려운 패턴과 추세를 명확하게 드러내는 데 주된 목적이 있다. 인간의 시각적 인지 능력을 활용해 정보 습득 시간을 단축하고 방대한 데이터 속에 숨겨진 의미를 직관적으로 파악하도록 돕는다. 전달 목적과 대상 맥락(context)에 따라 적합한 시각적 형식을 선택하고 불필요한 요소를 제거해 명확성을 확보한다.",same:[],similar:["데이터 시각화","인포그래픽","정보 디자인"],related:["시각적 인코딩","정보 스토리텔링","왜곡 지수","시각적 분석","전주의적 속성"]},{id:180,ko:"정보 품질",en:"Information quality",initial:"ㅈ",definition:"사용자에게 제공되는 정보가 얼마나 신뢰할 만하고 유용한지를 나타내는 정보 시스템 성공 요인.",description:"딜론과 맥린(DeLone & McLean)이 제시한 정보 시스템 성공 모형의 구성 요소 중 하나로 정보가 의도한 대로 이용자가 올바르게 이해했는지를 판단하는 준거가 된다. 정보가 사용자의 맥락(context)에 적합하고(관련성), 오류가 없으며(정확성), 필요한 시점에(적시성) 부족함 없이(완전성) 제공될 때 품질이 높다고 판단한다. 고품질 정보는 시스템의 이용 빈도를 높이고 사용자 만족에 긍정적 영향을 미쳐 개인과 조직에 실질적 순편익을 가져오는 요인이 된다.",same:[],similar:["콘텐츠 품질","지식 품질","데이터 품질"],related:["정보 유용성","정보 가독성","정보 신뢰성","정보 접근성"]},{id:181,ko:"정보 구조",en:"Information architecture, IA",initial:"ㅈ",definition:"디지털 환경의 복잡한 데이터와 콘텐츠를 사용자가 파악하기 쉽도록 체계적으로 분류하고 조직화하는 설계 과정.",description:`웹사이트나 애플리케이션의 방대한 콘텐츠를 파악할 수 있도록 위계와 논리적 흐름을 정의하며 내비게이션¹과 라벨링 시스템²을 설계해 사용자가 원하는 목적지까지 도달하도록 지원한다. 이를 바탕으로 화면 간 연결 고리를 만들고 사이트 맵³을 구성해 콘텐츠 위치와 상호 관계를 시각화한다.

각주
1. 내비게이션(navigation): 사용자가 현재 위치를 파악하고 원하는 기능으로 이동하도록 안내하는 체계이다.
2. 라벨링 시스템(labeling system): 콘텐츠 성격에 맞는 명칭을 부여하고 분류하는 체계로, 사용자가 용어만 보고도 내용을 예측하도록 일관된 언어 규칙을 수립한다.
3. 사이트 맵(site map): 서비스 전체 구조와 콘텐츠의 위계를 도식화한 설계로, 페이지 간 연결 관계를 보여주는 구조 시각화 도구이다.`,same:[],similar:["정보 설계","콘텐츠 구조","내비게이션 디자인"],related:["사용자 플로우","사이트 맵","라벨링","멘탈 모델","분류 체계"]},{id:182,ko:"정책디자인",en:"Design for policy",initial:"ㅈ",definition:"공공 정책의 수립과 집행 과정에 디자인사고(design thinking)와 디자인 방법론(design methodology)을 적용해 이용자 중심의 공공 서비스를 구현하는 디자인 분야.",description:"전통적 정책 수립이 데이터에 기반한 하향식 접근을 취하는 것과 달리, 이용자의 실제 경험과 맥락(context)을 바탕으로 문제를 정의하고 해결책을 도출하는 상향식 접근을 따른다. 정책 입안자, 전문가, 시민이 공동 창출(co-creation) 방식으로 대안을 만들며, 이해관계자 지도(stakeholder map), 고객 여정 지도(customer journey map), 서비스 청사진(service blueprint) 등 디자인 방법론(design methodology)을 활용해 정책 구조를 시각화하고 시범 운영을 통해 실효성을 검증한다.",same:[],similar:["공공 정책 설계","정부 서비스디자인"],related:["공공서비스디자인","사회 혁신","규제 설계","넛지 정책","참여 거버넌스"]},{id:183,ko:"제안서",en:"Proposal",initial:"ㅈ",definition:"발주자가 제시한 제안요청서에 대한 답변 성격의 문서로 프로젝트의 목적, 목표, 방법, 예산, 실행 계획 등을 제안하는 문서",description:"과업 내용, 기대 성과, 일정과 함께 제안자의 참가 자격과 전문성이 포함된다. 서비스·경험디자인 분야에서는 이용자 조사에서 도출된 인사이트를 바탕으로 작성되며 새로운 서비스의 특징과 가치 및 실현 가능성을 함께 제시한다.",same:["프로포절"],similar:[],related:["기획서","기획안","과업 지시서","제안요청서","견적서"]},{id:184,ko:"제품-서비스 시스템",en:"Product-service system",initial:"ㅈ",definition:"제품과 서비스를 통합한 총체적 제공을 통해 소유보다 사용 가치와 지속적 사용을 중심으로 가치를 전달하는 체계.",description:"일회성 판매와 소유에 그치지 않고 사용 과정에서 지속적인 가치와 경험(experience)을 전달하는 데 중점을 둔다. 유사 개념인 서비스화(servitization)가 제조업 서비스화라는 산업적 관점의 전략을 설명한다면, 제품-서비스 시스템(product-service system, PSS)은 제품과 서비스의 상호작용과 프로세스를 설계하는 데 초점을 둔다.",same:["PSS","제품-서비스 통합 시스템"],similar:["통합 오퍼링","서비스화"],related:["서비스 주도 논리","순환 경제","고객 생애 가치(LTV)","시스템 디자인","공유 경제"]},{id:185,ko:"지각",en:"Perception",initial:"ㅈ",definition:"감각 기관을 통해 외부 자극을 받아들이고 뇌에서 처리해 의미 있는 정보로 해석하는 인지(cognition) 과정의 첫 단계.",description:"단순한 감각 수용을 넘어 게슈탈트 이론(Gestalt theory) 등을 통해 정보를 구조화된 전체로 조직화하는 능동적 정신 활동을 포함한다. 판단과 행동 결정에 직접적인 영향을 미치며, 서비스·경험디자인에서는 이용자가 환경과 인터페이스를 어떻게 지각하는지에 대한 이해가 경험(experience) 설계의 토대가 된다.",same:[],similar:["주의","식별","인식","인지","감각","이해"],related:["게슈탈트 이론","어포던스","정보 처리 방식(상향식","하향식)","인지적 마찰","시각적 계층 구조"]},{id:186,ko:"지각된 어포던스",en:"Perceived affordance",initial:"ㅈ",definition:"사용자의 경험(experience)과 지식을 바탕으로 특정 행동을 유도하는 시각적 단서이자 특성.",description:"실제 기능의 유무와 관계없이 사용자가 축적한 경험(experience), 지식, 문화적 배경을 바탕으로 대상을 해석해 특정 행동을 이끄는 성질로 노먼(Norman)이 강조한 개념이다. 화면 속 버튼처럼 물리적으로 존재하지 않아도 시각적 단서를 통해 누를 수 있는 것처럼 보이게 해 행동을 유발한다. 실제 기능과 사용자의 지각이 일치하지 않으면 혼란이나 오류가 발생하며, 이 둘을 일치시키는 것이 디자인의 과제가 된다.",same:["지각된 행동 유도성"],similar:["주관적 어포던스","인지적 어포던스","심리적 유도성"],related:["가시성","인지 부조화","거짓 어포던스"]},{id:187,ko:"지각된 품질",en:"Perceived quality",initial:"ㅈ",definition:"서비스 이용 전 기대와 이용 후 실제 경험(experience)을 비교해 형성되는 주관적 품질 평가 결과로, 사용자 만족과 충성도를 결정하는 요인.",description:"파라수라만과 자이다믈과 베리(Parasuraman, Zeithaml & Berry)가 제안한 서비스 품질 격차 모델에 이론적 토대를 두며, 객관적, 물리적 품질과 구별되는 고객 중심의 평가 개념이다. 측정 도구로는 동일 연구팀이 1988년 개발한 서브퀄 모델이 활용되며, 신뢰성, 보증성, 유형성, 공감성, 반응성의 5가지 차원을 통해 기대와 성과 간 격차를 분석한다.",same:["체감 품질","사용자 인지 품질"],similar:["인지된 가치","기대 품질"],related:["후광 효과","단서 활용 이론","미적-사용성 효과"]},{id:188,ko:"지속성",en:"Continuity",initial:"ㅈ",definition:"이용자와의 관계가 재이용·충성도·관계 축적의 선순환을 통해 장기적으로 유지되는 속성.",description:"서비스 이용 과정에서 고객이 경험(experience)하는 만족감과 보상이 학습과 동기 부여로 이어지는 선순환 구조를 형성하며, 서비스 및 공동체와의 관계 형성을 촉진한다. 이러한 관계의 축적은 장기적 신뢰를 바탕으로 한 충성도 높은 이용자 기반으로 이어진다.",same:[],similar:["연속성","유지율"],related:["일관성","안정성","고객 생애 가치","선순환 구조"]},{id:189,ko:"참여 디자인",en:"Participatory design",initial:"ㅊ",definition:"디자인 전 과정에 참여자를 능동적 주체로 인정하고 함께 문제를 해결하는 협력적 디자인 접근.",description:"디자이너가 주도하던 전통적인 방식에서 벗어나 참여자를 프로젝트 초기 단계부터 완료 시점까지 주체적으로 동참시키는 디자인 방법론(design methodology)으로, 워크숍을 통해 암묵적 지식과 아이디어를 도출하고 추상적인 생각을 구체화한다. 디자인 의사결정 과정에 참여자의 목소리를 직접 반영함으로써 결과물의 수용성을 높이고 실질적인 해결책을 도출한다.",same:[],similar:["협력적 디자인","포용적 디자인","사회적 디자인"],related:["공동디자인","공동 창출","디자인 워크숍","이해관계자","민주적 디자인","공공디자인","생성적 도구","퍼실리테이터"]},{id:190,ko:"친화도 법",en:"Affinity diagram",initial:"ㅊ",definition:"수집된 정성적 데이터를 유사성과 친화성에 따라 그룹화하고 계층 구조로 조직하여 패턴과 인사이트를 도출하는 분석 도구.",description:"카와키타(Kawakita)가 고안하여 KJ법으로도 불리며 데이터나 아이디어를 카드나 메모지에 적어 벽면에 부착하고 이동시키는 그루핑 과정을 거친다. 단순한 그루핑을 넘어 각 그룹을 대표하는 헤더와 상위 헤더를 도출하여 개별 정보를 상향식으로 조직하고 계층 구조를 시각화함으로써 복잡한 문제에 대한 이해와 의사결정을 돕는다.",same:["어피니티 다이어그램","KJ법"],similar:["클러스터링","주제 분석"],related:["상향식 방식","헤더 카드","포스트잇","패턴 분석"]},{id:191,ko:"카노모델",en:"Kano model",initial:"ㅋ",definition:"제품이나 서비스의 기능 구현 정도(x축)와 고객 만족도(y축) 사이의 비선형적 상관관계를 분석해 개발 우선순위 결정을 돕는 분석 모델.",description:"카노(Kano)가 제안한 모델로 고객 요구(needs)사항을 당연적 품질, 일차원적 품질, 매력적 품질, 무차별적 품질, 역 품질의 5가지 요소로 분류한다. 당연적 품질은 충족되지 않으면 불만족을 유발하지만 충족되어도 만족으로 이어지지 않으며, 일차원적 품질은 구현 정도에 비례해 만족도가 높아지고, 매력적 품질은 기대하지 못한 기능이 제공될 때 높은 만족을 끌어낸다.",same:[],similar:[],related:["Timko 만족계수","중요도-실행도 분석"]},{id:192,ko:"카드소팅",en:"Card sorting",initial:"ㅋ",definition:"제품이나 서비스에 관한 정보가 적힌 카드를 참여자가 자연스럽다고 생각하는 기준에 따라 분류하고 그룹화하는 기법.",description:"참여자가 자신의 분류 체계로 카드의 정보를 조직화하게 해 멘탈 모델과 개념 간 연관성 및 정보 구조를 파악하는 데 활용되며 공동디자인(co-design), 공동 창조 워크숍(co-creation workshop)에서 참여자 간 의견 공유와 합의 도출에도 활용된다. 목적에 따라 카테고리를 직접 만드는 개방형, 정해진 틀에 넣는 폐쇄형, 이를 절충한 하이브리드 방식으로 나뉜다.",same:["카드분류법"],similar:[],related:["메뉴 구조 설계","정보 구조","멘탈 모델","내비게이션 설계"]},{id:193,ko:"커뮤니티디자인",en:"Community design",initial:"ㅋ",definition:"지역 주민이 주체가 되어 참여와 소통을 통해 공동체의 문제를 해결하고 지속 가능한 삶의 터전을 만드는 사회적 디자인 접근.",description:"낙후된 시설이나 물리적 환경을 개선하는 차원을 넘어 전문가와 협력하며 지역 고유의 정체성과 문화를 확립하는 과정에 중점을 두며 구성원 간 유대감을 강화하고 공동체의 회복력을 높이는 데 기여한다. 하향식 개발 방식에서 벗어나 주민의 목소리를 담아내는 상향식 의사결정 구조를 지향한다.",same:[],similar:["사회적 디자인","참여 디자인","공공디자인"],related:["사회적 자본","사회적 객체","임파워먼트","로컬리티","장소성","도시재생 디자인","로컬 브랜딩"]},{id:194,ko:"콜라주",en:"Collage",initial:"ㅋ",definition:"사진, 이미지, 단어 등의 시각 요소를 오려 붙여 말로 표현하기 어려운 내용을 기억, 생각, 감정을 시각적으로 구성하는 예술 기반 시각적 탐구 기법.",description:"이미지 조각들의 시각적 병치를 통해 잠재된 연결과 숨겨진 생각을 일깨우는 비선형적 탐구 방식으로, 언어로 표현하기 어려운 감정과 생각의 표현을 돕고 숨겨진 의미 도출과 경험(experience) 재구성을 가능하게 한다. 단순한 만들기 활동을 넘어 참여자 스스로 해석하고 자기 서사(narrative)를 형성하도록 돕는 성찰 기법이자 커뮤니케이션 도구로 활용된다.",same:[],similar:["무드보드","비주얼 보드","몽타주"],related:["생성적 도구","투사 기법"]},{id:195,ko:"텍스트마이닝",en:"Textmining",initial:"ㅌ",definition:"수집된 비구조화 텍스트¹ 데이터에 자연어 처리 기술을 활용하여 유용한 정보를 추출하고 가공하는 데이터마이닝 기법.",description:`데이터 전처리²와 형태소 분석³ 과정을 거쳐 텍스트 속에 숨겨진 패턴을 탐지하고 새로운 정보를 발견하는 지식 발견의 과정으로, 비정형 데이터를 정형화하며 TF-IDF⁴ 알고리즘으로 핵심어의 중요도를 계산하거나 감성 분석, 네트워크 분석, 텍스트 분류 등을 통해 데이터 내의 개념 분포와 계층을 파악한다. 분석 결과는 워드 클라우드 등으로 시각화되어 탐색적 데이터 분석⁵을 돕고 트렌드 분석, 정책, 사회 이슈 분석, 실시간 온라인 사건 감지 등 다양한 분야에서 인사이트를 제공하며 미래 예측과 전략 수립의 근거로 활용된다.

각주
1. 비구조화 텍스트(unstructured text): 일정한 형식 없이 자유롭게 작성된 블로그 글, 댓글, 이메일 등의 데이터이다.
2. 데이터 전처리(data preprocessing): 본격적인 분석 전에 오타 수정, 특수문자 제거 등 데이터를 정제하는 작업이다.
3. 형태소 분석(morphological analysis): 문장의 뜻을 가진 최소 단위(명사, 동사 등)로 분리해 사용된 단어를 파악하는 기초 단계이다.
4. TF-IDF(term frequency-inverse document frequency): 특정 문서에서 단어의 중요도를 계산하는 방식으로, 빈출 조사 등을 제외하고 문서의 핵심어를 추출하는 데 활용된다.
5. 탐색적 데이터 분석(exploratory data analysis): 분석 초기 단계에 데이터를 시각화하거나 검토하면서 전반적인 특징과 패턴을 파악하는 과정이다.`,same:["텍스트 데이터 마이닝"],similar:["콘텐츠 분석","비정형 데이터 분석"],related:["빅데이터 분석","형태소 분석","감성 분석","토픽모델링","의미 연결망 분석","자연어 처리"]},{id:196,ko:"트리맵",en:"Treemap",initial:"ㅌ",definition:"복잡한 계층 구조를 2차원 공간에 직사각형으로 빈틈없이 채워 각 요소의 크기와 비율을 동시에 표현하는 공간 채움 시각화 기법",description:"전체 영역을 항목별 비율에 따라 재귀적으로 나눈 직사각형으로 채워 각 범주의 수량, 크기, 비율을 전체 대비로, 직관적으로 인식할 수 있으며, 색상이나 패턴을 통해 추가 속성을 나타낼 수 있다. 시장 점유율, 포트폴리오 구성, 파일 시스템 용량 등 계층적 구조와 크기, 비율 정보를 동시에 파악해야 하는 분야에서 활용된다.",same:["계층지도","계층적 면적 차트"],similar:["선버스트 차트"],related:["데이터 시각화","히트맵","트리 구조","정보 시각화"]},{id:197,ko:"트리즈",en:"TRIZ",initial:"ㅌ",definition:"전 세계 특허 사례 분석을 통해 정립된 발명 원리를 비롯한 체계적 도구를 활용해 시스템의 모순을 극복하고 창의적 해결책을 도출하는 지식 기반 방법론.",description:"알츠슐러(Altshuller)가 방대한 특허 정보를 분석해 성공적 발명에 숨겨진 공통 법칙을 정립한 창의적 문제 해결 이론으로 시스템 내에서 충돌하는 기술적 모순과 물리적 모순을 타협 없이 근본적으로 제거하기 위해 40가지 발명 원리를 도구로 활용한다. 초기에는 공학적 난제 해결에 주로 사용되었으나 현재는 제품 디자인, 서비스 모델, 사회적 이슈 해결 등 다양한 분야로 적용 범위가 확장되고 있으며, 막연한 직관이나 영감에 의존하지 않고 축적된 데이터와 논리를 기반으로 문제 해결의 성공 확률을 높인다.",same:[],similar:["ASIT"],related:["아이데이션","브레인스토밍","스캠퍼","40가지 발명 원리","모순 해결 전략"]},{id:198,ko:"퍼소나",en:"Persona",initial:"ㅍ",definition:"실제 사용자 조사(user research)를 통해 수집된 데이터를 근거로 행동 패턴, 동기, 멘탈 모델(mental model)을 추출하여 만들어진 사용자 유형을 대표하는 가상의 인물.",description:"면접(interview), 관찰 조사 등에서 얻은 정성 데이터를 분석해 사용자의 행동 변수를 도출하고 주요 패턴을 보이는 사용자 유형을 정의하는 데서 출발한다. 단순한 인구통계학적 정보를 넘어 개인의 배경, 태도, 요구(needs), 문제점 등 행동적, 심리적 구성요소를 통합한 스토리텔링(storytelling) 기반의 사용자 프로필로 완성된다. 목적에 따라 1순위 퍼소나(persona), 2순위 퍼소나, 추가 퍼소나, 부정적 퍼소나 등으로 구분되며, 일반적으로 3~5개로 도출한다.",same:["페르소나"],similar:["래피드 퍼소나","사용자 프로필","아키타입"],related:["사용자 모델링","멘탈 모델","고객 여정 지도","시나리오","타깃 고객","고객 세그먼트"]},{id:199,ko:"퍼실리테이션",en:"Facilitation",initial:"ㅍ",definition:"퍼실리테이터(촉진자)가 중립적인 위치에서 집단 내 소통과 상호작용을 끌어내 참여자들이 논의에 몰입하도록 돕는 촉진 활동.",description:"회의나 워크숍 같은 집단 활동에서 편향되지 않은 입장을 지키며 원활한 논의 환경을 조성하고 구성원 간 의견 교환을 촉진해 공감대를 형성하며 합의점을 찾도록 지원한다. 특히 디자인 워크숍에서는 시각 도구를 활용해 복잡한 생각을 정리하고 구조화함으로써 참여자 주도의 문제 정의와 창의적인 해결책을 공동으로 도출하는 기반이 된다.",same:["촉진"],similar:["모더레이션"],related:["퍼실리테이터","발산과 수렴","디자인 워크숍","아이스브레이킹"]},{id:200,ko:"페인포인트",en:"Pain point",initial:"ㅍ",definition:"고객이 서비스를 이용하는 과정에서 겪는 구체적 불편이나 충족되지 못한 요구 등의 부정적 경험(experience) 지점.",description:"고객이 특정 환경에서 활동을 수행하며 마주치는 불편함과 마찰을 뜻하며 일시적 불만을 넘어 기대 수준에 미치지 못하거나 목적 달성을 방해하는 부정적 순간 전반을 아우른다. 심층 면접(in-depth interview)과 현장 관찰 같은 정성적 조사를 통해 구체적인 발생 맥락(context)을 파악하며, 도출한 인사이트는 경험(experience)을 개선하고 새로운 서비스 가치를 발굴하는 근거로 활용된다.",same:["불편 지점"],similar:["미충족 요구","보틀넥","인지적 마찰","이탈 지점"],related:["딜라이트 포인트","고객 여정 지도","기회 영역","요구 분석","심층 면접"]},{id:201,ko:"포용적 디자인",en:"Inclusive design",initial:"ㅍ",definition:"연령, 성별, 신체적, 인지적, 상황적 조건과 관계없이 모든 인간의 다양성을 존중하여 누구도 소외되지 않도록 하는 디자인 철학이자 접근 방식.",description:"고정된 표준 이용자를 위한 해결책을 추구하는 유니버설 디자인과 달리, 인간의 다양성 자체를 디자인의 출발점으로 삼아 유연한 해결책을 지향한다. 제품과 서비스 개발을 넘어 시스템 전반의 포괄적 변화를 끌어내고 사회 구성원 모두의 참여와 접근을 지원한다.",same:["인클루시브 디자인"],similar:["유니버설 디자인","무장애 디자인"],related:["접근성","윤리적 디자인","디지털 포용","극단적 퍼소나","다양성","형평성","사회적 가치"]},{id:202,ko:"포지셔닝",en:"Positioning",initial:"ㅍ",definition:"제품, 서비스, 브랜드를 고객 인식 속에 경쟁자 대비 유리한 위치로 자리매김하는 전략적 과정.",description:"시장 내 경쟁 지형을 2차원 좌표축 기반의 시각화 도구로 분석하는 단계에서 출발하며, 평가 좌표를 설정할 때는 객관적 지표뿐만 아니라 고객의 주관적 인식과 경험적 가치를 함께 고려한다. 이러한 복합적 기준에 따라 대상을 배치해 상대적 우위와 시장 내 공백을 파악하고, 도출한 인사이트를 바탕으로 차별화된 서비스 속성을 발굴해 전략 방향 수립의 토대가 된다.",same:["시장 위치 선정"],similar:["차별화 전략"],related:["포지셔닝 맵","속성 포지셔닝","리포지셔닝"]},{id:203,ko:"포카요케의 법칙",en:"Poka-yoke principle",initial:"ㅍ",definition:"사용자나 작업자가 공정 및 프로세스 안에서 발생시킬 수 있는 오류를 사전에 방지하기 위해 시스템과 환경 자체를 오류가 일어나기 어려운 구조로 설계하는 품질 관리 방법이자 디자인 원칙.",description:"일본어로 '부주의한 실수를 방지한다'라는 의미를 지니며 신고(Shingo)가 도요타 생산 방식의 일환으로 체계화한 개념이다. 디자인 관점에서는 사용자가 실수를 저지르기 전에 이를 식별하고 제거할 수 있도록 제품, 인터페이스, 서비스 흐름 속 장치와 기능을 디자인에 내재화하는 원칙으로 적용된다.",same:[],similar:["오류 방지 설계","실수 방지 원칙","오류 허용 설계"],related:["접근성 설계","인터랙션디자인","사용자 경험(UX) 설계 원칙","품질 관리"]},{id:204,ko:"프레이밍 효과",en:"Framing effect",initial:"ㅍ",definition:"동일한 정보라도 제시되는 방법이나 관점에 따라 인간의 인식과 의사결정이 달라지는 인지(cognition) 편향.",description:"정보를 전달하는 틀인 프레임이 정보 자체보다 의사결정에 더 큰 영향을 미친다는 행동 경제학 및 인지심리학 이론에 근거한다. 긍정적 이익을 강조하느냐 부정적 손실을 부각하느냐에 따라 동일한 메시지에 대한 사용자의 반응과 선택이 달라지는 것이 대표적인 예이다.",same:["틀짜기 효과","액자 효과"],similar:["맥락적 프레이밍","설득적 디자인"],related:["손실 회피","앵커링 효과","유인 효과","기본값 효과","전망 이론","넛지","인지 편향","UX 라이팅","선택 설계"]},{id:205,ko:"프레임워크",en:"Framework",initial:"ㅍ",definition:"복잡한 문제를 해결하기 위해 연구와 실행 과정의 기본 뼈대를 이루는 개념적 기반 구조.",description:"디자인, 경영 등 다양한 분야에서 프로젝트의 방향을 잡아주는 전략적 틀로, 복잡한 과업의 실행 단계와 구성 요소를 정의하여 실무자의 문제 해결을 지원한다. 단순한 규칙의 나열이 아니라 성과를 측정하는 명확한 평가 기준을 제공하며, 불확실성이 높은 환경에서도 일관된 프로세스를 유지하도록 돕는다.",same:["개념 틀(구조)"],similar:["모델"],related:["방법론","가이드라인","체크리스트","인사이트"]},{id:206,ko:"프로브",en:"Probes",initial:"ㅍ",definition:"디자이너가 직접 관찰하기 어려운 대상자 일상과 내면의 정보를 수집하기 위해 창작 기반의 과제를 부여하는 자기 기록 도구.",description:`연구자 개입을 배제해 대상자 주관적 경험과 감성적 인사이트를 스스로 문서화하도록 지원하는 탐색 과정으로, 사진 촬영이나 일기 작성 같은 방식을 활용해 정량 조사로는 파악하기 어려운 심층적 경험(experience) 서사를 발굴한다. 목적에 따라 디자인 영감과 문화적 맥락 탐색에 집중하는 컬처럴 프로브와 대상자 공감에 무게를 두는 디자인 프로브로 나뉘며, 디지털 기술과 융합한 확장 형태로 기술 프로브¹ 로 발전해 다각적인 관찰 매개체로 활용된다. 

각주
1. 기술 프로브(technology probes): 초기 단계의 기술적 결과물을 대상자 일상에 제공해 사용 방식과 적응 과정을 관찰하는 기법이다. 기능적 가능성을 점검하며 실제 생활 맥락(context)에서 파생되는 새로운 가치를 탐색한다.`,same:["사용자 프로브"],similar:["디자인 프로브","컬처럴 프로브","기술 프로브"],related:["생성적 도구","프로브 키트","다이어리 스터디"]},{id:207,ko:"프로토타입",en:"Prototype",initial:"ㅍ",definition:"디자인 프로세스(design process)에서 도출한 아이디어를 구현해 타당성과 실현 가능성을 검토하고 평가하는 산출물.",description:`검증 목적과 단계에 따라 다양한 충실도로 제작하며, 스케치 수준의 로우 피델리티 모델과 실제 기능을 구현한 하이 피델리티 모델로 나뉜다. 사용자가 실제 상황처럼 몰입해 검증하는 경험(experience) 중심 프로토타입¹도 활용되며, 출시 이전 단계에서 한정된 자원으로 오류를 파악해 재개발 비용을 줄이고 사용자와 상호작용을 하며 피드백을 수집해 해결 방안을 개선한다. 

각주
1. 경험 중심 프로토타입(experience prototype): 역할놀이나 서비스 시뮬레이션 등을 활용해 사용자가 실제 서비스를 이용하듯 경험하도록 구성한 형태이다.`,same:[],similar:["시제품","시뮬레이션","목업"],related:["최소 기능 제품(MVP)","파일럿","위저드 오브 오즈(WOZ)"]},{id:208,ko:"플랫폼",en:"Platform",initial:"ㅍ",definition:"공급자와 수요자 등 다양한 참여자 그룹을 연결해 상호작용을 촉진하고 가치를 교환할 수 있도록 돕는 서비스 생태계(service ecosystem).",description:"플랫폼은 기술적 자산을 외부에 개방해 확장할 수 있는 네트워크와 독자적인 생태계를 구축하며, 제품 판매를 넘어 기술과 네트워크를 활용해 참여자의 자발적 공유와 활동을 촉진한다. 참여자 간 공동 경험(experience)과 창작을 통해 서비스 제공자의 개입 없이도 참여자 주도로 가치가 확장되는 구조를 지향한다.",same:[],similar:["비즈니스 인프라","기반 시스템"],related:["생태계","네트워크","개방형 혁신","양면 시장","플랫폼 비즈니스"]},{id:209,ko:"피츠의 법칙",en:"Fitts's law",initial:"ㅍ",definition:"목표물까지의 이동 거리와 크기가 운동 행동에 소요되는 시간에 미치는 영향을 정량적으로 설명하는 심리 운동 법칙.",description:"피츠(Fitts)가 인간의 운동계를 정보 전송 시스템으로 바라보는 모델을 제안하며 정립한 개념으로, 목표물까지의 이동 거리가 멀수록 목표물의 너비가 작을수록 조작에 소요되는 시간이 길어진다는 원리를 수식으로 표현한 것이 핵심이다. HCI 분야에서 사용자가 화면 내 목표물을 선택하거나 조작하는 행동의 난이도와 소요 시간을 예측하는 기초 모델로 활용된다.",same:[],similar:["운동 시간 예측 모델","목표 획득 법칙"],related:["인간-컴퓨터 상호작용(HCI)","사용자 경험(UX) 설계 원칙","인터랙션디자인","터치 인터페이스 설계","접근성 설계"]},{id:210,ko:"허니콤 모델",en:"Honeycomb model",initial:"ㅎ",definition:"사용자 경험(user experience)을 유용성(usefulness), 사용성(usability), 매력성, 검색 가능성, 접근성, 신뢰성, 가치성의 7가지 요소로 진단하는 프레임워크(framework).",description:"모빌(Morville)이 제안한 개념으로 사용자 경험(user experience) 디자이너가 정보 구조(information architecture, IA), 인터페이스, 콘텐츠가 사용자 요구(needs)에 맞는지 평가하고 전략을 수립하는 기준으로 활용된다. 기능적 문제 해결을 넘어 감성 디자인(design for emotion, emotional design) 측면의 매력성까지 포괄하며, 접근성 설계와 정보의 발견 가능성을 진단 항목으로 포함한다.",same:["UX 허니콤"],similar:["사용자 경험의 7요소"],related:["사용자 경험의 5단계","정보 구조","접근성 설계","UX 평가 프레임워크"]},{id:211,ko:"행동디자인",en:`Behavioral design
(Behavior design)`,initial:"ㅎ",definition:"이용자의 동기, 능력, 트리거를 분석해 의도된 행동을 수행하도록 지원하고 태도를 변화시키는 디자인 접근.",description:"포그(Fogg)의 행동 모델을 기반으로 서비스의 기능과 맥락(context)을 구체적으로 구현해 이용자의 자발적 참여를 촉진하고 지속 가능한 습관 형성을 돕는 디자인 방식이다. 심리학적 원리와 디자인사고(design thinking)를 융합해 개인의 목표 달성을 지원하는 실천적 방법론이다.",same:[],similar:["넛지 디자인","설득적 디자인","습관 형성 디자인"],related:["게이미피케이션","게이미피케이션 디자인","행동 경제학","훅 모델","비제이 포그 행동 모델","선택 설계","마찰력"]},{id:212,ko:"행동 우선순위 매트릭스",en:"Action priority matrix",initial:"ㅎ",definition:"다수의 아이디어나 업무를 두 가지 기준축에 따라 2×2 매트릭스¹에 배치해 우선순위를 결정하는 시각적 의사결정 도구.",description:`가로축은 실행 가능성이나 필요한 노력을, 세로축은 예상되는 성과나 투자 가치를 나타내며, 여러 아이디어나 과제를 네 개의 사분면에 배치하여 우선순위를 시각적으로 판단한다. 실행하기 쉬우면서 효과가 큰 아이디어는 우선적으로 선택하고, 노력은 많이 들지만, 성과가 낮은 아이디어는 배제하거나 뒤로 미룬다. 한정된 시간과 자원을 배분하는 전략적 도구로서 의사결정 과정의 이견을 줄이고 로드맵을 명확하게 수립하는 데 활용된다.

각주 
1. 2×2 매트릭스(2x2 matrix): 가로축과 세로축을 교차해 네 개의 사분면을 만든 도구로, 두 가지 기준으로 정보를 분류하고 분석하는 데 활용된다.`,same:[],similar:["PICK 차트"],related:["아이디어 발산","의사결정 도구","우선순위 설정","로드맵 설계","아이디어 선별"]},{id:213,ko:"현장 연구",en:"Field study",initial:"ㅎ",definition:"연구자가 통제된 실험실을 벗어나 연구 대상이 존재하는 실제 환경으로 직접 들어가 수행하는 조사 방법.",description:"사람들의 행동과 사회 문화적 맥락(context)을 이해하기 위해 관찰법(observation method), 면접(interview), 직접 참여 방식을 활용하며, 자연스러운 상태에서 연구자와 참가자 사이의 물리적 및 심리적 거리를 좁혀 현장의 구체적 실태와 미세한 뉘앙스를 포착한다. 이를 통해 대상의 숨겨진 요구를 발견하고 현실에 기반한 해결책을 모색하는 실천적 접근이다.",same:[],similar:["맥락적 리서치"],related:["사용자 관찰","에스노그라피","맥락적 면접","섀도잉","참여 관찰"]},{id:214,ko:"현존감",en:"Presence",initial:"ㅎ",definition:"기술로 매개된 가상 환경에 물리적으로 존재하지 않음에도 그곳에 실제로 머무는 듯이 체감하는 주관적 심리 상태.",description:"가상현실이나 증강현실 같은 환경에서 주어지는 감각 자극과 상호작용을 통해 형성되며, 감각 기관이 받아들이는 정보가 현실과 유사할수록 물리적 위치감을 넘어 가상 공간 내의 다른 객체와 함께 있다는 사회적 연결감까지 포괄하게 된다. 이러한 감각적 일치는 기술적 매개가 존재한다는 사실을 잊고 체험 자체에 집중하게 함으로써 가상과 현실의 경계를 희미하게 하며, 콘텐츠의 기술적 완성도와 함께 전반적인 경험(experience)의 질을 결정하는 심리적 기제로 기능한다.",same:[],similar:["텔레프레즌스"],related:["실재감","공간적 현존감","몰입감","현실감","사회적 현존감","감각적 일치","감각 피드백"]},{id:215,ko:"헬스케어디자인",en:"Healthcare design",initial:"ㅎ",definition:"질병 치료와 병원 환경 개선을 넘어 예방과 일상적 건강 관리를 아우르는 웰니스 영역으로 확장된 융합 디자인 접근.",description:"모바일 앱이나 웨어러블 기기 같은 디지털 기술을 의료 서비스에 접목해 맞춤형 정보를 제공하고 대상자가 스스로 건강을 관리할 수 있도록 지원한다. 진료 현장을 넘어 대상자가 겪는 모든 과정과 접점(touchpoint)을 디자인해 건강 증진과 산업 전반의 서비스 개선에 기여한다.",same:[],similar:["의료 서비스디자인","환자 경험디자인","웰니스 디자인"],related:["환자 중심 디자인","건강 리터러시","디지털 치료제","라이프 로그","환자 여정 맵"]},{id:216,ko:"협업",en:"Collaboration",initial:"ㅎ",definition:"공동 목표 달성을 위해 다양한 배경을 가진 주체들이 관점과 자원을 공유하며 문제를 해결해 나가는 활동.",description:"디자인 분야에서는 단순한 업무 분담을 넘어 디자이너, 이해관계자(stakeholder), 고객이 수평적 관계에서 각자의 전문 지식과 자원을 투명하게 공유하고 능동적으로 참여함으로써 개별적 사고만으로는 도달하기 어려운 독창적 아이디어를 발전시키는 과정을 뜻한다.",same:["콜라보레이션"],similar:["공동 작업","파트너십"],related:["교차 기능 팀","사일로 효과","지식 교환","공동 창출","공동디자인"]},{id:217,ko:"환경 분석",en:"Environmental analysis",initial:"ㅎ",definition:"조직을 둘러싼 산업 환경의 변화와 불확실성이 전략적 의사결정에 미치는 영향을 분석하는 방법론.",description:"정치, 경제, 사회, 기술 요인으로 세분화한 PEST 분석, 환경 요인을 추가로 확장한 STEEP 분석, 내외부 환경을 강점, 약점, 기회, 위협으로 구조화한 SWOT 분석 등 다양한 전략적 프레임워크(framework)로 발전하였다. 서비스·경험디자인에서는 외부 환경의 기회와 위협을 파악하고 전략적 방향을 수립하는 근거로 활용된다.",same:[],similar:["환경 스캐닝","상황 분석","맥락 분석","외부 환경 진단"],related:["PEST 분석","STEEP 분석","SWOT 분석","트렌드 분석"]},{id:218,ko:"후방 영역",en:"Back stage",initial:"ㅎ",definition:"서비스 청사진(service blueprint)에서 가시선(line of visibility) 뒤편에 위치해 고객에게는 보이지 않는 비가시 영역으로, 서비스 제공자가 원활한 서비스 전달을 위한 준비 작업을 수행하는 공간.",description:"고객과 직접적인 상호작용이 발생하지 않는 이면의 무대를 뜻하며, 후방 인력이나 시스템이 내부 운영 활동을 전담해 전방 접점(touchpoint)이 원활하게 작동하도록 돕는다. 각종 인적, 물적 자원을 관리하며 전방 활동과 연계된 지원 프로세스로 서비스 청사진(service blueprint) 내에서 시각화된다.",same:["지원 영역","후면 무대","비가시 영역"],similar:[],related:["서비스 청사진","전방 영역","내부 상호작용선","가시선"]},{id:219,ko:"휴리스틱 평가",en:"Heuristic evaluation",initial:"ㅎ",definition:"소수 전문가가 직관과 경험 법칙에 기반한 사용성 원칙을 기준으로 인터페이스를 검사해 잠재적 결함을 발견하고 적합성을 판별하는 진단 기법.",description:`인간이 복잡한 판단을 내릴 때 인지적 노력을 줄이고자 사용하는 경험적 규칙인 휴리스틱 개념을 바탕으로, 사용자에게 직관적이고 편리한 경험(experience)을 제공하는지 점검하는 발견적 조사 방법이다. 닐슨(Nielsen)이 제시한 10대 사용성 원칙¹을 주된 평가 척도로 삼아 인지 부하(cognitive load) 감소 여부와 인터페이스 표준 준수 상태를 확인하고 디자인 품질을 선제적으로 개선하는 실무 지침으로 활용된다.

각주
1. 닐슨(Nielsen)의 10대 사용성 원칙
(1) 시스템 상태 가시성(visibility of system status): 진행 상황을 명확히 보여주어 이용자가 현재 상태를 즉각 인지할 수 있도록 한다.
(2) 현실 세계와 일치(match between system and the real world): 전문 용어 대신 일상 언어를 사용해 현실 관습과 논리를 따른다.
(3) 사용자 제어 및 자유(user control and freedom): 명확히 표시된 실행 취소와 재실행 기능을 제공해 이용자가 원하지 않는 상태에서 벗어날 수 있도록 한다.
(4) 일관성 및 표준(consistency and standards): 화면 형태, 용어, 작동 방식을 서비스 전반에서 동일하게 유지한다.
(5) 오류 방지(error prevention): 확인 창 제공이나 잘못된 입력 제한 등을 통해 실수를 사전에 방지하도록 디자인한다.
(6) 회상보다 인식(recognition rather than recall): 메뉴와 정보를 직관적으로 노출하여 기억 부담을 줄이고 인터페이스를 즉각 파악하도록 지원한다.
(7) 유연성과 효율성(flexibility and efficiency of use): 초보자를 위한 안내와 숙련자를 위한 단축 기능을 함께 제공하여 다양한 숙련도를 지원한다.
(8) 심미적이고 미니멀한 디자인(aesthetic and minimalist design): 불필요한 정보를 제거하여 핵심 콘텐츠에 집중할 수 있도록 시각적으로 정돈한다.
(9) 명확한 오류 진단 및 복구(help users recognize, diagnose and recover from errors): 쉬운 언어로 문제를 설명하여 이용자가 오류를 인식·진단하고 복구할 수 있도록 안내한다.
(10) 도움말 및 문서(help and documentation): 직관적 사용을 지향하되 필요시 찾기 쉬운 간결한 안내 문서를 제공한다.`,same:[],similar:["사용성 평가(테스트)","사용자 평가(테스트)"],related:["전문가 리뷰","인지적 워크스루","UX 평가"]},{id:220,ko:"흐름도",en:"Flowchart",initial:"ㅎ",definition:"복잡한 작업 흐름이나 프로세스 단계를 표준 기호로 도식화해 작업 순서와 논리적 분기를 한눈에 파악할 수 있게 하는 다이어그램.",description:"직사각형(처리), 마름모(판단), 화살표(흐름 방향) 등 약속된 기호로 작업 단계와 의사결정 분기점을 시각화하며 서비스나 업무의 현재 상태를 기록해 작업 절차를 명확히 하는 프로세스 문서화에 활용된다. 불필요한 단계 제거와 업무 표준화를 통한 프로세스 개선에 기여하며, 병목 구간이나 비효율적 요소를 탐지하는 도구로 기능한다.",same:["플로챠트"],similar:["프로세스 맵","로직 다이어그램"],related:["사용자 플로우","워크 플로우","의사결정 분기"]},{id:221,ko:"히트맵",en:"Heatmap",initial:"ㅎ",definition:"색상의 농도를 활용해 데이터 밀도와 발생 빈도를 시각적으로 나타내는 분석 도구.",description:"데이터 빈도가 높은 영역을 적색으로, 낮은 영역을 청색으로 나타내 정보 집중도를 직관적으로 보여준다. 수집 방식에 따라 클릭이나 스크롤 궤적을 추적하는 행동 로그 기반과 안구 움직임을 추적하는 시선 기반으로 나뉜다. 인터페이스 진단 시 체류 시간과 이동 경로를 분석해 고빈도 영역과 저빈도 영역을 명확히 구분하며, F-패턴이나 Z-패턴 같은 이용자 시선 흐름과 정보 처리 방식을 파악한다. 이를 바탕으로 핵심 내비게이션이나 CTA 버튼의 시각적 우선순위를 점검해 화면 구조를 최적화하는 디자인 개선의 근거로 활용된다.",same:["열분포도","열지도"],similar:[],related:["데이터 시각화","아이트래킹","어텐션 맵","게이즈 플롯"]},{id:222,ko:"AIO 분석",en:"AIO analysis",initial:"A-Z",definition:"활동, 관심, 의견의 앞 글자를 조합한 라이프스타일 분석 도구.",description:"웰스와 티거트(Wells & Tigert)가 제안한 개념으로 인구 통계적 특성만으로는 파악하기 어려운 소비자의 행동 패턴, 미디어 이용 방식, 제품에 대한 태도 등을 종합적으로 측정해 시장 세분화와 마케팅 전략 수립에 활용된다.",same:[],similar:["라이프스타일 분석","소비자 행동 분석","사용자 태도 조사"],related:["퍼소나 개발","사용자 리서치","시장 세분화","사용자 여정 분석","맥락 조사","심리통계 분석"]},{id:223,ko:"PEST 분석",en:"PEST analysis",initial:"A-Z",definition:"정치, 경제, 사회, 기술의 앞 글자를 조합한 거시 환경 분석 도구.",description:"아귈라(Aguilar)가 처음 제안한 개념으로 정부 정책과 시장 변화, 사회적 트렌드, 기술 혁신 흐름 등 거시적 환경 요소를 종합적으로 파악한다. 필요에 따라 법적, 환경 요인을 추가한 PESTEL로 확장되기도 한다.",same:[],similar:[],related:["환경 분석","PESTEL 분석","STEEP 분석","트렌드 분석"]},{id:224,ko:"STEEP 분석",en:"STEEP analysis",initial:"A-Z",definition:"사회, 기술, 경제, 환경, 정치의 앞 글자를 조합한 거시 환경 분석 도구.",description:`PEST 및 PESTEL¹ 분석과 유사하나 환경적 요인을 독립 영역으로 포함한다는 점에서 구별된다.

각주
1. PESTEL: 정치(political), 경제(economic), 사회(social), 기술(technological), 환경(environmental), 법적(legal) 요인을 포함한 확장형 거시 환경 분석 도구이다.`,same:[],similar:["PEST 분석","PESTEL 분석","거시 환경 분석"],related:["환경 분석","SWOT 분석","지속가능성 평가","트렌드 분석"]},{id:225,ko:"STP 분석",en:"STP analysis",initial:"A-Z",definition:"시장 세분화, 표적 시장 선정, 포지셔닝(positioning)의 앞 글자를 조합한 마케팅 전략 분석 도구.",description:"코틀러(Kotler)가 체계화한 개념으로 전체 소비자를 공통된 특성을 지닌 그룹으로 나누는 세분화에서 출발해 타깃 시장을 선정하고 제품과 서비스가 소비자의 인식 속에 유리하게 자리 잡도록 차별화된 포지셔닝을 수립한다.",same:[],similar:["타깃 마케팅 전략","사용자 그룹 정의","타깃 오디언스 설정"],related:["퍼소나 개발","가치 제안 설계","사용자 리서치","사용자 여정 디자인"]},{id:226,ko:"SWOT 분석",en:"SWOT analysis",initial:"A-Z",definition:"강점, 약점, 기회, 위협의 앞 글자를 조합한 조직의 내외부 환경을 종합적으로 진단하는 전략 분석 도구.",description:"내부 환경에서 강점과 약점을, 외부 환경에서 기회와 위협 요인을 체계적으로 파악해 각 요인 간 관계를 바탕으로 전략 방향을 도출한다. 강점-기회(SO)·강점-위협(ST)·약점-기회(WO)·약점-위협(WT)의 네 가지 조합으로 교차 분석해 구체적인 전략 대안을 수립하는 데 활용된다.",same:["SWOT 매트릭스"],similar:["환경 분석"],related:["PEST 분석","STEEP 분석","경쟁 환경 분석"]},{id:227,ko:"UI 컴포넌트",en:"UI component",initial:"A-Z",definition:"디지털 화면을 구성하는 독립적으로 재사용할 수 있는 시각 요소로, 버튼, 슬라이더, 메뉴 등 사전 제작된 화면 구성의 기초 단위.",description:`단순한 시각적 형태를 넘어 사용자의 상호작용이나 외부 이벤트에 반응하여 정해진 동작을 수행하는 기능을 포함하도록 디자인된다. 디자이너와 개발자가 매번 새로운 요소를 디자인하는 대신 컴포넌트 라이브러리¹에 구축된 요소를 꺼내어 화면을 구성함으로써 작업 속도를 높이고 전체 페이지의 시각적 및 기능적 일관성을 유지하는 기반이 된다. 

각주
1. 컴포넌트 라이브러리(component library): 자주 쓰는 버튼, 입력창, 아이콘 등을 사전에 제작해 모아둔 통합 도구 모음이다.`,same:["UI 요소"],similar:["디자인 에셋"],related:["디자인 시스템","컴포넌트 라이브러리","디자인 패턴"]}],Ym=["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","A-Z","#"],xu=[{id:"P-2-01",itemId:"R01",round:"2회",difficulty:"상",points:4,type:"fill",topic:"과제 분석 · 프로젝트 관리 기법",figure:["과제 범위·목적·성격 파악","과제분석 (기초조사·관련 자료 수집)","㉠ ― 가로 막대로 작업별 일정을 표시하는 도표","㉡ ― 작업 간 순서·의존관계를 네트워크로 연결해 표시하는 공정도","과제 기획안·제안서 작성"],prompt:"과제분석 흐름도의 빈칸 ㉠, ㉡에 해당하는 프로젝트 관리 기법을 쓰고, ㉠ 기법의 단점을 2가지 쓰시오.",answer:"㉠ 간트차트(Gantt Chart) ㉡ 퍼트차트(PERT). 간트차트의 단점: ① 정밀성이 부족해 정확한 소요 시간을 알기 어렵다. ② 작업 상호 간의 유기적 관계를 명확히 파악하기 어렵다. (규모가 크고 복잡한 프로젝트에 부적합)",keywords:["간트차트","퍼트","소요 시간","유기적 관계"],explanation:"간트차트는 일정 막대로 직관적이지만 작업 간 선후행 의존관계 표현이 약하다. 의존관계·임계경로는 PERT/CPM이 강하다."},{id:"P-1-02",itemId:"R02",round:"1회",difficulty:"중",points:3,type:"fill",topic:"환경현황 조사 · SWOT",passage:"여성 1인 가구 타깃 비대면 디저트 배달앱 A는 출시 3년 차. 출시 당시 디저트 배달·비대면이 보편화되지 않아 20대 여성에게 호응을 얻음. 현재는 대부분 배달앱이 디저트·비대면을 제공해 매출이 감소 추세. 다만 유명 디저트 가게 배달을 독점하고 충성 고객층과 많은 SNS 팔로워를 보유.",prompt:"A사가 SWOT 분석으로 자사를 분석할 때, S(강점)와 O(기회)에 들어갈 내용을 각각 2개씩 쓰시오.",answer:"S(강점): 유명 디저트 가게 배달 서비스 독점 / 동종 업계 첫 비대면 배달 시작 / 탄탄한 충성 고객층 확보 / 많은 SNS 팔로워. O(기회): 코로나 지속으로 배달 서비스 증가 추세 / SNS 영향력 갈수록 증가.",keywords:["독점","충성 고객","SNS","배달 서비스 증가"],explanation:"S/W는 내부 요인, O/T는 외부 환경 요인. 매출 감소·단일 메뉴는 W, 경쟁사의 디저트/비대면 제공은 T로 분류된다."},{id:"P-2-03",itemId:"R02",round:"2회",difficulty:"중",points:4,type:"fill",topic:"환경현황 조사 · PEST",passage:"가정용 소형 육류배양기를 개발하는 P사가 기업이 통제할 수 없는 거시 환경 요인을 조사했다(식품 승인, 그린뉴딜 예산, 안전관리 기준, 가치소비 확산, 미닝아웃 트렌드, GDP 상승, 주가 상승, 대체육 시장 성장 등).",prompt:"제시된 거시 환경 요인을 분석할 때 사용되는 분석법을 쓰고, 그 구성 항목을 쓰시오.",answer:"분석법: PEST. 구성 항목 — P(Political 정치): 식품 승인 허가, 그린뉴딜 예산, 안전관리 기준 개발 / E(Economic 경제): 세계 증시·주가, GDP 상승, 대체육 시장 성장 / S(Social 사회): 가치소비 증가, 미닝아웃 트렌드 확산 / T(Technological 기술).",keywords:["PEST","정치","경제","사회","기술"],explanation:"PEST는 거시 환경(통제 불가 외부 요인)을 정치·경제·사회·기술로 나눠 분석한다. 미시 환경(경쟁사·고객·공급자)과 구분할 것."},{id:"P-3-04",itemId:"R02",round:"3회",difficulty:"중",points:2,type:"fill",topic:"환경조사 · 거시/미시 구분",passage:"㉠ 이해관계자 조사로 중간관리자·작업자·안전관리자 전체 구조 파악 / ㉡ 현장 소음·조도·공기질 측정 / ㉢ 작업장 인식·핵심 문제 파악 FGI 실시 / ㉣ 산업안전보건법·표지·보호구 가이드라인 등 법규 조사 / ㉤ 전문가 인터뷰로 산업구조 변화·제조방식 혁신·노동인구 다변화 파악",prompt:"거시적 환경 조사와 미시적 환경 조사에 해당하는 항목을 모두 골라 쓰시오.",answer:"거시적 환경조사: ㉣, ㉤ / 미시적 환경조사: ㉠, ㉡, ㉢",keywords:["거시","미시","법규","전문가","현장"],explanation:"거시: 법·제도·산업구조 등 통제 불가한 외부. 미시: 이해관계자·현장 측정·FGI 등 과제와 직접 맞닿은 환경."},{id:"P-3-05",itemId:"R03",round:"3회",difficulty:"중",points:4,type:"fill",topic:"사용자 관찰조사 · 조사 방법 매칭",passage:"㉠ 공원 이용객 동선·시설물 주변 행동을 비디오로 기록·분석 / ㉡ 조사원이 체험자·관찰자로 나눠 환승 지점→목적지 이동 서비스를 체험·기록 / ㉢ 디지털 안내판으로 목적지 이동 과제를 주고 정보 접근성·사용 용이성·인지성·오류를 분석 / ㉣ 조사원이 관광안내소 직원으로 위장해 방문객을 응대 후 기록",prompt:"㉠~㉣에 해당하는 조사 방법을 쓰시오. (보기: 다이어리 연구, 미스터리 워킹, 서비스 사파리, 인지적 시찰법, 크라우드 소싱, 행위 매핑)",answer:"㉠ 행위 매핑(Behavior Mapping) / ㉡ 서비스 사파리(Service Safari) / ㉢ 인지적 시찰법(Cognitive Walkthrough) / ㉣ 미스터리 워킹(Mystery Working)",keywords:["행위 매핑","서비스 사파리","인지적 시찰법","미스터리 워킹"],explanation:"행위매핑=공간 내 행동 기록, 서비스사파리=조사자가 직접 서비스 체험, 인지적시찰법=과업 수행 중 인터페이스 점검, 미스터리워킹/쇼핑=직원·고객으로 위장 관찰."},{id:"X-01-RV",itemId:"R03",round:"예시",difficulty:"중",points:3,type:"short",topic:"관찰/면접 사전 준비 · 파일럿 테스트",prompt:"인터뷰, 포커스 그룹 인터뷰(FGI), 사용성 평가(UT) 등의 사용자 조사에서 본 조사 전에 파일럿 테스트(Pilot test)를 먼저 하는 이유는 무엇인가?",answer:"질문 문항·진행 절차·소요 시간·도구의 적절성을 미리 점검해 오류와 모호한 부분을 수정하고, 본 조사의 신뢰성과 타당성을 높이기 위해서다. 예상치 못한 문제를 사전에 발견·보완할 수 있다.",keywords:["사전 점검","오류","수정","신뢰성","본 조사"],explanation:"파일럿(예비) 테스트는 본 조사의 리허설로, 질문 흐름·시간·장비를 검증해 본 조사 데이터 품질을 확보한다."},{id:"X-02-RV",itemId:"R03",round:"예시",difficulty:"하",points:2,type:"short",topic:"관찰조사 방법 식별",passage:"H팀원들이 직접 야구장에 가서 조사 대상 가족을 찾아 적당한 거리를 둔 채 따라다니며 지속적으로 관찰하고 그 가족의 생생한 경험을 기록하였다.",prompt:"위와 같은 조사 방법을 무엇이라 하는지 쓰시오.",answer:"섀도잉(Shadowing) / 그림자 관찰법",keywords:["섀도잉","관찰"],explanation:"섀도잉은 사용자를 그림자처럼 따라다니며 자연스러운 맥락에서 행동을 관찰·기록하는 방법이다. 다이어리 조사는 사용자가 스스로 기록한다."},{id:"P-2-06",itemId:"R04",round:"2회",difficulty:"중",points:3,type:"fill",topic:"면접조사 설계 · 표본 선정",passage:"모란민속장 방문자가 인근 거주·40대 이상 중장년/고령층에 한정됨을 확인. 방문자 폭 확대를 위해, 방문을 꺼리는 사용자를 중심으로 FGI를 계획. 응답자 표: ④ 34세 회사원/강원 원주, ⑥ 21세 대학생/충남 천안, ⑨ 28세 무직/경기 의정부 등.",prompt:"응답자 10명 중 3명을 인터뷰 그룹에 선정하려 할 때 번호와 선정 조건을 쓰시오.",answer:"선정: 4, 6, 9. 선정 조건: 타 지역에 거주하는 40대 미만(30대 이하)의 응답자. (나이와 거주지 조건이 포함되어야 함)",keywords:["타 지역","40대 미만","나이","거주지"],explanation:'기존 방문자와 반대되는 특성(비방문 가능성이 높은 젊은 층·타지역)을 표본으로 골라 "왜 안 오는가"를 조명한다.'},{id:"P-2-07",itemId:"R05",round:"2회",difficulty:"중",points:3,type:"mcq",topic:"대상 분석 · 페르소나 작성 원칙",prompt:"페르소나 구성·작성에 대한 설명으로 옳은 것을 모두 고르시오.",options:["㉠ 이미지는 직접 촬영보다 이미지 제공 사이트 이용을 권장한다.","㉢ 나이는 범위보다 특정한 나이를 부여하는 것이 좋다.","㉣ 직업은 페르소나 일상의 패턴을 파악하는 데 유용하다.","㉥ 통계 데이터와 실제 사용자 조사 데이터를 기반으로 작성한다."],answer:"㉢, ㉣, ㉥",keywords:["특정한 나이","직업","데이터 기반"],explanation:"페르소나는 구체적(실명·특정 나이)이고 실제 조사·통계 데이터에 근거해야 한다. 지역도 행동에 영향을 주므로 무시하면 안 된다."},{id:"P-2-08",itemId:"R05",round:"2회",difficulty:"중",points:4,type:"fill",topic:"대상 분석 · 행동 패턴 맵",passage:"행복주택(대학생·신혼부부·사회초년생 대상 공공임대) 입주자 페르소나를 위해 변인을 설정하고 행동 패턴 맵을 작성했다.",prompt:"행동 패턴 맵의 변인(㉠ 인구통계 변인, ㉡ 이용 행태 변인 등)에 들어갈 알맞은 내용을 쓰시오.",answer:"㉠ 가족 규모·거주 인원·가구 형태 / ㉡ 이용 빈도·이용 적극성 / ㉢ 1인 가구 / ㉣ 커뮤니티 활동·교류·단체생활 중시",keywords:["가구 형태","이용 빈도","1인 가구","커뮤니티"],explanation:"행동 패턴 맵은 인구통계·이용행태 등 축(변인)을 설정하고 인터뷰 근거로 사용자 유형을 배치한다."},{id:"P-2-09",itemId:"R09",round:"2회",difficulty:"상",points:3,type:"fill",topic:"시나리오 개발 · 시나리오 3유형",prompt:"맥락 시나리오 / 주요 경로 시나리오 / 검증 시나리오 각각에 해당하는 설명을 보기에서 모두 고르시오.",passage:"㉠ 상세한 과업을 구체적으로 설명 / ㉡ 핵심 인터랙션을 중심으로 상세히 묘사 / ㉢ 페르소나 시각에서 행동·인식·욕구 표현 / ㉣ 사용자 목표를 바탕으로 전반적 콘셉트 묘사 / ㉤ 멘탈 모델·동기 기반으로 행동 상세 묘사 / ㉥ 상세 디자인 과정에서 올바르게 개발되는지 점검",answer:"맥락 시나리오: ㉢, ㉣, ㉤ / 주요 경로 시나리오: ㉠, ㉡ / 검증 시나리오: ㉥",keywords:["맥락","주요 경로","검증","페르소나","점검"],explanation:"맥락=초기 콘셉트·동기 중심, 주요경로=핵심 과업 흐름 구체화, 검증=개발 산출물이 의도대로 되는지 점검."},{id:"P-1-10",itemId:"R05",round:"1회",difficulty:"하",points:5,type:"fill",topic:"사용자 여정 분석 · 고객 여정 지도",passage:"전통시장 개선 프로젝트. 페르소나 나혜선의 고객 여정 지도에서 결제·포장·이동 단계의 불편을 정리한다.",prompt:"고객 여정 지도의 빈칸 ㉠~㉤에 들어갈 알맞은 내용을 쓰시오.",answer:"㉠ 결제(비용 지불) / ㉡ 소량 포장이 어려워 불편(대량 포장만 가능) / ㉢ 현금 결제만 가능해 불편(카드 결제 안 됨) / ㉣ 배달이 안 되어 무거운 짐을 직접 이동 / ㉤ 위치 안내도·시장 지도·안내 표지판",keywords:["결제","포장","카드","배달","안내 표지판"],explanation:"고객 여정 지도는 단계(행동)–접점–감정–페인포인트–개선기회를 한 흐름으로 시각화한다."},{id:"P-1-11",itemId:"R06",round:"예시",difficulty:"중",points:4,type:"fill",topic:"원칙 수립 · 5 Whys & 문제 정의",passage:"문제: 동네 쓰레기 무단 투기 심각. 1Why 분리배출 하기 싫음 → 2Why 귀찮음 → 3Why 방법을 모름 → 4Why 쓰레기별 분리수거 방법을 다 외우기 어려움 → 5Why ( 가 ) / 답변 ( 나 )",prompt:"5 Whys 기법에 맞추어 (가) 다섯 번째 질문과 (나) 그 답변을 기술하시오.",answer:"(가) 왜 사람들은 분리수거 방법을 다 외우기 어려워할까? (나) 분리배출 방법을 쉽게 알려 주는 안내나 정보 제공이 부족하기 때문이다. → 통찰: 쉬운 분리배출 안내 서비스 필요.",keywords:["왜","안내","정보 제공","부족"],explanation:'5 Whys는 "왜"를 반복해 근본 원인에 도달한다. 마지막 답변이 곧 해결의 실마리(인사이트)가 된다.'},{id:"P-1-12",itemId:"R06",round:"1회",difficulty:"하",points:5,type:"fill",topic:"요구사항 정의 · 친화도 분석",passage:"폭염으로 닭 폐사가 증가한 축산농가 프로젝트. 친화도 분석으로 문제점을 4가지로 정리하고 해결책을 제안했다(부정확한 온습도 정보, 발전기 고장, 폐사축 처리, 노하우 공유 미비 등).",prompt:"문제점/문제 정의/서비스디자인 해결책 표의 빈칸에 들어갈 내용을 도출된 문제점을 활용해 쓰시오.",answer:"㉠ CCTV 의존·시설 노후화 등 현장 관리 소홀 / ㉡ 성공 사례·정보 교류·대처법 공유 부족 / ㉢ 기상 정보 확인 어려움 / ㉣ 맞춤형 기상 정보 알림 서비스 / ㉤ 양계 정보 공유 커뮤니티·소통 채널 구축",keywords:["관리 소홀","공유 부족","기상 정보","알림 서비스","커뮤니티"],explanation:"친화도(어피니티) 분석은 산발적 데이터를 유사성으로 묶어 핵심 문제군을 도출하고 해결책과 연결한다."},{id:"X-10-RV",itemId:"R07",round:"예시",difficulty:"상",points:6,type:"essay",topic:"아이데이션 · 콘셉트 제안",passage:"대학·관내 기업·지자체 연계 패션 창업 활성화 과제. 심층 인터뷰 결과 ① 창업 프로세스 로드맵 ② 인력 매칭 ③ 멘토링 ④ 소통·판매의 장, 4개 분야의 필요사항이 도출됨.",prompt:"문제 해결을 위한 서비스디자인 콘셉트/아이디어를 제안하라. (조건: 발견된 문제·필요에 기반 / 하드웨어·소프트웨어·휴먼웨어 복합 / 대학·기업·공공기관 관점 복합)",answer:'예시 콘셉트 "패션 창업 올인원 허브": (소프트웨어) 국가지원·정보·전문가 매칭 플랫폼 앱, (하드웨어) 시제품 제작·검증·판매가 함께 되는 공유 쇼룸·작업 공간, (휴먼웨어) 창업 선배·강소기업 멘토링 크루 운영. 대학(인력·기술)–기업(노하우·판로)–공공(자금·행정)을 연결해 창업 초기~안정기를 지속 지원.',keywords:["플랫폼","공유 공간","멘토링","하드웨어","소프트웨어","휴먼웨어"],explanation:"아이디어는 발견된 페인포인트를 그대로 매핑하고, 3-웨어(HW/SW/HumanWare)와 3주체 관점을 빠짐없이 반영해야 만점에 가깝다."},{id:"P-2-14",itemId:"R08",round:"2회",difficulty:"하",points:4,type:"short",topic:"프로토타입 · 데스크톱 워크
