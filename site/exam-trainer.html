 객체, 사용자를 빠짐없이 기록하고 분석할 수 있게 해준다. AEIOU 항목에\n\n        따라 구조적으로 기록할 수 있으며 관찰된 내용을 각 카테고리별로 분류하고 패턴, 문제점\n\n        또는 기회 요인 파악하는데 활용할 수 있다. 또한 활동(A)과 환경(E)이 상호작용(I)과\n\n        연결되면서 사용자(U)가 어떤 객체(O)들을 어떻게 사용하 는지를 폭넓게 분석하면,\n\n        서비스 흐름과 페인포인트를 더 명확하게 이해할 수 있다. 분석 결과는 아이디어 발상과\n\n        브레인스토밍과정에서 사용자 페인포인트, 개선 아이디어 등을 구체화하는 데 활용되며,\n\n        프로토타입평가 과정에서는 AEIOU를 반복 적용하여 개선 지점을 찾고 수정하는 데\n\n        활용한다.\n\n\n\n\n                                                    서비스·경험디자인 이론서 113\n\fPART 03\n서비스·경험디자인을 어떻게 실행하는가?\n\n\n\n\n114   Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f서비스·경험디자인 이론서 115\n\f01\n준비하기·Align\n이 장에서는 서비스디자인의 요구사항을 파악하고 수행 계획을 수립하는\n방법을 알아본다.\n\n\n\n\n116   Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f1.1 서비스·경험디자인 요구사항 파악\n\n서비스디자인 프로젝트의 시작\n\n이 장에서는 서비스디자인 프로젝트가 어떻게 시작되는지, 서비스디자인의\n본격적인 진행에 앞서 프로젝트 수행을 위해 먼저 계획하고 착수할 것들은\n무엇인지에 대해 알아보자.\n\n준비하기 단계는 영국의 디자인 카운슬이 정의한 더블 다이아몬드 프로세스를\n변형하여 만든 한국디자인진흥원의 더블 다이아몬드 프로세스의 ‘이해하기’\n단계에 해당한다. 한국디자인진흥원에서는 프로젝트 진행을 위한 본격적인\n리서치에 앞서 대상이 될 디자인 분야나 의뢰 기업의 산업 분야를 이해하거나,\n진행될 프로젝트의 성격과 규모를 파악하는 것이 필요하다고 보고 ‘발견하기’\n단계의 앞에 ‘이해하기’ 단계를 상정하고 있다. 프로젝트 계약을 체결하거나,\n디자인 프로젝트의 의뢰자 또는 결정권자의 궁극적인 목표와 기대를 파악하거나\n서비스디자인을 담당할 팀을 구성하 는 등 이 단계에서 이루어지는 업무도\n매우 중요하며, 때로는 이것이 프 로젝트 전체의 성패를 좌우하기도 한다.\n본격적인 리서치에 들어가기에 앞서, 프로젝트 전체의 진행 계획을 수립하고,\n킥오프 미팅을 통해 본격적인 출발을 하는 것도 중요한 과정이다. 이런 점에서\n프로젝트를 준비한다는 것은 프로젝트의 성격을 이해하는 것을 넘어선다.\n\n준비하기 단계에서 무엇을 해야 할지를 살펴보기에 앞서, 서비스디자인의\n의뢰자와 수행자와의 관계에 따라 어떤 유형의 서비스디자인이 있으며, 유형별\n서비스디자인 프로젝트에서 고려할 사항이 무엇인지 살펴보자.\n\n\n\n\n[ 더블 다이아몬드 디자인 프로세스의 이해하기 단계 ]\n\n\n\n\n                                 서비스·경험디자인 이론서 117\n\f                      서비스디자인 프 로젝트는 외부의 의뢰자로부터 서비스디자인을 의뢰받아\n                      수행자가 서비스디자인을 진행하게 되는 경우(①), 의뢰자와 수행자 사이에\n                      정부 기관이나 지자체 등이 개입하여 양자를 연결해주거나 지원하는 방식으로\n                      진행되는 경우(②), 마지막으로 의뢰자와 수행자가 같은 조직 내부에 있어 사내\n                      거래 또는 기관 내 공동창작으로 진행되는 경우(③)로 나누어 볼 수 있다. 여기서\n                      의뢰자와 수행자라는 표현을 사용했지만 개인이 서비스디자인을 의뢰하거나\n                      진행하는 경우는 거의 일어나지 않으며, 대부분 기업이나 기관이 주체가 된다.\n\n\n\n\n                      첫 번째 유형은 의뢰자가 수행자에게 서비스디자인 용역을 맡기는 유형으로서,\n                      서비스디자인 프로젝트가 진행되는 가장 보편적인 경우이다. 이때 의뢰자와\n                      수 행 자 는 민 간 기업인 경 우 가 대 부 분 이 지 만, 의 뢰 자가 정 부 기 관 이 나\n                      지자체처럼 공공 기관인 경우도 있다. 의뢰자와 수행자 간에는 프로젝트 계약을\n                      통해 법적인 보호 장치를 마련한 가운데 프로젝트가 진행된다. 양자는 계약\n                      관계를 형성하고, 보통 의뢰하는 ‘갑’과 수행하는 ‘을’의 관계에서 프로젝트가\n                      진행된다.\n\n                      두 번째 유형은 첫 번째 유형에 중간자로서 개입하는 정부 기관 등이 더해지는\n                      경우이다. 서비스디자인을 의뢰하고자 하지만 정보가 부족하거나 자금 여력이\n                      충 분하지 않은 기업을 위해 정부 부처나 기관이 수행사 를 연결해 주거나\n                      프로젝트비를 정부 지원금 형식으로 지원하는 경우가 여기에 해당한다. 또는\n                      국민디자인단의 사례처럼 중앙 부처가 서비스디자인이 필요한 지역이나 공공\n                      영역을 위해 디자인팀을 구성하여 혁신을 확산하는 모델도 이에 해당한다.\n                      프 로젝트 계약도 의뢰자와 수행자 간의 계약이 아니라, 중간자와 수행자,\n                      중간자와 의뢰자 간의 계약들로 진행되기도 한다. 드물기는 하지만, 민간 기업\n                      내에서도 중간자 역할을 하는 부서가 디자인 과제를 발굴하여 의뢰 부서와 수행\n                      부서를 연결해 주는 경우가 있다.\n\n\n\n\n118   Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f세 번째 유형은 서비스디자인 의뢰자와 수행자가 같은 회사의 각기 다른 부서인\n경우이거나, 같은 그룹 내의 다른 계열사로 존재하 는 경우다. 후자와 같이\n의뢰자와 수행자의 규모가 커지면 같은 계열사라고 하더라도 법인이 달라질 수\n있으므로 독립적인 기관 사이의 계약이 되는 첫 번째 유형과 동일하지만, 전자의\n경우라면 통상적인 인하우스(In-house) 디자인 프로젝트라고 할 수 있다.\n기업이나 기관 내에서 부서 간의 공동창작으로 디자인 프로젝트가 시작되는\n경우에는 사내 협조전 정도의 문서로 프로젝트가 시작될 수도 있으며, 규모가\n작은 스타트업이나 중소기업의 경우에는 담당자 간의 구두 논의로 프로젝트가\n시작되고 진행되기도 한다.\n\n\n\n\n                             서비스·경험디자인 이론서 119\n\f                          제안 요청서\n\n103                       앞선 세 가지 유형 가운데, 의뢰자와 수행자가 서로 다른 조직에 속해 있는\n한국직업능력개발원(2015), 《서비\n스 경험디자인 과제 계획》, pp. 3~6   첫 번째와 두 번째 유형의 경우는 프로젝트 계약서를 체결하게 되는데, 계약\n                          체결에 앞서 서비스디자인 프로젝트의 성격, 책임과 권한 범위를 규정하고 상호\n                          이해를 위하여 제안 요청서 등의 정형화된 문서를 주고받으면서 프로젝트가\n                          시작되는 경우가 일반적이다. 의뢰자와 수행자가 동일한 조직에 속하는 세 번째\n                          유형에서도 프로젝트 계약서는 쓰지 않더라도 프로젝트에 대한 상호이해를\n                          위해 제안 요청서를 작성하는 경우가 생긴다. 그러나 양자가 문서를 통해 소통할\n                          필요성이 낮거나, 상호 간에 충분한 공동창작 경험이 있어 프로젝트 이해도가\n                          높은 경우에는 제안 요청서 등의 문서 작성을 생략하거나 협조전 등의 간단한\n                          서류로 대체하기도 한다.\n\n                          국가 직 무 능 력 표 준디 자 인에 따르면, 제 안 요청 서(RFP: Re quest for\n                          Proposal)란 발주자가 특정 과제의 수행에 필요한 요구사항을 체계적으로\n                          정리하여 제시함으로써 제안자가 제안서를 작성하 는 데 도움을 주기 위한\n                          문서이다. 제안 요청서에는 해당 과제의 제목, 목적 및 목표, 내용, 기대 성과,\n                          수행 기간, 예산, 참가 자격, 제출 서류 목록, 제안 요구사항, 평가 기준 등의\n                          내용이 포함된다.103\n\n                          여기서 의뢰자가 아닌 발주자, 수행자가 아닌 제안자라는 표현을 쓰고 있는데,\n                          이는 수행자의 제안(proposal)에 대해 의뢰자가 용역 발주를 하는 과정으로\n                          프로젝트가 체결되기 때문이다. 제안 요청서는 서비스디자인 분야뿐 아니라\n                          지식서비스 산업 일반에 널리 쓰이는 개념이며, 나아가 산업 영역뿐만 아니라\n                          학술 연구 영역에서도 두루 쓰이는 광범위한 용어다.\n\n                          통상 제안 요청서에 서비스디자인의 목표와 결과물, 프로젝트의 성격 등은\n                          명확하게 규정되어 있는 반면, 이를 어떤 과정과 방법으로 진행할지, 어떤\n                          세부 내용들로 프로젝트가 구성될지에 대해서는 규정되어 있지 않은 편이다.\n                          제안 요청서가 시험 문제라면 제안서는 그에 대한 답안지이기 때문에, 의뢰자,\n                          발주자는 도달해야 할 목표만 제시하고 제안자의 우수한 정답을 기대한다.\n\n\n\n\n120 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                          [ 사전질의서부터 계약 체결까지의 절차 ]\n\n\n\n\n104                       민간 기업 간의 제안 요청서는 발주자와 제안자(즉, 서비스디자인 용역사) 간의\n한국직업능력개발원(2015), 《서비스\n경험디자인 과제 계획》, p. 3, 8     개별적 접촉으로 진행되는데, 제안 요청서를 주고받는 것을 기밀로 처리하는\n                          경우도 많다. 경우에 따라서는 복제 가능한 디지털 파일이 아니라 인쇄본만으로\n                          제안 요청서를 전달하거나 대면 회의에서 인쇄된 문서를 보여 주고 회수해 가는\n                          경우도 있다. 반면, 공공 기관이 제안 요청서의 작성자, 즉 발주처여서 공정성과\n                          공공성이 중요한 경우에는 기관 홈페이지를 통해 공개된 방식으로 입찰 공고를\n                          내어 제안 요청서를 게시하고 제안서를 제출하도록 진행하 는 경우가 많다.\n                          조달청 나라장터가 여기에 해당한다.104\n\n                          사전 질의서\n\n105\n                          제안 요청서 및 제안서 작성에 앞서 사전 질의서를 통해 발주자와 제안자\n한국직업능력개발원(2015), 《서비\n스 경험디자인 과제 계획》, pp. 6~7   사이의 불명확한 이해를 줄여 나갈 수 있다. 사전 질의서(RFI: Request for\n                          Information)란 발주자가 제안 요청서를 작성하기 전에 또는 제안자가 제안서를\n                          작성하기 전에 과제 수행에 필요한 정보를 요청하는 정보 요청서를 말한다.105\n                          사전 질의서는 발주자가 보내거나 제안자가 보낼 수도 있으며, 별도의 양식이\n                          정해지지 않은 한 기업의 자체 양식을 활용할 수 있다. 과제에 관하여 파악하기\n                          어려운 사항이나 불분명한 내용이 있는 경우 사전 질의서를 통해 확인하는 것이\n                          좋다.\n\n\n\n\n                                                          서비스·경험디자인 이론서 121\n\f                    제안 요청서의 상세 내용\n\n                    제안 요청서에는 아래와 같은 내용들이 담긴다.\n\n                    제목 : 과제의 성격을 나타내는 것으로, 목표와 특성이 한눈에 들어오도록 하며\n                    너무 길지 않게 작성하는 것이 좋다.\n\n                    목적 또는 목표 : 목적과 목표는 거의 비슷하므로 굳이 구분해서 쓰지 않아도\n                    무리가 없다. 그러나 목적(purpose)은 과제 수행을 통해 궁극적으로 얻고자\n                    하는 가치를 말하는 반면, 목표(goal)는 구체적이고 확인 가능한 지표에 가깝다.\n                    그런 점에서 목표는 목적을 위한 수단이라고 생각할 수 있다.\n\n                    과업 내용 : 세부 과업 내용은 과제마다 다양하므로 일반화하기 어렵다. 전체\n                    과제를 이루는 하위 구성 요소들이나 목표를 달성하기 위한 단계적 내용으로\n                    이루어질 수 있다. 제안 요청서는 제안자가 어떤 창의적인 방법으로 과제 목표를\n                    달성하겠다고 하는가를 보기 위한 질문지의 성격을 띠므로, 제안 요청서에는\n                    과업 내용을 상세하게 작성하지 않는 경우가 많다.\n\n                    기대 성과 : 과제 수행을 통해 얻을 수 있는 성과물(outputs)이나 그로 인한\n                    결과(outcomes)로서, 정량적으로 평가할 수 있는 형식으로 제시될수록 양자\n                    간에 오해를 줄일 수 있다. 특히 산출물은 디자인 제안 3건, 동영상 형식의\n                    시나리오 2편, 웹이나 앱의 프로토타입 2안 등의 방식으로 수치를 제시하는\n                    것이 일반적이다.\n\n                    수행 기간 : 과제 수행의 시작과 종료까지의 기간이다. 과제에 따라서는 2, 3년에\n                    걸친 다년 과제가 있을 수도 있으나, 대부분 3~6개월인 경우가 많다.\n\n                    예산 : 예산은 간접비(Indirect Cost 또는 경상비)와 직접비(Direct Cost)로\n                    구성되며, 직접비는 연구원 인건비, 연구 집행비(인터뷰비, 실험 참가자 사례비\n                    등), 물품 및 기자재 구입비, 외주 경비 등으로 구성된다. 예산 편성에서는\n                    부가가치세(VAT) 포함 여부를 명확히 하여 양자 간 오해 소지를 없애는 것이\n                    좋다.\n\n                    참가 자격 : 발주자는 제안자의 전문성, 규모, 기업 경영 상태나 재무 건전성\n                    등을 참가 자격으로 제시할 수 있으며, 경우에 따라서는 연구 책임자의 학력\n                    등을 참가 제한 요건으로 제시하기도 한다.\n\n                    제출 서류 목록 : 제안 시 포함해야 할 목록을 제시한다.\n\n                    제안 요청 사항 : 특기할 만한 요청 사항이 있는 경우 기재한다.\n\n                    평가 기준 : 여러 제안자 가운데 경쟁을 통해 제안자를 선정할 경우를 대비해\n                    제안서 평가의 기준을 제시한다. 통상 100%로 구성된 평가 세부 항목들을\n                    제시하는데, 정량 지표와 정성 지표로 구분하여 기준을 수립하는 경우도 많다.\n\n\n\n\n122 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                               제안 요청서와 제안서는 문-답의 성격을 띠므로, 두 문서 간에는 일치하는\n                               내용이 많다. 제목이나 과제의 목적처럼 발주자가 작성한 그대로 제안자가\n                               변경하지 않고 수용해야 하는 내용이 있는가 하면, 예산과 같이 제안자가 임의로\n                               작성해야 하는 내용이 있다. 제안자가 임의로 작성하는 내용에서 제안자의 능력,\n                               장점이 드러나며 발주자는 이를 비교하여 우위를 가늠해 볼 수 있다.\n\n                               아래 그림의 좌측에 위치한 제목, 목적, 참가 자격, 수행 기간 등의 항목은\n                               발주자가 정해 주는 것이므로, 제안자는 제안 요청 타당성 검토를 거쳐 제안서의\n                               제출 여부를 결정할 수 는 있으나, 내용을 바 꿀 수 는 없다. 우 측에 위치한\n                               대표적인 항목으로는 예산이 있다. 예산은 수치로 제시되므로 다른 항목에 비해\n                               명백히 비교되며, 의뢰자가 여러 제안서들을 비교 선택할 때 가장 중요한 기준이\n                               될 수 있는 항목이다. 의뢰자와 제안자 양자 모두 작성에 관여할 항목으로는\n                               과업 내용이나 기대 성과 등이 있다. 발주자가 요청하는 차원에서 기재한 과업\n                               내용과 기대 성과에 더해, 제안자는 자신이 해석한 과업의 구성과 그 수행\n                               방법을 창의적으로 적고 예상외의 기대 성과를 제시함으로써 제안서의 매력을\n                               높일 수 있다.\n\n\n\n\n                               [ 발주자와 제안자가 각자 주로 담당하는 내용 ]\n\n\n\n                               디자인 브리프\n\n106                            제안 요청서 및 제안서와 유사한 성격의 문서로 디자인 브리프(Design Brief)가\nJones W. M., Askland H.\nH.(2012), 《Design Briefs: Is   있다. 디자인 브리프는 디자인 팀이 의뢰자와 협의하여 만드는 문서로서,\nThere a Standard?》\n                               프로젝트에 대한 상호 이해를 명확히 하고 그 진행을 효율적으로 관리하기\n                               위해 만드는 서류이자, 프로젝트 종료 후에는 디자인 결과물을 평가하기 위한\n                               기준으 로 활용되기도 한다.10 6 디자인 브리프에는 프 로젝트명, 목표 시장,\n                               의뢰사 및 산업의 특성, 디자인 과제의 성격과 목표, 결과물의 범위, 일정,\n                               예산, 디자인 팀의 경력과 팀 구성 등이 기재되는데, 정형화된 양식이 있는 것은\n                               아니며 작성자와 시기에 따라 그 내용도 다양하다. 가령 프로젝트가 확정되기\n                               전에 디자인 팀이 작성한다면 디자인 팀의 업무 능력과 기대 효과가 강조될\n                               수 있으며, 의뢰사가 먼저 작성한다면 과제의 원활한 진행을 위해 해당 산업의\n                               특징을 친절히 서술하는 디자인 브리프가 작성될 수도 있다.\n\n                                                               서비스·경험디자인 이론서 123\n\f                        디자인 브리프는 제안 요청서 및 제안서와 유사하지만, 산업 전반에서 쓰이는\n                        용 어가 아 니라, 디 자 인 업계에 서 쓰이는 표현이 자 서류 유형이다. 광고\n                        업계에서는 크리에이티브 브리프(Creative Brief)를 작성하 는데, 디자인\n                        브리프와 유사한 성격과 기능의 문서이다.\n\n                        앞서 디자인 브리프를 제안 요청서 또는 제안서와 유사한 성격의 문서이며\n                        디자인 프로젝트가 시작하기 직전에 작성하 는 문서라고 하였는데, 이와는\n                        다르게 본격적인 디자인 프로세스의 착수 이전이 아니라 문제 발견과 문제\n                        해 결의 중 간, 즉 정의하기(Define) 와 개발 하기(Develo p)의 접 점에 서\n                        만들어지는 문서로 보는 견해도 있다. 리서치 과정을 통해 ‘무엇을 디자인할\n                        것인가’를 명확히 한 후에 디자인 솔루션을 발산적으로 만들어 가기 이전에\n                        디자인의 방향과 목표를 명확히 하기 위해 작성하는 문서로 보는 것이다. 이런\n                        성격의 디자인 브리프는 디자인 팀 내부에서 만들어지고 통용되는 경우가\n                        일반적이다.\n\n\n                        제안 요청 타당성 검토\n\n107\n                        제안자 또는 디자인 용역 수행자는 발주자의 제안 요청서를 검토하여 자사가 이\n한국직업능력개발원(2015), 《서비스\n경험디자인 과제 계획》, p. 12     제안에 응하는 것이 가능할지, 타당할지를 검토한 후 참가 여부를 결정한다.107\n                        민간 기업은 대규모 사업을 수주할 경우, 계약 수주 여부를 결정하는 과정이자\n                        논의체인 수주 가치 평가 위원회(VRB. Value Review Board 또는 PRB.\n                        Project Review Board)를 구성하여 사업 타당성 검토(F/S. Feasibility\n                        Study)를 수행하 는데, 제안 요청 타당성 검토는 이와 비슷한 성격의 검토\n                        과정이다.\n\n                        제안 요청서상의 평가 기준에서 우수한 평가를 받을 수 있는지 판단하기 위한\n                        기준에 해당하는 것으로는 참가 자격 여부, 자격 기준 등 절대적인 기준, 유사\n                        실적, 참여 인력, 기업 경영 상태의 객관적인 기준과, 사업 수행의 전문성, 수행\n                        방안의 적합성, 경쟁 우위 등의 주관적인 기준이 있다.\n\n                        절대적인 기준은 해당 기준을 만족하지 못할 경우 제안서 제출 자격이 부여되지\n                        않으므로, 가장 먼저 검토해야 할 기준이다. 제안사의 업태 구분이나 자격증\n                        소지 여부 등으로 판단하게 되는 참가 자격 및 자격 기준이 이에 해당한다.\n                        경우에 따라서는 과제 진행 책임자가 박사학위자일 것을 요구하기도 한다.\n                        민간 기업은 애초에 제한된 범위를 대상으 로 제안 요청서를 내는 경우가\n                        일반적이므로 참가 자격에 제한을 두지 않지만, 공공 기관의 경우에는 모든\n                        제안자에게 공개되므로 참가 자격 기준을 상세하게 게시한다.\n\n\n\n\n124 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f객관적인 기준은 수치로 비교가 가능하므로 발주자가 여러 제안서를 비교하여\n평가 하기에 용 이한 기준 이 된다. 각 객관적 기준의 여러 항목 점수 들 을\n지수화하여 합산하므로 정량적 평가 항목이라고 부르기도 한다.\n\n유 사 실 적 은 해당 과제 를 잘 수행 할 수 있 는지, 제 안자 의 업 무 능 력이\n충분한지를 파악하기에 좋은 지표다. 과제 건수나 과제 수행비의 합산 총액으로\n제출하며, 이를 통해 발주자는 제안자의 과제 수행 능력을 가늠해 볼 수 있다.\n참여 인력은 과제에 어느 정도 수준의 인력이 몇 명 투여되는지를 보여 준다.\nNCS 직무 기준으로는 총괄 디렉터, 수석 디자이너, 책임 연구원, 선임 연구원,\n주임 연구원으 로, 전문 인력 등 급 기준으 로는 책임 연구원, 연구원, 연구\n보조원, 보조원으로 경력을 나눈다. 참여 인력의 수준은 객관적인 기준인 학위를\n기준으로 책정하 는 것이 일반적이지만, 전공 분야와 해당 분야에서의 경력\n기간이나 주요 실적이 더 중요하다. 기업 경영 상태는 기업 신용 평가 등급이나\n재무제표 로 확인한다. 제안 기업 입장에서 발주 기업의 경영 상태는 매우\n중요하지만, 그 반대는 상대적으로 덜 중요하므로 이것이 결정적인 기준이 되는\n경우는 적다. 이상의 기준은 객관적, 정량적 기준이지만, 절대적인 기준으로\n바뀌기도 한다. 가령 유사 실적이 없으면 참가를 제한하거나, 기업 경영 상태\n등급이 일정 수준 이상인 경우에만 참가하게 할 수 있다.\n\n주관적 기준은 수치화하기는 어렵지만 과제를 얼마나 잘 수행할지, 수립한\n수행 방안이 적절한지 등 과제 수행의 본질적 가치와 관련된 기준이므로 가장\n중요한 기준이라고 할 수 있다. 사업 수행 전문성, 수행 방안 적합성 등이 이에\n해당하는데, 그 구체적인 내용은 제안서 작성과 이어지므로, 제안 요청 타당성\n검토 단계에서는 발주자가 매력적으로 느낄 만한 전문성이나 적합성을 제시할\n수 있는가를 자체 점검하면 된다.\n\n이상의 검토를 거쳐 제안사 는 이 제안에서 타 제안사 대비 경쟁력을 갖고\n있는지, 자사가 과제를 수행하는 것이 가능한지, 유익한지 등을 종합적으로\n판단하여 결정한다. 제안자 입장에서 볼 때 제안 요청 타당성 검토는 제안서를\n작성하는 것과 명확히 구분되지 않는다.\n\n\n\n\n                                서비스·경험디자인 이론서 125\n\f                          요구사항 문서의 실패\n\n                          의뢰자와 수행자 간에 의사소통은 상기한 바와 같이 제안 요청서와 제안서를\n                          바탕으로 이루어지는 것이 일반적이다. 이러한 문서상의 소통은 해석의 혼란을\n                          줄일 수 있고, 문서 작성 과정을 거치면서 과제가 무엇인지에 대해 명확한\n                          이해를 확보할 수 있다는 장점이 있다. 그러나 잘못 진행될 경우 단점도 발생할\n                          수 있다.\n\n108                       제 안 요청 서와 유 사 한 성격의 문서 로 요구사 항 10 8 문서가 있 는데, 이는\nMarketing Requirements\nDocument, Product         소프트웨어 개발 분야에서 개발을 요청하는 고객(사)이나 사용자의 요구사항을\nRequirements Document,\nSoftware Requirements\n                          문서화한 것이다. 요구사항 문서는 90년대 소프트웨어 개발기에 적합했던\nSpecification, User\n                          폭포수 모델(Waterfall Model)에 근거한 개발 방식으로, 오늘날에는 적용하기\nRequirements 등으로 부르기도 한\n다.                        어렵거나 비효율적이라는 지적이 있다.109 이러한 문서는 향후 일어날 모든\n\n109                       사태를 예측할 수 있고 업무의 우선순위가 바뀌지 않는다는 가 정 하 에서\n피터 사보(2019), 《사용자경험지도》,\n                          출발하는데, 현실은 이러한 전제에 맞지 않아 폭포수 모델에 기반한 문서를 통한\n에이콘출판\n                          소통 방식은 원활하지 않은 의사소통, 협업 부족, 이해 부족을 초래할 수 있다는\n                          것이다. 이러한 배경에서 보다 유연하고 효율적이며 기민한 태도를 강조하는\n                          애자일(Agile) 프로세스 또는 린(Lean) 프로세스가 제기되었다.\n\n                          2001년에 발표된 애자일 선언(Agile Manifesto)은 ‘포괄적인 문서보다\n                          작동하는 소프트웨어를, 계약 협상보다 고객과의 협력을, 계획을 따르기보다\n                          변화에 대응하기를 더 가치 있게 여긴다’고 주장한다. 애자일은 소프트웨어\n                          개발 사 내 에 서의 부 서 간 커 뮤 니 케이 션 을 전 제 로 하 는 방 법 론 이며 린\n                          프로세스는 스타트업이 처한 역동적인 비즈니스 환경을 전제로 하는 경향이\n                          있으므로, 독립적인 기업 간의 계약을 대체할 수는 없으며 제안 요청서 및\n                          제안서와 동등한 성격의 문서가 아니다. 그러나 제안 요청서나 제안서 위주로\n                          진행하 는 업무 처리가 자칫하면 경직되고 비효율적일 수 있음을 지적하 는\n                          주장이라는 점에서 한번쯤 생각해 볼 필요가 있다.\n\n\n                          제안 요청서가 없는 경우의 서비스디자인\n\n                          제안 요청서가 없이 서비스디자인이 진행되는 경우도 적지 않다. 서비스디자인을\n                          담당할 인력이 자체 내에 있으면서 회사 규모가 크지 않은 경우, 제안 요청서에서\n                          다룰 내용이 검토되더라도 문서로 작성되거나 문서를 주고받는 일은 없을 수도\n                          있기 때문이다. 그러나 이 경우에도 제안 요청서 상의 내용들은 검토되어야\n                          하며, 제안서에 담겨야 한다. 그 검토의 구체적인 내용과 과정은 다음 절에서\n                          다룬다.\n\n\n\n\n126 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                        1.2 서비스·경험디자인 수행계획 수립\n\n                        제안서에는 프로젝트의 제목, 목적 또는 목표, 과업 내용, 기대성과, 수행기간,\n                        예산 등이 기재된다. 이 중 제목, 목적, 수행 기간 등 의뢰자가 주로 결정하는\n                        내용들은 앞서 3.1.1 항에 서술한 바와 같다. 여기서는 견적서와 프로젝트 내용\n                        및 진행 방법, 팀 구성, 프로젝트 공간 등을 자세히 다룬다.\n\n\n                        견적서 산출\n\n110                     견적서는 아직 발생하지 않은 거래에 대해 각종 경비를 포함한 필요한 가격을\n한국직업능력개발원(2015), 《서비스\n경험디자인 과제 계획》, p. 50     예상해서 산출하고, 그 구체적인 내용을 기재한 서류를 말한다.110 견적서는 제안\n                        요청서의 ‘예산’과 동일하며, 제안서와 함께 제출하지만 제안서 항목의 일부로\n                        포함하지 않고 별도의 문서로 만드는 것이 일반적이다. 예산은 거래를 하지\n                        않는 프로젝트여도 편성해야 하지만, 견적서는 공급자와 발주자 간의 거래로\n                        진행되는 프로젝트에 한해 작성된다. 견적서는 거래를 전제로 하기 때문에\n                        발행 번호, 작성 일자, 유효 기간을 명시하는 것이 좋고, 공급자(제안자) 측의\n                        결재를 완료하여 송부한다. 견적서의 최종 합계 금액에 부가가치세(VAT)가\n                        포함된 것인지 아닌지를 명확히 기재하여 오해를 피하는 것이 좋다. 또한 지급\n                        방법(원화/달러, 현금/어음 등)과 지급 기일(선급금, 중도금, 잔금 등)도 명확히\n                        해 분쟁의 소지를 없애야 한다. 공공 기관을 대상으로 견적서를 작성하 는\n                        경우에는 일반 견적서 외에 산출 내역서를 제출해야 하는 경우도 있다.\n\n\n                        프로젝트 계획 수립\n\n                        프로젝트의 과업 내용과 진행 방법을 결정하고 프로젝트 계획을 수립하기\n                        위해서는 프로젝트의 성격이 무엇인지 파악해야 한다. 그리고 이를 위해서는\n                        혁신성의 정도, 결과물의 유형, 가용할 수 있는 자원, 권한 및 제한점, 기술적인\n                        이슈, 이해관계자 등 다음과 같은 여러 사항들을 검토할 필요가 있다.\n\n\n                        혁신성의 정도\n\n                        과제를 통해 개선할 대상이 완전히 새로운 제품 또는 시스템인지 아니면\n                        부분적이고 표피적인 변화에 그치는 것인지를 파악해야 한다.\n\n                        새로운 시장, 새로운 기능, 새로운 니즈를 염두에 둔 혁신 상품(Really New\n                        Product: RNP)이라면 직접적으로 참고할 만한 상품 기획 자료가 없으므로,\n                        탐색적인 차 원의 리서치부터 방대하게 진행할 필요가 있다. 이렇게 되면\n                        더블 다이아몬드 프로세스의 Discover, Define으로 이루어지는 첫 번째\n                        다이아몬드의 진행이 중요하고 비중도 커진다. 한국디자인진흥원은 상품 기획\n\n\n\n                                                       서비스·경험디자인 이론서 127\n\f111                          기본형 프로세스를 기회 도출, 아이데이션 & 콘셉트 빌딩, 시각화, 사업화 등의\n한국디자인진흥원. 신상품 기획 프\n로세스 (https://process.kidp.   4단계로 제시하고, 이를 다시 산업 경쟁 분석, 트렌드 분석, 사용자 분석, 기회\nor.kr/front/user/main.do)\n                             영역 정의, 아이디어 개발, 콘셉트 작성 및 선정, 디자인, 사업화 검토의 8개\n                             주요 활동으로 제시한 바 있는데,111 혁신성이 강한 신상품일수록 앞 단계인 기회\n                             도출 단계가 중요하다.\n\n\n\n\n                             반면, ‘20**년형 자동차 디자인’처럼 외형상의 부분적인 변경(Facelift Model\n                             Change)을 추구하는 경우라면 디자인 프로젝트는 더블 다이아몬드 모델의 두\n                             번째 다이아몬드에 집중되어 진행된다. 이에 따라 프로젝트 진행에 걸릴 시간,\n                             투여할 인력의 특성과 비용 등이 영향을 받는다. 프로젝트의 목표가 좁은 의미의\n                             디자인, 외형적인 디자인에 집중된다면 리서치 기간을 줄이거나 생략하고\n                             스타일링 디자인에 능한 인력 위주로 프로젝트팀을 구성하는 것이 유리하다.\n\n\n                             결과물의 유형\n\n                             프 로젝트를 통해 최종 적으 로 만들어 내야 할 결과 물의 유형도 프 로젝트\n                             계획을 세울 때 매우 중요하게 고려된다. 결과 물이 물리적 제품(Physical\n                             Product)인지, 디지털 제품(Digital Product)인지, 서비스(Service)인지,\n                             이들이 통합된 시스템(System)인지에 따라 서비스디자인 프로세스에서 적용할\n                             방법들이 달라진다. Discover와 Define 단계에서 진행할 리서치 방법과\n                             분석 방법도 영향을 받지만, 더 직접적으로는 Develop와 Deliver 단계의\n                             진행 과정과 방법에서 큰 차이가 난다. 물리적 제품이라면 라이노 3D나 3ds\n                             Max 등과 같은 3D 모델링 툴로 설계한 후 렌더링을 하는 과정을 거치는 반면,\n                             디지털 제품이라면 Sketch, Adobe XD, Figma 등의 사용자 인터페이스\n                             프 로 토타이핑(UI Protot yping) 툴로 사 용자 인터페이스 화면을 그리고,\n                             마이크로 인터랙션과 정보 구조, 내비게이션 방법을 설계하므로, 프로젝트팀\n                             구성과 진행 방법이 확연히 달라진다.\n\n\n128 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                                 또한 결과물이 무엇인지에 따라 Deliver 단계에서 적용가능한 테스트 방법이\n                                 달라지게 된다. 눈으 로 보 고 손으 로 만지는 것으 로 충 분히 평가가 가 능한\n                                 물리적 제품과 화면을 조작하면서 인지적인 판단을 해야 하는 Web/App, 여러\n                                 사람들의 사회적 상호작용을 고려해야 하는 커뮤니티 서비스는 서로 다른 평가\n                                 방법을 적용해야 한다.\n\n\n                                 자원\n                                 프로젝트 계획을 수립하기 위해서는 디자인 수행사 또는 담당 부서가 가용할\n                                 수 있는 자원이 어느 정도인지를 먼저 산출해 봐야 한다. 이 프로젝트를 얼마\n                                 동안 진행할 수 있을지, 얼마나 많은 예산을 투여할 수 있는지(외부의 의뢰사와\n                                 용역 계약을 맺고 진행하는 프로젝트라면 프로젝트 용역비로 얼마를 받을 수\n                                 있는지), 어떤 인원들이 몇 명이나 참여할 수 있는지를 따져봐야 한다. 예산(또는\n                                 용역비)에 따라 투입할 수 있는 인력과 기간이 변동될 것이므로, 자원 문제는\n                                 서로 연결되어 있다. 투여할 수 있는 인력이나 기간이 제한된다면 이를 토대로\n                                 예산을 결정할 수도 있다.\n\n\n                                 권한 및 제한\n112                              프로젝트 진행에 있어서 프로젝트 진행팀이 가질 수 있는 권한이 어느 정도인지\nBryan Lawson(2006), 《How\ndesigners think: the design      제한점은 무엇인지를 파악해야 한다. 서비스디자인 프로젝트의 목표를 바꿀\nprocess demystified》, Elsevier\n                                 수도 있는 근본적인 권한이 있는지, 결정된 범위 안에서 서비스 접점을 수정하는\nBurlington.\n                                 정도에 그쳐야 하 는지에 따라 프 로젝트의 계획은 크게 좌우된다. 제한은\n                                 디자인 프로젝트를 진행하면서 지켜야 할 규정이나 법규, 제도 등을 말하는데,\n                                 가이드라인과 같이 완화된 수 준의 제한점도 있다. 브라이언 로슨(Br yan\n                                 Lawson)은 건축디자인 프로세스를 토대로 디자인 분야에서 사용 가능하게\n                                 고안한 디자인 제한점 모델에 입법자(legislator)를 포함한 바 있다.112 권한과\n                                 제한에 따라 디자인 프로젝트의 범위(scope)가 정해지며, 그에 따라 프로젝트\n                                 내용과 방식이 영향을 받는다.\n\n\n                                 기술적인 이슈\n                                 서비스디자인 프로젝트의 상당수는 기술적인 이슈(Technical Issues)에\n                                 따라 좌우된다. 특히 IT 기술, AI 기술에 기반한 사용자 경험디자인/사용자\n                                 인터페이스 디 자 인(U X /UI디 자 인 )의 경 우, 기술 요인에 따 라 솔루 션이\n                                 가능하기도 하고, 제한되기도 한다. 따라서 프로젝트의 내용과 진행 방법을\n                                 결 정하기 위해 서 는 본 격 적인 리 서치에 앞서 제 안서 작성 단계에 서 부터\n                                 기술적인 이슈에 대해 조사해야 한다. 특히 의뢰자가 기술 회사(Technology\n                                 Company)라면 기술 이슈에 대해 이해가 부족할 경우, 의뢰사의 신뢰를 얻기\n                                 어렵다.\n\n\n                                                                  서비스·경험디자인 이론서 129\n\f                    이해관계자 조사\n\n                    서비스디자인 분야 에서 이해관계자 (Stakeholders)란 제품 및 서비스의\n                    고객, 사 용자, 구 매 자, 서비스 의 제 공자, 종업원 은 물 론 서비스 의 전 체\n                    과정에 관련되는 인프라 운영자, 정부 기관과 관련 단체, 시민사회 등 관련된\n                    모든 사람들 을 의미한다. 이해관계자 에 대한 본 격적인 분 석, 이해관계자\n                    지도(Stakeholders Map) 작성은 리서치 단계에서 진행되지만, 프로젝트가\n                    정식으로 시작하기 이전 단계에도 프로젝트 준비를 위해 이해관계자를 간략히\n                    조사할 필요가 있다. 이때의 이해관계자는 의뢰자 측 또는 해당 산업 분야의\n                    영업부서나 개발자, 분야 전문가 등 프로젝트 수행에 영향을 주는 사람들이나\n                    프로젝트 계획 수립에 필요한 정보를 줄 수 있는 사람들로 한정하는 것이 좋다.\n                    이를 통해 프로젝트의 취지나 궁극적인 목적, 프로젝트를 통해 얻고자 하는 것이\n                    무엇인지를 보다 정확히 이해할 수 있다.\n\n\n                    프로젝트 과업 내용과 진행 방법\n\n                    이상의 과정을 거쳐 프로젝트의 과업 내용과 진행 방법, 일정을 수립할 수\n                    있다고 판단되면 상세하고 구체적인 계획을 수립한다. 과업 내용과 진행 방법,\n                    일정은 서로 긴밀히 연관되어 있다. 프 로젝트 수행은 단계적, 독립적으 로\n                    나눌 수 있는 여러 과업 내용들로 구성된다. 이 과업 내용들은 일반적으로\n                    디자인 프로세스를 따르며 보다 구체적인 방법과 단계로 구성된다. 인터뷰와\n                    유저 다이어리로 Discover 단계가 이루어지듯이 계층적인 구성을 이룰 수\n                    있고, 현장 방문 조사가 이루어지는 동안 전문가 인터뷰를 위한 리크루팅이\n                    이루어지듯이 병렬적으로 수행될 수 있다. 각 단위 내용의 원활한 수행을 위해\n                    가용 인원을 토대로 효과적이고 타당한 서비스디자인 방법론을 선택해야 하며,\n                    이때 소요될 예산까지도 짜야 한다. 이렇게 완성된 프로젝트 진행 계획은 실제\n                    진행 과정에서 변경될 수 있겠으나, 제안서 발송 전에 일단 완료하는 것이 좋다.\n                    과업 내용-방법-일정이 결정되면 제안서 작성의 주요 내용은 다 완결된 셈이다.\n                    발주자에게 보내는 제안서에서만 별도로 프로젝트 진행 계획서를 보다 간략하고\n                    안전하게(보수적으로) 작성할 수도 있지만, 이 과업 내용을 토대로 프로젝트팀\n                    자체의 계획을 운영하는 것이 좋다.\n\n\n\n\n130 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                           프로젝트팀의 구성\n\n                           프 로 젝 트팀 구 성 은 프 로 젝 트 의 예 산 과 기 간 은 물 론 내 용 과 도 긴밀 히\n                           연결되는 것으 로 서, 프 로젝트의 성패를 결정하 는 가 장 중요한 요인일 수\n                           있다. 서비스디자인은 결국 사람이 하는 것이기 때문이다. 팀은 프로젝트를\n                           수행하기에 충분한 동시에 기민하게 운영할 수 있는 적정 규모로 구성해야 하며,\n                           서로 다른 분야의 전문가들이 능력을 발휘할 수 있는 융합적인 팀으로 구성하는\n                           것이 바람직하다.\n\n                           융합적인 팀은 다학제적인(multi-disciplinary) 팀이기도 하다. 융합 팀의\n                           범위를 어떻게 구성할 것인지는 결과물이 무엇인가와 어떤 방법으로 프로젝트를\n                           진행할 것인가에 따라 좌우된다. 결과물과 과정에 따라 개발자가 결합할지,\n                           기획자가 반드시 참여해야 하 는지 등이 결정된다. 융합 팀의 최소 구 성은\n                           기획자, 디자이너, 개발자가 각각 1명씩 참여하는 것이다. 규모가 작고 업무의\n                           범위가 고정되지 않은 스타트업이라면 이 정도의 작은 팀으로도 프로젝트가\n                           진행될 수 있고, 오히려 기민하게(lean) 움직일 수 있는 장점이 있다. 스타트업이\n                           아닌 일반적인 규모의 서비스디자인 프로젝트라면 디자인 팀과 외부의 협력자로\n                           구성될 수 있다. 서비스디자인 전문 회사가 외부의 의뢰를 받거나 기업이나 기관\n                           내부의 서비스디자인 부서가 프로젝트를 진행하는 경우가 여기에 해당한다.\n\n113\n                           내부 디자인 팀은 팀 리더, 디자인 리서치 전문가, 디자인 전문가(시각디자인,\n킴 굿인(2013), 《인간 중심 UX 디자\n인》, 에이콘. 송유미 역.            산 업디 자 인, 공 간 디 자 인, 인터페이스디 자 인 등), 서비스 기획 자 등으 로\n                           구성된다. 이때, 팀 내부에 발산적 사고를 잘 하는 제너레이터와 수렴적 사고를\n                           잘 하는 신시사이저가 따로 있으면 더욱 좋다.113 긴밀하게 움직일 내부 디자인\n                           팀의 외부에는 이를 도와줄 공동 창작자가 있는 것이 이상적이다. 디자인할\n                           상품이나 기획 전체의 프로젝트 책임자, 해당 분야의 영역 전문가(Domain\n                           Expert), 개발자(Programmer 또는 엔지니어), 시장 분석 전문가, 사용성\n                           전문가 등이 그런 사람들이다. 서비스디자인 팀 외부에는 경영진이나 영업부서\n                           등의 이해관계자가 있다. 이들은 프로젝트 진행을 도와줄 수도 있고, 영향을\n                           미칠 수 있으며, 결과를 보고받는 의사 결정권자일 수도 있다.\n\n\n\n\n                                                              서비스·경험디자인 이론서 131\n\f                         [ 프로젝트팀의 구성 ]\n\n\n\n\n114                      프로젝트팀을 융합적으로 구성하는 것이 이상적이지만, 이것이 현실적으로는\n배성환(2017), 《처음부터 다시 배우\n는 서비스디자인 씽킹》, 한빛미디어      어려울 수 있다. 다양한 분야의 인력을 확보하지 못해서일 수도 있지만, 서로\n                         다른 업무 스타일과 문화에 익숙한 사람들이 한 팀을 이룰 경우 팀워크가\n                         만들어지기 어렵기 때문이기도 하다. 팀워크의 문제는 같은 전공 분야의\n                         사람들로 구성된 팀에서도 발생할 수 있다. 적극적이고 리더십이 강한 팀원이\n                         좋지만, 그런 팀원들을 그냥 모아 두면 오히려 강한 개성끼리 부딪칠 수도 있다.\n                         그렇기 때문에 팀 리더는 팀원 간의 업무 범위를 지정하고 조율하는 프로세스\n                         퍼실리테이터가 되어야 하며, 때때로 갈등 을 해결하고 팀원들에게 열정을\n                         불어넣어야 하는 어려운 책무를 부여받는다.114 이를 위해 하향식 팀 구성이\n                         아니라 팀원들이 팀 리더를 결정하는 상향식 팀 구성을 권장하는 의견도 있다.\n                         그러나 실제의 팀 구 성은 기업이나 단체가 가 용할 수 있는 인력의 제한을\n                         받으며, 하향식으로 결정되는 경우가 더 일반적이다.\n\n                         지금까지 팀의 구 성에 대해 다뤘는데, 무엇보다도 중요한 것은 팀이 어떤\n                         사람들로 구성되었는가뿐만 아니라 어떻게 운영되느냐이다. 유능한 팀원들로\n                         구성된 팀이라고 해서 항상 성공적으로 운영되지는 않는다. 팀원 전원의 강한\n                         리더십은 팀 전체로서는 오히려 마이너스 요인이 되기도 하기 때문이다. 서로\n                         다른 팀원들이 모여 시너지 효과가 발생할 수 있도록 세심한 노력과 조화로운 팀\n                         운영 노하우가 필요하다.\n\n\n\n\n132 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                                  계약서 체결\n115\n                                  프 로젝트 진행에 대해 발주자와 제안자가 합의하면 문서로 계약서 2부를\n한국디자인진흥원. 디자인권리보호\n(https://drights.kidp.or.kr/10_   작성하고 날인한 후, 각자 보관하여 합의한 계약 사항을 법으로 보호받을 수\nMenu/main.asp)\n                                  있도록 한다. 계약서는 법적 효력을 갖는 문서이므로, 기업의 경우 법무팀의\n                                  검토를 거쳐 계약서 체결이 진행된다. 서비스디자 인 수행 자 인 대부 분의\n                                  디자 인 전문 회 사 는 자체에 법무팀을 둘 정도 로 규모가 크 지 않으 므 로,\n                                  한국디자인진흥원은 산업통상자원부 고시로 4가지 종류의 디자인 용역 표준\n                                  계약서를 제공하여 디자인 전문 회사를 지원하고 있다.115 표준 계약서 본문에는\n                                  계약명, 계약 기간, 계약 금액, 지급 방법, 용역의 결과물, 결과물의 지식재산권,\n                                  특약 사항의 계약 내용과 계약의 양 주체인 발주 기업과 디자인 기업, 첨부 서류\n                                  목록이 기재되어 있어 계약에서 점검해야 할 사항들을 한눈에 파악하게 해준다.\n                                  이외에도 디자인분쟁조정위원회, 디자인법률자문서비스, 디자인공지증명 등\n                                  디자인 권리 보호를 위한 여러 지원 제도를 운영하고 있다.\n\n                                  계약서 체결이 완료되면 그 이후로는 공식적인 프로젝트 기간에 돌입한다. 통상\n                                  프로젝트가 시작되면 킥오프 미팅을 통해 프로젝트와 관련된 의뢰자와 수행자\n                                  양측을 같은 시간, 장소에 모이게 해 상견례를 나누고, 프로젝트의 목적, 범위,\n                                  대략적인 방법론을 공유하고, 질의응답과 논의를 거쳐 프로젝트 이해를 높이고,\n                                  성공적인 진행을 위한 의지와 신뢰 관계를 확인한다.\n\n\n\n\n                                                                 서비스·경험디자인 이론서 133\n\f                    [ 한국디자인진흥원의 표준 계약서(전문) ]\n\n\n\n\n134 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                         프로젝트 진행 공간\n\n                         프로젝트에 따라 프로젝트 진행 공간을 새롭게 만드는 경우는 흔치 않다. 디자인\n                         전문 회사든 디자인 부서든 그 회사와 부서가 사용하는 공간은 물리적으로\n                         결정되어 있고, 관습적으로 사용하던 공간에서의 행동 습관이 이미 기업 문화로\n                         자리잡고 있을 가능성이 높다. 그렇기 때문에 프로젝트 공간의 중요성을 느끼고\n                         그 효과를 높이기 위해 공간을 새롭게 기획하기는 어렵다.\n\n116                      그러나 공간은 혁신의 베이스캠프가 될 수 있다.116 만약 프로젝트를 위해 새롭게\n배성환(2017), 《처음부터 다시 배우\n는 서비스디자인 씽킹》, 한빛미디어      공간을 구성할 수 있다면 좋은 기회가 될 것이다. 프로젝트 공간은 개인 작업과\n                         팀 작업이 유연하게 진행될 수 있어야 하며, 창조적인 분위기에서 소통하기에\n                         좋은 공간이어야 한다. 화이트보드 벽과 같은 작업 공간이 있으면, 리서치를\n                         통해 얻은 자료들을 쏟아놓고 팀원들과 대화하면서 창의적인 발상이 떠올랐을\n                         때 손쉽게 스케치하거나 메모하기에 유리하다. 즐겁고 편한 공간, 자유로운\n                         공간에서 아이디어가 발산되는 것은 당연하다.\n\n                         프로젝트를 위한 업무의 연속성이 공간에 반영되는 것도 중요하다. 업무 공간을\n                         깨끗이 사용하는 것도 필요하겠지만, 다른 일로부터 독립된 해당 프로젝트\n                         전용의 공간이 있고, 그 공간에는 인터뷰로부터 얻은 어피니티 노트, 구축한\n                         페르소나 포스터, 프로젝트의 목표 등이 상시 게시되어 있으면 프로젝트 진행\n                         공간 에 들어서는 것만으 로 도 프 로젝트에 대한 몰입도가 높아 질 수 있다.\n                         팀원 서로의 공간을 적절히 가 깝게 배치하 는 것도 유용하다. MIT 토머스\n                         앨런(Thomas Allen) 교수는 거리가 멀수록 의사소통 빈도가 줄어들어 거리가\n                         15m가 넘으면 1주일 내 의사소통 가능성은 5% 미만으로 떨어진다는 알렌\n                         곡선(Allen curve)을 발견한 바 있다. 이 수치는 다소 달라졌지만 이메일,\n                         인스턴트 메신저가 발달한 오늘날에도 거리와 의사소통의 반비례 관계는 여전히\n                         작동한다. 프로젝트 준비하기 단계에서 프로젝트 공간을 잘 확보하는 것이\n                         활기찬 팀워크를 만들기 위한 물리적 기초임을 유의해야 한다.\n\n\n\n\n                                                        서비스·경험디자인 이론서 135\n\f02\n발견하기·Discover\n기초 데스크 리서치, 환경조사방법과 이해관계자 분석, 설문, 인터뷰, 관찰 등\n서비스디자인 조사 방법에 대해 알아본다.\n\n\n\n\n136 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f     2.1 서비스·경험디자인 환경조사\n\n     2.1.1 데스크 리서치(Desk Research)\n정의   관찰 조사를 하기에 앞서 관련 문헌을 연구하거나 인터넷 검색 등을 통해서\n     정보를 수집, 분석하는 작업을 의미한다.\n\n     자료 수집 방법\n     1. 미디어를 통한 자료 수집: 접근성이 높아서 알고자 하 는 내용을 빠르게\n       포착하는 데 유용함\n     2. 출판물을 통한 자료 수집: 전문적이고 신뢰할 수 있는 공신력 있는 정보를\n       수집하는 데 적합함\n\n\n             종류                           내용\n\n\n           언론 보도 자료           신문 방송 등의 관련 분야 기사 및 보도 내용\n\n\n\n           인터넷 자료               검색 브라우저를 통한 국내외 관련 자료\n\n\n                               유사 서비스 관련 현황 보고서, 조사 업체\n           조사 업체 자료\n                                    공개 자료 및 판매 자료\n\n\n           관련 연구 자료              기관, 학계 및 기업의 관련 연구 자료\n\n\n                                해당 분야 관련 기관(협회 등)의 간행물,\n           도서·논문 자료\n                                   관련 학회 논문 및 학위 논문\n\n\n           법령·지침 자료           관련 법규 및 조례, 규정, 매뉴얼, 가이드라인\n\n\n     [ 데스크리서치를 통해 수집한 자료의 종류 및 내용 ]\n\n\n\n\n목적   대상 서비스 와 관련된 외부 상황 (트렌드, 시장 · 정책 환경 변화)으 로부터\n     서비스의 내부 상황(조직, 협업 구조, 서비스 시스템)에 이르기까지 광범위한\n     이해를 바탕으로 대상 서비스가 놓여 있는 맥락적 상황을 파악하는 것을 목표로\n     한다.\n\n     - 대상 서비스가 놓여 있는 맥락적 상황을 파악함\n     - 관련 콘텐츠 및 서비스 영역과 그 특성을 깊이 이해함\n     - 전문가 인터뷰를 위한 질문 작성에 유용함\n     - 사용자 조사에서 얻은 자료를 분석하기 위한 기반 자료\n\n\n\n\n                                            서비스·경험디자인 이론서 137\n\f수행 과정               1. 수행 계획 수립 : 수집할 자료의 목록 및 수집 방법 결정\n                    2. 자료 찾기: 해당 서비스 주제와 관련하여 전문가 등이 자주 언급하는 이슈나\n                       화제(topic)를 중심으로 단어를 추출하여 최신순으로 검색 후 분야별로\n                       목록 제작\n                    - 주제어 등 분류 기준 폴더별로 조사 자료 정리\n                    - 신뢰성 확보 및 연구 윤리 차원에서 자료의 출처 확인 및 인용 표기 숙지\n                    3. 자료 정리: 수집한 자료가 주제와 관련한 것인지, 과제 진행에 도움이 되는지\n                       등을 점검하고 저장\n                    4. 자료 공유: 정리된 자료는 내부 팀원들과 공유하고 일반 공개가 필요할 시\n                       온라인 게시를 통해 공유\n\n\n\n구성 요소               • 서비스 배경\n                    • 제공되고 있는 서비스 상황(사용자 반응, 결과, 영향 등)\n                    • 중요한 이해관계자\n                    • 제공되는 서비스에 영향을 주는 기술\n                    • 새롭게 등장하고 있는 서비스 접점(모바일 애플리케이션, SNS 등)\n                    • 경쟁 구도, 경쟁 서비스 또는 제품\n\n\n\n\n                    A. 사전 조사(Preparatory Research)\n\n정의                  실제 연구나 현장 작업을 시작하기 위한 준비 작업으로 연구 문제의 답을 찾는\n                    것이 아니라 연구 수행 과정에 필요한 올바른 질문을 찾기 위한 과정이다.\n\n\n배경                  사 전 조 사 의 결 과 는 연 구 에 대한 구체 적인 질 문 을 구 성하거나 가 설 을\n                    공식화하는 데 도움이 될 수 있다. 광범위하고 개방적인 조사를 통해 다양한\n                    산업 분야의 선행 연구 및 수행 과제를 학습하는 것은 본 연구를 수행하는 데\n                    영감을 줄 수 있고, 그 결과 사전 조사는 탄탄한 2차 연구(데스크 리서치) 수행을\n                    위한 출발점이 될 수 있다. 예를 들어 사전 조사와 관련한 분야 전문가(교수,\n                    연구자, 저자 등)와의 인터뷰를 수행하면 해당 분 야 에 대한 깊은 통 찰을\n                    신속하게 취득하고 2차 조사를 통해 수집하고자 하는 추가적인 자료 및 조사에\n                    대한 정보를 얻을 수 있다.\n\n                    고객 중심의 사전 조사는 연구 문제와 관련한 맥락, 인식, 내부 갈등 또는\n                    프로젝트 수행 중 발생 가능한 상호작용 등에 대해 심도 있는 접근을 포함한다.\n                    이는 해결하고자 하는 연구 문제나 요구사항에 대한 이해관계자들의 비전이나\n                    인식을 확인하는 데 도움이 된다.\n\n138 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f사용 목적   • 연구와 관련한 산업, 조직, 경쟁사, 유사한 제품/상품/서비스 또는 유사\n         경험에 대한 심도 있는 학습\n        • 연구에서 고려해야 할 팀 구성원, 동료, 사용자, 고객 또는 이해관계자의\n         다양한 관점을 학습하고 연구 조직을 추가로 구성하고 운영하는 데 활용함\n        • 연구와 관련한 잠재적인 인터뷰 대상을 인지하는 데 도움이 됨\n\n\n수행 과정   1. 사전 조사가 너무 과도해지지 않도록 수행 기준 설정 및 시간 배분\n        2. 연구 주제 및 질문 정의 : 사전 조사는 대부분 탐색적 연구이므로 열린\n         마음으로 다양하고 흥미로운 주제에 대해 광범위하게 질문을 설정\n        - 특 정 연구 분 야, 키워드, 기술, 산 업에 대한 소셜미디어 게 시물 또는\n         해시태그 선별\n        3. 사전 조사 수행 : 검색하 는 동안 참고 문헌을 추적하여 정보의 출처 및\n         출처의 신뢰성을 확보하고, 흥미로운 정보는 나중에 탐색할 수 있도록 자료의\n         위치 기록\n        - 간행물, 신문, 잡지 읽기뿐 아니라 팟캐스트 및 콘퍼런스 강연 듣기, 온라인\n         비디오 시청이 포함\n        4. 요약 및 시각화 : 결론 및 향후 연구에 대한 가정(또는 가설)을 포함하고\n         있으며, 보 고 서와 같 이 체 계적으 로 정리하거나 무드 보 드 또는\n         마인드맵과 같이 시각적으로 표현\n\n\n\n결과물     텍스트 요약본, 마인드맵, 무드 보드와 같이 시각화된 사진, 스크린 숏 또는\n        비디오 모음\n\n\n\n\n                                      서비스·경험디자인 이론서 139\n\f                    B. 2차 연구(Secondary Research)\n\n정의                  2차 연구는 “데스크 리서치”라고도 하며, 이미 존재하는 데이터인 2차 데이터를\n                    사용하는 조사 방법이다. 2차 데이터란 다른 프로젝트 또는 목적을 위해 수집된\n                    정보로서 시장조사 보고서, 추세 분석, 고객 데이터, 학술 조사 등을 포함한\n                    정성적 및 정량적 자료 모두를 말한다. 2차 연구는 기존 데이터를 요약, 대조,\n                    종합 연구의 전반적인 효율성을 높인다.\n\n\n배경                  과제 수행 시 이용 가능한 데이터를 확인하기 위해 1차 연구 이전에 2차 연구를\n                    수행하 는 것은 연구자 들의 일반적인 관행이다. 또한 2차 연구는 1차 연구\n                    방법을 통해 수집된 데이터를 분석하고 주안점을 강조하기 위해 사용한다. 또한\n                    데이터를 직접 수집하는 1차 연구는 시간이 많이 걸리고 비용이 많이 드는\n                    경향이 있다. 하지만 모든 조직이나 기업이 직접 혹은 대행사를 통해 데이터를\n                    수집할 수 있는 것은 아니다. 2차 연구는 이미 발표된 데이터와 이미 수행된 다른\n                    연구에서 수집한 정보를 재사용하기 때문에 1차 연구보다 비용 면에서 훨씬\n                    효율적이다. 그로 인해 많은 기업과 조직은 2차 연구를 선호한다. 2차 조사는\n                    책상에 앉아 데이터를 검색할 수 있기 때문에 “데스크 리서치”라고도 한다.\n                    최근에는 1차 연구도 온라인 설문조사 도구를 사용하여 비용을 줄이고 있다.\n                    2차 연구의 데이터는 일반적으로 학술 논문, 백서 및 보고서에 게시된 연구와\n                    같은 외부 소스를 이용하지만 연구 데이터가 조직 내에서 제공되는 경우 내부\n                    소스에서 가져오는 경우도 있다.\n\n\n2차 연구의 장점           1. 대부분의 정보는 소스가 많아 쉽게 수집할 수 있다.\n                    2. 필요한 데이터를 쉽게 사용할 수 있고 데이터 수집에 최소한의 비용이 든다.\n                    3. 2차 연구를 통해 수집된 데이터는 조직이나 기업의 가 설 설정이나 연구\n                       수행에 따른 비용 평가 등 1차 연구의 효과에 대한 아이디어를 제공한다.\n                    4. 2차 연구는 데이터의 가용성으로 인해 수행이 더 빠르다.\n\n\n\n2차 연구의 단점           1. 이용 가능한 정보의 신뢰성을 확보하기 위해서는 신뢰성 평가를 수행해야 한다.\n                    2. 모든 데이터가 최근의 경향을 반영하여 갱신된 최신 보고서 및 통계를 통해\n                       제공되는 것은 아니다.\n                    3. 2차 연구는 1차 연구 데이터로부터 결론을 도출하기 때문에 연구의 성공\n                       여부는 1차 연구에서 수행한 연구의 질에 크게 좌우된다.\n\n\n목적                  - 주제 또는 연구 질문에 대한 연구가 이미 존재하는지 확인\n                    - 연구 질문을 보다 정확하게 공식화\n                    - 적합한 데이터 수집, 시각화, 종합 방법을 결정\n\n\n140 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 방법   2차 연구의 데이터에 접근하기 위한 주요 경로는 다음과 같다.\n        - 인터넷 : 2차 데이터를 수집하 는 가 장 일반적인 방법으 로 웹 사이트의\n         신뢰성을 고려해야 한다.\n        - 정부 및 비정부 기관 : 확실하고 신뢰할 수 있는 데이터인 반면 특정 데이터를\n         다운로드하거나 사용하기 위해서는 비용을 지불해야 한다.\n        - 공공 도서관 : 정보를 추출할 수 있는 중요한 정보와 문서의 창고로 이전에\n         수행된 중요한 연구의 사본을 소장하고 있다.\n        - 교육 기관 : 다른 어떤 비즈니스 부문보다 대학에서 더 많은 연구가 수행되며\n         주로 1차 연구이다.\n        - 상업적 정보 출처 : 신문, 저널, 잡지, 라디오, TV 방송 등과 같은 상업 정보\n         소스에는 경제 발전, 정치적 의제, 시장조사, 인구통계학적 세분화 및 유사한\n         주제에 대한 직접적인 정보가 있다.\n\n\n\n수행 과정   2차 연구의 일반적인 수행 과정이다.\n        1. 연구 질문 및 주제 정의\n         - 탐색적 연구인지 확증적 연구인지 연구를 수행하는 이유 고려\n         - 페르소나, 고객 여정 지도, 서비스 가치 흐름도 등 연구 결과로 무엇을 하고\n         싶은지 고려\n        2. 연구 출처 확인 : 연구와 관련성 높은 데이터 및 정보 출처 목록을 수집\n        3. 출처의 신뢰도 평가 : 신뢰도에 따라 데이터 수집을 위한 잠재적 출처의\n         순위를 결정\n        4. 선별 검색 수행 : 기존 데이터 수집\n         - 각 출처에 대해 초기 검색을 위한 필요 시간 할당\n         - 수행 도중 발견된 흥미로운 정보 등은 추후 탐색을 위해 링크 등 자료의 출처 보관\n         - 중복 데이터 비교를 통해 사용 가능한 형식으로 결합\n        5. 깊이 파고들기 : 선별 검색 수행 중 발견된 흥미 있는 정보에 대해 심도 있게\n         탐색하고 자료에서 발견한 통계나 사용된 소스 등도 검토\n        6. 데이터 분석 : 수집된 데이터를 분석하고 제시된 질문에 대한 답변이 확인될\n         때까지 반복 수행\n        7. 요약 : 보고서와 같이 체계적으로 정리하거나 무드 보드 또는 마인드맵과\n         같이 시각적인 표현을 중심으로 정리\n\n\n\n결과물     텍스트 요약본, 마인드맵, 무드 보드와 같이 시각화된 사진, 스크린 숏 또는\n        비디오 모음\n\n\n\n\n                                         서비스·경험디자인 이론서 141\n\f                                    2.1.2 환경 조사\n\n                                    A. 거시적 환경 (Macro Environment) 조사\n                                    기업에서 통제 불가능한 요인들(정치, 경제, 사회 문화, 기술적 환경의 요인)을\n                                    파악하여 전략을 수립하는 데 목적이 있으며, PEST분석법(정치 Political, 경제\n                                    Economic, 사회 Social, 기술 Technology Issue)과 STEEP분석법(사회\n                                    Social, 기술Technology, 경제 Economic, 환경 Environment, 정치 Political\n                                    Trend)이 대표적이다.\n\n\n\n\n                                    A.a PEST 분석(PEST Analysis)\n\n정의                                  PEST는 정치적 환경(Political Environment), 경제적 환경(Economical\n                                    Env iro nment ), 사회 문화 적 환 경(S o ci al Env iro nment ), 기 술\n                                    환경(Technological Environment) 혹은 정치(Politic), 경제(Economic),\n                                    사회(Social), 기술(Technology, Technology Issue)의 앞 글자를 따서 만든\n                                    용어이다. PEST분석은 거시적 환경 분석 및 전략 수립을 위한 목적으로 정치,\n                                    경제, 사회, 기술 측면에서 시장의 큰 흐름을 찾아내기 위해 문제를 분석하는\n                                    방법이다. 기업이 시장조사나 전략 분석을 할 경우 혹은 거시경제적 관점에서\n                                    의사결정을 내려야 할 때 사용하는 기법이다. 시장 성장과 축소, 사업 포지셔닝,\n                                    사업 방향 등을 파악하는 데 효과적인 도구이다.\n\n\n역 사117                              P E S T 분 석 은 하 버 드 대 학 의 프랜 시 스 아 길라 ( F r a n c i c J . A g u i l a r)\n117                                 교수가 1967년 발행된 저널 『비즈니스 환경 진단(Scanning Business\nNitank Rastogi and M.K.\nTrivedi(2016), <Pestle Technique    Environment)』에서 경제적, 기술적, 정치적, 사회적 요인이 비즈니스 환경에\n- A Tool to Identify External\n                                    큰 영향을 미친다고 제시하고, ETPS라는 약어로 최초로 소개되었다. 저널\nRisks in Construction Projects>,\nInternational Research Journal of   발행 직후 미국 생명보험 연구소의 아놀드 브라운(Arnold Brown)이 이를\nEngineering and Technology, p.\n387                                 'STEP'(Strategic Trend Evaluation Process)으로 재구성했다. 이후 '거시적\n                                    외부 환경 분석(Macro External Environment analysis)' 또는 '변화에 대한\n                                    환경 진단(Environmental Scanning for Change)'방법과 같이 환경적 요소를\n                                    추가하여 STEPE 분석으로 부르게 되었다.\n\n                                    1980년대에 일부 학자 들 은 순서를 변형하 여 PEST라고 부르기도 하고,\n                                    법적(Legal) 요소를 추가하여 SLEPT로, 여기에 환경적(Environmental)\n                                    요소를 추가하여 PESTEL, PESTLE, STEEPLE 등으로 부르기도 한다.\n\n\n사용 목적                               기업의 경영·사업 환경의 변혁·변화에 영향을 주는 거시적 변화 동인 파악\n\n\n\n\n142 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 과정   1. PEST에 따라 비즈니스 경쟁력 제공에 영향을 미치는 요인을 도출한다.\n        2. 각 요인이 현재 기업에 미치는 영향을 파악한다.\n        3. ‘성장기-성숙기-쇠퇴기’ 혹은 ‘단기-중기/장기’ 관점에서 각 요인이 미래에\n          어떻게 변화할 것인지 예측한다.\n        4. 각 요인에 따라 현재의 영향과 미래의 영향 간 차이를 파악한다.\n\n\n\n구성 요소   정치적(Political) 요소\n          정부가 경제에 간섭하는 정도로, 정부 차원에서 진흥하거나 제재하고자 하는\n          재화나 용역의 종류를 포함\n          세금, 노동법, 무역 제재, 환경법, 관세, 정치적 안정성 등을 포괄\n          국가적 차원에서 중앙 정부가 보건, 교육, 인프라 구축 등에 끼치는 영향을 고려\n        경제적(Economic) 요소\n          경제성장률, 금리, 환 율, 인플레이션 및 임금 률, 최저임금, 근무 시간,\n          실업(지역 및 국가), 신용 가용성, 생활비 등을 포함\n          경제 주체(기업)가 의사결정을 내리는 데 중요한 역할\n\n        사회적(Social) 요소\n          문화적 요소와 보건 인지도, 인구성장률, 연령대 분포, 직업 태도, 안전 관련\n          요소 등이 포함\n\n        기술적(Technological) 요소\n          R&D 활동, 자동화, 기술 관련 인센티브, 기술혁신, 신기술 등장, 기술 변화\n          속도 등을 포함\n          기술 투자와 품질, 비용 및 혁신에 영향을 끼치는 요소\n\n        법적(Legal) 요소\n          차별법, 소비자법, 고용법, 독점금지법, 자재, 할당량, 자원, 수입/수출 및\n          과세에 대한 접근에 영향을 미치는 법률 변경 등을 포함\n\n        환경적(Environmental) 요소\n          생태학적, 환경적 요소로 날씨, 기후, 기후변화, 공급망 지역 및 국가의\n          윤리적 요인, 전염병 및 기타 비상사태 등을 포함\n          관광, 농업, 보험업계 등에도 영향\n          기후변화의 문제 점이 대두되면서 제 공 생 산품의 경영과 신시장 개척,\n          현존하는 제품의 단종과 변화, 제품의 시장 축소나 소멸 등에도 영향\n\n\n\n\n                                           서비스·경험디자인 이론서 143\n\f                    A.b STEEP 분석(STEEP Analysis)\n\n\n정의                  S T EEP분 석 은 미래에 대한 대 응 방 향 을 모색하기 위해 사회(S o cial),\n                    기술(Technology, Technological), 경제(Economic), 환경(Environment,\n                    Ecological), 정치(Political Trend)의 다섯 가지 영역의 변화를 종합적으로\n                    고려하여 문제를 분석하는 시스템적 접근 방법이다.\n\n\n역사                  PEST 분석에서 파생된 방법으로 PEST분석과 역사를 공유한다.\n                    일반적으로 거시 환경 분석에서는 STEEP분석을 사용하고, 환경적 측면의\n                    거시적 변화가 미약하여 무시할 수 있는 경우 PEST분석을 사용한다.\n\n\n사용 목적               산업 내에서 기업의 경쟁력에 영향을 끼칠 수 있는 거시적인 환경 요인을 파악\n\n\n수행 방법               1. 분석되는 환경 영역을 이해한다.\n                    2. 동향 간의 상호 관계를 파악한다.\n                    3. 동향을 이슈와 연결한다.\n                    4. 이슈의 미래 방향을 예측한다.\n                    5. 의미를 도출한다.\n\n\n구성 요소               - 사회적(Social) 요소\n                    - 기술적(Technological) 요소\n                    - 경제적(Economic) 요소\n                    - 환경적(Environmental) 요소\n                    - 정치적(Political) 요소\n\n\n\n                    B 미시적 환경(Micro Environment)조사\n\n                    기업이 속한 산업 내에 존재하 는 마케팅 환경 주체들을 분석하 는 것으로,\n                    주요 미시 환경 요소에는 경쟁자, 고객, 기업 자신의 핵심 역량, 이해관계자,\n                    협력자 등이 있다. 미시 환경 분석을 위한 대표적 방법론으로는 3C분석법(회사\n                    Company, 고객 Customer, 경쟁사 Competitor)이 있다.\n\n\n                    B.a 3C 분석\n\n\n정의                  3C는 자사(Company), 고객(Customer), 경쟁사(Competitor)의 앞 글자를\n                    따서 만든 약자이다. 3C분석은 거시적 환경 분석 내용을 보완하기 위해 자사,\n                    고객, 경쟁사로 기준을 나누어 현 상황 및 행동을 분석하고 예측하여 전략을\n                    도출해 내는 방법이다.\n\n144 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f역사      조직이론가이자 경영컨설턴트인 오오마에 켄이치(Ohmae Kenichi)는 3C분석\n        비즈니스 모델(3C Analysis Business Model)을 만들었다. 오오마에는\n        성공적인 전략을 위해서 자사, 고객, 경쟁사로 구성된 3가지 핵심 요소가 전략적\n        삼각형의 형태로 균형을 이루어야 한다고 주장하고, 이 3가지 요소를 ‘3C’\n        또는 ‘전략 삼각형(Strategic Triangle)’으로 정의하였다. 3C분석은 전략적인\n        비즈니스 모델로 오랫동안 사용되었고, 오늘날 웹 마케팅에서도 자주 사용된다.\n\n        3C분석은 고객, 경쟁자, 기업 요소에 초점을 맞춰 분석함으로써 핵심 성공\n        요인(KSF: the Key Success Factor)을 찾고 실행 가능한 마케팅 전략을 세울\n        수 있다. 3C분석은 방법이 간단하여 여러 형태로 파생되었다.\n\n\n사용 목적   - 기업의 주요 영역에서 자사의 강점을 극대화할 수 있는 성공적인 전략 수립\n        - 고객 지향적 경쟁 우위 유지 및 향상\n        - 구매, 디자인, 기술력, 판매, 서비스 등에서 경쟁사와 차별화\n\n        3C분석을 통해 자사, 고객, 경쟁사 간의 관계 및 생각에 대해서도 파악할 수\n        있다.\n        - 자사와 고객 파악 : 현 상황에서의 마케팅 전략이 실제 고객의 필요와 욕구를\n          충족하는지 파악\n        - 경쟁사와 고객 파악 : 경쟁사 마케팅 전략이 어떻게 고객을 만족시키고\n          있는지 파악\n        - 자사와 경쟁사의 마케팅 전략 비교 : 경쟁 우위와 열위가 어느 포인트에서\n          발생하는지 파악\n\n\n\n수행 방법   PEST분석 후 그 내용을 기반으로 3C의 상황 및 행동을 분석, 예측한다.\n\n        자사(Company)\n          기업 내외부의 강점과 약점을 파악\n          평가 요소 : 기업 목표, 자원, 시너지 효과\n\n        고객(Customer)\n          고객 파악(고객 세그먼트), 고객의 니즈와 욕구 파악, 시장 동향(타깃 제품\n          포지셔닝) 파악\n          평가 요소 : 시장 규모, 시장 성장률\n\n        경쟁사(Competitor)\n          시장분석, 마켓 체인 분석, 포트폴리오, 재무분석 등을 통해 경쟁사의 목표와\n          미래 전략 파악, 자사 비교 경쟁사의 장점과 약점 파악\n          평가 요소 : 현재 경쟁자, 잠재적 경쟁자\n\n                                           서비스·경험디자인 이론서 145\n\f구성 요소               자사(Company) : 기업 규모, 브랜딩, 실적(점유율), 기술 역량, 경영 자원, 특징,\n(결과물)               경영 상황, 전략, 차별화 포인트, 비전과 목표, 시장 성장률 등\n\n                    고객(Customer) : 고객 세분화(고객의 특성, 니즈, 행동 특성, 기호), 고객\n                    충성도, 시장(산업) 규모, 시장 성장률, 시장구조, 성숙도 등\n\n                    경쟁사(Competitor) : 경쟁사 수, 시장 점유 상황, 경영 자원, 강점과 약점,\n                    전략, 차별화 포인트, 진입(퇴출) 장벽 등\n\n\n\n\n                        4C 분석\n\n                        4C란 3C의 회사(Company), 고객(Customer), 경쟁사(Competitor)에 채널(Channel)을\n\n                        포함한 것을 의미한다. 채널이란 기업이 고객 세그먼트에게 가치를 제안하기 위해\n\n                        커뮤니케이션을 하고 상품이나 서비스를 전달하는 방법을 말한다. 온라인 시장의 급격한\n\n                        성장과 같은 시장의 변화와 소비자 소비 패턴 변화에 신속한 대응이 필요하다는 의미로 채널\n\n                        대신 특허권, 정부 규제, 신규 업체의 진입장벽 등과 같은 환경(Circumstance) 요인을\n\n                        포함하기도 한다.\n\n\n\n\n                    B.b FAW(Force at Work) 분석\n\n\n정의                  기업 경영에 영향을 미치는 경제, 규제, 시장, 국제 관계의 4가지 외부 환경\n                    측면을 분석하여 기업의 경영 활동에 영향을 미치는 정황들을 객관화하고 이를\n                    통해 경영 환경 및 발전 방향까지 도출해 내는 방법이다.\n\n\n사용 목적               기업의 경영 전략 수립 및 외부 환경 변화에 대응하는 경영 혁신 전략 수립\n\n\n수행 방법               - 경제, 규제, 시장, 국제 관계의 4가지 요소를 분석한 후, 거시적인 경영 환경과\n                       사업의 발전 방향을 도출한다.\n                    - 3C분석과 FAW분석을 함께 고려하면 보다 합리적이고 입체적인 전략을\n                       도출해 낼 수 있다.\n\n\n\n\n146 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f                                B.c 4P / 마케팅 믹스(Marketing Mix) 분석\n\n\n정의                              의사결정자가 효과적이고 전략적인 의사결정을 하기 위해 통제 가능한 마케팅\n                                수단들을 특정 시점이나 환경에 맞게 적절히 조합하는 것을 4P 또는 마케팅\n                                믹스라고 한다. 현대 마케팅에서 경영자가 통제 가능한 4P에 해당하는 요소는\n                                학자들마다 다르나, 대표적으로 제품(Product), 가격(Price), 유통(혹은 유통\n                                경로, 장소)(Place), 촉진(Promotion)으로 구성된다.\n\n\n역사                              마케팅 믹스는 미국 미시간 주립 대학의 제롬 맥카시(E. Jerome McCarthy)\n                                교수가 1960년 처음 소개하였다. 맥카시 교수는 그의 책 『마케팅 기초: 관리적\n                                접근 방식(Basic Marketing : A Managerial Approach)』에서 회사가 그들의\n                                타깃 고객층을 만족시키기 위해서 제품(Product), 가격(Price), 장소(Place),\n                                촉 진(Promotion)의 4 가지 마 케팅 전략 을 적절하게 섞어서 사 용한 다고\n                                주장하였다.\n\n                                맥카시 교수가 마케팅 믹스를 주장한 당시는 마케팅 전략의 분류나 그 연구가\n                                체계적이지 않았던 마케팅 개념 도입기로, 마케팅 믹스의 내용도 단순한 4P\n                                전략의 분류와 소개였다. 하지만 오늘날의 산업이 대부분 전통적인 제조업을\n                                벗어나게 되면서 마케팅에 대한 연구가 활발하게 진행되었고, 운송 수단 및\n                                미디어의 혁신적인 변화로 전통 적인 마케팅 믹스의 구 성요 소를 단순하게\n                                적용하기에는 무리가 있다.\n\n                                오늘날 4P는 다 원화 된 현대 사회에 맞추어 소비자 에게 친숙하고 인터넷\n                                마케팅에서 특히 중시되는 네 가지 요소인 소비자(Customer), 기회비용(Cost),\n                                편의성(Convenience), 커뮤니케이션(Communication)의 4C로 대체하거나\n                                현대 비즈니스에서 중요하게 고려하는 과정(Process), 물리적 근거(Physical\n                                evidence), 사람(People)의 세 가지 요소를 4P에 보완해서 7P 등으로 구성\n                                요소를 확장해서 사용하기도 한다.\n\n\n사용 목적                           4P분석의 변수는 주로 측정 가능하여 4P분석 자체를 변수로 활용하는 경우가\n118                             많으며, 그 외에도 의사결정 과정, 고객 만족과 브랜드 이미지 및 구매 의도 등과\nST.shop 통계 (http://www.\nstshop.co.kr/index.php?module   관련한 마케팅 연구, 마케팅 전략 수립 및 개선 활동 등에 활용한다.118\n=Board&action=SiteBoard&sMo\nde=VIEW_FORM&iBrdNo=4&iB\nrdContNo=5&sBrdContRe=0)\n\n\n\n\n                                                                        서비스·경험디자인 이론서 147\n\f활용 방법 : 4P 전략 119                 - 제품 전략(Product strategy) : 물리적 차별화 및 서비스 차별화를 통해\n119                                 목표 시장에서 경쟁사보다 더 나은 제품의 포지셔닝 구축\n스타트업 브라더스 (https://\nstartupbrothers.tistory.com/16)\n                                  - 가격 전략(Pricing Strategy) : 기업의 재무적 목표, 수익성, 고객의 수용성,\n                                    경쟁자 진입, 제품·유통 촉진 전략과 일관성 등을 고려하여 제품의 적정\n                                    가격을 설정, 할인 여부와 정도, 할부 기간 등에 관한 의사결정\n\n                                  (1) 가격 걷어내기(Pricing skimming) : 신제품이 출시되면 가격을 높게\n                                    설정하여 이익을 극대화, 이후 점차적으로 가격을 낮춤(ex. 스마트폰)\n\n                                  (2) 침투 가격(Penetrating Pricing) : 초기에 가격을 낮게 책정하여 판매량을\n                                    극대화하거나 시장 점유율을 유지하기 위한 전략. 마진을 높일 수 없음,\n                                    가격을 올리기 쉽지 않음\n\n                                  (3) 품위/명성 가격(Prestige Pricing) : 가격을 높게 설정하여 고객의 마음속에\n                                    브랜드 품질 또는 배타성을 각인\n\n                                  (4) 낚시 가격(Bait and Hook Pricing) : 초기에 가격을 낮게 설정하여 고객의\n                                    구매를 유도하고, 제품에 필요한 추가 구매품, 부품, 소모품에 높은 가격을\n                                    책정\n\n                                  (5) 가격 프로모션(Price Promotion) : 1+1 이벤트, 사은품, 쿠폰을 제공하는\n                                    방법으로 신제품 출시 또는 경쟁사를 끌어오는 경우나 재고를 처리하기 위해\n                                    기업이 많이 사용하는 방법\n\n                                  - 유통 전략(Placement strategy) : 직접 유통 방식, 간접 유통 방식, 혼합\n                                    방식(직접+간접) 등을 활용하여 제품을 고객이 원하는 시간과 장소에 제공\n\n                                  - 촉진 전략(Promotion strategy) : 광고(Advertising), 판매 촉진(Sales\n                                    Pro-motion), PR(Public Relations), 인적/직접 판매(Personal/Direct\n                                    Selling), 전시회(Trade Show), 온라인 기반 촉진 전략 등 기업이 마케팅\n                                    목표를 달성하기 위해 제품에 대한 정보를 전달\n\n\n\n\n148 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f구성 요소120                       제품(Product) : 소비자의 욕구 충족을 위한 상품과 서비스로 디자인, 브랜드,\n120                            심볼, 보증, 이미지 등 유형적 요소에 서비스, 브랜드 등 무형적 요소를 포함한\n크라우드펀딩컨설팅 “마케팅 4P\n전략의 정의와 사례” (https://          개념\nm.blog.naver.com/infighter_\njh/220343948176)\n                               가격(Price) : 가장 객관적인 제품 가치의 척도로 할인조건, 수요, 타제품 가격,\n                               가격 유연성 등을 포함한 개념\n\n                               유통(Place) : 생산자에서 소비자까지 전달되는 과정으로 지역, 범위 등 단순히\n                               물건을 파는 장소만을 의미하는 것이 아니라 재고, 배송, 물류 등 고객과의\n                               접촉이 이루어지는 전체적인 유통경로의 관리를 포함\n\n                               촉진(Promotion) : TV 광고, 신문, 전단지, 인터넷 광고 등 판매 촉진 전략에\n                               사용하는 구매 유인 기법\n\n\n\n\n                               4Cs\n121                            3C의 확장 개념과 는 의미가 다른 4C가 있다. 정보화 사회의 도래로 인해\nST.shop 통계 (https://www.\ncleverism.com/understanding-   4P 에서 전환된 4C의 개념으 로, 기존 마 케팅 분 석이 ‘기업’의 입장 에서\n4cs-marketing-mix/)\n                               다루어졌다 면, 인터넷을 통 해 고객이 스 스 로 제 품의 가 성비를 비교하고\n                               구매하는 오늘날 상황에서는 ‘고객’ 입장에서 분석해야 한다는 것을 의미한다.\n                               이는 고객 생애 가치(Life Time Value) 극대화를 목표로 마케터와 경영진이\n                               전체 프로세스와 가치 사슬을 고객의 관점에서 보도록 권장하는 사고방식의\n                               변화를 반영한 것이다.121\n\n\n\n                               소비자(Consumer, Customer Benefit/Value) : ‘제품’이 '소비자’로 전환.\n                               기업이 아닌 고객의 입장에서 당 제품이 어떤 가치가 있는지를 고려한다는 개념.\n\n                               기회 비용(Cost, Cost to the Customer) : ‘가격’이 ‘기회 비용’으로 전환.\n                               과거에는 제품 가격에 중점을 두었으나, 제품 구매 가격뿐만 아니라 사용 및\n                               처분 비용을 포함하는 총비용에 관심을 기울임.\n\n                               편의성(Convenience) : ‘유통 경로’가 편의성으로 전환. 고객들은 제품/\n                               서비스로의 접근이 가능한 편하기를 원함.\n\n                               커뮤니케이션(Communication) : 고객들은 생산자나 공급자의 일방적인\n                               커뮤니케이션을 원하지 않으며, 자신들과의 쌍방향 커뮤니케이션을 원함.\n                               따라서, 고객들이 참여하는 상호 커뮤니케이션 전략이 요구됨.\n\n\n\n\n                                                                    서비스·경험디자인 이론서 149\n\f                    B.d STP 분석122,123\n\n\n정의                  마케팅에서 STP(Segmentation, Targeting and Positioning)는 시장\n                    세 분 화 프 로 세 스 를 요 약 하 고 단 순 화 하 는 광 범 위 한 프 레 임 워 크 이 다.\n                    STP분석은 3C분석을 통해 기업의 마케팅 환경을 분석한 이후 제품 시장을\n                    몇 개의 시장으로 세분화(Segmentation)하고 세분된 시장을 평가하여 표적\n                    시장(Targeting)을 선정한 이후 각 제품에 대한 포지셔닝(Positioning)을\n                    파악하여 제품에 대한 경쟁 우위를 가져가기 위한 프로세스이다.\n\n사용 목적               기업의 입장에서 한정된 자원으로 최대한의 마케팅 효과를 내기 위해 사용하는\n                    전략 방법\n\n\n\n\n150 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 방법 및 과정                      세분화, 타깃팅 및 포지셔닝 프 로세스는 시장 세분화 를 위한 일련의 시간\n                                순서이다.\n\n122                             1단계 : 시장 세분화\nST.shop 통계 (http://www.\nstshop.co.kr/index.php?module   고객을 공통의 특성과 요구사항을 지닌 사람들의 그룹으로 나눈다. 목표 시장을\n=Board&action=SiteBoard&sMo\nde=VIEW_FORM&iBrdNo=4&iB\n                                세분화하는 기준에는 인구통계학적, 지리적, 사회적, 심리적, 행위적 방법 등이\nrdContNo=5&sBrdContRe=0)\n                                있다. 세분화의 결과는 상호 간에는 이질성이 극대화되어야 하고, 세분 시장\n123                             내에서는 동질성이 극대화되어야 바람직하다.\n위키피디아 “Segmenting-\ntargeting-positioning”\n(https://en.wikipedia.org/\n                                2단계 : 고객 타깃팅, 표적 시장 선정\nwiki/Segmenting-targeting-      세분화를 통하여 나뉜 시장 또는 그룹 중 수익성, 규모 및 성장 가능성 분석이\npositioning)\n                                시장에 얼마나 잘 서비스할 수 있는지를 고려하여 어떤 곳에 집중할 것인지\n                                선택한다.\n\n                                3단계 : 포지셔닝\n                                고객에게 인식되고자 하는 이상향으로 기업의 제품과 이미지가 인식되도록\n                                설계하는 마케팅의 과정으로 가장 가치 있는 고객 세그먼트를 대상으로 제품을\n                                포지셔닝한다. 주로 다차원 척도법을 통한 포지셔닝 맵(Positioning Map)\n                                방법이 사용된다.\n\n\n\n\n구성 요소                           시장 세분화 기준과 변수\n                                  인구통계학적 변수: 인종, 민족, 연령, 성별, 수입, 결혼 여부, 가족 구성원 수,\n                                  교육 수준, 직업, 인종 등 개인 속성\n                                  지리적: 지역, 도시, 국가, 이웃, 인구 밀도, 도시 규모, 기후 등\n                                  심리적: 개성, 동기, 라이프 스타일 등\n                                  행위적: 사용 여부, 사용률, 사용 양상, 편익, 태도, 상표 충성도 등\n\n                                타깃 전략\n                                  차별화 전략: 다양한 소비자 니즈에 대응하여 세분 시장별 마케팅 전략\n                                  비차별화 전략: 보편성이 높은 제품으로 전체 시장을 대상으로 마케팅 활동을\n                                  전개해 나가는 전략\n                                  집중화 전략: ‘단일 세분 시장 전략’이라고도 하며 특정 세분 시장 마케팅에\n                                  집중하는 전략\n\n                                포지셔닝 맵 : 지각도 맵(Perception Map)\n                                  소비 자가 인 식하고 있는 자사 제 품과 경쟁 제 품 을 2차 원이나 3 차 원\n                                  그래프상에 표시한 것\n\n\n\n\n                                                                  서비스·경험디자인 이론서 151\n\f                    C 유사·경쟁 환경 및 서비스 조사\n\n\n                    C.a SWOT 분석(SWOT Analysis)\n\n정의                  기업의 내부 환경과 외부 환경을 분석하여 강점(Strength), 약점(Weakness),\n                    기회(Opportunity), 위협(Threat) 요인을 규정하고 이를 토대로 경영 전략을\n                    수립하는 방법이다.\n\n\n사용 목적               SWOT분석은 긍정적인 면을 보는 강점과 기회, 그 반대로 위험을 불러오는\n                    약점과 위협을 저울질하는 도구로 가장 큰 장점은 기업의 내외부 환경 변화를\n                    동시에 파악할 수 있다는 점이다.\n\n                    SWOT분석은 경영자는 회사가 처한 시장 상황을 인식하고 향후 전략 수립을\n                    위한 자료를 제공받는다.\n\n\n수행 방법               SWOT분석은 내외부 환경 분석으로부터 도출된 핵심 이슈를 기회 요인과 위협\n                    요인 그리고 강점과 약점으로 분류한 다음 내부 요인과 외부 요인을 X축과 Y축에\n                    대응하여 2차원의 사분면을 그리고, 각각 하나의 사분면에 하나씩 배치하여\n                    연관된 사항들 을 우선순위로 배치한다. 사분면에 그룹핑된 4가지 이슈의\n                    조합으로 SO(강점+기회) 전략, ST(강점+위협) 전략, WO(약점+위기) 전략,\n                    WT(약점+위협) 전략의 관점에서 문제를 탐색한다.\n\n\n\n\n152 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f구성 요소\n\n\n\n\n                               S                 W\n\n                              SO전략             WO전략\n                 O      기회로부터 이익을 얻기         약점을 극복하면서\n                       위해 강점을 활용하는 전략        기회를 살리는 전략\n\n\n                              ST전략             WT전략\n                 T      위협을 회피하기 위해          약점을 최소화하고\n                        강점을 활용하는 전략         위협을 회피하는 전략\n\n\n\n\n        강점과 약점 : 조직 내 내부 요인\n         인적 자원 : 직원, 자원 봉사자, 이사회 구성원 등\n         물리적 자원 : 위치, 건물, 장비 등\n         재정 : 보조금, 자금 지원 기관, 기타 수입원 등\n         활동 및 프로세스 : 자사가 실행하는 프로그램 및 사용하는 시스템 등\n         과거 경험 : 커뮤니티에서의 자사의 평판 등\n\n        기회와 위협 : 커뮤니티 또는 사회적 세력에서 비롯된 외부 요인\n         기업 관련 영역 및 문화의 미래 동향 등\n         경제 : 지역, 국가 또는 국제 등\n         자금 출처 : 재단, 기부자, 입법부 등\n         인구 통계 : 고객의 연령, 인종, 성별, 문화의 변화 등\n         물리적 환경 : 입법, 지역, 국가 또는 국제 행사 등\n\n\n\n\n                                          서비스·경험디자인 이론서 153\n\f                    C.b 5 Forces Analysis\n\n\n정의                  산업 내 경쟁을 결정하는 요인들을 공급자, 신규 진입자, 대체재, 구매자, 기존\n                    경쟁자의 다섯 가지 관점으로 분석하여 경쟁의 강도를 알아내고 그에 따른\n                    수익성을 예상하는 방법이다.\n\n\n\n역사                  산업 내 환경적 위협을 파악하기 위해 마이클 포터(Michael E. Porter)가 산업\n                    환경으로부터 기업에 위협을 발생시키는 다섯 가지의 요인을 파악하고 모델화한\n                    것이다.\n\n\n사용 목적               산업 내 경쟁을 결정하 는 요인과 경쟁의 강도, 그에 따른 잠재적 수익성을\n                    파악하기 위한 목적으로 사용한다. 이를 통해 경쟁 원인 파악, 경쟁 강도와 경쟁\n                    요인 파악, 산업 매력도 파악, 미래 산업 환경 예측이 가능하다.\n\n\n\n\n154 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f구성 요소   5 Forces Model : 마이클 포터의 산업구조분석 모델\n\n        신규 진입자의 위협(Threat of New Entrants) : 수익성이 있고 진입 장벽이\n        낮은 산업은 경쟁 심화로 인해 이익 저하가 예상되기 때문에 기존 조직은 신규\n        진입자를 막기 위해 진입 장벽을 높여야 한다.\n\n        공급자의 협상력(Bargaining Power of Suppliers) : 협상력이 높은 공급\n        업체는 고가 혹은 저품질의 원자재를 제공하여 구매 기업의 이익에 직접적인\n        영향을 미친다.\n\n        구매자의 교섭력(Bargaining Power of Buyers) : 구매자가 협상력이 강하면\n        공급자로부터 저가 혹은 고품질을 요구할 수 있는 권한을 가지게 되고 이로 인해\n        생산자의 이익이 낮아진다.\n\n        대체재의 위협(Threat of Substitutes) : 구매자가 매력적인 가격이나 양질의\n        대체품을 쉽게 찾을 수 있어 다른 제품이나 서비스로 전환할 수 있을 때 기업의\n        수익성은 감소한다.\n\n        산업 내 경쟁자(Rivalry among Existing Competitors) : 기존 경쟁 업체 간의\n        경쟁은 산업이 얼마나 경쟁력과 수익성이 있는지를 결정하는 주요 요인이다.\n\n\n\n\n                                               서비스·경험디자인 이론서 155\n\f         서비스디자인 기획을 위한 혁신전략\n\n\n\n더 알아보기\n                                            1. 혁신의 개념 변화\n\n                                            1) 기업과 혁신\n                                            경영학자 피터 드러커는 1985년 그의 저서를 통해 혁신(innovation) 은\n                                            기업가들(entrepreneurship)의 고유한 도구이며, 다른 사업이나 서비스의\n                                            기회로 변화를 활용하는 것이라 정의했다.124\n         124                                또한, 그는 2006년의 저서에서 오늘날을 새로운 기업가의 시대로 규정하고\n         Peter F. Drucker (1985),\n         Innovation and entrepreneurship,   혁신을 새로운 사업을 창출하는 핵심 능력으로 다시 한번 강조하였다. 그에게\n         perfectbound, p. 28\n                                            ‘ 혁신’은 목 적과 초점을 가지고 조 직의 경제적, 사회적 잠재력에 변화 를\n         125\n                                            일으키는 노력을 의미하며 다음과 같이 공 급과 수요의 두 가지 측면으 로\n         피터 드러커(2006), 《피터 드러커\n         의 위대한 혁신》, 한국경제신문, pp.             설명하고 있다.125\n         11-14\n\n\n\n                                              - \u0007공 급 측면의 정의: 1800년경 프랑스 경제학자 J.B. 세이 (J.B. Say)에\n                                               따르면, 혁신은 ‘자원의 생산성을 높이는 활동’으로 똑같은 자원을 투입하여\n                                               더 많은 양을 산출할 수 있는 활동을 의미함\n                                              - \u0007수요 측면의 정의: 현대 경제학자들에 따르면, 혁신은 소비자들이 경험해온\n                                               가치(value)와 만족(satisfaction)에 변화를 일으키는 활동을 의미함\n\n\n                                            2) 가치 혁신 (Value Innovation)\n                                            김위찬과 르네 마보안이 제안한 ‘가치 혁신’의 개념은 시장을 창출하는 전략으로,\n                                            고성장을 목표로 하는 기존의 혁신 패러다임과 달리 차별화와 저비용을 동시에\n                                            추구한다.\n\n\n                                              - \u0007저비용 (cost): 산업이                      COST\n                                               경쟁하는 요소들을\n                                               줄이거나 제거하여 비용을\n                                               절감하고 수익을 향상함                           VALUE\n\n                                              - \u0007차별화 (buyer value):                INNOVATION\n\n                                               산업이 제공하지 못했던\n                                               요소들을 증대하거나\n                                               창조하여 구매자의 가치를                     BUYER VALUE\n\n                                               향상함\n                                                                          [ 김위찬과 르네 마보안의 ‘가치 혁신’ ]\n                                                                          (출처: www.blueoceanstrategy.com)\n\n\n\n         156 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f126                               구매자에게 가치는 제공물의 유용성에서 가격을 뺀 값에서 발생하고, 회사에게\nW.Chan Kim, Renée Mauborgne\n(2004), Value Innovation: The     가치는 제공물의 가격에서 비용을 뺀 값에서 발생한다.126\nstrategic logic of high growth,\nHavard business review, July-\n                                  이러한 가치 혁신의 개념은 ‘블루오션(blue ocean) 전략’ 탄생의 기초가 되었다.\nAugust 2004\n                                  전략의 5가지 차원에서 전통적인 혁신과 가치 혁신을 비교하면 다음과 같다.\n\n\n\n                                     전략의 5차원                   전통적 혁신                         가치 혁신\n\n                                      산업 가설          산업의 조건이 이미 주어짐                   산업의 조건은 형성될 수 있음\n\n                                                                                      기업은 퀀텀 도약을 추구하며,\n                                                     기업은 경쟁적 이익을 구축하며,\n                                      전략의 초점                                          시장을 지배하는 데 가치를 둠.\n                                                     경쟁에서 이겨야 함\n                                                                                      경쟁은 벤치마킹이 아님,\n\n                                                     고객 세분화와 맞춤 강화로                   구매자 대중을 목표로 하여\n                                         고객          고객 가치의 차별화에 초점을 두어               기존 고객 일부가 이탈하더라도\n                                                     고객을 유지하고 확장함                     고객의 공통적인 가치에 집중함\n\n                                                                                      기존 자산과 역량에 제한받지 않고,\n                                      자산과 역량         기존 자산과 역량을 활용함\n                                                                                      새로운 자산과 역량을 요구함\n\n                                                     산업의 전통적 경계가                      산업이 전통적으로 제공하던\n                                     제품/서비스\n                                                     제품/서비스의 제공을 결정하고,                제품/서비스를 넘어 고객이\n                                       제공\n                                                     기존 가치의 극대화를 목표로 함                추구하는 총체적 해결안을 고려함\n\n\n                                  ‘전통적 혁신’과 ‘가치 혁신’의 비교\n                                  출처: W.Chan Kim, Renée Mauborgne (2004), Value Innovation: The strategic logic of\n                                  high growth, Havard business review, July-August 2004\n\n\n\n\n                                                                                          서비스·경험디자인 이론서 157\n\f                              3) 디자인 주도 혁신\n127                           로베르토 베르간티는 기존의 혁신이 ‘기술 주도 혁신’과 ‘시장 주도 혁신’에\n로베르토 베르간티 (2022), 《의미를\n파는 디자인》, 유엑스리뷰, pp. 27-       초점을 두고 있다고 설명하며 ‘디자인 주도 혁신’ 전략의 개념을 제안했다.127\n29, 124-126, 139\n\n\n                               - \u0007기 술 주도 혁신: 성능과 기술 연구에 중점을 둔 급진적 혁신 전략으로\n                                 신기술이 파괴적 영향력을 가지면 장기적인 경쟁력의 원천이 됨.\n                               - \u0007시장 주도 혁신: 사용자 요구 분석에서 출발하여 제품과 서비스를 개선하는\n                                 전략으로 사용자 중심 혁신을 포함하는 점진적 혁신 전략\n                               - \u0007디자인 주도 혁신: 디자인이 주도하는 급진적 의미 혁신으로 기존 시장의\n                                 사회문화적 모델 개선을 넘어 새로운 의미를 생성하는 전략\n\n\n\n\n                                                          젊은 유저들을 위한              새로운\n                                                          사이버 세계 중심의             의미 생성\n      기술\n                                                            콘솔 게임\n\n  급진적                                            급진적\n   변화                 기술 주도                       개선        소니\n
