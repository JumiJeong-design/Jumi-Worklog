하는 과정이다.\n\n\n\n\n                                         서비스·경험디자인 이론서 281\n\f                               5.1 프로토타입 평가\n193                            프로토타이핑은 아래 프레임워크 193 와 같이 서비스·경험디자인 프로세스의\nPassera, S., Kärkkäinen, H.,\n& Maila, R.(2012), <When,      어느 단계에서 하느냐에 따라 활용 목적과 충실도(fidelity), 제작 효율에 따른\nhow, why prototyping? A\npractical framework for\n                               도구가 달라진다. 프로토타이핑을 초기와 후기로 구분할 경우, 먼저 서비스디자인\nservice development In ISPIM   프로세스 중반부에 아이디어 전개과정에서 이루어지는 프로토타입은 낮은\nConference Proceedings>, p.\n1. The International Society   충실도로(Lo-fi) 신속하게 제작되면서 이해관계자들 간의 활발한 상호작용을\nfor Professional Innovation\nManagement (ISPIM).\n                               통해 서비스 콘셉트를 검토하고 테스트하며 서비스 콘셉트를 더욱 발전시키기\n                               위한 목적으로 사용된다. 반면 전달(Deliver) 과정에서의 서비스 프로토타이핑은\n                               충실도가 높으며(Hi-fi) 시간이 걸리더라도 상세하게 서비스를 테스트할 수 있도록\n                               정교한 작업을 거치는데, 주로 고객의 반응과 시장의 반응을 최종적으로 확인하여\n                               평가하기 위한 목적으로 제작된다.\n\n\n\n\n[ 서비스 프로토타입 프레임워크 ]\n\n\n\n\n                               5.1.1 프로토타입 평가 목표\n\n                               프 로 토타 입 평가 는 제안된 서비스 가 초기의 기획 의도 와 가치를 제대로\n                               구현했는지 확인함과 동시에 사용자와 이해관계자들로부터 평가를 받음으로써\n                               실제 구현 단계에 들 어가기 전에 품 질과 성능 을 확 인하기 위한 것이다.\n                               프로토타입 평가 유형은 크게 평가 목표는 아래와 같이 이해, 소통, 개선 등으로\n                               나뉘며 그에 따라 프로토타입의 충실도(fidelity), 평가 대상, 평가 방법이\n                               달라진다.\n\n\n\n\n282 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f            1. 이 해\n\n            서비스디자인 프 로 세스상에서 Hi-fi 프 로 토타입이 제안되기 전 단계에서\n            수행되는 프로토타입의 평가 는 제품과 서비스에 대한 고객의 핵심 문제와\n            개발 단계에서 인지하지 못하는 다양한 문제들을 다룰 수 있다. 이 과정에서\n            고객이 직면한 문제의 본질을 파 악 할 수 있을 뿐만 아니라 디자 인 초기\n            단계에서 방향성을 설정할 수 있어 비용과 시간을 절약할 수 있다. 이해를 위한\n            프로토타입 평가는 기본적인 부분으로 프로젝트를 수행하는 어느 단계에서도\n            진행될 수 있다.\n\n\n\n\n다른 대안의 탐색   이 단계에서의 프로토타입 평가는 문제를 이해하는 것 외에도 다양한 다른\n            대안들을 탐색해 볼 수 있어 하나의 솔루션만 고집하는 방향에서 탈피할 수\n            있다. 사용자의 문제를 제대로 해결하고 있는지 확인하기 위해서는 Lo-fi\n            프로토타입을 다양하게 만들어 고객을 대상으로 직접 과업 평가나 A/B 테스트\n            등을 진행하 는 방법이 있다. 고객의 평가는 제안한 해결안을 무효화하거나\n            고객의 문제 정의 자체가 잘못되었음을 드러낼 수도 있다.\n\n\n\n\n                                         서비스·경험디자인 이론서 283\n\f고객 플로우에 대한          프로토타입은 고객의 전반적인 사용 과정을 보여 줄 수 있고, 각각의 과정에 어\n이해                  떻게 접근해야 하는지에 대한 방법들을 제시해 준다. 최적의 사용자 경험, 사용\n                    자 인터페이스 그리고 상호작용하는 모든 구성 요소와 콘텐츠를 결정하는 수단\n                    이 될 뿐만 아니라 고객이 목표를 달성하기 위해 각 단계에서 어떤 새로운 부분\n                    들을 추가해야 하는지에 대한 탐색도 도와준다.\n\n\n\n전략에 대한 이해           프 로 토 타 입 평 가 를 통 해 제 품의 전 략 이 될 수 있 는 경 쟁 환 경 , 제 품\n                    포트폴리오의 방향, 사용자의 목표 등을 파악하여 서비스 비즈니스의 방향성을\n                    논의할 수 있다. 일정한 형태의 인공물은 제품과 서비스를 정의하는 데 많은\n                    도움을 줄 수 있다. 예를 들어 비즈니스 캔버스를 프로토타이핑 평가로 사용하게\n                    된다면 서비스 전략에 대한 다양한 양상을 명료하게 드러내거나 어떤 문제와\n                    질문, 가정들에 대해 평가를 해야 할지에 대해 제시해 줄 수 있다. 그 외에\n                    서비스 로드맵에 대한 평가는 단계별 비즈니스 착수 지점에 어떤 서비스가\n                    출시되어야 하 는지를 고려하여 이루어진다. 로 드맵을 통해 조직은 다음에\n                    진행되어야 할 작업들은 무엇일지, 미래 과업들을 위해 파이프라인상에 어떤\n                    것을 추가할지에 대해 정의할 수 있다. 따라서 로드맵은 살아있는 문서와도 같이\n                    사용자의 피드백과 행동을 기반으로 자주 업데이트를 지속하고 우선순위들을\n                    재정비할 수 있어야 한다.\n\n\n\n\n                    2. 소 통\n\n                    프로토타입은 다른 사람이나 팀, 이해관계자 및 고객에게 서비스 아이디어를\n                    가시화할 수 있는 유용한 도구이다. 프로토타입을 적절하게 사용하게 되면\n                    강력한 소통의 도구가 될 수 있다. 프로토타입은 추상적인 해결책들을 물리적\n                    매체 혹은 디지털 미디어를 통해 명료하게 드러내므로, 모호하고 일반화된\n                    생각 들 을 구체 적인 오 브젝 트 로 바 꿀 수 있다. 만 일 프 로 토타 입이 없는\n                    상태로 소통을 한다면 각자의 멘탈 모델을 중심으로 아이디어나 해결안을\n                    상상하기 때문에 각각의 기대들을 하나로 정렬하지 못할 수 있다. 제안하고자\n                    하 는 아이디어들에 대한 소통의 도구로 사 용할 때 소통하 는 대상에 따라\n                    프로토타입의 충실도(fidelity)와 목적은 아래와 같이 변할 수 있다.\n\n\n\n\n284 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f디자이너와 소통     디자이너에게 제안하고자 하는 서비스에 대한 콘셉트와 유용함을 평가받기\n             위해서는 시각디자인이 완성되지 않은 Lo-fi 프로토타입이 효과적이다. 시각적\n             완성도가 높 은 프 로 토타입을 평가받게 될 경우 디자이너들은 시각디자인\n             영역에 집중하여 고객의 사용 시나리오나 직관적인 상호작용들에 대해 집중적인\n             평가가 어려울 수 있다. 반대로 시각적인 부분에 대한 피드백을 얻고 싶을 때는\n             중간(mid) 수준과 높은(high) 수준을 적절히 섞어서 제시하면 효과적일 수\n             있다.\n\n\n이해관계자와의 소통   이해관계자와 소통하기 위한 프로토타입에서는 너무 높은 충실도(fidelity)를\n             가지고 소통하지 않는 것이 좋다. 만일 프로토타입 완성도가 너무 높을 경우,\n             이해관계자 는 마지막 단계로 여겨 더 이상 의견 제 시를 꺼려할 것이므 로\n             이해관계자와 이해에 대한 합의나 공동의 목표를 설정하는 것에서 멀어질 수\n             있다. 그래서 혼합(mixed) 또는 중간(mid) 수준의 프로토타입을 적절하게\n             선보여 공동의 목표를 설정하거나 자유롭게 의견을 개진할 수 있도록 해야 한다.\n\n\n투자자와의 소통     프로토타입을 투자자들이나 미래에 함께 일할 수 있는 구성원에게 보여 주는\n             것은 제안 하 는 서비스 아이디어와 프 로 토타입을 대하 는 헌신적인 자세를\n             보여주는 것으로써, 투자자나 미래 함께할 구성원들로 하여금 그 자체에 매력을\n             느끼게 한다.\n\n\n\n\n             3. 평가와 개선\n\n             대부 분의 프 로 토타입들은 개선을 위해 제작되고 평가된다. 이 단계에서는\n             프 로 토타 입을 통해 문제 가 제대로 해결되고 있는지 사 용자 평가 를 통해\n             확인받고자 하며, 이 평가가 이해관계자들의 합의안에서 서비스 설계의 고도화를\n             진행하게 된다. 사용자 평가 과정에서 완벽하게 디자인된 서비스 결과 물을\n             내고, 서비스의 목표를 달성하게끔 하 는 것도 좋지만, 개발 단계마다 작은\n             가설이라도 고객에게 지속적인 검증을 받아 완성도를 높이는 방법도 효과적이다.\n             일반적으로, 제안하는 서비스에 대한 개발자의 자신감과 의구심 등으로 인해\n             첫 번째 프로토타입 제작과 평가가 가장 힘든 과정을 거친다. 하지만 시간을\n             오래 끌수록 프로토타입은 더 복잡해지고 가설은 더 모호해지는 법이므로,\n             아이디어가 떠올랐을 때 고객에게 최대한 빠르게 평가를 받는 것이 중요하다.\n             만일 프로토타입 제작의 첫 시도에 여러 가지 난관이 예상된다면 필수적인\n             기능과 가설만 포함된 프로토타입을 통해 평가를 진행할 수도 있다. 어떠한\n             조각의 제품/서비스일지라도 프로토타입 평가를 통해 고객이 사용하는 단어나\n             분류하는 방식, 사용 행태, 패턴 등을 이해할 수 있게 된다.\n\n\n\n                                             서비스·경험디자인 이론서 285\n\f                    또한 기술적인 이해가 필요한 복잡한 상호작용을 포함하고 있는 서비스를\n                    평가할 때는 제품이나 서비스에 대한 편견을 바로잡기 위해 더 많은 횟수의\n                    고객/사용자 평가가 필요하다. 그리고 평가 대상자를 선택할 때는 해당 서비스에\n                    대한 첫 경험자와 기존 경험자들을 모두 포함함으로써, 평가 시 그들 간의\n                    간극을 살펴보는 것도 중요하다.\n\n                    모든 프로토타입은 각각의 가설을 검증하기 위해 존재하며 그 가설들은 사용성,\n                    가치 제안, 비즈니스 전략을 위한 내용들로 구성되어 있다. 프로토타입을 통해\n                    아이디어 평가에서는 제품과 서비스의 개선뿐만 아니라 고객과의 직접적인\n                    상호작용을 통해 그들이 무엇을 원하는지 직접적으로 알아낼 수 있다.\n\n\n\n                    4. 지지와 옹호\n\n                    프로토타입 평가 는 고객의 통찰력을 활용하므로 고객이 보여 주는 사용자\n                    경험의 변화들을 적극적으로 지원할 수 있다. 특히 제품 관리자, 이해관계자들\n                    및 개발팀을 포함하는 대규모 인원이 함께할 때 프로토타입 평가는 단순히\n                    디자인에 대한 결정을 보여 준다기보다 디자인의 가치와 추론을 입증하 는\n                    과정으 로 팀 내부의 소통을 위한 필수적인 과정이다. 따라서 팀원들 또는\n                    이해관계자 들과의 프로토타입 평가는 그들의 연결을 극대화시키고 사업의\n                    결과물에 대한 암묵적 동의를 얻어낼 수 있는 도구가 된다.\n\n                    아울러 이러한 프로토타입 평가는 이해관계자들의 언어와 생각을 이해할 수\n                    있을 뿐 아니라 고객 평가를 통해 현 시장에서 통용되는 정확한 홍보 콘텐츠와\n                    키워드를 끌어낼 수 있다. 또한 평가를 통해 사용자의 경험을 극대화하고 제품의\n                    가치를 제고함으로써 고객의 구매 가능성도 높일 수 있다. 그렇기 때문에 사용자\n                    경험을 최대화할 수 있는 가장 효율적인 방법은 프로토타입 평가를 통해 나온\n                    주요 인사이트(insight)들을 긍정적으로 수용하면서 실제로 서비스와 제품에\n                    적용하는 것이다. 이러한 일련의 진행 과정에서 이해관계자들 또는 함께 일하는\n                    팀들 간의 관계성이 중심이 될 수 있게 노력해야 한다.\n\n\n\n\n286 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                  5.1.2 프로토타입 평가 과정194\n194                               프 로 토타 입 평가 는 제안된 서비스 가 초기의 기획 의도 와 가치를 제대로\nMcElroy, K.(2016),\n《Prototyping for designers:       구현했는지 확인하기 위한 것으로, 제작된 프로토타입을 검증하고 평가하는\nDeveloping the best digital and\nphysical products》, O'Reilly\n                                  것은 실제 구현 단계에 들어가기 전에 품 질과 성능 을 확 인하며 사 용자와\nMedia, Inc..\n                                  이해관계자 들로부터 피드백을 얻기 위한 것이다. 프 로 토타입 평가 방법은\n                                  프로토타입의 형식, 일정과 예산, 목적, 대상자에 따라 달라질 수 있다. 또한\n                                  평가는 방법과 대상, 형태, 진행에 따라 내용이 달라진다. 따라서 프로토타입에\n                                  대한 반응을 볼 것인가, 프로토타입에 대한 문제점을 진단할 것인가에 따라\n                                  평가의 방법이 달라지기 때문에 목적을 명확하게 정의하 는 것이 필요하다.\n                                  프로토타입을 평가하는 과정은 다음과 같다.\n\n\n\n\n                                  1. 평가를 위한 사전준비\n\n\n                                  ① 평가계획\n\n                                  프로토타입에 대한 반응을 볼 것인가, 아니면 프로토타입에 대한 문제점을\n                                  세밀하게 진단할 것인가 에 따 라 평가의 목표가 달라지기 때문 에 평가 를\n                                  수행하기 앞서 목적을 명확하게 정의한다. 프로토타입을 제작하기 앞서 어떤\n                                  목적으로 프로토타입을 제작할지에 대한 계획을 세웠기 때문에 어느 정도의\n                                  평가에 대한 가설과 목표는 가지고 있을 것이다. 가설과 목표에 따라 전문가\n                                  평가, 사용자 평가, 사용성 평가 등과 같이 누구를 대상으로 어떤 방법으로\n                                  평가 를 진행할지 선택한 다. 잘 설계된 평가 는 참 여 자 에 게 특 정 행 동 을\n                                  직접적으 로 지시하기보다는 궁 극적인 목표를 제시하고 그 목표에 맞추어\n                                  참여자가 일련의 과업을 진행하며 평가에 몰입할 수 있게 유도한다.\n\n\n\n                                                                 서비스·경험디자인 이론서 287\n\f                      ② 진행자 및 참여자 선정\n195                   진행자 (Moderator)는 참여자가 어떤 목표를 달성해야 하 는지 알려 주고\n참여자를 선정할 때는 최대한 개발\n에 참여하거나 개발에 관련된 사람    그 과업들 을 달성하기 위해 옆에서 지속 적으 로 참 여자 를 독려하고 핵심\n이나 지인, 사업적으로 연관된 이해\n관계자들은 최대한 배제. 적합한\n                      질문들을 통해 평가를 진행하는 사람이다. 참여자(Participants) 195 는 평가의\n사용자가 선정되지 않는다면 평가\n                      목 적과 목표, 단계에 따 라 다르 게 설정된다. 시장 에서 실제 타깃이 되는\n의 설계의 완성도와 상관없이 편견\n등의 이유로 결과가 한쪽으로 치우    고객들을 중심으로 사용자 평가 를 진행할 때에는 해당 사람들을 선정하고\n치게 됨\n                      관련 전문가들을 리크루팅(recruiting)하면 된다. 사용자 평가 인원은 5-10명\n196\n                      내외로196 하는 것이 효과적이며, 만일 많은 사람들의 의견을 묻고 싶다면 1:1로\n적절한 사용자 평가 참여자 수\n                      진행되는 사용자 평가보다 여럿을 통해 의견을 묻는 FGI나 설문, 원격 평가와\n                      같은 방법을 채택한다. 참여자를 모집하는 방법으로는 리서치 회사 등을 통해\n                      전문적으로 리크루팅을 하는 방법도 있지만 시간과 비용이 많이 든다는 단점이\n                      있어 온라인 커뮤니티, 카페 등을 통해 리크루팅을 할 수도 있다. 또한 기본 자격\n                      요건, 평가의 목적, 진행 방법, 보상에 대해 충분히 정보를 제공해야 한다.\n\n                      ③ 평가 공간 및 기록물 준비\n                      프로토타입을 위한 평가 공간을 준비한다. 근래에는 비대면 방식으로도 평가가\n                      진행될 수 있으므로 공간은 꼭 물리적 공간이 아닌 사이버 공간이어도 된다.\n                      사용성 평가 실험실과 같이 전문적 시설을 이용하지 않을 경우에는 참여자의\n                      주의를 분산시킬 수 있는 모든 것을 최대한 정리한다. 소음, 조명, 좌석과 같이\n                      참여자의 집중을 방해할 수 있는 환경 변수들은 사전에 충분히 검토해야 한다.\n                      평가 내용 기록을 위한 비디오카메라, 녹음기, 카메라, 스크린 캡처 소프트웨어\n                      등과 같은 장치를 준비하고, 참여자가 부담을 느끼지 않도록 위치를 적절하게\n                      배치한다.\n\n                      ④ 동의서 및 사전, 사후 질문지 준비\n                      동의서는 평가에 참여하 는 데 대해 동의하 는 문서이고, 보안 각서는 평가\n                      대상인 서비스나 평가 자체에 대한 정보를 외부에 공개하지 않는다는 것에 대해\n                      서약하는 문서이다. 사전 설문지는 대부분 참여자의 인적 정보나 관련 서비스에\n                      대한 이해도를 파악하기 위한 것 위주로 질문하며, 사후 설문지는 평가가 끝난\n                      이후 추가적인 질문이나 정성적인 부분을 파악하기 위해 진행하기도 한다.\n\n\n                      2. 파일럿 테스트\n\n                      프로토타입과 평가를 위한 사전 준비가 완료되었다면, 정식 평가를 진행하기\n                      앞서 준비된 프로토타입과 평가의 목적이 서로 부합한가 를 확인하기 위해\n                      파일럿 테스트를 진행한다. 파일럿 테스트의 대상자는 내부 팀원이나 다른 팀원\n                      등 누구나 참여할 수 있고 간단하게 수행된다.\n\n\n\n\n288 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                      ⑤ 사용성 평가에서의 파일럿 테스트\n\n                      파일럿 테스트는 기술 체크, 사용성 체크, 데이터 체크를 하기 위해 진행된다.\n                      이 테스트 유형은 동시에 발생하거나 순차적으로 발생할 수 있다.\n\n\n197                   • 기술 체크는 최소 인원과 최소 시간 설정이 필요함. 이는 제품 생산 시 품질\n극단적인 상태에서 발생하는 문제\n나 상황                   보증 엔지니어가 사용하는 엣지 케이스(edge case) 197 를 돌려보기 위해\n                       사용하는 체크리스트와 비슷함.\n198\n가이드를 포함한 평가에 대한 소개,   • 사 용 성 체 크는 참 여자가 평가 시, 평가하고 자 하 는 과업을 제대로\n사전 질문지, 일반 질문과 과업들,\n참여자가 접하게 될 서비스, 평가의    이해하는지, 과업을 진행하기 위해 내비게이션을 할 수 있는지 등을 확인하는\n전반적인 흐름과 수행시간, 평가 경\n험에 대한 전반적인 만족도\n                       것으로198,2-3명의 인원이 2~3시간 정도의 과정이면 충분히 수행할 수 있음.\n                      • 데이터 체크는 소수 인원을 이용해서 기술 체크와 사용성 체크를 같이 수행한\n199\n파일럿 단계에서 필요한 참가자의      후, 대규모의 인원을 대상으로 참여자 수에 비례199하여 예행연습을 수행하는\n적정 수는 실제 조사에 참가가 예\n상되는 참여자 수에 비례해 결정됨.    단계. 올바른 데이터가 올바르게 제출되고 반환되었는지 여부보다는 오히려\n또한 파일럿 참여자 수는 평가의 복\n                       데이터의 질적인 면과 데이터의 ‘분별’에 더 집중함.\n잡도와 임계도와도 관련되어 있어\n대략 실제 조사를 완료하기 위해 필   • 참여자가 데이터 체크에서 오류를 범하는 이유는 시간 이슈, 다른 답변/경로,\n요한 인원 수의 10%정도를 참음\n                       기술적 결함, 해석의 오류 등이 있음.\n\n\n\n                      3. 프로토타입 평가 실행\n\n                      앞선 파일럿 테스트와 참여자 선정이 완료되면 평가일 이전에 개별적으로\n                      연락하여 참여 일정을 조정한다. 평가 진행 시에는 진행자, 부진행자, 기록자,\n                      참여자를 도와주는 사람, 기록 장치 담당자, 평가 장소 담당자 등으로 나누어\n                      진행한다. 평가를 진행하는 방법은 다음과 같다.\n\n\n\n\n                      프로토타입 평가 시 어떠한 경우에도 참여자를 탓하거나 책임을 묻지 않고\n                      참여자의 모든 행동과 대화 를 관찰하고 기록해야 한다. 기계적인 기록보다\n                      참여자와 상호작용하면서 의미 있는 내용은 따로 기록하여 평가 후 추가로\n                      질문을 하거나 평가 분석 시 참고한다. 진행자는 서비스의 특성과 기본적인\n                      사용 방법을 숙지해야 하고 필요에 따라 참여자를 적극적으로 도와줘야 하며,\n                      참여자 자신이 평가 대상자가 아니라 참여자로서 서비스를 평가하는 과정임을\n                      주기적으로 상기시켜야 한다.\n\n\n\n                                                       서비스·경험디자인 이론서 289\n\f                        5.1.3 프로토타입 평가 결과 분석\n\n                        프로토타입의 평가 방법, 유형, 대상자, 프로토타입 평가 목표에 따라 결과\n                        분석하는 방법은 다르다. 평가를 분석하는 단계에서는 프로토타입 평가 후\n                        생성된 미가공 데이터를 취합한 후 데이터를 분류하고 분석하여 이를 최종\n                        보고서를 통해 이해관계자들에게 배포하고 보완한다. 프로토타입 평가 데이터는\n                        크게 관찰과 인터뷰 등을 통해 얻은 정성적 데이터와 사용성 평가 등으로 얻은\n                        정량적 데이터로 나뉜다.\n\n\n                        1. 정성적 데이터 분석\n                        정성적 데이터는 대부분 인터뷰나 관찰 등 을 통해 나온 주관적 데이터로,\n                        참여자들의 특정한 심리의 속성을 이해하기 위해 분석적 도구로 사용된다.\n                        언어적 표현, 비언어적 표현, 행동, 맥락 등이 정성적 데이터에 해당한다.\n                        이 방법은 리서치 후 진행하 는 친화도 지도(Affinity Diagram)와 동일한\n                        방식이므로, 이를 참고하면 된다.\n\n\n                        ① 데이터 실체화하기\n\n                        정성적인 데이터를 실체화하는 과정은 다양한 형태로 만들어진 데이터들을\n                        한곳에 모아 적절한 포맷으로 바꾸어 분석할 수 있는 가시적인 형태로 가공하는\n                        과정이다. 중요한 이미지나 비디오의 한 부분들을 출력하고 관찰 내용과 인터뷰\n                        내용도 같이 출력하거나 포스트잇 등에 적는다. 이렇게 시각적으로 가공하여\n                        각기 다른 포맷, 애플리케이션, 장소에 흩어져 있는 다양한 데이터 조각들을\n                        모아 친화도 지도 또는 리서치 월(Research Wall)을 만들어 이들 간의\n                        관계성을 찾아볼 수 있다. 그리고 데이터를 실체화하는 과정에서 무의식적으로\n                        데이터를 처리하면서 인사이트를 얻기도 한다.\n\n\n                        ② 데이터 분류하기\n\n200                     시각화된 데이터들을 분류하는 체계는 다양하다. 데이터의 특성에 따라 분류할\n동작, 환경, 인터랙션, 대상, 사용자\n                        수도 있고 비슷한 맥락끼리 모아서 분류를 하거나 AEIOU 200 등으로 묶어서\n                        분류할 수도 있다.\n\n데이터 특성에 따른              언어적 표현\n분류                      언어적 표현은 평가가 진행되면서 참여자들이 언어로 표현한 것으로 긍정, 부정,\n                        중립으로 분류하고 각각의 비율을 살펴본다.\n\n                        비언어적 표현\n                        비언어적 표현은 표정과 몸짓, 목소리의 강약, 미묘한 뉘앙스에 해당되는 것으로\n\n\n\n\n290 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f무의식 중에 드러나기 때문에 언어적 표현보다 신뢰도가 높다. 또한 그 나라의\n민족만이 공유하는 문화적인 습성이 담겨 있기 때문에 한 문화권 내에서는\n대체로 일관된 의미를 갖는다. 표정은 분노, 혐오, 기쁨, 놀람, 두려움, 불쾌함,\n중립과 같은 정적인 얼굴 표정을 분류한다. 행동 데이터는 참여자들을 관찰하고\n기록한 뒤 행동들 사이에 숨어 있는 일정한 패턴을 발견하고 문제점이나 숨은\n니즈를 발견할 수 있는 것으로, 참여자 행동에서의 특이점이나 의도와 일치하지\n않는 사용자 행동 패턴을 정리할 수 있다.\n\n\n③ 데이터 분석하기\n\n정성적 데이터를 분 석하면서 핵심적인 정보의 발견, 문제의 원인 분 석 및\n새로운 시사점 도출을 통해 서비스의 개선안을 마련할 수 있다. 정성적 데이터를\n분석하는 방법으로는 조각으로 나누거나(분석), 전체를 요약하거나, 데이터를\n통해 매핑 또는 모델링(외삽, 추상)하는 방법이 있다.\n\n전체 프로세스, 활동, 대상, 환경들을 각각 구성하는 요소로 쪼개는 작업으로,\n쪼개진 각 부분들은 개별적인 성격과 특성을 발견하기 위해 다시 관찰된다.\n분석은 타임라인과 같이 단계를 개별 순간으로 쪼개는 형태의 모델을 만들어\n낸다. 모델링 방법으로는 전체 프로세스를 잘게 나누어 어떤 문제와 가능성이\n있는지를 발견하는 고객 여정 지도와 접점들을 분석하는 서비스 터치포인트\n매트릭스가 있다. 고객 여정 지도 와 서비스 터치포인트 매트릭스가 함께\n포함되어 프로세스 각 단계별 서비스 접점이 어디에 있는지 보여 주는 프로세스\n맵이 있다.\n\n④ 이슈 사항 도출하기 및 작성하기\n\n분석이 진행되면 다음과 같은 방법을 통해 보완을 위한 이슈 사항들을 도출한다.\n\n- 데이터와 친숙해지고 모든 이슈를 파악한다.\n\n- 유사한 이슈를 같은 그룹으 로 묶어 그룹 내, 그리고 그룹 간의 패턴과\n  관련성을 파악한다.\n\n- 맥락을 고려하여 발생 빈도가 낮은 이슈나 중요하기 때문에 수정해야\n  하는 이슈가 있을 경우 이에 따른 이슈의 심각성을 파악한다.\n\n- 이 슈의 우 선 순 위 를 정한 다. 종합적인 이 슈 리 스 트 가 확 보 되었다 면\n  우선순위를 정해야 한다. 위의 이슈 사항들에 대해서는 사용자 니즈 백로그\n  및 사용자 스토리, 사용자 니즈로 작성한다. 사용자 니즈 목록화는 해야 할\n  일과 제거해야 할 장애물을 기록하는 데 유용하게 쓰이는 반면 사용자에\n  대한 심도 있는 이해를 제공하지 않기 때문에 멘털 모델 또는 페르소나를\n  사용하기도 한다.\n\n\n                                 서비스·경험디자인 이론서 291\n\f                    2. 정량적 데이터 분석\n\n                    정량적 데이터는 사용성 평가 등 실증 연구에서 진행된 평가 결과로 변수 또는\n                    수량, 상호 간의 관계를 드러내는 숫자 데이터 등이 여기에 포함된다.\n\n                    ① 정량 데이터 준비하기\n\n                    정성적 데이터가 다른 종류의 데이터들을 실체화하고 시각화하는 작업을 사전에\n                    준비한다면, 정량적 데이터의 경우에는 성공 데이터, 시간변수, 자가 보고 변수,\n                    클릭 스트림 데이터 등을 준비할 수 있다.\n\n                    성공 데이터 : 성공 변수를 기록하는 방법으로 텍스트 데이터를 숫자로 바꾸는\n                    방법이다. 예를 들어 “1”은 성공으로 “0”은 실패를 의미하는 것으로 빈도분석,\n                    교차분석, 카이제곱분석 같은 기본적인 통계함수 수행을 위해 필요하다.\n\n                    시간 변수 : 과업을 진행하면서 걸린 시간 을 표 시하 는 것으 로 과업 완료\n                    시간뿐만 아니라 특정 한계점을 충족시키는지도 설정할 수도 있다. 특정 수행\n                    시간을 기준으로 참가자의 분류를 제한하는 것 외에도 ‘빠름, 중간, 느림’과 같은\n                    시간 간격으로 분류할 수도 있다.\n\n                    자가 보고 변수 : 전반적인 만족도, 사용 용이성에 대한 평가, 과업에 대한\n                    신뢰와 같은 자가 보고 변수들은 따로 변환 또는 기록할 필요가 없다. 다만 자가\n                    보고 변수의 척도가 긍정에서 부정으로, 혹은 부정에서 긍정으로 바뀐 경우와\n                    같이 평가 태도가 달라지게 한 변수들을 나열하는 것이 유용하다.\n\n                    클릭 스트림 데이터 : 클릭 스트림 데이터는 참여자들이 과업을 수행하는 동안\n                    어떻게 이동했는지를 보여 주는 상세한 로그 기록이다. 로그는 일반적으로\n                    방문한 화면, 화면별 소요 시간, 이동 경로 등을 보여줌으로써 서비스를 얼마나\n                    쉽게 이용했는지, 어떤 화면이 얼마나 혼란을 주었는지, 어떤 화면과 기능이\n                    목표에 도착할 때까지 중요한 역할을 했는지에 대한 내용을 제공한다.\n\n\n                    ② 정량 데이터 분석하기\n\n                    전 통 적인 실험 실에 서 진행되 는 정량 조 사, 사 용 성 평가 는 평가자 와\n                    이해관계자 들이 참여자 들의 평가 장면을 직접 관찰함으 로써 평가 내용을\n                    분석할 수 있지만, 다수를 대상으로 하는 프로토타입 평가와 같은 경우에는\n                    관찰 방식 대신 데이터에 대한 직접적인 분석이 진행되어야 한다. 즉, 데이터\n                    경 향 을 파 악 하 고 과 업, 조 건, 평 가 참 여 자 간 차 이 점 을 알 아 봄으 로 써\n                    디자인상의 사용성/유용성/효과성 등의 이슈를 식별하거나, 디자인 간 또는\n                    버전 간의 차이를 비교해야 한다. 정량적인 테이터는 빈도수를 합산하거나 평균,\n                    표준편차 등을 구해서 그래프로 나타낼 수 있다.\n\n\n292 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f과업 성과 데이터(과업 성공 여부, 시간, 효율성 등) : 참여자의 행동을 대변한다.\n\n자가 보고 데이터(평가척도, 선호 대상, 순위, 코멘트, 추가 답변 등) : 참여자의\n반응을 나타내는 것으로 개별적인 과업과 세션 수준에서 수집된 것이다.\n\n클릭 스트림 데이터 : 성과데이터와 유사하게 참가자의 행동을 대변하지만\n사용자의 니즈와 페인 포인트 등을 확인해 볼 수 있다.\n\n\n③ 핵심 이슈 도출하기\n\n대부분의 정량적 평가에는 디자인에 대한 사용성 이슈를 식별하거나 디자인\n대안을 비교하는 활동을 통해 핵심 이슈를 도출하는 과정이 포함된다. 사용성\n이슈를 식별하기 위한 방법은 다음과 같다.\n\n문제 과업에 대한 초점 : 낮은 과업 성공률, 가장 긴 시간, 제일 낮은 과업의\n용이성 등을 통해 문제가 되는 과업을 추출한다. 특히 클릭 스트림 데이터를\n이용하면 과업을 실패한 참여자의 이동 경로를 찾아낼 수 있어, 문제가 되는\n지점에 대한 인사이트를 제공받을 수 있다. 만일 클릭 스트림 데이터가 없다면\n사용자의 피드백과 의견 등에서 단서 등을 찾을 수 있다.\n\n오류 분석 : 참여자가 오류를 일으켰을 때 많은 것을 얻을 수 있다. 사용성\n이슈가 오류 를 만 들 어 내 고 오류 가 사 용 성을 만 들 어 내기 때 문 에 이는\n근본적으로 사용성 이슈를 식별하는 데 도움을 준다.\n\n코멘트 분석 : 사용성 이슈를 알아내기 가장 좋은 원천은 과업별 참여자들의\n의견이다. 사용자들의 의견들 간에 숨어 있는 공통 주제를 찾아내고 참여자가\n지적한 근본적인 사용성 이슈를 발견하는 것이 중요하다.\n\n이 외에도 사용성 평가 척도를 사용하여 이슈를 목록화할 수 있다. 사용성\n평가 척도에는 시스템 성능 측정과 사용자 성능 측정이 포함되어 있기 때문에\n경쟁사들과의 평가, 출시 전에 의사결정을 할 수 있다. 시스템 응답 시간, 발생\n에러 수, 과업을 완료하기까지 소요되는 시간, 과업 성공률, 사용자 만족도 평가\n등이 포함되는 평가 척도는 다음과 같은 ISO/IEC 9126-4 Metrics 사용성\n품질 기준을 구성하는 세 가지 포인트로 요약될 수 있다.\n\n- 유용성 : 참여자들이 특정 목표를 달성하기까지의 정확성과 완전성\n\n- 효율성 : 사용자들이 원하는 목표를 달성하기 위해 정확성과 완전성에\n 기울이는 자원\n\n- 만족도 : 사용에 대한 편리성 및 수용성\n\n\n\n\n                                 서비스·경험디자인 이론서 293\n\f                    5.1.4 프로토타입 보완 및 문서화\n\n                    프로토타입 평가와 보완은 단발적인 행사처럼 끝나지 않는다. 평가와 보완의\n                    반복적인 과정을 진행하면서 최적화된 프로토타입을 제작해야 한다.\n\n\n\n\n294 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f1. 핵심 사항 공유\n보 고 서를 만 들기 전에 문제 해 결 방 법과 평가 를 통 해 확 인된 기회 들 을\n극대화하기 위한 여러 가지 변경 사항들을 이해관계자로부터 승인받기 위해 이슈\n사항, 개선 사항, 해결책, 권고사항들을 공유한다. 결과물을 공유함으로써 초기\n해결책, 제안, 다음 단계들을 브레인스토밍할 수 있는 워크숍을 진행하는 것도\n좋다.\n\n권고할 수 있는 사항으로는 내부 프로세스 수정, 디지털 제품의 프론트엔드와\n백엔드 수정, 브랜드 재정렬, 제품 및 서비스 제안 재정렬, 커뮤니케이션 및\n콘텐츠 수정 등이 있으며 단계별 예산, 난이도 등을 통해 추천 목록들을 정의할\n수 있다.\n\n\n2. 평가 결과 문서화\n\n결과 보고서를 작성하기 위한 사항들은 평가의 목표, 프로젝트에서의 단계,\n사용 가능한 시간과 청중에 따라 다르다. 예를 들어 애자일 프로세스(Agile\nProcess)일 경우에는 이슈, 추천, 영상 재생 등을 간략하게 작성하고 CEO나\n책임자 를 위해 서는 간 략 한 보 고 서 개요, 비즈니스 애널리스 트나 개발자,\n이해관계자들을 위해서라면 상세 보고서를 준비한다. 일반적인 결과 보고서\n작성을 위해서는 다음과 같은 내용이 포함되어야 한다.\n\n보고서 개요 : 보고서 개요는 마지막에 작성되어야 하며, 적합한 청중에게 따로\n공유될 수 있을 정도로 독립된 문서여야 한다. 짧은 맥락을 소개하는 글과 함께\n평가 목적, 평가 및 분석 방법론, 결과 및 이슈/권고 사항, 한계점 및 내용 종합이\n포함되어야 한다.\n\n참여자 에 대한 정보 : 참 여자의 개인 정보가 드러나지 않는 범위 안 에서\n참 여 자 의 인 구 통계학적 특 성 을 상 세 하게 언 급 함 으 로 써 그들의 모습 을\n실제화시키는 것이 중요하다.\n\n보고서 해석 방법 : 청중이 보고서를 더 잘 이해할 수 있도록 해석하는 방법에\n대한 간략한 안내 정보를 추가할 수 있다. 또한, 문자로 된 설명과 함께 해당되는\n경우에는 결과 및 권고 사항, 제안 사항에 대한 비주얼 목업을 포함하는 것이\n유용하다.\n\n명확한 핵심 사항 및 다 음 단계 : 서비스 스 토리가 아무리 명확해도 핵심\n사항들은 분명히 해야 한다. 이 평가에서 얻은 것이 무엇이며 평가가 의미하는\n것이 무엇인가에 대한 정보를 가지고 의사결정 할 수 있을 정도로 명확하게\n전달해야 한다. 또한 다음 단계에 대한 방향성 제시를 명확히 해야 한다.\n\n\n\n                                 서비스·경험디자인 이론서 295\n\f                    5.1.5 사용성 평가\n\n                    사용성 평가(Usability Test)는 프로토타입을 평가하는데 가장 많이 활용되는\n                    방법이다. 실제 대상 고객과 사용자를 불러와서 직접 사용하는 상황을 제공하고\n                    주어진 과업과 단계를 수행하도록 요청함으로써 실제 의견을 듣고 사용하는\n                    모습을 관찰한다. 또한 정확도 시간, 효율성, 시간, 에러 발생률 등 수치적인\n                    측정을 통해 프로토타입에 대한 사용자들이 느끼는 사용성 품질을 정량적으로\n                    평가한다. 사 용 성 평가 는 사 용자 중 심 인터랙션 디자 인(User Centered\n                    Interaction Design)에서 제품을 사용자에게 테스트하여 평가하는 기술로,\n                    실제 사용자가 시스템을 사용하 는 방법에 대한 직접적인 입력을 제공하기\n                    때문에 사용성에 대한 대체 불가능한 일반적인 평가 방법으로 알려져 있다.\n\n                    1. 역사\n                    사용성 평가는 1980년 초기에 제품의 평가와 피드백을 얻어내기 위해 시작되었다.\n                    1981년 알폰세 차페인스(Alphonse Chapanis)와 그의 동료들은 5-6명의 고객\n                    평가로도 대부분의 문제를 드러낼 수 있다고 하였고 더 확실한 계산법을 위해\n                    1982년에는 짐 루이즈(Jim Lewis) 분포를 모델링하는 항식에 대한 첫 연구가\n                    발표되었다. 그 이후엔 별다른 연구 성과가 나타나지 않다가 컴퓨터에 GUI가\n                    활발히 사용되기 시작한 1990년대가 되면서 사용성 평가에 대한 정밀한 요구와\n                    표본 크기의 모델링을 위하여 이항을 사용하는 연구가 발표되었다.\n\n\n\n\n                    1993년에 제이콥 닐슨(Jakob Nielsen)과 톰 랜더(Tom Landauer)는 휴리스틱\n                    평가 를 통해 한 명의 사용자는 평균 31%의 문제점을 발견한다고 밝혔다.\n                    1995년부터 2000년 사이에는 사용성 평가와 관련한 연구들이 많이 진행되지\n                    않다가 2000년 닷컴 붐이 일어나 HCI가 메인스트림 분야로 각광을 받게 되었다.\n\n296 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f당시 닐슨은 “왜 우리는 사용성 평가를 위해 5명만 필요한가?”에 대한 유명한\n웹 기사를 작성하여 지난 몇 십년 간 진행된 사용성 평가와 관련된 연구들을\n총망라하였다. 여기에서 제시된 그래프가 그 유명한 “ The parabola of\noptimism(Jared Spool)”이다.\n\n\n\n\n사용성 평가를 진행하기 위해 디자이너들은 다양한 방법을 사용하지만, 주요\n방법은 탐구형, 평가형, 비교형으로 축약된다.\n\n- 탐구형은 와이어프레임 등 Lo-fi 프로토타입을 사용자에게 보여 주고,\n  그들을 관찰하는 방식으로 진행된다. 탐구형은 사람들이 얼마나 콘셉트를 잘\n  이해하는지, 또 제품을 사용하면서 그들의 정신 모형이 어떻게 작동하는지\n  알아내기 위해 사용된다.\n\n- 평가형 사 용 성 평가 는 Mid, Hi-fi 프 로 토타입을 설계한 후 서비스를\n  제안 하기 바로 전 단계에 서 진행된다. 앱이나 웹 사 이트 의 효율 성을\n  평가하는 방법으로 실시간 실험을 통해서 사용자들의 반응을 관찰하고 어떤\n  에러들이 발생하는지 수집한다.\n\n- 비교형은 디자이너가 여러 가지 제안 중 하나를 골라야 할 때 사용된다.\n  사용자들은 두 가지 이상의 다양한 제품과 서비스를 비교하게 되고 그것을\n  공유하게 된다.\n\n- 흔 히 게릴라 테 스 트 라고 도 불 리 는 이 방 식 은 프 로 토 타 입이 설 치 된\n  복도를 지나가 는 무 작위 사 람들 에게 무 작정 부탁 하 여 해당 서비스나\n  제품의 프 로 토타입에 대해 평가 를 받는 방식이다. 복도 테스 트 방식은\n  저렴하게 진행될 수는 있지만, 제품을 기꺼이 사용하고 이에 대한 피드백을\n  적극적으 로 줄 수 있는 불 특 정 다 수 를 대상으 로 하기 때문 에 알맞은\n  사 용자 를 찾기 어렵고 양 질의 응답을 확 인할 수 없다는 한계가 있다.\n  구체적인 사용성보다는 해당 서비스나 제품에 대한 고객의 호응도/선호도를\n  측정하기에 적합한 방식일 수 있다.\n                                  서비스·경험디자인 이론서 297\n\f                             2. 일반 사용성 평가\n\n                             ① 실험실 사용성 평가\n\n                             실험실 사용성 평가는 대면 테스트로 평가자와 사용자가 동시에 같은 장소에서\n                             상호작용하는 방식이다. 반면 원격으로 이루어지는 테스트는 평가자와 사용자가\n                             다른 장소에 있지만, 스크린 공유 기술들을 사용하여 상호작용한다.\n\n\n                             진행자가 있는 사용성 평가는 참여자와 진행자가 실시간 상호작용이 원활한\n                             상태에서 질문을 유도하거나 질문에 대해 답변할 수 있기 때문에, 진행자에게\n                             더 많은 통제권이 있다. 이는 현재 발생하고 있는 과업 관련 맥락들에 대한\n                             인사이트를 제공하고 참가자들의 행동과 표정을 통해 감정 상태에 대한 이해를\n                             용이하게 한다. 또한 관찰된 인사이트들을 토대로 다른 과업이나 행동을 유도할\n                             수 있고 더 심도 있는 인사이트로 발전이 가능하다. 그 외에도 보조적인 기술이\n                             필요한 사용성 평가일 경우 한 공간에서 직접 시연하거나 실시간으로 도움을 줄\n                             수 있기 때문에 효율성이 높다.\n\n\n201                          실험실에서 진행되는 사 용 성 평가 는 현장 에서 이루어지기 때문에 시간과\n호손 효과( - 效果, 영어:\nHawthorne effect, observer   물리적 제약으로 인해 오랜 시간이 소요된다. 특히 5명 이내의 소수 인원만을\neffect)는 일종의 반응 현상으로서\n개인들이 자신의 행동이 관찰되고\n                             다루기 때문에 통계적으로 유의미한 결과치를 얻어내기 힘들고 인사이트에 대한\n있음을 인지하게 될 때 그에 대한 반\n                             이해관계자들의 신뢰를 얻기도 쉽지 않다. 또한 이 방법은 호손 효과(관찰자\n응으로 자신들의 행동들을 조정, 순\n화시키는 것                       효과) 201로 인해 참여자의 자연스러운 행동을 이해하기에는 적절하지 않다.\n\n                             평가단계\n\n                             진행 자 나 관찰자가 있는 사 용 성 평가 는 앞서 제 시한 평가 유형 중\n                             탐구형에서부터 평가형, 비교형까지 모두 다 어느 단계에서든 사용될 수 있다.\n                             대면으로 진행되는 정량적 평가를 진행할 경우 사람들의 표정과 보디랭귀지를\n                             관찰하면서 현재 발생하고 있는 일들에 대해 더욱 심도 있는 이해가 가능하기\n                             때문에 대면형 평가방법을 추천한다.\n\n                             평가 방법\n\n                             평가를 진행하기 위해서는 스크립트나 프로토콜 문서가 사전에 작성되어야\n                             한다. 사용성 평가에 쓰이는 스크립트가 문서에 적힌 순서 그대로 따라하고\n                             행동하기 위해 사용되는 문서라면, 프로토콜은 내용을 그대로 따라하지 않고\n                             상황에 맞게 순서를 바꾸어 수행하거나 불필요한 경우 다음 단계로 넘어갈 수\n                             있다. 스크립트와 프로토콜에는 다음과 같은 내용이 포함된다.\n\n\n\n\n298 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                      소개\t\t\t\t\t\t\t\n                      참가자들에게 평가 내용을 소개하고 세션이 어떻게 진행될지, 진행 과정이 기록으로\n                      남는다면 어떻게 기록되는지, 수집된 데이터들은 어떻게 사용될지에 대해 설명한다.\n\n                      사전 인터뷰 내용\t\t\t\t\t\t\t\n                      참여자 선택의 과정에서 사용자에 대한 최소한의 정보는 확보하고 있지만, 사전\n                      인터뷰를 통해 그 밖의 맥락 정보를 확인하고 본격적인 평가에 앞서 긴장을 푸는\n                      단계이다. 질문에는 참여자들이 과업이나 평가 분야에 관련된 경험이 있는지를\n                      확인하는 내용이 포함되어, 평가 도중 관찰되는 참가자들의 모습, 행태에 대한 맥락\n                      정보들을 이해할 수 있다.\n\n                      과업 목록 : 사용성 평가 시 프로토타입 평가 목표에 따라 탐색적 평가 유형의\n                      개방형 과업(open-ended task), 평가적 유형의 구체적인 과업(specific\n                      task)을 사용할 수 있다.\n\n202                   • 탐색적 평가 유형의 개방적 과업은 참여자들에게 어떻게 과업을 수행해야\n탐색적 조사란 연구 주제에 대한 지\n식이 부족하거나 특정 주제를 탐색     하는지 목표만 지정해 주고 최소한의 정보와 설명만 제공하여 그들이 스스로\n해야 할 때 진행되는 예비조사\n                       해답이나 해결책을 발견할 수 있도록 하는 방법이다. 이는 새로운 서비스나\n                       제품을 프로토타입으로 평가할 때 쓰는 방법으로 탐색적 조사 202에 적합하다.\n                       또한 이는 참여자에게 문제들을 보여 주는 대신 문제를 찾아 나서게 하는\n                       방법이므 로, 참 여자 들이 자유 롭게 탐구 를 진행하 는 모습 을 통해 미처\n                       인지하지 못했던 이슈들을 발견할 수 있다.\n\n                      • 평가적 유형의 구체적 과업은 특정한 이슈들에 대해 묻고 싶을 때 사용하는\n                       것으 로 사 용자 들 이 어떠한 행 동 을 해 야 하고 , 어떠한 기 능 에 대해 서\n                       이야기해야 할지에 대한 명확한 가이드를 제공한다. 이를 통해 사용자들이\n                       특 정한 특 성 또는 기능에 대해 평가하고 고객 여정의 맥락을 재현하 여\n                       개발자에게 인사이트를 제공할 수 있다. 기술적 진입 장벽이 있는 제품 및\n                       서비스의 학습곡선이 존재한다면, 미리 참여자들에게 안내하고 맥락을 설명할\n                       수 있는 구체적인 과업을 제시해야 한다.\n\n\n\n\n                                                       서비스·경험디자인 이론서 299\n\f                    사후 인터뷰 내용\n\n                    과업에 대한 평가가 완료되면 모든 평가 세션을 끝내기 전에 몇 가지 인터뷰를\n                    진행하 는 것이 좋다. 여기에서의 질문들은 중립적으 로 진행되도록 계획을\n                    세워야 하며, 평가 세션을 진행하는 동안 특정 질문들을 수정하거나 추가하거나\n                    배 제 해 도 된다. 참 여 자 들 은 마지막 사후 질 문 을 통 해 자 신 들 이 경험한\n                    것을 전반적으 로 정리하게 된다. 간혹 참여자 들이 평가 수행 중 지나치게\n                    긍정적이거나 부정적일 경우 사후 질문 세션을 통해 정확한 경험을 다시 정의할\n                    수 있다. 질문에 대한 내용은 아래 내용들을 포함하고 있다.\n\n                    • 전반적인 서비스 경험에 대한 설명\n                    • 기대와 예상\n                    • 이해와 난이도\n                    • 추가할 사항이나 삭제 또는 변경해도 될 사항\n                    • 추가적인 언급이 필요한 부분\n\n\n                    ② 원격 사용성 평가(Remote Usability Testing)\n\n                    사용자 평가자, 개발자, 이해관계자, 참여자가 서로 다른 공간이나 국가에 있거나\n                    시간대가 다를 경우 실험실에서 운영되는 사용성 평가 는 비용과 시간적인\n                    면에서 한계가 있다. 사용자와 평가자가 서로 시간과 공간이 분리된 상황에서의\n                    문제를 극복하기 위해 원격 사용성 평가의 필요성이 제기되었다. 원격 사용성\n                    평가는 원격으로 사용자에게 일련의 도전과 과업을 부여하고 질의응답을 하는\n                    식으로 진행된다. 원격 사용성 평가는 평가자와 개발자, 참여자가 처한 물리적인\n                    한계를 극복하게 하고, 동시에 참여자의 평소 작업 및 기술의 맥락 안에서\n                    평가를 진행하여 더 자연스러운 결과를 얻을 수 있다는 이점이 있다.\n\n                    원격 사용 성 평가 는 동기식 또는 비동기식으 로 이루어질 수 있다. 전자는\n                    진행자가 평가를 진행하는 실시간 커뮤니케이션인 방식이고 후자는 진행자가\n                    없이 참여자와 진행자/평가자가 서로 다른 시간대에 평가를 하는 방법이다.\n\n                    동기식 원격 사용성 평가\n                    진행자가 있는 원격 평가(동기식)는 프로토콜 초안 작성 부분에서 대면 사용성\n                    평가와 준비과정이 비슷하다. 원격과 대면 사용성 평가의 주요한 차이점은\n                    실험자와 참여자를 연결시켜 주는 기술에 있다. 예컨대, 참여자의 보디랭귀지나\n                    표정을 쉽게 볼 수 없다 는 원격의 한계점을 극 복하기 위해 원격 사 용 성\n                    평가에서는 프롬프트나 질문들이 대면 환경보다 많이 필요하다. 또한 원격\n                    사용성 평가에서는 참여자의 혼란, 생각 등에 대해 제어를 할 수가 없기 때문에\n                    참여자를 방해하지 않으면서 능동적으로 청취할 수 있는 완벽한 균형을 찾기가\n                    더 어렵다.\n\n300 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f원격 테스 트용 도구 는 다 양 하지만, 어떤 도구 를 사 용할지에 대한 판단은\n어떤 제품이나 서비스를 준비하는지, 프로토타입 충실도가 어떠한지에 따라\n달라진다. 예를 들어 웹 사이트를 평가할 때는 참여자의 화면을 공유하면 된다.\n이는 가장 빠르고 간편하게 원격 테스트를 할 수 있는 방법이다. 안전한 서버에\n올라가 있는 프로토타입을 평가한다면 참여자가 직접 프로토타입을 접속할 수\n있는 권한을 주어 평가를 진행시키면 된다.\n\n\n                       참여자\n                     participants\n\n\n\n                                       테스트 하는 화면\n        진행자                          Testing Usr Interface\n       facilitator\n\n\n\n\n비동기실 원격 사용성 평가\n\n진행자가 없는 상태의 원격 사용성 평가는 진행자가 있는 사용성 평가보다\n더 현실적이고 과업을 수행하 는 동안 평가자의 편견이 개입되지 않는다.\n또한 사용자가 원하 는 시간대와 장소에서 과업을 수행할 수 있어, 대규모\n평가가 가능하고 융통성이 있다. 이 방식은 실시간으로 참여자와 소통할 수\n없기 때문에 참여자의 클릭을 자동으로 수집하고 참여자가 관련 서비스와\n상호작용하는 동안의 중요한 사건 내용들을 기록한다. 이러한 방식은 발생하는\n문제들을 실시간으로 처리할 수 없고 설명이 부족하기 때문에 문제에 대한 심도\n있는 관찰이 어렵다. 이를 극복하기 위하여 원격 평가를 위한 전문 도구들을\n적극적으로 사용한 후 사전 설계된 후속 질문들을 통해 연구를 고도화할 수\n있지만, 대면 평가와 달리 심층적인 인터뷰 등이 진행되지 않기 때문에 이를\n보완하기 위해 이메일이나 통화를 활용하여 사용자에 대한 추가 인사이트를\n확보하기도 한다. 또한 사용자가 지속적으로 ‘THINK ALOUD’ 기법을 사용할\n수 있게 장려할 수 없다는 문제가 있다.\n\n\n\n\n                                    서비스·경험디자인 이론서 301\n\f                    진행자가 없는 원격 사용성 평가는 다음과 같은 목적으로 사용할 때는 유용하게\n                    사용될 수 있다.\n\n                    • 큰 표본이 필요할 때\n                    • 실험실로 참여자를 초대하는게 어려울 때\n                    • 예산이 한정되어 있거나 기간이 촉박할 때\n                    • 특정 맥락에 유효한 인사이트를 얻는 것이 필수적일 때\n\n\n\n                    진행 방법\n\n                    진행자가 없는 사용성 평가를 수행하기 위해서는 참여자에게 평가하고자 하는\n                    것이 명확하게 설계되어 있어야 한다. 프로토콜 또한 다음과 같은 형식으로\n                    명확하게 정의되어 있어야 한다.\n\n                    • 소개 : 과업을 시작하기 전에 읽고 동의할 수 있는 문서를 준비한다. 과업과\n                      세션 길이, 평가 주제, 데이터는 어떻게 수집되고 어디에 쓰이는지에 대한\n                      내용을 문서로 준비한다. 또한 참여자에 대한 간단한 정보를 수집할 수 있는\n                      설문지도 함께 준비한다. 이는 진행자가 있는 조사와 비슷한 형식으로 미리\n                      문서를 준비하여 참여자가 과업을 실시하기 전에 읽어 보게 한다.\n\n                    • 과업 준비 : 참가자들이 과업을 수행하는 동안 개방형 질문보다는 폐쇄형의\n                      구체적인 질문을 제공한다. 명확하고 구체적인 과업이 준비되어야 한다.\n                      진행자가 없이 진행되므로 과업은 간결하고 쉽게 따라 할 수 있어야 한다.\n                      특히 한 번에 한 개의 과업만 완료하는 것이 중요하다.\n\n                    • 파일럿 테스트 수행 : 평가에서 확인하고 싶은 과업들의 수행 시간이 얼마\n                      정도 걸리는지 알아보기 위한 파일럿 테스트를 실시한다. 진행자가 없는\n                      평가는 짧은 세션이 더 효과적이고 사용자의 자발적 동기에 의존해야 하기\n                      때문이다.\n\n                    • 과업/평가 수행 후 : 모든 과업이 종료되거나 각각의 과업이 종료되고 난 뒤\n                      과업에 대한 만족도 조사를 실시한다. 시스템 사용성 척도 등을 사용할 때는\n                      10가지의 항목에 점수를 매겨야 한다.\n\n                    진행자가 있는 평가와 없는 평가는 상호 보완적이다. 따라서 두 유형의 평가를\n                    모두 진행해 볼 수 있다. 예를 들어, 진행자가 없는 상태로 참여자의 맥락 안에서\n                    자연스럽게 평가를 수행한 후, 심층 인터뷰 등으로 보완할 수 있다.\n\n\n\n\n302 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                  3. 전문가 평가(Expert Review)\n\n203                               전문가 평가는 제안된 서비스나 프로토타입의 사용성 문제를 확인하기 위해\nNielsen Norman Group “10\nUsability Heuristics for User     사용성 원칙, 인지심리학의 원리를 이용하여 전문가의 시각으로 검사하 는\nInterface Design”\n(https://www.nngroup.\n                                  과정이다. 이 과정은 일반적으로 휴리스틱 평가, 사용성 지침, 인지심리학 및\ncom/articles/ten-usability-\n                                  HCI와 같은 사용성 관련 분야의 원칙을 기반으로 진행된다. 전문가 평가는\nheuristics/)\n\n204\n                                  사용성 지침, 원칙뿐만 아니라 전문가의 프로젝트 경험 및 전문 지식을 활용하여\nAbby Covert “Information          평가를 진행하기 때문에 ‘전문가’라는 단어를 붙여 사용되고 있다.\nArchitecture Heuristics”\n(https://abbycovert.com/ia-\ntools/ia-heuristics/)             휴리스틱이란 시간이나 정보가 불충분할 때 사용자가 합리적인 판단을 할 수\n205                               없거나, 굳이 체계적인 판단을 할 필요가 없는 상황에서 신속하게 사용하는\nHeurio “20 usability guidelines\nby Susan Weinschenk and\n                                  어림짐작의 기술을 의미한다. 실제 사용자 평가를 하기에는 리크루팅이 어렵거나\nDean Barker.”\n                                  시간이 부족할 때 실제 사용자 평가 이상으로 다양한 의견을 얻기 위해서\n(https://www.heurio.\nco/weinschenk-barker-             사용하는 방법으로 전문가 그룹이 휴리스틱 평가의 주체가 되어 사용성 평가를\nclassification)\n                                  수행할 수 있다.\n\n                                  휴리스틱 평가는 발견적 조사로 해석할 수 있으며, 서비스의 성능과 품질이\n                                  적절한지를 평가하 는 가 장 일반적인 품 질 측 정 방법이다. 또한 휴리스틱\n                                  평가는 전문적인 지식과 경험을 기초로 하여 서비스의 품질과 가치에 대한\n                                  관점을 평가하므로 서비스 디자이너, 사용자 경험 디자이너, 사용성 전문가\n                                  등 전문가들이 평가한다. 전문가들은 자신의 지식과 경험, 노하우로 빠르게\n                                  서비스를 평가하여 문제점 및 개선 방향을 제시할 수 있다.\n\n                                  휴리스틱 평가에 대해서는 여러 전문가가 소개한 기준들이 있다. 예를 들어,\n                                  닐슨이 제안한 10가지 휴리스틱 기준 203 , 애비 코버트(Abby Covert)의 IA\n                                  휴리스틱204, 바이쉥크 앤 바커(Weinchenk and Barker)의 20 휴리스틱205등이\n                                  있다. 휴리스틱 평가의 방식마다 평가 기준, 개수 는 다소 차 이가 있지만\n                                  본질적으로 평가해야 하는 사용성 기준은 유사하다.\n\n\n\n\n                                                                      서비스·경험디자인 이론서 303\n\f                                   4. 휴리스틱 평가(Heuristic Evaluation)\n\n206                                휴리스틱 평가 방법은 사용성 전문가 롤프 몰리치(Rolf Molich)와 닐슨 206이\nNielsen, J., and Molich,\nR.(1990), <Heuristic evaluation\n                                   19 9 0 년 에 주 장 한 사 용 성 공 학 의 방 법 론 중 하 나 로 , 반 복 적 디 자 인\nof user interfaces>, Proc. ACM     프로세스(Iterative design process)를 거치는 HCI의 복잡한 시스템 개발에서\nCHI'90 Conf. (Seattle, WA, 1–5\nApril), pp. 249–256                사용성 문제를 조기에 발견해 내기 위한 방법이다. 주로 3명의 소수의 전문가가\n                                   10가지 사용성 휴리스틱 원칙을 적용해 인터페이스를 검사하고 사용성 준수\n                                   여부를 판단한다.\n\n\n                                   하지만, 이 방법은 너무 엄격하고 고객의 요구 를 충 족하지 못하 는 경우가\n                                   많으며, 제한된 체크리스트로 사용성 지침에 충족하는지를 확인하여 평가하는\n                                   것으로는 사용 맥락과 시스템의 목표 가치를 확인하기에는 충분하지 않다.\n                                   그래서 서비스가 의도한 고객의 요구 및 선호도를 확인하기 위해서 사용자들의\n                                   실제 사용 맥락 안에서 시행되기도 한다. 또한 최대한 전문가들을 중심으로\n                                   평가를 진행하기 때문에 휴리스틱에서 벗어나는 문제뿐만 아니라 사용성의\n                                   이슈를 발견하고 동시에 해결 방안 또한 제시해 줄 수 있다. 그리고 평가 결과를\n                                   바탕으로 우선순위를 제시해 주므로 기업 이해관계자들이 이해하고 결정하기\n                                   쉽게 한다.\n\n\n207                                제이콥 닐슨이 최종적으로 정리한 10개의 휴리스틱(1994) 207 기준은 다음과\nNielsen, Jakob(1994), 《Usability\nEngineering》, San Diego:           같다.\nAcademic Press. pp. 115–148.\nISBN 0-12-518406-9.                • 시스템 상태의 가시성\n                                   • 시스템과 현실 세계의 일치\n                                   • 사용자 제어 및 자유\n                                   • 일관성 및 표준\n                                   • 오류 방지\n                                   • 회상보다 인정\n                                   • 사용의 유연성과 효율성\n                                   • 미학적이고 미니멀한 디자인\n                                   • 사용자가 오류를 인식, 진단 및 복구할 수 있도록 지원\n                                   • 도움말 및 문서\n\n\n\n\n304 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f서비스·경험디자인 이론서 305\n\f                    5.2 서비스·경험디자인 모델개발\n                    서비스·경험디자인 모델이란 실행 가능한 수준의 서비스와 경험을 도식화하여\n                    프로젝트를 통해 얻은 전략들을 실제 개발에 적용하기 위한 콘셉트를 정의하고\n                    실현 가능한 디자인 방향을 수립하는 과정이다.\n\n\n                    5.2.1 서비스 요구사항 재정의 및 전략 도출\n\n                    서비스 경험 가치를 도출하기 위해서는 앞서 제시된 친화도 지도와 페르소나,\n                    고객 여정 맵 등 을 통해 경험의 패턴과 흐름 을 정의하고, 서비스 가치를\n                    제시하는 것이 필요하다. 아울러 제시된 내용을 중심으로 원칙을 수립하는\n                    단계, 비즈니스와 개발 환경에 부합하는 시스템을 구축하기 위해 필요한 요소를\n                    정의하고 검증하는 단계에서 서비스 가치의 비즈니스적 측면과 기술적 측면을\n                    모두 검토해야 한다.\n\n                    비즈니스 측면에서 서비스 가치 검토란 기업의 입장에서 현실적인 여건들과\n                    각각의 서비스 경험 가치가 적합한지 여부를 판단하는 것으로, 주로 기업의\n                    비즈니스 목표, 할당된 가용 자원, 가치 사슬(기업의 프로세스, 문화, 조직), 가치\n                    네트워크(현재 고객이나 공급처)와 부합하는지 검토한다.\n\n                    또한 현재의 기술이나 역량의 실현 가능성, 서비스 가치를 실현하는 데 드는\n                    비용, 현재의 기술 여건이나 플랫폼과의 호환성, 지속 가능성, 성숙도, 확장성\n                    등에 대한 기술적 측면에서의 타당성 검토가 필요하다.\n\n                    검토가 진행된 이후에는 서비스 가치 중 가장 우선시해야 할 하나의 가치에\n                    집중하고, 나머지 다른 가치들은 재배열하는 서비스 전략 단계를 진행한다.\n                    전략의 유형에는 창조 전략, 확대 전략, 틈새 전략, 재정의 전략이 있다.\n\n                    • 창조전략 : 신기술을 통해 기존에 없던 것을 창조하거나 새로운 시작을 알리는\n                      것으로 성공을 보장받긴 어렵지만 파급 효과는 크다.\n\n                    • 확대전략 : 기존의 서비스나 제품에 새로운 가치를 추가하여 사용자의 경험을\n                      확대시키는 전략이다.\n\n                    • 틈새전략 : 기존 서비스나 제품에서 틈새 가치를 발견해서 그 공간에 새로운\n                      시장을 만들어 내는 전략으로, 이미 존재하는 시장이 아닌 새로운 기회와\n                      잠재력을 발굴해야 하는 어려움은 있지만, 파급 효과는 다른 전략에 비해\n                      크다.\n\n                    • 재정전략 : 기존에 존재하는 서비스나 제품의 특성을 새로운 채널에 맞게\n                      변화시키는 전략이다.\n\n\n306 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                              5.2.2 서비스 경험 청사진(Blueprint)\n208                           서비스 블루프린트는 서비스 청사진이라고도 불린다. 청사진(靑寫眞)이란 건축\n19세기 영국의 J.F.W허설이 발견.\n복잡한 설계도면의 사본을 만들기             또는 공학에서 문서화한 기술 도면을 인화로 복사하거나 복사한 도면을 말한다.\n위해 반투명한 용지에 도면을 그리\n고 수산화철 시트르산 수용액으로\n                              19세기에 발견된 청사진 기법 208 은 당시 복사기와 같은 장비가 없어 복잡한\n처리된 인화지에 겹쳐 놓은 뒤 일정\n                              설계도면의 사본을 만들기 어려웠을 때 제시된 대안으로, 화학 반응을 활용하여\n시간 빛에 노출시켜 적혈염 수용액\n으로 씻으면 인화지에 원래 그렸던            복잡한 설계도면을 복사하는 기법이다. 이로 인해 “청사진”이라는 용어는 어떤\n도면이 복사되는 방식\n                              자세한 계획을 은유적으로 일컫을 때 쓰인다. 청사진 안에는 제품의 제조에\n209\n                              필요한 모든 규격이 제시되어 있는데, 린 쇼스탁(G.Lynn Shostack)은 서비스\nShostack, G. Lynn(1984),\n<Designing Services that      전달 시스템이 이와 유사하게 가시적으로 표현될 수 있다고 보고, 1982년\nDeliver>, Harvard Business\nReview, vol. 62, no. 1, pp.   하버드 비즈니스 리뷰 209 에서 이를 서비스 청사진으 로 개념화하여 최초 로\n133–139\n                              제안하였다. 서비스 청사진은 서비스디자인 분야에서 유용하게 활용될 뿐\n                              아니라 기업 내에서 업무의 효율성을 측정하기 위해 운영관리 차원에서도 자주\n                              사용되고 있다.\n\n\n\n                              1. 정의\n\n                              쇼스탁은 서비스 청사진을 ‘서비스 사이클에서 고객의 경험을 여러 서비스\n                              제공자가 제공한 개별적 조치들과 연관시켜 작성한 흐름도’라고 제시하였다.\n                              이는 서비스 전달 과정에서 직원, 고객, 기업 측의 각자의 역할과 프로세스\n                              단계와 흐름 등 서비스 전반을 이해하도록 묘사해 놓은 것으로, 서비스를 위한\n                              청사진법이라고 이해하면 된다. 서비스 청사진은 핵심 서비스 프 로세스의\n                              특성을 한눈에 알아보기 쉬운 방식으로 가시화시켜 서비스 전달 체계, 시스템,\n                              구조 등 전체를 혁신하기 위해 사용되는 방법이다.\n\n\n                              2. 서비스 청사진의 주요 구조\n\n210                           서비스 청사진은 서비스 요소들(사람, 물리적 또는 디지털 증거물, 프로세스들\nShostack, G. Lynn(1984),\n<Designing Services that      등) 사 이의 관계 들 을 사 용자의 서비스 여정 내에 서의 접 점 을 중 심 으 로\nDeliver>, Harvard Business\n                              다이어그램으로 가시화시킨 것으로 고객 여정 지도의 연장선상으로 보기도\nReview, vol. 62, no. 1, pp.\n133–139                       한다. 210 서비스 청사진은 고객 여정 지도에서 고객과 서비스 제공자 사이에\n                              이루어지는 모든 상호작용을 열거할 뿐만 아니라, 고객과의 상호작용을 위한\n                              다양한 지원 체계도 표기함으로써 모든 형태의 상호작용을 살펴볼 수 있게 한다.\n\n\n\n\n                                                              서비스·경험디자인 이론서 307\n\f                    이렇듯 서비스 청사진은 가시화 영역(Frontstage)과 비가시화 영역(Backstage)\n                    으로 나뉜다. 가시화 영역에는 서비스가 제공되기 위해 필요한 고객과 직접\n                    상호작용하는 서비스 제공자의 행동, 사람, 물리적 증거 등의 접점들이 고객\n                    여정 지도와 같이 표시되고, 비가시화 영역에는 고객과 직접 상호작용하진\n                    않지만 고객에게 전달되는 서비스 접점들을 위한 제공자의 활동과 사람 그리고\n                    물리적 증거들이 표현된다.\n\n\n\n\n[ 가전제품 소매업체의 청사진 예시 ]\n\n\n\n                    3. 구성 요소\n\n                    물리적 증거물(Physical Evidences)\n                    물리적 증거물은 물리적 객체로 고객과 서비스 사이에서 디자인될 수 있는 모든\n                    접점이다. 물리적인 형태뿐 아니라 비물리적인 채널(이메일, 문자, 전화 응대)도\n                    이 부분에 해당된다.\n\n                    고객 행동(Customer Actions)\n                    고객이 고객 여정 내에서 특정 목표에 도달하기 위해 행하는 서비스와의 상호작용,\n                    선택, 활동 등의 집합이다. 고객 여정 내에서 고객이 전방이나 후방 영역에서 일련의\n                    행위를 시도했을 때 서비스의 전방 영역과 후방 영역이 서로 연결되기도 한다.\n\n\n\n\n308 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f전방 영역 활동(Frontstage Actions)\n고객에게 노출되어 있는 영역, 다시 말 해 고객과 직접 만 나 는 영역에 서\n이루어지는 서비스 제공자들의 행동 집합을 말한다. 서비스 제공자와 고객과의\n상호작용 특성에 따라 다른 영역으로 나뉘어 표현되기도 한다.\n\n\n상호작용선(Lines of Interactions)\n상호작용 선은 고객 행동과 전방 영역 활동으 로 나뉘어 있다. 고객이 전방\n영역에서 직원과 상호작용하였을 경우, 상호작용선을 가로질러 고객 행동과 전방\n영역 활동이 서로 연결된다.\n\n\n가시선(Line of Visibility)\n가시선은 서비스가 고객에게 보이는 전방 영역과 보이지 않는 후방 영역을\n구분하는 가상의 선을 일컫는다.\n\n\n후방 영역 활동(Backstage Actions)\n고객과 직접 만나지 않는 서비스 제공자의 행동 집합으로 후방 영역 안에서의\n행동들은 가시선 뒤쪽에 표기된다. 이 영역 안에서의 각각의 서비스 제공자의\n역할에 따라 영역이 구분된다.\n\n\n내부 상호작용선(Line of Internal Interactions)\n내부 상호작용 선은 직접적으 로 고객에게 서비스 를 제 공하거나 제 공되는\n서비스를 지원하는 부서의 경계 밖에 있는 조직 또는 부서들을 표기한 선이다.\n\n\n지원 프로세스(Support Process)\n지원 프로세스는 기타 조직과 외부 파트너들의 활동들에 대한 프로세스로\n전방 또는 후방 에서 고객에게 행동 을 만들어 내거나 고객의 행동에 의해\n만들어지기도 한다. 지원 프로세스상에서의 구분선은 서로 다른 외부 조직 또는\n파트너들의 지원 프로세스로 구분되기도 한다.\n\n\n고객 관점/라인/레인(Customer Perspective/Lines/Lanes)\n전방 또는 후방 영역 안에서의 디지털 미디어 활동, 기술 시스템에 대한 목록,\n적용 가능한 규칙 및 규성, 외부 파트너와 조직과의 강한 상호작용을 강조하는\n외부 상호작용선들이 추가되기도 한다.\n\n\n\n\n                                          서비스·경험디자인 이론서 309\n\f                      4. 청사진 만들기\n\n211                   수행 시 필요 사항\n서비스 프로세스 전 과정을 세부 프\n로세스 단위로 분석 후, 분해된 각\n                      고객 여정 지도, 서비스 시나리오, 분해된 전체 서비스 프로세스 211\n서비스 프로세스를 서비스 청사진\n작성을 위한 기본 단위로 활용함     ① 고객의 행동, 전방영역과 후방영역에서의 서비스 제공자의 행위, 지원 활동\n                        등을 포함한 활동, 활동 순서, 활동 간의 연결 등을 정의한다.\n                      ② 가시선을 청 사 진에 추 가 하 여 고객 을 대면하 는 전방 영역과 서비스 를\n                        제공하기 위한 후방영역으로 나눈다.\n                      ③ 분해된 서비스 프로세스 각각의 서비스 단계에 대한 표준 및 시나리오, 운영\n                        절차, 지원 서비스를 정의하고 청사진에 추가한다. 필요한 경우 물리적/IT\n                        상호작용 선 등을 추가한다.\n                      ④ 각 프 로 세스의 흐름 을 화 살표를 통해 연결하 여 전체 프 로 세스 를\n                        도식화한다.\n                      ⑤ 기간 또는 각 단계에 대한 평균 소요 시간, 최소 고객 기대치 안에서의 허용\n                        시간을 표시하고 그에 따른 담당자를 표시한다.\n                      ⑥ 실패지점 또는 과도한 대기 지점, 복잡성이 증가되는 지점을 식별하여 이를\n                        해결하기 위한 프로세스를 도입하거나 조정을 시도한다.\n\n\n\n\n310 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f서비스 청사진에서 사용되는 보조 요소들\n\n① 화 살표(Arrows) : 청사진의 핵심 요소로 서로 간의 관계 및 의존성을\n  나타냄. 단일 화살표는 선형, 단방향 교환을 나타내는 반면 이중 화살표는\n  동의 및 상호 의존성이 필요함을 나타냄\n② 시간(Time) : 시간이 서비스의 주요 변수일 경우, 고객의 작업 예상 시간이\n  청사진이 표시되어야 함\n③ 규 정 또는 정책(Regulations or Policy) : 프 로 세스의 완료 방법을\n  지시하는 정책 또는 규정\n④ 감정(Emotions) : 고객 여정 지도과 유사하게 직원의 감정도 청사진에\n  표현이 가능함\n\n\n\n5. 활용 목적 및 목표\n\n서비스 청사진은 기업이 서비스를 전달하기 위한 기본 자원과 프로세스에 대한\n포괄적인 이해를 제공한다. 서비스 청사진은 주로 세 가지 주요한 목표에 의해\n응용되어 사용되고 있다.\n\n\n매뉴얼로서의 기능 : 서비스 프로세스와 프로세스 단계 간의 관계를 시각적으로\n보여 주는 것으로, 직원 교육 프로그램이나 매뉴얼 등에서 사용된다. 이는\n직원들과 이해관계자들의 역할에 대한 이해와 각각 고립된 부서들 간의 관계\n등의 이해할 수 있는 매뉴얼을 제공한다.\n\n서비스 운영상의 문제 진단 도구로서의 기능 : 서비스 청사진은 운영 체계\n안에서 서비스의 문제점 또는 약점을 진단할 수 있는 도구로 활용할 수 있다.\n각 서비스 접점에서 제공되는 물리적 증거나 활동의 적절성 등을 분석할 수\n있으므로, 약점이나 결함을 발견하고 그 원인을 파악하여 운영 표준안 등을\n제안할 수 있다.\n\n구조 변경 및 신규 서비스 개발로서의 기능 : 쇼스탁은 서비스 청사진을 계획의\n도구로 사용하고자 했다. 이를 감안하면, 전체 서비스 프로세스의 도식화는\n서비스 시나리오에 따른 새로운 서비스를 재구성하게 할 뿐만 아니라 출시 전에\n고객에게 테스트해 볼 수 있는 기회를 제공한다.\n\n\n\n\n                                  서비스·경험디자인 이론서 311\n\f                                  5.2.3 비즈니스 모델 캔버스\n212                               비즈니스 모델 캔버스는 새로운 비즈니스 모델 개발을 위한 ‘전략적 관리\nOsterwalder, A.(2004), 《The\nbusiness model ontology a         템플릿(Strategic Management Template)’이다. 제품이나 서비스의 가치\nproposition in a design science\napproach》\n                                  제안, 인프라, 고객, 재정 등을 시각적 차트 위에 제공하여, 기업의 활동을\n                                  조정할 수 있는 잠재적인 절충안들 을 제안한다. 비즈니스 모델 캔버스의\n213\nOsterwalder, A., & Pigneur,       기본적인 개념은 2005년 알렉산더 오스터왈더(Alexander Ostersalder)의\nY.(2010), 《Business model\ngeneration: a handbook for        박 사 논 문 2 12 에 서 제 안 되 었다. 오 스 터 왈 더 는 다 양 한 비 즈 니 스 모델 을\nvisionaries, game changers,\n                                  개념화하고 그로부터 발견되는 유사성을 기반으로 한 단일 모델을 제안하였다.\nand challengers》 (Vol. 1), John\nWiley & Sons.                     2010년 출간한 책 213에서는 빌딩 블록 형태의 현재의 비즈니스 모델 캔버스를\n                                  제안하였고, 이는 지금까지 활발히 사용되고 있다.\n\n\n\n                                  1. 구성 요소\n\n\n\n\n                                  가치 제안(Value Propositions)\n                                  회사가 특정한 고객 세그먼트에게 제공하 는 가치 중 심의 서비스의 조합을\n                                  의미한다. 기업이 제공하 는 가치가 해당 고객 세그먼트의 니즈에 부합하 는\n                                  형태로 만들어진 것으로 가격, 속도와 같은 양적인 가치뿐만 아니라 디자인,\n                                  고객 경험과 같은 질적인 가치가 될 수도 있다.\n\n\n\n\n312 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f고객 세그먼트(Customer Segments)\n기업이 효과적인 비즈니스 모델을 구축하기 위해서 다양한 요구와 속성에 따라\n고객을 분류하여 기업의 새로운 비즈니스 전략을 효과적으로 전달하고자 형성한 고객\n집합이다.\n\n채널(Channels)\n기업은 목표 고객에게 다 양 한 채널을 통해 핵 심 가치 제안을 전달 할 수\n있다. 속도와 비용 및 방법적 측면에서 효율적으로 가치를 전달하는 채널이\n효과적이다. 채널은 기업과 고객 사이에 존재하는 모든 접점과 인터페이스로\n고객 경험에 크게 영향을 미치는 접촉 수단이며 이해도, 평가, 구매, 전달, 판매\n등 5개의 핵심 요소로 구성된다.\n\n고객 관계(Customer Relationships)\n기업이 특정한 고객 세그먼트와 어떤 형태의 관계를 맺을 것인가를 의미하는\n용어이다. 해당 비즈니스가 새로운 고객을 확보하는 방법, 고객이 서비스를 계속\n구매하거나 구독하는 방법, 현재 고객으로부터 수익을 더 늘릴 수 있는 방법에\n대한 세 가지 단계를 다루어야 한다. 고객을 지원하는 방법은 다음과 같다.\n\n개인 지원 : 직원-고객 상호작용 형태의 지원으로 이러한 지원은 서비스 사용 중\n또는 사용 후에 진행됨\n\n• 전담 개인 지원 : 특 정 고객의 모든 요구와 질문을 처리하기 위해 영업\n 담당자가 배정되어 가장 친밀하게 지원하는 형태\n• 셀프서비스 : 회사와 고객간의 간접적 상호작용하는 관계유형으로 고객이\n 쉽고 효과적으로 서비스를 제공하는 필요한 도구를 제공함\n• 자동화된 서비스 : 셀프서비스와 유사하지만 개별 고객과 선호도를 식별할 수\n 있는 기능이 있어 보다 개인화된 시스템\n• 커 뮤니티 : 커 뮤 니티 를 형 성하 면 다 양 한 고객 과 기업 간 의 직 접 적인\n 상호작용이 가능하기 때문에 커뮤니티 플랫폼은 고객 간의 지식을 공유하고\n 문제를 해결할 수 있는 상황을 제공함\n• 공동창작 : 기업의 제품/서비스의 결과물에 대한 고객의 직접적인 견해를\n 매개로 형성되는 개인적인 관계 \t\t\t\t\n\n\n주요 활동(Key Activities)\n기업의 가치를 효과적으로 드러내는 비즈니스를 원활하게 진행하기 위해 필요한\n활동이다. 기업이 비즈니스를 제대로 영위해 나가기 위해 꼭 해야 하는 중요한\n일들을 의미하는 것으로, 여러 유형의 핵심 활동을 수행해야 기업을 성공적으로\n운영할 수 있다. 가치 제안을 창조하고 제공하 는 것은 시장 에 효과적으 로\n접근하고 고객 세그먼트와의 관계를 유지하며 수익원을 만들기 위해 필요하다.\n\n                                 서비스·경험디자인 이론서 313\n\f                    핵심 자원(Key Resources)\n                    비즈니스를 원활하게 하는데 가장 필요한 주요 자산을 의미한다. 앞의 5가지\n                    실현하기 위한 자산으로서의 핵심자원으로 주요 활동과 마찬가지로 기업은\n                    가치를 제안할 수 있으며, 시장에 접근하고 고객 세그먼트와의 관계를 유지하여\n                    수익원을 창출한다.\n\n                    주요 파트너(Key Partners)\n                    비즈니스의 운영을 최적화하고 비즈니스 모델의 위험을 줄이기 위해 핵심\n                    활동에 집중할 수 있도록 구매자-공급자 관계를 구축한다. 상호 보완적인\n                    비즈니스 제휴는 합작 투자 또는 경쟁업체 또는 비경쟁업체 간의 전략적 제휴가\n                    이루어지게 된다.\n\n                    비용구조(Cost Structure)\n                    다 양 한 비 즈 니 스 모 델 이 운 영 되 는 동 안 일 어 나 는 금 전 적 결 과 이 다.\n                    비용구조는 크게 비용 중심과 가치 중심으로 나뉜다. 비용 중심은 모든 비용을\n                    최소화하는데 중점(예 : 저가항공)을 두고 가치 중심은 비용에 덜 신경을 쓰는\n                    대신 제품 및 서비스에 대한 가치 창출(예 : 럭셔리 패션 브랜드)에 중점을 둔다.\n                    • 고정 비용 : 급여, 임대료 등 특별한 상황에 의해 변동되지 않는 비용\n                    • 변동 비용 : 상품이나 서비스의 생산량에 따라 달라짐\n                    • 규모의 경제 : 주문 또는 생산되는 상품의 양이 늘어남에 따라 비용이 감소함\n                    • 범위의 경제 : 원래 제품과 직접적인 관련이 있는 다른 비즈니스를 통합하여\n                                비용 절감\n\n\n                    수익원(Revenue Streams)\n                    기업이 각 고객 세그먼트에서 수익을 창출하는 방식으로, 각 수익원을 창출하는\n                    방법은 아래와 같다.\n                    • 자산 판매 : 물리적 상품에 대한 소유권 판매(예 : 소매기업)\n                    • 사용료 : 특정 서비스(예: UPS 등)을 사용하여 발생하는 돈\n                    • 구독료 : 직접적인 서비스(예: Netflix)에 대한 접근을 판매하여 발생하는 이익\n                    • 리스/렌탈 : 특정한 기간 동안 자산에 대한 독점권을 부여하는 비용(예 :\n                      자동차 리스)\n                    • 라이선스 : 보호된 지적 재산 사용에 대한 비용 청구에서 발생하는 수익\n                    • 중계 수수료 : 두 당사자 간의 중간 서비스에 발생하는 수익(예 : 부동산 중계\n                      수수료)\n\n\n\n\n314 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f2. 수행방법\n\n비즈니스 모델 캔버스는 상당히 유연한 도구이므로 유일한 사용 방법이 있는\n것은 아니다. 하지만, 아래와 같은 간단한 단계들을 준비하면 도움이 된다.\n\n1) 다음과 같은 질문들을 명확하게 정의한다 : 서비스의 범위가 무엇인가?\n  프로토타이핑 활동을 통해 얻고자 하는 게 무엇인가? 전체 경험 여정을 보는\n  건가 아니면 일부를 보는 건가? 어느 부분이 제일 관심 있게 보아야 하는\n  영역인가?\n\n2) 초청 대상 : 이 비즈니스 모델 캔버스 워크숍에 누구를(비즈니스의 배경을\n  제대로 아는 사람, 비즈니스에 대한 선입관이 없는 사람, 전문가, 비즈니스\n  이행 팀의 리더, 서비스 제공 팀, 사용자 등) 부를지 충분히 고려한다.\n\n3) 비즈니스 모델 캔버스 템플릿 준비 : 페르소나, 이해관계자 지도, 사용자\n  고객 여정 지도, 프로토타입 등을 같이 준비해 놓는다.\n\n\n단계별 가이드\n1) 7개의 블록을 채운다 : 다른 서비스디자인 도구를 사용하여 상위의 블록인\n  가치 제안, 고객블록(고객 세그먼트, 채널, 고객 관계)과 기반 구조(핵심\n  프로세스, 핵심 자원, 핵심 파트너)를 채운다.\n\n\n\n\n                               서비스·경험디자인 이론서 315\n\f                    2) 아래 2개의 블럭을 채운다 : 기반 구조를 통해 핵심 비용 구조를 채우고\n                       고객 블록을 통해 비용 흐름을 채운다. 비용 구조와 비용 흐름 구조를\n                       가지게 되면, 대략의 금액과 수익에 대한 구체적인 숫자를 넣는다.\n\n\n                    3) 대안을 만들고 반복하고 수정한다 : 빈 블록이나 갭을 메꾸기 위해 비워진\n                       정보들 을 찾 아본다. 비즈니스 모델이 지속 가 능한지를 테스 트해 보 고\n                       기반 구 조나 수익 흐름 들 에 대한 다른 잠재 적인 옵 션들 을 중 심으 로\n                       다른 비즈니스 모델에 대한 대안들을 만들어 본다. 서로 다른 모델들과\n                       반복적으로 비교 혹은 결합해 보고 다듬어 본다.\n\n\n\n                    3. 활용 목적 및 목표\n\n                    조직의 구조, 프로세스, 소프트웨어, 제품, 서비스, 이해관계자와의 관계 또는\n                    고객 그룹 안에서의 변화는 비즈니스 모델의 일부 부분에 영향을 끼치지만,\n                    비즈니스 모델의 변화 는 고객과 직원의 경험 전반에 영향을 끼치기 때문에\n                    비즈니스 모델링은 서비스디자인에서 진행되어야 하는 주요한 활동 중 하나이다.\n                    서비스디자인 프로세스를 통해 고객 중심의 차별화되고 지속 가능한 서비스와\n                    경험을 제공하기 위해서는 비즈니스 모델 즉, 서비스 운영 모델을 살펴봐야 한다.\n\n                    하지만 비즈니스 전략을 위해 비즈니스 계획을 구체적이고 완벽하게 작성하는\n                    것은 서비스디자인의 신속하고 반복적인 속성과는 맞지 않다. 그렇기 때문에\n                    서비스디자인에서는 비즈니스 모델을 작성할 때 다양한 옵션을 테스트하고\n                    반복적으로 작업을 이어나갈 수 있도록 빠르게 시각화하는 방법이 유용하므로,\n                    비즈니스 모델 작성 방 법 중 ‘비즈니스 모델 캔버스(Business Model\n                    Canvas)’를 차용한다.\n\n                    비즈니스 모델 캔버스는 프로토타이핑이나 다양한 시나리오를 테스트하여\n                    고객과 조직원들의 경험과 사업 측면에서의 영향력을 예측해 볼 수 있게 한다는\n                    점에서 기존 비즈니스 영역에서의 사업 계획 대체제가 아닌 보완의 역할을\n                    담당한다. 즉, 비즈니스 모델을 반복적으로 작성하고 고도화시켜 줌으로써\n                    세부적이면서도 광범위한 사업 계획을 세울 수 있게 한다.\n\n\n\n\n316 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f5.2.4 서비스 제공자 행동양식\n\n서비스의 맥락적 상황에 대한 이해나 예측 불가능한 돌발 상황을 표현하기에\n시각화된 이미지 자료나 문서만으로는 어려움이 있다. 서비스 시각화는 개발된\n서비스를 평가 또는 실행하기 위한 가이드 제공을 목적으로 하기 때문에 서비스\n전반에 대해 이해하기 쉬워야 하고 최대한 실제 상황과 흡사하게 재연하는 것이\n중요하다. 따라서 서비스디자인의 최종 결과 물인 서비스 접점 실행 방법을\n고객에게 효율적으로 제공하기 위해 명확한 가이드라인과 매뉴얼을 다음과 같이\n제공한다.\n\n서비스 설명서\n서비스디자인 프 로젝트의 범위와 구체적인 서비스에 대해 작성된 문서로,\n개발된 아이디어들의 발전 단계를 설명하고 있다. 팀 구성원들과 실행하 는\n부서에서 이 문서를 통해 서비스디자인의 기본 원칙들을 이해하도록 도와준다.\n\n서비스 목업\n제안된 서비스를 시각적으로 묘사하는 모형으로, 초기 포토 몽타주에서 상황\n사진들이 포함된 제품이나 서비스들이 더해지면서 최종적인 프로토타입까지\n계속 발전되는 형태로 만들어진다.\n\n무드 보드 & 필름\n무드 보드는 서비스가 지닌 가치들을 언어적으로 표현하기 힘들 때 시각적으로\n구성해 놓은 것이다. 무드 필름은 무드 보드의 업그레이드된 단계로, 오디오\n요소와 영상 기법을 도입함으로써 서비스 분위기나 서비스 경험에 구체적인\n상상력을 구축할 수 있도록 도와준다. 이는 서비스디자인 콘셉트를 발표할 때\n매우 유용하게 사용될 수 있다.\n\n서비스 증거/접점 디자인\n서비스 증거는 서비스와 고객이 어떻게 상호작용해야 하는지에 대해 이해하도록\n돕는 방법으로 카드, 웹 사이트, 스크린 숏, 제품 모형, 주변 환경 및 시설에 대한\n이미지 등을 보여 줌으로써 프로젝트 관계자들과 효과적인 서비스 방향에 대한\n논의가 가능하다.\n\n서비스 스토리보드\n서비스 스토리보드는 제안되는 서비스에 대한 이해도를 높이고 서비스가 지닌\n많은 양의 정보를 효과적으로 전달하는 방법으로 각 서비스 접점의 징후와 그들\n간의 관계를 보여 줌으로써 프로세스나 시스템을 보여줄 때 시각적으로 중요한\n요소나 단계들을 가시화한다.\n\n\n\n\n                               서비스·경험디자인 이론서 317\n\f                    서비스 시나리오\n                    시나리오는 가상으로 만들어진 스토리로, 서비스 제공의 특성들을 분석하기\n                    위한 방법이다. 디지털 환경에서 재현되는 서비스일 경우에는 와이어프레임\n                    등을 포함하여 화면 흐름을 정의한다. 서비스 시나리오는 서비스의 전체적인\n                    스토리를 한눈에 볼 수 있기 때문에 서비스 청사진의 역할을 하며 서비스에 대한\n                    최종 설계 가이드라인으로 평가와 검토, 이해관계자들 간의 소통의 수단으로\n                    활용된다. 서비스 시나리오에는 서비스 스토리보드, UI 명세서, 개발 명세서,\n                    와이어프레임, 서비스 고객 여정 지도, 콘텐츠 인벤토리 등이 포함된다.\n\n                    서비스 터치포인트 매트릭스\n                    서비스 터치포인트 매트릭스는 페르소나 기법에 고객 여정 지도의 특징들을\n                    융합시킨 방법으로, 고객이 특정 제품과 서비스, 시스템간의 상호작용에 의한\n                    각각의 서비스 접점들을 고객의 경험 여정 순으로 연결하는 시각적 프레임워크다.\n\n\n                    서비스 로드맵\n                    서비스 로드맵은 계획에 대한 프로세스의 결과물이며 서비스 솔루션의 개발,\n                    제공 및 진화의 점진적 프로세스에 대한 상위 수준 타임라인을 시각적으로\n                    설명한다. 서비스 로 드맵의 목표는 첫 번째 릴리스를 준비하 는 데 필요한\n                    최소한의 기능 세트를 식별하는 것이다. 그리고 비즈니스 성과를 달성하기 위해\n                    만들 수 있는 개선 사항들과 특정 서비스 구성 요소를 개발 및 구축하는 데\n                    필요한 노력과 파일럿 및 베타 단계에 필요한 시간 등을 제시해 준다.\n\n\n\n\n318 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f서비스 로드맵은 일반적으로 시장, 제품, 서비스 및 기술적 관점들을 통해 현재\n서비스의 위치와 방향성, 그리고 가 능성에 대한 질문에 답을 준다. 서비스\n로드맵은 프로젝트 완료 단계에서 생성된 정보, 통찰력 및 결과 등에 대해\n커뮤니케이션할 때 유용한 도구이다.\n\n\n5.2.5 서비스 구현\n서비스디자인에서의 구현은 조직의 절차와 프로세스의 관리를 변화시킬 수 있을\n뿐 아니라 제품 개발 과정 안에서의 소프트웨어 개발 또는 하드웨어 구조, 건축\n등의 환경과 건물의 설계 변경을 위한 관리 구조 등을 변경시킬 수 있다. 서로\n맥락이 다르지만, 그럼에도 불구하고 구현 단계에서의 공통점은 몇 가지가 있다.\n프로토타이핑과 파일럿 그리고 구현은 서로 간에 유기적으로 연결되어 있다.\n아래의 패턴은 일상적 차원에서 비즈니스 차원으로 다양하게 구현의 스케일이\n변화되어 가는 것을 보여 준다.\n\n\n\n\n• 개발 시스템으로의 변경 : 새로운 서비스나 제품을 실제 맥락과 환경, 시스템\n 안에서 돌아가게 한다.\n• 실제 직원들과 활동 : 서비스디자인 프로젝트 과정에서 활동하지 않았던\n 직원들도 새로운 프로세스와 서비스를 수행하기 위해 적극적으로 참여해야 한다.\n• 비즈니스 목표에 집중 : 서비스나 제품의 혁신에 집중하기보다는 직접적인\n 비즈니스의 이윤 창출을 위해 고객에게 제시되어야 한다.\n• 기존 생태계에 접목 : 서비스 또는 제품은 기존의 IT 시스템, 환경, 법적\n 프레임워크, 기술적 파트너 네트워크와 생태계에 자연스럽게 포함되어야 한다.\n• 기존 KPI 프레임워크에 통합 : 새로운 비즈니스 측정 항목들은 기존 KPI\n 프레임워크에 통합되어야 한다.\n• “Business As Usual” : 고객은 더 이상 베타 서비스라고 인지하면 안 되며,\n 직원들도 이를 파일럿이라고 인지하면 안 된다.\n• 반복/변화/적응 단계 : 변화를 이행하는 단계에서 모든 구성원들은 변화를\n 두려워하기 때문에 이 과정은 어렵고 비용이 든다.\n\n\n\n                                   서비스·경험디자인 이론서 319\n\f         린 캔버스 LEAN CANVAS\n\n\n\n더 알아보기\n         214                           린 캔버스는 에쉬 모리아(Ash Maurya)가 비즈니스 모델 캔버스를 활용하여\n         Why Lean Canvas vs Business\n         Model Canvas?, ASH MAURYA,    만든 한 장의 비즈니스 계획 템플릿으로, 시장을 빠르게 검증하고 아이디어를\n         2021.10월 기준\n         (https://blog.leanstack.\n                                       시뮬레이션하는 것을 목적으로 한다. 더 정확하게는 가장 불확실한 부분이나\n         com/why-lean-canvas-vs-\n                                       가 장 위험한 요 소들 을 찾 아내고 확 인하 는 데에 활용되며 214 , 린 캔버스는\n         business-model-canvas/)\n                                       변화하는 창업 기업이 아이디어를 빠르고, 정확하고, 구체적으로 실행할 수\n                                       있도록 도움을 준다.\n\n                                       그리고 고객들이 느끼는 문제점들과 가설을 반복·검증하면서 제안된 해결안들이\n                                       시장에서 비즈니스 관점으로 충분한 설득력이 있는지를 확인하는 방법으로,\n                                       비즈니스 모델을 수립하기 전 틈새(niche) 시장을 찾아내는 데에 유용한 도구로\n                                       활용되기도 한다.\n\n                                       린 캔버스의 구조는 비즈니스 모델 캔버스와 비슷하나, 단순히 작성하는 데에\n                                       집중하기보다는 아이디어나 가설에 대한 문제들을 분석하여, 어떻게 검증할\n                                       것인지 계획을 세우고, 검증을 위한 수행 계획 및 수정을 반복하면서 아이디어의\n                                       완성도를 높이는 데 사용된다.\n\n\n\n\n         320 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                               비즈니스 모델 캔버스                             린 캔버스\n\n\n                 • 신규 및 기존 서비스의 개선에 활용                 • 스타트업, 신규 사업에 활용\n                 • 어떻게 가치를 창출하고 어떻게 고객에게               • \u0007고객 니즈를 파악하고 가설을 세워, 시장을\n      목적\n                  전달하는가에 대한 것으로 제품이나 서비스의               검증하는 반복작업으로 빠르게 사업 과정을\n                  핵심을 파악하기 용이함                          시뮬레이션하기 용이함\n\n\n                                                       • Customer-Problem-Solution(고객-문제-\n                 • 전략중심의 사업계획에 중점을 둠                    해결) 관계에 중점을 둠\n  중점 요소          • 전체 비즈니스의 고객 세그먼트, 채널 및 고객           • 스타트업은 아직 제품 & 서비스가 알려지거나\n                  관계에 중점을 둠                             테스트되지 않았기 때문에 고객이 누군지 알 수\n                                                        없으므로 고객 세그먼트에 크게 중점을 두지 않음\n\n\n                 • 핵심 자원과 핵심 활동을 중심으로 예상되는             • 문제, 제안된 솔루션, 솔루션을 달성하기 위한\n                  비즈니스 수익 흐름을 시각화                       채널, 관련 비용 및 예상되는 수익원을 설계\n      접근법\n                 • 현재 상태를 유지하기 위해 양적 및 질적              • 제안된 고유한 가치가 경쟁우위에 있는지에 대한\n                  측면에서 가치 제안에 중점을 둠                     평가와 더 나은 기반마련을 위해 활용\n\n\n\n                 • 사업에 대한 이해, 창의성을 촉진, 토론 및            • 간단한 문제 해결 지향적인 접근 방식으로\n      응용 및        건설적인 분석을 도와줌                          창업가가 단계별로 개발할 수 있도록 함\n       활용        • 이해관계자들과의 브레인스토밍 워크숍이나               • 소규모 팀이나 1인 디자이너가 쉽고 빠른 검증이\n                  상품기획 단계에서 유용하게 사용됨                    필요할 때 유용함\n\n\n[ 비즈니스모델 캔버스(Business Model Canvas)와 린 캔버스(Lean Canvas)의 비교 215 ]\n\n\n\n\n215\nBUSINESS MODEL CANVAS\nVS. LEAN CANVAS, canvanizer\n2019, 2021.10월 기준\n(https://canvanizer.com/how-\nto-use/business-model-\ncanvas-vs-lean-canvas)\n\n\n\n\n                                                                          서비스·경험디자인 이론서 321\n\f                              에쉬 모리아(Ash Maurya)는 린 캔버스에서 고객 세그먼트와 미래가 아닌\n                              현재 고객이 처한 문제가 가 장 중요하고, 이 두 가지가 나머지 캔버스의\n                              블록을 좌우한다고 생각했다. 그래서 사용자 친화적인 툴로서 비즈니스 모델\n                              캔버스의 9개 블록 중에서 4개의 블록을 초기 스타트업에 더 필요한 내용으로\n                              변경하였다.\n\n\n\n\n[ 변경 전 린 캔버스 216 ]\n\n\n\n\n216\nAsh Maurya(2014),\nEQengineered, (https://www.\neqengineered.com/insights/\nwhy-use-lean-vs-business-\nmodel-canvas)\n\n\n\n\n322 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f217                              핵심 파트너 → 문제(Problem)\nWhy Lean Canvas vs Business\nModel Canvas?, ASH MAURYA,       신생 기업의 경우, 테스트하지 않은 제품이나 서비스에 대해 처음에는 핵심\n2021.10월 기준\n(https://blog.leanstack.\n                                 파트너가 중요하지 않을 수 있고, 비용 구조나 유통 채널이 해결되지 않은\ncom/why-lean-canvas-vs-\n                                 상태이므로 오히려 현재 처한 문제에 집중하는 것이 더 중요할 수 있다. 목표\nbusiness-model-canvas/)\n                                 고객군이 미처 해결하지 못한 문제에 대해 생각하고 나열해 보면서 핵심 문제를\n218\nLEAN CANVAS IS A 1-PAGE          파악하여 실제 고객이 필요로 하는 제품 및 서비스에 집중할 수 있다.\nBUSINESS PLAN, LEANSTACK\n2021, 2021.10월 기준\n                                 핵심 활동 → 해결안(Solution)\n(https://leanstack.com/is-one-\npage-business-model)one-         고객문제가 명확히 정의되고 검증된 후에 해결안이 제시되어야 한다. 그리고\npage-business-model)1\n                                 문제해결을 위한 MVP가 초기 테스트/검증을 거친 후에 핵심 활동이 이루어질\n                                 수 있으므로, 핵심 활동보다는 먼저 해결안에 집중하는 것이 바람직하다.\n\n\n                                 핵심 자원 → 핵심 지표(Key Metrices)\n                                 인터넷 발달, 오픈 소스나 클라우드 컴퓨팅 등의 세계화의 도래로 제품이나\n                                 서비스를 출시할 때 예전만큼 리소스를 필요로 하지 않는다. 오히려 검증 결과를\n                                 확인하고 주요 성장 엔진이 될 수 있는 지표가 더 도움이 된다.\n\n\n                                 고객 관계 → 경쟁 우위(Unfair Advantage)\n                                 직접 고객을 만나 인터뷰하고, 이를 통한 해결안과 고객 세그먼트에 따라 채널로\n                                 고객과 소통하는 것이 바람직하며, 고객의 관심을 사로잡기 위한 경쟁 우위에\n                                 초점을 맞추는 것이 효율적이다.217\n\n\n\n\n[ 린 캔버스 218 ]\n\n\n                                                                   서비스·경험디자인 이론서 323\n\f         가치 제안 캔버스 (밸류 프로포지션 캔버스/ Value Proposition Canvas)219\n\n\n\n더 알아보기\n         219                     가치 제안 캔버스(밸류 프로포지션 캔버스/ Value Proposition Canvas)는\n         알렉스 오스터왈더 외 3인(2016),\n         《밸류 프로포지션 디자인》, 아르고     비즈니스 모델 캔버스(Business Model Canvas)를 창시한 오스터왈더와 예스\n         나인미디어그룹\n                                 피그누어(Yves Pigneur) 등이 2014년에 소개한 비즈니스 모델 개발 도구로\n                                 비즈니스 모델 캔버스에서 가장 핵심이 되는 ‘가치 제안’, ‘고객’ 블록을 보다\n                                 상세하고 논리적으로 작성하였다.\n\n                                 가치 제안 캔버스는 고객(세분화) 프로필(Customer (Segment) Profile)과\n                                 가치(제안) 맵(Value(Proposition) Map)의 두 부분으 로 이루어져 있다.\n                                 고객(세분화) 프로필은 고객을 관찰하고 확인한 일련의 고객 특성들에 대해\n                                 명확한 이해를 돕는 부분이고, 가치(제안) 맵에서는 고객을 유인하기 위해 해당\n                                 고객에게 부합하는 가치를 어떤 식으로 창조할 것인지를 기술한다. 그리고 이 두\n                                 부분이 교차하는 중간 지점에서 상품(제품)/서비스의 적합성에 도달하게 된다.\n\n         220                     가치 제 안 캔버 스 로 구체 화 하기 전 설명이 가 능 한 문 장 형태의 대안적\n         알렉스 오스터왈더 외 3인(2016),\n         《밸류 프로포지션 디자인》, 아르고     프로토타입 방법인 애드리브(Ad-Lib) 220 를 활용할 수 있다. 애드리브(Ad-\n         나인미디어그룹, pp. 82-83\n                                 Lib) 프로토타입은 가치 제안 아이디어를 빠르고 간단하게 파악하여 가능성을\n                                 확인해 볼 수 있고, 어떤 방향으로 가치를 창출하려고 하는지 즉시 확인할 수\n                                 있어 여러 개를 만들어서 아이디어를 발전시킬 수 있는 효율적인 방법이다.\n\n\n\n\n         324 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f가치 제안 캔버스 제작\n가치 제안 캔버스를 제작할 때 가장 많이 저지르는 실수 중의 하나는 출발점을\n목표 고객이 아닌 목표 제품이나 서비스로 잡는 경우이다. 이런 경우, 목표\n고객이 원하는 제품이나 서비스를 만들기가 어려워진다. 시작은 항상 오른쪽\n고객(세그먼트) 프로필로부터 시작하여 왼쪽의 가치(제안) 맵으로 이동하면서\n캔버스를 제작한다.\n\n\n1. 고객 프로필을 정확하게 정의\n• 실현되지 않은 혜택 중에서 고객이 가장 중요시하는 것에 초점을 맞출 수\n 있는가?\n• 충족되지 않은 새로운 활동을 찾아낼 수 있는가?\n• 해결되지 않은 고객 불만 중에서 가장 극심한 불만을 해결할 수 있는가?\n\n\n2. 만들어진 가치를 시각화\n• 고객(세그먼트) 프로필에 부합하는 새로운 혜택 창출 방안을 고안해 낼 수\n 있는가?\n• 새로운 제품이나 서비스를 상상해 낼 수 있는가?\n• 고객 프로필에 부합하는 새로운 불만 해결 방안을 고안해 낼 수 있는가?\n\n\n3. 제품-시장의 적합성 달성\n• 문제-해결 적합성: 가치 제안을 통해 해결하려고 하는 활동, 불만, 혜택을\n 고객이 중요시하는가?\n• 제품-시장 적합성: 제안한 가치가 고객이 정말 원하는 것인지 입증할 수\n 있는가?\n• 비즈니스 모델 적합성: 가치 제안에 맞춰 도출해 낸 비즈니스 모델이 측정\n 가능하고 수익성이 높다는 것을 입증할 수 있는가?\n\n\n\n\n                               서비스·경험디자인 이론서 325\n\f                    가치 제안 캔버스의 핵심은 고객의 극심한 불만과 혜택을 제품이나 서비스를\n                    통해 해소해 주는 것으로 서비스 전과 후의 차이가 뚜렷해야 한다는 점이다.\n                    또한 가치 제안 캔버스는 시각화 도구로서, 공유 언어로 조직 내 여러 부서들의\n                    공동창작을 유도하고, 비즈니스에 부합하는 가치를 정확히 파악할 수 있도록\n                    도움을 줄 수 있다. 그리고 특히 이러한 활동은 변화하는 시장 상황 속에서\n                    지속적으로 성과를 측정하면서 가치를 창출하는, 제품과 서비스의 끝없는 개선\n                    활동이라는 것을 명심해야 한다.\n\n\n\n\n326 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f  제품과 서비스가 고객혜택을\n어떤 방식으로 창출할 수 있는지 기술\n\n\n\n\n                       서비스·경험디자인 이론서 327\n\f         카노 모델(Kano Model)221,222,223\n\n\n\n더 알아보기\n         221                               카노 모델(Kano Model)은 1980년대에 카노 노리아키 교수가 소개한 제품\n         What is the Kano Model?\n         2021.10월 기준 (https://             개발에 관련된 상품 기획 이론으로, 제품이나 서비스를 기획할 때 그 구성\n         kanomodel.com)\n                                           요 소에 대해 소비자가 기대하 는 것의 충 족, 불 충 족이라는 객관적 관계와\n         222\n                                           소비자의 만족, 불만족이라는 주관적 관계 사이의 상호 관계를 5가지 품질\n         The Kano Model – A tool to\n         prioritize the users’ wants and   요소로 설정하여 설명하고 있는 프레임워크(framework)이다. 그는 어떤 제품의\n         desires, Sachendra Yadav,\n         2021.10월 기준 (https://             특성을 더하거나 향상시킬 때 혹은 어떤 요소를 제거할 때 사용자의 만족도가\n         www.interaction-design.org/\n                                           증가하는지를 연구하고 이를 시각화하였다.\n         literature/article/the-kano-\n         model-a-tool-to-prioritize-the-\n         users-wants-and-desires)          카노 모델의 y축은 감정적 반응, x축은 기능의 구현 수준이며, 감정적 반응의\n\n         223\n                                           정도는 서비스의 기능이 얼마나 완벽하고 정교한가에 따라 결정되는 이원적인\n         Kano, Noriaki; Nobuhiku Seraku;\n                                           인식 방법이다. 설문조사나 인터뷰에서 카노 모델을 적용하면 어떤 기능과\n         Fumio Takahashi; Shinichi\n         Tsuji(April 1984), <Attractive    특성이 사용자에게 중요하게 느껴지는지 우선순위를 정할 수 있고 측정할 수\n         quality and must-be quality>,\n         Journal of the Japanese Society   있는 기준 체계를 알아볼 수 있다.\n         for Quality, pp. 39–48.\n\n                                           품질을 느끼는 주요 3가지 요소 : 고객 요구사항\n                                           1. Basic(불만족 요인, 기본적인 요구사항) : 당연히 있을 것으로 생각\n                                           2. Performance(만족 요인, 가변적 요구사항) : 더 많이 제공될수록 더\n                                            만족하는 범주\n                                           3. Excitement(감동 요인, 잠재적 요구사항) : 기대 이상의 특성 또는\n                                            매력적으로 느끼는 것\n\n\n\n\n         328 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f다섯 가지 감정 반응 유형\n1. 매력적 품질 요소(Attractive Quality Element)\n• 충족이 되었을 경우 만족감을 제공하지만 충족이 되지 않더라도 크게 불만족\n  없는 품질 요소\n• 고객이 미처 기대하지 못했던 것 혹은 기대를 초과하여 만족을 주는 것으로\n  고객 감동(Customer Delight)을 줄 수 있는 요소로 큰 만족감을 줌\n• 고객들은 이렇게 제공되는 품질에 대해 모르거나 기대하지 않았기 때문에,\n  충족이 되지 않더라도 크게 불만을 느끼지 않음\n\n\n2. 일차원적 품질 요소(One-dimensional Quality Element)\n• 충족할 때는 만족감을 주지만, 충족되지 않을 때에는 불만족으로 이어지는\n  품질 요소\n• 일반적으 로 ‘품질’이 좋고 나쁨을 말할 때 들어가 는 요소들이 일차 원적\n  기능으로 들이는 비용이나 일정이 허락하는 한, 이 요소는 많이 반영되고\n  충족될수록 사용자에게 좋은 인상을 남길 수 있음\n• 기능 구현의 수준에 따른 만족도 증가가 거의 직선적으로 비례\n\n3. 당연적 품질 요소(Must-be Quality Element)\n• 반드시 있어야만 만족하는 품질요소\n• 아무리 충족된다 하더라도 너무나 당연한 것이기 때문에 별다른 만족감을\n  주지 않는 요소이지 부족하거나 기준에 미치지 못하면 불만족이 상승함\n• 기준 이상으로 수준 높게 구현할 필요는 없으나 시장 진입을 위한 기본적인\n  품질 요소\n\n\n4. 무차별(부가적인) 품질 요소(Indifferent Quality Element)\n• 만족하는 것과 만족하지 못하는 것 사이에 품질의 차이가 느껴지지 않는 품질\n  요소\n• 사용자가 사용하지 않는 기능인 경우가 대부분임\n• 주로 불필요한 요소를 찾아낼 때 유용하게 사용됨\n\n\n5. 역품질 요소(Reverse Quality Element)\n• 제품이나 서비스에 원치 않는 기능으로 고객이 기대한 것과 반대인 품질 요소\n• 충 족되면 불만족 을 일으키고 원치 않는 기능이 잘 구현이 되면 오히려\n  만족도가 떨어짐\n\n\n각각의 요소들이 의미하는 내용에서 한층 더 중요한 부분은 시간의 흐름(Time\nDimension)에 따라 변화(매력적 요소 → 일원적 요소 → 당연적 요소)하는\n품질 요소이다. 사람들의 생각과 요구사항은 시시각각 변하며, 기술이 발전함에\n따라 ‘최고 사양’의 의미 역시 지속적으로 변화하기 때문에 사용자가 즐거움을\n\n\n\n\n                                           서비스·경험디자인 이론서 329\n\f                                    카노 모델을 이용한 분석법 실행\n\n                  Q\n                        I dislike it\n\nA : Attractive(매력적) O : One-dimensional(일원적) M : Must-be(당연적) I : Indifferent(무차별적)                         R : Reverse(역품질)\nQ : Questionable(의심스러운 답) - 설문을 이해하지 못했거나 또는 응답자가 품질에 대한 이해도가 낮은 것이 원인이 될 수 있음\n\n\n\n\n225                                    카노 모델(Kano Model)의 장점225\nLeveraging the Kano Model for\nOptimal Results, Jan Moorman,\nUX Magazine, 2021.9월 기준\n                                       1. 우선순위를 결정하는 데에 도움이 된다. 수많은 기능 중 어디에 집중할지를\n(https://uxmag.com/articles/               명확히 알려 주어 고객에게 더 큰 만족을 주는 제품과 서비스를 제공할 확률이\nleveraging-the-kano-model-\nfor-optimal-results)                       높아진다.\t\t\t\t\t\t\n\n                                       2. 특정 기능이 왜 고객에게 더 중요한지 자세히 알아볼 수 있도록 함으로써\n                                           그것을 어느 정도 수준에서 구현해야 할지 안내해 주기 때문에 불필요한 개발\n                                           시간을 줄여 준다.\n\n\n\n\n                                                                                                서비스·경험디자인 이론서 331\n\f06\n완료하기\n개발된 서비스디자인을 돋보이게 하기 위하여 어떻게 설득을 위한 프리젠테이션을\n준비해야 할지 사례를 통해 배우고, 디자인 권리 등 서비스디자인을 보호받는 방법에\n대하여 알아본다.\n\n\n\n\n332 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f6.1 프리젠테이션 및 결과 보고서 작성\n\n6.1.1 시선을 사로잡아라\n\n서비스디자인을 완료하기 위해서는 보고서 작성과 프레젠테이션이 필요하다.\n이 과정에서 직관적 시각화 노하우는 무엇보다도 중요하며 텍스트로 문서화된\n보고서에 대한 검토자의 시각적 자극을 통해 검토자의 시선을 사로잡는 것이\n핵심이다. 일반적으로 대상물에 대한 첫인상 결정의 시간은 0.6초에 불과한\n것으로 알려져 있다. 따라서 수많은 보고서를 검토해야 하는 검토자 입장에서,\n순 간 의 시 선이 머무르는 흥 미로운 프레 젠테이 션 자료 의 작성이 얼마 나\n중요할지를 되짚어 볼 필요가 있다. 첫인상의 이미지는 자료가 얼마만큼 정돈된\n편집과 문서 체계를 갖추었느냐에 따라 결정된다.\n\n보고서는 읽는 것이 아니라 보여주는 것이다.\n\n시선을 사로잡기 위한 시각적 팁으로, 우선 문서와 용지의 포맷부터 확인해야\n한다. 보고서 형식은 세로 문서로 편집될 수도 있고, 프레젠테이션을 위한 가로\n문서로 편집될 수도 있다. 따라서 문서 용도에 따라 세로 또는 가로 형식을\n정해 그에 부합하 는 편집이 이루어져야 한다. 세로 문서는 텍스 트 중 심의\n공식화된 문서에 주로 활용되며, 가로 문서는 이미지 중심의 발표용 문서에\n주로 활용된다. 용지의 크기 또한 잊지 말고 고려해야 할 것이다. 건축이나 공간\n분야의 비즈니스에서는 의외로 A3 가로 형식의 기획과 제안이 일반적이다. 또\n한 가지는 보고서가 다양한 색상을 허용하는 컬러 보고서인지 흑백만 허용되는\n보고서인지 확인하여 제안된 기준에 맞추는 것이다.\n\n\n\n\n[ 문서용도에 맞는 편집 ]\n\n\n\n\n                              서비스·경험디자인 이론서 333\n\f                    전체 문서의 포맷 다음에 두 번째로 눈에 띄는 것은 무엇일까? 그것은 바로\n                    제목과 번호일 것이다. 보고서를 구성할 때, 항목에 대한 부호를 붙이는 것은\n                    체계를 논리적으로 정리할 수 있는 가장 효과적인 방법이다. 일반적인 구분과\n                    번호 체계를 활용해 대제목, 중제목, 소제목, 그에 따른 세부 내용 등을 서술하고\n                    문서 전개의 흐름을 체계적으로 서술할 수 있어야 한다. 그뿐만 아니라 보고서에\n                    삽입되는 표와 그림의 일련번호를 체계화하고 명확한 제목 을 명기한다면,\n                    내용의 흐름을 설명하는 보조자료로써 역할을 잘 수행하게 될 것이다.\n\n\n\n\n                    [ 항목 부호의 활용 ]\n\n\n                    이때, 사용되는 번호 체계 및 표·그림 일련번호는 일반적인 번호 체계를 사용할\n                    수도 있지만 발주 기관에서 양식과 규칙을 제공하는 경우도 있으므로, 요구되는\n                    문서서식에 맞춰 작성하는 것이 필요하다.\n\n                    목차에 붙는 페이지 번호는 실제 보고서 평가에 있어서 가장 빈번하게 확인하는\n                    요소이다. 페이지 번호에는 절대 오류가 있어서는 안 되며 페이지를 찾아보기\n                    쉽도록 배려하고, 목차가 잘 구성되어 있다는 인상을 주는 것이 필요하다.\n                    페이지 번호와 그림 번호는 보고안의 제일 앞에 위치하며, 전체 구성을 안내하고\n                    서비스디자인의 내용에 대한 대략적 윤곽을 제공하기 때문에 항상 내용의\n                    오류를 제거하고 시각적으로도 깔끔하게 정리하여 차별화할 수 있도록 해야\n                    한다.\n\n                    이제 결과 보고서의 구체적 내용 측면의 차별화에 대하여 살펴보도록 하자.\n                    보고서는 대부분 텍스트 중심의 문서로 구성되기 때문에, 글자 크기 및 글씨체,\n                    색상 등과 연관된 가독성에 유의해야 한다. 강조해야 할 부분이 있다면 볼드체나\n                    큰 글자를 활용하고 만약 여의치 않으면 밑줄을 사용하여 눈에 띄면서도 핵심을\n                    파악하기 쉽도록 유도해야 한다. 특히 인쇄용 문서와 발표용 문서에 따라 글자\n                    크기를 다르게 지정하여 상황에 맞게 가독성이 높아지도록 고려해야 한다.\n\n\n\n\n334 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f[ 가독성을 높이는 편집 ]\n\n\n\n텍스트 중심의 문서에서는 명조체와 같은 부드러운 글씨체를 사용하는 것이\n좋으며, 프레젠테이션 문서에서는 고딕체와 같은 간결한 글씨체를 사용하는\n것이 검토자의 집중력을 강화시킬 수 있다.\n\n텍스트 중심 문서에서는 10pt 이상의 글씨 크기를 사용해서 가독성 높게\n편집해야 한다. 보고서를 평가하는 평가자의 연령과 경험도 고려해야 하며,\n동시에 평가 장 조명과 열악한 평가 환경에 대해서도 대응할 필요가 있다.\n요약해서 이야기하자면 보고서는 결국 평가자에 대한 배려와 차별화 부분에\n대한 주목도를 최대한 높여서 전략적으로 접근해야 한다.\n\n보고서의 신뢰도와 정확성을 높이기 위해서는 출처를 명확히 제시하는 각주를\n삽입해야 한다. 최근 자료의 저작권과 인용에 대한 지식 권리와 도덕적 의무에\n대한 관심이 높아지고 있으며, 각주와 출처를 명확히 하는 것은 단순히 자료\n인용에 대한 도덕적 측면을 넘어서 자료에 대한 신빙성과 타당성, 나아가 이\n보고서가 얼마나 객관적인가를 대변하는 방법이기도 하다. 배려의 측면에서도\n생소한 용어, 문장 등은 각주를 달아 뜻을 이해하기 쉽도록 기술해야 한다.\n사 진과 이미지에 대한 출처도 놓치기 쉬운 부 분이므 로 반드 시 정확하게\n기입해야 한다.\n\n특히 보 고 서에서 직접 제안한 것과 수집된 분 석 자료를 명확히 구 분하여\n보고안에서 강조하는 자신의 아이디어를 구별하여 제시하는 것이 중요하다.\n\n\n\n\n                            서비스·경험디자인 이론서 335\n\f                    [ 출처가 명확한 각주 삽입 ]\n\n\n\n\n                    세부 각주는 그림과 같이 기입하고 활용하는 것이 좋다. 우선 보고서를 요청하는\n                    발주처의 양식을 준수하는 것이 필요하고, 서적이나 논문, 보고서, 사전 등은\n                    표준화된 방법으로 출처를 명시한다. 특히 4번째와 5번째에 제시된 신문 기사와\n                    인터넷 자료의 경우 출처를 무시하는 경우가 많은데, 기사는 신문사, 발행일,\n                    인용 면, 기자 등을 명시하고, 인터넷 자료의 경우 출처, 저작자, 링크 주소,\n                    인용일자를 잘 표기하여야 한다. 평가자들은 이러한 출처를 반드시 확인하고,\n                    때로는 직접 검색해서 자료의 명확성을 확인하도록 하며, 출처와 인용 등 자료의\n                    정확성에 문제가 생기면 신뢰할 수 없는 보고서가 된다는 점을 유념해야 한다.\n\n\n\n\n336 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f6.1.2 그림으로 표현하라\n\n정돈된 문서 편집을 통해 시선을 끄는 방법 외에도 그림을 통하여 보고 내용에\n대한 체계를 시각적으로 전달할 수 있어야 한다. 우리의 뇌는 글보다 그림을\n좋아하기 때문에 실행 내용 을 그림으 로 시각화함으 로써 검토자의 시선을\n고정시킬 수 있도록 하 는 표현 방법을 검토해야 한다. 최근 인포 그래픽이\n활성 화 되면 서 정 보를 어떻 게 시각 화 할 것인가 에 대한 관 심이 높 아지 고\n있다. 하지만 지나친 이미지의 활용 은 득보다 실이 많을 수 있기 때문 에\n간단명료하면서도 신뢰할 수 있도록 적정선을 지켜야 한다.\n\n정보의 시각화 를 효과적으 로 활용하 는 방법은 다음과 같다. 우선 장황한\n설명글은 표 로 정리해 콘텐츠를 구 분해서 보여 주 는 것이 좋다. 세부적인\n데이터보다는 전체적인 스토리를 전달할 수 있는 체계를 큰 그림으로 보여 주는\n것이 효과적이다. 또한 글자 크기와 색상을 활용해 강조글과 보조글을 구분하여\n시선의 강약을 조절할 수 있어야 한다. 너무 많은 종류의 글자 크기와 색은\n혼란을 유발할 수 있으니 글자의 크기와 색상을 종류별로 미리 잘 계획해 두어야\n한다.\n\n추가적으로 전체적인 맥락에 맞춰 적절한 그림과 표, 그래프 등을 활용하는\n것이 효 과 적이다. 시각적 그래픽 자료를 활용하 여 보 고 서의 집중 효 과 를\n강화하기 위해서는, 전문화된 인포 그래픽 사이트를 활용하 는 것도 하나의\n요령이다. 이러한 전문 사이트는 간결하고 핵심적인 정보 디자인을 쉽게 해 준다.\n인포그래픽스나 데이터뉴스, 인포그램, 비주얼리 같은 사이트는 SNS를 통해\n쉽게 접할 수 있으며, 정보 측면에서는 인포그래픽의 레퍼런스를 넘어 트렌드와\n다양한 지식들을 쉽게 수집할 수 있게 하는 정보의 아카이브 역할을 하므로 꼭\n기억할 필요가 있다.\n\n처음 다이어그램을 만들거나 인포그래픽을 제작하는 일은 쉽지 않기 때문에\n평소 이런 사이트에서 응용할 수 있는 자료를 찾아 축적해 놓는 것이 필요하다.\n\n사람을 설득시키는 방법으로는 시각적인 자극을 주는 것이 가장 효과적이다.\n그림은 한눈에 알아볼 수 있도록 표현하는 것이 가장 중요한데, 간단히 만들 수\n있고 보는 사람의 흥미를 유발하여 내용을 강력하게 부각시킬 수 있다는 장점이\n있다. 따라서 전달하고자 하는 메시지를 도형, 그래프 등과 연계해 작성함으로써\n강력하게 전달할 수 있다. 이때 그림은 한 페이지 또는 하나의 문단에 1개 이상\n사용하지 않는 것이 더욱 효과적이다.\n\n\n\n\n                               서비스·경험디자인 이론서 337\n\f                    [ 정보의 시각화 ]\n\n\n                    보 고 서 본 문의 내 용 을 요약 하 여 핵 심 콘 셉 트를 그림 으 로 표현 한 것 을\n                    다이어그램 또는 도해라고 한다. 이러한 다이어그램은 단순히 그림으로 예쁘게\n                    만드는 것이 아니라 핵심 개념을 체계화하여 압축적으로 표현한 것임을 잊지\n                    말아야 한다. 여기서 개념의 핵심화 는 결국 개념에 몇 가지 유형이 있기에\n                    다이어그램도 일반적인 패턴과 유형을 가지게 된다는 것을 알려준다. 그림에서\n                    보는 것처럼 피라미드형의 도해는 나열식의 아이디어에 위계질서를 부여하여\n                    중요한 상위의 개념부터 순차적인 아이디어의 체계를 파악하는데 효과적이다.\n                    상호 간 위계가 없이 수평적 아이디어가 3개 내지 4개로 이어진다면 두 번째에\n                    제시된 벤다이어그램형 도해를 활용할 수 있다.\n                    이러한 아이디어에 하위 내용이 있다면 세 번째의 매트릭스형 도해를 활용하는\n                    것도 바람직하다. 다이어그램은 단순히 시각적인 아름다움이 아니라 핵심\n                    콘셉트와 내용을 표현하는 것이다. 우리가 다양한 다이어그램의 사례를 접할\n                    때는 왜 이런 모양으로 구성되었는지와 시각적으로 전달하고자 하는 메시지가\n                    무엇인지를 항상 파악하고 응용할 수 있어야 한다.\n\n\n\n\n                    [ 도해로 표현하기 ]\n\n\n\n338 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f[ 도해 표현 사례 ]\n\n\n\n\n               위 그림은 나열형, 피라미드형, 벤다이어그램형의 다양한 응용 사례이다.\n               차례로 살펴보자면 좌측 상단은 피라미드 대신에 원을 사용하여 중심에서부터\n               퍼져 나가는 차별화된 콘셉트를 보여 주고 있다. 도입기부터 확산기까지의 기대\n               효과 등을 표현할 때 응용할 수 있다. 좌측 하단은 세부 내용이 많거나 요소가\n               여러 개일 경우 활용할 수 있는 형태이다. 원과 사각형 외에 육각형의 형태도\n               빈번하게 활용하는 시각화의 요소이다. 다른 사례들은 내용의 개수가 많아지고\n               복잡한 요소를 추가한 것이지만, 선행 사례들과 마찬가지로 중심에 최종 목표를\n               배치하거나 상호 간의 연계를 화살표로 표현하는 것처럼 사업의 핵심 개념을\n               강조하려는 의도로 표현한다는 점에서는 동일하다고 볼 수 있다.\n\n               그래프는 숫자 등 정량적 자료를 데이터 비교의 방법으로서 쉽고 빠르게 이해할\n               수 있도록 도와주는 매우 효과적인 시각화 요소이다. 또한 데이터의 변화와\n               추세, 관계 등을 파악하 는 데 매우 효과적이다. 따라서 데이터를 제시하 는\n               목적에 따라 형태를 효과적으로 선택해 사용하는 것이 중요하다. 그래프 작성\n               시에는 다음과 같은 주의 사항을 염두에 두어야 한다.\n\n\n\n\n                                               서비스·경험디자인 이론서 339\n\f                    우선 그래프를 활용하는 목적을 명확히 제시할 수 있어야 하며, 전체 데이터\n                    내용을 모두 제시하기보다는 중요 포인트를 압축해 표현해야 한다. 그래프는\n                    간결할수록 효율적이며, 군더더기 정보는 최대한 배제하는 것이 효과적이다.\n                    다 음 그림에 서는 가 장 많 이 활용되는 선형 그래프 와 막대그래프, 파 이형\n                    그래프의 사례가 제시된다. 이 그래프들은 사용 목적에 따라 주장하는 내용을\n                    설득력 있게 전달하기 위하여 사용한다는 점을 잊지 않아야 한다.\n\n\n\n\n                    [ 그래프로 표현하기 ]\n\n\n\n\n                    첫 번째로 꺾은선그래프는 시간의 경과에 따른 연속적인 변화 를 비교하 는\n                    데 효과적이다. 수량이 변하 는 모양과 추세 정도를 쉽게 표현할 수 있으며\n                    여러 가지 데이터의 경향을 비교하는 데도 용이하다. 이러한 이유로 증권이나\n                    경제성장률 등 추세를 비교 분석하는 데 꺾은선그래프가 많이 사용된다.\n\n                    두 번째로 막대그래프는 총계와 구성비의 추이를 동시에 표시해서 복수의\n                    요소를 상대적으로 비교하는 데 효과적이다. 여러 종류의 데이터를 상대적인\n                    키 높이로 비교하거나 특정 시점에서의 수량을 비교할 때 유리하다. 연령별\n                    인구, 제품별 판매량처럼 여러 데이터를 한 시점에서 동시에 비교할 때 사용하면\n                    편리하다.\n\n\n\n\n340 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f             세 번째로 원그래프는 요소별 구성 비율을 나타내는 데 효과적이다. 원 전체를\n             100%로 보고 각 부분의 비율을 면적으로 표현하기 때문에 전체와 부분의\n             비율을 비교하고 각 부분의 구성을 상대적으로 확인할 수 있다. 주로 시계\n             방향에 따라 크기순으로 항목을 배열하는 것이 알아보기 편하다. 유의해야 할\n             점은 가끔 기타 항목이 너무 클 경우 앞으로 나와 두드러져 보이기 때문에 기타\n             항목이 생기지 않거나 적은 비중을 차지하도록 계획하는 것이 필요하다. 또한\n             너무 적은 비율은 표현이 어렵기 때문에 이러한 항목을 모아 기타로 분류하는\n             것도 방법이 될 수 있다.\n\n             네 번째로 레이더 그래프 또는 스파이더 맵이라고 불리는 그래프는 평가 항목\n             간 균형과 경향을 직관적으로 파악하는 데 효과적이다. 여러 개의 평가 항목에\n             대한 장단점을 쉽게 비교할 수 있고, 나아가 각 모양의 패턴에 따라 전체 형상을\n             비교함으로써 평가 대상의 특성을 직관적으로 파악할 수 있다.\n\n\n\n        종류                                     특징\n\n\n\n                              - 시간의 경과에 따른 연속적인 변화를 비교하는 데 효과적\n꺾은선\n                              - 수량이 변화하는 모양과 정도를 쉽게 표현 가능\n그래프\n                              - 여러가지 데이터의 경향을 비교할 때 활용 가능\n\n\n\n\n                              - 총계와 구성비의 추이를 동시에 표시해 복수의 요소를\n막대                              비교하는 데 효과적\n그래프                           - 여러 종류의 데이터를 상대적으로 비교하는 데 활용 가능\n                              - 어느 특정 시점에서의 수량을 비교하는 데 유리\n\n\n\n\n                              - 요소별 구성비율을 나타내는 데 효과적\n                              - 원 전체를 100%로 보고 각 부분의 비율을 면적으로 표현\n원 그래프\n                              - 전체와 부분의 비율을 쉽게 알 수 있음\n                                (시계방향에 따라 크기 순으로 배열)\n\n\n\n\n                              - 평가항목 간 균형과 경향을 직관적으로 표현하는 데 효과적\n레이더                           - 여러 개의 평가 항목에 대한 장단점과 균형을 비교해서 알\n그래프                             수 있도록 표현\n                              - 여러 측정 목표를 겹쳐서 비교하는 데 용이\n\n\n\n                              - 사물, 시설, 행위, 개념 등을 상징화된 그림 문자로 표현\n                              - 픽토그래프는 상징적인 그림 문자로 모두가 쉽게 공감할\n 픽토                             수 있는 것이 장점\n그래프                           - 픽토그래프는 양을 비교할 때는 유용하지만, 정확한 숫자\n                                를 나타내는 것은 한계\n                              - 정확한 숫자를 함께 표기해 한계점을 보완할 수 있도록 함\n\n\n\n\n                                                    서비스·경험디자인 이론서 341\n\f                    픽토그래프는 단순한 그래프를 넘어서 인포그래픽과 그래프가 결합된 개념이다.\n                    사물, 시설, 행위, 개념 등을 상징화된 그림문자로 표현함으로써 모두가 쉽게\n                    공감하고 직관적으로 정보를 파악할 수 있다는 장점이 있다. 픽토그래프를\n                    사용하지 않았다면 매우 복잡한 방식으로 이러한 정보를 표현해야 했을 것이다.\n                    반면에 정확한 숫자는 별도로 표기해야 하는 한계점도 기억해야 한다.\n\n                    구체적인 몇 가지의 예시를 살펴보도록 하자. 우선 예시에 나타난 원그래프에서는\n                    붉은색과 회색으로 표시된 전체적 비율 중 종로구가 의복 가죽의 제품비중은\n                    낮은 대신에 섬유와 인쇄업이 많다는 것을 선명하게 보여주고 있다. 원그래프의\n                    장점을 더욱 부각시킨 예이다. 다음의 4차 산업혁명의 시장 분석 그림에서는 사물\n                    인터넷(IoT)이 가장 큰 비중을 차지한다. 하지만 이 그래프에서 이야기하고자\n                    하 는 바는 바로 클라우드 기술의 비중이다. 15%의 비율로는 두드러지지\n                    않기 때문에 면적을 크게 하여 두드러져 보이도록 변형하였다. 사용하는 통계\n                    프로그램의 차트를 그냥 활용할 수도 있지만 주장하는 바에 맞도록 그래프를\n                    수정하여 사용하는 방법도 필요하다.\n\n\n\n\n[ 그래프 표현 사례 ]\n\n\n\n\n342 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                다음 그림의 왼쪽 막대그래프에서는 종로구가 서울시의 평균값에 비해 유년\n                부양비가 3.4% 낮으며, 노인 부양비가 5% 높고 노령화지수는 49.3% 높음을\n                알 수 있다. 특히 종로구의 노령화지수가 서울시의 전체 평균 값과 비교해\n                월등히 높게 나타나고 있음을 쉽게 확인할 수 있다. 각 항목에 대한 비교도\n                가능하겠지만 이 그래프는 3가지 항목에 대한 서울과 종로의 차이를 드러내는\n                데 주안점을 둔다. 이 그래프를 사용하는 목적은 노령화지수와 노인 문제를\n                핵심 주제로 도출하기 위함임을 알아야 할 것이다. 결국 그래프는 제안하는\n                비즈니스의 타당성과 설득, 핵심 콘셉트의 전달을 목적으로 만들어지는 것이다.\n\n\n                오른쪽 그림의 수평 막대그래프는 좌우배열을 통해 서울과 종로 두 지역을\n                비교하 는 그래 프이다. 아 래에 는 그중 에 서 추 출 된 생활 안전도 의 5 가지\n                항목을 비교하는 내용이 담겨 있다. 서울시 평균과 종로구 평균을 비교하면\n                종로구에서는 길거리 쓰레기, 공간/녹지, 범죄, 폭력, 수질오염, 소음순으로\n                서울시의 평균값에 비해 생활 안전도의 심각도가 높다는 것을 알 수 있다.\n\n\n\n\n[ 그래프 표현 사례 ]\n\n\n\n\n                                               서비스·경험디자인 이론서 343\n\f                    위의 그래프에서 종로구만을 단순히 보자면, 길거리 쓰레기와 공간/녹지,\n                    범죄가 중요한 요소이지만 서울시의 평균과 비교를 한다면 주차질서는 빠지고\n                    소음과 수질오염이 개선 요소가 된다. 즉 서울시 전체에서는 주차질서가 가장\n                    중요한 문제이지만 종로구에서는 공간녹지와 쓰레기가 가장 중요한 문제라는\n                    것을 나타내려 한 것이다. 따라서 그래프라는 것은 보고서가 주장하는 논점을\n                    직관적으로 알기 쉽게 보여 주는 것이며 동시에 전략적 특성과 차별점, 논거의\n                    타당성을 제시하는 수단이 된다.\n\n                    다음은 서비스디자인 완료 보고서에서 비용이나 매출, 앞으로의 성장 추이,\n                    시장 전망 등을 제시할 때 가장 빈번하게 사용하는 선형그래프의 사례이다.\n                    국내 · 해외시장에서의 생산 계획에 따라 매출액과 판매량이 증가함을 보여주고\n                    있으며 이러한 종류의 그래프는 항상 우측 상향의 특성을 보인다. 하지만 실제\n                    보고서에서는 이러한 상향 그래프의 명확한 근거를 제시할 수 있어야 한다.\n                    왜냐하면 이러한 성장 근거를 평가자나 검토자가 반드시 질문하기 때문이다.\n\n\n\n\n[ 그래프 표현 사례 ]\n\n\n\n\n344 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f대시보드\n\n\n\n                                                        더 알아보기\n       대시보드는 주요 비즈니스 지표를 전달하기 위해 정보 디자인을 사용한다.\n       창의적이고 정적인 이미지로 표현하 는 인포 그래픽과 는 달리 대
