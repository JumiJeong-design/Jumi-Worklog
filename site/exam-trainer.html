기능이 적절하게\n작동하는지에 대한 확인 과정을 포함하며 이를 위한 프로토타입 제작 및 사용성\n평가가 중요한 역할을 한다.\n\n\n\n3. 접근성에 중심을 둔 사용자 경험디자인\n Accessibility-oriented Experience Design\n제품이나 서비스가 얼마나 접근하기에 용이하고 심미적으로 만족스러운가에\n중점을 둔다. 디자이너가 의도한 대로 사용자 경험이 이루어지기 위해서 제품이나\n서비스가 어떻게 전달되고 의미 있는 경험을 형성하는지에 대한 고려가 중요하다.\n먼저 사용자의 동기를 파악하고 그에 따라 적절한 기능을 제공하여 사용성을\n충족시킨 이후에 접근성과 심미성이 갖춰졌을 때, 원활하고 유연한 경험을 위한\n환경을 조성하는 데 역할을 한다.\n\n\n\n\n                                            서비스·경험디자인 이론서   83\n\f02\n서비스·경험디자인의 프로세스와 툴킷\n이번 장에서는 서비스디자인의 프로젝트가 일반적으로 구조화되는 방식을 살펴보고\n다양한 연구 및 기업, 기관 등에서 개발한 단계별 활용 툴킷을 소개한다.\n\n\n\n\n84   Part 2. 서비스·경험디자인은 무엇인가?\n\f2.1 서비스·경험디자인 프로세스\n\n대량생산을 염두에 두고 개발되는 신제품 개발의 경우 생산 과정에서 막대한\n비용이 소모되기 때문에 보통 철저한 시장 조사 및 소비자 조사 등을 기반으로\n제품 디자인 단계가 체계적으로 진행된다. 이에 비해 서비스·경험디자인은\n비 선형 적(n o nline ar) 이 고 반복 적인(iter ati ve) 디 자 인 단계 를 거치며\n프 로 세 스 가 진행되는 것이 일반적이다. 뿐 만 아 니라 서비스·경험디자 인\n프로세스는 디자이너에 따라 그리고 프로젝트의 성격과 목적, 배경 및 상황에\n따라서도 달라질 수 있다.\n\n이와 같이 서비스·경험디자인 프로세스는 엄격하게 규정되거나 정형화되기\n어렵긴 하나, 서비스디자인의 수요가 많아지고 학문적 지식이 축적되어 감에\n따라 다양한 서비스·경험디자인 프로세스 모델들이 제시되고 있다. 이와 같은\n서비스·경험디자인 프로세스 모델들은 각 디자인 단계를 따라 엄격하게 따라야\n하 는 처방적 성격의 가이드 라 인이라기보다 복잡 한 서비스·경험디자 인의\n접근 관점, 방법, 행위들을 성격에 따라 구조화하여 전체적인 과정을 조망해\n볼 수 있게 하는 지식에 더 가깝다고 할 수 있다. 이와 같은 배경을 바탕으로\n본 챕터에서는 서비스디자인 연구 커뮤니티에서 정의된 몇 가지의 대표적인\n서비스·경험디자인의 프 로세스를 소개하고 그 특징들을 살펴보 고자 한다.\n또한 마지막으로 이렇게 다양한 서비스·경험디자인의 프로세스에서 공통으로\n발견되는 주요 핵심 단계들에 대하여 살펴보고자 한다.\n\n\n\n2.1.1 서비스디자인 문헌에 정의된 서비스디자인 프로세스\n\n우선 서비스디자인 연구자 들 중 마크 스틱돈(Marc Stickdorn)과 제이콥\n슈나이더(Jakob Schneider)는 2010년 그들의 저서 『This is Service Design\nThinking』에서 탐험(Exploration), 창작(Creation), 숙고(Reflection),\n실행(Implementation)의 4가지 단계로 구성된 서비스디자인 프로세스를\n소개하였다. 그들은 이러한 4단계가 복잡한 서비스·경험디자인 프로세스를\n구조화하기 위한 가장 기본적인 방법이라고 보았다.\n\n첫 번째 탐험 단계에서 디자이너의 중요한 태스크는 서비스 제공 기업의 문화와\n목표를 이해하는 것이다. 해당 기업이 서비스·경험디자인을 이해하고 있는지,\n그리고 서비스·경험디자인을 실행할 준비가 되어있는지를 파악하는 것이다.\n서비스·경험디자인 프로세스는 디자이너와 서비스 제공 기업 구성원들과의 공동\n작업과 협업을 통해 이루어진다. 여기서 디자이너의 자주권은 디자인 과정을\n사용자 관점에서 창의적으로 이끌어가기 위한 것이며, 서비스 제공 기업의\n\n\n\n                                       서비스·경험디자인 이론서     85\n\f                      협조와 열린 마인드셋을 통해 확보될 수 있기 때문에 해당 기업을 이해하는\n                      과정이 필요한 것이다.\n\n                      다음으로는 무엇이 진짜 문제인지를 파악하는 과정이 필요한데, 이를 위해서는\n                      어떤 서비스에 대한 현재 고객 및 잠재적 고객들의 관점에서 그들의 진짜 동기와\n                      상황을 전체적으로 파악해야 한다. 그 후에는 발견점들과 현재 서비스의 구조를\n                      시각화하여 서비스·경험디자인 이해관계자들의 이해를 돕고 커뮤니케이션을\n                      원활하게 하는 과정이 따른다.\n\n                      두 번째 창작 단계에서는 서비스에 대한 아이디어와 콘셉트를 만들고 정의된\n                      문제를 가장 효과적이고 창의적으로 해결할 수 있는 방안들을 구상하게 된다.\n                      이 과정은 디자이너와 다학제적인 팀들뿐만 아니라 고객들을 포함한 다양한\n                      이해관계자들과의 공동 작업(Co-creative ideation)을 통해 이루어지게 된다.\n\n                      세 번째 숙고 단계에 서는 앞 단계에 서 만들어진 콘 셉트 와 아 이디어들 을\n                      테스트하게 된다. 이러한 테스트는 물리적 제품들을 디자인하고 테스트하는\n                      과 정 과 유 사 하 긴 하 지 만, 비 가 시 적 이 고 비 물 질 적 인 서 비 스 요 소 들 을\n                      테스트하기 위해서는 다른 전략이 필요하다. 이렇게 비가시적이고 비물질적인\n                      서비스 콘셉트를 최대한 테스트 가 능한 상태로 만들기 위해 디자이너들은\n                      스테이징(Staging)과 롤플레이(Roleplay) 기법들을 활용하기도 한다. 이러한\n                      기법들이 테스트하려는 서비스 환경과 상황을 완벽히 구현할 수 있는 것은\n                      아니지만, 오히려 이런 상황이 상상력과 창의력을 불러일으켜 서비스 콘셉트를\n                      더 향상시키는 데 도움이 될 수 있다.\n\n                      네 번 째 실 행 단 계 에 서 는 디 자 인된 서비 스 콘 셉 트를 구 현 하기 위 해 서\n                      현 재의 시스템을 변화시킬 수 있는 다 양 한 전략 이 사 용 된다. 이를 위해\n                      변화관리(Change management)의 기본 원리들이 활용되기도 한다. 그리고\n                      서비스 콘셉트가 현장에서 실제로 실행되려면 고객뿐만 아니라 서비스 제공\n                      기업의 직원들도 서비스 행위자로서 중요한 역할을 담당하게 된다. 따라서\n                      처음부터 서비스 콘셉트에 공감하고 동기부여될 수 있도록 서비스·경험디자인\n                      프로세스의 초기 단계부터 이들을 참여시키는 것이 중요하다. 그리고 앞서\n                      서비스 콘셉트를 프로토타이핑하 는 단계에서 서비스가 제공되는 순간마다\n                      직원들이 참여하면 서비스 콘셉트를 보다 더 잘 이해하게 된다.\n\n                      한편 안 나 메로니( Anna Meroni)와 다니엘라 상지오 지(Daniela\n                      Sangiorgi)는 2011년 그들의 저서 『Design for Services』에서 18개의\n                      서비스디자인 프로젝트들을 사례 연구로 조사하는 과정에서 발견한 다양한\n                      서비스디자인 도구들이 분석하기(Analysing), 만들어내기(Generating),\n                      개발하기(Developing), 프로토타이핑(Prototyping)과 관련된 디자인 행위들과\n\n\n86   Part 2. 서비스·경험디자인은 무엇인가?\n\f연관이 있다고 하였다. 그리고 저자 들 은 해당 4가지 디자인 행위들이 곧\n서비스·경험디자인 프로세스를 나타낸다고 하였다.\n\n- \u0007‘분석하기’는 비디오, 사운드, 이미지, 텍스트 등의 매체들을 사용하여 맥락적\n 정보를 모으고 기록하고 공유하는 것을 뜻한다. 분석 결과는 사용자들에게\n 공유되거나 프로젝트 참가자들과의 상호작용에 사용되어 그들의 인식이나\n 경험을 효과적으로 조사하는 데 활용될 수 있다.\n\n- \u0007‘ 만 들어내기’는 프 로젝트 참 여자 들과의 상호작용에서 수집된 경험들 을\n 기반으로 하여 공통된 의미들을 만들어내는 것이다. 이 과정에서 서비스\n 아이디어를 효과적으로 보여주기 위해 시각화 기법들이 활용될 수 있다.\n\n- \u0007‘ 개발하기’는 서비스 아이디어들 을 자세하고 풍 성한 서비스 시나리오와\n 시스템으로 전환하는 것이다. 서비스의 전체적인 모습을 구성하는 세부적인\n 파트들과 실현 가능성들을 고려하면서 개발해 나간다.\n\n- \u0007‘프로토타이핑(Prototyping)’은 워크숍이나 또는 실제 환경에서 사람들과\n 함께 새로운 서비스 아이디어들 을 테스 트하고, 새로운 서비스 모델들 을\n 실험하는 것이다.\n\n한편 로버트 큐레대일(Robert A. Curedale)은 2013년 그의 저서 『Service\nDesign: 25 0 essential methods』에 서 비전 정의하기(Defining a\nvision), 사람들과 그들의 맥락 이해하기(Knowing people and their\ncontext), 통찰의 틀 잡기(Framing insights), 아이디어 탐색하기(Exploring\nideas), 프 로 토타이핑과 반복하기(Prototyping and iterating), 결과 물\n실행하기(Implementing the outcomes)의 6단계의 디자인 행위들로\n서비스디자인 프로세스가 구성된다고 소개하였다.\n\n이러한 프로세스의 흐름을 정리해 보면, 우선 서비스의 큰 목표와 방향성 및\n비전을 정의하면서 서비스의 비전을 정의하게 되고, 여러 가지 사용자 조사 접근\n방법들을 통해 사람들의 경험과 맥락을 이해하는 과정을 거치게 된다. 그 결과\n얻어지는 데이터들을 토대로 새로운 서비스에 대한 통찰의 틀이 구체화되며\n다양한 서비스 아이디어들이 탐색된다. 이후 이러한 아이디어들과 솔루션들은\n프로토타이핑을 통해 테스트하고 수정하 는 반복적인 단계를 거치게 되며,\n최종적으로 얻어진 서비스 솔루션을 서비스 현장에서 실행하게 된다.\n\n\n\n\n                                      서비스·경험디자인 이론서    87\n\f                      2.1.2 종합적 서비스디자인 프로세스로서의 더블 다이아몬드 프로세스\n\n                      이상으로 살펴본 몇 가지의 서비스·경험디자인 프로세스 모델들 외에도 학계와\n                      실무 영역에서는 다양하게 응용된 모델들을 제시하고 있다. 이러한 모델들은\n                      사용되는 용어나 단계 설정이 각기 다르지만 근본적으로 유사한 성격과 특징을\n                      공유하고 있다.\n\n\n                      마크 스틱돈(Marc Stickdorn)과 제이콥 슈나이더(Jakob Schneider)는\n                      2 0 10 년 그 들 의 저 서 『 T h i s i s S e r v i c e D e s i g n T h i n k i n g 』 에 서\n                      이러한 점 을 지 적하 면 서 몇 가지 사 례 들 을 소 개하 였다. 그들의 저 서에\n                      의 하 면 발견하기 (I d e nt i f y) -개발 하기 (Buil d ) - 측 정 하기 (M e asur e) 의\n                      3단계, 통 찰 (Insight) - 아 이디어(Idea) -프 로 토타 이핑(Protot yping) -\n                      전달(Delivery)의 4단계, 발견하기(Discovering)-콘셉트잡기(Concepting)-\n                      디자인하기(Designing)-개발하기(Prototyping)-실행하기(Implementing)의\n                      5단계를 제시하 는 에이전시가 있지만, 각 프로세스의 전체적인 방향성 및\n                      단계별 성격은 서로 유사성을 지닌다고 하였다.\n\n\n                      이와 같 이 다 양 한 서비스·경험디자 인 프 로 세스 모델들 을 종합 해 보았을\n                      때 가 장 보편적이면서도 대표적으 로 활용될 수 있는 모델로 영국 디자인\n                      카운슬에서 제시한 더블 다이아몬드 프로세스 모델을 꼽을 수 있다. 본 장에서는\n                      종합적인 서비스디자인 프로세스 모델로서의 더블 다이아몬드 프로세스를\n                      간략하게 소개한다. 더블 다이아몬드 프로세스 모델은 발견하기(Discover),\n                      정의하기(Define), 개발하기(Develop), 전달하기(Deliver)의 4단계로 구성되어\n                      있으며, 각 디자인 단계는 각각 확산-수렴-확산-수렴의 성격을 지닌다.\n\n\n\n\n88   Part 2. 서비스·경험디자인은 무엇인가?\n\f[ 종합적 서비스·경험디자인 프로세스로서의 더블 다이아몬드 프로세스 모델 ]\n\n\n\n\n                                             서비스·경험디자인 이론서   89\n\f                      발견하기(Discover)\n\n                      모든 서비스·경험디자인 프로젝트의 시작은 새로운 아이디어의 기초가 될 수\n                      있는 영감이나 통찰을 수집하는 탐구 단계에서 시작된다. 이 단계에서는 문제를\n                      찾아내고 기회나 필요를 발견하며 해결안의 범위를 정의하며 다양한 리서치\n                      기법들이 동원될 수 있다. 우선 데스크 리서치를 통해 사회의 전반적인 동향, 산업\n                      및 시장 동향, 신기술, 경쟁 서비스 등에 대해 조사할 수 있다. 광범위한 대중을\n                      대상으로 사회적 경제적 트렌드를 파악하기도 한다. 그리고 해당 서비스와 관계된\n                      여러 서비스 수요자 및 이해관계자들을 파악하고 설문, 인터뷰, 관찰 등을 통해\n                      그들의 경험을 이해하며 잠재적 혹은 직접적 필요나 요구사항 등을 파악할 수\n                      있다. 여러 이해관계자를 이해하기 위해 정성적·정량적인 리서치 방법을 모두\n                      사용할 수 있다. 이 단계에서 리서치를 통해 수집된 다양한 지식과 아이디어들은\n                      이후 이어지는 서비스·경험디자인 프로세스의 여러 단계들이 나아가야 할 방향을\n                      제시할 수 있으며 다양한 디자인 활동들에 도움을 줄 수 있다.\n\n\n\n                      정의하기(Define)\n\n                      정의하기 단계에서는 앞서 발견하기 단계에서 얻은 조사 결과나 아이디어들을\n                      분석하여 가장 핵심적이고 중요한 디자인 문제들을 파악하고 이를 해결할 수 있는\n                      디자인 기회들을 정리한다. 발견하기 단계에서 얻은 다양한 이해관계자 경험이나\n                      필요 등에 대한 방대한 자료들은 친화도 분석 등의 분석 도구를 통해 체계적으로\n                      정리되며, 이와 같은 분석과 정리 과정을 통해 서비스의 주요 목표 타겟인\n                      페르소나가 설정되고 해당 페르소나를 중심으로 고객 여정 지도가 디자인된다.\n                      이러한 디자인 기회들은 또한 해당 서비스 조직의 필요나 비즈니스 목표에 비추어\n                      가장 우선순위가 높은 기회들을 중심으로 선별될 수 있다. 정의하기 단계의\n                      활동들을 통해 얻어진 최종 산출물은 디자인 브리프로 정리가 된다.\n\n\n\n\n90   Part 2. 서비스·경험디자인은 무엇인가?\n\f개발하기(Develop)\n\n개발하기 단계에서는 디자인 브리프를 기반으로 반복적인 디자인 프로세스를\n진행하며 서비스 콘셉트를 개발하고 테스트하여 구체적인 서비스 결과물로\n발 전 시 킨 다. 이렇 게 서 비 스 콘 셉 트 를 개 발 하 고 구체 화 하 는 과 정 에 서\n워크숍이나 코디자인 또는 코크리에이션 세션을 통해 사용자는 물론 다양한\n이해관계자들을 참여시켜 공동으로 디자인하고 테스트하는 과정을 거치기도\n한다. 이렇게 확정된 서비스 콘셉트를 바탕으로 서비스가 갖추어야 할 세부적\n기능 들이 정리되며, 이러한 기능 들이 전체적인 서비스 경험으 로써 어떻게\n작동할지를 보기 위해 서비스 시나리오, 고객 여정 지도 등의 모델링 기법이\n활용되기도 한다. 그리고 이러한 서비스 경험은 서비스 프로토타입을 통해\n실체화할 수 있으며 서비스 사용자나 다른 이해관계자들을 참여시켜 문제점이나\n개선점을 발견하고 보완해 갈 수 있다.\n\n\n\n전달하기(Deliver)\n\n전달하기 단계에서는 서비스나 제품 등의 콘셉트나 프로토타입이 최종 테스트\n과정을 거쳐 평가되고 발견된 문제점이나 개선점들이 해결된 후 최종 결과물이\n도출된다. 이 과정에서 최종 사용자의 피드백뿐만 아니라 사내 직원들 및\n파트너사 구 성원들 등 서비스의 실행에 관여하 는 다 양한 이해관계자 들이\n참여하여 서로 지식과 배움을 공유하는 것 또한 서비스의 원활한 실행을 위해\n중요하다.\n\n\n\n\n                                    서비스·경험디자인 이론서   91\n\f                                 2.2 서비스·경험디자인의 툴킷\n                                 이 장에서는 디자인 프로세스의 각 단계의 디자인 활동에 도움을 줄 수 있는\n                                 디자인 도구와 방법들을 소개한다.\n\n\n\n                                 2.2.1 AT-ONE Toolkit\n\n                                 사 이먼 클래트워 시(Simon Clat wor thy) 는 2016년 Oslo School of\n                                 Architecture and Design에서 AT-ONE이라고 하는 서비스디자인 툴킷을\n                                 개발 하 여 출 판 하 였다. AT- ONE은 서비스·경험디자 인 프 로 세 스 의 초기\n                                 단계인 발견하기(Discover) 단계와 정의하기(Define) 단계의 디자인 활동들을\n                                 향상시키는 것을 목표로, 구조화된 혁신 프로세스에 디자인씽킹을 접목하여\n                                 만들어졌다. AT-ONE은 서비스 제공 기업의 브랜드 전략과 일치하면서도 고객\n                                 중심적이고 고객의 서비스 경험의 질을 향상시킬 수 있는 서비스 아이디어 및\n                                 솔루션을 개발할 수 있도록 짜여 있다.\n\n\n\n101\nClatworthy, Simon(2016), 《How\nTo Design Better Services: The\nAT-ONE book》, Oslo School of\nArchitecture and Design\n\n\n\n\n                                 [ AT-ONE101 ]\n\n\n\n\n92    Part 2. 서비스·경험디자인은 무엇인가?\n\fAT-ONE은 서비스디자인 프로세스에서 핵심이 되는 요소들의 머리글자들을\n따서 만든 축약어로, 각 요소들은 다음과 같다.\n\nActors(행위자들) : 서비스는 가치 네트워크를 구성하는 행위자들의 복잡한\n공동 작업과 공동창작을 통해 전달된다. 따라서 이러한 서비스 행위자들을\n어떻게 조합하고 구성하는지에 따라 새로운 서비스 혁신의 기회가 만들어질 수\n있다.\n\nTouchpoints(서비스 접점) : 서비스는 시간의 흐름에 따른 다양한 서비스\n접점에 의해 전달된다. 따라서 서비스의 서비스 접점들이 충분히 활용되고\n있는지, 또는 다양한 서비스 접점들이 서로 잘 조화를 이루고 있는지를 살펴보는\n것은 서비스 혁신에 중요한 고려 사항이다. 또한 기존의 서비스에 새로운 서비스\n접점을 추가하는 것으로도 서비스 혁신이 이루어질 수 있다.\n\nOfferings(제공물) : 서비스는 보통 핵심 제공물을 기반으로 한다. 그러나\n기업들이 자신들의 핵심 제공물이 무엇인지 혹은 무엇이 필요한지 파악하지\n못한 경우도 있다. 따라서 기업은 핵심 제공물이 무엇인지, 그리고 그것이\n시장에서 고객들에게 어떻게 인식되고 있는지를 이해함으로써 서비스 혁신을\n이루어 낼 수도 있다.\n\nNeeds(필요) : 서비스 혁신을 위한 디자인은 고객들의 감정적이고 기능적인\n요구사항이나 필요 사항 또는 희망 사항이 무엇인지 파악하면서 시작된다.\n\nExperience(경험) : 서비스는 본질적으로 경험적이며 경험은 디자인되고\n연출될 수 있다. 이상적인 서비스 경험을 정의하고 이것을 구성하는 키워드들을\n개발할 때, 기술 중심이 아닌 경험 중심으로 서비스 혁신이 이루어질 수 있다.\n\n이러한 5개의 요소로 구성된 AT-ONE은 서비스 혁신을 위한 잠재적인 도구가\n될 수 있으며, 각 요소들의 관점에서 현재 있는 서비스를 분석하고 혁신할 수\n있는 기회가 된다. 또한 AT-ONE은 일련의 워크숍 주제로 사용될 수 있으며 각\n워크숍에서는 다음과 같은 점들에 초점을 맞출 수 있다.\n\n\n\n\n  A 새롭게 혁신적인 서비스를 구성하게 될 서비스 행위자들의 새로운 조합을 구상해본다.\n\n  T 서비스를 혁신하기 위해 현재의 서비스 터치포인트들이 새롭게 재구성되거나 기존에 없던\n      터치포인트들이 추가될 필요는 없는지 탐색한다.\n\n  O 해당 서비스 제공 기업의 브랜드 전략과 잘 맞춰진 새로운 서비스 제공물들을 구상하고 개발한다.\n\n  N 고객의 필요를 이해하고 어떻게 새로운 서비스가 해당 필요를 만족시킬 수 있을지 탐색한다.\n\n  E 고객의 새로운 서비스 경험에 대해 구상한다.\n\n\n\n\n                                         서비스·경험디자인 이론서     93\n\f                      2.2.2 Human-Centered Design(HCD) Toolkit\n\n                      1991년 미국에서 설립된 세계적인 디자인 컨설팅 회사인 IDEO에서는 인간\n                      중심 디자인(Human-Centered Design)을 디자인 현장에 쉽게 활용해\n                      당면한 문제를 창의적으로 해결할 수 있는 툴킷을 내놓았다. HCD는 사회\n                      구성원들의 요구, 필요, 행동을 이해하고, 이를 효과적이고 적절하게 해결할\n                      수 있는 솔루션을 기술적이고 조직적으로 실현할 수 있는지를 디자인하고\n                      개발할 수 있도록 돕 는 데 목 적을 둔다. 특히 일회적 솔루션이 아닌 지속\n                      가능한 솔루션 도출을 지향한다. 이러한 HCD 툴킷의 세 가지 핵심 원리는\n                      적합성(desirability), 실현가능성(feasibility), 지속성(viability)이다. 특히 이\n                      툴킷은 개발도상국의 사람들의 삶을 디자인적으로 개선하는 데 도움을 주는\n                      도구로 알려져 있기도 하다.\n\n                      HCD 툴킷은 구체적인 프로세스나 방법론 이전에 다음과 같은 마인드셋을\n                      강조하는데, 실패를 두려워하지 않고 실패를 통해 배우는 것, 모호한 상태를\n                      받아들이는 것, 일단 만들어 보는 것, 창의적 자신감을 갖는 것, 공감하는 것,\n                      낙관하는 것, 반복하는 것이다. 이러한 마인드셋을 기반으로 한 HCD 툴킷은\n                      크게 듣기(Hear), 창작하기(Create), 전달하기(Deliver)의 3가지의 핵심 단계로\n                      구성되어 있다.\n\n\n\n\n                      [ HCD 툴킷. Photo © IDEO ]\n\n\n\n\n                      듣기(Listening) : 이 단계에서 디자인 팀은 사람들로부터 그들의 생각, 의견,\n                      필요, 경험, 바람 등 다양한 목소리를 얻고 이러한 자료들을 통해 디자인에\n                      도움을 줄 수 있는 영감이나 통찰을 얻게 된다. 그리고 이 과정에서 다양한 인간\n                      중심 디자인 방법론이 사용된다.\n\n\n\n\n94   Part 2. 서비스·경험디자인은 무엇인가?\n\f창작하기(Create) : 앞선 듣기 단계에서 수집된 자료들을 가지고 워크숍 등\n공동으로 디자인하는 기회들을 통해 조사 대상인 사람들의 이야기를 공유하고\n서로 공감한다. 자료들을 정보화하고 이를 다시 구조화된 지식이나 패턴 등으로\n전환하고 이를 통해 솔루션을 위한 기회 영역 등을 포착하게 된다. 이어 새로운\n솔루션을 브레인스토밍하면서 아이디어를 구체화한다.\n\n\n전달 하기(Deliver) : 이 단계에서는 아이디어들 을 실행 가 능한 구체적인\n솔루션으로 변환시키게 된다. 그리고 이 솔루션의 성과를 측정하기 위한 계획을\n수립하고 반복적으로 솔루션을 개선할 수 있도록 한다. 이를 위해 지속 가능한\n수익 모델을 개발하고 해당 솔루션을 실행하는 데 필요한 역량을 평가하며,\n솔루션에 대한 구체적인 실행 계획 등을 수립하게 된다.\n\n\n\n2.2.3 Collective Action Toolkit\n\n1969년에 독일에서 설립된 세계적인 디자인 컨설팅 회사인 Frog Design은\n사 람들이 스 스 로 사회와 커뮤니티의 문제 들 을 해결할 수 있는 솔루 션을\n공 동 으 로 조 직 화 하고 개발 할 수 있 도 록 돕 는 행 위 와 방 법 으 로 구 성된\nCollective Action Toolkit을 개발하였다. 이 툴킷은 행동 지도(Action map)와\n6영역의 행위들로 구성되어 있다. 행동 지도는 경로에 집중하게 해주며 행동하고\n숙고하는 데 드는 시간의 균형을 잡을 수 있게 도와준다.\n\n\n\n\n[ Collective Action Toolkit. Photo © Frog design ]\n\n\n\n\n                                                     서비스·경험디자인 이론서   95\n\f                      이 툴 킷의 6 가지의 행 위 들 은 명확 히 하기(Cl ar if y), 조 직하기(Build),\n                      찾기(Seek), 상상 하기(Imagine), 만들기(Make), 계획하기(Plan)이며,\n                      커뮤니티와 조직에서 변화를 일으킬 수 있는 솔루션을 개발하기 위한 서로 다른\n                      방법들을 제공한다.\n\n                      목표에 따라 정해진 순서 없이 각 행동들을 따를 수 있으며, 이러한 행동들을\n                      하면서 목표를 더 잘 이해할 뿐만 아니라 그 목표를 어떻게 달성할 수 있는지도\n                      알게 된다. 그리고 시간의 흐름에 따라 각자 처음 세웠던 목표 또한 바뀔 수\n                      있는데, 즉 처음에는 어떤 목표에 합의하여 시작했더라도 계속해서 행동 지도의\n                      중심으로 다시 돌아오게 될 것이다.\n\n                      명확히 하기(Clarify) : 무엇을 해결하고 성취하고자 하는지에 대한 목표를\n                      명확히 하는 것은 팀의 성공에 매우 중요하다. 특히 이러한 목표가 변화해가는\n                      과정을 시각화함으로써 팀의 이해와 공유를 도울 수 있다.\n\n                      조직하기(Build) : 커뮤니티 안에서 사람들을 모으고 그들에 대해 파악하면서\n                      팀 내의 사람들이 서로를 이해할 수 있는 기회를 마련한다. 팀 내 사람들이 어떤\n                      기술들을 지니고 있으며 팀에 필요한 기술이 무엇인지 살펴볼 수 있다.\n\n                      찾기(Seek) : 사람들의 삶과 경험을 조사하고 니즈를 파악한다. 인터뷰나\n                      관찰 등을 통해 사람들이 커뮤니티 안에서 경험하는 문제들을 이해하고 진짜\n                      필요를 찾아낸다. 때로는 사람들이 해당 문제들에 대한 통찰을 가지고 있을\n                      수도 있으므로 그들과 소통한다. 이러한 과정에서 사람들의 경험이나 문제 속의\n                      공통된 패턴 등을 발견해낸다.\n\n                      상상 하기(Image) : 해결하고 싶은 문제에 대한 다 양한 해결책을 만드는\n                      과 정에서 가 장 실현가 능한 안을 결정하도록 도 와 준다. 우 선 최대한 많은\n                      아이디어를 낸 후 서로 다른 아이디어들을 조합하여 새로운 아이디어를 내볼\n                      수도 있다. 또한 아이디어들의 강점들을 결합하여 더 나은 아이디어들을 만들\n                      수도 있다.\n\n\n\n\n96   Part 2. 서비스·경험디자인은 무엇인가?\n\f만 들기(Make) : 이 행위 영역에 서는 아 이디어들 을 스 토리텔링 하 는 등\n흥미로운 방법으로 테스트하며 피드백을 받는다. 캐릭터, 장면, 대화 등을 통해\n아이디어들을 이야기로 만들어 관중에게 이야기할 수 있고, 이야기를 만화와\n같은 시각화 기법을 통해 전달할 수도 있다. 새로운 콘셉트를 실제 사례로\n연결해 보는 것도 좋은 방법이다. 그리고 아이디어들을 다양한 재료를 활용하여\n프로토타입으로 만들어 볼 수도 있다.\n\n계획하기(Plan) : 이 행위 영역에서는 실행 계획을 세우게 된다. 가장 우선적인\n문제들을 발견하고 목표를 세운 후 그 목표를 달성할 수 있는 구체적인 태스크를\n수립하고 팀의 스케줄을 짜며 팀 안에서 팀원들이 구체적으로 무엇을 할지를\n정하게 된다. 이때 팀원들이 각자 무엇을 해야하 는지를 파악할 수 있도록\n가시적으로 나타내는 것이 중요하다. 실행 과정 중, 팀이 초기에 정했던 목표를\n언제 어느 정도 달성했는지 공유할 필요가 있다. 이러한 과정에서 필요에 따라\n목표를 수정하게 될 수도 있다.\n\n\n\n\n                               서비스·경험디자인 이론서   97\n\f                      2.2.4 국민디자인단 Toolkit\n\n                      국민디 자 인단 툴 킷은 공 공서비스디 자 인에 참 여하 는 이들 에 게 제 공되 는\n                      서비스디자 인 참고 자료이며, 서비스디자 인팀에서 이해하기 > 발견하기 >\n                      정의하기 > 발전하기 > 전달하기의 각 단계마다 서비스디자인팀에서 목표,\n                      주요 활동, 구성원별 역할, 주의사항뿐만 아니라 활용 가능한 주요 방법론들을\n                      구체적인 실행 방법과 함께 소개하고 있다. 국민디자인과제에서 진행되었던\n                      대표사례들을 선정하여 실제 운영일정, 단계별 추진사항 및 디자인단 구성현황\n                      등을 볼 수 있도록 하였으며, 세부 단계별로 실제 진행되었던 여러가지 과제를\n                      예 시 로 제 시하 여 서비스디 자 인과 정 을 쉽 게 이해 하고 적 용할 수 있 도록\n                      제작되었다.\n\n\n                      이해하기 : 이해하기란 대상 서비스의 내외부 환경에 대한 전반적인 조사와\n                      전체적인 이해를 통해서 조사 목표와 계획을 수립하는 단계이다. 이 단계에서는\n                      넓은 주제 범위 안에서 어떤 문제에 집중할 것인지에 대한 조사 목표를 설정하게\n                      된다. 이 단계에서는 팀이 처음으로 모여 앞으로 진행할 활동 내용에 대한\n                      안내를 받고 프로젝트 진행을 위한 방향을 설정하는 공공서비스디자인팀 OT를\n                      진행한다. 그리고 서비스에 대한 전반적인 이해를 위해 자료나 문헌 등을 통한\n                      데스크리서치를 진행한다. 또한 데스크리서치 결과를 바탕으로 조사의 목표를\n                      수립하게 된다.\n\n\n                      발견하기 : 발견하기는 조 사 를 통해서 대상 서비스 와 관계된 문제점들 을\n                      알아내고, 고객의 경험, 필요, 희망사항, 요구 사항 등을 발견하는 단계이다.\n                      이 단계에서는 여러가지 조사 방법론을 통해 서비스와 직/간접적으로 연관된\n                      경험이나 및 환경을 조사하게 된다. 우선 탐색을 준비하기 위해 탐색 방법을\n                      결정하고 상세한 탐색 계획표를 작성한 다. 그리고 현장조 사, 경험 관찰,\n                      심층인터뷰 등을 통해 발견하기를 실행한다. 발견하기를 마친 후에는 조사를\n                      통해 찾 아낸 현상들 을 아이디어를 얻기 위한 자료 와 정보 로 바 꾸기 위해\n                      러닝카드를 작성하며 팀원들과 발견점을 공유한다.\n\n\n\n\n98   Part 2. 서비스·경험디자인은 무엇인가?\n\f                                  정의하기 : 정의하기는 앞 단계들을 거쳐 얻어진 자료들로부터 주요 이슈를\n                                  도출하고, 이를 통해 서비스의 전략적인 방향성을 수립하는 단계이다. 조사된\n                                  데이터를 파 악 하고 데이터가 함축하고 있는 의미를 이해하 여 아이디어로\n                                  발전시킬 수 있는 이슈들 을 도출하고, 이를 바탕으 로 서비스의 전략적인\n                                  방향성을 설정하게 된다. 이를 위해 새로 만들어질 서비스를 사용할 가상의\n                                  인물인 페르소나를 개발하고, 서비스 경험을 시간의 흐름 순으로 시각화하는\n                                  고객 여정 지도를 만들며, 이러한 과정을 통해 서비스 핵심 이슈와 서비스\n                                  목표를 도출한다. 수행 후 러닝카드를 통해 배우고 발견한 점들에 대해 팀원들과\n                                  공유한다.\n\n\n                                  발전하기 : 발전하기는 서비스 목표를 지원하는 다양한 문제 해결안을 구상하고\n                                  서비스 콘셉트를 개발하는 단계이다. 우선 브레인스토밍을 통해 얻어진 많은\n                                  아이디어들을 확장한다. 그리고 핵심 콘셉트를 중심으로 시각화하고, 이야기\n                                  형식의 콘셉트 시나리오를 만들 수 있다. 그 후 전체적인 서비스의 흐름을\n                                  바탕으로 한 개념도를 만들게 된다.\n\n\n102                               전달하기 : 전달하기는 서비스 콘셉트를 가장 효과적으 로 전달할 수 있는\nClatworthy, Simon(2016), 《How\nTo Design Better Services: The    방식으로 결과물을 발표하고 전달하는 단계이다. 최종 서비스디자인 결과물을\nAT-ONE book》, Oslo School of\nArchitecture and Design\n                                  소 개하 여, 이해 관계 자 들의 공 감, 협 조 , 의 견 을 이 끌 어내 고 최 종 적 으 로\nRobert A Curedale(2013),          서비스가 적용 및 실행되도록 하는 과정이다. 이를 위해 서비스 스토리보드와\n《Service design 250 essential\nmethods》, Topanga, Calif.:        같은 형식으로 서비스 콘셉트와 내용을 전달할 수도 있으며, 시뮬레이션을\nDesign Community College\nMeroni, Anna, & Sangiorgi,\n                                  위한 서비스 프로토타입을 제작할 수도 있다. 뿐만 아니라 서비스 청사진을\nDaniela(2011), 《Design for\n                                  제작하기도 한다.102\nservices》, Aldershot, UK: Gower\nStickdorn, Marc, & Schneider,\nJakob(2010), 《This is service\ndesign thinking》, Amsterdam:\nBIS\n\n\n\n\n rtunity Identification), 기회\n분석(Opportunity Analysis), 아이디어 생성(Idea Generation), 아이디어\n선택(Idea Selection), 개념 정의(Concept Definition)를 중심으로 활동이\n이루어지며, 반복적·탐색적 접근을 통해 “가치가 없는 아이디어”는 빠르게\n버리고, “가 능성 있는 아이디어”에 집중하게 된다. 서비스디자인에서 초기\n단계를 잘 활용하면 초기 불확실성을 관리하고 혁신 아이디어를 구조화하는\n데 도움이 되며, 이를 바탕으로 사용자 만족도를 높일 수 있는 창의적 해법을\n조기에 탐색하고 검증할 수 있다. 이 단계에서는 정해진 순서 없이 필요에 따라\n아이디어 발굴, 리서치, 콘셉트 수정을 오가는 방식으로 진행하며, 한 번 실행\n후 끝내기보다 짧은 주기로 반복 실행하며 숨겨진 니즈를 발견하고 해결해가는\n것이 중요하다.\n\n\n\n\n                                                      서비스·경험디자인 이론서 101\n\f         학제적 구분에 따른 서비스디자인의 의미\n\n\n\n더 알아보기\n                              서비스디자인은 다학문적이고 통합적인 특 성을 가진 분야로, 여러 학문과\n                              다양한 산업영역이 융합된 형태로 발전해왔다. 학제별 서비스디자인에 대한\n                              역할과 주요 도구들은 다음과 같다.\n\n\n\n\n                              1. 디자인(Design) 분야\n\n                              서비스디자 인은 디자 인 자체의 전통 적 접근 방식과 도구 에 서 출발 하 며,\n                              사 용자 경험과 상호작용 을 중 심으 로 발전하였다. 제품이나 공 간, 시스템\n                              등의 ‘유형’ 중심으로만 디자인하던 기존 관점에서 벗어나, 고객(사용자)에게\n                              제공되는 모든 서비스 과정 전반을 통합적으로 기획·설계하는 접근 방법으로\n                              서비스가 제공되는 모든 단계와 접점에서 사 용자가 경험하 는 행동, 감정,\n                              니즈(Needs), 기대치 등을 면밀히 분석하고, 이를 바탕으로 구조(Processes),\n                              행동(Interactions), 감정(Emotions)을 유기적으로 연결하는 유의미한 사용자\n                              경험을 만들기 위한 디자인 활동을 말한다.\n\n\n                                • 서비스사파리(Service Safari)\n\n                                • 사용자 여정 맵(Customer Journey Map)\n\n                                • 페르소나(Persona)\n\n                                • 서비스프로토타이핑(Service Prototyping)\n\n                                • 공동디자인 워크숍(Co-design Workshop)\n\n\n\n\n                              2. 경영(Management) 및 비즈니스 분야\n\n                              경영·비즈니스 분야에서의 서비스디자인(Service Design)은, 단순히 서비스를\n                              멋지게 꾸미는 활동이 아니라, 고객(사용자)에게 가치를 제공하는 전 과정을\n                              전략적 으로 설계·운영하여 비즈니스 성과를 극대화하는 접근 방법이다. 고객이\n                              서비스를 경험하는 모든 접점을 유기적으로 연결·설계하고, 새로운 시장 기회를\n                              발굴하거나 경쟁 우위를 확보하고, 차별화된 고객 경험을 제공하는 것을 통해\n                              지속 가능한 경영과 비즈니스 목표를 달성하는 것에 초점을 둔다. 또한, 마케팅,\n                              인사, 재무, IT 등 여러 부서 간 협업을 통해 내부 역량을 강화하고 시스템을\n                              정비함으 로써, 기업 내부의 지원 프 로 세스(Back-office)와 조직 문화 를\n                              개선하고 일관성 있는 서비스를 제공한다.\n\n\n\n\n         102 Part 2. 서비스·경험디자인은 무엇인가?\n\f  • 가치 제안 캔버스(Value Proposition Canvas)\n\n  • 비즈니스 모델 캔버스(Business Model Canvas)\n\n  • 서비스블루프린트(Service Blueprint)\n\n  • 프로세스 다이어그램(Process Diagram)\n\n\n\n\n3. 사회학(Sociology) 및 심리학(Psychology) 분야\n\n사회학과 심리학 분야 에서 서비스디자 인은 사 용자가 사회적·심리적 맥락\n속에서 어떻게 상호작용 하고 경험을 형성하는지에 주목한다. 인간 중심의\n서비스 기획과 설계를 통 해 사회 적 구 조 와 문화, 개인의 심리적·정 서적\n메커니즘 을 종합적으 로 이해하고, 이를 서비스 전 과 정에 반 영함으 로 써\n사 용자 에게 지속 적으 로 의미 있고 만족 스러운 경험을 제 공한 다. 이처럼\n서비스디자인은 기능적 접근을 넘어, 사람들이 속한 사회적 구조(관계, 문화,\n제도 등)와 개인의 심리적 동기(욕구, 감정, 인지 등)을 종합적으로 이해하여\n사회적 가치를 창출하고 행동 변화 를 유도하 는 역할을 한다. 또한, 다양한\n배경(문화, 언어, 능력, 소득 등)을 가진 사람들이 서비스를 평등하게 이용할\n수 있도록 하는 ‘유니버설 디자인’이나 ‘인클루시브 디자인’과 같은 개념과\n결합하여, 취약계층이나 소외된 집단도 배려하 는 설계가 강조되기도 한다.\n심리학 관점에서의 서비스디자인은 사람들의 문제 인식, 욕구 충족, 보상 심리\n등을 이해하고 매슬로우의 욕구 5단계, Fogg의 행동모델 등의 심리학 이론을\n적용하며, 이를 통해 사용자가 느끼는 감정과 인지 과정을 고려해 사용자\n감정에 기반한 경험을 설계한다. 게이미피케이션(Gamification) 기법, 인증\n배지(badge), 점수·리워드 제공 등은 사용자의 동기를 자 극하고 몰입도를\n부여하고 몰입도를 높이는 데 유용하며, 습관 형성(Habit Formation)과 보상\n체계(Reward System), 사회적 규범(Social Norm) 등의 개념은 사용자\n서비스를 지속적으로 이용하도록 행동변화(Behavior Change)를 유도한다.\n또한, UI/UX 구조 간소화, 단계별 안내, 직관적 피드백 등을 활용하여 사용자가\n정보를 처리하고 의사결정을 내리는 과정에서 느끼게 되는 인지부하(Cognitive\nLoad)를 관리한다.\n\n\n  • 공감 지도(Empathy Map)\n\n  • 이해관계자 맵(Stakeholder Map)\n\n  • 시나리오 플래닝(Scenario Planning)\n\n  • 에스노그라피(Ethnography)\n\n  • 서비스 생태계 지도(Service Ecosystem Map)\n\n\n\n\n                                          서비스·경험디자인 이론서 103\n\f                     4. 첨단 디지털 기술 분야\n\n                     4차 산업혁명 시대의 서비스디자인은 기존의 사용자 이해, 협업, 총체적 시각의\n                     핵심 원칙을 유지하면서도, 빅 데이터와 분석 기술을 활용한다. 사용자의 행동\n                     패턴과 선호도를 실시간으로 파악하고 예측하여 맞춤형 서비스를 설계하고,\n                     이를 인공지능(AI), 머신러닝(ML), 챗봇, RPA(Robotic Process Automation)\n                     등을 접목해 사람이 처리하던 반복 업무를 자동화하거나, 사용자와 자연스럽게\n                     상 호작용할 수 있도록 서비스 를 설계한 다. 또한, 사 물 인터넷(IoT ) 등의\n                     기술 을 활용하 여 사 람 이 머무 는 물리적 공 간과 디지털 환경을 긴밀하게\n                     연결하여 지속적이고 유연한 사용자 경험을 만드는 역할을 하고 있다. 기존의\n                     서비스디자인이 정성적인 분석을 바탕으로 수행되었다면, 첨단기술 분야의\n                     서비스디자인은 정량적으로 측정된 수치와 과학적인 분석을 바탕으로 사용자\n                     경험을 개선하는 것이 특징이다. 첨단기술이 핵심이지만, 여전히 인간의 감정,\n                     동기, 맥락에 대한 깊은 이해가 필수이며, 기존의 서비스디자인과 마찬가지로\n                     다양한 이해관계자(디자이너, 엔지니어, 데이터 사이언티스트, 마케터 등)가\n                     협업하여 사용성, 편의성, 심리적 만족도를 확대하기 위해 반복적인 프로토타이핑\n                     및 테스트를 실행하여 사용자 중심의 협업적 프로세스를 추구한다는 특징이\n                     있다.\n\n\n                       • 서비스 시뮬레이션(Service Simulation)\n\n                       • AI 기반 사용자 페르소나 분석\n\n                       • 생성형 AI 기반 브레인스토밍\n\n                       • 시스템 다이어그램(System Diagram)\n\n                       • 모바일 에스노그래피\n\n                       • Miro, Mural, FigJam 등의 온라인 협업툴을 이용한 공동창작(Co-creation)\n\n                       • AR/VR, 메타버스등을 이용한 서비스시나리오\n\n                       • kubeflow, MLflow 등으로 서비스모니터링\n\n\n\n\n                     5. 경제학(Economics) 및 정책학(Policy Studies) 분야\n\n                     경제학과 정책학 분야에서 서비스디자인은 자원 배분(Resource Allocation)과\n                     공 공 가치(Public Value)의 확장과 최적화 를 목표 로 서비스 제공 주체\n                     (정부·기업·비영리단체 등)와 이해관계자(시민·소비자 등) 간의 상호작용 과정을\n                     효율적이며 공정하게 설계·운영하는 총체적 접근 방식이다. 공공 가치와 정책\n                     목적을 달성하기 위해, 시민 참여, 협력적 거버넌스, 정책 집행 피드백 등 거시적\n                     관점에서 서비스 구조를 설계·운영하 는 것이 특 징이다. 전통 적인 ‘사 용자\n                     경험(UX) 중심 디자인’을 넘어, 경제적 요인, 정책 목표, 사회적 가치까지\n\n\n\n104 Part 2. 서비스·경험디자인은 무엇인가?\n\f고려하여 서비스 구조와 프로세스를 체계적으로 설계함으로써, 사회 전체적\n편익(Social Welfare)과 정책 효율성(Policy Effectiveness)을 높이고,\n서비스를 지속가능하게 하는 것을 목표로 하는 활동이다.\n\n\n • 정책 디자인 툴킷(Policy Design Toolkit)\n\n • 공공가치평가모델\n\n • 파일럿프로젝트\n\n • 시민설문조사\n\n • 시민들과의 공동창작 워크숍(Co-creation Workshop)\n\n\n\n\n                                      서비스·경험디자인 이론서 105\n\f         AI 환경에서의 서비스디자인\n\n\n\n더 알아보기\n                              일상에서 AI를 이용한 서비스를 접하는 것은 더 이상 낯선 일이 아니다. 그만큼\n                              AI 기술을 활용한 서비스디자인은 다양한 산업과 분야에서 빠르게 확산되고\n                              있다. 예측, 개인화, 자동화 등 강력한 기능을 갖춘 인공지능 기술을 사용자에게\n                              의미 있고, 윤리적이며, 신뢰 가능한 형태의 서비스를 구현하여, 사용자 경험을\n                              향상시키고 기술과 인간 중심 설계의 조화를 이루게 하는 것이 AI환경에서\n                              서비스디자인의 특징이다. AI 분야는 데이터 사이언스, 엔지니어링, 윤리/법률,\n                              디자인 등 다양한 분야의 전문성을 요구하며, 이때 서비스디자이너는 다양한\n                              이해관계자와 팀을 연결하고, 사용자 경험이라는 공통 목적 아래 프로세스를\n                              통합·조율하는 역할을 한다.\n\n                              AI를 통해 이전에는 불가능했던 수준의 개인 맞춤형 서비스나 예측적 문제\n                              해결이 가능해짐에 따라, 데이터가 풍부하고 사용자 접점이 많은 영역이나 안전,\n                              헬스케어 분야처럼 복잡한 의사결정이 필요한 분야, 개인화된 경험이 중요한\n                              서비스일수록 AI 기반 서비스디자인이 활발하게 이루어지고 있다.\n\n                              AI 환경에서 서비스디자인을 진행할 때는 사용자가 해당 서비스를 안심하고\n                              사용할 수 있도록 다음과 같은 사항을 고려해야 한다.\n\n\n\n                              ➀ 데이터 프라이버시 및 보안\n\n                                • 보안 체계, 익명화·암호화 등의 설계를 서비스 차원에서 세심하게 관리함.\n\n                              ➁ AI 편향(Bias) 문제\n\n                                • \u0007모델 구축 과정에서 윤리 가이드를 마련하고, 다양한 사용자 집단의 참여를\n                                 통한 공정성을 확보하도록 설계해야 함.\n\n                              ➂ 책임 소재(Accountability)\n\n                                • \u0007자 동화 된 의 사 결정(예: 보험 청 구 심 사, 추 천 채 용 등) 에 서 오판 이\n                                 발생하면, 누구에게 책임이 있는지 명확하지 않을 수 있음.\n                                • \u0007서 비 스 설 계 시 사 람 이 검 토하 고 이의 제 기 메 커니 즘 을 마 련 하 여\n                                 책임소재를 투명하게 하는 구조가 필요함.\n\n\n                              그렇다면, ‘AI의 디자인’과 ‘AI를 활용한 디자인’에는 어떤 차이가 있을까?\n\n\n\n\n         106 Part 2. 서비스·경험디자인은 무엇인가?\n\f                    ‘AI의 디자인(Design → AI)’과 ‘AI를 활용한 디자인(AI → Design)’은 언뜻\n                    유사해 보이지만 목표, 접근 방식, 핵심 과 정에서 차이가 있다. 간단 하게\n                    정리하면, ‘AI의 디자인’은 인공지능이 사람과 어떻게 상호작용해야 하는지를\n                    디자인하는 것으로 ‘어떻게 AI를 사람 중심으로 만들고 개선할 것인가’에 초점을\n                    두며, ‘AI를 활용한 디자인’은 ‘디자인 활동에 생성형 AI, 머신러닝, 데이터 분석\n                    등을 활용하여 반복작업을 자동화하고, 새로운 아이디어를 빠르게 시각화하며,\n                    디 자 이너의 창 의 성 을 확 장 하 여 빠르 게 혁 신 을 이루 는 것’에 초 점 을 둔\n                    접근이라는 차이점이 있다. 두 접근 모두 사용자 중심과 AI 기술의 접점을 찾아,\n                    사람이 더 편리하고 가치 있게 느낄 수 있는 여정을 설계해야 하며, 개인정보\n                    보호와 편향 등의 사회적 책임 문제를 균형 있게 다루는 것이 중요하다.\n\n\n\n  구분               AI의 디자인(Design → AI)                  AI를 활용한 디자인(AI → Design)\n\n          AI(인공지능) 자체를 디자인의 대상으로 보며, 사람에게         디자인 과정에서의 AI 기술(예: 생성형 AI, 머신러닝 등)을\n 핵심 개념\n          유익하고 의미 있는 AI 시스템을 구현하는 것               활용해 디자인 결과물을 만들거나 개선하는 것\n\n          AI 시스템(알고리즘, 모델, 인터페이스 등)을 인간\n                                                  AI 도구와 기능을 활용해 디자인 업무의 효율적,\n  목표      중심으로 설계하여, 사용자에게 신뢰감, 사용 편의성,\n                                                  창의적, 정확성을 향상\n          가치를 제공\n\n          AI가 사람과 어떻게 상호작용해야 하는지 고민하고, AI         AI 기반 툴(생성형 AI, 추천 알고리즘 등)을 사용하여\n 접근 방식\n          모델의 투명성, 설명 가능성, 윤리성 등을 고려해 설계          아이디어 발상, 시각적 결과물 생성, 자동화 등을 구현\n\n                                                  • 생성형 AI 디자인: 예술·그래픽·UI 시안 자동 생성\n          • \u0007AI UX/UI: 챗봇, 음성 비서, 예측 모델 인터페이스 등\n                                                  • \u0007머신러닝 보조 설계: 데이터 분석 결과를 바탕으로\n          • \u0007설명 가능 AI(XAI): 모델의 의사결정 과정을\n 주요 영역                                               레이아웃, 컬러, 기능 제안\n             직관적으로 보여주는 디자인\n                                                  • \u0007프 로세스의 자동화: 반복 작업(리사이즈, 포맷 변경\n          • \u0007AI 윤리와 법적 고려: 편향성, 책임성, 개인정보 보호 등\n                                                     등)을 자동화하여 생산성 향상\n\n          • \u0007AI가 사람을 어떻게 도울 것인가를 고민하며, 사람-        • \u0007AI로부터 도움을 받아 디자이너 혹은 팀이 아이디어를\n디자인 과정의     기계 상호작용(HCI) 방식을 설계                      발전·수정\n  특징      • \u0007AI 모델에 대한 피드백 루프(Feedback Loop)를     • \u0007AI 결과물의 적절성 평가 및 후처리(후속 편집, 보정\n            체계화해 지속적으로 개선                            등) 과정이 중요\n\n                                                  • \u0007Midjourney, DALL·E 등의 생성형 AI를 이용해\n          • \u0007음 성 인식 비서(Siri, Alexa 등)의 대화 구조 및\n                                                     디자인 시안, 콘셉트 아트 생성\n             UI/UX 설계\n                                                  • \u0007챗GPT나 AI 카피라이팅 도구를 활용한\n  예시      • 자율주행차의 경고·표시 시스템 설계\n                                                     문구·카피·스토리보드 작성\n          • \u0007은행의 AI 상담봇 디자인 시, 투명성·신뢰도·개인정보\n                                                  • \u0007분 석 툴(AI/ML)로 고객 취향 데이터를 분석해\n             이슈 고려\n                                                     개인화된 시각 디자인 제안\n\n\n\n\n                                                                   서비스·경험디자인 이론서 107\n\f         시스템사고와 시스템적 디자인\n\n\n\n더 알아보기\n                              시스템사고(Systems Thinking 또는 Thinking in Systems)는 ‘부분’을\n                              넘어 ‘전체 시스템’의 관점에서 문제를 이해·분석·설계하려는 접근 방식으로\n                              경영학, 공학, 사회과학 등에서 발전된 개념이며, 복잡한 문제를 다루는 디자인\n                              분야에서도 그 중요성이 점차 커지고 있다. 복잡한 시스템 내의 각 요소 간\n                              상호작용(Interactions)과 피드백 루프(Feedback Loops), 비선형적 관계,\n                              시간 지연(Delay) 등을 고려함으로써 단편적 해결이 아닌 지속 가능한 총체적\n                              해결을 추구하며, 복잡하고 다층적인 문제를 해결하는 이론적·실천적 기반의\n                              사고이다. 최근에는 AI와 빅데이터 기술이 복잡한 시스템을 다루는 도구로\n                              주목받고 있으며, 기후 위기, 자원 순환, 사회적 형평성 등 초국가적·복합 위기에\n                              대응하기 위해 생태계 전체를 고려하는 디자인(예: 순환경제, 에코디자인)이\n                              중요해지고 있다. 이러한 변화 속에서 기업 내 조직을 혁신하기 위해서는 조직\n                              운영 시스템을 전반적으로 살펴보는 디자인이 중요해지며, 시스템사고가 중요한\n                              역량으로 제시되고 있다.\n\n\n                              복합적이고 다층적 이해관계가 얽힌 디자인 문제(예: 도시 계획, 환경, 사회·공공\n                              서비스 등)에 시스템사고를 도입하면 사용자, 조직, 환경, 기술이 얽힌 거대한\n                              생태계를 인지할 수 있다. 이를 바탕으로 단기 해결이나 임시방편적인(short-\n                              term fix) 해결이 아닌, 거시적 관점에서 전체 최적화 를 추구하고, 장기적\n                              관점에서 시스템 전반의 개선과 사회적 가치 창출을 목표로 한다.\n\n\n                              그렇다면, 시스템 이론에 기반한 디자인 분야는 어떻게 발전해 왔을까?\n\n\n\n\n         108 Part 2. 서비스·경험디자인은 무엇인가?\n\f 시기               대표이론                         특징                          주요활동\n\n        제너럴 시스템 이론(General\n                                      생물학·수학·공학 분야에서 ‘시스템’을\n        Systems Theory) - Ludwig                               시스템사고의 기본 원리 정립\n                                      통합적으로 연구하려는 시도가 본격화\n        von Bertalanffy\n\n1950-\n                                                               초기 정보 디자인(Information\n        사이버네틱스(Cybernetics) -         ‘제어’와 ‘커뮤니케이션’을 중심으로     Design), HCI(Human-Computer\n        Norbert Wiener                피드백 루프와 자동제어 이론 발달       Interaction) 등에서 사이버네틱스\n                                                               개념이 접목되기 시작함\n\n        디자인 Methods 운동\n                                      문제 해결 과정을 체계화하기 위해\n1960-   (Design Methods                                        디자인 프로세스의 과학화(Science of\n                                      다양한 방법론(체크리스트, 매트릭스,\n 1970   Movement) - Christopher                                Design)가 시도됨\n                                      다이어그램)을 제안\n        Alexander, Bruce Archer 등\n\n\n        Wicked Problems 개념            도시계획, 공공정책 등 복잡한 사회      디자이너가 체계적인 사고와 다학제적\n1973    - Horst Rittel & Melvin       문제는 기존의 단순·선형적 해결        관점을 통해 문제들을 다뤄야 한다는\n        Webber (1973)                                            Processes\n\n\n\n                                                               2.0\n                                                           Products &\n                                                       Services, Platforms\n\n\n                                                            DESIGN\n                                                              1.0\n                                                            Identity &\n                                                            Artefacts\n\n\n                          [ Boundaries of the four Design Domains (Peter Jones & Kristel Val Ael(2022) ]\n\n\n\n                       피터 존스(Peter Jones)는 시스템적 디자인을 설명하는 과정에서 디자인의\n                       도메인 영역을 4가지로 구분하였다. 첫 번째, “디자인 1.0 - 정체성(Identity)\n                       & 산출물(Artifacts)”에서는 기업이나 조직의 브랜드 정체성을 구축하고,\n                       그래픽 디자인, 로고, 포장 등 구체적인 시각적 산출물을 개발하는 데 초점을\n                       둔다. 디자인의 주요 역할은 시각적 요소를 통해 조직의 아이덴티티를 명확하게\n                       전달하는 것이다. 두 번째, “디자인 2.0 - 제품(Products) & 서비스(Services),\n                       플랫폼(Platforms)”에서는 물리적 제품과 디지털 서비스를 포함한 다양한\n                       제품 및 서비스의 설계에 중점을 둔다. 이때 디자인은 사용자의 요구와 기대를\n                       충족할 수 있는 기능적이고 매력적인 솔루션을 제공하는 역할을 담당한다.\n                       세 번째, “디자인 3.0 - 조직(Organization) & 프로세스(Processes)”에서는\n                       조직 구조와 내부 프로세스의 설계를 담당한다. 효율적인 업무 흐름과 협업을\n                       촉진하기 위한 시스템을 구축하며, 디자인은 조직 문화와 운영 방식을 개선하는 데\n\n\n\n110   Part 2. 서비스·경험디자인은 무엇인가?\n\f[ A Gigamap with heavy emphasis on the relations. (Selvaldson et. Al. 2013) ]\n\n\n\n                               활용된다.​마지막으로, “디자인 4.0 - 시스템(Systems) & 정책(Policies)”은 가장\n                               복잡한 수준으로, 사회적 시스템, 공공정책, 환경 및 커뮤니티 설계 등 거시적인\n                               시스템의 설계에 초점을 둔다. 보건, 교육, 교통 등 광범위한 분야에서 시스템적\n                               변화를 이끌어내기 위해 디자인이 사용되며, 다양한 이해관계자와 협력하여\n                               복잡한 문제를 해결하고, 지속 가능한 변화를 추구한다.​ 오슬로 대학의(Oslo\n                               School of Architecture and Design)의 조시나 빈크(Josina Vink)는 전통적인\n                               서비스디자인의 한계를 극복하기 위해 시스템사고와 서비스디자인을 융합한\n                               개념으로써 시스템적 디자인을 제시하며, “시스템적 디자인이란, 복잡한 사회적\n                               시스템 내에서 인간의 경험뿐 아니라 이를 형성하는 구조와 패턴을 함께 이해하고\n                               변혁하는 접근으로, 디자인 실천과 시스템 사고를 통합하여 의미 있는 변화를\n                               공동창작하는 것이다.(Vink, 2021)”라고 설명하였다. 빈크의 시스템적 디자인\n                               접근법에서 강조되는 4가지 핵심 요소는 다음과 같다.\n\n\n                                  • 시스템사고(Systems Thinking)\n                                  • 경험적 관점(Experiential Perspective)\n                                  • 공동창작(Co-creation)\n                                  • 구조적 변혁(Structural Transformation)\n\n\n                               이러한 특징을 바탕으로 시스템적 디자인은 보건의료와 웰빙, 공공서비스와\n                               정책설계, 지속가능성과 기후·환경 등의 분야에서 활발히 활용되고 있다.\n\n\n\n                                                                                서비스·경험디자인 이론서 111\n\f         디자이너의 사고방식\n\n\n\n더 알아보기\n           시기          논리적 사고               시스템사고                디자인사고                디자이너적 사고\n\n                                                           사용자 중심의 창의적 문제\n                  문제나 상황을 합리적,         대상이나 문제를                                  ‘Designerly Ways of\n                                                           해결 접근법으로, 공감,\n                  규칙 기반으로 접근하여,        전체(Whole)로서                               Knowing’(Nigel Cross)\n                                                           문제 재정의, 아이디어 발산,\n           정의     선형적(원인→결과)           상호작용과 피드백 루프를                             등에서 유래한 개념으로\n                                                           프로토타이핑, 테스트의\n                  방식으로 결론을 도출하는        중시하며 비선형적으로                               디자이너 고유의 해결\n                                                           반복을 통해 혁신적인\n                  사고방식
