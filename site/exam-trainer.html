Te c h n o l o g y ) 1 7 5 , 존\n176\nhttps://humanebydesign.com/\n                               야블론스키(Jon Yablonski)의 휴매인바이디자인(Humane by Design)176,\n                               디자인에티컬리(Design Ethically)177, 에티컬디자인리소스(Ethical Design\n177\nhttps://www.designethically.   Resources)178 등 여러 기관은 책임있는 디자인과 윤리적 디자인에 주목하고,\ncom/\n                               이와 관련된 다양한 연구 자료들을 아카이빙하고 이를 알리는 위해 힘쓰고 있다.\n178\nhttps://www.                   다크패턴에 관한 논의는 초기 학술적 연구를 기반으로 발전되어 점차 제도적\nethicaldesignresources.com/\n                               규제 와 가 이드라 인 제 정 으 로 확장되고 있다. 다 수의 연구자 들과 국내외\n                               기관들은 다크패턴의 유형과 피해를 체계적으로 분석하고, 이를 토대로 실효성\n                               있는 규제와 지침을 마련하기 위해 노력하고 있다. 다크패턴 방지를 위한 법적\n                               규제의 도입은 온라인 서비스에서의 사용자 권리를 보호하고 책임 있는 디자인\n                               문화 를 정착시키는 데 기여할 것이다. 다크패턴 문제를 해결하기 위해서는\n                               학술적 연구와 제도적 접근이 결합된 지속적인 노력이 필요하다.\n\n\n\n\n                                                                                     서비스·경험디자인 이론서 207\n\f03\n정의하기·Define\n서비스디자인 대상을 분석하기 위해 사용하는 다양한 툴과 서비스디자인을 위한\n디자인 콘셉트 및 원칙의 연구를 소개한다.\n\n\n\n\n208 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                    3.1 서비스·경험디자인 대상분석\n\n                                    3.1.1 페르소나179\n\n정의                                  페르소나(Persona)는 어떤 제품 혹은 서비스를 사용할 만한 목표 인구 집단\n                                    안에 있는 다양한 사용자 유형들을 대표하는 가 상의 인물이다. 페르소나는\n                                    특정한 상황과 환경 속에서 어떤 전형적인 인물이 어떻게 행동할 것인지를\n                                    예측하기 위해 실제 사용자 자료를 바탕으로 개인의 개성을 부여하여 창출된\n                                    것이다. 따라서 페르소나는 공통의 니즈와 행동 패턴을 지닌 사용자 집단을\n                                    대표한다.\n\n\n역사                                  라틴어에서 유래한 페르소나는 연극의 가면을 의미한다. 즉 가면이 상징하는\n                                    연극 속 등장인물의 성격이 바로 페르소나이다. 디자인 분야에서는 사용자를\n                                    정의하기 위해 페르소나 기법을 사용하는데, 디자인에 처음으로 페르소나의\n                                    개념을 도입한 사람은 앨런 쿠퍼(Alan Cooper)이다. 앨런 쿠퍼 이전에도\n                                    인간공학적 관점에서 페르소나와 유사한 개념을 사용했던 디자이너는 있었지만,\n                                    현재 우리가 사용하는 페르소나의 개념은 앨런 쿠퍼에 의해 만들어졌다.\n\n179                                 앨런 쿠퍼는 프 로젝트 관리 프 로 그램을 개발하던 인터랙션 디자이너였다.\nJames Kallbach(2015), 《Mapping\nExperiences》, Oreilly &             컴퓨터 인터페이스가 지금처럼 발전하지 않았던 1980년대 엔지니어가 개발한\nAssociates Inc.\n                                    컴퓨터 프로그램은 사용이 매우 어렵고 복잡하였다. 이러한 문제점을 인지하고,\n김진우(2017), 《서비스 경험디자                가 상의 프로그램 사용자 를 상상하면서 프로그램을 개발하였다. ‘사용자는\n인》, 안그라픽스\n                                    어떠한 기능을 가장 자주 사용할까?’, ‘사용자는 무엇을 사용하면서 어려움을\nLewis Carbone, Stephen Haecke\nl(1994), <Engineering Customer\n                                    느낄까?’와 같은 질문을 통해 앨런 쿠퍼는 끊임없이 사용자를 상상하며 컴퓨터\nExperiences>, Marketing\n                                    프로그램을 개발하였다. 다수의 기업을 위한 컨설팅 업무를 하면서, 앨런 쿠퍼는\nManagement 3(3)\n                                    자신이 제안하는 디자인의 장점을 설득하기 위해 페르소나를 체계화하였다.\n마르크 스틱도른, 야코프 슈나이더\n(2012), 《서비스 디자인 교과서》, 안\n그라픽스\n\n\nValarie Zeithaml, Mary Bitner,\nDwayne Gremler(2013), 《서비스\n마케팅》, 청람\n\n\nMarc Stickdorn, Markus Hormess,\nAdam Lawrence, Jakob\nSchneider(2018), 《This is Service\nDesign Doing》, O'Reilly Media\n\n\n\n\n                                                                 서비스·경험디자인 이론서 209\n\f방법                  페르 소나는 어떻게 만들까? 사 용자 조 사 를 바탕으 로 다음과 같은 순서로\n                    페르소나를 창출한다.\n\n                    1. 행동 변수를 파악한다.\n                    행동 변수란 사용자 조사 참가자들 간 차이가 나타나는 행동 및 사고방식을\n                    의미한다. 행동 변수는 동기, 목적, 주요 작업, 사용 빈도, 사용 기간, 사용\n                    능력, 환경, 멘털 모델, 태도, 인구통계학적 항목 등이 해당되며, 일반적으로\n                    15~30개의 변수를 도출한다.\n\n                    2. 사용자 조사 참가자와 행동 변수의 관계도를 그린다.\n                    행동 변수별 사용자 조사 참가자의 위치를 표시한다.\n\n                    3. 중요한 행동 패턴을 검토한다.\n                    6~8개 정도의 행동 변수에서 함께 자주 등장하는 참가자를 그룹핑한다. 해당\n                    행동 변수는 주요 행동 패턴을 의미하며, 사용자 조사의 규모에 따라 차별적인\n                    행동 패턴을 보이는 그룹이 2~4개 정도 발견될 수 있다.\n\n                    4. 특성과 목표를 설정한다.\n                    각각의 그룹을 페르소나로 작성한다. 행동 패턴에 나타난 특성을 정리하고 해당\n                    제품이나 서비스를 통해 사용자가 이루고자 하는 목표를 3~5개 정도 설정한다.\n                    목표 설정은 제품이나 서비스의 방향성을 결정하기 때문에 페르소나 작성 시\n                    매우 중요하다.\n\n                    5. 상세 설명을 작성한다.\n                    페르소나의 성격을 잘 드러낼 수 있는 상세 설명을 추가한다. 상세 설명은 해당\n                    페르소나를 대표하는 동시에 다른 페르소나와 구분될 수 있어야 하며, 사용자\n                    조사 결과를 바탕으로 최종 제품과 서비스디자인에 필요한 내용을 작성한다.\n                    또한 실존 인물처럼 느껴질 수 있도록 이름과 사진을 추가한다. 페르소나는 실존\n                    인물처럼 느껴져 공감할 수 있도록 하는 것이 중요하기 때문에 강한 인상의\n                    이름이나 별명은 일반적으로 사용하지 않으며, 유명인의 사진이나 장난스러운\n                    사진도 사용하지 않는다.\n\n                    6. 페르소나의 종류를 결정한다.\n                    작성된 페르소나의 우선순위에 따라 1순위 페르소나, 2순위 페르소나, 추가\n                    페르소나를 결정한다. 또한, 일반적이지는 않지만 페르소나의 특성에 따라 실제\n                    사용자는 아니나 구매 결정을 내리는 고객 페르소나(Customer Persona), 실제\n                    사용자는 아니나 사용자에 의해 접대받는 페르소나(Served Persona), 디자인\n                    대상으로 고려하지 않는 부정적 페르소나(Negative Persona) 등도 존재한다.\n\n\n\n\n210 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f        [ 유아용 소셜 로봇 서비스를 위한 페르소나 도출 과정 ]\n\n\n\n\n구성 요소   페르소나의 구성 요소는 다양하며, 학자들마다 구성 요소를 분류하는 기준이\n        다르다. 따라서 분류 기준보다는 구성 요소를 바르게 이해하고, 프로젝트의\n        의사 결정에 영향 을 미치는 시사점을 중 심으 로 페르 소나 를 작성하 는 것이\n        중요하 다. 페 르 소나 의 구 성 요 소 는 다 음과 같 이 구 분할 수 있다. 먼 저\n        인구통계학적 구성 요소는 나이, 성별, 직업 등과 같이 가상의 인물을 구성하는\n        가장 기본적인 정보이다. 심리학적 정보는 성격, 태도, 관심사, 라이프 스타일 등\n        가상의 인물을 좀 더 구체적으로 상상할 수 있도록 도와주는 내면적인 정보이다.\n        마지막으로 행동적 구성 요소는 목표, 문제점, 멘털 모델 등 제품 또는 서비스의\n        사용과 직접적으로 연관된 전문적인(field-specific) 정보이다. 페르소나는\n        제품과 서비스에 따라 다르게 제작해야 하며 재사용이 불가능한데, 이는 행동적\n        구성 요소와 같이 제품과 서비스에 특화된 정보가 포함되기 때문이다.\n\n\n\n\n                                           서비스·경험디자인 이론서 211\n\f                    • 인구통계학적(Demographic) 구성 요소\n                      나이, 성별, 가족 구성, 소득, 직업/지위, 교육, 지역, 인종 등\n                    • 심리학적(Psychographic) 구성 요소\n                      성격, 태도, 관심사, 라이프스타일(제품이나 서비스의 이용, 활동, 취미 등) 등\n                    • 행태적(Behavioral) 구성 요소\n                      동기, 목표, 추구 가치, 사용 문제점, 구매 및 사용 프로세스, 멘털 모델 등\n\n                    페 르 소나 를 작성할 때 몇 가지 주의할 점이 있다. 프 로젝 트에 참 여하 는\n                    이해관계자가 페르소나 를 실제 인물처럼 상상할 수 있도록 사진 이미지를\n                    사용하는데, 이때 사진은 페르소나를 대표하는 일반적인 사진을 사용하는 것이\n                    바람직하다. 연예인, 유명인, 동료 등 특정 인물의 사진은 선입견을 야기하고\n                    현실감을 상실할 수 있기 때문에 사용을 지양한다.\t\t\t\n                    또한, 이름의 경우 일반 인의 이름 을 사 용할 것을 권장 한 다. 페 르 소나의\n                    특성을 강조하기 위하여 별명 또는 은유적 이름(박원칙, 나건강, 최예민 등)을\n                    사용하기도 하는데, 이는 페르소나를 실존 인물로 인지하는 것을 방해하기\n                    때문에 특수한 상황을 제외하고 권장하지 않는다. 페르소나의 특성을 요약하는\n                    한 문장의 인용구(quote)를 사용하기도 하는데, 이는 프로젝트 이해관계자가\n                    페르소나를 빠르게 이해하고 공감하는 데 도움이 된다. 페르소나와 관련한\n                    정량적 데이터가 있을 경우, 해당 데이터를 시각화하여 보여주면 페르소나의\n                    신뢰성을 향상시킬 수 있다.\n\n\n\n\n212 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f[ 금융 서비스 개선을 위한 페르소나 예시 ]\n\n\n\n\n목적                   페르소나는 프로젝트 진행에서 중요한 기준점이 된다. 앨런 쿠퍼는 페르소나를\n                     ‘수술 중의 밝은 불빛’이라고 명명하였다. 페르소나는 크게 사용자에 대한 공감,\n                     사용자 중심의 의사결정, 디자인 이외 영역에서의 활용을 위해 사용된다. 먼저,\n                     디자이너는 사용자의 니즈와 행동에 대해 심도 깊게 이해함으로써 사용자와의\n                     공 감을 형성하고 이를 바탕으 로 디자인을 진행한다. 다음으 로, 프 로젝트\n                     이해관계자는 자기 자신, 가족, 친구를 사용자로 대입하지 않고, 페르소나로\n                     대변되는 사용자의 니즈와 목표에 집중하여 더 분명하고 바람직한 의사결정을\n                     내릴 수 있다. 또한 페르소나를 중심으로 프로젝트 이해관계자는 더 효과적이고\n                     집중 된 대화와 논의를 진행할 수 있다. 마지막으 로 디자 인 이외 영업과\n                     마케팅에서도 사용자의 니즈, 구매 동기, 행동 특성 등에 대한 폭넓은 이해를\n                     바탕으로 커뮤니케이션과 판매 전략을 수립할 수 있다.\n\n\n\n\n                                                     서비스·경험디자인 이론서 213\n\f         디자인을 위한 통계\n\n\n\n더 알아보기\n                             디자 인 연구와 실무 에 서는 연구 결과의 타 당성과 신뢰성을 높이고 연구\n                             편향을 완화하며 연구 질문을 해결하기 위해 여러가지 데이터 세트와 방법\n                             등을 사용한다. 이때 질적인 인사이트를 도출하기 위하여 정성적 접근법과\n                             더불어 정량적 접근법이 활용되는데, 그중 가장 많이 사용되는 방법 중 하나가\n                             통계이다. 디자 인을 위한 통계는 디자 이너들이 데이터 기반 의사 결정을\n                             내리기 위해서 통계적 기법과 분석 도구를 활용하는 방법과 과정을 의미한다.\n                             이는 사용자 경험(UX), 인터페이스 디자인(UI), 제품 개발, 마케팅 등 디자인\n                             과정에서 데이터를 수집, 분석, 시각화하여 보다 효과적인 디자인 솔루션을\n                             도출하는 데 활용된다.\n\n\n\n\n                             디자인을 위한 통계의 주요 목적\n\n                             통계는 디자인 실무와 연구 상황에 따라 다양한 목적으로 사용되지만, 공통된\n                             주요 목적은 객관적으로 사 실을 측정하여 신뢰성이 있는 결과 를 도출하 는\n                             것이다.\n\n\n                             1. 사용자 행동 이해\n                             데이터를 기반으로 사용자 행동 및 선호도를 파악하는 것을 의미한다. 다양한\n                             산업 분야에서 이를 활용하지만, 가장 활발하게 사용자의 데이터를 수집하고\n                             활용하여 새로운 서비스를 제공하 는 분야 는 금융 산업이다. 국내 H은행은\n                             자사가 보유한 소비 데이터를 활용하여 여행 상품을 론칭하여, 항공권, 호텔\n                             예약, 패키지 여행 상품 등 다양한 서비스를 제공하고 있다. 국가 차원에서도\n                             사용자 데이터를 기반으로 새로운 시스템을 제안한 사례가 있다. 코로나19\n                             팬데믹 당시 우리나라는 GPS신호, 신용카드 이용 명세 등의 스마트시티 데이터\n                             허브를 활용하여 확진자의 2주간 이동 경로를 시각화하는 시스템인 “코로나19\n                             역학조사 지원시스템” (국토교통부, 과학기술정보통신부, 질병관리본부 협동,\n                             2020)을 구축하였다. 이 시스템은 감염 경로를 추적하고 추가 확산을 방지하는\n                             데 큰 도움이 되었다.\n\n\n\n\n         214 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f2. 디자인 검증\n디자인 산출물이 확정되기 전, 디자인 시안 및 프로토타입에 대한 사용자\n반응을 평가하기도 하 는데, 이때, 통계적 방법이 활용된다. 널리 사용되는\n방법은 A/B 테스트이다. 국내 모빌리티 기업 S사는 신규 예약 페이지를 통해\n예약하는 그룹의 전환율을 높이고자, 사용자들이 지도에 들어온 이후 보게\n되는 화면UI를 조절하여 실험군과 대조군을 비교하였다. 약 1~2주간의 A/B\n테스트 결과를 반영하여 기능의 배치와 디자인을 조정하였고, 그 결과 사용자\n참여도가 향상되었다. 해외 콘텐츠 기업 N사에서도 다양한 UI 디자인에 대하여\n인터페이스, UX 라이팅 등을 포함한 A/B 테스트를 진행하여, 어떠한 디자인\n결과물의 방향성이 유리한지 지속적으로 실험하고 평가하여 그 결과를 활용하고\n있다. 또한, 디자인 변경 전후의 성과를 정량적으로 비교하기도 하는데, 이를\n통해 변경된 디자인의 효율성을 평가할 수도 있다.\n\n\n3. 문제 해결\n때로는 디자인 상황에서 문제를 발견하기 어려울 수 있다. 이때 디자인 문제를\n데이터 분석으로 찾아내기도 한다. 예를 들어, 웹사이트의 특정 페이지에서\n사용자 들의 이탈 현상이 두드러지는 경우, Google Analytics 등의 툴을\n사용하여 페이지 뷰, 이탈률, 클릭 패턴 등을 분석할 수 있다. 분석 결과, 결제\n페이지의 로드 속도가 느리고 프로세스가 복잡하다는 문제가 발견되면 이를\n개선하여 이탈률을 줄일 수 있다. 국내외 다수 기업이 이러한 과정을 사용하며,\n기업은 디자인 문제 발견을 통해 디자인의 질을 지속적으로 향상하고 있다.\n\n\n\n\n                               서비스·경험디자인 이론서 215\n\f                    디자인 통계의 주요 종류와 방법\n\n\n                    1. 데이터 수집 방법\n\n                      ① 정성적 데이터 수집\n                        A. \u0007인터뷰: 사용자의 경험, 니즈, 문제점을 심층적으로 탐구 가능 (예:\n                           사용자가 모바일 앱을 사용하 는 동안의 불편 사항 인터뷰, 새로운\n                           가전에 대한 니즈를 알기 위한 창작활동을 통한 내면 니즈 도출)\n                        B. \u0007포커스 그룹: 특정 사용자 그룹을 대상으로 한 토론을 통한 아이디어\n                           도출 (예: 특정 UI 디자인 컨셉에 대한 반응 조사, 지역 정책 제안을\n                           위하여 다양한 이해관계자가 함께 공동 창작)\n\n                      ② 정량적 데이터 수집\n                        A. \u0007설 문조사: 사용자의 선호도, 행동, 만족도를 파악 (예: 특정 서비스\n                           혹은 디자인에 대한 만족도 조사)\n                        B. \u0007A /B 테스트: 두 가지 디자인 옵션을 사용해 실험군과 대조군의 성과를\n                           비교 (예: 버튼 색상이 클릭률에 미치는 영향 테스트, 서로 다른 UI\n                           스타일에서 목표 행동까지 다다르는 비율 비교)\n                        C. \u0007웹 분석 툴: Google Analytics, Hotjar 등을 활용한 사용자 행동\n                           데이터 수집 (예: 특정 페이지의 이탈률, 클릭 패턴, 스크롤 깊이 분석)\n\n\n\n\n216 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f2. 통계 분석 방법\n\n일반적으로 통계 분석을 위하여 엑셀 등의 기본 통계를 활용하기도 하지만 비교\n분석이나 관계 분석, 군집 분석 등을 위하여 쉽게 학습하고 활용할 수 있는\n다양한 전문 통계 프로그램과 소프트웨어를 사용할 수 있다. 대표적인 도구로서\nSPSS, AMOS, Stata, R, SAS와 같은 프로그램을 활용하며, 필요에 따라서는\n다양한 라이브러리 통계와 러닝머신 데이터를 Python을 통해 직접 코딩하여\n활용하는 방법이 있다.\n\n ① 기초통계\n   A. \u0007기술 통계(Descriptive Statistics): 데이터를 요약 및 설명 (예: 평균\n     클릭 수, 중앙값, 분산 등을 통해 사용자 행동 이해)\n   B. \u0007빈도 분석(Frequency Analysis): 특정 이벤트나 행동의 발생 빈도를\n     측정 (예: 사용자가 '구매하기' 버튼을 누른 횟수\n\n ② 비교분석\n   A. \u0007T-검정(T-test): 두 집단 간의 평균 차이를 검증하는 방법으로, 독립된\n     두 개의 집단을 비교하면 독립표본, 동일 집단에서 사전과 사후를\n     비교하면 대응표본 한 집단 내에서 평균과 특정 기준값을 비교하면\n     단일표본 T-test를 수행하고 통계 분석 결과 p값이 0.05보다 작을\n     때 통계적으로 유의미함. (예: 새 디자인과 기존 디자인 간의 사용자\n     만족도 비교)\n   B. \u0007분 산 분석(ANOVA): 세 개 이상의 집단 간 평균 차 이를 비교하 는\n     것으로 여러 집단 간에 평균값의 차이가 우연인지 통계적으로 유의미한\n     차이가 있는지 검증하기 위한 방법으 로 하나의 독립변수로 세 개\n     이상의 그룹 을 비교한 다면 일원분 산분 석(One-way ANOVA),\n     두 개의 독립변수로 그룹을 비교하고 두 독립변수 간의 상호작용도\n     분석한다면 이원분산분석(Two-way ANOVA)을 사용함. T-test와\n     같이 p값이 0.05보다 작으면 세 개 이상의 집단 간에 평균 차이가\n     유의미하다는 결론을 내릴 수 있음. (예: 각기 다른 색상 디자인이\n     클릭률에 미치는 영향)\n\n\n\n\n                                      서비스·경험디자인 이론서 217\n\f                        C. \u0007다변량 분산 분석 (MANOVA): MANOVA는 ANOVA와 유사하지만\n                           여러 종속변수에 대한 분석을 동시에 처리함. ANOVA가 그룹 간\n                           평균 차 이를 하 나의 종 속변수에 대해 비교한 다면, MANOVA는\n                           다수의 종속변수에 대해 그룹 간 평균 차이를 분석 할 수 있음. 여러\n                           종 속변수 에 대한 집단 간 차 이를 분 석하고 이들 종 속변수 간의\n                           상호작용을 확인하는 목적으로 사용함. 유의미와 p값은 앞의 통계와\n                           같음. (예: 서로 다른 디자인 전략 A, B, C이 사용자의 만족도, 유용성,\n                           효율성에 미치는 영향, 제품 디자인 변경이 고객의 만족도와 재구매\n                           의향에 미치는 영향)\n\n                      ③ 관계 분석 (Relationship Analysis)\n                        A. \u0007상 관 분 석(Correlation Analysis): 두 변수 간의 관계 강도를\n                           측정하고, 이들이 서로 어떻게 연관되어 있는지를 파악하기 위함.\n                           상관계수(Correlation Coefficient) 의 크기와 양(+), 음(-) 여부 및\n                           p값 등을 통하여 통계적 유의미함을 확인할 수 있음. (예: 페이지 로드\n                           속도와 이탈률 간의 상관관계 분석을 통해 페이지가 더 빨리 로드\n                           될수록 이탈률이 낮아지는 경향이 있는지 파악 가능)\n                        B. \u0007회 귀 분 석(Regression Analysis): 한 변수 (독립변수)가 다른\n                           변수(종속변수)에 미치는 직접적인 영향을 예측하거나 설명하며 예를\n                           들어 독립변수의 값이 1 증가할 때 종속변수는 얼마나 변화하는지\n                           알 수 있음. 회귀 계수(Regression Coefficient) 의 크기와 양(+),\n                           음(-) 여부, 회귀 모델이 종속변수의 변동성을 얼마나 잘 설명하는지를\n                           나타내는 결정 계수(R-squared, R². 1에 가까울수록 회귀 모델이\n                           종속변수의 변동을 잘 설명하고, 0에 가까 울수록 변동을 설명하지\n                           못함) 및 p값 등을 통하여 통계적 유의미함을 확인할 수 있음. (예:\n                           이미지 크기가 클릭률에 미치는 영향 예측)\n\n                      ④ 군집분석 (Clustering)\n                        A. \u0007사 용자 데이터를 기반으로 비슷한 행동 패턴을 가진 그룹으로 분류함.\n                           데이터의 유사성을 기반으로 비슷한 행동이나 특성을 가진 그룹을\n                           분류하여, 각 그룹에 맞는 맞춤형 전략을 설계할 수 있음. (예: 사용자를\n                           초보자, 중급자, 전문가 그룹으로 나누어 맞춤형 디자인 제공)\n\n\n\n\n218 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f디자이너를 위한 실무 팁\n\n\n\n1. 어떤 데이터인지가 중요하다 (사용자 중심 데이터 활용)\n효율적인 디자인은 정확한 데이터를 기반으로 한다. 데이터 풀(데이터 원천)을\n사용자 중심으로 구성하여 실제 니즈를 파악해야 한다. 다양한 사용자 그룹에서\n데이터를 수집하고, 정기적으로 업데이트하며, 특정 데이터 세트에 과도하게\n의존하지 않도록 주의해야 한다. 이렇게 하면 변화하는 트렌드와 사용자 요구를\n더 잘 반영할 수 있다.\n\n\n2. 방법이 적합해야 한다 (적절한 도구 선택)\n통계를 활용할 때 도구 선택은 성공의 핵심이다. 조사 목적과 데이터 특성에\n맞는 분석 방법론을 선정해야 한다. 예를 들어, 정량적 분석이 필요한 경우\nExcel(단순한 분석)이나 SPSS(복잡한 분석) 혹은 Python(학습이나 자동화가\n필요한 분석), 정성적 데이터가 중심이라면 NVivo나 Miro 같은 시각화 도구를\n고려할 수 있다. 어려운 도구를 선택하 는 것은 효율적이지 않다. 복잡도를\n낮추고 결과의 신뢰성을 높이는 것이 가장 중요하며 이를 위하여 적절한 도구를\n선택해야 한다.\n\n\n3. 양적 데이터뿐만 아니라 질적 데이터도 고려해야 한다 (해석의 중요성)\n종종 통계 분석이 복잡하게 이루어지다 보면 설명해야 하는 관계도 많아진다.\n그러나, 통계적 유의미함에 대한 설명에 주로 집중하다 보면 충분한 인사이트를\n도출하지 못할 때가 많다. 물론 통계 분 석은 연구 결과 에 대한 신뢰성을\n높여주는 중요한 도구이지만 통계 분석이 숫자로만 끝나지 않도록 하는 것이\n매우 중요하다. 숫자로 나타난 결과를 넘어, 그 안에 숨겨진 질적 인사이트를\n탐구해야 한다. 설문조사 후 개방형 질문을 추가하거나, 사용자 인터뷰를 통해\n맥락을 이해하면 데이터에 깊이를 더할 수 있다. 이러한 통찰은 디자인 방향성을\n결정하는 데 중요한 역할을 할 수 있다.\n\n\n\n\n                                서비스·경험디자인 이론서 219\n\f         데이터 드리븐 디자인\n\n\n\n더 알아보기\n                             데이터 드리븐 디자인(Data-Driven Design) 은 데이터를 기반으 로 한\n                             의사결정을 통해 디자인 솔루션을 개발하는 접근 방식이다. 이는 디자이너가\n                             개인적인 경험이나 직감이 아닌, 사용자 데이터를 기반으로 문제를 정의하고\n                             해결하여 더 나은 결과를 도출하는 데 중점을 둔다. 사용자의 행동, 피드백,\n                             성과 데이터를 분석하여 디자인을 검증하고 개선하는 과정에서 정성적 데이터와\n                             정량적 데이터를 모두 활용한다. 최근에는 인공지능을 활용하여 데이터의 양을\n                             늘리고 정확성을 높이는 사례가 늘어나고 있다.\n\n\n\n\n                             데이터 드리븐 디자인의 주요 목적\n\n                             데이터 드리븐 디자인의 주요 목적은 디자인 결정에 다양한 데이터를 활용하여\n                             사용자 중심의 솔루션을 개발하는 것이다.\n\n\n                             1. 사용자 요구 파악\n                             데이터 는 사 용 자가 무엇 을 원 하 는지 , 어떤 점 에 서 불 편 을 느 끼 는지 를\n                             이해하도록 돕는다. 예를 들어, 음원 스 트리밍 회사 S사는 청취 데이터를\n                             기반으로 개인화된 플레이리스트를 제공함으로써 사용자의 참여도를 높인다.\n                             데이터 분석을 통해 구체적인 사용자 요구와 행동 패턴을 확인할 수 있으며, 이를\n                             바탕으로 보다 정밀한 디자인 솔루션을 개발할 수 있다. 미국의 카페 S사 또한\n                             개인화 프로모션을 진행할 때 데이터 드리븐 디자인 접근법을 활용한다. S사는\n                             구매 기록, 위치 데이터, 시간 데이터 등을 분석하여 맞춤형 프로모션과 제품을\n                             모바일 앱으로 제안함으로써 앱 참여율을 높이고 재구매율을 향상시켰다.\n\n\n                             2. 디자인 검증 및 개선\n                             디자인 검증은 데이터 드리븐 접근법의 핵심 단계이다. 데이터는 디자인 시안\n                             또는 프로토타입의 성과를 평가하고 개선점을 발견하는 데 사용된다. 여행\n                             예약업체 B사는 디자인 변경 전후 클릭율 및 예약 전환율 데이터를 비교하여\n                             디자인의 성공 여부를 판단한다. UI에 대한 검증이 필요한 경우에 데이터가\n                             활용된다. 업무 협업 소프트웨어를 제공하는 S사는 클릭 데이터, 기능 사용\n                             데이터를 기반으로 UI를 개선해 작업 흐름을 간소화했다. 그 결과 사용자\n                             만족도와 생산성이 향상되었다. 이러한 사례와 같이 데이터를 활용한 디자인\n                             검증 과정을 통해 디자인의 성공 가능성을 높이는 데 기여할 수 있다.\n\n\n         220 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f3. 디자인 성과 측정\n데이터 드리븐 디자인을 통해 기존 디자인의 성과를 측정하고, 데이터를 통해\n개선 방향을 도출할 수 있다. 미국의 유통업체 A사는 구매 프로세스 데이터를\n분 석해 특 정 단계에 서 사 용자의 이탈 원인을 발견하고 체 크아 웃 과 정을\n최적화함으로써 사용자 경험을 개선하고 비즈니스 성과를 향상시켰다. 비슷한\n예로 D사의 언어학습 서비스는 세션 빈도, 레슨 완료율, 오류 패턴 등의 사용자\n상호작용 데이터를 분석해 학습 경험을 게임화할 수 있는 스트라이크, 보상 및\n적응형 난이도를 추가하였으며, 이를 통해 해당 서비스의 일일 활성 사용자 수와\n학습 지속 시간을 증가시켰다.\n\n\n\n\n데이터 드리븐 디자인의 데이터 종류\n\n데이터 드리븐 디자인의 주요 목적은 디자인 결정에 다양한 데이터를 활용하여\n사용자 중심의 솔루션을 개발하는 것이다.\n\n\n1. 정량적 데이터\n정량적 데이터는 수치로 측정이 가능한 데이터를 말하며, 이는 디자이너에게\n사용자 행동과 상호작용에 대한 객관적인 통찰력을 제공한다. 정량적 데이터\n유형은 추세와 패턴을 식별하는 데 유용하며, 디자이너가 확실한 증거에 따라\n정보에 입각한 결정을 내릴 수 있도록 한다. 예를 들어, 디자이너는 웹사이트\n분석을 통해 어느 페이지에서 가장 많은 트래픽이 발생하는지 또는 사용자가\n어느 지점에서 가장 많이 이탈하는지 파악하여 레이아웃 및 콘텐츠를 개선하기\n위한 결정을 내릴 수 있게 된다.\n\n\n2. 정성적 데이터\n정성적 데이터는 수치를 기초로 하지 않으며, 주관적인 사용자 의견, 감정 및\n동기에 초점을 둔다. 이는 디자이너에 사용자 행동의 이유를 이해하는 데 도움이\n되며, 사용자의 요구 사항과 선호도에 대한 깊은 통찰력을 제공한다. 사용자\n인터뷰를 실시하거나 사용성 테스트에서 얻은 피드백을 분석하면 사용자의\n고민이나 선호도를 파악할 수 있으며, 이를 디자인 과정에 반영하여 보다 사용자\n중심적인 솔루션을 만들어낼 수 있다.\n\n\n\n\n                             서비스·경험디자인 이론서 221\n\f                    데이터 드리븐 디자인의 주요 과정과 방법\n\n                    디자이너는 데이터 중심 접근 방식을 채택하여 사용자 요구와 비즈니스 목표에\n                    부합하는 디자인을 할 수 있다.\n\n\n                    1. 목표 및 목적 설정\n                    디자이너는 데이터를 수집하고 분석하기 전에 명확한 목표와 목적을 설정해야\n                    한다. 이 단계에서는 사용자 요구 사항과 비즈니스 목표에 맞는 핵심 성과\n                    지표(KPI)를 식별해야 하며, 구체적이고 측정 가능한 목표를 설정하여 제품이나\n                    사용자 경험에 중대하게 미치는 영역에 집중해야 한다.\n\n\n                    2. 데이터 수집 및 분석\n                    디자인 팀은 분석 도구, 사용자 설문 조사, 사용성 테스트 등의 다양한 출처에서\n                    관련 정량적·정성적 데이터를 수집해야 한다. 디자이너는 엄격한 방법론을\n                    적용해 데이터를 분석하여 정확하고 편향이 없는 결론을 도출해야 한다.\n\n\n                    3. 패턴 및 통찰력 식별\n                    디자이너는 수집된 데이터에서 패턴을 발견하고 통찰을 얻어 디자인 결정을\n                    내린다. 이 분석에는 사용자의 페인포인트, 선호도, 행동 추세를 파악하는 것이\n                    포함된다. 디자이너는 패턴을 인식함으로써 사용자의 요구를 더 깊이 이해하고,\n                    디자인 프로세스 전반에 걸쳐 정보에 근거한 결정을 내릴 수 있다.\n\n\n                    4. 데이터 기반 디자인 결정 내리기\n                    디자이너는 통찰력을 바탕으로 데이터 기반 의사 결정을 내려 사용자 요구를\n                    충족하고 비즈니스 목표를 달성해야 한다. 이 과정에는 디자인 반복, 사용자\n                    피드백 통합, 데이터 기반 제품 개선이 포함된다. 새로운 데이터가 등장하면\n                    방향을 조정하거나 변경해 솔루션이 지속적으로 관련성과 실용성을 유지하도록\n                    해야 한다.\n\n\n                    5. 프로토타입 제작 및 테스트\n                    디자인 팀은 초기 단계의 종이 프로토타입부터 나중의 완전히 기능하는 대화형\n                    프로토타입까지, 디자인 프로세스 전반에 걸쳐 아이디어와 가정을 테스트하기\n                    위해 프로토타입을 구축한다. 제작한 프로토타입을 사용자에게 테스트하고,\n                    사용자의 피드백을 수렴하여 프로토타입을 개선한다. 이 과정을 반복하면서\n                    최종적으로 사용자에게 가장 적합한 해결책을 찾는다.\n\n\n\n\n222 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f6. 데이터를 사용한 반복과 정제\n디자인 프로세스 전반에 걸쳐 디자인 변경의 영향을 측정하고 지속적으로\n반복하는 것이 중요하다. 디자인 팀은 KPI를 모니터링하고 지속적으로 사용자\n및 이해관계자로부터 피드백을 수집해 사용자 경험을 최적화하고 원하는 결과를\n달성하기 위해 디자인을 개선해야 한다.\n\n\n\n\n디자이너를 위한 실무 팁\n\n데이터 드리븐 디자인의 주요 목적은 디자인 결정에 다양한 데이터를 활용하여\n사용자 중심의 솔루션을 개발하는 것이다.\n\n\n1. 디자인 프로세스의 창의성과 직관의 균형이 중요하다 (해석의 중요성)\n데이터는 강력한 도구지만, 데이터에 지나치게 의존하면 창의성이 억제되고\n혁신이 제한될 수 있다. 디자이너는 이러한 위험을 염두에 두고 데이터에\n지나치게 제약 받지 않도록 해야 하며, 이는 일반적이거나 상상력이 부족한\n솔루션으로 이어질 수 있다.\n\n\n2. 데이터 편향을 줄여야 한다 (데이터 풀의 중요성)\n데이터는 의도치 않게 수집 프로세스에 존재하 는 편향을 반영하여 왜곡된\n통찰력을 제공할 수 있다. 예를 들어, 특정 집단에서 수집된 사용자 설문조사\n데이터는 전체 사용자의 데이터를 제공하지 않는다. 따라서, 다양한 표현을\n보장하기 위해 정기적으로 데이터 수집 방법을 검토해야하며, 교차 검증 기술을\n구현하여 편향을 식별하고 최소화해야 한다.\n\n\n3. 너무 많은 데이터는 불필요하다 (명료함과 최적화)\n지나치게 많은 데이터는 너무 적은 데이터만큼 문제가 될 수 있다. 또한, 연구\n질문이 명확하지 않은 경우에도 프로젝트 목표와 맞지 않는 무관한 지표에\n집중함으로써 의사 결정에 혼란이 초래될 수 있다. 이를 위해 명확한 핵심 성과\n지표(KPI)를 정의하고 실행 가능한 지표에 집중해야 한다. 비즈니스 목표와\n사용자 만족도와 직접적으로 관련된 데이터 포인트를 우선시하고 허영 지표에\n흔들리지 않도록 해야한다.\n\n\n\n\n                                 서비스·경험디자인 이론서 223\n\f                                  3.1.2 고객 여정 지도180\n\n정의                                고객 여정 지도는 서비스를 이용하기 전, 서비스를 이용하는 중간, 서비스를\n                                  이용한 후까지 사용자가 서비스를 경험하는 전체 과정을 시각화하여 보여 주는\n                                  방법이다. 고객 여정 지도는 사용자가 서비스를 이용하 는 과정에서 무엇을\n                                  생각하고(Thinking), 무엇을 하고(Doing), 어떻게 느끼는지(Feeling)가 시간의\n                                  흐름에 따라 표현되고, 각각의 과정에서 사용자가 서비스 제공자와 인터랙션\n                                  하는 모든 수단(Touch Points)이 명명된다. 고객 여정 지도는 최종적으로 해당\n                                  서비스의 강점(Strengths), 약점(Weaknesses), 기회 요인(Opportunity\n                                  Areas)을 고객 관점에서 파악할 수 있게 한다.\n\n\n역사                                고객 여정 지도가 어떻게 시작되었는지는 명확하지 않다. 고객 여정 지도의\n                                  기본이 되는 서비스 접점을 연결한다는 개념은 얀 칼존(Jan Calzon)의 진실의\n                                  순간(Moment of Truth)에서 기원했다고 보는 견해가 존재한다. 스칸디나비아\n                                  항공사(SAS Airlines)의 CEO였던 얀 칼존은 고객이 원하 는 결과 를 얻기\n180                               위해 많은 에너지를 쏟아붓는 특별하고 중요한 순간을 진실의 순간이라고\nJames Kallbach(2015), 《Mapping\nExperiences》, Oreilly &\n                                  명명하 였다. 이 진실의 순 간은 서비스 제 공자와의 관계를 긍 정적으 로 도\nAssociates Inc.\n                                  혹은 부정적으로도 만든다. 얀 칼존은 항공사 사례를 들어 이 진실의 순간을\n김진우(2017), 《서비스 경험디자              설명하였다. 호텔에 탑승권을 두고 온 고객을 위하여 항공사 직원이 직접 차로\n인》, 안그라픽스\n                                  동행하여 무사히 탑승권을 찾아 탑승할 수 있도록 도와준다면, 이 경험은\nLewis Carbone, Stephen Haecke\n                                  고객에게 잊지 못할 인상을 남길 것이다. 이것이 바로 얀 칼존이 말하는 진실의\nl(1994), <Engineering Customer\nExperiences>, Marketing           순간이다. 얀 칼존은 고객 여정 지도의 개념을 명확하게 언급하지 않았으나,\nManagement 3(3)\n                                  서비스에서 고객 경험의 중요성을 강조하였다.\n마르크 스틱도른, 야코프 슈나이더\n(2012), 《서비스 디자인 교과서》, 안\n                                  이후 19 9 4년 루이스 카 본 (Lewis Carbone)과 스테판 해켈(Stephen\n그라픽스\n                                  Haeckel)은 픽토그램을 사용하여 서비스가 진행되는 과정의 경험을 설명하는\nValarie Zeithaml, Mary Bitner,\nDwayne Gremler(2013), 《서비스        경험 청사진(Experience Blueprint)를 제안하였다. 경험 청사진은 고객\n마케팅》, 청람\n                                  관점의 경험을 시간의 흐름에 따라 시각적 이미지를 통해 표현하였다는 점에서\nMarc Stickdorn, Markus            매우 흥미롭다. 그 후 2002년 고객 경험 전문가인 콜린 쇼(Colin Shaw)와\nHormess, Adam Lawrence,\nJakob Schneider(2018), 《This is   존 아이벤스(John Ivens)는 저서 『훌륭한 고객 경험 추구, Building Great\nService Design Doing》, O'Reilly\nMedia\n                                  Customer Experiences』에서 현재의 고객 여정 지도에서 강조하는 감정적\n                                  요소를 포함한 모멘트 맵(Moment Map)을 선보였다. 콜린 쇼와 존 아이벤스가\n                                  제안한 모멘트 맵의 구성 요소는 현재의 고객 여정 지도와 매우 유사하다.\n\n\n\n\n224 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f[ 루이스 카본(Lewis Carbone)과 스테판 해켈(Stephen Haeckel)의 경험 블루프린트(Experience Blueprint) ]\n\n\n\n\n                                                                                     서비스·경험디자인 이론서 225\n\f[ 콜린 쇼(Colin Shaw)와 존 아이벤스(John Ivens)의 모멘트 맵(Moment Map) ]\n\n\n\n\n[ 브루스 템킨(Bruce Temkin)의 고객 여정 지도(Customer Journey Mapping) ]\n\n\n\n\n[ 마르크 스틱도른(Marc Stickdorn)과 야코프 슈나이더(Jacob Schneider)의 고객여정캔버스(Customer Journey Canvas) ]\n\n\n\n\n226 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f     고객 경험에 대한 학자들의 관심과 논의는 더욱 증폭되었고, 2010년 브루스\n     템킨(Bruce Temkin)은 진실의 순간과 서비스 접점의 개념을 통합하여 고객\n     여정 지도(Customer Journey Mapping)의 개념을 소개하였다. 브루스\n     템킨은 고객 여정 지도를 \"고객과 기업의 관계에서 발생하는 고객의 프로세스,\n     니즈, 인식을 시각적으로 나타낸 문서(Documents that visually illustrate\n     customers’ processes, needs, and perceptions throughout their\n     relationships with a company)\" 라고 정의하였다. 그는 고객 여정 지도\n     작성의 중요성을 강조하며, 고객 여정 지도 작성 방법, 사례, 활용법 등을\n     소개하였다. 그리고 마침내 마르 크 스틱도른(Marc Stickdorn)과 야코 프\n     슈나이더(Jacob Schneider)의 저서 『서비스디자인 교과서, This is Service\n     Design Thinking』에서 고객 여정 캔버스(Customer Journey Canvas)의\n     양식이 소개되며 고객 여정 지도의 형식이 완성되었다. 고객 여정 지도는 고객의\n     관점에서 서비스를 평가하도록 함으로써 서비스의 문제점을 개선하고 혁신을\n     이루도록 돕는 서비스디자인의 핵심 툴로 자리매김하였다.\n\n\n\n\n방법   사용자 조사를 통해 수집된 다양하고 복잡한 정보는 고객 여정 지도를 통해\n     모든 이해관계자가 이해하기 쉽도록 정리된다. 고객 여정 지도는 프레임워크를\n     기반으로 사용자 조사 정보를 매핑하는 방식으로 작성한다. 고객 여정 지도의\n     범위는 다양하다. 서비스의 처음부터 끝까지 전체 과정에 대한 고객 여정 지도를\n     작성할 수도 있고, 서비스의 특정 단계에 대해 집중적으로 고객 여정 지도를\n     작성할 수도 있다. 고객 여정 지도 작성의 목적에 따라 전체 여정을 줌인(zoom-\n     in) 혹은 줌아웃(zoom-out)하여 작성의 범위를 결정해야 한다. 고객 여정\n     지도는 단순히 사용자 조사를 정리한 도표로서의 의미가 아니라, 추후 디자인과\n     개발 과정에서 비즈니스 의사결정에 활용되는 중요한 지표로서의 역할이 더욱\n     중요하기 때문에 신중하게 작성해야 한다. 고객 여정 지도는 다음과 같은 순서로\n     작성한다.\n\n\n\n\n                                              서비스·경험디자인 이론서 227\n\f                    1. 목표를 설정한다.\n                    고객 여정 지도의 활용 목표와 이해관계자를 명확히 한다.\n\n                    2. 고객 여정 지도 작성을 위한 사용자를 선정한다.\n                    사용자에 따라 고객 여정 지도는 다르게 작성된다. 어떠한 사용자를 대상으로\n                    고객 여정 지도를 작성할지 대상을 선정한다. 페르 소나 혹 은 세그멘트를\n                    중심으로 선정하는 것이 가능하다.\n\n                    3. 사용자의 관점에서 각 단계를 매핑한다.\n                    고객 여정 지도의 프레임워크에 따라 사용자 조 사 자료를 매핑한다. 먼저\n                    프레임워크의 가로축인 서비스의 단계를 확정하고, 그에 따라 세로축의 생각,\n                    행동, 감정, 서비스 접점을 해당 사용자의 관점에서 상세하게 작성한다.\n\n                    4. 비즈니스 관점에서 인사이트를 도출한다.\n                    사 용자의 관점에서 서비스의 강점, 약점, 기회 요인을 파 악 한 다. 다 양 한\n                    사용자를 대상으로 작성된 고객 여정 지도를 비교 분석하여 비즈니스 관점에서\n                    인사이트를 도출한다.\n\n\n\n\n구성 요소               고객 여정 지도의 가로축은 경험의 단계로 구성되며, 세로축은 사용자의 생각,\n                    행동, 감정, 서비스 접점, 강점, 약점, 기회 영역으로 구성된다. 각각의 항목에\n                    대한 설명은 다음과 같다.\n\n\n\n                    • 단계(Phases)                 고객 행동의 주요 과정\n                    • 생각(Thinking)               궁금증, 의도, 동기\n                    • 행동(Doing)                  실제 행동\n                    • 감정(Feeling)                긍정적/부정적 감정\n                    • 서비스 접점(Touch Points)       행동과 연관된 모든 인터페이스\n                    • 강점(Strengths)              서비스 과정의 긍정적 측면\n                    • 약점(Weaknesses)             서비스 과정의 부정적 측면\n                    • 기회 영역(Opportunity Areas)   서비스 과정의 개선 사항\n\n\n\n\n228 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f     서비 스 접 점 ( To u c h Po int ) 은 서비 스 를 경험 하 는 과 정 에 서 사 용 자 와\n     인터랙션이 일어나는 모든 물리적, 인적, 커뮤니케이션 대상을 의미한다. 즉,\n     서비스 접점은 서비스를 구현하 는 매체로서 궁 극적으 로 서비스의 가치를\n     전달한다. 먼저, 물리적 증거(Physical Evidence)는 서비스 접점 중에서\n     서비스의 수행이나 소통을 지원하는 모든 유형적인 요소를 의미하며, 책자,\n     명함, 브 로슈어, 웹 페이지, 청구서, 사무 용 품 등이 해당된다. 다 음으 로\n     서비스스케이프(Servicescape)는 서비스가 수행되고 제공되며 소비되는\n     물리적 시설로서, 외관 설계, 주차 장, 조경, 입구, 보행 공간과 같은 외부\n     속성과 설계, 배치, 공조, 음악, 향, 조명, 실내 장식과 같은 내부 속성으로\n     구성된다. 이는 서비스 차별화의 수단이며 서비스 수행을 지원하는 역할을 한다.\n     마지막으로 감정 곡선(Emotional Curve)은 고객 여정 지도를 작성할 때, 고객\n     감정의 흐름을 시각화한 선이다.\n\n     고객 여정 지도의 구 성 요 소는 프 로젝트의 목 적에 따라 다 양하게 추가가\n     가능하다. 세로축에 이해관계자, 사용자 참여도(Dramatic Arc), 백스테이지\n     프로세스, 핵심 성과 지표(Key Performance Indicator, KPIs), 정량 데이터,\n     레퍼런스 등의 항목을 추가할 수 있다.\n\n\n\n목적   고객 여정 지도는 서비스 이해관계자가 사용자에게 공감할 수 있게 하고,\n     서비스의 문제 영역에 집중할 수 있도록 하며, 여러 이해관계자들이 협력하여\n     문제 를 해 결할 수 있도록 하 는 데 매 우 중요한 도구 이다. 먼저, 서비스\n     이해관계자는 고객 여정 지도를 통해 사용자가 서비스를 이용할 때 느끼는\n     불편함과 니즈를 명확하게 파악하고, 비즈니스에 긍정적 영향과 부정적 영향을\n     미치는 영역을 사용자의 관점에서 폭넓게 이해할 수 있다. 다음으로, 서비스\n     개선을 위한 우선순위를 명확히 하고 역량 을 집중할 수 있다. 즉, 서비스\n     개선을 위한 다양한 아이디어에 대해 사용자 중심의 의사결정을 할 수 있도록\n     도와준다. 마지막으로, 고객 여정의 전체 그림(big picture)을 보여 줌으로써\n     고객 만족(satisfaction)과 고객 감동(delight)을 위해 이해관계자가 함께\n     협업해야 함을 일깨워 준다. 고객 만족과 고객 감동은 서비스 여정의 한 단계를\n     통해서 형성되는 것이 아니라, 전체 서비스의 여정에서 고객이 경험하는 긍정적\n     인터랙션의 총합에 의해 형성된다. 고객 여정 지도는 서비스 이해관계자가\n     자신의 업무와 책임에만 몰두하는 사일로(Silo) 현상을 극복하고 함께 협력하는\n     관계로 발전해 나갈 수 있도록 도와준다.\n\n\n\n\n                                             서비스·경험디자인 이론서 229\n\f                    정보 검색          은행 방문(1차)      구비 서류 준비         은행 방문(2차)       은행 방문(3차)        은행 방문(4차)\n\n                “대출은 어떻게 받을수    “시간이 얼마 없는데,    “주민센터, 세무서 가서   “필요한 서류를 잘      “지난 번 빠진 서류를\nThinking\n                 있는 건가?”         창구 직원에게 상담을    서류를 뽑아야겠다.”      준비했겠지? 시간 안에    잘 준비했으니 오늘은\n                “대출을 받을 때 필요한    받으려면 얼마나                        대출 업무를 모두 잘     문제없이 신청할 수\n                 서류는 무엇이지?”      걸릴까?”                           마칠 수 있을까?”      있겠지?”\n                “어느 은행에서        “창구 상담 직원이                      “지난 번에 상담 받은\n                 유리한 대출을         전문적으로                           직원에게 받으면\n                 받을 수 있을까?”      상담을 잘 해 줄까?”                    좋으련만 상담직원이\n                                                                 자리에 없네?”\n\n                ・인터넷으로          ・한참을 기다려        ・근로소득, 원천징수,    ・서류가 미비하거나    ・대기시간을             ・대출되는 히 창구의자에\n                                                 있어 헷갈린다.                        앉아있다.\n\n\n                                                ・서류 준비시 구체적인    ・서류 준비 완료만을     ・직장인을 위한\nOpportunities\n                                                 가이드라인           알려주는 서비스        상담예약 서비스\n                                                ・전화 또는 모바일 상담\n\n\n\n\n[ 금융서비스 개선을 위한 고객 여정 지도 예시 ]\n\n\n\n\n230 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                3.1.3 이해관계자 지도181\n\n정의                              이해관계자 는 서비스를 기획하고 제공하고 사 용하 는 데 관여하 는 다양한\n                                사람들을 의미한다. 크게 내부 이해관계자와 외부 이해관계자로 나뉘는데, 내부\n181\n                                이해관계자는 경영자, 관리자, 전방(Front Stage)의 직원, 후방(Back Stage)의\nEdward Freeman, Jeffrey\nHarrison, Andrew Wicks(2007),   직원 등이 해당하고, 외부 이해관계자는 고객, 파트너, 경쟁자, 컨설턴트,\n《Managing for Stakeholders》,\nYale University Press\n                                민간단체, 정부, 언론 등이 해당한다. 서비스디자인은 한 가지 문제를 해결하는\n                                것만으 로는 효과적인 개선이나 의미 있는 혁신이 이루어지지 않는 경우가\n앤디 폴라인, 라브란스 로이빌, 벤 리\n즌(2016), 《서비스디자인》, 카오스          많다. 따라서 이해관계자 집단의 다양한 니즈를 파악하여 총체적(Holistic)\n북\n                                관점에서 디자인되어야 한다. 이해관계자 지도(Stakeholder Map)는 서비스\n한국직업능력개발원(2016), 《NCS\n                                전반에 관련된 다양한 이해관계자들의 역할과 역학 관계를 시각화하여 보여주는\n서비스 경험디자인 학습모듈》\n                                방법이다.\n\n\n역사                              이해관계자는 1963년 스탠포드 리서치 인스티튜트(Stanford Research\n                                Institute)에서 처음으 로 사용된 용어이다. 이해관계자는 “조직이 존재할\n                                수 있도록 지원하는 그룹(those groups without whose support the\n                                organization would cease to exist)”이라는 의미로 사용되었다. 그 후\n                                1984년 에드워드 프리먼(Edward Freeman)이 그의 저서 『전략적 경영:\n                                이해관계자 접근법』을 통해 이해관계자 이론을 정립하였다. 많은 기업의 관심을\n                                불러일으킨 그의 이론은 기업이 지속 가능한 경영을 위해서는 주주의 이익만이\n                                아닌 이해관계자의 요구에 부응할 수 있어야 한다고 강조한다. 즉, 기업은\n                                이해관계자의 가치를 극대화해야 한다는 것이다. 에드워드 프리먼은 2007년\n                                그림과 같이 이해관계자 이론 다이어그램(Stakeholder Theory Diagram)을\n                                제안하였다.\n\n\n\n\n                                                                   서비스·경험디자인 이론서 231\n\f                    [ 에드워드 프리먼(Edward Freeman)의 이해관계자 이론 다이어그램 ]\n\n\n\n\n                    기업 경영의 직접적 혹 은 간접적 연관 성에 따 라 1차 이해 관계 자 와 2차\n                    이해관계자로 구분되며, 기업과 이해관계자는 바퀴의 중심과 바큇살의 형태로\n                    표현되고 있다. 서비스 는 여러 이해 관계 자의 유 무형의 자 원(지 식, 기술,\n                    정보, 돈, 인력 등)이 결합되어 완성되기 때문에 이해관계자와의 협력이 특히\n                    중요하다. 따라서 이해관계자의 유형, 역할, 가치 사슬, 상호작용, 환경 등을\n                    파악하기 위해 다양한 방식의 시각화가 이루어졌다. 이해관계자 지도와 유사한\n                    개념으로 생태계 지도(Ecology Map), 에코시스템 지도(Ecosystem Map),\n                    액터 네트워크 맵(Actor Network Map) 등이 존재한다. 이해관계자 지도는\n                    주요 이해관계자와 그들의 관계를 보여 주는 것이 목적이므로 정해진 형식 없이\n                    서비스의 목적에 맞게 제작할 수 있다.\n\n\n\n\n232 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f방법   이해관계자 지도는 프로젝트 전반에 걸쳐 작성할 수 있다. 프로젝트 초기에는\n     서비스와 관련된 주요 이해관계자를 파악하여 사용자 조사에 활용할 수 있다.\n     사용자 조사가 끝난 후에는 이해관계자에 대한 이해가 더욱 분명해지기 때문에\n     이해관계자 간 가치의 흐름을 더욱 명확하게 파악할 수 있다. 또한, 서비스\n     전반에 걸쳐 이익을 보는 사람이 누구인지, 피해를 보는 사람이 누구인지, 의사\n     결정권을 쥐고 있는 사람이 누구인지, 서비스에 적대적인 감정을 가지고 있는\n     사람이 누구인지에 대한 이해가 더욱 명확해지기 때문에 누락된 이해관계자와의\n     상호작용을 보완할 수 있다. 마지막으로 최종 서비스가 도출된 후에는 최종\n     이해관계자의 목록과 이해관계자 간 가치의 흐름을 예상 시나리오에 따라\n     제작하여 완성할 수 있다. 이해관계자 지도는 일반적으로 다음과 같은 순서로\n     작성한다.\n\n     1. 이해관계자 목록을 작성한다.\n     가능한 모든 이해관계자를 파악하는 것이 중요하다. 공급자, 유통업자, 정부\n     기관, 경쟁자, 고객 등 현재 상황에서 가치를 만들어내는 데 참여하고 있는 모든\n     주체를 포함한다.\n\n     2. 서비스와의 관련성과 유형에 따라 이해관계자를 매핑한다.\n     서비스와의 관련성 정도에 따라 동심원의 내부(1차 이해관계자)에서 외부(n차\n     이해 관계 자)로 이해 관계 자 를 매핑한 다. 또한 이해 관계 자의 유형에 따 라\n     동심원의 영역을 구분하여 이해관계자를 매핑한다.\n\n     3. 가치의 흐름을 파악한다.\n     지식, 기술, 정보, 돈, 인력 등 가치의 흐름을 파악한다. 사회 공공의 이익을 위한\n     서비스의 경우, 기회, 접근, 영향력처럼 잘 보이지 않는 가치의 흐름도 고려해야\n     한다.\n\n\n\n\n                                    서비스·경험디자인 이론서 233\n\f                    4. 가치의 흐름도를 그린다.\n                    모든 교점과 링크에 제목을 붙여 이해관계자에 따라 가치의 흐름이 달라지는\n                    것을 한눈에 파악할 수 있도록 시각화한다.\n\n\n구성 요소               이해관계자 지도는 프로젝트의 특성에 맞게 시각화가 가능하기 때문에 다양하게\n                    제작이 가능하다. 기본적인 구성 요소는 다음과 같다.\n                    • 직접적 이해관계자 & 간접적 이해관계자\n                    • 이해관계자의 유형\n                    • 관계 구성\n                    • 가치 흐름\n\n\n목적                  이해관계자 지도는 서비스의 분석, 기획, 관리, 조정, 개선에 필수적이다. 첫째,\n                    시스템적 관점에서 서비스를 분석함으로써 전체 서비스의 정황 및 이해관계자의\n                    상호 관계에 대해 심도 깊게 이해할 수 있다. 둘째, 다양한 이해관계자 집단의\n                    요구사항을 파악하여 지속 가능한 서비스를 기획할 수 있다. 이해관계자와의\n                    공 동 창작 (C o- creation) 워 크숍 을 통 해 서 공 통의 이해 를 바 탕으 로 한\n                    실현 가 능하고 적합한 서비스 아이디어를 도출할 수 있다. 셋째, 서비스를\n                    모니터링함으로써 이해관계자 간 가치 흐름과 상호작용 과정에서 발생하는\n                    문제점을 발견하고 해결할 수 있다. 넷째, 이해관계자 간의 이해 상충에 의한\n                    충돌이 발생할 경우 이를 효과적으로 조정하여 긍정적이고 우호적인 관계를\n                    유지할 수 있도록 노력한다. 다섯째, 이해관계자가 함께 공동창작 하여 서비스의\n                    작동 방식을 새롭게 정렬함으로써 효과적인 서비스의 개선이 가능하다.\n\n\n\n\n234 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                          3.1.4 친화도 분석182\n\n정의                        친화도 분 석( Af finit y Diagram) 은 사 용자 조 사 를 통해 도출한 사 실과\n                          인사이트를 유사성(Affinity)에 따라 의미 있게 분류하는 방법이다. 친화도\n                          분석은 고객의 다양한 니즈 중 핵심이 되는 니즈를 선정하여 서비스의 방향성을\n                          구체화하 는 과정이다. 사용자에게 총체적 경험(Holisitc Experience)을\n                          제공하고 혁신적 해결책(Innovative Solution)을 도출하기 위해서 반드시\n                          필요하다.\n\n\n역사                        친화도 분석은 1960년대 일본인 인류학자 지로 카와키타(Jiro Kawakita)가\n                          개발한 KJ 기법(KJ Technique)에서 유래하였다. KJ 기법은 복잡한 아이디어와\n                          정 보 를 일 목 요연 하 게 정리 하 여 합 의 를 도 출 하 는 회 의 기법이 다. 회 의\n                          참석자들은 각자 자신의 머릿속에 있는 정보를 포스트잇에 적고 유사성에 따라\n                          포스트잇을 분류한 후, 해결해야 할 문제점의 우선순위를 정함으로써 합의를\n                          도출한다. 모든 회의 참석자들은 동등한 입장에서 자신의 생각을 공유하고,\n                          문제를 보다 폭넓은 관점에서 바라보며, 민주적인 방식으로 의사결정에 이른다.\n                          다량의 복잡한 정보를 빠르고 효과적으로 정리할 수 있는 KJ 기법은 방대한\n                          사용자 조사 내용을 정리하는 친화도 분석으로 발전하였다.\n\n\n방법                        사용자 조사의 내용을 귀납적 방법으로 구조화하는 과정이다. 미리 정해 놓은\n                          기준에 따라 사용자 조사 내용을 분류하는 것이 아니라, 사용자 조사의 세부\n                          사항으로부터 디자인의 방향성을 결정하는 상향식 접근법이다. 프로젝트팀원이\n                          함께 모여 합의를 도출하는 것이 바람직하다. 친화도 분석은 다음과 같은 순서로\n                          작성한다.\n\n182\n                          1. 사용자 조사 내용을 포스트잇에 기록한다.\n벨라 마틴, 브루스 해닝턴(2013),\n《디자인방법론 불변의 법칙 100가       사 용자 조 사 에 참 여한 팀원 은 조 사 를 통 해 발견한 사 실 과 인 사 이 트를\n지》, 고려문화사\n                          포스트잇에 기록한다. 하나의 포스트잇에는 하나의 내용만 기록한다. 인터뷰의\n이정주, 이승호(2018), 《새로운 디자\n                          경우, 한 명의 인터뷰 대상자당 50~100개 정도의 포스트잇 작성이 가능하다.\n인 도구들》, 인사이트\n\n\n김진우(2017), 《서비스 경험디자      2. 포스트잇의 내용을 유사성에 따라 그룹핑한다.\n인》, 안그라픽스\n                          사 용자 조 사의 내용 을 유사 성과 연관성에 따라 그룹핑한다. 다른 그룹의\n정재희(2020), 《디자인 싱킹》, 북저\n                          내용과 비교하면서 그룹핑의 과정을 반복한다. 분류가 적절하게 이루어졌는지\n널리즘\n                          확인한다.\n\n\n\n\n                                                             서비스·경험디자인 이론서 235\n\f                    3. 그룹별로 적절한 주제(Header)를 정한다.\n                    그룹핑이 완료되면 각각의 그룹을 대표하는 적절한 주제를 정한다.\n\n                    4. 전체 그룹을 구조화하여 정리한다.\n                    필요할 경우 각각의 그룹을 상위 개념으로 구조화할 수 있다. 전체 내용을\n                    정리하고, 이후 그룹핑의 내용을 바탕으로 아이디어를 도출한다.\n\n\n\n목적                  친화도 분석은 사용자 조사를 통해 수집한 사실과 통찰을 구체화하고 의미 있게\n                    분류하도록 하며, 사용자 조사 데이터를 기반으로 디자인을 진행할 수 있도록\n                    가이드 역할을 한다.\n\n\n\n\n236 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f[ 친화도 분석 예시 ]\n\n\n\n\n                서비스·경험디자인 이론서 237\n\f         Empathy Map, Customer Journey Map,\n         Experience Map, Service Blueprint 비교183\n\n\n더 알아보기\n\ 2 서비스·경험디자인 원칙수립\n\n                    3.2.1 서비스·경험디자인 원칙\n\n                    서비스디자인의 목표는 프로젝트의 모든 과정과 결과물에 일관된 지향점을\n                    제시하 는 것이다. 서비스디자인 네트워크(Service Design Network)는\n                    서비스디자인의 목표를 ‘유용하고 바람직하며 효율적이고 사용 가능한 모든\n                    서비스를 강조하는 것’이라고 하였다. 이전까지 진행한 모든 산출물을 중심으로\n                    핵심 의제를 도출하고, 이를 기반으로 기업의 비전과 사용자 가치를 통합적으로\n                    검토하여 목표를 수립한다. 서비스디자인의 목표는 서비스가 추구하는 핵심\n                    가치를 의미한다. 프로젝트에 참여하는 전체 팀원이 서비스디자인의 목표를\n                    함께 공유하고 공감함으로써 전체 프로젝트를 일관된 방향으로 추진하는 것이\n                    중요하다. 다음은 서비스디자인의 목표를 수립할 때 고려할 사항이다.\n\n\n\n\n                             1. 사용자에게 최선의 가치를 제공하고 있는가?\n                             2. 통합적 관점을 견지하고 있는가?\n                             3. 혁신적 서비스를 지향하고 있는가?\n\n\n\n\n242 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                      서비스디자인의 목표를 일관성 있게 구현하기 위해 서는 구체적인 원칙이\n                      필요하 다. 서비스디자 인의 원칙은 서비스 의 핵 심 가치 를 어떻 게 달성할\n                      것인가에 대한 기준점을 제시해 준다. 고객 및 내부 환경과 외부 환경을 조사\n                      분석하여 핵심 가치와 요구사항을 도출하고 서비스디자인의 목표를 중심으로\n                      3~5가지의 원칙을 도출할 수 있다. 다음은 서비스디자인의 원칙을 수립할 때\n                      고려할 사항이다.\n\n\n\n\n                             1. 사용자에게 긍정적인 경험을 제공하는가?\n                             2. 서비스디자인의 목표에 부합하는가?\n                             3. 아이디어 개발에 도움이 되는가?\n                             4. 차별화되고 혁신적인 전략 방향을 제시하는가?\n                             5. 지속 가능한 가치를 제공하는가?\n\n\n\n\n185                   서비스디자인의 원칙은 내부적인 공감대뿐만 아니라 전체 이해관계자와의\n한국직업능력개발원, 《NCS 서비스\n경험디자인 학습모듈 4》         공감대를 형성하는 것이 중요하다. 이러한 서비스디자인의 원칙은 아이디어\n                      도출에 영감을 주고, 기존 서비스의 강점과 약점을 파악하는 데 도움을 주며,\n                      프로젝트 전 과정을 통해 도출되는 산출물을 평가하는 데 활용된다. 따라서\n                      서비스디자인 원칙은 지속적으로 유지 및 관리되어야 한다.185\n\n\n\n\n                                                     서비스·경험디자인 이론서 243\n\f04\n개발하기 Develop\n아이디어를 발전시키기 위한 워크숍, 공동창작 진행 방법과 서비스디자인을\n발전시키기 위한 프로토타입, 서비스 시나리오 개발 등에 대하여 알아본다.\n\n\n\n\n244 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                  4.1 아이디어 또는 해결책을 모색하는 단계 :\n                                      아이데이션(Ideation)\n\n                                  아이데이션(Ideation)은 idea와 action이 합쳐진 개념으로, 단순히 아이디어 그\n                                  자체가 아닌 아이디어가 만들어지는 과정(The Formation of Idea of Mental\n                                  Images), 즉 새로운 아이디어의 생성(Generation), 발전(Developing),\n                                  커 뮤니케이 션(C o mmunic ation) 등의 과 정 을 아우르는 개념이다. 즉,\n                                  아이데이션은 아이디어를 도출하는 구조화된 과정을 의미하는 것으로, 다양한\n                                  이해관계자와의 공동창작(Co-creation), 퍼실리테이션(Facilitation)의 중요성,\n                                  시각적 사고 등이 중요하게 고려된다.\n\n\n                                  4.1.1 공동창작(Co-creation) 관점의 접근\n\n                                  아이디어 도출 단계에서는 이해관계자와 함께 공동창작을 진행할 수 있다.\n                                  최종 사 용자부터 프 로젝트 기획자, 마 케팅 관계자, 개발자 등 각 단계의\n                                  이해관계자들과 프로젝트의 결과물의 공급, 집행에 영향력이 있는 사람들까지\n                                  다양한 참여자가 협동하여 디자인 과정에 능동적으로 참여하며 깊은 통찰과\n                                  혁신적인 아이디어를 도출한다. 이를 통해 서비스 실제 참여자들의 관심을\n                                  반영하여 자연스럽게 아이디어의 실현 가능성과 미래 지향성의 균형을 이룰\n                                  수 있다. 또한 이해관계자들은 실제로 ‘내부자 지식(Insider Knowledge)’을\n                                  쌓아왔기 때문에 이를 잘 활용하면 아이디어를 즉각적으로 검증할 수 있다.\n\n\n공동창작                              한 개인이 아닌 두 사람 이상의 집단 활동에서 나타나는 창의성을 ‘집단적\n(Co-creation)\n                                  창의성(Collective Creativity)’ 이라고 하 는데, 이러한 집단적 창의성을\n                                  바 탕 으 로 한 전반적인 활 동 을 ‘공 동 창작 (C o - c re ati o n)’이라고 한 다.\n                                  공동창작은 집단의 구성원들이 모두 동등한 위치에서 함께 창조적인 활동을\n                                  하거나 동 등한 위치에서 문제 해결을 위해 창조 적으 로 접근하 는 방법을\n                                  의미한다.\n\n공동디자인                             공동창작의 개념과 활동을 디자인 과정에 적용한 것으로, 사용자를 비롯한\n(Co-design)                       이해 관계 자 들 을 디 자 인 과 정에 적 극 적 으 로 참 여 시켜 결 과 를 도출 하 는\n186                               방 법이다. 공 동디자 인은 전문가의 영역으 로 알려져 있던 디자 인 과 정에\nElizabeth B.0N. Sanders, Pieter\nJan Stappers(2009), <Co-          사용자 그룹의 현장 지식과 고유한 창의력을 적극 활용한다는 점에서 새로운\ncreation and the now landscapes\n                                  패러다임을 제시한다. 리즈 샌더스(Liz Sanders)186는 모든 인간은 창의적이기\nof design>, CoDesign, 4(1), pp.\n5-18                              때문에 사용자와 디자이너가 함께 발상한다면 디자이너는 혼자서 미처 발견하지\n                                  못했던 통찰과 아이디어를 찾을 수 있으며, 좀 더 의미 있는 디자인 결과물을 낼\n                                  수 있다고 하였다.\n\n\n\n                                                                         서비스·경험디자인 이론서 245\n\f공동디자인 워크숍              공동디자인 워크숍은 기존 디자인 과정에 다양한 사람들을 능동적인 참여자로\n(Co-Design Workshop)   초대한다. 사용자가 직접 디자인 과정에 참여한다는 점과 다양한 이해관계자의\n                       상호 이해를 돕는다는 점에서 초기 사용자 중심 디자인과 차별화되는 ‘Co-\n                       Design’ 도구이다. 따라서 공동디자인 워크숍은 시각적 발상 표현법 등을\n                       활용해 참여자들 간의 상호 이해를 도모하고 협력을 통해 함께 아이디어를\n                       만들어 나가도록 도와준다. 일반적으로 다음과 같은 여섯 단계로 진행된다.\n\n\n\n                       1. 워크숍의 목적과 참가자 선정하기\n\n                       - 진행 과제의 목표와 상황에 맞도록 워크숍의 세부 활동을 기획한다.\n                       - 워크숍 날짜, 장소, 시간 등 세부 사항을 정하고, 사용자를 비롯하여 각 분야\n                        전문가나 이해관계자 등의 참여자를 확정하여 섭외한다. 전문가와 비전문가를\n                        포함한 다양한 참여를 적극적으로 고려한다.\n                       - 워크숍의 준비물(발표 자료, 이름표, 워크시트 등)을 준비한다.\n\n\n                       2. 사전 과제로 주제에 대해 민감하게 하기\n\n                       - 워크숍 참여자가 워크숍의 주제에 대해 미리 생각해 보고 자신의 경험을 상기할\n                        수 있도록 ‘사진’ 혹은 ‘그림일기’ 등과 같은 간단한 사전 과제를 줄 수 있다.\n                       - 사전 과제는 다양한 배경의 참여자가 워크숍 공간에 도착하기 전에 미리 주제에\n                        대한 관심도를 높여 효율을 높일 수 있다.\n\n\n                       3. 경험을 공유하고 상호 이해하기\n\n                       - 사전 과제 등을 통해 참여자들이 먼저 자신의 평소 경험과 상황에 충분히\n                        몰입하고 다른 참여자들과 소통함으로써 서로에게 공감하게 하는 과정이\n                        중요하다.\n                       - 자신의 니즈에 대해 명확히 하고, 다른 참여자 들과 커뮤니케이션을 통해\n                        공통적으로 추구하는 지향점과 이해관계자가 충돌하는 지점들을 공감하며\n                        파악해 본다.\n\n\n\n\n246 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f4. 아이디어 생각해 내기\n- 공감된 니즈를 바탕으로 이를 실현해 줄 수 있는 제품이나 서비스에 대한\n 아이디어를 내야 한다.\n- 결과 물의 범위나 워 크숍의 목표에 따 라서 적절한 발상 기법을 선택해\n 활용해야 한다. 이 단계는 틀을 짜고 계획을 ‘구상’하는 것이 아니라 ‘아이디어\n 생각하기’인 만큼 다양한 아이디어를 만들어 내는 발상의 과정과 배경에\n 집중할 필요가 있다.\n\n\n5. 아이디어 발표하고 토론하기\n- 개인이나 팀별로 만든 아이디어들을 공유하고 정리하는 단계이다.\n- 참여자들을 여러 그룹으로 나누어 진행하는 공동디자인 워크숍의 발표와\n 토론의 경우, 그룹 간 아이디어를 공유할 수 있게 한다.\n\n\n6. 워크숍 결과 해석 및 요약하기\n- 워크숍을 마친 후에는 결과물이 표현하고 있는 참여자들의 경험과 이야기,\n 바라는 점들을 살펴보고 해석하여 아이디어를 정리한다.\n\n\n\n\n                               서비스·경험디자인 이론서 247\n\f                    4.1.2 퍼실리테이션(Facilitation)의 중요성\n\n                    다양한 사람이 모여 아이디어를 구성하는 공동창작(Co-creation) 관점에서는\n                    워 크숍과 같은 집단 활동 에 서 원하 는 바 를 달성할 수 있도록 도 와 주 는\n                    퍼 실리테이 션(F acilit ation) 과 이를 이끄는 퍼 실리테이터(F acilit ator,\n                    촉진자/매개자)의 역할이 중요하다. 퍼실리테이터는 단순히 워크숍의 진행을\n                    맡는 사회 자의 역할 만 이 아니라 참 여자 들이 문제 를 해결하도록 돕 는 데\n                    집중한다. 조직의 문제와 비전에 대한 자신의 해결책을 개인이나 집단이 스스로\n                    개발하도록 자극하고 돕거나, 교육 훈련 프로그램의 실행 과정에서 중재 및 조정\n                    역할을 담당하기도 한다.\n\n\n퍼실리테이터              - 참여자들의 경험이 적극적으로 반영될 수 있게 다양한 시도를 장려하고,\n                      서로의 아이디어를 발전시킬 수 있도록 유도해야 한다.\n                    - 사람들이 자유롭게 의견을 내고 충분한 논의를 거쳐 해결책을 이끌어 낼 수\n                      있도록 중립적인 입장을 가져야 한다.\n                    - 일반 참여자 들이 전문가 속에서도 자신들의 이야기와 아이디어를 꺼낼\n                      수 있는 환경을 조성해야 하며, 누구에게나 익숙하고 쉬운 시각화 방법을\n                      고려해야 한다.\n\n\n                    공 동디자 인 워크숍 에서는 다 양 한 이해관계자 들이 모여 단기간 소 통으 로\n                    아이디어를 도출하기 때문에 문제점들이 생기게 된다. 예를 들면, 참여자들이\n                    각자가 가지고 있던 사고의 틀에서 벗어나지 못하거나, 참여자들 간의 배경적\n                    차이로 인해 협력의 불균형, 혹은 의사소통에서 다양한 문제점이 생길 수 있다.\n                    이런 문제를 최소화하기 위해 참여자들은 공동디자인 워크숍에서 다음과 같은\n                    마인드셋(mindset)이 필요하다.\n\n\n\n\n248 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f1. 모든 참여자가 평등하다\n공 동디자 인 워크숍 과 정을 거치면서 같은 조 직에서 온 경우가 아니지만\n참여자들 사이에 암묵적 혹은 명시적인 위계가 형성되거나 혹은 디자이너와\n참여자 사이에 위계가 형성되기도 한다. 하지만 공동 디자인워크숍에서는\n이러한 위계에서 벗어나 동등한 발언 기회를 얻고 동등한 위치에서 아이디어를\n표현할 수 있도록 새로운 환경을 마련하는 것이 좋다.\n\n2. 위계 구조에서는 벗어나되 참여자 개개인의 전문성은 유지한다\n워크숍 에 초대된 참 여자 들 전원이 고유한 개개인의 배경에서 오는 경험,\n전문지식을 서로 이해하고, 공유하고, 아이디어를 떠올리는 것이 주된 목표이다.\n이 과정에서 특별한 환경에 영향을 받아 평소 생각과 다른 이야기를 하거나,\n이야기를 지어내거나 주제에 무관한 이야기를 하는 상황이 생기지 않도록 항상\n주의해야 한다.\n\n3. ‘이게 맞나?’가 아니라 ‘이건 어떨까?’라는 마인드로 접근하기\n공 동디 자 인 워 크숍 에 서는 주로 기존 에 없던 새 로운 상 품 이나 서비스 의\n가능성을 모색하는 것과 같은 열린 목표를 가지는 경우가 많다. 공동디자인\n워크숍에서 전문가의 역할은 현실적 한계점을 내세워 아이디어의 발전 가능성을\n차단하기보다는 혁신 가 능성이 있는 아이디어가 보이면 이를 가 능하게 할\n정보들을 제공해 아이디어가 더욱 실현 가능한 방향으로 확장되게 돕는 것이다.\n\n\n\n\n                                서비스·경험디자인 이론서 249\n\f                    4.1.3 아이데이션 진행 과정\n\n                    분석 활동에서 찾아낸 통찰과 디자인 원칙 등에 근거하여 아이디어를 생성하고\n                    확 장 및 구체 화 한 후 정리하 는 과 정이다. 아 이데이션 활동 을 준비하고 ,\n                    아이디어를 찾고, 우선순위를 정하며, 콘셉트 스케치와 시나리오를 작업하는\n                    과정 등이 필요하다. 항상 모든 작업들은 순차적으로 이루어지는 것이 아니라\n                    순환적인 구조이고, 아이디어나 콘셉트를 다시 살펴보 고 발전하며 필요에\n                    따라서 통찰할 점이나 원칙 등이 수정될 수도 있다.\n\n\n                    아이데이션 1단계 : 기회 영역 만들기\n\n                    기회 영역 만들기 단계는 잠재적인 영역으로 해결책을 모색할 기회가 있고\n                    새로운 아이디어를 만들기 위한 디딤돌의 역할을 하는 단계이다. 앞의 단계에서\n                    발견한 문제점을 해결할 수 있도록 아이디어를 미래 지향적, 생산적인 방향으로\n                    재구성하여 기회 영역으로 만들어 주는 단계이다.\n\n\n                                HMW (How    - '우리가 어떻게 ~를 해결할 수 있을까?'에 대한 질문\n                      1단계       Might We)   - 문제 해결에 중심을 두는 방법\n                      기회영역\n                      만들기                   - '만약에 ~라면 어떨까?'에 대한 질문\n                                What if?\n                                            - 미래의 시나리오 상상에 중심을 두는 방법\n\n\n\n\n문제해결중심              먼저 사용자 여정별 Pain point를 정리하여 인사이트를 도출하고, HMW\nHMW 기법              형식으로 솔루션이 나올 수 있는 질문형으로 바꾸어, 디자인 콘셉트에 해당하는\n                    솔루션 방향으로 구체화시키는 방법론이다.\n\n\n\n\n                    기회 영역 만들기에서 가장 좋은 방법은 ‘우리가 어떻게~?(How Might We,\n                    HMW)’로 시작하는 질문을 던지는 것이다. HMW 질문은 지금까지 사용자가\n                    도출한 기회를 고려하는 기준으로 문제를 해결하는 방법을 찾는 출발점이 된다.\n                    HMW 질문에는 다음과 같은 유의 사항이 있다.\n\n\n\n\n250 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                        ▶ 잠재적인 결론이나 답을 내포한 질문은 제외한다\n                          다양한 문제 해결 가능성을 차단하고 이미 결론을 내놓은 질문은 좋은 질문이\n                          아니다.\n\n                        ▶ 최대한 많은 질문을 만든다\n                          질문을 할 때는 어떤 관점에서 보느냐에 따라 필요 사항이 달라질 수 있다.\n                          때문에 핵심이 되는 사용자, 이해관계자의 관점을 각각 대입하거나 서로 다른\n                          접점을 기준으로 질문을 만들어 변화를 주어야 한다.\n\n                        ▶ 너무 구체적이거나 너무 추상적이지 않게 작성한다\n                          질문이 너무 구체적이면 해결책이 너무 단순해질 수 있으며, 반대로 너무\n                          추상적이면 포괄적인 성격을 띠게 되며 해결책이 쉽게 떠오르지 않을 수 있다.\n                          따라서 생생한 해결책이나 재미있고 기발한 아이디어들이 대답으로 많이 나올\n                          수 있도록 질문을 작성해야 한다.\n\n\n\n                      HMW 형식으로 작성된 여러 질문을 기반으로 앞으로 활용할 디자인 원칙이\n                      완성되었다면, 그 원칙을 활용하여 어떤 내용에 우선순위를 부여할 것인지가\n                      중요하다. 선정된 디자인 원칙을 기준으로 앞으로의 활동이 진행되고 결정\n                      내용에 따라 이후의 활동과 집중해야 할 부분들이 변할 수도 있기 때문이다.\n\n\n미래 가상 시나리오            만약에(What if)는 기존의 제품이나 개념의 제약 및 한계를 뛰어넘어 새로운\n발굴 중심                 해결책을 원할 때 사용하는 방법으로, ‘만약에 ~라면 어떨까?’라는 질문을\n'만약에' 기법 (What if?)\n                      통해 미래의 시나리오를 상상하는 데 초점을 맞춘다. 이를 통해 미래에 일어날\n                      상황을 떠올려 현재의 서비스를 개선할 수 있는 아이디어를 도출할 수 있다.\n                      또한 개발된 서비스가 미래의 잠재적 문제에 잘 적응할 수 있는지 살펴봄으로써\n                      현재 올바르게 진행되고 있는 것이 무엇이고 무엇을 더 개선할 수 있는지에 대해\n                      집중할 수 있도록 돕는 방법이다.\n\n\n\n\n                                                       서비스·경험디자인 이론서 251\n\f                                    아이데이션 2단계 : 해결책 도출하기(아이데이션 방법론)\n\n\n브레인스토밍                              브레인스토밍은 하나의 주제에 대해 참가자들이 자유롭게 의견을 제시하면서\n(Brainstorming)                     아 이디어를 만들어 내는 토론 형식의 아 이디어 개발 기법이다. 자유로운\n                                    분위기 속에서 비판 없이 최대한 많은 아이디어를 도출하는 것이 목적이며,\n                                    다른 사람이 낸 의견에 자신의 의견을 덧붙여 의견을 더욱 발전시키는 사고의\n                                    연상 작용을 기대할 수 있다. 브레인스토밍은 주제에 제한이 없으며 비판을\n                                    자제하고 수용하는 분위기 속에서 진행하며 참가자들이 모두 자유롭게 의견을\n                                    말할 수 있는 분위기를 조성하는 것이 중요하다. 이는 알렉스 오스본(Alex\n                                    F. Osb orn) 이 처 음 소 개한 이후, 산 업 전반 에 서 널리 활용되 고 있다.\n                                    브레인스토밍을 잘 활용하기 위해서는 아래와 같은 충실한 운영 계획 및 규칙이\n                                    필요하다.\n\n\n187\nKelley, T.(2001), 《The art of                          브레인스토밍의 7가지 규칙187\ninnovation: Lessons in creativity\nfrom IDEO》, America's leading         아이디어에 대한 판단은     브 레 인 스 토밍 에 서 는 ‘ 나 쁜 아 이 디어 ’라 는 생 각 은 버리 고\ndesign firm.                                보류한다       아이디어의 좋고 나쁨은 보지 않는다.\n\n\n                                       어이없고 허무맹랑한      비현실적이고 실현 불가능해 보이는 엉뚱한 아이디어들 속에서\n                                     과감한 아이디어를 장려한다    진정한 혁명이 이루어질 때가 있다.\n\n\n                                      다른 사람들의 아이디어를    다른 사람들의 아이디어를 반박하기보다는 더 좋은 아이디어를\n                                       기반으로 발전시킨다      낼 수 있도록 해야 한다.\n\n\n                                                       항상 주제에 집중하여 모든 사람들이 한 공간에서 오로지 주제에\n                                                       대한 생각만을 할 수 있어야 한다.\n                                       주제에 집중해야 한다\n                                                       자 유 롭게 아 이디어 를 낸다 는 것이 아무 생 각 없이 회의 를\n                                                       진행한다는 것은 아니다.\n\n\n                                                       머릿속의 아이디어를 가장 쉽게 구체화하는 것은 시각화하는\n                                     시각적인 표를 활용해야 한다\n                                                       것이다.\n\n\n                                                       경청 은 아 이디어 발전에 중요한 역할 을 하 므 로 한 번에 한\n                                                       개 의 영 역 에 대 해 서 만 이 야기 하 며 서 로 의 의 견 에 주 의 를\n                                       한번에 한 가지씩만\n                                                       집중해야 한다. 다른 사람의 의견을 제대로 활용하기 위해서는\n                                        이야기해야 한다\n                                                       아이디어들에 번호를 매기고 빠짐없이 기록하고 모두가 볼 수\n                                                       있도록 게시해야 한다.\n\n\n\n                                                       가능한 한 많은 양을 발상한다는 원칙에 따라 만들어 낼 수 있는\n                                                       아이디어의 개수를 높게 설정해 두고, 그 이상의 아이디어를\n                                      질보다는 양을 추구한다\n                                                       도출해야 한 다. 질보다 양 을 추 구할 때에는 분명한 목표를\n                                                       가지고 진행해야 한다.\n\n\n\n\n252 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f바디스토밍            머릿속으 로만 상상 하고 글로 적는 것에서 벗어나 몸으 로 직접 표현해 보는\n(Bodystorming)   방법론이다. 서비스의 접점이 특 정한 제품이나 사 물일 경우 간단한 소품 을\n                 활용하여 아이디어를 구현할 수 있으며, 시각적으로 확인하고 체험하며, 미처\n                 생각하지 못했던 현실적인 문제점과 새로운 가 능성들을 발견하도록 해 주는\n                 방법론이다. 물리적으로 직접 상황을 경험하면서 새로운 아이디어와 예기치\n                 못했던 아이디어를 도출할 수 있도록 도와준다.\n\n\n\n\n                                             서비스·경험디자인 이론서 253\n\f만다라트                일본 디자이너 이마이즈미 히로아키(今泉浩晃)가 구상하였으며 Manda(본질의\n(Mandal-Art)        깨달음)+la(달성성취)+Art(기술)의 합성어로 본질을 깨닫는 기술, 목적을\n                    달성하는 기술을 뜻한다. 가장 큰 주제를 세우고 이에 대한 해결점, 아이디어,\n                    생각들을 확산해 나가는 형태로, 생각을 더욱 쉽게 정리하고 한눈에 조합하여\n                    확인할 수 있어 발상을 하거나 목표를 관리하는 데 도움이 된다.\n\n\n\n\n254 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f여섯 색깔 모자 기법           에드워드 드 보노(Edward de Bono)가 만든 방법론으로 하나의 아이디어 또는\n(Six Thinking Hats)   주제에 대해 다양한 관점으로 바라보게 함으로써 창의적인 문제 해결을 돕는\n                      기법이다. 의미가 다른 6개의 모자들을 활용하여 습관적인 사고의 스타일을\n                      벗어나서 다른 관점에서 해결책을 바라볼 수 있도록 하는 방법론이다. 다른\n                      관점에 대해 열린 마음을 가지고, 좀 더 유연한 아이디어를 도출할 수 있는\n                      활동으로 6개의 상상 모자는 6개의 생각의 방향을 상징한다.\n\n\n\n\n                                                     서비스·경험디자인 이론서 255\n\f스캠퍼                 스캠퍼는 아이디어 발상 과정에서 문제 상황을 해결하기 위해서 기존 내용을\n(SCAMPER)           세분화하거나 특 징에 대한 체크리스 트를 만들어 비교 확 인하며 혁신적인\n                    아 이디어를 놓치지 않기 위한 방 법론이다. 스캠퍼는 우 선 체 크리스 트를\n                    활용한 7가지 키워드를 기준으로 생각한 후, 그 결과를 기준으로 더 구체적인\n                    아이디어를 도출해 보는 순서로 진행할 수 있다.\n\n\n\n\n256 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                   아이데이션 3단계: 우선순위를 선정하고 구체화하기\n\n\n188                각각의 기회 영역에서 수많은 아이디어를 도출하였다면 아이디어를 정리한 후\n더알아보기 - 카노 모델 참조\n(P.298)\n                   우선순위 설정하기를 통해 최종적으로 하나의 콘셉트를 선정하기 위한 준비를 한다.\n\n                   ‘더 좋은 아이디어’를 판가름하는 기준은 팀의 상황에 따라 자의적으로 정할\n                   수도 있으나 잠재적인 사용자나 서비스 제공자 혹은 외부의 이해관계자 등의\n                   의견을 들어 보는 것도 큰 도움이 된다. 아이디어의 우선순위 평가 를 위해\n                   우선순위 맵 또는 카노 모델(Kano Model)188 을 활용할 수 있다.\n\n                   우선순위를 정하고 아이디어가 선정되면 아이디어를 다듬는 활동이 필요하다.\n                   이 활동 에 서 가 장 중요한 것은 아 이디어가 의미하 는 바 를 찾는 것이다.\n                   아이디어의 표면적인 내용보다 근본적인 내용을 확인하고 분석 단계의 니즈나\n                   가치를 기준으 로 아 이디어를 살펴봐 야 한 다. 또한, 아 이디어를 구현하며\n                   부딪치게 될 문제점 등 을 정리해야 한다. 아이디어 정리 시트를 이용하여\n                   시각적으로 정리할 수 있다.\n\n\n\n우선순위 지도            사용자의 혜택 수준에 대비하여 실행 가능 여부를 근거로 하여 아이디어 지도를\n                   그리는 것이다. 우선순위 지도는 미래의 실행을 위해서 어떤 아이디어를 가지고\n                   정보에 입각하여 진행 여부를 의사결정 하는 데 도움을 주는 역할을 한다.\n                   우선순위 지도에서 혜택(benefit)과 구현 수준(implement)을 시각화하면\n                   더 쉽게 판단이 가능하며, 일반적으로 구현이 쉽고 혜택이 높은 아이디어를\n                   우선으로 실행한다.\n\n\n\n\n                                                      서비스·경험디자인 이론서 257\n\f아이디어 스케치            아이디어 정리하기는 다듬은 아이디어를 기반으로 아이디어 시트에 정리하는\n                    과정이다. 아이디어 시트에는 기본적으로 아이디어 제목, 요약, 스케치, 기능,\n                    구현 방법 등의 내용들이 들어가야 한다. 이 과정에서는 고객의 니즈를 해결해\n                    줄 수 있는 차별화된 아이디어인지 한 번 더 점검하며, 아이디어 구현을 위해\n                    고려해야 할 기본 내용들을 검토한다.\n\n\n\n\n258 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f아이데이션 4단계: 콘셉트 도출하기\n\n선정된 아이디어는 구체적인 형태와 전달 방법을 반영해 콘셉트로 제안된다.\n콘셉트란 제품이나 서비스가 사용자에게 어떤 경험을 제공할 수 있는지를\n전반적으로 설명하 는 것이다. 일반적으로 콘셉트를 도출할 때 다음과 같은\n원칙을 고려하여 도출한다.\n\n\n\n\n• 통합성(Integrity) : 특 정 콘셉트가 서비스의 특 징을 얼마나 조 화 롭고\n 통합적으로 설명할 수 있는가?\n\n• 차별성(Distinctiveness) : 기존의 서비스나 다른 서비스와 비교할 때 무엇이\n 다르고 이를 얼마나 잘 부각시키고 있는가?\n\n• 사용자 집중성(User focus) : 해당 서비스 콘셉트가 사용자에게 제공하려는\n 것이 사용자의 욕구와 요구에 집중되어 있는가?\n\n\n\n\n                                  서비스·경험디자인 이론서 259\n\f콘셉트 브리프                      콘셉트의 특성을 요약하여 한두장으로 정리한 것이 바로 콘셉트 브리프이다.\n(Concept brief)              콘셉트 브리프는 어떤 서비스를 만들어 나갈 것인지 다양한 이해관계자들과\n                             간단하고 직관적으로 커뮤니케이션을 할 수 있도록 도와주는 도구이다. 말로\n                             풀어서 설명하기보다 하나의 요약된 페이지를 보여 줌으 로써 효과 적으 로\n                             의사소통을 할 수 있다. 콘셉트 브리프는 크게 서비스 가치 제안, 콘셉트 스케치,\n                             서비스 구상 스토리를 포함하여 구성된다.\n\n\n                             서비스 가치 제안(Service Value Proposition)\n\n                             가치 제안(Service Proposition)은 고객이 상품이나 서비스를 구매하는 이유에\n                             대해 제시하는 것으로 서비스를 통해 고객이 얻을 수 있는 가치를 정의하고\n                             제시하는 것을 말한다. 고객에게 필요한 가치를 창조하려면, 정의된 페르소나의\n                             니즈에 부응하는 명확한 요소들이 조합되어야 한다. 고객에게 도움이 되는\n                             가치의 특성은 가격이나 성능 등의 정량적인 것일 수도 있고 고객 경험, 사회적\n                             인정, 디자인 등의 정성적인 것일 수도 있다. 가치 제안의 종류에는 새로움, 가격,\n                             성능, 비용/리스크 절감, 접근성, 편리성/유용성, 고객 맞춤형, 디자인, 브랜드\n                             지위, 사회적 인정 등이 포함된다.\n\n                             가치 제안을 수립할 때는 다음의 세 가지 원칙을 참고하여야 한다.\n\n                             - 공감시키다(Resonate) : 제품이나 서비스가 필요한 이유를 정의하고 고객이\n                              공감할 수 있도록 해야 한다.\n                             - 차별화하다(Differentiate) : 경쟁사가 아닌 자사의 서비스를 선택해야 하는\n                              이유를 제시하여 차별화해야 한다.\n                             - 각인시키다(Imprint) : 기억하기 쉬운 단어들을 사용하여 쉽게 전파되고,\n                              빠르게 이해할 수 있도록 해야 한다.\n\n\n\n\n[ 우버의 가치 제안 예시 ]\n*출처 : https://www.uber.com\n\n\n\n\n260 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                   서비스 콘셉트 스케치(아이디어의 시각화)\n\n                   서비스는 무형적 특성을 가지고 있기 때문에 가시화(Visualization)하는 것이\n                   매우 중요하다. 콘셉트 스케치는 최종 서비스 콘셉트를 시각화·실체화하여\n                   서비스제공물에 대한 아이디어를 구체화하는 과정으로서, 잠재 사용자들에게\n                   제공되는 서비스 가치와 특징을 강조하여 표현해야 한다.\n\n                   콘셉트 스케치는 해결책을 구현하기 위한 시각화 활동 중 문서화 된 초기\n                   결과물로서 추상적이고 모호한 개념을 시각화함으로써 인사이트를 명확하게\n                   정리하고, 빠르게 소통할 수 있으며, 이해관계자들과 효과적인 커뮤니케이션을\n                   할 수 있도록 돕는다. 특히 시각적인 자료는 언어적 자료에 비해 이해와 설득의\n                   효과가 높기 때문에 의사결정권자를 설득하는 데 도움이 된다.\n\n\n                   콘셉트 시나리오(구상 스토리)\n\n                   고객이 현실 상황에서 콘셉트를 어떻게 사용할지 보여주는 과정이다. 가상의\n                   사용자가 이용하게 될 서비스의 전달과정을 생생하고 구체적으로 묘사하고,\n                   상황과 문제점, 제안하는 아이디어를 통해 변화된 상황을 이야기가 되도록 글로\n                   작성함으로써 콘셉트의 내용과 함께 고객의 서비스 활용 맥락을 확인해 볼 수\n                   있다.\n\n\n\n\n[ 콘셉트브리프 형식 예시 ]\n\n\n\n\n                                                  서비스·경험디자인 이론서 261\n\f페르소나 기반              페르소나를 기반으로 시나리오를 만듦으로써 페르소나가 앞으로 디자인될\n서비스 시나리오             제품이나 서비스를 가지고 미래에 어떻게 행동할지에 대한 상세한 그림을 그려볼\n(Service Scenario)\n                     수 있다. 서비스 시나리오는 페르소나의 관점에서 작성하는 것으로 사용자의\n                     시점에서 체계적으로 그들의 경험을 이해할 수 있도록 구성한다.\n\n                     페르소나 기반 시나리오에서는 단계적으로 다른 시나리오를 적용할 수 있다.\n                     다음과 같은 3단계의 시나리오는 후반부로 갈수록 상세한 인터페이스에 초점을\n                     맞춘다.\n\n\n                     1. 정황 시나리오는 사용자의 니즈를 만족시키는 과정을 넓은 시야에서 바라본\n                      큰 그림을 제시하므로 처음 단계에서 사용된다.\n                     2. 제품의 기능과 정보를 모두 결정했다면 디자인 설계도를 제작한다.\n                      이 단계에서는 정황 시나리오도 좀 더 구체화하고 주요 경로 시나리오를\n                      작성함으로써 사용자가 제품을 활용하는 과정을 좀 더 자세하게 소개한다.\n                     3. 디자인을 발전시키는 과정에서 제품이 올바르게 제작되고 있는지 점검할\n                      필요가 있다. 다양한 상황의 문제점을 포괄할 수 있도록 점검 시나리오를\n                      활용한다.\n\n\n                     정황 시나리오\n                     페르 소나의 시각으 로 이 상적인 경험의 순서를 기술하 는 것이다. 가 능한\n                     현실적인 아이디어로 기술하되 기술 자체보다는 그 기술로 무엇이 가능한지를\n                     표현하는 데 초점을 맞추어야 한다. 기술에 매여 페르소나가 원하는 이상적인\n                     경험을 표현하지 못할 수도 있기 때문이다.\n\n                     주요 경로 시나리오\n                     주요 경로 시나리오는 맥락 시나리오에서 크게 잡힌 경험의 흐름을 사용자가\n                     제품이나 서비스를 활용하는 과정에 집중해서 치밀하게 기술하는 것을 말한다.\n                     페르소나가 제품이나 서비스를 이용해 목적을 달성해 나가는 과정을 그려보면서\n                     단계마다 디자인 요구사항을 실제 방안으로 구체화해 나간다.\n\n                     검증 시나리오\n                     검증 시나리오는 맥락 시나리오와 주요 경로 시나리오에서 제안된 해결안에서\n                     다양하게 나타날 수 있는 문제점들을 집중적으로 짚어보고 어떻게 하면 그것을\n                     피할 수 있는지, 혹은 해결할 수 있는지 미리 예측하는 데 도움을 준다. 이때\n                     주요 이해관계자를 참여시켜서 조언을 구하는 것이 중요하다.\n\n\n\n\n262 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                     4.2 서비스·경험 구조화 및 설계\n\n                                     4.2.1 서비스 접점과 구성 요소\n\n                                     서비스 접점(Service Touch Point)은 스페인 투우 용어에서 유래된 말로\n                                     ‘Moment of Truth’의 머리글자를 따서 MOT라고도 불리며, 고객이 기업과\n                                     서비스를 만나는 과정에서 거치는 물리적인 것, 인적 상호작용, 커뮤니케이션\n                                     등의 모든 것을 말한다. 사용자가 서비스와 상호작용하는 서비스 접점(Touch\n                                     Point)을 발견하는 것은 매우 중요하다.\n\n                                     서비스 접점(Touch Point)은 실제 대면하게 되는 직원으로부터 제공받는\n                                     웹사이트를 통한 가 상의 인터랙션이나 실제 매장에서의 물리적 체험 등에\n                                     이르기까지 다양한 형태일 수 있다. 서비스 접점(Touch Point)을 파악하는 것은\n                                     서비스를 제공하면서 사용할 수 있는 자원이나 만들어야 할 자원들을 이해할\n                                     수 있게 한다. 물리적 위치, 서비스가 이루어지는 특정 장소, 광고판, 오브젝트,\n                                     웹사이트, 메일링, 대면 커뮤니케이션, 인쇄, 커뮤니케이션 애플리케이션 등이\n                                     대표적인 서비스 접점(Touch Point)이라 할 수 있다.\n\n\n\n\n189\nDavis, S. M., & Dunn, M(2002),\n《Building the brand driven\nbusiness : Operationalize your\nbrand to drive profitable growth》,\nSan Francisco, CA: Jossey-Bass\n\n\n                                                        [ Touchpoint wheel189 ]\n\n\n\n\n                                                                                  서비스·경험디자인 이론서 263\n\f서비스 터치포인트           서비스 터치포인트 매트릭스(Touch Point Matrix)는 고객이 브랜드와 접촉할\n매트릭스                수 있는 모든 장소와 경험 여정의 목록을 작성하여 고객의 접점을 파악하기\n                    위한 도구이다. 서비스 경험 여정별 사용자가 경험하는 다양한 접점의 요소들을\n                    매트릭스로 구조화하여 분석함으로써 서비스 접점에서 사용자에게 효과적\n                    경험을 제공할 수 있도록 매체전략을 설정할 수 있다.\n\n\n\n\n264 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f4.2.2 서비스 설계 : 콘셉트의 가시화\n\n서비스 콘셉트의 성공 여부는 새로운 서비스가 지속될 수 있는 운영모델을\n디 자 인 하 는 것 에 달 려 있다. 따 라 서 서비 스 콘 셉 트를 기반 으 로 각\n이해관계자 들의 역할과 교환 가치를 정의하고 서비스가 실제 적용될 경우\n서비스 흐름을 가시화하는 것은 중요하다.\n\n서비스 콘셉트에 관련된 주요 행위 주체를 파악해야 하며, 서비스를 통해\n고객에게 전달할 수 있는 가치를 명시해야 한다. 고객에게 가치가 제공되는\n전체 흐름을 파악한 뒤에는 이를 실현하기 위해 어느 정도의 비용과 자원이\n투입되어야 하는지, 누가 예산을 투입할 것인지, 각각의 이해관계자들은 어떤\n가치를 어떻게 지불할 것인지 고려해야 한다. 즉, 서비스의 흐름을 가시화하기\n위해서는 최종 사용자에게 제공되는 고객가치가 어떻게 전달되는지, 그리고 그\n가치를 전달하는 이해관계자들에게는 어떤 혜택이 제공되는지가 통합적으로\n고려되어야 한다.\n\n\n\n\n                                서비스·경험디자인 이론서 265\n\f서비스 가치 흐름도             여러 가지 추상적 콘셉트들 사이의 관계를 보여주는 다이어그램으로 시스템을\n(System map)           묘사하여 서비스 솔루션의 구현을 설명하기 위한 툴이다. 서비스 가치 흐름도는\n                       서비스 제공 조직의 관점에서, 제공(서비스) 시스템의 주요 ‘행위자(actors)’를\n                       개략적으로 나타낸 것이다. 행위자는 사용자, 직원, 부서 및 외부 제공업체를\n                       포함한 조직의 내부 조직 및 외부 조직으로 구성되며, 픽토그램 등의 시각적\n                       표현을 사용하여 나타낸다. 선과 화살표는 여러 행위자들 사이의 다른 관계와\n                       (정보, 재정적, 육체적 또는 노동 기반의)흐름을 나타내며 서로 다른 행위자들을\n                       연결한다.\n\n\n                       이해관계자 지도(Stakeholder Map)가 서비스 와 관련된 이해관계자의\n                       영향 관계를 중심으로 서비스의 흐름을 알 수 있는 도구라면, 서비스 가치\n                       흐름도는 서비스의 흐름과 구조에 좀 더 집중하여, 현재와 미래의 서비스의\n                       흐름 을 식별하 는 데 유 용하다. 서비스 가치 흐름도는 다 양 한 산업군에서\n                       자신들의 서비스의 흐름과, 이해관계자들의 역할을 표현하기 위해서 다양하게\n                       활용된다. 이를 통해 서비스에 관련된 사람들이 적시에 필요한 지점에 연결되는\n                       네트워크를 구축할 수 있다.\n\n\n\n\n190\n김상아 외 (2021). 시각장애인의\n오프라인 쇼핑경험향상을 위한 서\n비스시나리오 제안 연구 -삶의 질\n향상을 위한 기술융합 서비스를 중\n심으로-.커뮤니케이션 디자인학연\n구, 77(0), 66-81.\n\n\n\n\n                        [ 시각장애인의 쇼핑경험 향상을 위한 서비스디자인의 시스템맵 예시190 ]\n\n\n\n\n266 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                             Bryce Glass가 2005년에 제안한 Flickr 모델 다이어그램은 생태계와 잘 알려진\n                             사진 공유 서비스의 잠재력을 설명한다. 이는 색상, 크기, 및 시각화를 활용하여\n                             시스템을 이해하는 데 도움을 주고 있다.\n\n\n\n191\nRetrieved from http://www.\nser vicedesigntools.org/\ntools/28\n\n\n\n\n                             [ 플리커 사용자 모델 시스탬맵191 ]\n\n\n\n\n192\n이민화 외 (2020). 지역의 상생 가\n치창출을 위한 지자체-학교-기업\n연계형 패션창업 시스템 개발 - 코\n크리에이션 기반의 서비스디자인\n방법론을 활용하여-. 기초조형학\n연구, 21(4), 309-334.\n\n\n\n\n                             [지역의 상생가치 창출을 위한 지자체-학교-기업 연계형 패션창업 시스템 개발을 위한 시스탬맵192 ]\n\n\n\n\n                                                                      서비스·경험디자인 이론서 267\n\f                            4.3 프로토타입 개발\n\n                            4.3.1 프로토타입에 대한 이해\n\n                            프 로 토 타 입 은 사 전 적 으 로 원 형 , 견 본 또 는 이 것 을 만 들 어내 는 행 위 를\n                            의미하며, 적용 분야에 따라 여러 가지 형태로 구체화 된다. 디자인 분야에서는\n                            프로토타입을 ‘최종 결과물 이전에 만들어지는 디자인의 재현물들’로 정의한다.\n                            프 로 토타 입 을 사 용 하 는 대 표 적인 디 자 인 분 야 는 제 품 디 자 인, 사 용자\n                            인터페이스/사용자 경험디자인, 서비스디자인 등이 있다. 최종 제품/서비스의\n                            특 징을 재현하여 확 인하고 평가한 후 수정 보완하 는 반복 적 과 정을 통해\n                            더 나은 최종 결과 물이 나오 도록 한다는 점에서 분야가 다르더라도 모든\n                            프로토타이핑의 목적은 동일할 수 있다. 다만 분야별로 각각 다음과 같은 특징과\n                            차이점을 갖고 있다.\n\n\n\n      Product Prototyping                UI/UX Prototyping     Service Design Prototyping\n\n\n                                                             물리적 제품이나 화면 등, 서비스\n  디자인 대상 제품의 목업(mock-up)을 만드는 것으로                            이해관계자들이 개발된 서비스 컨셉\n  제품의 외관, 사용성 등을 종합적으로 확인하고 테스트하기 위해 사용된다.                   시나리오대로 행동 하는 과정을 통해\n                                                             서비스의 컨셉을 확인하고 검증할 수 있다.\n\n\n  제품의 디자인을 설계적으로 평가해                                         사용자가 서비스를 경험하는 연속적인\n  볼 수 있으며, 렌더링 등 평면상에서             화면(스크린)과 사람과의 상호작용을       시간을 테스트하는 것이며, 실제\n  파악하기 어려운 문제점을 보다                 확인하고 테스트할 수 있다.           모든 서비스 경험을 테스트 하는 것을\n  정확하게 파악할 수 있다.                                             말한다.\n\n\n\n\n                            일반적으로 프로토타이핑은 다음과 같은 3가지 목적을 가지고 실행된다.\n\n                            1. 아이디어 생성(Idea generation)\n                            프로토타입을 통해 새로운 아이디어를 얻거나 생성할 수 있고, 사용자가 실제\n                            수행하는 행위를 보면서 의미 있는 정보를 얻을 수 있다. 여러 디자인 아이디어를\n                            시도해 문제를 해결하는 데 가능한 대안을 모색하고 개발할 수 있다.\n\n                            2. 의사소통(Communication)\n                            개발자(디자이너, 엔지니어, 마케터)들과 사용자(고객)간의 소통을 원활하게\n                            한다. 서비스 이해관계자 및 고객의 추가적인 니즈와 불편 등을 파악하고\n                            서비스를 개선하는데 활용된다. 커뮤니케이션을 활성화하여 디자이너와 개발자,\n                            사용자가 서로 의견을 공유하는데 도움을 준다.\n\n\n\n\n268 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f3. 평가(Evaluation)\n프로토타입을 통해 서비스 과정을 수행하도록 하여 서비스의 사용 절차에\n문제가 없는지 더 개선할 수 있는 점들은 무엇인지를 평가해 볼 수 있다. 디자인\n프로세스를 거치는 동안에 다양한 방식으로 반복적으로 테스트할 수 있기\n때문에 평가 및 검증을 위한 도구의 역할을 한다.\n\n\n\n4.3.2 서비스 프로토타이핑의 이해\n\n서비스디자인 과정에서 제시된 서비스 콘셉트를 다양하게 구현하여 서비스의\n실행 가능성 등을 테스트할 수 있는 방법이다. 경험 프로토타입은 디자인된\n서비스의 상품, 장소 또는 시스템에 대한 사용 경험을 미리 이해하고, 분석하고,\n소 통하기 위한 것으 로, 어떠한 방식으 로 도 표현될 수 있다. 서비스 경험\n프 로 토타 이핑은 다 양 한 이해관계자의 생각과 창의적 의견을 적극적으 로\n반 영하고 발전시켜 더 가치 있는 경험을 고객에게 제공하기 위한 노력의\n과 정이다. 실행을 위해 서는 크 게 고객 여정, 참가자, 프 로 토타 입 소 품이\n준비되야 하며, 진행 순서는 다음과 같다.\n\n1. 프로토타입(Prototype)을 어떤 형태로 전달할지 콘셉트, 일정, 예산 등을\n  논의해 정한다.\n2. 고객 여정과 서비스 콘셉트(Service Concept)를 프 로 토타 입에 어떻게\n  반영할지 정리한다.\n3. 서비스를 현실화하는 데 필요한 소품을 만들고 공간을 구성한다.\n4. 프로젝트 목적에 맞는 참여자를 모집해 서비스와 서비스 접점(Touchpoint)이\n  어떤 경험을 만드는지 체험하고 평가하는 활동을 한다.\n5. 참여자들의 피드백 내용을 분석해 개선이 필요한 부분을 찾고 수정한다.\n\n\n구체적으로 서비스 경험 프로토타입 평가를 통해 확인하고자 하는 체크리스트는\n다음과 같다.\n\n• 사람들이 서비스를 이해하는가? - 즉 새로운 서비스는 무엇이며 무엇을 하는가?\n• 사람들이 그들의 삶 속에서 서비스의 가치를 찾아내는가?\n• 사람들이 서비스 사용 방법을 이해하는가?\n• 어떤 접점들이 서비스를 제공하는 데 중심이 되는가?\n• 서비스의 시각적 요소들이 잘 작동하는가?\n• 언어 및 용어 사용이 적절한가?\n• 서비스 향상을 위해 경험 프로토타입 참가자들이 어떤 아이디어들을 가지고\n 있는가?\n\n\n\n                                 서비스·경험디자인 이론서 269\n\f                         4.3.3 프로토타입의 유형 분류\n\n                         서비스디자인 프로토타입은 다양한 형태로 구현되는데, 크게 최종 결과물과의\n                         유사성, 기능 범위 및 정도, 디자인 대상에 따라 분류해 볼 수 있다.\n\n\n\n\n최종 결과물과                  디자인 프로세스에서 최종 결과물과의 유사 정도, 즉 프로토타입의 완성도에\n유사성에 따른 분류               따라 분류가 가 능하다. 낮은 완성도(Low fidelity)의 프 로 토타입은 최종\n(Low and High Fidelity\n                         제품과 기본적인 속성, 즉 크기와 무게 등의 유사성이 낮은 모델을 말하며,\nPrototypes)\n                         전통적인 디자인 프로세스의 스케치와 초기 서비스 스토리보드 등도 이와 같은\n                         분류에 속한다고 할 수 있다. 또한 서비스디자인 프로세스의 어느 단계에서\n                         프로토타이핑을 하느냐에 따라 서비스디자인 프로토타이핑의 활용 목적과\n                         충실도(Fidelity), 제작 효율에 따른 도구가 달라진다. 프로세스의 단계는 초기와\n                         후기로 구분하며, 충실도의 차이에 따라 초기의 경우 Lo-fi(Low-Fidelity),\n                         후기의 경우 Hi-fi(High Fidelity) 프로토타입으로 제작한다.\n\n                         • 초기 서비스디자인 프로토타이핑의 경우 낮은 충실도(Low-Fidelity)로\n                          신속하게(High-speed) 제작되며, 서비스 콘셉트를 검토하고 테스트하는\n                          것이 목 적이다. 이 경우, 프 로 토타 이핑 시 서비스 이해 관계 자 들 간의\n                          상호작용을 통해 서비스 콘셉트를 더욱 발전시킬 수 있다.\n                         • 후기 서비스디자인 프로토타이핑의 경우 충실도가 높으며(High-Fidelity),\n                          시간이 걸리더라도(Low-Speed) 상세하게 서비스를 테스트할 수 있도록\n                          정교한 작업을 지향한다. 완성된 서비스 콘셉트를 효과적으로 전달하고\n                          검증하기 위한 목적으로 진행된다.\n\n\n\n\n270 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f프로토타입의 기능 범위               세 부 적이지 는 않 지만 다 양 한 기능과 콘 셉 트를 포함 하 여 최 종 결과 물 을\n및 정도에 따른 분류                전반적으 로 예 상 해 볼 수 있는 프 로 토타 입을 수평적(horizontal)\n(Horizontal and Vertical\n                           프로토타입이라고 하며, 몇몇의 소수 기능들을 세부적인 수준까지 구현하여\nPrototyping)\n                           보다 정밀한 상황을 예측 혹은 검증할 수 있는 프로토타입을 수직적(vertical)\n                           프로토타입이라 한다. 수평적 프로토타입의 경우, 세부적이지는 않지만 다양한\n                           기능을 포함하여 최종 결과 물의 전반적인 기능을 예상할 수 있다. 수직적\n                           프로토타입의 경우 소수 기능들을 세부적인 수준까지 구현하여 정밀한 상황을\n                           예측하거나 검증할 수 있다.\n\n\n\n\n디자인 대상에 따른                 디자인 대상에 따라 다양한 프로토타이핑 방법들이 활용된다. 가구, 생활용품\n분류                         등 자체적 인터랙션이 거의 없는 디자인 과정에는 스케치, 컴퓨터를 활용한\n                           3D 모델링, 제품 모형 등의 전통적인 하드웨어 중심의 프로토타이핑 방법들이\n                           사용된다. 반면 소프트웨어 중심의 제품, 예를 들면 멀티미디어 타이틀, 웹\n                           사이트, 게임 등을 제작할 때에는 페이퍼 프로토타이핑 또는 멀티미디어 제작\n                           환경을 통한 프로토타이핑이 유용하게 활용될 수 있다.\n\n\n\n\n        종이 Prototype                디지털 Prototype           물리적 Prototype\n\n\n  종이로 인터페이스의                    웹에 올리거나 디스크 형태로        물리적 공간들은 사용자가 실제 어떤\n                                사용자에게 전달하여 실행해 보게      장소에 있다고 생각할 수 있도록\n  프로토타입을 만들고\n                                할 수 있다. 개별 소프트웨어나 웹    만들어진다. 실제 제품을 구성하는 것과\n  테스트하여 피드백을 얻는다.\n                                사이트에서 사용자가 최종 제품을      같은 소재를 사용하거나, 나무, 찰흙을\n  시간과 비용을 절감할 수 있다.\n                                실제와 같은 환경에서 테스트해       이용해 만들어 볼 수도 있다.\n                                볼 수 있다.\n\n\n\n\n                                                            서비스·경험디자인 이론서 271\n\f                    4.3.4 서비스·경험 프로토타이핑 방법\n\n                    프 로 토타이핑을 진행하 는 방법은 다 양하다. 어떠한 도구 를 활용하 는가 에\n                    따라 차 이가 있으며, 가 장 중요한 것은 어떠한 목 적으 로 프 로 토타이핑을\n                    진행하 는가이다. 디자인 초기 단계에서는 아이데이션을 위한 Lo-fi(Low-\n                    Fidelity) 프로토타이핑 방법이 많이 활용되며, 디자인 후기 단계로 갈수록\n                    평가를 목적으로 한 Hi-fi(High-Fidelity)의 프로토타이핑 방법이 적용된다.\n\n\n\n\n                    [ 활용 시기 및 완성도에 따른 프로토타이핑 방법론 매핑 ]\n\n\n\n\n272 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f페이퍼                   종이와 펜으로 제작과 피드백을 하는 활동이다. 언제 어디서든 종이와\n프로토타이핑                펜만으로 간단히 시작하여 실행이 쉽고 빠르며, 피드백 반영이 용이하기\n(Paper Prototyping)\n                      때문에 디자인 초기 단계부터 여러 차례 테스트해 볼 수 있으며, 팀의\n                      아이디어 논의 과정을 더 수월하게 한다.\n\n                      종이 위에 웹 인터페이스, 인터랙션, 제품 및 서비스의 특정한 순간을 종이\n                      한 장 한 장에 개략도로 그리고, 이를 보는 사람들이 특정한 순서에 따라\n                      넘겨보며 테스트할 수 있다. 긍정적이거나 어려움을 느끼는 부분들에\n                      대해서는 의견을 직접 표시하거나 주석으로 기록할 수 있다. 인터페이스적\n                      요소들을 미리 출력하여 변화가 있는 부분에 접착식 메모지를 활용하여\n                      쉽게 교체하며 피드백을 얻을 수 있다.\n\n                      또한, 사 용자의 환경이나 배경을 실제 이미지 로 출력 및 인화 하 여\n                      서비스를 표현할 수도 있으며, 공 간 을 구 성할 때도 응 용 된다. 이는\n                      2D뿐만이 아니라, 3D를 구현할 때도 활용될 수 있는데, 큰 박스나 두꺼운\n                      종이를 이용하여 실제 서비스 환경처럼 구현할 수도 있다.\n\n\n\n\n[ 페이퍼 프로토타입의 다양한 예시 ]\n\n\n\n\n                                                    서비스·경험디자인 이론서 273\n\f서비스 스토리보드              서비스 스 토리보 드는 어떤 사건의 특 정 상황 을 그림이나 사 진을 이용해\n(Service Storyboard)   시각화한 것으로, 이를 이용해 새로운 서비스의 프로토타입을 가상으로 실행해\n                       볼 수 있다. 서비스 스토리보드는 시나리오를 기반으로 스케치나 사진 등의\n                       이미지를 활용해 사용자가 서비스를 활용하는 과정을 구현하며, 각 서비스\n                       단계별 서비스 제공자의 대사나 행동 등 을 기술한다. 일반적으 로 서비스\n                       스토리보드의 기본적인 이야기 구성은 설정(사용자와 문제의 소개), 대립(문제\n                       발생 상황과 해결 아이디어의 적용), 해결(긍정적인 경험의 변화)의 3단계로\n                       구성된다.\n\n\n\n\n                       [ 서비스 스토리보드 3막 구조 ]\n\n\n\n\n                       서비스 스 토리보 드는 사 용자 들의 경험을 요약한 것으 로 각각의 이야기는\n                       서비스 또는 프로토타입에 관한 특정 관점을 제공한다. 이를 제작하는 과정에서\n                       디자이너는 사용자가 겪게 되는 서비스의 전체적인 흐름을 이해할 수 있다.\n\n\n\n\n274 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f비디오 프로토타이핑            비디오 프로토타이핑은 서비스 스토리보드를 영상물의 형태로 제작한 것으로서\n(Video Prototyping)   서비스 시나리오를 더 극적으로 만들 수 있다. 프로젝트 주제와 영상 촬영 및 편집\n                      기술에 따라 다양한 형태로 제작될 수 있으며, 과거에는 영상 제작을 위해 전문\n                      편집 툴이 필요해 제작이 쉽지 않았으나, 현재는 편집 툴이 간편화되어 쉽게 만들\n                      수 있다. 사용자가 겪게 될 경험을 주의 깊게 살펴볼 수 있고 영상 결과물을 확보할\n                      수 있어 유용하다. 어떤 기기와 편집 툴을 사용할지, 영상에 등장할 배경이나\n                      소품을 어느 정도로 현실감 있게 만들지는 프로젝트의 목적에 따라 정한다. 비디오\n                      프로토타입도 영상 스토리텔링을 위한 일반적인 3막 구조로 구성된다.\n\n\n\n\n                                                    서비스·경험디자인 이론서 275\n\f오즈의 마법사               아직 완성되지 않은 시스템을 설계하거나 프로그램의 인터페이스를 설계하고자\n(Wizard of OZ, WOZ)   할 때, 혹은 현실적으로 불가능한 기술이나 상황이 발생할 경우에 시스템의\n                      목적과 기능에 대한 시나리오를 기반으로 프로토타이핑을 진행하여 발전적인\n                      결과를 도출하는 방법이다.\n\n                      오즈의 마법사 이야기 중 커튼 아래에 있는 등장인물의 모습으로부터 이름을 딴\n                      것으로, 보이지 않는 공간(Behind the Screen)에 마법사(Wizard) 역할을 하는\n                      사람(Human Operator)이 상주하여, 각 수행 업무(Task)마다 상황에 필요한\n                      프로토타이핑을 신속하게 제공함으로써 시스템이나 서비스의 기능을 수행하게\n                      한다.\n\n                      W OZ 방 법에 서 는 두 개 의 컴 퓨 터 시 스 템 역할 이 요구되 는 데 , 하 나 는\n                      퍼실리테이터(Facilitator)로서 인터페이스의 역할을 담당하고, 나머지 하나는\n                      마법사(Wizard)의 역할을 담당한다. 마법사는 일종의 전문가로 실험을 하는\n                      공간의 뒤나 옆에서 레버를 당기거나, 스위치를 누르는 등 각 시나리오를\n                      진행하는 데 필요한 프로토타이핑 요소들을 적절히 제공한다. 특히, 사용자가\n                      경험해 보지 못한 특정의 시스템이나 프로그램의 인터페이스를 조작할 경우,\n                      검색 관련 시스템에 대한 실험을 위해 컴퓨터가 아닌 마법사 역할 담당자가 검색\n                      결과를 만들어서 보여줄 수 있다.\n\n\n\n\n276 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f서비스 시연              연극 리허설처럼 상황 극 형태로 시연해 보면서 시나리오 와 프 로 토타입을\n(Service Staging)   실제로 경험해 보는 방법이다. 고객 여정 시나리오를 시뮬레이션하며 서비스가\n                    현실화되면 생길 수 있는 상황이나 감성적 요인 등에 의한 고객 경험을 관찰할\n                    수 있다. 서비스가 시행될 실제 장소에서 시연하기도 하고, 다양한 이해관계자를\n                    참여시켜 디자인 팀과 함께 서비스의 콘셉트를 시험해 보기도 한다. 참가자들은\n                    고객과 서비스 공급자의 역할을 바꿔가며 상황극을 반복하면서 서비스 콘셉트를\n                    체험하고 어떠한 문제점이 있는지 경험하며 이를 통해 새로운 디자인 안을\n                    발전시킬 수 있다.\n\n\n\n\n                                                 서비스·경험디자인 이론서 277\n\f서비스 모형              책상 위에서 서비스 환경을 작은 모형으로 구현해 실제처럼 재현하여 살펴보는\n(Desktop            방법이다. 실제 크기의 목업이나 소품이 아닌 레고(LEGO)나 종이 인형과 같은\nWalkthrough)\n                    작은 모형으로도 서비스를 충분히 현실적으로 구현할 수 있다. 작은 모형을\n                    활용한 이 방법은 모두에게 익숙하고 이해하기 쉬워 효과적으로 현실화할 수\n                    있으며, 모형 자체가 주는 재미가 있어 적극적인 참여를 유도하기 좋다. 서비스를\n                    시뮬레이션해 보며 역할이나 동선 등 구성 요소나 상황에 변화가 필요할 때도\n                    참여자들의 피드백을 쉽게 적용해 재구성할 수 있으며 반복적으로 구현하기에도\n                    편하다. 각기 다른 장소에서 새로운 아이디어를 시연하여 계속 수정할 수 있으며\n                    서비스 접점을 분석하고 재구성할 수 있다.\n\n\n\n\n278 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f디지털 · 인터랙티브            디지털 기반의 전문 소프트웨어를 활용해 프로토타입을 제작하는 활동이다.\n프로토타이핑                 웹이나 앱 형태로 서비스디자인 결과 를 제공하 는 일이 늘어나면서 다양한\n(Digital Interactive\n                       디지털 툴 을 활용하 여 현실감 있는 프 로 토타입을 활용하 는 경우가 많다.\n Prototyping)\n                       간단히 작업해 프로젝트의 방향성을 확인할 수 있는 툴(Lo-fi 프로토타이핑)과\n                       명령어와 조건문을 통해 완성도를 높여 더 실제에 가까운 모습을 선보이고\n                       반응을 살필 수 있는 툴(Hi-fi 프로토타이핑)이 있다. 주로 프로젝트 초기에는\n                       전자의 방법을, 중반에는 후자의 방법을 사용한다.\n\n                       디지털 프로토타이핑 툴을 활용해 완제품 수준의 프로토타입을 제작할 경우\n                       주의할 점이 있다.\n\n                       • 전문 프로토타이핑 툴을 사용하기 위해서는 시간과 노력이 요구되며 추가\n                        비용이라는 제약이 생길 수 있다.\n                       • 다양한 프로토타이핑 툴 중 프로젝트의 목적, 활용 방안, 학습 난이도를\n                        고려해 적절히 선택해야 한다.\n                       • 의사소통을 위한 목적이 중요할 경우, 지나치게 완성도 높은 프로토타이핑\n                        방법을 활용하면 자칫 생각의 범위를 한정하게 되어 오히려 커뮤니케이션에\n                        애러 요인이 될 수 있다.\n                       • 툴 안에서는 가능한 인터랙션이 실제 개발에서는 구현하기 어려울 수 있다.\n\n\n\n\n하드웨어 프로토타이핑            사 물 인터넷 프 로젝 트 와 같 이 하드웨어가 중요한 경우 에는 피지컬\n(Hardware              컴 퓨 팅 (임 베 디 드 디 바 이 스 프 로 토 타 이 핑 ) 과 디 지 털 제 작 (물 리 디 자 인\nPrototyping)\n                       프 로 토 타 이 핑 ) 을 도입 한 하 드 웨 어 프 로 토 타 입 이 유 용 하 다. 하 드 웨 어\n                       프 로 토타 이핑이 스 케치에 그 치지 않고 동 작 하 는 사 물로 구현될 경우\n                       프로젝트팀과 이해관계자는 좀 더 현실적인 관점에서 해결 방안을 검토하고\n                       피드백을 확보할 수 있다. 또한, 최종 결과물의 생산을 위한 투자나 일정들의\n                       요소를 세부적으로 예측할 수 있다는 장점이 있다.\n\n\n\n\n                                                              서비스·경험디자인 이론서 279\n\f                    4.3.5 프로토타이핑의 필요성과 가치\n\n창의성 극대화             방법론으 로 서 프 로 토타 이핑이 가 진 근 본 적인 가치 중 하 나 는 ‘창의적인\n                    프로세스’라는 것이다. 프로토타이핑 과정을 통해 수백, 수천 가지의 아이디어를\n                    창출해 낼 수 있기 때문이다. 프로토타이핑은 머릿속에서 아이디어를 끄집어내어,\n                    손에 실제로 잡히는, 즉 느낄 수 있고, 경험할 수 있고, 가지고 놀 수 있고,\n                    테스 트할 수 있는 ‘실체’를 만들어 내는 과 정을 도와 준다. 따라서 다 양한\n                    아이디어를 창조하고, 테스 트하면서 해당 소 프 트웨어의 목 적에 정확하게\n                    부합하는 가장 강력한 아이디어를 찾아낼 수 있다.\n\n\n\n커뮤니케이션 오류           프로토타입은 ‘보여주기’와 ‘말하기’보다 한 차원 높은 ‘경험’을 통해 디자인을\n최소화                 이해할 수 있게 도와준다. 프로토타이핑은 요구사양서나 와이어 프레임과는\n                    다르게 ‘말하기’와 ‘보여주기’보다 한 단계 더 나아가 실제로 디자인을 ‘경험’할\n                    수 있도록 도와준다. 프로토타입을 이용해 디자인을 구현하고 동작해 봄으로써\n                    다른 사람들에게 디자인을 더욱 쉽게 이해시킬 수 있으며 문자 중심의 문서보다\n                    오해의 소지가 적으며 해석상의 오류를 줄일 수 있다. 디자이너와 개발자들이\n                    그들의 경험과 지식을 교류하며 프로세스를 진행하고, 디자인 관련 의사결정이\n                    필요할 시, 적임자들로부터 확실한 결론을 이끌어 낼 수 있다.\n\n\n\n시간, 노력, 비용의         프로토타이핑은 때때로 혁신을 추진할 때 시간과 노력, 비용을 절감해 준다는\n최소화                 점에서 생산적인 프로세스라 할 수 있다. 프로토타이핑은 본래의 목적에 좀 더\n                    초점을 잘 맞춘 제품을 만들 수 있게 한다. 목적에 초점이 제대로 맞춰진 제품은\n                    디자인 개발 시 재작업에 들어가는 낭비가 적다. 또한 내용을 빠르게 수정하고\n                    업데이트할 수 있으며 디자인과 개발 과정 중에 발생할 수 있는 실수를 빠르게\n                    찾아내도록 도와준다. 이와 같이 디자인 및 개발 프로세스상의 문제점을 조기\n                    발견할 수 있게 도와줌으로써, 결과적으로 전체 작업의 위험 요소들을 줄여\n                    궁극적으로 재개발 비용을 감소시킬 수 있다.\n\n\n\n\n280 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f05\n전달하기 Deliver\n서비스디자인의 Deliver(전달) 과정은 앞선 아이디어들에 대한\t\t\n다양한 의견을 수렴하여 서비스•경험디자인 과정 동안 만들었던 콘셉트와\n제안들을 명료하게 전달
