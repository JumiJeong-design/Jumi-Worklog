시보 드는\n       대규모 데이터 세트에서 복잡하고 많은 데이터 정보를 하나 이상의 페이지 또는\n       화면에 실시간으로 전달하여 정해진 시간에 더 많은 정보를 볼 수 있고, 이를\n       통해 통찰력을 향상시킬 수 있다는 장점이 있다. 또한 실시간으로 데이터를\n       제공하는 인터랙티브한 대시보드를 이용하면 사용자가 필요에 따라 다양한\n       유형의 데이터를 쉽게 정렬하고 필터링하여 재정렬할 수 있는데, 현재 무슨 일이\n       일어나고 있는지, 왜 그런 일이 일어나고 있는지, 다음에 무슨 일이 일어날지\n       신속하게 파악하는 데에 도움을 준다. 대시보드는 인포그래픽과 마찬가지로\n       적절한 차트의 유형을 사용하여 시각화하는 것이 중요한데, 전략적 마케팅,\n       계획, 진행, 운영 등의 그 목적이 미리 정의되어야 한다. 이렇게 그래프 형태의\n       다양한 차트를 사용할 때는 그 목적에 따라 정확하고 효율적인 차트의 형태를\n       올바르게 선택하는 것이 필요하다. 대시보드에 기본적인 목적인 비교를 위해서는\n       막대, 버블 차트를 사용한다. 선, 영역, 타임라인, 간트 차트는 시간의 흐름에\n       따른 데이터의 변화를 확인하기에 용이하고, 특정 항목이 차지하는 비중을 보기\n       위해서는 파이 차트나 트리 맵을 활용하면 좋다. 데이터의 관계를 확인하기\n       위해서는 산점도 또는 네트워크 시각화 유형으로 표현한다. 지도 시각화 유형은\n       위치 데이터를 포함한 경우에 사용한다.\n\n\n\n\n                                    서비스·경험디자인 이론서 345\n\f[비교, 관계, 분포, 구성 기준에 따른 차트 선택 226]\n\n\n\n\n226\nThe Extreme Presentation™\nMethod © 2020 Andrew\nV. Abela, Dr.Abela @\nExtremePresentation.com\n\n\n\n\n346 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f227                     대시보드 디자인 시에 고려해야 할 사항 227\n제이슨 랜카우 외 2인, 《인포그래픽-\n비주얼스토리텔링의 힘》, 인사이트,\n                        • 순서 : 대시보드 디자인의 스토리를 논리적으로 표현하기 위해서는 콘텐츠\npp. 225-226\n                         순서가 명확해야 한다. 명확한 콘텐츠 순서는 인과 관계를 보여 주어 스토리에\n                         대한 사용자의 이해를 증진시키고, 사용자가 대시보드의 용도를 파악하고\n                         확인하는 데도 도움을 준다.\n\n\n                        • 계층 : 정보를 가중치에 따라 계층화하고 보는 사람들이 알아야 할 가장\n                         중요한 정보를 좌 측 상단 에 배치, 덜 중요한 정보는 우 측 하단 방 향 에\n                         배치하여 시선의 흐름이 자연스럽게 흐르도록 한다. 중요도가 높은 영역은\n                         여백을 주어 다른 콘텐츠와 구분되도록 하고 색이나 폰트를 활용하여 시선을\n                         끌 수 있도록 한다. \t\t\t\t\t\n\n\n                        • 콘텍스트 : 대시보드에서 글자를 적절히 활용하면 사용자가 찾고자 하는\n                         요소와 그 외에 보이는 요소들 사이의 연관 관계를 완벽하게 파악하는 데에\n                         도움이 된다. 각 영역에서 레이블이나 약어의 표준화된 형태는 정보를 보다\n                         쉽고 효과적으로 이해할 수 있도록 한다.\n\n\n\n                        데이터를 표현하는 방식이 관례적으로 데이터를 보여 주는 방식에서 탐색적인\n                        경험으로 점차 변화하고 있다. 사용자가 직접 데이터를 시각화하고 스스로\n                        통찰을 끌어낼 수 있는 인터렉티브한 대시보드는 비즈니스에 영향을 줄 수 있는\n                        중요한 데이터를 강조하는 아주 강력한 접근 방법으로 그 유용성이 증폭되고\n                        있다. 이렇듯 대시보드는 목적에 따라 유형과 활용 방식에 차이를 보이지만\n                        데이터가 내포하고 있는 의미를 찾도록 한다는 궁극적인 목적은 동일하다.\n\n\n                        기존에는 데이터 시각화가 분석 전문가의 능력에 포함되어 있거나 분석 전문가가\n                        데이터를 분석하여 디자이너에게 시각화 작업을 요청하면 그들의 요구에 맞게\n                        디자인적 요소를 가미하여 데이터를 볼 수 있게 만들어 주는 역할 정도였다.\n                        하지만 최근의 경향은 데이터 분석 및 시각화가 특별한 스킬이라기보다는 디자인\n                        결과물에 대한 사용성 평가에 대한 커뮤니케이션 도구로 활용이 되는 경우가\n                        많다.\n\n\n                        디자이너가 데이터를 이해하여 주요 패턴과 통찰력을 얻어 데이터를 어떻게 보여\n                        줄 것인가에 대한 비전을 제시하고, 디자인 결정뿐만 아니라 신사업 발굴과 같은\n                        중요한 비즈니스 결정에 관여할 수 있는 능력이 요구되는 시점이다.\n\n\n\n\n                                                     서비스·경험디자인 이론서 347\n\f         데이터 시각화 - 정보 디자인 - 인포그래픽\n\n\n\n더 알아보기\n                                데이터 시각 화 는 다 양 한 분 야 에 서 활용되 고 있는 커뮤니케이션 방 법의\n                                하나이다. 최근 빅 데이터 기술 시장의 성장과 함께 데이터의 가치와 시각화\n                                기술의 중요성이 부각되면서 데이터의 표현 방식과 수용 방식의 변화가 요구되고\n                                있다. 데이터 시각화는 많은 양의 데이터를 어떻게 활용할 것인가를 시각적으로\n                                표현하는 것으로, 이를 통해 통찰을 얻을 수 있도록 데이터의 연결과 그룹핑,\n                                인터랙션을 이용하여 데이터를 효율적이고 명확하게 제공하는 것이 핵심이다.\n\n                                이러한 시각화 는 데이터 변화 에 대한 통찰을 통해 앞으 로 벌어질 일들 을\n                                미리 예측하고 대처하기 위함인데, 이는 디자이너에게도 요구되는 자질 중의\n                                하나이다. 데이터 분석가가 아닌 디자이너 스스로가 데이터를 다룰 수 있어야\n                                데이터 전문가들과 커뮤니케이션할 수 있고 창의적인 아이디어로 데이터를\n                                어떻게 보여 줄 수 있는가 를 고민하여야 최종 고객과 만날 수 있는 계기가\n                                마련되기 때문이다.\n\n         228\n         김묘영, 《좋아보이는 것들의 비밀》,                         가 공되지 않은 크고 작은 정량적 정보를 인간의 두뇌가 이해하고\n                                 데이터 시각화\n         길벗, pp. 4-5                                  처리하기 쉽도록 노 드의 형태로 시각화한 것으 로 정보형 메시지\n                                 Data Visualization\n                                                      도구 228\n         229\n         강성중, 《정보디자인 교과서》, 안그\n         라픽스, pp. 41-51          정보 시각화\n                                                      한정된 공간에 많은 정보를 효율적 또는 차별적으로 보여 주고자\n                                 Information\n                                                      하거나 목적에 맞게 그래프의 형태로 시각화하는 것\n         230                     Visualization\n         김묘영, 《좋아보이는 것들의 비밀》,\n         길벗, pp. 40-41\n                                 정보디자인\n                                                      사람들이 정보에 쉽게 접근하고 효율적으로 전달하기 위해서 차트나\n                                 Information\n                                                      그래프 등을 활용하여 데이터를 의미 있게 시각화한 것229\n                                 Design\n\n\n                                                      데이터, 정보, 지식을 시각화한 것으로 수집한 정보를 분석, 가공하고\n                                 인포그래픽\n                                                      패턴이나 트렌드를 빠르게 인지할 수 있도록 스 토리텔링과 시각\n                                 Infographic\n                                                      능력을 강화하는 그래픽을 적극적으로 활용하여 표현한 것230\n\n\n\n\n         348 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f231                            데이비드 맥캔들리스(David McCandless)의 좋은 시각화의 핵심 조건231\nRESYST Consortium London\nSchool of Hygiene & Tropical\nMedicine, 2014. DATA\nVISUALISATION, A practical\n                               • 기능(Function) :\t\t\t\nguide to producing effective\nvisualisations for research     트렌드와 패턴을 명확하게 볼 수 있음\ncommunication. RESYST, p.5.    • 형식(Form) : \t\t\t\n                                시각적으 로 매력적이며 주의를 끌 수\n                                있도록 구성\n                               • 무결성(Integrity) : \t\t\n                                데이터를 정확하고 정직하게 묘사\n                               • 흥미로움(Interesting) :\t\t\n                                연관성이 있고, 의미 있는 새로운 정보를\n                                제공\n\n\n\n\n232                            정 보 디자 인에는 정 보 의 시각 화와 인포 그래픽이 혼 재되어 있다. 시각 화\n한국 데이터베이스 진흥원. 데이터\n시각화-시각화                        유형에는 정 보형 메 시지와 설득형 메 시지가 있는데, 인포 그래픽과 정 보\n                               시각화는 설득형 메시지 형태를 가지고 있다. 일반적으로 설득형 메세지는 정보\n                               전달과 사용자의 이해를 넘어 태도나 행동의 변화를 유도한다. 그리고 사용자의\n                               관심을 끌기 위한 설득적 표현 요소를 가미하여, 과장과 의외성, 이야기와\n                               오락성 등 재미 요소로 구성된다.232\n\n\n\n233\n                               인포그래픽의 장점233\n김묘영, 《좋아보이는 것들의 비밀》\n길벗, pp. 52-64\n                               • 흥미 유발       \t\t\t\t\t\n                                효과적인 표현과 심미성을 더한 인포그래픽은 호기심을 자극하고 즉각적으로\n                                사람들의 시선을 사로잡을 수 있다.\n                               • 정보 습득 시간 절감 \t\t\t\t\t\n                                직관적이고 명료하게 시각화된 정보로 이해력을 높여정보 습득 시간을 줄일\n                                수 있다.\n                               • 기억 지속 시간 연장         \t\t\t\t\t\n                                시각 정보는 오랜 시간이 지나도 사람들의 기억이 지속되는 경향이 있다. 듣는\n                                정보는 15%만 기억에 남지만, 이미지와 함께 기억된 정보는 89% 정도 남게\n                                된다고 한다.\n                               • 훌륭한 커뮤니케이션 도구 \t\t\t\t\t\n                                SNS를 통한 확산으로 정보 공유가 보편화되어 짧은 시간에 필요한 정보를\n                                빠르고 광범위하게 확산할 수 있다는 점에서 효과적인 커뮤니케이션 도구라\n                                할 수 있다.\n\n\n\n                                                                서비스·경험디자인 이론서 349\n\f                    6.1.3 보고서 작성의 노하우\n\n                    일반 적 인 보 고 서 작 성 의 노하 우 는 앞 서 설명 하 였지 만, 최 근 에 는 보 다\n                    차별화되고 기존의 형식을 뛰어넘는 창의적인 보고서가 등장하고 있다. 이렇게\n                    차별화되고 경쟁력 있는 보고서를 작성해야 할 때에 필요한 몇 가지 노하우를\n                    기억하면 도움이 된다.\n\n                    보고서는 겉으로 보기에 보고자의 글 쓰는 스킬과 내용, 콘텐츠가 핵심인 것으로\n                    보이지만, 사 실 보고서의 숨은 경쟁력은 눈에 드러나지 않는 측면에 있다.\n                    이것은 빠른 이해를 돕는 논리 구성, 전체 내용의 흐름을 쉽게 파악하게 하는\n                    프레임, 명확한 이유와 증거를 바탕으로 한 논리적 정보의 가시화라는 3가지로\n                    요약되며 이러한 것이 보고서에 체계적으로 녹아들 때 성공적인 보고서가 될\n                    수 있을 것이다. 논리 구성 – 프레임 – 정보 가시화 이 세 가지에 대해 자세히\n                    설명하자면 다음과 같다.\n\n                    우선 전체 보고서의 논리를 구성할 때는 읽는 사람 즉 의사결정자의 입장에서\n                    듣고자 하는 내용에 맞춰 순서를 정하는 것이 중요하다. 서비스 디자이너가\n                    이야기하는 순서와 의사결정자가 듣고자 하는 순서는 다를 수 있으며 이때는\n                    주저하지 말고 의사 결정자가 듣고 자 하 는 순서를 따르는 것이 필요하다.\n                    또한 생각나는 대로 보 고서의 내용을 서술하여 뒤섞이게 해서는 안 된다.\n                    의사결정자의 머릿속에 큰 아웃라인 그림을 그리게 한 후 이에 대한 구체적인\n                    그림을 그릴 수 있도록 논리적인 설명을 할 수 있어야 한다.\n\n                    일반적으로 논리 구성을 위한 6가지의 방법이 있다. 첫째, 피라미드 구조를\n                    활용하여 종속 관계를 명확히 한다. 즉 각각의 내용이 뭐가 앞이고 뒤인지\n                    체계를 세우는 것이다. 둘째, 문장을 쓰고 문단을 쓸 때 1 문단, 1 아이디어를\n                    원칙으 로 한 다. 셋째, 강조점은 처음 에 위치시키는 것이 좋다. 검토 자 는\n                    많은 경우 시간적 제약으로 보고서의 앞을 보고 뒤로 이어지지 않는 경우가\n                    많기 때문에 주요한 강조점은 앞에 배치하는 두괄식 서술을 활용한다. 넷째,\n                    논리적이어야 한다. 현상과 문제, 문제와 근거의 논리에 맞추어 귀납과 연역의\n                    논리를 잘 활용해야 한다. 다섯째, 장황하게 늘어놓지 말고 요점을 분명하게\n                    한다. 항상 넘치는 것은 모자란 것보다 못하다. 여섯째, 의도를 빨리 알아챌 수\n                    있게 한다. 즉 자신이 목표한 결과가 두드러져 보이게 해야 한다.\n\n\n\n\n350 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f[ 논리 구성 Tip ]\n\n\n\n\n논리 구성에 이어 두 번째는 프레임 설정이다. 보고서를 작성할 때 전체 내용의\n흐름을 파악하기 위해서는 프레임 설정을 위한 여러 가지의 유형을 익혀 두는\n것이 필요하다. 프레임 설정은 전체 내용의 흐름을 보여 주는 것이 목적이기\n때문에 내용을 시각화해 추상적 모델로 설명하는 모델 설정의 방법과 테마나\n비유, 이야기를 논리에 덧씌워 이해를 돕는 스토리설정의 방법을 활용할 수\n있다. 스토리 전개를 위해서는 발단, 전개, 결말의 간단한 구조를 구성하는\n것이 핵심이다. 이는 보고서 작성에서 설명한 서론-본론-결론의 3단 구성을\n설정하는 것과 동일하며 서론의 why, 본론의 what, 결론의 how에 해당하는\n내용을 체계화해 프레임을 설정하도록 한다.\n\n마지막으로 논리 구성과 프레임 설정에 이어 정보 가시화가 큰 도움이 된다. 이를\n위해서는 단순화, 스토리, 이해도와 같은 내용적 측면과 배포, 프린트, 가독성,\n쉬운 작성과 같은 형식적 측면을 모두 고려해 효과적으로 정보가 전달될 수\n있도록 하는 것이 필요하다. 줄일 수 있는 것은 최대한 줄이고 논리와 맥락이\n있는 스토리의 구성, 읽는 것만으로 추가적 부연 설명이나 참고 없이 이해\n가능하도록 하고, 나누어 주기 편하고, 인쇄가 용이하며, 읽는 사람의 가독성을\n고려하는 세심한 배려, 여러 사람이 수정하고 공유하며 쉽게 작성할 수 있어야\n함 등과 같은 정보 가시화의 방법은 복잡한 보고서가 쉽게 읽히며 핵심을 잘\n드러나게 하는 손쉬운 7가지 방법이니 꼭 기억하도록 한다.\n\n\n\n\n                              서비스·경험디자인 이론서 351\n\f                    [ 정보 가시화 7개 원칙 ]\n\n\n\n\n                    보고서 작성 시 검토 사항\n\n                    보고서를 작성할 때 도움이 될 몇 가지 검토 사항에 대해 알아보도록 하자.\n                    체크리스 트를 통해 보 고 서를 검토하고 관리한다면 큰 도움이 될 것이다.\n                    완성된 보고서를 최종 퇴고할 때 다음과 같은 내용도 꼭 확인하고 넘어가야\n                    한다. 적절한 어휘 사용과 오탈자의 확인, 그리고 보고서의 전체적인 흐름이\n                    논리적으로 전개되는지 검토하여야 한다. 또한 클라이언트가 해결을 요청한\n                    문제점과 그에 대한 해결 방안이 적절하게 연계되었는지 확인한다. 숫자로\n                    표기되는 부분에 대해서는 오기가 없는지 마지막까지 검토하여야 한다. 도해,\n                    그래프 등 시각화 자료의 통일성 역시 확인하며 이름이나 명칭도 오류가 없도록\n                    한다.\n\n\n\n\n352 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f      구분                      체크리스트                 준수여부\n\n                 · 전반부와 후반부의 문제제기와 해결방안이\n                   논리적으로 일치하는가?\n\n                 · 제안, 기획의 목적에 맞는가?\n   논리성 점검\n\n                 · 실행계획에서 일정의 오류는 없는가?\n\n                 · 해결방안이 현실적이고 구체적인가?\n\n                 · 내용이 전개되는 순서가 논리적인가?\n\n                 · 문장만으로 이해가 되는가?\n\n                 · 용어와 설명이 어려운 부분은 없는가?\n\n                 · 그래프와 도해의 표현은 정확한가?\n   이해도 점검\n                 · 표와 사진으로 보충할 부분은 없는가?\n\n                 · 중요한 내용을 색으로 강조했는가?\n\n                 · 글자 크기는 적당한가?\n\n                 · 첨부되는 자료의 출처는 정확한가?\n\n[ 보고서 작성 Check list ]\n\n\n\n\n그림에서는 보고서 퇴고 시 세부적으로 확인할 수 있는 체크리스트 항목을\n제시하고 있으며 이를 보고서 작성 완료 시 수행하는 검토 작업에서 활용할 수\n있도록 한다. 논리적 점검의 부분에서는 문제와 해결 방안의 논리성, 목적의\n명확성, 일정, 해결 방안의 구체성을 검토하며, 이해도 점검 부분에서는 전체\n내용의 순서, 이해도, 어려운 용어, 그래프와 다이어그램의 정확성을 확인한다.\n표와 사진, 출처, 색상이나 강조체, 첨부 자료 등도 오류를 확인하고 추가하거나\n수정하도록 한다. 마지막으로 상세한 문장의 점검은 여러 사람이 함께 윤독을\n하거나 서로 교차 체크할 수 있도록 한다. 단어와 표현, 간결한 문장, 긍정적\n표현, 중복 단어나 문장, 띄어쓰기, 문장 부호 등 최종 수정을 마친 후 보고서를\n종료하도록 한다.\n\n보고서 최종 검토는 작성자가 아닌 제3자가 실시해야 제안 내용의 전체적인\n흐름과 논지 전개의 적합성을 객관적으로 검토할 수 있다. 특히 오탈자의 경우\n제3자의 눈에 더 잘 드러나기 때문에 과제와 관련이 전혀 없는 타인의 검토를\n거치는 것이 좋다. 하지만 제3자의 검토가 어려워 내부 인력들이 최종 검토를\n추진할 경우 완성된 보고서를 잠시 내려놓고 다음날 객관적인 눈으로 최종\n보고서 내용을 검토하기를 권장한다.\n\n\n\n\n                                           서비스·경험디자인 이론서 353\n\f         서비스 평가 측정 - Triple Bottom Line(TBL)\n\n\n\n더 알아보기\n         234                             지속 가능성의 경영 원칙을 기초로 한 Triple Bottom Line Model은 영국\n         LG경제연구원. 윤여중(2006),\n         Triple Bottom Line.             SustainAbility의 회장 존 엘킹턴(John Elkington)의 개념 모델로 디자인\n\n         235\n                                         결과를 측정하는 데에 매우 유용한 측정 프레임이다. 그는 기업들이 지속 가능을\n         김이석(2011), <지속가능디자인의            위해 지켜야 할 요구 조건으로 세 가지 기본 원칙을 제시하였는데, 첫 번째는\n         프로세스 프레임 도출에 관한 연구 -\n         Triple Bottom Line 지속가능경영       기업의 이익 관점인 경제적 가치(Economic Value), 두 번째로는 그 기업이\n         원칙을 중심으로>, 한국디자인트렌\n         드학회\n                                         얼마나 사회적으로 책임감이 있는지를 보여 주는 사회 자본(Social Equity),\n                                         마지막으 로 기업이 얼마나 환경(Ecosystem Quality)에 대한 책임감이\n                                         있는지를 보여주는 것을 기본으로 한다. 이렇게 기업이 경제적 이익뿐만 아니라\n                                         환경적, 사회적 측면에서도 성과를 판단해야 한다는 통합적 원칙 또는 총체적\n                                         원칙을 정의하였다.234,235\n\n         236                             이 모델은 각 분야의 민간 기업뿐만 아니라 특히 공공 기관과 업무를 진행할\n         앤디폴라인(2013), 《서비스 디자인:\n         실무에서 들춰보는 인사이트》, pp.            때 유용한 것으로, 새로운 서비스를 진행하려면 환경적, 지역적 그리고 사회적\n         246-247\n                                         책임의 중요성이 반드시 고려되어야 한다는 것이다.236\n\n\n         237\n         Elena Avramenko(2018),          TBL을 흔히 3P(Profit, People, Planet)라고 부른다.\n         “Contribute to a better world\n         = Be a successful company.\n                                         • 경제적 보텀 라인은 기업의 목적인 이윤(Profit) 창출에 집중하고 기업의\n         Sustainability in a shared-\n                                          이익뿐만이 아니라 내/외부 이해관계자를 포괄하는 차원에서의 성과 측정(예:\n         economy” (startup,medium.\n         com)                             거버넌스)을 의미\n                                         • 사회 적 보텀 라 인 은 사 람 (Pe o ple) 에 주 목 하고 모든 직원 과 노동자,\n                                          지역사회와 관련한 성과를 측정\n                                         • 지구(Planet)와 관련한 환경적 보텀 라인은 기업의 경영 활동 과정이 얼마나\n                                          환경적으로 지속 가능한지를 보여 줌 237\n\n\n         238\n         Elena Avramenko(2018).\n         Contribute to a better world\n         = Be a successful company.\n         Sustainability in a shared-\n         economy (startup,medium.com)\n\n\n\n\n                                          [ 지속 가능한 비즈니스를 위한 John Elkington’s triple bottom line 238 ]\n\n\n\n\n         354 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f239\nh t t p s : // m e d i u m . c o m / @\nA n a i s k a /c o n t r i b u t e - t o -\na-better-world-be-a-\nsuccessful-company-\nsustainability-in-a-\nshared-economy-star tup-\n50cc72f2e37b ]\n\n\n\n\n                                                 [ John Elkington’s triple bottom line을 이용한 예시 ]\n\n\n\n\n                                             [ John Elkington’s triple bottom line을 이용한 우버(UBER)의 예 239 ]\n\n\n\n\n                                                                                                     서비스·경험디자인 이론서 355\n\f                                 Triple Bottom Line(TBL)과 디자인\n\n240                              Triple Bottom Line은 실제적으로 디자인 프로젝트의 목표를 정의할 때도\n앤디폴라인(2013), 《서비스 디자인:\n실무에서 들춰보는 인사이트》, pp.             유 용하게 사 용되는데, 생각을 넓히게 해 주고 더 나 아가 더 큰 관점으 로\n246-247\n                                 서비스를 관망할 수 있도록 도움을 주기도 한다. 또한 이 모델이 상기시키는\n241                              중요한 부분은 전적으로 숫자로만 평가할 수 없다는 점이다.240\nMary McBride(2011), 《Triple\nBottom Line by Design: Leading\nas if Life Matters》, DMI\n                                 2011년 DMI Review의 ‘Triple Bottom Line by Design: Leading as if\n                                 Life Matters’의 메리 맥브라이드(Mary McBride)에 따르면, Triple Bottom\n                                 Line의 측면을 고려한 디자인은 경제적 가치, 사회적 자본, 환경적 품질을\n                                 개선시켜 기업의 지속 가능성 목표를 발전시키고 기업 경쟁력을 향상시킬 수\n                                 있다고 한다. 제품과 서비스에만 디자인이 적용되는 것이 아니라 기업 전략과\n                                 디자인 프로세스가 경영의 차원에서 전략적으로 활용될 때 세 가지 요소인\n                                 환경, 경제, 사회적 가치에 대한 목표가 이루어지고 그 경쟁력이 강화된다고\n                                 주장하였는데, 이를 TBLD(Triple Bottom Line by Design)라 한다. TBLD는\n                                 정책, 프로세스, 서비스 및 제품 등이 조직을 활성화하 는 데 도움을 줄 수\n                                 있으며, 생태계(ecosystem)와 커뮤니티(community)는 이익을 얻을 수 있어\n                                 가치를 더할 수 있도록 해준다.241\n\n                                 유의미한 디자인 측정은 서비스와 제공자의 환경, 다양한 이해관계자에 의해\n                                 결정된다. 서비스디자인은 단순한 제품보다는 더 많은 사람들과의 다양한\n                                 접점을 포함하므로 광범위한 활동 영역을 평가하 는 TBL(Triple Bottom\n                                 Line)을 채택하면 유용하게 활용될 수 있다.\n\n\n\n\n356 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\fESG 경영\n\n\n\n                                                                                      더 알아보기\n242                        ESG는 환경(Environmental), 사회(Social), 지배구조(Governance)의\n김재필(2021), 《ESG혁명이 온다》,\n한스미디어, pp. 24-28           앞 글자를 딴 용어로 기업의 비재무적 성과를 측정하는 지표이다. 242 기업이\n                           환경보호와 사회적 약자 보호에 힘쓰고, 사회를 위한 배려 등 법과 윤리를\n                           준수하는 활동 등에 도전하고 변화를 꾀해야 한다는 것이다.\n\n\n\n\n[ ESG구성의 3요소 243 ]\n\n\n\n243                        ESG와 CSR의 차이\n김재필(2021), 《ESG혁명이 온다》,\n한스미디어, p. 28\n                           지속 가능한 발전을 구상하며 기업의 활동이 환경과 사회에 영향을 미치고, 이를\n244                        위해 끊임없이 이해관계자들과 소통한다는 점에서 ESG와 CSR(기업의 사회적\n김재필(2021), 《ESG혁명이 온다》,\n한스미디어, p. 83               책임)은 비슷한 부분이 많다. ESG의 개념은 CSR에 그 뿌리를 두고 있고 CSR이\n                           없었다면 ESG도 없었겠지만, 그렇다고 두 개념이 상호 교환적 존재는 아니다.\n                           CSR은 사회적 책임을 완수하기 위한 활동으로 비즈니스를 책임감 있게 만드는\n                           것이라면, ESG는 그 노력을 측정 가능하도록 하게 한다.244\n\n\n                     ESG                                         CSR\n\n          기업 활동 전반에 친환경,\n                                                   기업의 사회적 책임을 의미, 사회에 기여하고자 하는\n       사회적 책임, 지배구조 개선 등을 도입,             의미, 목적\n                                                       목적으로 진행되는 기업의 부가 활동\n           지속 가능한 발전 도모\n\n      기업 경영, 재무 활동에 ESG 요소를 연동            실행 방법    봉사, 기부 및 사회공헌 프로그램 등을 운영하며 가치 실현\n\n       주주, 잠재적 투자자, 투자 매체에 영향,                      소비자, NGO, 임직원 등에 긍정적 이미지 부여,\n                                          단기적 효과\n               ESG 현황을 지수로 발표                             충성도 및 기업 이미지 상승\n\n         기업의 재무 안전성으로 이루어짐                장기적 효과     기업의 평판 향상에 도움, 매출증대에도 기여\n\n\n\n                                                                서비스·경험디자인 이론서 357\n\f245                                 전 세계적으로 많은 기업들이 ESG를 핵심 가치로 꼽고 있고, 미래의 기술 혁신\n전혜진, \"CES 2021, 신기술보\n다 중요하게 다뤄진 ESG 테마\",                 및 서비스와 ESG를 결합하는 사례들이 많아지고 있다.\nESG경제, 2021.2.8., http://\nwww.esgeconomy.com/news/\narticleView.html?idxno=170\n\n\n246\n최연정, \"[2021 경영 트렌드]\nESG 경영, 'ESG' 사례 해외편\",\nWORLDYODAY, 2021.5.21., http://\nwww.iworldtoday.com/news/\narticleView.html?idxno=401759\n\n\n\n\n            기업명                                            추진 계획 내용\n\n\n                                  업사이클링 친환경 프로그램\n                                  • 업사이클링 개념을 도입해 TV 포장 박스를 반려동물의 놀이터나 소형 가구로 변경할 수 있는\n           삼성전자\n                                   에코 패키지’로 사용할 수 있도록 디자인해 질적 환경적 가치를 향상시킴\n                                  • 세탁기·건조기 등에 들어가는 물과 전기를 아끼는 인공지능(AI) 기술을 개발\n\n\n\n\n                                  친환경 소재와 재생 플라스틱 비중 확대\n                                  • LG TV의 디스플레이는 새집증후군 유발 물질을 반으로 줄이고, 발암물질 등의 유해 물질을\n            LG전자                   적용하지 않으며, 자원의 효율성과 친환경 인증을 받은 패널을 적용\n                                  • 사운드 바의 경우, 재생 플라스틱과 폐페트병 등의 재활용 소재로 사용하고, 포장 제품 역시\n                                   친환경 소재로 점차적으로 확대 변경\n\n\n\n\n                                  주유소 거점 드론 택배와 이동의 효율성 높임\n                                  • 친환경 미래 운송 수단의 운용거점으로 활용하여 탄소를 효율적으로 줄이고, 이동의 효율성을\n          GS칼텍스                    높일 계획을 선보임\n                                  • 사회적 책임을 고려하여 소외받는 이들이나, 도서지역 주민들에게 기술의 편리함을\n                                   제공하기 위해 주유소를 드론 배송의 거점으로 하는 서비스를 제공할 예정\n\n\n\n\n                                  탄소네거티브 실현을 목표로 함\n                                  • 탄소 배출에 대해 직원들의 자발적인 노력을 유도하기 위해 금전적인 책임을 지도록 하는 사내\n                                   탄소제 제도를 도입\n       마이크로소프트                    • 전기사용이나 출장과 같은 직접적인 탄소배출뿐만이 아니라, 공급 파트너사와 고객으로부터\n                                   발생하는 탄소도 해당\n                                  • 환경 최우선 캠퍼스 구축 계획으로 워싱턴 MS본사 캠퍼스를 전부 화석연료를 사용하지 않고,\n                                   100% 무탄소 전기로 운영할 방침\n\n\n\n                                  미국 실리콘밸리의 패션기업 - 극단적 투명성 강조\n                                  • 제품 제작 과정에서 드는 비용인 원료, 운송비 등 세부 단가와 공장에서 일하는 모습까지\n           에버레인                    전부 일반인에게 공개\n                                  • 합리적인 가격과 윤리적 공정, 이로 인해 고객들의 신뢰가 저절로 상승하여 매년 급상승세를\n                                   이어가고 있음\n\n\n[ ESG 활용 기업 사례 245,246 ]\n\n\n\n\n358 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f많은 사람들이 가치 소비에 관심을 갖고, 특히 MZ세대를 중심으로 착한 기업/\n친환경 기업의 제품을 구매하고자 하는 의향이 증가하게 되면서 고객의 ESG\n요구도 증대하게 되었다. ESG 평가를 통해 기업의 가치가 얼마나 되는지를\n판단하는 새로운 조건이 형성되었다고 볼 수 있다.\n\n사회적 가치를 평가하고 가치 창출의 성과를 확인하는 과정에서 ESG 경영이\n제대로 실행되고 있는지를 확인할 때에는 한 분야만이 아니라 3가지 핵심\n요소들이 어떻게 잘 연관되어 상호작용하고 있는지, 그리고 이를 전략적으로\n결정하고 행동하는지와 관련해 기업 활동 전체를 종합적으로 살펴봐야 한다.\n\n\n\n\n[ ESG 모범규준 ]\n* 출처 : 한국기업지배구조원)\n\n\n\n\n                              서비스·경험디자인 이론서 359\n\f                    6.2 디자인 권리 및 사후관리\n                    6.2.1 디자인권\n\n                    서비스디자 인을 완료한 디자 인 결과 물 은 지적재 산 권을 통하 여 보 호받고\n                    경제적 가치로서 구체화할 수 있다. 지식재산권은 저작권과 산업재산권으로\n                    나누어 볼 수 있으며, 산업재산권의 세부 항목은 특허권, 실용신안권, 디자인권,\n                    상표권으로 구성된다.\n\n\n                       - 특허권：어떠한 발명을 독점적으로 이용할 수 있는 권리\n\n                       - 실용 신안 권：일련의 창작성을 가지고 있어 보 호받 아 마 땅 한 사항 에 대한\n\n                        독점적·배타적 권리이다.\n\n                       - 상표권：식별과 분별이 가능하고 상표에 대해 독점을 가지는 권리이다.\n\n                       - 디자인권：「디자인 보호법」 제2조 1호에 “디자인이란 물품의 부분(제42조는\n\n                        제외한 다.) 및 글자체를 포함한 다. 형 상, 모양, 색채 또는 이들 을 결합한\n\n                        것으로서 시각을 통하여 미감을 일으키게 하는 것을 말한다.”라고 규정하고\n\n                        있는데, 이러한 여건을 갖춘 디자인에 대해 특정인에게 주어지는 독점권이다.\n\n\n\n                    특히 서비스디자인 과 정에서 얻은 디자인 권리는 출원 이전에 그 권리를\n                    보호받을 수 있도록 공지증명제도를 운영하고 있다. 공지증명제도는 타인이\n                    창작물을 모방하지 못하도록 창작 사실을 증명해 주는 권리 보호 제도이다.\n                    디자인 초기 창작물의 내용과 시기에 대한 법적 보호 조치로 디자인권 취득 전에\n                    디자이너의 권리를 보호[신규성 상실 예외 주장-디자인보호법 제36조(창작\n                    사실을 증명해주는 권리보호)]하고 디자인산업 공정거래 환경을 조성하기 위해\n                    특허청과 한국디자인진흥원이 마련한 제도이다. 이러한 공지증명제도는 디자인\n                    창작물에 대한 권리 보호를 통하여 디자인 기업 및 디자이너의 창작 의욕을\n                    고취하고, 디자인 비즈니스를 활성화할 수 있는 건강한 창작 환경을 조성한다.\n\n\n\n                      공지증명의 장점\n                      - 공지증명의 장점\n                      - 디자인 등록 출원 전 디자인 창작 사실(창작자, 시기)을 대외에 공지\n                      - 디자인 개발 과정 중 개발된 수십 개의 디자인이 공지등록된 경우\n                        모방디자인(Dead Copy)의 출원등록 방지\n                      - 디자인권 등록으로 권리화되지 않은 디자인이라도 경쟁업체의 모방\n                        방지와 이에 대한 분쟁 대응\n                      * 공지증명(공개)된 디자인은 특허청 디자인권·특허 심사 시 창작 사실 증거자료로 활용되어 무권리자의 디자인\n                      무단 등록으로 인한 디자인 침해 피해 예방\n\n\n\n\n360 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                    이러한 디자인등록과 디자인공지증명의 차이는 다음 표와 같다.\n\n\n     구분                    디자인등록                            디자인공지증명\n\n     목적       · 독점 배타적인 디자인권 발생                 · 공지사실 증명\n\n\n    처리기간      · 출원 후 6개월 내외                     · 1~3일\n\n\n                                                · 독점 배타적 권리 없음.\n              · 동일 또는 유사한 디자인을 실시할\n    권리범위                                        · 등록 후 12개월 이내 디자인을 출원할\n               권리를 독점함(디자인보호법 제92조).\n                                                 경우 디자인권(재산권)확보가 가능함.\n\n\n              · 출원인이 출원 수수료 납부와 함께\n                                                · 디자인을 파악할 수 있는 간단한 도면과\n               디자인 등록 출원서를 제출함.\n    신청절차                                         신청서만을 제출함.\n              · 실체 심사를 거쳐 등록 결정 후 설정\n                                                · 실체 심사 과정이 없으므로 절차가 간단함.\n               등록료 납부를 통해 디자인권이 발생함.\n\n    권리보호\n              · 존속기간 20년                        · 부정경쟁방지법의 경우 창작일로부터 3년\n     기간\n\n[ 디자인 등록과 디자인공지증명의 비교 ]\n\n\n\n\n                    디 자 인권 은 원 칙 적 으 로 각 국의 지 적 재 산 권 에 귀 속되기 때 문 에 국제 적\n                    권리보호를 위해서는 해당 국가에 출원하고 등록하는 것을 원칙으로 한다.\n                    이처럼 다수의 국가에서 국제적 디자인권을 등록하기 위해서는 헤이그 시스템을\n                    이용한 국제 출원이 편리하다. 이는 세계지식재산기구(WIPO) 국제사무국에\n                    하나의 국제 출원서를 제출하여 여러 체약당사자 영역에서 디자인을 보호받을\n                    수 있는 제도이다. 따라서 하나의 국제 출원이 복수의 관청에 제출해야 하는\n                    일련의 출원을 대체한다. 하나의 출원서로 협정 가입 국가 중 하나 또는 여러\n                    국가에 동시에 디자인 출원(최대 100개까지)을 할 수 있으며, 국제 출원서는\n                    출원인의 선택에 따라 영어, 프랑스어, 스페인어 중 하나로 작성하여 제출할\n                    수 있다. 하지만 대한민국의 경우에는 국제 출원서의 작성 언어로 영어만을\n                    사용하도록 제한하고 있다.\n\n                    * 다만, 하나의 출원에 포함되는 모든 디자인은 로카르노 분류에서 같은 류에 속해야 하므로 모든 국제 출원은 단일류\n                    에 대한 출원이 된다. 출원인이 국제분류의 예시 명칭을 사용하지 않는 물품을 출원할 때에는 로카르노 분류에서 같은\n                    류에 속하는 명칭인지에 대하여 확인하여야 한다. 같은 류에 속하지 않는 복수디자인 출원일 경우 국제 사무국 방식심\n                    사의 하자통지 대상이 된다.\n\n\n\n\n                                                               서비스·경험디자인 이론서 361\n\f                    출원인은 출원일(또는 우선일)로부터 30개월을 넘지 않는 기간 내에서 공개\n                    연기를 신청할 수 있다. 국제 출 원의 공개 연기는 출 원서 제출과 동시에\n                    신청하여야 하는 것으로 공개 연기를 신청하면 공개 연기 기간 만료 전까지\n                    국제 등 록 부가 공개되지 않고 지정관청의 심 사도 진행되지 않는 점에 서,\n                    국내법에 따 라 등 록료 납부 전에 신청하고 디 자 인등 록 원 부 에 등 록되 는\n                    디자인보 호법상의 비밀디자인제도 와 는 그 취지가 다르다. 출원인이 국제\n                    출원서를 제출할 때 국제사무국에 내야 할 수수료는 총 3가지이다. 기본료,\n                    공개료와 지정 체약당사자의 심사와 관련된 표준(또는 개별) 지정수수료이다.\n                    다만, 지정 체약당사자의 심사와 관련하여 국내 절차에서 필요한 수수료는\n                    개별 국가의 국내법에 따라 해당 국가에 직접 납부한다. 국제사무국에 납부하는\n                    수수료는 스위스 통화(프랑)로만, 개별 국가에 납부하는 수수료는 개별 국가에서\n                    정한 통화로만 납부가 가 능하다. 헤이그 국제 출 원 외에도 서비스디자 인\n                    결과물에 따라 마드리드 국제 출원이나 트레이드 드레스, 파리 루트 등에 대한\n                    출원 방법을 활용할 수도 있다.\n\n\n\n\n                       마드리드 국제출원\n\n                       국제상표등록을 위한 제도로서, 국제사무국(WIPO)에 하나의 영문 출원서만을\n\n                       제출하면 해외 여러 국가에 동시에 출원한 것으로 보도록 하는 제도이다.\n\n\n                       트레이드 드레스\n\n                       저작권의 보호를 받지 못하 는 색채, 크기, 모양 등 상품이나 서비스 고유한\n\n                       이미지를 보호하기 위한 제도로 모양과 느낌(Look and Feel)을 보호대상으로\n\n                       한다. 미국은 1989년, 디자인권이나 저작권으로 등록하기 어려운 제품이나\n\n                       서비 스 의 특 성 을 어떻 게 보 호해 야 하 는지에 대한 문제 를 해 결하기 위해\n\n                       연방상표법을 개정해 트레이드 드레스를 신설하였다. 2015년 8월부터 특허청은\n\n                       「입체상표 등의 기능성 심사 가이드라인」을 마련하고 이를 심사키로 했다.\n\n\n                       파리 루트(Paris route)\n\n                       디자인 등 록을 받기를 원하 는 국가에 직접 출원하 는 방법이다. 일반적으로\n\n                       파리협약에 의한 우선권을 주장하면서 출원하므로 “파리루트에 의한 디자인\n\n                       출원”이라고 표현하며 출원하는 국가의 법과 절차에 따라야 한다. 다만, 우선권을\n\n                       주장하기 위해서는 선출원의 출원일로부터 6개월 이내에 해당 국가에 출원해야\n\n                       한다.\n\n\n\n\n362 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                    6.2.2 저작권\n\n                    디자인권 외에 서비스디자인의 결과 물 을 보 호받는 다른 방법은 저작권을\n                    활용하 는 방 법이다. 저작 권은 디자 인권과 달리 신규 성이 요구되지 않고\n                    물 품 성이 요구 되 지 않 아 심벌마 크 , 캐릭터 디 자 인 등 도 저 작 권법 으 로\n                    보 호받을 수 있다. 때로는 저작물과 디자인의 실제 운 용 상 조정이 필요한\n                    경우가 존재하는데 디자인권이 타인의 저작물과 저촉하게 되면 조정 규정이\n                    적용된다. 예를 들어, 공예품으로 제작한 꽃병을 대량으로 복제 생산하고자\n                    할 때, 디자인권자가 저작권자의 허락을 받지 않고 실시할 경우 저작권침해에\n                    해당된다. 저작 권은 저작자가 저작 물 을 스 스 로 이용하거나 다른 사 람 이\n                    이용할 수 있도록 허락함으로써 경제적 이익을 올릴 수 있는 재산권으로서\n                    복제권, 공연권, 공중송신권, 전시권, 배포권, 대여권, 2차적 저작물작성권이\n                    저작재산권에 해당 한다. 디자인권의 존 속기간은 등 록일로부터 20년이며,\n                    저작권은 저작자가 생존 기간 동안과 사후 70년 동안 보호를 받는다.\n\n\n\n                             디자인권 등록                   저작권 등록\n\n\n        등록대상                    디자인                     저작물\n\n\n                            공업상 이용가능성               문학 학술 예술의 범위\n         요건                     신규성                     창작성\n                                창작성                 사상이나 감정의 표현\n\n\n\n       권리발생시점               등록 시점(방식주의)             창작 시점(무방식주의)\n\n\n\n        보호기간               등록한 때로부터 20년간            저작자 사망 후 70년간\n\n\n[ 디자인권과 저작권의 차이 ]\n\n\n\n\n                                                      서비스·경험디자인 이론서 363\n\f         BM(Business Method, 영업 방법)특허247\n\n\n\n더 알아보기\n         247                    BM(Business Method)특허란, 영업 방법 등 사업 아이디어를 컴퓨터, 인터넷\n         특허청, 《2014년 산업통상자원위원\n         회 공통요구자료》              등의 정보통신 기술을 이용하여 구현한 새로운 비즈니스 시스템 또는 방법과\n                                관련된 발명에 대해 특허심사를 거쳐 허여한 것을 BM 특허라고 한다.\n\n\n\n\n                                [영업 방법이 BM 발명이 되는 방법]\n                                *출처 : 특허청(2014), BM특허 길라잡이\n\n\n\n                                BM 발명의 특허 요건\n\n         248                    순수한 영업 방법 자체만으로는 BM 발명에 해당하지 않고, 사업 아이디어에\n         특허청, 《2014년 산업통상자원위원\n         회 공통요구자료》              정보시스템(하드웨어, 컴퓨터, 인터넷, 통신 기술)을 결합한 형태로, 인간의\n                                판단 행위를 배제한 비즈니스 모델, 프로세스 모델과 데이터모델 등이 결합된\n                                형태여야 한다.\n                                경제법칙 및 현물시장의 거래방법(비즈니스 모델: 피라미드 영업 방식, 보험\n                                모집인 관리 방법, 사주풀이 방법 등)과 영업 방식을 구현하기 위한 시계열적인\n                                데이터 처리 과정(프로세스 모델: 업무 처리 흐름), 그리고 업무를 다루는 데이터\n                                집합 및 속성 정보(데이터 모델)가 결합된 것이라고 할 수 있다.248\n\n                                • 산업상 이용가능성: 산업상 이용할 수 있는 발명이어야 하는데, 이는 제3자가\n                                기술문헌으로 활용할 수 있도록 함으로써 더욱 발전된 기술을 개발하도록 하며,\n                                더불어 중복 연구를 방지함으로써 산업 발전을 꾀하는 데에 그 궁극적인 목적이 있다\n                                • 신규성: 기존 것과는 다른 객관적으로 새로운 것이어야 한다.\n                                • 진보성: 객관적으로 새로울 뿐만 아니라 자연적 진보를 뛰어 넘어 고도성을\n                                 가진 발명이어야 한다.\n                                • 선출원: 특허청에 먼저 출원한 자가 특허를 받을 수 있다. 동일한 발명에 대해\n                                 2개 이상의 권리를 부여하지 않으므로 신속히 출원하여 먼저 권리를 획득하는\n                                 것이 중요하다.\n\n\n\n         364 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f249                      • 구체적 특허 여부 : 비즈니스 방법 자체는 이전의 방법과 다를 바 없으나\n한국과학기술정보연구원, 장경선\n(2004), 《비즈니스모델 특허의 요건    신규 기술적 수단과 결합한 경우, 비즈니스 방법은 새롭지만 기술적 수단에\n과 문제점》\n                          신규성을 결여한 경우, 비즈니스적 측면과 기술적 수단의 양 측면이 모두\n                          신규성이 있는 경우 등 상세히 살펴야 한다.249\n\n\n                         BM(Business Method, 영업 방법)특허의 대상\n\n                         '자연 법칙을 이용한 기술적 사상의 창작으로서 고도한 것'을 발명으로 정의하고\n                         있고, 금융 투자, 결제방법, 분석 평가방법, 판매방법 등과 같은 영업 방법도\n                         발명의 조건에 해당이 되면 BM 발명이 된다.\n\n                         우리나 라와 일본 에서는 소 프 트웨어에 의한 정보 처리가 하드웨어 자 원을\n                         이용하여 구체적으로 실현되는지가 중요한 판단 기준이 되며, 인터넷, 컴퓨터\n                         등 IT기술을 시초로 영업 방법을 구현하기 위한 시계열 데이터(일정한 시간동안\n                         수집된 일련의 순차적으로 정해진 데이터 셋의 집합)의 처리 과정이 구체적으로\n                         제시된 경우에 특허의 대상으로 인정하고 있다.\n\n\n\n                         BM(Business Method, 영업 방법)특허의 대상이 아닌 경우\n\n                         • 순수 영업 방법 자체\n                         • 추상적인 아이디어, 인위적인 결정, 인간의 정신활동, 오프라인상의 인간의\n                         행위를 포함하는 경우\n                         • 소프트웨어에 의한 정보처리가 하드웨어를 이용해 구체적으로 실현되고 있지\n                         않은 경우\n                         • 온라인상의 행위와 오프라인상의 행위가 결합된 경우\n                         • 컴퓨터 프로그램 리스트, 데이터 구조 등 정보의 단순한 제시\n                         • 컴퓨터 프로그램 자체(단, ‘하드웨어와 결합되어 특정 과제를 해결하기 위하여\n                         매체에 저장된 컴퓨터 프로그램’은 2014. 7. 1. 이후 출원부터 특허의 대상이 됨.)\n                         • 수학 알고리즘 또는 수학 공식, 경제법칙, 금융법칙, 게임규칙 그 자체\n                         • 발명의 과제를 해결하기 위한 구체적 수단이 결여된 미완성 발명\n\n\n\n\n                                                            서비스·경험디자인 이론서 365\n\f250\n특허청(2014), 《BM특허길라잡이》\n\n                           • BM특허는 특허의 한 분야에 해당하는 것으로 영업 방법을 특허\n                            대상으로 한다는 점을 제외하고는 일반 특허와 차이가 없다.\n                           • BM특허도 특허의 한 종류로서 일반 특허가 가지는 모든 권한을\n                            가지므로 배타적 독점권이 인정된다.\n                           • BM특허로서 아래의 우선심사 대상 요건 중 하나를 만족하는\n                            출원은 우선심사를 신청할 수 있다. \t\t\t\t\n                            - 전자거래와 직접 관련된 특허출원\t\t\t\t\n                            - 특허출원인이 특허출원된 발명을 실시하고 있거나 실시준비\n                             중인 특허출원\t\t\t\t\t\t\n                            - 전문기관에 선행기술의 조사를 의뢰한 경우로서 그 조사 결과를\n                             특허청에 통지하도록 해당 전문기관에 요청한 특허출원 등\n                           • 모바일 콘텐츠, 온라인 게임, 물건 경매사이트, 온라인상의 강의,\n                            비즈니스 아이템, 판매 방법 등을 컴퓨터를 이용하여 구체적으로\n                            기술을 구현할 수 있는 방법이 제시되면 BM특허가 될 수 있다.250\n\n\n\n\n                        특허에서 출원까지의 절차\n\n251                     현재의 인터넷의 발전이나 기술 속도를 감안해 볼 때 독점 배타권을 행사할 수\n한국데이터산업진흥원, 《비즈니스모\n델(BM) 특허-비즈니스모델 특허의     있는 특허권의 존속기간은 출원일로부터 20년이므로 독점 보호기간은 그리\n요건과 문제점》\n                        길지 않을 수 있다. 그러다 보니 BM특허가 본래 취지인 산업 발전 즉, 기술 개발\n                        촉진 및 인터넷 관련 아이디어 개발의 견인차 역할을 한다기보다 후발 주자들의\n                        인터넷 시장 진입을 가로막는 장벽으로 기능하고 있다는 비난도 있다. 게다가\n                        BM 발명에 대한 권리보호가 지나치게 포괄적이라는 문제점도 있다. 하지만\n                        특허를 확보한다는 것은 결국 부가가치의 생산을 목표로 한다는 것으로 개인\n                        또는 기업의 이익을 창출하는 데 유익하다는 점에는 의심할 여지가 없다.251 유통\n                        및 마케팅 분야에서는 2000년대 초부터 가장 많은 BM특허가 출원되고 있으며\n                        다양한 분야와 융합되어 비즈니스 모델 혁신이 이루어지고 있다.\n\n\n\n\n366 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f특허에서 출원까지의 절차\n\n\n\n\n                서비스·경험디자인 이론서 367\n\f서비스·경험디자인 용어집\n혼재되어 있는 서비스디자인의 용어와 개념을 전문가 들과 논의를 거쳐\n표준화하여 소개한다.\n\n\n\n\n368 서비스·경험디자인 용어집\n\fㄱ                                             고객 여정 지도\n                                              Customer Journey Map\n                                              = 고객 여정 맵, 서비스·경험여정지도\n가시선\nLine of Visibility                            서비스·경험 여정 지도(Journey Map)는 사용자가 서비스를\n가시선(Line of Visibility)은 볼 수 있는 모든 것들의 경계라는   경험하 는 전 과정을 시각화하 는 방법으 로 고객 여정 지도\n의미로서, 서비스 디자인에서는 사용자가 경험하는 모든 것의              또는 고객 여정 맵으 로 도 불린다. 경험 여정은 사 용자가\n경계선을 의미한다.                                    서비스와 상호작용하는 서비스 접점(Touch Point)을 바탕으로\n쇼스탁(G. Lyun Shostack)은 가시선을 기준으로 고객이          구 성 되 는 데 , 서비 스 와 처 음 만 나 는 초 기 접 점 에 서 부 터\n경험하는 모든 것은 앞쪽 무대인 전방영역(Front Stage 또는         서비스가 완료되는 순 간까지 전체 경험을 사 진이나 도 표\nOn Stage), 그리고 그것을 가능하게 해 주는 다른 모든 것들은        등으로 시각화한다. 이를 통해 사용자 관점에서 서비스 경험에\n뒤쪽 무대인 후방영역(Back Stage)이라고 정의했다.              영향을 주는 요인들을 구체적으로 파악할 수 있으며, 가시 영역\n                                              및 비가시 영역의 서비스 접점을 발견하여 도식화할 수 있다.\n\n감정 곡선\nEmotional Curve                               고객\n                                              Customer\n감정 곡선(Emotional Curve)은 고객 여정 지도(Journey\nMap)를 작성할 때, 고객이 서비스를 사용하는 순간에 느낀             상품이나 서비스를 구매하거나 이용하는 손님을 의미하지만,\n생각과 감정을 시각화한 곡선을 의미한다.                        넓은 의미로는 종업원, 도매상, 중간상, 대리점 등 기업의\n                                              가치를 생산하거나 제공하는 모두를 고객이라 일컫는다.\n\n경험디자인(User Experience Design)의 특징\n                                              공동창작\n미국의 철학자 존 듀이가 설명한 ‘경험의 원리’는 ‘상호작용의\n                                              Co-creation\n원리, 연속의 원리, 성장의 원리’이다.\n1) 상 호작 용의 원리: 경험이란 것 은 인 간 을 둘 러 싼 환 경       공동창작(Co-creation)은 기업과 고객이 협업하여 혁신을\n\n요소들 간에 일어나는 상호작용을 말한다. 즉, 경험의 주체인             이루는 방법이다. 기존에는 디자인 과정에 참여하지 않았던\n\n사용자와 경험의 객체인 환경이 서로 주고받는 상호작용이                디자 이너, 임직원, 고객 등 다 양 한 이해 관계 자 들 이 함께\n\n경험이다.                                         능 동 적 으 로 참 여 하 는 워 크 숍 형 식 으 로 진 행 된 다. 기 존\n\n2)연속의 원리: 모든 경험은 과거에 영향을 받는다. 동시에             디자인 또는 앞으로 제공될 솔루션(Solution) 등 상황에 대한\n\n뒤따 를 미래의 경험에도 영향 을 끼친다. 경험이라 는 것이             인사이트(Insight)와 의견 등 을 함께 디자인하고, 문제를\n\n독립적이지 않고 연속적으로 이어지고 있다.                       해결하기 위해 아이디어를 도출하거나 기회를 발견할 수 있도록\n\n3)성장의 원리: 경험이 단순히 과거, 현재, 미래로 이어지는            돕는다. 공동창작을 통해 서비스 과제의 주제 정의, 실현 가능한\n\n것이 아니라 끊임없이 재구성되며 성장한다.                       콘셉트 아이디어, 프로젝트 목표에 적합한 콘셉트, 서비스 목표,\n                                              니즈, 비전 정의 등의 산출물을 얻을 수 있다.\n\n경험디자인\nUX: User Experience Design                    공지증명제도\n= 사용자경험디자인, UX디자인                             디자인 초기 창작물의 내용과 시기에 대한 법적 보호 조치로\n경험디자인(UX: User Experience Design)은 사용자가 제품    디자인권 취득 전(6개월 소요)에 디자이너의 권리를 보호(신규성\n및 시스템을 사용하는 과정에서 겪는 경험 전반을 디자인하는              상실 예외주 장-디자 인보 호법 제 36조 /창작 사 실(창작자,\n분야이다. 이때 시스템은 그래픽 인터페이스, 제품디자인,               시기)을 증 명 해 주 는 권 리 보 호 ) 해 주 기 위 해 특 허 청 과\n물리적 인터랙션(Interaction), 사용 설명서 등으로 구성된다.       한 국 디 자 인 진흥원이 디자인산업 공정거래 환경을 조성하기\n                                              위해 마련된, 디자인 모방을 방지하는 제도이다.\n\n고객 가치\n어떤 제 품 을 구 매하거나 서비스 를 이용할 때 고객이\n지불해야 할 비용 대비 얻는 혜택의 정도를 뜻한다. 이때,\n고객이 지불해야 할 비용에는 금전적대가, 시간투입, 기회 비용\n등이 있을 수 있으며, 혜택에는 품질, 서비스, 성능, 이미지\n등이 있을 수 있다.\n\n\n\n                                                                     서비스·경험디자인 이론서 369\n\f디자인 등록을 출원하지 않은 경우라도 디자인 창작 내용 및\n                                                           ㄴ\n공지 일자를 입증하여 창작자의 최소한의 권리를 보호하는\n공지 증명을 통해 디자인 등 록 출원 시 신규 성 상실 예외                          넛지\n주장(디자인보호법 제36조) 서류로도 사용된다.                                 Nudge\n\n                                                           넛지(Nudge)는 선택권을 제한하거나 동기유발 요소를 크게\n과업 분석                                                      변경하지 않으면서 예측 가능한 방향으로 변화시키는 방법을\nTask Analysis\n                                                           말한다.\n과업 분석은 사용자가 기존의 서비스를 사용할 때, 어떤 과업을\n어떻게 수행하는지 상세하게 분석하고 이해하는 조사기법이다.\n                                                           ㄷ\n과업 분 석( Task Analysis) 은 사 용자가 서비스에 어떻게\n접근하며, 서비스를 어떠한 방식으로 이용하 는지 사용자의\n                                                           다섯단계의 '왜' (5 Whys)\n행태를 관 찰 하 여 분 석하 는 방 법으 로 사 용자가 수행하 는                      = The Five Whys\n시스템의 과업을 분석하는 것을 포함한다.\n                                                           다섯 단계의 '왜'는 겉으로 드러나는 현상의 근본적인 원인과\n                                                           동기를 밝혀내기 위해 사용자 경험을 이용해 질문을 제기하는\n구조적 인터뷰                                                    것이다. 일반적으로 특정 문제를 더욱 깊이 연구하기 위해\n양적 조사를 위한 면접 방법 중 하나로 사전에 치밀한 계획을                          사용한다. 답변하 는 사람은 근본 적인 원인으 로 다가 갈 수\n세워서 질문이나 순서를 정해 계획에 따라 면접을 진행시키는                           있도록 각 단계의 질문에 설득력 있게 답해야 한다. 질문을\n방법이다. 정보를 서로 비교할 수 있고, 짧은 시간 내에 많은                         다섯 단계로 제한한 것은 본래의 질문에서 너무 벗어나지 않고\n정보를 얻을 수 있지만, 면접 계획에 없는 내용이나 심층적                           관련성을 유지하면서도 결과가 나타나게 된 근본적인 과정에\n내용은 얻을 수 없다.                                               대한 통찰을 얻기 위해서이다.\n\n\n귀무가설                                                       다원적 시찰법\n                                                           Pluralistic Walkthrough = 다원적 워크쓰루\n귀무가설은 실험이나 관찰을 통해서 기각하고 싶은 기존의\n가설이다.                                                      다원적 시찰법(Pluralistic Walkthrough)은 사용성 전문가에\n                                                           의한 사용적합성 검사 방법으로, 소프트웨어 또는 웹 사이트의\n                                                           사용적합성 문제를 식별하는 데 사용되는 검사 방법으로 주로\n기표\n                                                           종이 프 로 토타입(Paper Prototype)을 사 용하 여 실험에\nSignifier\n                                                           참가한 사용자 그룹과 사용성 공학자나 제품개발자의 의견을\n기표란 소쉬르가 정의한 개념으 로 기호의 물리적 실체 를                            결합하여 시스템의 사용성에 대한 토의를 하는 방법이다.\n말 한 다. 소 쉬 르 는 기 호 (S i g h) 를 기 표 (S i g n i f i e r) 와\n기의(Signified)의 두 가지 요소로 나누었는데 기표는 기호의\n                                                           대립가설\n물리적 실체이며, 기의는 기호가 대변하는 정신적 개념으로\n어떤 대 상 에 대해 우리가 갖고 있는 개념컨셉을 말 한 다.                         대립가설은 실험자가 주장하고 싶은 새로운 이론이다.\n설이다.\n                                                           더블 다이아몬드 모델\n기회영역                                                       Double Diamond\n\n                                                           더 블 다 이아 몬드 모델 (D oub le Di amo n d) 은 영 국\n변화를 시도해볼 만한 핵심 영역으로, 고객의 요구분석을 통해\n                                                           디 자 인협의회 (D esign C oun cil) 가 디 자 인 프 로 세 스 를\n발견된 불편점(Pain Point)이 기회영역이 될 수 있다.\n                                                           명 확 하 고 이 해 하 기 쉽 도 록 정리 한 방 법 론 이 다. 확 산 과\n                                                           수렴을 반복하는 프로세스로 인해 그래프의 모양이 두 개의\n                                                           다이아몬드처럼 보인다고 해서 '더블 다이아몬드'라고 불리며,\n                                                           발견하기(Discover), 정의하기(Define), 개발하기(Develop),\n                                                           전달하기(Deliver)의 4가지 과정을 거친다.\n                                                           이 과 정은 반복 적이고 비선형적이므 로 언제든 필요하 다면\n\n\n\n\n370 서비스·경험디자인 용어집\n\f이전 단계나 첫 단계로 돌아가 디자인을 지속·발전시켜야 한다.\n                                                             ㄹ\n①발견하기(Discover): 데스크 리서치, 설문조사, 심층 인터뷰\n등을 통해 무엇이 문제인지를 발견한다. ②정의하기(Define):                         라포\n주요 문제점이 발생하는 서비스 접점(Touch Point)을 찾아                         Rapport\n서비스 방향성을 도출한다. ③개발하기(Develop): 발견한\n                                                             라포(Rapport)는 조 사자와 인터뷰대상자 간의\n사 용자 요구 를 기반으 로 아 이디어(Idea) 개발 및 디자 인\n                                                             상호신뢰관계를 의미하는 심리학 용어이다.\n콘셉트(Design Concept)를 도출하여 프로토타입을 만든다.\n④ 전달 하기(Deliver): 서비스 프 로 토타 입을 사 용자 에게\n평가받고, 의견을 받아 수정하는 과정을 반복하여 평가 결과를\n                                                             로그\n                                                             Log\n문서화한다.\n                                                             로그(Log)는 정보기술(IT)에서 발생되는 모든 행위와 이벤트\n                                                             정보를 시간에 따라 남기는 기록 데이터를 의미한다.\n데스크 리서치\n                                                             개별 사용자의 행동들은 로그를 통해 기록하고 이 로그 분석을\nDesktop Research\n                                                             통해 사용자의 행동 패턴 등을 분석할 수 있다.\n데스크 리서치(Desktop Research)는 관찰 조사를 하기에\n앞서 관련 문헌을 연구하거나 인터넷 검색 등을 통해서 정보를\n수집, 분석하는 작업을 의미한다. 대상 서비스와 관련된 외부\n                                                             로드맵\n                                                             Roadmap\n상황(트렌드, 시장·정책환경 변화)으로부터 데스크리서치를\n위한 자료수집 방법은 미디어를 통한 자료수집과 출판물을                               로 드맵 ( R o a d m a p) 은 프 로 젝 트 의 솔 루 션 과 전 략 등 을\n통한 자료수집이 있다. 서비스의 내부 상황(조직, 협업 구조,                           시간순으로 배치하여 시각화하고 이해관계자들과 공유하는\n서비스 시스템)에 이르기까지 광범위한 이해를 바탕으로 대상                             방법이다.\n공공정책·서비스가 놓여 있는 맥락적 상황을 파악하는 것을\n목표로 한다. 주로 통계분석, voc분석, 관련 트렌드 분석,                           린 접근\n경쟁사나 동종사례 벤치마킹 등이 있다.                                        Lean Approach\n\n                                                             린 접근(Lean Approach)은 상품개발 시에 완성도 보다는\n동기 매트릭스                                                      효율성에 집중하는 프로세스로 접근하는 방법이다.\nMotivation Matrix                                            처음부터 완벽하게 만들기보다는 기민하게 프 로 토타 입을\n동기 매트릭스(Motivation Matrix)는 시스템 상의 역할자들                      만 들 어 고객의 반응 을 확 인해 인 사 이트를 확보하고 ,\n각각에게 시스템의 일부가 되도록 동기를 부여하는 방식으로                              효율적으로 개선에 반영하는 과정을 반복한다.\n만들어진다.\n                                                             만다라트\n                                                             Mandal-Art\n디자인씽킹\nDesign Thinking                                              만다라트(Mandal-Art)는 3×3 매트릭스를 사용하여 인간의\n디자 인씽킹(Design Thinking) 은 디자 이너가 생각 하 는                      두뇌활용 을 극대화 하 는 구 조 화 된 아 이디어 발상 기법\n방식으 로 문제 를 창 의적 으 로 해 결하 는 과 정이다.                            사고이다.\n스탠포 드 대학 (D.S c h o ol) 에 따르면 디 자 인 씽 킹 은\n공 감 하기 ( E m p a t h i ze) - 문제 정 의 ( D e f i n e) - 아 이디어   만약에\n찾기(Ideate)-프로토타입(Prototype)-평가하기(Test)의                      What if\n다섯 단계로 이루어진다.\n                                                             만 약 에( W h at if ) 는 서비스디 자 이너들 이 미래 서비스\n사용자의 행동을 바탕으로 그들의 생각과 요구를 확인하고\n                                                             시나리오를 탐구하도록 다양한 문제를 제기하는 방법론으로\n간단한 재료를 사용해서 빠른 속도로 해결을 위한 아이디어를\n                                                             기존의 아이디어를 뛰어넘어 상상을 통해 혁신적인 해결방안을\n구체화한 다음, 사용자의 의견을 듣고 다시 끊임없는 수정과\n                                                             찾는 아이데이션 방법론이다.\n평가를 통해 문제 해결 방법에 접근한다.\n\n\n\n\n                                                                                       서비스·경험디자인 이론서 371\n\f맥락적 조사                                       접 점 중 에 서 서비 스 의 수 행 이 나 소 통 을 지 원 하 는 모 든\nContextual Inquiry                           유형적인 요소를 의미한다. 책자, 명함, 브로슈어, 웹페이지,\n\n맥락적 조 사 (C ontex tual Inquir y) 는 사 용자 중 심   청구서, 사무용품 등이 해당된다. 고객은 이를 통해 구매 전\n\n디자인(User Centered Design)의 정성 조사 방법론으로       서비스의 가치를 측정하고, 소비 기간이나 소비 후의 서비스에\n\n사 용자의 공 간 에서 사 용자의 행동 을 관찰 하고, 때로는           대한 만족을 평가한다.\n\n인터뷰 를 복합적 으 로 사 용 하 여 다른 사 람을 맥락적 으 로\n이해 하 는 과 정 을 통 해 숨겨 진 요구 사 항 을 파 악 하 는       밀러의 법칙\n방법론이다.                                       Miller’s Law\n맥락적으 로 이해한다는 것은 사용자의 행동을 육하 원칙에              밀러의 법칙(Miller’s Law)은 사람이 한 번에 기억할 수 있는\n의해 관찰 하고 파 악 하 는 것인데 육하 원칙은 '누가, 언제,         양이 7개 전후라는 법칙이다.\n어디서, 무엇을, 어떻게, 왜'의 순서로 파악한다. 이때 가장\n\n                                             ㅂ\n중요한 부분은 '누가, 언제, 어디서, 무엇을, 어떻게'를 통해\n'왜'를 파악하는 일이다.\n\n                                             바디스토밍\n메뉴트리                                         Bodystorming\nMenu Tree\n                                             바 디 스 토밍 ( B o d y s to r mi n g ) 은 연 극 기법 을 활 용 하 여\n메뉴 트리는 서비스의 화면 구성 설계를 위해 메뉴들의 계층\n                                             사 용자의 경험을 프 로 토타 이핑하 는 체험형 브레인스 토밍\n구조적인 관계를 그래프로 표현한 문서이다.\n                                             방법이다. 경험의 필수요소들을 설정한 후 신체적 활동으로\n                                             검증해보는 과정을 거친다.\n멘탈모델\nMental Model\n                                             불편점\n멘탈모델(Mental Model)은 사용자가 목적을 달성하고자           Pain Point\n할 때 어떠한 방식 으 로 진행될 것이라 예 상 하 는 인 간 의\n                                             불편점(Pain Point)이란 소비자 들의 충족되지 않은 욕구,\n사고과정을 구조화한 것이다.\n                                             소비자의 불만, 불편함이 있는 지점을 의미한다.\n\n\n무어의 법칙\n                                             브레인라이팅\nMoore’s Law\n                                             Brainwriting\n무어의 법칙(Moore’s Law)은 인터넷 경제의 3원칙 가운데\n                                             브레인라이팅(Brainwriting)은 침묵의 브레인스토밍이라고\n하나로 마이크로칩의 밀도가 24개월마다 2배로 늘어난다는\n                                             불리며, 글로 대화하는 아이디어 확산 방법이다.\n법칙이다.\n                                             발언에 소극적인 사람들의 참여를 유발할 수 있으며, 모든\n                                             사람들이 참여할 수 있는 아이디어 발산 기법이다.\n문화적 프로브\nCultural Probe\n                                             브레인스토밍\n문화 적 프 로 브(Cultural Probe) 는 사 용자 관점에 대한     Brainstorming\n깊이 있는 통찰을 얻기 위한 과업 기반 인사이트(Insight)\n                                             브 레 인 스 토밍 ( B r a i n s to r mi n g ) 은 하 나 의 주 제 에 대 해\n활동이다. 영국 왕립예술학교(Royal College of Art)의 빌\n                                             참가자들이 자유롭게 의견을 제시하면서 아이디어를 만들어\n게이버(Bill Gaver)가 개발하였으며 프로브라 부르기도 한다.\n                                             내는 토론 형식의 아이디어 개발 기법이다. 1941년에 처음\n사용자 참여를 원칙으 로 하며, 참여자 들에게 탐구 를 위한\n                                             소 개된 기법 으 로 산 업 전반 에 널리 쓰 이 는 방 법 론 이다.\n충분한 시간을 제공하고 디자인에 영감을 주는 자료를 직접\n                                             자유로운 분위기 속에서 비판 없이 최대한 많은 아이디어를\n창출한다.\n                                             도출하는 것이 목적이며, 다른 사람이 낸 의견에 자신의 의견을\n                                             덧붙여 의견을 더욱 발전시키는 사고의 연상 작용을 기대할 수\n물리적 증거                                       있다.\nPhysical Evidence\n\n물리적 증거(Physical Evidence)는 서비스가 제공되는 다양한\n\n\n\n\n372 서비스·경험디자인 용어집\n\f비즈니스 모델 캔버스                                               사용자 평가\nBusiness Model Canvas                                     User Test\n\n비 즈니 스 모델 캔버 스 ( Bu s i n e s s M o d e l C a nv a s) 는   = 사용자 검증, 사용자 테스트\n\n서비스디자인의 비즈니스 모델 가운데 많이 활용되는 방법이다.                         사 용자 평 가 (Us er Te st ) 는 전반적인 사 용자 의 경험 을\n알렉산더 오스터왈더(Alexander Osterwalder)가 개발한                    프 로 토타 입 을 활 용 하 여 평가 하 는 것으 로 , 사 용자 검 증,\n비즈니스 모델 캔버스는 다음과 같은 9개의 요소로 구성된다.                         사용자 테스트라고도 불린다. 관찰, 인터뷰, 기록 분석 등의\n                                                          방법이 주로 활용되며, 제작자 관점을 배제하고 최대한 사용자\n1. 사용자 세그먼트(Customer Segments)                            관점에서 진행해야 한다.\n2. 가치 제안(Value Propositions)\n3. 채널(Channels)                                           사용자\n4. 사용자 관계(Customer Relationships)                         User\n5. 수익원(Revenue Streams)\n                                                          사 용 자 ( U s e r) 는 상 품 이나 서비 스 를 '사 용' 하 는 사 람 을\n6. 핵심 자원(Key Resources)\n                                                          의미한 다. 일반적으 로 사 용자 는 제 품이나 서비스 를 구매\n7. 핵심 활동(Key Activities)\n                                                          전부터 사용하는 과정, 사용한 후의 느낌까지 다양한 경험을\n8. 핵심 파트너십(Key Partnerships)\n                                                          해 본 사람이지만, 유아 제품 등 일부 상품이나 서비스의 경우\n9. 비용 구조(Cost Structure)\n                                                          구매자와 사용자가 다를 수도 있다.\n\n\n비즈니스 모델                                                   사전질의서\nBusiness Model\n                                                          RFI:Request For Information\n비즈니스 모델(Business Model)은 지속 가능한 비즈니스\n                                                          사전질의서(RFI)란 발주자가 제안요청서(RFP)를 작성하기\n전략 을 수립하 는 것으 로 서비스 조 직이 가치를 포착 하고\n                                                          전 또는 제안자가 제안서 작성 등 과제수행에 필요한 정보를\n창 조 하 고 전 파 하 는 방 법 을 논 리 적 으 로 설명 한 것 이 다.\n                                                          상호간에 요청하는 정보 요청서를 말한다.\n서비스 운영 모델은 서비스·경험디자인에서 비즈니스 모델로\n활용된다.\n                                                          상호작용 테이블\n                                                          Interaction Table\nㅅ\n                                                          상호작용 테이블(Interaction Table)은 서비스시스템 상에서\n                                                          발생하는 상호작용을 중재하고 발전시키기 위한 툴이다.\n사용성 평가\nUT: Usability Test\n= 사용성테스트                                                  섀도잉\n                                                          Shadowing\n사용성 평가(UT: Usability Test)는 사용성 테스트, UT,\nUsability Test 로도 불린다. 사용자의 관점에서 제품, 서비스,                 섀도잉은 그림자처럼 조사대상자를 따라다니며 그들의 행동,\n시스템을 사용하는 인터페이스를 대상으로 사용성을 향상하기                           감정, 환경과의 상호작용 등을 관찰하는 방법론이다.\n위해 평가하는 활동이다.\n\n                                                          서브퀄\n사용자 인터페이스                                                 SERVQUAL\nUI: User Interface\n                                                          서브퀄(SERVQUAL)은 서비스 품질을 측정하기 위한 방법 중\n사용자 인터페이스(UI: User Interface)는 사람(사용자)과                   하나이다. 서비스의 품질을 반응성, 확실성, 유형성, 공감성,\n사 물 또는 시스템, 특히 기계, 컴퓨터 프 로 그램 사이에서                        신뢰성 등의 차원으로 평가한다.\n인터랙션(Interaction)할 수 있도록 만든 물리적, 가 상적\n매개체를 뜻한다. 사용자 인터페이스(Human Computer\nInterface)에는 프로그램이 사용자에게 보여 주는 그래픽\n화면·문자·소리 정보와 사용자가 프로그램을 조작하기 위한\n마우스나 키보드 등이 있다.\n\n\n\n\n                                                                                        서비스·경험디자인 이론서 373\n\f서비스 가치 흐름도                                             서비스 시나리오\nSystem Map                                             Service Scenario\n=시스템맵                                                  = 사용자 시나리오, 경험 시나리오\n\n서비스 가치 흐름도(System Map)는 전체 서비스 시스템에서                   서비스 시나리오(Scenario)는 가상으로 만들어진 스토리이며,\n가치가 어떻게 교환되고 흘러가는지 보여 줌으로써 주어진                         서비스 제 공의 특 정 측 면 을 세 부 적 으 로 분 석할 수 있 는\n맥락 에 서 이해 관계 자 간 에 존재 하 는 관계 들과 대 표적인                  방법이다. 시나리오는 대개 글, 스토리보드, 비디오 등으로\n네트워크를 시각 화 한 다 이어그램이다. 각 교점은 선으 로                      표현되는데, 연구 자료들을 바탕으로 주위에 있을 수 있는\n연결되어 특정한 가치가 흘러가는 방향 을 보여 주는데 돈,                       그럴 듯한 상황을 만든후 페르소나(Persona) 기법을 접목시켜\n정보, 자원, 서비스 등의 가치 흐름이 포함된다. 주로 분석                      구체적인 캐릭터와 상황으로 시나리오를 발전시킬 수 있다.\n단계에서 현재의 서비스 상황을 이해하는 데 사용된다.                          또 여러 캐릭터 를 통 해 서비 스·경험의 다 양 한 상 황 들 을\n                                                       시나리오에서 표현하고, 서비스의 특징, 사용 방법, 서비스와\n\n서비스 검증                                                 사 용자 와의 인터랙 션, 서비 스 사 용 전반 에 대한 상 황 을\n=서비스 평가, 서비스 콘셉트 평가                                    묘사한다.\n\n디자 이너와 클라 이언트, 고객 등 서비스 와 관 련된\n이해 관계 자 들 이 공 동 창 작과 평 가 를 반 복 하 여 콘 셉 트를              서비스 시연\n구체화하고 평가 결과 를 반 영하 여 개선, 선택하 는 과 정을                    Service Staging\n\n말한다.                                                   서비스 시연(Ser vice Staging)은 경험 여정 시나리오를\n                                                       시 뮬 레이 션 하 여 서비 스 사 용 자 의 경 험 을 관 찰 함 으 로 써\n\n서비스 모형                                                 서비스가 현실화될 때 발생 가능한 상황이나 감성적 요인 등을\nDesktop Walkthrough                                    발견해 내는 방법이다.\n=데스크탑 워크쓰루\n\n서비 스 모형 ( D e sk to p Walk t h r o u g h) 은 작 은 모형 을   서비스 접점\n활용해서 서비스 환경을 책상 위에 실제처럼 재현하고 서비스                       Touch Point\n\n상황 을 현 실감 있게 살펴 보는 방 법이다. 레고(LEGO)나                    =터치포인트, 고객접점, 채널, 서비스채널\n\n종이 인형 등의 단순한 축소 모형으로 프로토타입을 만들고                        서비스 접점(Touch Point)은 사용자가 서비스를 경험하는\n페르소나를 토대로 만든 캐릭터로 상호작용을 시뮬레이션해 볼                       과 정에 서 만 나게 되 는 물리적인 것, 인적 상 호작 용,\n수 있다.                                                  커뮤니케이션 등의 모든 것을 말한다.\n                                                       터치포인트, 고객 접점, 채널, 서비스 채널이라고도 불리며,\n\n서비스 설명서                                                사용자와 이해관계자 간 다양한 유형의 접촉점을 정의하고,\nService Manual                                         시각화하여 서비스 과정을 구현하는 매체이다\n=서비스 매뉴얼\n\n서비스 설명서(Service Manual)는 서비스 매뉴얼이라고도                   서비스 청사진\n불리는데, 프로젝트의 범위나 구체적인 서비스에 대해 작성된                       Service Blueprint\n문서로서 상세한 프로젝트 목적과 개발된 아이디어의 발전                         =서비스 블루프린트\n단계를 설명하기 위한 것이다. 큰 규모나 장기간 진행되는                        서비스 청사진(Service Blueprint)은 사용자 여정, 서비스\n프로젝트를 수행할 때 특히 유용한 도구가 되며, 팀 구성원들이                     접점, 후방영역의 절차들로 서비스 전달과정 전반을 시각화한\n디자인 원칙을 이해하도록 돕기 위해 드로잉, 사진, 관련 문서\n                                                       서비스의 마스터플랜(Master Plan)이다. 이때 사용자 여정은\n등이 포함되어 있다.\n                                                       서비스를 경험하는 단계 및 절차들을 의미하며, 서비스 접점은\n                                                       서비스를 경험하는 채널들 및 접점들, 후방 영역의 절차들은\n서비스 스토리보드                                              가시선 후방의 이해관계자들 및 활동들을 포함한다.\nService Storyboard\n=스토리보드\n\n서비스 스토리보드(Service Storyboard)란 새롭게 만들어\n낼 서비스가 실제로 어떻게 활용될지에 대한 기대를 이야기\n형태로 만드는 것이다. 화면중심의 설계사양서를 의미하 는\n웹프로젝트에서의 스토리보드는 와이어프레임을 기반으로 표현된다.\n\n\n374 서비스·경험디자인 용어집\n\f서비스 콘셉트                                                       -리브워크 Live work: 고객이 다양한 경험을 할 수 있도록\nService Concept                                               시간의 흐름에 따라 사람들이 다르게 되는 다양한 서비스\n\n서 비 스 콘 셉 트 (S e r v i c e C o n c e p t ) 는 공 동 창 작 (C o -   접점(Touch Point)을 디자인하는 것이다.\n\ncreation)으로 도출한 다양한 서비스 해결 아이디어들 가운데,                         -엔진 Engine: 훌륭한 서비스를 개발해 제공하도록 돕는\n\n선정된 아이디어를 콘셉트로 발전시키고 구체화한 것이다.                                전문 분야로 서비스디자인 프로젝트는 환경, 커뮤니케이션,\n\n이때 서비스의 주요 세부 사항들을 효과적으로 의사소통할 수                              제품 등 디자인의 여러 분야를 포괄해 고객이 서비스를 쉽고,\n\n있도록 간단한 스케치를 포함할 수 있으며, 잠재 사용자들에게                             만족스럽고, 효율적으로 누릴 수 있도록 각 요소를 개발하는\n\n제공되는 서비스 가치와 특징을 강조할 수 있다.                                    것이다.\n\n\n\n서비스 프로토타이핑                                                    서비스스케이프\nService Prototyping                                           Servicescape\n\n서비스 프로토타이핑(Service Prototyping)은 서비스 디자인                      서비 스 스 케이 프 (S e r v i c e s c a p e) 는 서비 스 가 수 행 되 고\n\n프 로 세 스 를 통 해 제 시된 모델 을 타 당성이나 시 뮬 레이 션                       제공되며 소비되는 물리적 시설이다. 외관 설계, 주차장, 조경,\n\n검토를 위해 미리 실제처럼 만들어보는 방법론이다.                                   입구, 보행 공간과 같은 외부 속성과 설계, 배치, 공조, 음악,\n                                                              향, 조명, 실내장식과 같은 내부 속성으로 구성된다. 서비스\n                                                              차별화의 수단이며 서비스 수행을 지원하는 역할을 한다.\n서비스 모델 평가\nService Model Evaluation\n                                                              설문 조사\n서비스 모델 평가(Servie Model Evaluation)는 서비스가\n실제 환경에서 실행되기 이전에 최종 점검을 위한 평가 를                               설문 조사는 대표적인 정량적 조사 방법으로, 구조적인 형태로\n진행하 는 것이다. 최종 적으 로 개발된 서비스·경험 모델이                             다수의 사용자에게 동일한 질문을 수행하는 방법이다. 온라인\n당초 계획한 서비스의 핵심가치와 기본적인 방향성 측면에서                               설문조 사의 경우 지역에 대한 제한 없이 많은 사용자 들 을\n부합하는지 확인하며, 서비스의 목적, 기능적 완결성, 감정적                             대상으로 조사할 수 있다는 장점이 있다. 설문 조사를 통해서,\n인상 등의 평가 기준으로 평가하고 서비스 기획자와 개발자                               사용자들의 잠재적인 분포와 제품에 대해 사용자들이 필요로\n관점에서 생각하지 못한 새로운 가치가 있는지 재확인할 수                               하는 사항을 알 수 있다. 또한 대표적 문제점 발견 및 우선순위\n있는 기회가 되기도 한다.                                                결정에 도움을 얻을 수 있다.\n\n\n서비스디자인                                                        수렴적 사고\nService Design                                                수렴적 사고 문제를 해결하는 과정에서 여러 대안을 분석하고\n서비스디자인은 다양한 기관, 기업, 학계에서 정의되고 있다.                             평가함으로써 가장 적합한 해결책을 찾아내는 사고이다.\n-한국디자인진흥원: 서비스디자인은 공급자와 수요자의 잠재된\n욕구를 찾고 이를 만족시킬 수 있는 제품과 서비스를 개발하는\n                                                              수요자\n방법이다. 사용자의 경험을 토대로 새로운 가치창출을 실현하는                             End User\n다양한 방법론으로 산업과 사회 전 분야에서 활용되고 있다 .\n                                                              수요자는 상업적 맥락에서는 ‘고객, 소비자, 또는 사용자’, 비상\n-위키피디아: 서비스디자인은 서비스 제공자와 고객 사이에서\n                                                              업적인 맥락은 ‘청 중, 사 람, 그리 고 참 여 자’라 는 단 어 를\n경험의 질을 높이기 위해 사람과 인프라, 커뮤니케이션 그리고\n                                                              사용한다.\n서비스를 구성하는 물질적인 것을 계획하는 활동이다.\n-서비스디자 인네트워크 SDN: 유 용 성, 편의성, 효율 성을\n갖춘 바 람직하고 효 과 적인 서비스 창 출 을 목 적으 로 한 다.\n고객의 경험에 초점을 두고 서비스 이용 품질을 높이는 것을\n핵심가치로 추구하 는 인간 중 심적인 접근 방식이며 통합적인\n전략시스템, 프로세스, 접점 디자인 결정을 고려하는 전체론적\n접근 방식이다. 사용자 지향적이고 팀에 기반을 둔 학제 간 접근\n방식과 지속적인 학습 사이클을 통합한 체계적이고 반복적인\n프로세스를 말한다.\n\n\n\n\n                                                                                          서비스·경험디자인 이론서 375\n\f스캠퍼                                                           역브레인스토밍\nScamper\n                                                              역 브레인스 토밍 은 이미 만 들 어 놓 은 아 이디어에 서 생길\n스 캠 퍼 (S c amp e r) 는 행 위 동 사 10 개의 첫 단 어 를 따 서               수 있 는 문 제 점 을 비 판 하 기 위 해 사 용 하 는 방 법 이 다.\n만들어진 발상기법이다. 1971년 밥 에벌러가 브레인스토밍을                             브레인스 토밍과 비슷하지만, 아이디어를 평가하 는데 주로\n통해 발전시킨 아이디어 도출 방법이다.                                         사용한다.\n\n\n시각적 사고                                                        역할극\nVisual Thinking                                               Role-Playing\n시각적 사고(Visual Thinking)는 추상적이고 모호한 개념을                        =서비스 역할극, 롤플레이, Role Play, Role Playing\n시각화함으로써 사람들에게 효과적으로 전달하고, 아이디어를                               역할극(Role-Playing)은 서비스 경험의 주어진 상황에 따라\n구체화하고 조직원들과 직관적인 커뮤니케이션을 할 수 있도록                              참여자가 가상의 역할을 맡아서 말하고 행동하며 경험해 보는\n돕 는다. 특히 시각적인 자료는 언어적 자료에 비해 이해와                              방법이다. 연극의 리허설 같은 형식으로 역할극을 하며 전체\n설득의 효과가 높기 때문에 의사결정권자를 설득하는 데 큰                               과정을 통해 서비스 사용자 관점에서 공감대를 형성할 수\n도움이 된다.                                                       있도록 하며, 사용자의 요구를 효율적으로 이해하도록 돕고\n                                                              역할극의 피드백을 기반으로 새로운 아이디어를 도출할 수\n신속한 반복 실험과 평가                                                 있다.\nRITE: Rapid Iterative Testing & Evaluation\n\n신속한 반복 실험과 평가(RITE: Rapid Iterative Testing                   역할자 맵\n& Evaluation)는 인터페이스의 문제를 파악하고 평가하여                           Actors Map\n빠르 게 수 정한 후, 수 정한 결과 를 실험을 통해 검증하 는                           역할자 맵(Actors Map)은 인터뷰 기반의 매핑 도구이다.\n방법이다.                                                         특정 관점의 관찰을 통해 관계를 분석하여 서비스 구성원 간의\n                                                              이해관계를 시각화하는 데 유용하며, 프로젝트팀의 실무 개입\n심층 인터뷰                                                        및 서비스 실행 전략 분석에 효과적이다.\nIn-depth Interview\n\n심층 인터뷰(In-depth Interview)는 인터뷰 시간이 길고                        오즈의 마법사\n사용자 맥락이 포함된 인터뷰로 사용자의 의견, 잠재적인 정보,                            Wizard of Oz\n상호작용, 아이디어를 발견하기에 좋은 방법이다.                                    = WOZ, 오즈의 마법사 프로토타이핑\n\n                                                              오즈의 마법사(Wizard of Oz)는 실존하지 않는 시스템이나\n쌍 비교 분석법                                                      서비스를 마치 실존하는 것처럼 과업시나리오별로 동작하게\n                                                              만드는 프 로 토타 이핑 기법 으 로 주로 데이터가 없거나\n쌍 비교 분석법은 몇 개의 대안들을 상대적 우선순위에 따라\n                                                              기술이 완벽하지 않아 실제 구현하기가 어려운 인공지능(AI)\n선택, 결정해야 할 때 사용된다.\n                                                              프로젝트의 평가가 필요할 때 사용된다.\n\n ㅇ\n                                                              와이어프레임\n                                                              Wireframe\n에스노그래피\n                                                              와 이어프레임( W irefr ame) 은 선과 면으 로 페이퍼\nEthnography\n                                                              프 로 토타 이핑 과 정을 통해 나온 결정된 콘텐츠의 배치를\n에스노그래피(Ethnography)는 사용자 행동의 맥락과 그들의\n                                                              간단하게 시각화한 디자인 문서이다.\n잠재적 욕 구 를 파악하기 위한 현장 관찰 도구로 관찰 하 는\n사람들과의 공감을 통해 디자인 영감을 얻는 관찰 방법이다.\n비 디 오 에 스 노 그 래 피 ( V i d e o E t h n o g r a p h y), 모 바 일\n에스 노 그래피(Mobile Ethnography)등 관찰도구에 따라\n다르게 표현되기도 한다.\n\n\n\n\n376 서비스·경험디자인 용어집\n\f와이어플로우                                        인간중심적디자인\nWireflow                                      HCD : Human Centered Design\n\n와이어플로우(Wireflow)는 주요 인터랙션이 관련 화면의             국제표준화기구(ISO)는 ‘상호작용하는 시스템을 위한 인간\n와이어프레임으로 보여지는 여정지도이다. 와이어플로우는                 중심적 디자인(Human Centered Design, HCD)에 관한\n와이어프레임과 플로우차트를 조합한 것이다.                       지침 (ISO 13407) ’으로 시스템 개발 전체 과정에서 사용자의\n                                              참여를 강조한다. 이때의 사용자는 이해관계자를 포함한다.\n                                              HCD의 프로세스모델은 문제정의, 정보수집 및 해석, 해결책\n은유\nMetaphor                                      고안, 개발 및 평가단계에 HCD 접근법올 적용하기 위한\n= 메타포                                         것이다.\n\n은유(Metaphor)는 대상 간의 유사성을 암시하는 상징적인\n형상을 통해 표현하고자 하는 대상을 묘사하는 방법이다.                인지부조화\n                                              Cognitive Dissonance\n\n이해관계자 검토                                      인지부조화(Cognitive Dissonance)는 기존의 태도, 사고,\nStakeholder Walkthrough                       신념과 다른 새로운 정보를 접했을 때 겪는 불편한 경험을\n                                              말한다.\n이해관계자 검토(Stakeholder Walkthrough)는 실제 사용자\n대표, 여러 분야의 전문가가 모인 개발팀, 프로젝트 관계자들이\n회의실에 모여 특정 과제에 관한 시나리오를 사용자 관점에서              인지적 시찰법\n함께 검토하고 평가하는 방법이다.                            Cognitive Walkthrough\n\n                                              인지적 시찰법(Cognitive Walkthrough)은 실제 제품이\n이해관계자                                         만들어지기 전에 시나리오 레벨이나 기획 단계에서 수행하며\nStakeholder                                   특 정 과업( Task)의 시작과 완료 단계까지를 내부 인력이\n                                              참 여해 서 가 상으 로 화 이트 보 드에 채워 가 면 서 플로우 를\n이해관계자(Stakeholder)는 서비스를 기획하고 제공하고\n                                              점검해 나가는 과정이다.\n소비하는 데에 관여되어 있는 다양한 사람들을 말한다. 내부의\n경영자, 관리자, 전방 직원(매장 직원, 판매담당자 등), 후방\n직원(엔지니어, 디자이너, 회계사), 외부에는 고객, 파트너             인터랙션 디자인\n조직, 경쟁자, 컨설턴트, 민간단체, 정부, 언론과 같이 다양한           Interaction Design\n\n이해관계자가 있을 수 있다. 서비스디자인은 여러 이해관계자              인터랙션 디자인(interaction Design)이란 제품이나 서비스를\n집단의 다양한 니즈 와 필요를 파악하여 총체적(Holistic)           사용하는 사람 사이에 일어나는 상호작용을 용이하게 하는\n관점에서 개선점을 발굴하는 것이 매우 중요하다.                    디자인 분야이다.\n\n\n이해관계자 지도                                      인터뷰\nStakeholder Map                               Interview\n\n이해관계자 지도(Stakeholder Map) 는 서비스 의 기획,         인터뷰(Interview)는 면담자가 질문을 하고, 참가자가 답을\n제공, 소비 등 서비스의 전체 과정에 관련된 다양한 사람들을             제공하는 구조화된 대화법이다. 인터뷰에는 1:1 심층인터뷰,\n시 각 화 하 는 방 법이 다. 이 를 활 용 해 서 서 비 스 를 시 스 템   포커스 그룹 인터뷰 (F GI) 가 있으며, 구 조 화 된 질 문으 로\n관 점 으 로 분 석 하 며 이 해 관 계 자 그 룹의 유형 , 중 요 도 와   언 어 소 통 을 통 해 진 행 된 다. 인터 뷰 는 구 조 적 인터 뷰,\n영향력을 파악하고 이해관계자 그룹 간의 관계성, 역할이나               반구 조 적 인터 뷰, 비 구 조 적 인터 뷰 가 있 으며, 인터 뷰 의\n상호 관계를 보다 쉽게 이해할 수 있다. 또한 서비스 기획과             내용이 구조화될수록 면접 진행자의 효율도 높아진다. 좋은\n모니터링, 서비스 개 선과 이해 관계 자 간 관계 조 정 등 에           인사이트를 얻기 위해서는 참여자의 선정이 매우 중요하다.\n유용하게 활용될 수 있다.\n\n\n\n\n                                                                       서비스·경험디자인 이론서 377\n\fㅈ                                             친화도 분석\n                                              Affinity Mapping\n\n정보구조                                          =친화도법\nInformation Architecture                      친화도 분석(Affinity Mapping)은 조사 결과 수집된 정보들을\n=IA                                           연관성에 따라 분류하고, 유사점을 찾아내어 문제의 본질을\n정보구조(Information Architecture)는 고객이 서비스를      이해하는 방법이다. 붙임쪽지(Post-it)에 정보들을 적은 후\n이용하 는 목 적을 잘 수행할 수 있도록 서비스의 콘셉트에              클러스터링을 통해 계층 구조를 만들어 가면서, 참가자들이\n부합하는 정보의 구조를 설계하는 것이다.                        각자 의견을 자유롭게 내고 다양한 의견을 공유하는 분위기\n                                              속에서 해결점을 도출해 내는 과정을 거친다.\n\n제안요청서\nRFP:Request For Proposal                      ㅋ\n제안요청서(RFP)란 발주자가 특 정 과제의 수행에 필요한\n요구 사항을 체계적으 로 정리하여 제시함으 로써 제안자가               카드소팅\n제안서를 작성하는 데 도움을 주기 위한 문서를 의미한다. 제안            Card Sorting\n요청서에는 해당 과제의 제목, 목적 및 목표, 내용, 기대 성과,          카드 소팅은 사용자가 정보를 어떻게 이해하고 구 성하 는지\n수행기간, 예산, 참가 자격, 제출 서류 목록, 제안 요구 사항,          알아 볼 수 있는 방법론으 로, 정보를 설계하거나 서비스를\n평가 기준 등의 내용이 포함된다.                            전체 산업 내에 어디에 분류될 수 있는지 확인하는 목적으로\n                                              활용한 다. 일반적으 로 사 용자가 제 품과 관 련된 컨셉이나\n제품·서비스 통합 시스템                                 기능이 적힌 정보를 분류하 는 방식으 로 진행된다. 다수의\nPSS: Product Service System                   사 용자가 정보를 분류하 는 패턴을 확 인할 수도 있고 수치\n\n제품·서비스 통합 시스템(PSS: Product Service System)은   통계를 분석할 수도 있다. 어떤 방식을 선택하든 사용자의 행동\n제품과 서비스, 네트워크를 통합하여 사용자의 요구(Needs)를           패턴과 연관관계를 이해하는 게 가장 중요하다.\n만족시키고 지속가능한 가치를 창출하는 시스템이다.\n\n                                              ㅌ\n조서\nProtocol                                      터치포인트 매트릭스\n조서(Protocol)는 조사한 사실을 적은 문서를 말한다. 피험자가        Touch Point Matrix\n사용하면서 생각하 는 내용을 가장 직접적으 로 파악이                 = 서비스접점 매트릭스\n가능하며, 피험자가 과업 성과나 과정에 영향을 미칠 수 있다.            터치포인트 매트릭스(Touch Point Matrix)는 서비스·경험\n                                              여 정 지 도에 서 사 용자 의 여 정별 접 점 을 모두 찾 아 내 고 ,\nㅊ                                             페 르 소 나 별 접 촉 경 로 와 만 족 도 를 분 석 하 는 방 법이 다.\n                                              사용자가 경험하는 순간들을 연결하여 제품 서비스 시스템\n참여 관찰                                         간 상호작용의 결과물, 형태, 인터페이스, 맥락을 파악하고\nParticipant Observation                       시각화한다.\n\n참여 관찰(Participant Observation)은 사람들의 상황과\n행동을 공감하기 위해 직접 관찰대상자의 환경에서 그들과                투표\n일원이 되어 참여해보는 민족지학적인 관찰방법이다.                   Voting\n\n                                              투표(Voting)는 도출된 아이디어나 의견에 구성원들이 선호도\n                                              의사를 표시하여 합의안을 도출하는 방법이다.\n\n\n\n\n378 서비스·경험디자인 용어집\n\f ㅍ                                                         포카요케의 법칙\n                                                           Poka-Yoke\n\n퍼실리테이터                                                     포카요케의 법칙(Poka-Yoke)은 사용자에게 발생할 수 있는\nFacilitator                                                실수를 막고, 오류를 방지하 는 방법을 찾는 것으로 애당초\n퍼 실리테이터 ( F a c i l i t a to r) 는 효 과 적 인 공 동 창 작 (C o -   실 수의 여지 를 주지 않 고 사 용 에 강제 성 을 가지 는 것 을\ncreation)을 위해 워크숍 참여자가 원하는 바를 달성할 수                        말한다.\n있도록 촉진하고 돕는 사람이다.\n집 단 이 원 하 는 바 를 달 성 할 수 있게 돕 는 촉 진 활 동 인                   포커스 그룹 인터뷰\n퍼실리테이션을 수행하 며, 단 순히 진행 을 맡는 사회 자의                          FGI: Focus Group Interview\n역할 만 이 아니라 참 여자 들이 문제를 해결하도록 돕 는 데                         포커스 그룹 인터뷰 (FGI: Focus Group Inter view) 는\n집 중 한 다. 조 직의 문제 와 비 전에 대한 자 신의 해 결책 을                     전통적인 마케팅 리서치의 대표적인 기법으로, 제품의 대상\n개 인이 나 집 단 이 스 스 로 개 발 하 도 록 자 극 하 고 돕거 나,                 시장에 맞는 사용자 그룹을 인구통계 자료를 바탕으로 선정한\n교육 훈련 프로그램의 실행 과정에서 중재 및 조정 역할을                            뒤, 진행자와 함께 한 방에 모여 토론하는 방식이다.\n담당하기도 한다.                                                  토론은 정해진 질문지와 선택 가능한 답변에 따라 진행되며\n                                                           토론하는 장면을 녹화한 뒤 분석을 하는 경우가 많다. 포커스\n페르소나                                                       그룹 인터뷰는 실제 사용자 를 만나 제품에 대한 첫인상과\nPersona                                                    제품의 디자인과 외관에 대해 어떻게 느끼는지 알아볼 수 있다.\n= 퍼소나, 가상 사용자                                              또한 그동안 사용해 온 제품에 대한 의견을 수집할 때에도\n페르소나(Persona)는 실제 사용자들의 행동 패턴과 동기를                         사용할 수 있다. 하지만 다수의 의견이나 목소리가 큰 사용자의\n바탕으로 만들어진, 사용자를 대표하는 가상의 인물이다.                             주장이 전체의 의견이 될 소지가 있어 다양한 사용자의 패턴은\n이는 사 용자 들의 목표 와 요구 사항, 행동 특 성을 한 명의                        파악하기 어렵다.\n사 람으 로 표현했기에 실제 사 용자의 요구 사 항 을 명확히\n파 악 하고 디자 인을 진행하 는 과 정에 서 문제 를 해 결하 는                      프로토타입\n데 기준이 되는 매우 중요한 방법론이다. 고객의 인터뷰와                            Prototype\n관찰 데이터, 조사 자료 등을 바탕으로 정교하게 만들어진                            프 로 토 타 입 ( P r o t o t y p e) 은 개 발 하 고 자 하 는 서 비 스 를\n페르소나는 프로젝트를 진행하는 데 중요한 커뮤니케이션과                             구체적으로 구현하는 작업이다.\n추론의 도구가 되어 준다.                                             실 제 서비 스 를 개 발 하 고 제 공 하 는 데 필 요한 과 정 들과\n                                                           리소스를 쓰기 전에 서비스를 경험할 수 있도록 프로토타입을\n평가행렬법                                                      제작하고 테스트하여 시간과 돈을 절약할 수 있다. 또한 서비스\n                                                           개발 과정에서 실제 사용자들을 대상으로 서비스 아이디어와\n평가행렬법은 제안된 아이디어들을 미리 정해 놓은 준거에 따라\n                                                           콘 셉트를 테스 트하 여 피드백을 얻고, 사 람들의 기대치와\n체계적으로 평가하기 위한 기법이다.\n                                                           일치할 때까지 다시 테스트하는 과정을 거치는 서비스 검증에\n                                                           활용되기도 한다.\n포지셔닝 지도\nPositioning Map\n= 포지션 맵                                                    프로토타입 평가\n                                                           Prototype Test\n포지셔닝 지도(Positioning Map)는 어떤 개체(제품이나\n                                                           = 프로토타입 테스트\n서비스, 브랜드)가 현 재 소비자의 마 음 에 인식되고 있는\n                                                           프 로 토타 입 평가 (Protot ype Test) 는 서비스 를 시장 에\n위치를 파악하기 위한 지도이다. 지도를 만들기 위한 각 축의\n                                                           선 보이 기 전 에 성 능 과 품 질 을 확 인 하 는 과 정 을 거 치 는\n지표를 정하는 것이 매우 중요하며, 완성된 지도를 통해 서로의\n                                                           것으로, 개발된 서비스가 초기의 기획 의도와 가치를 제대로\n상대적 위치를 파악할 수 있다.\n                                                           구현했는지 검증하기 위한 것이다. 또한 실제 구현 단계에\n                                                           들어가기 전에 프로토타입에 문제가 없는지 살펴 보고, 품질과\n                                                           성능을 확인하며 사용자와 이해관계자들로부터 피드백을 얻기\n                                                           위한 것이다.\n\n\n\n\n                                                                                        서비스·경험디자인 이론서 379\n\f피어스모델                                     행동유도성\nPeirce Model                              Affordance\n피어스모델(Peirce model)은 디자인리서치와 트렌드 정보       행동유도성(Affordance)은 어떤 대상의 사용법을 이해하는\n시스템 조직을 위한 것으로, (1) 구성적 차원(기술, 구조), (2)   데 도움 이 되 는 시각적 단서이며, 도널 드 노먼(D o n al d\n실용적 차원(기능, 사용), (3) 기호적 차원(의미, 메시지)의      Norman)은 '어떤 물건의 인식된 또는 실제적 특성, 혹은 주로\n세가지 차원을 제시하고 있다. 특정 제품 전략을 구성하는 데         어떻게 사용될지를 결정하는 근본적 특성'이라고 설명했다.\n있어 이 세 가지 디자인 영역은 모두 만족되어야 하며, 전략에\n따라 강조하는 차원이 달라질 수 있다.\n                                          확산적 사고\n                                          확산적 사고는 문제를 해결하는 과정에서 정보를 광범위하게\n피츠의 법칙\n                                          탐색함으 로 써 사전에 정해져 있지 않은 다 양 한 해결책을\nFitts' Law\n                                          모색하는 사고이다.\n= 핏츠의 법칙\n\n피츠의 법칙(Fitts' Law)은 사용성 분야에서 인간의 행동에\n                                          환경 분석\n대해 속도와 정확성 간의 관계를 설명하는 기본적인 법칙으로\n                                          Environment Analysis\n시작점에 서 목 표 로 하 는 지역에 얼마 나 빠르 게 닿을 수\n있을지를 예측하고자 하는 것이다.                        환경 분석(Environment Analysis)은 성공적인 과제 수행을\n                                          목표로 전략을 수립하기 위한 활동이다.\n\nㅎ\n                                          -거시환경 분 석(Macro Environment)은 기업에서 통제\n                                          불가능한 요인들(정치, 경제, 사회문화, 기술적 환경의 요인)을\n                                          파악하여 전략을 수립하는데 목적이 있다.\n하이라이팅                                     -미시환경 분석(Micro Environment)은 기업이 속한 산업 내에\nHighlighting                              존재하는 마케팅 환경 주체들을 분석한다.\n\n하이라이팅(Highlighting)은 여러 대안들을 기본적인 몇 개의\n범주로 압축하여 분류하는 방법이다.                       휴리스틱 평가\n생 성된 아 이디어 중 에 서 괜 찮 다고 느 껴 지 는 아 이디어 를   Heuristic Evaluation\n골라낸 다음, 공통적인 측면이나 요소에 따라 묶음을 만드는          휴리스틱 평가(Heuristic Evaluation)는 가장 일반적인 품질\n것이다.                                      측정 방법으로 서비스의 성능과 품질이 적절한지를 평가하는\n                                          발견적 조사 방법이다.\n핵심가치                                      서비스 디자 이너, 사 용자 경험 디자 이너, 사 용 성 전문가,\nCore-Value                                사용자 인터페이스 전문가, 정보 구조 전문가 등 전문가들이\n=사용자 핵심가치                                 서비스 품 질과 가치의 관점에서 전문 적인 지식과 경험을\n\n사 용자의 핵 심가치(C ore-Value) 는 사 용자 시나 리오를    기반에 두고 평가하며, 전문가의 지식과 경험, 노하우로 빠르게\n\n작성하고 특정 상황과 환경에서 사용자 경험과 행동에 영향을          서비스를 평가하여 문제점 및 개선 방향을 제시할 수 있다.\n\n미치는 요소들을 파악한 후에, 사용자가 어떤 상황에서 어떤\n서비스를 이용하게 되는지 또 어떤 방법으 로 이용하게 될            A\n것인지를 예측함으로써 도출된다.\n                                          A/B 테스트\n                                          A/B 테스트는 두 사용자 그룹에 서로 다른 A와 B를 제공하여\n                                          사용자의 의견을 조사하는 방법으로 A와 B 중 더 나은 최적의\n                                          안을 찾아내는 방법이다.\n\n\n\n\n380 서비스·경험디자인 용어집\n\fAIO분석                                                M\nAIO분 석은 사용자 들의 라이프 스타일을 구 성하 는\n행위(Activities), 관심(Interests), 의견(Opinions) 을       MVP\n의미하 는 변수들 을 측 정하 는 기법으 로서, 각 변수들의 첫                 Minimum Viable Product\n\n글자를 따서 AIO분석이라고 한다. 소비자의 행위, 관심, 의견                 MVP(Minimum Viable Product)는 최소 존속 제품 또는 최소\n등은 그 사람의 라이프스타일을 엿볼 수 있는 중요한 측정                     실행 제품, 최소 요건 제품으로도 불린다.\n요소들로서 향후 마케팅을 전개해 나감에 있어 중요한 척도가                    Minimum은 시간과 자원을 최소한으로 투자해 핵심 기능 위주로\n된다.                                                 구현한다는 의미이며, Viable은 고객에게 가치를 보여 주고 사업\n                                                    가설을 검증할 수 있다는 것을 의미한다. MVP의 속성은 만들고,\n                                                    측정하고, 학습하는 과정을 반복적으로 수행하는 것이다.\n H\n\nHi-fi 프로토타입                                          P\nHigh Fidelity Prototype\n= 하이 피델리티, High Fidelity, Hi-Fi Prototype,\n                                                    PaaS\n                                                    Platform as a Service\n 높은 구현 충실도 프로토타입\n                                                    PaaS(Platform as a Service)는 서비스로의 플랫폼으로,\nHi-fi 프로토타입(High Fidelity Prototype)은 실제 제공되는\n                                                    PaaS를 통해 서비스 구성 부품인 컴파일언어, 웹 프로그램,\n시제품의 형태에 가까운, 구현 충실도가 높은 프로토타입이다.\n                                                    제작툴, 데이터베이스 인터페이스, 과 금 모듈 을 제공하며,\n하이 피델리티, High Fidelity, Hi-Fi Prototype, High\n                                                    개발자는 이를 활용하여 새로운 서비스를 만들 수 있다.\nFidelity Prototype, 높은 구현 충실도 프로토타입으로도\n불린다.\n                                                    PEST분석\n\n I\n                                                    PEST분 석은 정치(Political Issue), 경제(Economic),\n                                                    사회(Social), 기술(Technology)의 범주로 기업의 활동에\n                                                    영향을 주는 외부적 요인을 파악하는 방법이다. 시장 조사나\nIaaS\n                                                    전략 분 석 을 할 경 우 특별히 거 시경 제 요 소 에 서 기업이\nInfrastructure as a Service\n                                                    의사 결정을 내려야할 시 사 용하 는 기법이며, 시장 성장과\nIaaS(Infrastructure as a Service)는 가상 서버, 데이터스토리지   축소, 사업 포지셔닝, 사업 방향 등을 파악하는 데 효과적인\n및 전용 네트워크와 같은 일련의 컴퓨팅 자원에 대한 접근을\n                                                    도구이다.\n서비스 형태로 제공하는 클라우드 서비스의 일종이다. 사용자는\n이러한 컴퓨팅 자원들을 결합하거나 계층구조화하며 응용을\n실행하는데 필요한 환경 구축이 가능하다.                               S\n\n\n L\n                                                    SaaS\n                                                    Software as a Service\n                                                    = 서비스형 소프트웨어, 서비스로서의 소프트웨어\nLo-fi 프로토타입\nLow Fidelity Prototype                              S a aS (S of t w are as a S er v i c e) 는 서비 스 로 서의\n= 로우 피델리티, Low Fidelity, Lo-Fi Prototype,           소 프 트웨어로, 사 용자가 필요 로 하 는 소 프 트웨어를\n 낮은 구현 충실도 프로토타입                                    인터넷 상 에 서 이 용 하 는 클 라 우드 서비 스 이다. S a a S 는\n\nLo-fi 프 로 토타입(Low Fidelit y Protot ype) 은 서비스       소프트웨어 유통방식의 근본적인 변화를 설명하는 개념으로\n\n콘셉트나 아이디어를 신속하게 표현하기 위해서 사용되며,                      공 급 업 체 가 하 나 의 플 랫 폼 을 이 용 해 다 수 의 고객 에 게\n\n스케치나 와이어 프레임 형식 등이 대표적으로 활용된다.                      소프트웨어 서비스를 제공하고 사용자는 이용한 만큼 돈을\n                                                    지불한다. 전통 적 소 프 트웨어 비즈니스 모델과 비교할 때\n                                                    SaaS의 가장 큰 차이점은 제품 소유의 여부이다.\n\n\n\n\n                                                                               서비스·경험디자인 이론서 381\n\fSTEEP분석\nS T EEP 분 석 은 사 회 (S o c i a l ), 기 술 ( Te c h n o l o g i c a l ),\n생태(Ecological), 경제(Economic), 정치(Political)의\n다섯 가지 요소로 기업의 활동에 영향을 주는 외부적 요인을\n파악 하 는 방법을 말한다. 특히 생태학적 분 석이 포함되어\n날씨, 환경오염으로 인한 자외선 증가, 온도 상승 등을 추가로\n분석한다.\n\n\nSTP분석법\nSTP분 석법은 환경분 석법 중 하 나로, 시장을 세분화\n(Segmentation)하여 목표시장을 선정(Target)하고 위치를\n선정(Positioning)하여 경쟁우위 달성을 목적으로 고객의\n마음속에 제품(디자인, 서비스)의 정확한 위치를 심어주는\n과정을 말한다.\n\n\nSWOT분석\nS W OT분 석 은 강점 (Stren g th), 약 점 ( We ak ne s s),\n기회(Opportunity), 위협(Threat)의 머리글자를 모아 만든\n단어로, 경영 전략 을 수립하기 위한 분 석 도구이다. 내적\n환경을 분석하
