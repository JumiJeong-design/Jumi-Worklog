가치율이나 경제적 가치 등이 높은 '서비스/경험디자인'이\n                                    기술발전에 따라 디자인산업을 견인하고 있다고 하겠다.\n\n\n                                                                                       (단위:백만 달러)\n\n                                         중국                                            289,109.79\n                                         미국                                             31,050.00\n                                     이탈리아                                                6,713.78\n                                         대만                                              5,877.56\n                                     대한민국                                                4,896.37\n                                         독일                                              4,676.14\n                                       프랑스                                               3,777.45\n                                     네덜란드                                                3,574.19\n                                       스웨덴                                               2,442.66\n                                       스페인                                               1,758.91\n                                       스위스                                               1,526.53\n\n                                    * 디자인 시장규모 순위 (2022 기준)\n                                    * 출처 : 2023 디자인산업통계 총괄/요약보고서(2022년 기준), 한국디자인진흥원\n\n\n\n\n                                    산업의 디지털화와 지능화\n\n40                                  4차 산업혁명(Fourth Industrial Revolution, 4IR)은 2016년 6월 스위스\n시사상식사전 “4차 산업혁명”\nhttps://terms.naver.com/entry.      다보 스에서 열린 세계경제포럼( World Economic Forum, WEF)에서\nnaver?docId=3377297&cid=436\n                                    의장이었던 클라우스 슈밥(Klaus Schwab)이 사용하며 널리 알려지게 된\n67&categoryId=43667)\n                                    개념이다. 슈밥은 하드웨어, 소프트웨어와 생물학 등이 결합된 사이버-물리\n41\n위키피디아 “Fourth Industrial            시스템(Cyber-Physical System)과 통신, 연결의 발전을 강조하였다. 따라서\nRevolution” (https:/en.wikipedia.\norg/wiki/Fourth_Industrial_\n                                    4차 산업혁명은 컴퓨터를 통한 정보화 및 자동화 생산시스템 등으로 정의되는\nRevolution#cite_note-:1-34)         3차 산업혁명을 기반으로 정보통신기술(ICT)과 모든 분야가 서로 융합되는\n                                    ‘초연결’, ‘초지능’, ‘초융합’을 특징으로 하며, 빠른 속도로 광범위한 범위에\n                                    영향을 미칠 것으로 내다보았다.40,41\n\n\n\n\n48     Part 1. 왜 서비스디자인인가?\n\f                                4차 산업혁명의 대표적인 기술 분야로는 사 물인터넷(IoT), 인공지능(AI),\n                                로봇공학, 무인 운송 수단(무인 항공기, 무인 자동차), 3D 프린팅, 나노 기술,\n                                빅데이터(Bigdata), 헬스케어, 가상현실(VR), 증강현실(AR) 등이 있다.\n\n\n\n\n                                ‘4차 산업혁명’이라는 용어는 마케팅적 전략이며, 3차 산업혁명의 연장선상일\n                                뿐 혁명적 변화가 아니라는 비판도 있다. 하지만 현재 산업이 4차 산업혁명에서\n                                언급하는 특징을 보이며 디지털화 및 지능화로 급격히 전환되고 있다는 점은\n                                부인할 수 없는 사실이다.\n\n\n\n\n42                              2021년 세계적 기술 트렌드42\nDeloitte(2021), 《TechTrends\n2021》 (https://www2.deloitte.   - 정부도 디지털 및 클라우드로 전환을 가속화\ncom/kr/ko/pages/consumer/\narticles/2021/20210423.html)\n                                - 제조, 소매, 유통업체 등은 공급망을 고객 중심의 가치창출 동인으로 삼아\n                                 전환을 모색함\n                                - 의사 결정을 위한 정교한 AI와 머신러닝 도입, 고급 데이터 수집 및 구조화 기능,\n                                 차세대 클라우드 기반 데이터 저장소 등이 필요함\n                                - 재택 근무(비대면수업) 등 새로운 업무 공간과 근무 경험의 변화\n                                - 대면과 비대면의 융합\n                                - 다양성(Diversity), 형평성(Equity), 포용성(Inclusion), DEI를 사업의 필수\n                                 요소로 받아들임\n\n\n\n\n                                                                          서비스·경험디자인 이론서      49\n\f                                    앞으로의 미래는 디지털 트랜스포메이션의 가속화 및 비대면(untack) 업무 수행\n                                    방법이 일상화되며 공간에 종속되지 않고 생활할 수 있는 디지털(메타버스)\n                                    세상이 도래할 것으로 전망되고 있다. 서비스산업도 이러한 흐름 속에 함께 발전,\n                                    변화하고 있으며 미래 산업의 중심적 역할을 감당할 수 있도록 준비해야 할\n                                    것이다.\n\n\n\n\n                                    3.1.2 서비스 산업의 특성\n\n43                                  서비스 는 다 양 한 분 야 에서 시대와 관점에 따 라 다 양 한 의미로 사 용되어\nW. Earl Sasser, R.\nPaul Olsen, D. Daryl                왔다. 따라서 서비스가 무엇인지 정의 내리기는 매우 어렵다. 따라서 서비스의\nWyckoff(1978). Management of\nservice operations : text, cases,\n                                    특 성 을 기반 으 로 서비 스 의 본 질 을 이해 하 는 것이 유효하 다. 제 품·제 조\nand readings - / Boston : Allyn\n                                    시 스 템 과 구 분되 는 서비 스·서비 스 시 스 템 의 차 별 적 특 성 (d is t in c t i ve\nand Bacon, c1978.\n                                    characteristics)으로는 무형성, 동시성, 소멸성, 이질성이 있다.43,44\n44\n박용태, 김문수, 강인태, 김철현, 윤\n병운 (2012). 서비스공학-공학의 눈\n으로 바라본 서비스 경영 (개정2판).\n생능\n\n\n45\nKotlerand Keller(2007), 4\nCharacteristics of Service,\n(https://i0.wp.com/www.\niedunote.com/img/27713/\nservice-characteristics.jpg)\n\n\n\n\n                                    [ 4 Characteristics of Service45 ]\n\n\n\n\n50     Part 1. 왜 서비스디자인인가?\n\f무형성(Intangibility)\n서비스 그 자체는 눈에 보이는 물리적인 형태가 존재하지 않는다. 서비스가\n이루어지는 순간이나 그 이후에도 만질 수 있거나 볼 수 있는 것이 아니다.\n이러한 무형성은 서비스 운영과 통제를 어렵게 하며 서비스의 품질을 측정하거나\n관리하는 것을 힘들게 한다. 즉 서비스는 무형의 재화이다.\n\n동시성(Simultaneity) 또는 비분리성(Inseparability)\n대부분의 서비스는 서비스 제공자에 의해 생산(generated)이 이루어지는 순간,\n시간적 지연이나 여유 없이 사용자에 의해 소비(consumed)가 일어난다. 생산과\n소비가 동시에 일어나기 때문에 이 둘을 분리할 수 없다. 반면, 물질적 재화는\n생산을 먼저하고 여러 단계를 거친 후 다른 장소에서 소비되는 것이 일반적이다.\n서비스는 미리 생산하거나 필요로 하는 다른 장소로 이동하여 소비할 수 없다.\n이러한 동시성·비분리성으로 인해 서비스의 효과적인 생산과 유통 관리가 어렵다.\n\n소멸성(Perishability)\n서비스는 저장하거나 나중을 위해 비축할 수 없으며 한 번 사용하면 되돌릴 수\n없고 일정 기간이 지나면 소멸한다. 서비스는 사용자 또는 고객이 요구할 때 즉시\n제공되지 않으면 구매의 가능성이 없어지거나 크게 줄어든다. 구매 가능성이\n남아 있다고 해도 서비스 자체의 효용이 사라지거나 변질될 수 있다. 서비스는\n보관과 저장이 불가 능하기 때문에 재고 관리나 재주문을 통한 주문관리가\n어렵다.\n\n이질성(Heterogeneity), 변동성(Variability)\n모든 서비스는 각각 다르다. 서비스를 제공하는 사람과 제공되는 시기, 장소\n및 방법에 따라 품질이 크게 달라질 수 있다. 같은 목적의 서비스라 하더라도\n제공자의 상태나 마음가짐에 따라 실제로 제공하는 서비스의 내용이 달라지거나,\n고객의 개인적 조건과 취향에 따라 느끼는 서비스의 경험이 달라질 수 있다.\n표준화를 통해 제품 개발이나 생산과정을 효율적으로 관리하기 어렵다. 대량생산\n및 반복 생산으로 서비스의 품질을 유지하기 힘들다.\n\n\n\n\n                                            서비스·경험디자인 이론서   51\n\f                       이 네 가지 속성 외에도 여러 고유의 특성이 있으나 그 중 중요한 두 가지 속성을\n                       추가로 살펴보면 다음과 같다.\n\n\n\n                       고객참여(Customer Participation)\n\n                       서비스의 독특한 특성 중 하나는 프로세스에 고객이 참여해야만 하는 것이다.\n                       만약 그렇지 않다면 서비스가 전달되지 못한다. 고객이 서비스를 창출하고\n                       이용하 는 과 정에 참여하기 때문에 서비스 시스템을 효율적으 로 관리하기\n                       어렵다. 서비스 제공자와 사용자간의 접촉과 상호작용이 많아지면서 양자 간의\n                       갈등이 일어날 가능성도 크다.\n\n\n                       소유권(Lack of Ownership)\n\n                       제 품 은 판매되면 그 소유권이 구매 자 에게로 이전된다. 구매 자 는 제 품 을\n                       재판매할 수도 있다. 반면 대부분 서비스는 소유권의 이전을 수반하지 않으며\n                       사용자는 해당 서비스에 한 번 액세스할 수 있을 뿐이다.\n\n                       예시) 숙박서비스를 구매하였을 때 구매자가 호텔의 객실이나 편의시설을 특정\n                       날짜에 이용할 수 있는 권리는 있지만 객실이나 수영장의 소유권은 공급자에게\n                       남아 있다.\n\n                       서비스에도 권리나 소유권이 존재하는 경우도 있으나 소유권이 불분명하여\n                       분쟁이 발생하기도 한다.\n\n                       예시) 지식서비스의 지적재산권 문제, 제품과 서비스가 하나의 패키지로 묶여\n                       있는 경우 등\n\n\n                       서비스 특성의 변화\n\n                       그러나 이러한 서비스의 특 성은 제조업과 서비스업이 분명하게 나뉘어져\n                       있던 시기에 제시된 것으 로 현재는 환경의 변화 에 따라 그 의미도 변하고\n                       있다. 온라인, 디지털 서비스의 등장으로 무형성, 동시성, 소멸성 등 전통적인\n                       특성들이 바뀌고 있으며 제품과 서비스가 통합되는 개념이 등장하면서 제품과\n                       서비스의 특성을 분리하여 생각하기 어려워지고 있다.\n\n                       예시) 스마트폰을 판매하는 것은 단순히 휴대폰이라는 하나의 제품(product)을\n                       판매하는 것뿐만 아니라 할부(금융서비스)나 통신서비스, AS를 포함해 제품의\n                       하드웨어와 소프트웨어, 앱을 통한 다양한 서비스(사진 촬영, 삼성페이, 메시징,\n                       음악이나 동영상 스트리밍 등)를 제공한다는 개념이다.\n\n\n\n\n52   Part 1. 왜 서비스디자인인가?\n\f                                    3.2 서비스·경험디자인의 발전 및 현황\n\n                                    3.2.1 서비스디자인의 발전\n\n                                    기원전 5 0 0년 히 포 크라 테스 가 의 사 들의 니즈 를 반 영하 여 제안 한 작 업\n                                    공간부터, 기원전 350년 플라톤의 『국가(Republic)』에서 타인에게 조언을\n                                    구하는 과정의 중요성을 언급한 것에 이르기까지, 서비스디자인은 오랜 역사\n                                    속에서 활용되어 왔다. 그러나 서비스디자인의 역사는 서비스디자인의 개념을\n                                    최초로 설명하기 시작한 1980년대 이후부터라고 할 수 있다.\n\n\n                                    A. 1980년대, 서비스디자인의 시작\n\n                                    1981년에 IBM의 퍼스널 컴퓨터가 처음으 로 소개되었고 1984년에는 첫\n                                    매킨토 시가 소개되는 등 1980년대는 디자 인사 에 있어서도 많은 기술적\n                                    발전으 로 흥미로운 시기였다. 이처럼 새로운 기기와 기술이 사용자 들에게\n                                    침투하면서 사용자가 디지털 기술 그리고 기술이 적용된 기기를 얼마나 쉽고\n                                    정확하게 인지하여 과제를 수행할 수 있는가를 탐구하는 사용성 측면에서의\n                                    다양한 연구들이 이 시기부터 이어져 왔다. 따라서 1980년대는 처음으로\n                                    서비스디자인이라는 개념이 알려지고 서비스디자인 분야가 점차 발전하기\n                                    시작했던 시기이기도 하다.\n\n\n46                                  1982 서비스디자인, 처음으로 알려지다\nLynn Shostack(1982), <How to\nDesign a Service>, European         서비스디자인의 시작은 린 쇼 스탁 (Lynn Shostack)의 유러피안 마케팅\nJournal of Marketing, Vol. 16 No.\n1, pp. 49-63                        저널(Eur o p e an J o ur n al of M ar ket in g ) 논 문인 “ 어떻 게 서비 스 를\n\n47\n                                    디자인하 는가”(How to Design a Ser vice 4 6 )에 의하여 처음 대중에게\nSchneider, Benjamin & Bowen,        알려졌다. 그녀는 마케팅의 시각에서 서비스디자인을 정의한 것이었으나, 이\nD.(1985), 《New service\nDesign》, Development and            정의는 훗날 다양한 디자인 분야에 적용되는 서비스디자인 개념의 기반을\nImplementation and the\nEmployee\n                                    마련하는 데 활용되었다는 점에서 의의가 있다.\n\n                                    1984 또 다른 서비스디자인의 개념 소개\n\n                                    벤자민 슈나이더(Benjamin Schneider)와 데이비드 보웬(David E. Bowen)에\n                                    의해 서비스디자인은 다시 한번 새롭게 정의되었다. 그들의 연구 “새로운\n                                    서비스디자인, 개발 및 구현과 직원”(New services design, development\n                                    and implementation and the employee 47) 또한 쇼스탁의 연구와 같이\n\n1981년 8월 12일, IBM이 선보인              주로 마케팅, 관리 및 서비스 비즈니스 개발에 초점을 맞추어 서비스디자인을\n최초의 퍼스널 컴퓨터 IBM 5150\n                                    연구하였다.\n\n\n\n\n                                                                                서비스·경험디자인 이론서      53\n\f                                    1984 서비스 청사진의 탄생\n\n48                                  서비스디자인의 개념을 제안했던 린 쇼스탁은 1984년 하버드 비즈니스 리뷰(Harvard\nLynn Shostack(1984),\n<Designing Services That            Business Review)에서 사용자에게 도달하는 서비스를 디자인하기(Designing\nDeliver>, Harvard Business\n                                    Services That Deliver48)라는 글을 통하여 서비스 청사진(Service Blueprint)을\nReview, Vol. 62, No. 1, pp. 133-\n139                                 설명하였다.\n\n\n                                    1986 사용자 중심 디자인의 탄생\n\n49                                  심리학자이자 디자이너인 도날드 노만(Donald A. Norman)의 책(『User-Centered\nNorman, D.A., & Draper,\nS.W.(1986), 《User Centered          System Design: New Perspectives on Human-Computer Interaction』 49)에\nSystem Design: New\nPerspectives on Human-\n                                    의하여 사용자 중심 디자인(User-Centered Design)의 개념이 처음 주창되었다.\nComputer Interaction》, Taylor &\nFrancis\n                                    1988 모든 것의 디자인\n\n50                                  사용자 중심 디자인에 이어 1988년에 도날드 노만은 『디자인과 인간 심리』(The\nNorman, D. A.(1988), 《The\nDesign of Everyday Things》,         Psycology of Everyday Things50 )이라는 책을 통해 오브젝트와 사용자 간의\nNew York: Basic Books\n                                    의사소통 방법과 이 경험을 즐겁게 만들기 위한 방법에 대하여 저술하였다. 이러한\n                                    사용자 경험(UX)에 대한 강조는 훗날 서비스디자인이 좀 더 사용자 중심적인\n                                    관점에서 사용자의 총체적인 경험에 대해 집중할 수 있도록 하는 데에 큰 역할을 하게\n                                    된다.\n\n\n                                    1988 경험을 평가하다\n\n51                                  80년대에 이르러 사용자의 경험과 서비스의 질에 대한 학계 및 산업계의 고찰이\nParasuraman, A., Zeithaml,\nV.A. and Berry, L.L.(1988),         이어졌고 각 기업은 다각적인 측면에서 서비스 수준을 높이는 데 집중하였다.\n<SERVQUAL: A Multiple-Item\nScale for Measuring Consumer\n                                    서비스를 제공하는 것 외에도 기업이 영속하려면 현재 자신들이 제공하고 있는\nPerceptions of Service Quality>,\n                                    서비스의 품질을 평가하고 부족한 부분은 보강하는 개선의 과정이 필요했으나,\nJournal of Retailing, 64, pp. 12-\n40                                  서비스는 눈에 보이는 것이 아니기에 객관적 측정이 어려웠다. 이에 파라슈라만(A.\n                                    Parasuraman), 자이사믈(Valarie Zeithaml), 베리(Leonard L. Berry)는 서비스의\n                                    품질을 측정하기 위한 도구인 서브퀄(Servqual)이 개발하였다.51 이후 서브퀄은\n                                    RATER로 불리는 5가지 속성의 측정으로 변화되는데, 이는 신뢰성(Reliability),\n                                    확신성( A ssur ance), 유형 성( Tangibles), 공 감성(Empathy), 그리고\n                                    반응성(Responsiveness)이라는 속성들에 대한 평가를 의미한다.\n\n\n\n\n54     Part 1. 왜 서비스디자인인가?\n\f                                B. 1990년대 : 학문으로서의 서비스디자인\n\n                                90년대에 이르러 가장 큰 삶의 변화는 업무 환경에 주로 존재하였던 컴퓨팅\n                                디바이스들이 인터넷 혁명과 더불어 점차 일상으로 스며들어 왔다는 것이다.\n                                그로 인해 업무의 효율성이나 정확성뿐만 아니라 새로운 가치인 즐거움, 감성,\n                                문화적인 경험을 풍부하게 하기 위한 디자인계의 노력이 이어지게 되었다.\n\n                                한 편 서비 스디 자 인 계 에 서 는 9 0 년대 에 이 르 러 서비 스디 자 인이 하 나 의\n                                학문으로 자리매김하기 시작하였다. 각 대학에서는 서비스디자인을 가르치며\n                                서비스디자인 인재를 육성하기 시작했고, 현재 서비스디자인 발전의 원동력이\n                                된 많은 연구들이 활발히 진행되었다.\n\n\n                                1990 직업으로서의 UX\n\n                                앞서 언급했던 도날드 노만(Donald Norman)은 Apple에 합류하면서 처음으로\n                                그의 직업을 사용자 경험 설계자(User Experience Architect)로 정의하였다.\n                                그는 사용자 경험을 디자인된 인터페이스의 한 화면에만 국한하지 않았고\n                                사용자가 제품 및 서비스를 통해 얻는 일반적이고 총체적인 경험의 전반으로\n                                개념을 확장하였다. 이는 서비스디자인의 중요성을 다시 한번 알려주는 역사적인\n                                계기가 되었다.\n\n\n                                1991 서비스디자인학\n\n                                서비스디자인은 독일의 쾰른 국제 디자인 대학(Köln International School\n                                of Design)의 마이클 에를호프 (Michael Erlhoff) 교수에 의하여 하나의\n                                특별한 디자인 학문으 로 인정받았다. 서비스디자인 교육 을 제공하고 해당\n                                분야에 관련한 학자 및 전문가 네트워크를 제공하려는 학계의 움직임이 활발히\n                                일어나기 시작했다.\n\n\n                                1992 해결을 위한 디자인씽킹\n\n52                              문제의 파악과 해결 방안 도출이 어려운 불명확한 난제(Wicked Problem)에\nR. Buchanan(1992), <Wicked\nProblems in Design Thinking>,   대한 해결책이 바로 디자인씽킹(Designing Thinking)이라는 점이 밝혀졌다.\nDesign Issues 8, no. 2, pp.\n                                리차드 뷰캐넌(Ruichard Buchanan)은 그의 연구 “디자인씽킹에서의 불명확한\n14–19.\n                                난제\"(Wicked Problems in Design Thinking52)에서 디자인씽킹의 접근 방식을\n                                통해 난제를 해결하는 방법을 기술하였다.\n\n\n\n\n                                                                      서비스·경험디자인 이론서    55\n\f                                    1993 페르소나\n\n                                    앵거스 젠킨슨 (Angus Jenkinson)은 현재에 이르러서도 많은 사랑을 받고\n                                    있는 서비스디자인 방법인 페르소나 를 개발하였다. 페르소나는 특정 타깃\n                                    그룹을 대표하기 위해 만들어진 가 상의 캐릭터로 서비스 디자이너가 작업\n                                    대상을 요약하는 데 큰 도움을 줄 수 있는 도구이다.\n\n\n                                    1995 최초의 서비스디자인 교수의 탄생\n\n                                    비르깃 마거(Birgit Mager)는 독일 쾰른 공과대학교(University of Applied\n                                    Sciences in Cologne) 최초의 서비스디자인 교수로 임명되었다. 그녀는\n                                    서비스디자인의 이론, 방법론, 실제 등을 개발하였고 글로벌 서비스디자인\n                                    실무자와 연구원으로 구성된 글로벌 커뮤니티를 성장시켰다.\n\n\n                                    1999 고객 여정 지도의 탄생\n\n                                    미국의 디자인 회사 IDEO가 철도 관련 프로젝트(Acela high-speed rail\n                                    project)를 진행하던 중 고객 여정 지도(Customer Journey Map)를 처음\n                                    제시하게 되었다. 향후 이는 서비스디자인에서 가장 널리 활용되는 도구 중\n                                    하나가 되었으며 특히 무형 서비스의 시각화에 도움을 준다.\n\n\n                                    1999 경험 경제\n\n53                                  경험 경제(The Experience Economy)의 개념은 파인 (B. Joseph Pine\nPine, J., Gilmore, J.(1999), 《The\nExperience Economy》, Boston:        Junior)과 길모어 (James H. Gilmore)에 의하여 처음 제안되었다 53. 그들은\nHarvard Business School Press.\n                                    기업이 고객에게 가치 있는 경험을 선사해야 하며 그 경험 자체가 하나의 상품이\nISBN 1422161978.\n\n                                    될 것이라고 주장하였다.\n\n\n\n54\nUniversity of Applied Sciences\nCologne(KISD), Germany\n(https://kisd.de/en/https://\nen.wikipedia.org/wiki/\nK%C3%B6ln_International_\nSchool_of_Design)\n\n\n\n\n                                    [ 서비스디자인을 학문으로 발전시킨 대표 대학 54 ]\n\n\n\n\n56     Part 1. 왜 서비스디자인인가?\n\f                                C. 2000년대: 전 세계로 퍼져나가는 서비스 디자인의 움직임\n\n                                2000년대에 이르러 서비스디자인은 전 세계로 퍼져 나가는 하나의 운동이\n                                되었다. 사회 혁신, 환경 문제 등 복잡한 사회 문제를 해결할 수 있는 하나의\n                                새로운 접근 방법으로 디자인이 조명되면서 서비스디자인의 역할이 확장되었다.\n                                이와 같이 해당 분야에 대한 중요성에 많은 동조를 얻어 서비스디자인만을\n                                전문으로 하는 기업들도 생겨나게 되었다.\n\n\n                                2001 최초의 서비스디자인 컨설턴시 리브워크 설립\n\n55                              서비스디 자 인 전 문 기업을 표방 한 컨설턴트 비즈니스 회 사 인 리 브 워 크\n리브워크 liveworkstudio (https://\nwww.liveworkstudio.com/)        (Liveworks 55)가 런던에 설립되었다(Founded by Chris Downs, Ben\n                                Reason and Lavrans Løvlie). 리브워크는 서비스 디자이너, 시스템 씽커,\n                                비즈니스 디자이너, 연구자, 그리고 컨설턴트 등의 다학제적 팀을 기반으로\n                                구성되어 각종 공공분야 등의 사회 문제를 해결하고자 노력하였다.\n\n\n                                2002 최초의 공공 부문 서비스디자인 컨설턴시 마인드랩\n\n56                              덴마크 정부(Danish Ministries of Business and Growth, Employment,\n마인드랩 Centre for public\nimpact (https://www.            and Children and Education)는 마인드랩(Mindlab 56)을 도입하였다. 이로\ncentreforpublicimpact.org/\n                                인하여 서비스디자인은 마케팅 분야 를 넘어 공공 분야에까지 널리 활용이\ninsights/welcome-to-mindlab)\n\n                                되면서 사용자 들의 모든 생활에 밀착한 해결책을 제시하고 영향 을 미치기\n                                시작했다.\n\n\n                                2003 영국의 서비스디자인 컨설턴시 엔진\n\n57                              엔진(Engine 57)은 런던에 기반을 둔 아이디어 컨설팅 회사로 출발했으나 창업\n엔진 Engine (https://\nengineservicedesign.com/en-     3년 만에 서비스디자인으로 업종을 변경하였다. 이는 서비스디자인 분야가 그\ngb/)\n                                중요성을 인정받고 비즈니스 컨설팅 영역에서 자리를 잡게 되었음을 알리는\n58                              신호가 되었다.\n엔터프라이즈 리그\nEnterprise league (https://\nenterpriseleague.com/hire/\nservice-design-companies)\n마인드랩 mindlab (https://\nwww.facebook.com/mindlabdk/)\n엔진 Engine (https://\nengineservicedesign.com/en-\ngb/)\n서비스 디자인 네트워크 SDN\n(https://www.service-design-\nnetwork.org/build-a-chapter)\n\n\n                                [ 다양한 서비스 컨설턴시의 출현(리브워크, 마인드랩, 엔진)과 서비스 디자인 네트워크의 탄생 58]\n\n\n\n\n                                                                        서비스·경험디자인 이론서      57\n\f                                 2004 서비스디자인 네트워크의 탄생\n59                               독일 쾰른 공과대학교(University of Applied Sciences in Cologne)의\n서비스디자인 네트워크 SDN\n(https://www.service-design-     비르깃 마거(Brigit Mager)는 미국의 카네기 멜론 대학(Carnegie Mellon\nnetwork.org/build-a-chapter)\n                                 University), 스웨덴의 린셰핑 대학(Linköpings Universitet), 이탈리아\n                                 밀라노 공과대학(Politecnico di Milano), 이탈리아 도무스 아카데미(Domus\n                                 Academy)와 함께 서비스디자인 네트워크(Service Design Network,\n                                 SDN 59)를 발족하였다. 이러한 글로벌 네트워크는 현재 1,300명 이상의 회원과\n                                 100개 이상의 회원 조직을 구성하고 있으며 서비스디자인의 영향력을 넓혀\n                                 나가고 있다.\n\n\n\n                                 2005 더블 다이아몬드 모델의 등장\n60                               영 국 디 자 인 카 운 슬 (D esign C ouncil) 은 모든 디 자 인 작 업의 다 양 한\nDesign Council UK. (2005). The\nDesign Process. (https://www.    프 로 세스 를 설명하 는 모델인 더블 다 이아몬드 모델(Double Diamond\ndesigncouncil.org.uk/sites/\n                                 Model 60)을 제안하였다.\ndefault/files/asset/document /\nDesign%20methods%20for%20\ndeveloping%20services.pdf)\n                                 2007 서비스디자인학회의 탄생\n61                               2007년부터 서비스디자인 네트워크가 주최하는 글로벌 컨퍼런스(Service\n서비스디자인 네트워크 SDN\n(https://www.service-            Design Global Conference, SDGC 61)가 매년 개최되기 시작하였다. 그동안\ndesign-network.org/global-\nconferences)\n                                 다양한 디자인 학회가 있어 왔으나 본 학회의 탄생은 다시 한번 서비스디자인\n                                 분야의 성숙도를 반추할 수 있는 계기가 되었다.\n\n\n                                 2007 대규모 공공 서비스디자인 프로젝트 실행\n62                               영국 디자인 카운슬(Design Council)과 영국 북동쪽의 지역자치단체(Regional\nDesign Council UK. (https://\nwww.designcouncil.org.uk/\n                                 Development Agency) 'One North East'가 주체한 Dott 0762 (Designs\nsites/default/files/asset/\n                                 of the Time)은 디자인이 생활에 어떠한 변화를 가져다줄 수 있는지에 대해\ndocument/dott07.pdf)\n                                 고민하는 목적을 가진 중장기(10년) 프로젝트이다. Dott 07은 개선될 여지가\n                                 있는 일상생활의 다양한 분야를 주제로 건축, 제품, 그래픽, 산업, 서비스디자인\n                                 등 모든 디자인 분야를 아우르는 프로젝트들을 진행했다.\n\n\n\n\n58     Part 1. 왜 서비스디자인인가?\n\f                                  2008 디자인씽킹의 중요성\n63                                하버드 비즈니스 리뷰(Harvard Business Review)에 IDEO의 CEO인 팀\nHarvard Buesiness Review\n(https://hbr.org/2008/06/         브라운(Tim Brown)이 사고방식으로서의 디자인 63 (Design Thinking)의\ndesign-thinking)\n                                  중요성을 역설하면서, 경영자가 무형 디자인의 역할을 이해하고 서비스디자인의\n                                  필요성을 인식해야 한다는 문제의식이 확산되었다.\n\n\n                                  2009 데시스 네트워크 발족\n64                                이탈리아 밀라노 공과대학(Politecnico di Milano)의 에치오 만치니(Ezio\nDesisnetwork (https://www.\ndesisnetwork.org/)                Manzini) 교수는 사회 혁신 디자인을 주제로 하는 디자인 대학들의 네트워크인\n                                  데시스 네트워크(DESIS Network64)를 발족하였다. 특히 사회 혁신 디자인에\n                                  대한 담론을 활성화하는 데 기여했고, 다양한 환경과 사회 문제에 대한 디자인의\n                                  방향성을 제시하는 데 노력하였다.\n\n\n                                  D. 2010년대 : 서비스디자인의 성숙기\n                                  인터넷, 모바일 통신, 인공지능 등 다양한 기술이 빠르게 발전하고 다양한\n                                  사 람들 이 상 호작용할 수 있는 소셜 미디어들 이 개발되었으며, 사 람들의\n                                  생 각 을 공 유할 수 있 는 수많은 플 랫 폼 이 등 장 하 였다. 디 자 인 관 점에 서\n                                  접근해야 하는 문제는 단순하지 않고, 눈에 보이지 않게 연결되고 얽혀 있어,\n                                  이에 대한 서비스디자인의 총체적인 해결 방안이 각광을 받게 되었다. 이제\n                                  서비스디자인은 성숙한 하나의 학문이자 글로벌 기업들이 그들의 비즈니스를\n                                  공고히 만들어 나갈 때에 꼭 필요한 도구가 되었다. 많은 대학에서 서비스디자인\n                                  특화 교육을 시작하였고 다양한 저서들도 출간되기 시작하였다.\n\n\n                                  2010 비즈니스 모델 캔버스의 탄생\n65                                많은 서비스 디자이너들이 활용하고 있는 비즈니스 모델 캔버스(Business\nOsterwalder, A., Pigneur, Y.,\nIn Clark, T., & Smith, A(2010),   Model Canvas)가 『비즈니스 모델 생성』(Business Model Generation: A\n《Business model generation: A\n                                  Handbook for Visionaries, Game Changers, and Challengers)이라는\nhandbook for visionaries, game\nchangers, and challengers》,       저서에서 언급되었다.65\nHoboken, NJ: Wiley\n\n\n\n\n                                                                          서비스·경험디자인 이론서     59\n\f                                    2010 서비스디자인 분야 최초의 베스트셀러\n66                                  스틱도른 (Marc Stickdorn)과 슈나 이더(Jakob Schneider)의 저 서인\nStickdorn, M., & Schneider,\nJ.(2011), 《This is service design   『서 비 스 디 자 인 교 과 서 』 ( T h i s i s S e r v i c e D e s i g n T h i n k i n g 6 6 ) 는\nthinking》, John Wiley & Sons\n                                    서비스디자인의 설계에 대한 학제 간 접근 방식을 소개하면서 서비스디자인의\n                                    사고가 거의 모든 분야에서 활용될 수 있음을 보여주었다. 2010년에 발행된 이\n                                    책은 2017년 개정을 거치면서 서비스디자인에 대한 다양한 관점을 최신으로\n                                    유지하는 데에도 총력을 다하고 있다.\n\n\n                                    2016 서비스디자인의 날\n                                    서비스디자인 네트워크(SDN)에 의하여 매년 6월 1일은 ‘서비스디자인의 날’로\n                                    제정되었다.\n\n\n                                    2017 서비스디자인 트레이너 인증\n67                                  서비스디자인 네트워크(SDN)가 만든 SDN 공인 서비스디자인 트레이너(SDN\nMarc Stickdorn and Jakob\nSchneider(2010), 《This is           Accredited Service Design Trainer)는 서비스디자인 분야 최초의 국제\nService Design Thinking》\n                                    인증이다. SDN의 이 인증은 급격히 성장한 서비스 디자이너 관련 시장에\n(https://www.bispublishers.\ncom/this-is-service-design-         투명성과 신뢰를 줄 수 있도록 우수한 서비스디자인 트레이너 양성 시스템을\nthinking-pb.html)\n                                    확립하는 데 목표를 두고 있다.\n\n\n\n\n                                    [서비스디자인 분야의 최초의 베스트 셀러, This is Service Design Thinking 67 ]\n\n\n\n\n60     Part 1. 왜 서비스디자인인가?\n\fE. 한눈에 살펴보기\n\n\n\n\n              BEFORE\n\n\n\n\n                       서비스·경험디자인 이론서   61\n\f                                3.2.2 서비스디자인의 국내 도입\n\n                                서비스디자인은 아이디어를 실제 학문 분야로 발전시킨 것으로, 전 세계로 뻗어\n                                나가는 하나의 운동으로 확장되었으며, 현재는 성숙기에 접어 들어 실무 영역과\n                                학계에서 그 중요성을 인정받고 있다. 1980년대 이후 급격히 발전한 서비스디자인\n                                분야는 언제부터 국내에 도입되어 어떻게 발전되고 있는지 알아보자.\n\n\n                                A. 2000년대: 서비스디자인의 도입\n\n                                2000년대는 대한민국 디자인사 에서 중요한 시기로, 세계 그래픽 디자인\n                                대회, 산업 디자인 대회 등 대한민국의 디자인이 세계적으로 주목받는 많은\n                                계기가 있었다. 특히 인터넷이 널리 확산됨에 따라 디지털 디자인 영역에서\n                                서비스디자인의 역할과 정책 및 공공디자인 영역에서의 서비스디자인의 역할이\n                                더욱 강조되었다.\n\n\n                                2008 서비스디자인 소개\n\n68                              국내에서 서비스디자인의 개념이 처음 소개된 것은 표현명, 이원식, 최미경의\n표현명, 이원식, 최미경(2008), 《서\n비스디자인 시대》, 안그라픽스                저서 『서비스디자인 시대』 68이다. 이 저서는 마케팅의 관점에서 다양한 사례를\n\n69                              보여주며 서비스디자인 마케팅의 이론을 정리하였다.\n대한민국 정책브리핑(2008), 《서\n비스산업 선진화 방안》 (https://\nwww.korea.kr/archive/           2008 서비스산업 선진화 방안\nexpDocView.do?docId=11625)\n                                대통령 주재 민관합동 경제 활성화 회의에서 서비스산업 선진화 방안(Service-\n70\n한수련(2009), <서비스디자인              PROGRESS 69)이 확정 및 발표되었다. 정부는 서비스산업 선진화의 비전으로\n(Service Design) 측면에서 공공\n                                서비스산업에서 좋은 일자리가 많이 창출되는 나라, 제조업과 서비스업이 함께\n서비스평가 방향연구>, 이화여자\n대학교 디자인대학원 석사학위 논               발전하는 나라를 제시하고 단기, 중기, 장기 과제를 단계적으로 추진해 나갈\n문 (http://www.riss.kr/search/\ndetail/DetailView.do?p_mat_     계획을 밝혔다.\ntype=be54d9b8bc7cdb09&con\ntrol_no=b83a375e0f7b6f8bffe\n0bdc3ef48d419)                  2009 최초의 서비스디자인 학위 연구\n\n71                              이화여자대학교 디자인 대학원 이혜선 교수의 지도로 「서비스디자인 측면에서\n김정은(2009), <혁신적인 서비스 디\n자인을 위한 디자인의 역할>, 이화여            공공서비스 평가 방향 연구」 70 와 「혁신적인 서비스디자인을 위한 디자인의\n자대학교 디자인대학원 석사학위 논\n문 (http://www.riss.kr/search/\n                                역할」71 이라는 최초의 서비스디자인 주제 학위 연구가 등장하였다.\ndetail/DetailView.do?p_mat_\ntype=be54d9b8bc7cdb09&\ncontrol_no=e36508a9d7030861\nffe0bdc3ef48d419)\n\n\n\n\n62    Part 1. 왜 서비스디자인인가?\n\f                                B. 산학연관 협업을 통한 서비스디자인 혁신\n\n                                2010년대에 이르러 서비스디자인이 활성화될 수 있었던 중요한 계기는 정부에\n                                의해 마련되었다. 정부는 2010년대의 제조 서비스화, 서비스산업 확대 등\n                                산업 구조적인 변화를 반영한 다양한 정책을 통해 서비스디자인을 지원하였다.\n                                이처럼 정부가 서비스 혁신의 필요성을 인식하게 되면서 국책 연구소, 정책\n                                연구 기관들을 중심으로 서비스 고도화 를 위한 각국의 정책들이 연구되고\n                                해외의 다양한 서비스 혁신 동향이 국내에 소개되었다. 또한 서비스디자인을\n                                비디자이너들에게 알리는 홍보 활동이 활발해졌다.\n\n\n                                2010 서비스 R&D 활성화 방안\n                                당시 지식경제부와 한국디자인진흥원을 중심으로 에너지, 보건 의료, 산업단지,\n                                전통시장 등 공공서비스 분야에서의 시범 사업과 서비스디자인 관련 R&D\n                                과제들이 추진되었다.\n\n\n                                2010 디자인 대학원 최초의 서비스디자인학과 신설\n                                동서대학교가 디자인 대학원 최초로 서비스디자인학과를 신설했다. 현재는\n                                성균관대학교, 이화여자대학교, 홍익대학교 등 다양한 대학에서 서비스디자인\n                                대학원 과정을 신설하여 인재를 양성하고 있다.\n\n\n                                2010 서비스디자인 특집\n                                디자인 전문지 『월간 디자인』은 국내 최초로 서비스디자인 특집호(보이지\n                                않는 디자인, 서비스를 디자인하라, 2010년 10월호)를 출간하였다. 디자인의\n                                각 분야에서 서비스디자인에 대한 관심을 갖는 중요한 계기가 되었을 것으로\n                                보인다.\n\n\n                                2011 산업계에서의 UX 전문가\n                                민 간 산 업에 서 는 현대 카 드 , 신한 은 행 금 융업 과 의 료업 계에 서 먼 저\n                                서비스디자인을 도입하기 시작하였고, 제조업에서는 삼성전자, LG전자, 현대\n                                자동차 등 대기업을 중심으로 서비스디자인 조직이 갖춰졌다.\n\n\n                                2011 한국서비스디자인협의회(한국서비스디자인학회) 설립72\n72                              서비스디자인 연구와 확산을 위해 산학연관 협업 기구로서\n사단법인 한국서비스디자인학회\n(www.servicedesigncouncil.kr)   한 국서비스디자 인협의회가 법인으 로 설립되었다. 국내 대표 서비스디자 인\n                                전 문가 들 이 공 공 분 야 의 사회 문제 해 결, 제 조업 기반 서비 스 융 합 연 구,\n                                산 업 발전 을 위한 의견 수렴 및 정책 개발의 장 을 마 련하 였으며 2014년\n                                대구지회를 시작으로 광주지회, 중부지회 등 지역 활동이 본격적으로 생겨났다.\n                                한국서비스디자인학회로 변경한 2017년 이후에도 활동을 이어가고 있다.\n\n\n\n\n                                                                  서비스·경험디자인 이론서   63\n\f                                 2011 최초의 서비스디자인 워킹 그룹\n                                 한 국디자 인진흥원의 주최 로 최 초 의 디자 인 워킹 그룹 Design Dive가\n                                 설립되었고 2014년까지 총 6회에 걸쳐 다양한 문제에 대한 서비스디자인의\n                                 해결책을 제시하였다.\n\n\n                                 2012 서비스 관련 팀 창설\n                                 서울디 자 인 재단 (백 종 원 대 표이 사)이 디 자 인진 흥기관 중 최 초 로 시민\n                                 서비스디자인 팀 등 서비스디자인 관련 3개 팀을 창설하였다.\n\n\n                                 2014 산업디자인진흥법 개정\n73                               산 업디 자 인 진 흥법이 개 정되어 산 업디 자 인의 한 분 야로 서비스디 자 인이\n산업디자인진흥법(https://www.\nlaw.go.kr/법령/산업디자인진흥법),          추가되었고, 이 개정안73 은 2015년 7월부터 시행되어 효력을 발휘하게 되었다.\n2021.12월 기준\n                                 산업디자인에 서비스디자인의 개념이 추가되면서 서비스디자인의 수요 확산과\n                                 이에 따른 체계적인 지원이 활성화되는 결정적인 계기가 되었다.\n\n\n                                 2014 정부3.0 국민디자인단 발족\n74                               다 양한 이해관계자 들이 정책의 기획 단계부터 참여함으 로써 맞춤형 공 공\n한국디자인진흥원, 국민디자\n인단 (https://www.kidp.            서비스를 개발할 수 있다는 취지에 따라, 산업통 상자원부와 행정안전부는\nor.kr/?menuno=1130)\n                                 시민, 전문가, 공무원 등으 로 구 성된 국민디자 인단을 운영하게 되었다. 74\n                                 국민디자인단은 독일 iF디자인어워드에서 2016년 새롭게 창설된 서비스디자인\n                                 부문의 최고상인 금상을 수상하였다.\n\n\n                                 2014 서비스디자인 표준 모형 개발\n                                 한 국디자인진흥원은 한 국산업인력공단과 협력하여 2014년 국가인적자원\n                                 양성의 표준이 되는 국가 직무능력표준 (NCS, National Competency\n                                 St and ards) 에 서비 스 경험디 자 인 을 업 무 영역 으 로 하 는 표 준 모형 을\n                                 개발하였다.\n\n\n                                 2017 최초의 서비스디자인 학부 생성\n75                               서 울의 성 신여 자 대 학 교에 서비 스디 자 인 학 문 을 학 부 차 원 에 서 제 공 하 는\n성신여자대학교, 서비스·디자인공학\n과 (https://www.sungshin.ac.kr/\n                                 최초의 학과인 서비스·디자인공학과 75 가 신설되었다. 서비스·디자인공학과 는\nsites/serdesign/index.do)\n                                 서비스디자인과 공학을 융합한 학과이다.\n\n\n\n\n64    Part 1. 왜 서비스디자인인가?\n\f                               2017 행정절차법 개정\n                               서비스디자인이 행정 전 과정에 활용될 수 있는 제도적 기반이 마련되었다\n\n\n                               2019 서비스·경험디자인기사\n76                             서비스·경험디자인기사 76 가 국가기술자격으로 신설됨과 동시에 국가기술자격법\n한국디자인진흥원, 서비스·경험디\n자인 국가기술자격검정 (https://          시행령 개정안을 공포함에 따라 한국디자인진흥원이 서비스·경험디자인기사의\nwww.kidp.or.kr/?menuno=1377)\n                               자격 검정 및 관리 업무를 위탁 및 수행하게 되었다.\n\n\n                               2019 디자인 주도 사회적기업 혁신역량 강화사업\n                               한 국디자 인진흥원은 서비스디자 인을 혁신 도구로 활용하 여 사회적 경제\n                               조직의 비즈니스 모델을 특화시키기 위해 ‘디자인 주도 사회적기업 혁신역량\n                               강화사업’을 시행하였다.\n\n\n                               2021 대구대 서비스디자인연구소, 한국서비스디자인학회와 MOU\n                               대구대는 2022학년도 서비스디자인 전공을 신설하고 서비스디자인 분야의\n                               국제 적인 연 구 및 사 업 추 진 을 통한 연 구 네 트워 크를 구 축 하기 위하 여\n                               한국서비스디자인학회와 업무 협약을 체결했다.\n\n\n                               2021 ~ 공공서비스디자인활성화법 개설 진행 중\n                               행정안전부를 중심으로 시민의 정책 참여를 보장하고 사용자 중심의 공공서비스\n                               공 급 시스템의 구 축을 추진함으 로써 공 공서비스의 품 질과 효율 성을 높여\n                               시민의 기본권을 보장하고자 하는 공공서비스디자인 활성화법이 개설 진행\n                               중이다.\n\n\n\n\n                                                               서비스·경험디자인 이론서   65\n\fC. 한눈에 살펴보기\n\n\n\n\n                                      BEFORE\n\n\n\n\n              서비스디자인의 도입                       2000년대\n              2008 서비스디자인 소개\n              2008 서비스산업 선진화 방안\n              2009 최초의 서비스디자인 학위 연구\n\n\n\n\n                               2010년대          산학연관 협업을 통한\n                                               서비스디자인 혁신\n                                               2010 서비스 R&D 활성화 방안\n                                               2010 디자인 대학원 최초의 서비스디자인학과 신설\n                                               2010 서비스디자인 특집\n                                               2011 산업계에서의 UX 전문가\n                                               2011 한국서비스디자인협의회(한국서비스디자인학회) 설립\n                                               2011 최초의 서비스디자인 워킹 그룹\n                                               2012 서비스 관련 팀 창설\n                                               2014 산업디자인진흥법 개정\n                                               2014 정부3.0 국민디자인단 발족\n                                               2014 서비스디자인 표준 모형 개발\n                                               2017 최초의 서비스디자인 학부 생성\n                                               2017 행정절차법 개정\n                                               2019 서비스・경험디자인 기사\n                                               2019 디자인 주도 사회적기업 혁신역량 강화사업\n                                               2021 대구대 서비스디자인연구소, 한국서비스디자인학회와 MOU\n                                               2021 ~ 공공서비스디자인활성화법 개설 진행 중\n\n\n\n\n66   Part 1. 왜 서비스디자인인가?\n\f3.2.3 서비스디자인의 글로벌 현황\n\n19 8 0 년대 부 터 발전해 온 서비 스디 자 인 은 학 문 적인 성 과 와 함께 실 용\n학문으로서 서비스산업의 고도화를 위해 다양한 노력을 하고 있다. 미국, 일본,\n독일, 핀란드, 영국 등의 국가들에서는 서비스산업 혁신에 대한 관심이 높아짐에\n따라 정부가 적극적으로 서비스 혁신 프로그램의 도입을 추진하고 있다. 개별\n국가 차원을 넘어서 EU에서도 종합적인 서비스 혁신 프로그램의 도입을 위해서\n다양한 정책 방안을 연구하고 구체적인 실행 계획을 작성하여 운영하고 있다.\n이처럼 전 세계는 서비스디자인이 경제, 사회, 교육 등 국가 기반에 미치는\n영향에 대해 인지하고 이를 위한 다양한 노력을 하고 있다. 서비스디자인을 위한\n각 국가들의 노력과 서비스디자인의 현황에 대해 알아보겠다.\n\n\n\nA. 미국과 영국: 고부가가치 신규 산업 창출 의지\n\n미국의 컴퓨터 하드웨어 제 조 판 매 기업 IBM 은 새 로운 학문인 서비스\n사이언스에 많은 지원을 아끼지 않았다. 서비스 사이언스란 서비스산업의\n본질을 규명하고 이를 바탕으로 혁신과 생산성 향상을 달성하기 위한 IT, 과학,\n수학, 경영학, 경제학, 마케팅 등의 다양한 학제 간 지식을 추구하는 분야이다.\n이미 전 세계의 산업구조가 서비스산업으로 이동하고 있고, 특히 제조업의 주요\n가치 창출 활동이 서비스 분야로 옮겨 가면서 미국은 서비스 중심으로 국가의\n비즈니스 포트폴리오를 재편하는 노력을 기울여 왔다. 그에 따라 서비스 품질,\n가격 책정, 신서비스 설계, 의료, 금융, 교통, 항공 등의 고부가가치 분야에서\n서비스 혁신을 위한 노력이 지속되었다.\n영국은 디자인 카운슬, 리브 워크, 엔진 등의 강력한 서비스디자인 역량을\n기반으로 고부가가치 신규 산업 창출을 위한 노력을 지속하였다. 특히 영국의\n경우 서비스와 경영 분야의 컬래버레이션(collaboration)을 통하여 서비스\n비즈니스 모델을 개발하고, 제조업의 서비스화, 조식 및 시스템 혁신, IT 기술\n활용의 상품화 등을 이루었다.\n\n\n\nB. 독일, 일본: 제조 생산 분야에서의 단계적 서비스 혁신\n\n제 조 생 산 분 야 에 서 두 각 을 나 타 내 고 있 는 독일의 경 우, 해 당 분 야 에\n서비스디자인을 도입하여 단계적 혁신을 이루기 위해 노력하였다. 1995년부터\n서비스 R&D 지원을 시작하였고, 전체 R&D 지원 규모의 15%인 총 18억 유로\n이상을 서비스 혁신을 위한 정책을 구안하는 데 지원하였다. 이로 인하여 서비스\n수출, 제품과의 서비스 융합, 서비스 질 및 숙련도 향상이 이루어졌다. 서비스\n실험실을 운영하여 개별 기업의 서비스 혁신을 지원하고 디자인 리터러시 증진을\n위해서도 노력하였다.\n\n                                   서비스·경험디자인 이론서   67\n\f77                                 일본은 2014년 전체 서비스산업을 대상으로 한 새로운 서비스산업 정책 77 을\n삼성경제연구소(2007), 《일본의 서\n비스 산업 활성화 전략과 시사점》                 발표하였다. 생산성 향 상 에 초점을 둔 기존 정책에서 한 걸음 더 나 아가\n(http://www.moel.go.kr/local/\njungbu/common/downloadFile.\n                                   서비스산업의 고부가가치화를 목표로 서비스산업 생산성 협의회를 구성하고,\ndo;jsessionid=HzDJhSn6ua\n                                   수요 창출 확대, 경제력 및 생산성 향상, 정책 인프라 정비를 위한 서비스 육성\nkFLpxg3ONQDh7fCgM24n\nLEE5LMPQkchK2ipHdayX6t             정책을 마련하였다.\nY8N9JzV3hq1p.moel_was_\noutside_servlet_wwwlocal?file_\nseq=21171251244&bbs_\nseq=1183446418834&bbs_\nid=LOCAL1)                         C. 핀란드: 공공성과 복지를 강조하고 서비스 중소기업 육성\n\n\n78                                 핀란드는 서비스디자인을 통한 혁신을 위해 국가 차원에서 다양한 연구를\nInland (http://inlanddesign.fi/)\n                                   개발, 지원하고 자 노력하 는 국가 이다. 이를 위해 연구 개발 혁신을 위한\n                                   공공기금 기구인 Tekes(the Finnish Funding Agency for Technology and\n                                   Innovation)에서 조직한 프로그램 'Serve Innovative Services'를 운영하기도\n                                   했다. 또한 핀란드 정부는 사용자 중심-인간 중심의 서비스(정책) 디자인의\n                                   핵심인 ‘공 동 디자인(Co-designing)’을 위하여 이민국 내 서비스디자인\n                                   스튜디오(부서)를 운영하며 혁신 기술을 활용 78 해 부서 간 관료주의적 장벽을\n                                   보완하고 국민들에게 와닿는 서비스를 제공하고자 노력하였다. 특히 공공성이\n                                   큰 보건, 금 융 분 야 와 B2B 서비스 를 국민들 에게 제 공하고, 중 소기업의\n                                   서비스디자인 리터러시를 증진하기 위한 프로그램 개발에도 주력하였다.\n\n\n                                   D. 싱가포르: 정부 중심의 서비스 디자인 조직 운영 및 활용\n\n\n79                                 싱가포르 정부의 디자인산업 육성 전략인 Design 202579 가 발표되면서 정부의\nDesign Singapore Council\n(https://www.designsingapore.      디자인 활용 확대 방안도 제시되었다. 관련 내용으로는 디자인 전문가 채용,\norg/resources/design-2025.\n                                   디자인 조직의 구성, 디자인 적용 시범 사업의 실행 등이 있다. 국무총리실 산하\nhtml)\n\n                                   THE Lab(The Human Experience Lab)에서는 정부 각 부처의 디자인씽킹\n                                   교육 및 프로젝트 진행을 주관하고 있으며, 국세청(LEA:D)에서는 디자인과\n                                   데이터 사이언스 간의 결합을 연구하여 관련 정책들을 제공하고 있다.\n\n\n\n                                   3.2.4 서비스디자인의 국내 현황\n\n                                   글로벌 동향과 비교하면 서비스디자인이 국내에 도입된 시기는 다소 늦은\n                                   편이었으나, 국내의 강력한 디자인 거버넌스, 공공 수요 시장의 확대, 기술\n                                   혁명과 높은 수준의 기술 인프라 구현 등으로 빠르게 발전하였다. 전 세계적으로\n                                   서비스디자인을 조직 역량으로 활용하는 시기를 지나 정책을 위한 디자인으로서\n                                   서비스디자인이 활용되고 있는 오늘날 국내의 서비스디자인 현황 에 대해\n                                   알아보겠다.\n\n68      Part 1. 왜 서비스디자인인가?\n\f                                A. 관련 단체\n\n                                거버넌스 측면에서 서울시의 디자인정책과 등 정부 산하 에 서비스디자인\n                                운영을 위한 다 양 한 부처들이 마 련되어 있으며, 특히 한 국디자 인진흥원\n                                서비스디자인실에서는 서비스디자인의 수요 시장을 확장하기 위해 서비스디자인\n                                기획연구 및 선행 사업을 추진하고 있다.\n                                학계에서는 한국서비스디자인학회를 주축으로 하여 서비스디자인 관련 연구가\n                                활발히 진행 중이며, 동서대학교, 성균관대학교, 이화여자대학교, 홍익대학교\n                                등에서 서비스디자인 석사 과정을, 동서대학교, 성신여자대학교, 대구대학교는\n                                학부에도 서비스디자인 관련 학과를 운영 중이다.\n                                민간 부분에서 서비스디자인 리터러시를 증진하고 생활 밀착형 서비스를 제안하기\n                                위한 노력도 꾸준히 있어 왔는데, 2014년 행정안전부와 한국디자인진흥원이\n                                함께 기획한 ‘국민디자인단’이 대표적인 예이다. 이뿐만 아니라 각 지자체에서도\n                                서비스디자인의 확산을 위한 시민 프로그램 및 학생들을 위한 서비스디자인 교육\n                                등을 운영하고 있다.\n\n\n\n                                B. 경제적 활용\n80                              서비스디자인은 부가가치가 매우 큰 편인 반면, 개발 비용이 낮은 편에 속한다.\n산업연구원(2016), 《국내 서비스 디\n자인 활용 현황 및 시사점》 (https://       이에 따라 산업연구원의 연구보고서 80 에서는 서비스디자인 도입을 확대하여\nwww.kiet.re.kr/kiet_web/main.\n                                제조업과 서비스업에서의 혁신 수단으로 활용할 필요가 있음을 강조하였다. 해당\njsp?sub_num=12&state=view&i\ndx=52182&pageNo=1&pageNo        보고서에서는 서비스디자인 분야 전문회사 수의 증가, 적극적인 정부 R&D,\nS=12&pageNoA=5)\n                                신시장 개척을 위한 산업, 기술 등을 연계한 서비스디자인 중심의 융합 프로그램\n                                도출 등을 강조하였다.\n                                디자인산업과 관련한 자세한 사항은 앞 장의 서비스디자인의 산업 부분을\n                                참고하기 바란다.\n\n\n\n                                C. 인식 확산 및 역량 강화\n\n                                중소기업, 디자인 기업을 대상으로 한 서비스디자인 프로세스 활용 및 혁신\n                                지원을 위한 역량 강화 교육 및 컨설팅인 ‘디자인씽킹 기반 맞춤형 교육 컨설팅’\n                                프로그램이 한국디자인진흥원의 주도로 운영 중이다. 또한 서비스디자인 소개\n                                및 활용 매뉴얼, 교육 콘텐츠, 운영 지침을 보급하고 프로그램을 확산하기\n                                위한 활동 등을 공공 및 민간 수요 시장을 대상으로 서비스디자인에 대한\n                                인식을 확산하기 위해 노력하고 있다. 또한 전문가 양성을 위하여 서비스디자인\n                                고도화에 대해서도 지속적으로 노력하고 있다.\n\n\n\n\n                                                             서비스·경험디자인 이론서   69\n\fPART 02\n서비스·경험디자인은 무엇인가?\n\n\n\n\n70   Part 1. 왜 서비스디자인인가?\n\f서비스·경험디자인 이론서   71\n\f01\n서비스·경험디자인의 이해\n디자인씽킹, 사용자 경험디자인, 서비스디자인 등 다양한 서비스디자인의 정의를\n비교해 본다.\n\n\n\n\n72   Part 2. 서비스·경험디자인은 무엇인가?\n\f                                 1.1 디자인씽킹 정의\n\n                                 디자인씽킹(Design Thinking)은 디자이너가 생각하 는 방식으 로 문제를\n                                 창의적으로 해결하는 과정이다. 디자인씽킹이라는 개념은 디자인의 영역을\n                                 넘어 다양한 상황과 맥락에서 문제를 찾고 해결하는 접근 방법으로 활용되면서\n                                 더욱 발전하고 있다. 특히, 혁신을 위한 방법론으로서의 가치가 널리 인정되면서\n                                 비즈니스 전 영역에서 조직이나 기업의 혁신을 위한 도구로 활용되고 있으며,\n                                 나아가 사회 문제나 정책적 문제를 해결하는 데에도 큰 역할을 하고 있다.\n\n\n                                 학계에서의 논의\n81                               초기 논의들 중 하나로 피터 로위(Peter Rowe)는 디자인씽킹의 절차적\nPeter Rowe(1987), 《Design\nThinking》, Cambridge, MA: MIT    측면에 대하여 소개하였는데, 주로 건축이나 도시계획에서의 디자인 과정을\nPress\n                                 체계적으로 설명하고 일반화된 원칙을 제안하였다. 81 더불어 디자이너들이\n82\n                                 일하는 방식에 대해 논하고 문제해결의 과정 자체가 해결 방안을 만들 수 있음을\nNigel Cross(2006), 《Designerly\nWays of Knowing》, Berlin:        주장 하였다. 이후 디자이너들이 어떻게 일하고 사고하 는지에 대해 다양한\nSpringer\n                                 분야의 연구가 있었는데, 그중 나이젤 크로스(Nigel Cross) 82 는 디자이너들이\n                                 정의 내리기 어려운(ill-defined) 문제들을 다룰 때 해결책 중심의 문제 해결\n                                 방식을 사용한다고 보고, 새로운 해결책을 창출하려는 디자이너들의 성향을\n                                 설명하기 위해 유도 추론(Abductive Thinking)을 강조하였다. 일리노이 공과\n                                 대학(Illinois Institute of Technology)의 명예교수였던 찰스 오웬(Charles\n                                 Owen.2007)은 디자인씽킹을 과학적 사고(Scientific Thinking)의 상호보완적\n                                 개념으로 보고 특히 복잡하고 불분명한(ill-formed) 문제들을 해결하는 데 큰\n                                 가치가 있다고 보았다. 그는 또한 창의성의 영역을 크게 맥락(상징적-현실적)과\n                                 프로세스(분석적-종합적)라는 두 개의 축을 중심으로 나누고, 상징적이고\n                                 분석적인 과학과 현실적이고 종합적인 디자인의 두 영역 간의 사고 방법의 차이로\n                                 인해 서로 효과적인 보완 관계가 성립될 수 있다고 하였다.\n\n\n\n\n                                                                        서비스·경험디자인 이론서    73\n\f                                   산업에서의 논의\n83                                 학계에 서부터 논의되기 시작 한 디자 인씽킹이라 는 용어는 오늘날 기업이\nTim Brown(2009), 《Change by\nDesign: How Design Thinking        직면하고 있는 비즈니스와 관련된 문제에서 많이 사용되고 있다. 글로벌 디자인\nTransforms Organizations and\n                                   전문 회사인 아이디오(IDEO)를 이끌고 있는 팀 브라운(Tim Brown) 8 3 은\nInspires Innovation》, New York:\nHarper Collins                     디자이너처럼 생각하는 것(Thinking like a Designer)을 통해 제품, 서비스,\n\n84                                 프로세스를 넘어 전략을 개발하는 방법까지도 변화시킬 수 있다고 주장하면서\nRoger Martin(2009), 《The\n                                   조직을 변화시키고 혁신의 영감을 만들어내는 디자인씽킹의 역할을 강조하고\nDesign of Business: Why Design\nThinking Is the Next Competitive   널리 알리는 데 기여하였다. 주로 전문 디자이너가 사고하고 일하는 방식에\nAdvantage》, Cambridge MA:\nHarvard Business Press             초점을 둔 팀 브라운과 달리 토론토 로트먼 경영대학원 학장인 로저 마틴(Roger\n                                   Martin) 84 은 디자인씽킹이 조직 체계에 더욱 초점을 두고 조직이나 기업에 경쟁\n                                   우위(competitive edge)를 제공하는 역할을 한다고 주장하였다. 이들의 사례는\n                                   모두 디자인에 대한 경영 분야에서의 관심을 보여준다. 이에 따라 비즈니스와\n                                   경영 교육에서도 디자인씽킹에 대한 이해가 중요하게 인식되면서 MBA 과정에\n                                   디자인씽킹이 도입되었다. 해당 사례로는 폭스 경영대학원, 템플대학교(Temple\n                                   University), 로트먼 경영대학원, 토론토대학교(University of Toronto), 사이드\n                                   경영대학원, 옥스포드 대학(University of Oxford), 웨더헤드 경영대학원,\n                                   케이스웨스턴리저브대학교(Case Western Reserve University) 등이 있다.\n\n\n\n\n74    Part 2. 서비스·경험디자인은 무엇인가?\n\f                                  디자인씽킹은 다양한 기관, 기업, 학계에서 정의되고 있다.\n\n85\n                                              제목                                    내용\nTim Brown(2008), 《Design\nThinking》, Harvard Business\nReview                                                              디자인씽킹은 혁신 활동의 전체 스펙트럼에 인간 중심의\n                                                                    디자인 정신을 주입하는 방법론이다. 즉, 혁신은 사람들이\n86                                                                  삶에서 무엇을 원하고 필요로 하는지, 그리고 특정 제품의\n                                                85\nIngo Rauth, Eva Köppen,                 팀 브라운        (2008)\n                                                                    제조, 포장, 마케팅, 판매 및 지원 방식에 대해 무엇을\nBirgit Jobst and Christoph\nMeinel(2010), 《Cited in Design\n                                                                    선호하는지에 대한 철저한 이해와 직접적인 관찰에 의해\nThinking: An Educational Model                                      추진된다.\ntowards Creative Confidence》\n\n                                                                    디자인씽킹은 창의적인 문제 해결을 위한 과정이다. 인간\n87\nDavid Kelley, Tom Kelley(2014),          IDEO, ideo.org             중심의 핵심을 통해 조직이 사용자에게 집중하도록 하여\n《Creative Confidence》, William                                      제품, 서비스 및 내부 프로세스를 개선할 수 있다.\nCollins\n\n                                                                    디자인씽킹은 정적인 과정이 아니라 창의적인 문제 해결을\n88\nJeanne Liedtka(2018), <Why                                          위한 접근법이다. 각 팀과 개인은 문제를 해결하면서\ndesign thinking works>, Harvard                                     자신만의 프로세스를 개발하고, 진행하면서 적응해 간다.\nBusiness Review                                                86\n                                     d.school in Stanford           중요한 것은 결과가 어떻게 되는지가 아니라 어떻게\n                                                                    일하는지에 신경을 쓰는 것이다. 단계와 상관없이 프로세스는\n89\n                                                                    공감, 프로토타입, 공동창작, 반복 및 피드백이라는 기본\nNigel Cross(2011), 《Design\nThinking》, BERG                                                     요소를 갖추어야 한다.\n\n\n\n                                                                    디자인씽킹은 디자이너의 도구와 사고방식을 사용하여\n                                                                    인간에게 필요한 것을 찾고 새로운 솔루션을 만드는\n\n                                                          87        방법이다. 이러한 접근 방식은 단지 미학이나 물리적 제품에\n                                  톰 캘리 & 데이비드 캘리 (2014)\n                                                                    관심을 기울이는 것 이상을 의미한다. 디자인씽킹이라는\n                                                                    방법론을 사용하여 창의적이고 새로운 방법으로 다양한\n                                                                    개인, 사회, 그리고 비즈니스 문제들을 다룰 수 있다.\n\n\n                                                                    디자인씽킹은 혁신가들이 혁신을 방해하는 역 생산적\n\n                                                88                  경향에서 벗어날 수 있도록 도와주는 구조화된 프로세스를\n                                        진 리드카        (2018)\n                                                                    제공한다. 그것은 실용적인 도구와 인간 본성에 대한 통찰을\n                                                                    통합한 사회 기술이다.\n\n\n\n                                                     89             디자인씽킹은 인간의 인지에 내재된 것이며 우리를 인간으로\n                                      나이젤 크로스 (2011)\n                                                                    만드는 핵심 부분이다.\n\n\n\n                                                                    디자인씽킹은 고객 중심의 공감, 창조적인 반복, 메이커\n                                  Design Management Institute,\n                                                                    정신에 대한 편견을 넘어 조직에서 창의성과 혁신을 배양하는\n                                           dmi, org\n                                                                    수단으로써 현대 조직에 더 많은 것을 제공한다.\n\n\n\n\n                                                                                     서비스·경험디자인 이론서     75\n\f                                    디자인씽킹에 대한 3가지 관점\n\n90                                  1. 혁신 방법론으로서의 디자인씽킹: Design Thinking as a methodology 90\nDavid Kelley, Tom Kelley(2015),\n《Creative Confidence:               디자인씽킹을 하나의 방법론(methodology)으로 보는 관점이다. 인간은 누구나\nUnleashing the Creative Potential\nWithin Us All》, London: William\n                                    창의적이고, 또한 후천적으로 노력하면 더욱 창의적일 수 있다는 전제하에 이러한\nCollins\n                                    창의성(creativity)에 더해 영감(inspiration)과 프로토타이핑(prototyping)을\n                                    활용하여 감정적(emotional), 기능적(functional)으로 의미 있는 아이디어를\n                                    발굴함으로써 획기적인 혁신을 이룰 수 있다고 본다. 이러한 개념적 접근은\n                                    IDEO에서 주로 사용되어 다양한 형태의 기업들이 혁신을 이루고 성장하는 데 많은\n                                    도움을 주었다.\n\n\n                                    2. 사고방식으로서의 디자인씽킹: Design Thinking as a way of thinking\n                                    디자인씽킹을 인간이 가진 인지 능력의 유형 중 하나로 보는 관점으로 디자이너\n                                    개개인이 문제를 해결하기 위해 사고하는 방법에 집중한다. 디자인의 문제를\n                                    복잡하고 규명하기 어려운 문제로 보는 관점이기도 하다. 흔히 문제에 대한 해결\n                                    과정을 위한 유도 추론(abductive thinking)과 유사한 사고법으로 설명되거나,\n                                    이에 더해 귀납법(inductive), 연역법(deductive)이 함께 혼합된 사고법으로\n                                    설명되기도 한다. 또한, 수렴적(convergent) 사고와 확산적(divergent) 사고의\n                                    반복적인 과정으로 설명될 수 있다.\n\n\n                                    3. 마인드셋으로서의 디자인씽킹: Design Thinking as a mindset\n                                    디자인씽킹을 문제를 대하 는 태도나 자세에 집중하여 이해하 는 관점이다.\n                                    흔히 언급되는 특징과 관련된 어휘에는 인간 중심적인(human-centered),\n                                    열린 마음의(open-minded), 낙관적인(positive), 협동의(collaborative),\n                                    실험적인(experimental), 공감하는(empathetic) 등이 있다. 이러한 마인드 셋은\n                                    창의적인 발상을 통한 혁신적 아이디어 발굴을 위해 필수적인 요소로 인식된다.\n\n\n\n\n76        Part 2. 서비스·경험디자인은 무엇인가?\n\f디자인씽킹 프로세스\n\n스탠포드 대학(D. School)에서 개발한 디자인씽킹 프로세스는 공감하기(Empathize),\n문제 정의(Define), 아이디어 찾기(Ideate), 프로토타입(Prototype), 평가하기(Test)의 다섯\n단계로 이루어진다. 이는 구체적으로, 사용자의 행동을 바탕으로 그들의 생각과 요구를\n확인하고, 간단한 재료를 사용해서 빠른 속도로 해결을 위한 아이디어를 구체화한 다음,\n사용자의 의견을 듣고 이를 반영해 수정하고 다시 평가받는 작업을 반복하는 과정을 통해\n문제 해결 방법에 접근하는 것이다. 한편, IDEO는 디자인씽킹의 과정을 발견(Discovery),\n해석(Interpretation), 아이디어 만들기(Ideation), 실험하기(Experimentation),\n발전하기(Evolution)의 다섯 단계로 본다. 각 단계별로 문제를 이해하고 영감을 모으는\n것에서부터 시작하여 자료들로부터 의미를 찾고 기회를 포착하는 해석의 과정을 거친다.\n디자인씽킹은 기회를 실현하기 위한 아이디어들을 만들고 실험을 통해 테스트하면서\n또다시 새로운 발견으로 나아가는 과정으로 설명된다.\n\n\n\n\n                                           서비스·경험디자인 이론서      77\n\f                                1.2 서비스디자인 정의\n91                              서비스디자인(Service Design)이란 서비스를 개발하고 혁신하기 위한 과정\nSangiorgi, Daniela and\nPrendiville, Alison and Jung,   전반에서 행해지는 디자인 활동을 포괄적으로 일컫는 개념이다. 이것은 서비스\nJeyon(2016), <Expanding\n                                사용자를 이해하기 위한 접근 방법에서부터 디자인 방법이나 도구들의 사용,\nService Design Spaces>, In:\nDesigning for Service: Key      서비스 시스템과 프로세스 디자인에 이르기까지 다양한 활동을 포함한다.\nIssues and New Directions.\nBloomsbury, London, pp. 26-42   서비스디자 인은 9 0년대 초반부터 서비스 혁 신을 위한 창 의적이고 인간\n                                중심적인(human-centered) 접근 방식을 도입하기 위한 시도로써 활용되기\n                                시작하여 응용 분야와 관련된 연구 영역이 지속적으로 확장되고 있다.91\n\n                                학계에서의 논의\n                                서비스디자인은 1991년 퀼른 국제디자인학교(Köln International School of\n                                Design_KISD)의 미하엘 에알호프 교수(Prof. Dr. Michael Erlhoff)에 의해\n                                소개되었다. 서비스디자인에 대한 초기의 논의는 새로운 서비스 개발(New\n                                Product Development, NPD)에서 특정 디자인 도구 및 활동의 역할을 설명하는\n                                것에 초점을 두었다. 새로운 서비스 개발에 대한 논의는 점차 서비스 혁신을 위한\n                                디자인씽킹의 잠재적 역할에 대한 관심으로 확대되었고, 이는 다시 디자이너들이\n                                NPD 프로세스의 전 과정에서 자신들의 역할을 확대시킬 수 있는지에 대한 논의로\n                                발전되었다. 현재에는 서비스 개발뿐 아니라 서비스 구현을 위한 다양한 논의가\n                                진행되고 있다. 경영이나 마케팅 분야의 일부로 여겨지던 서비스디자인이 하나의\n                                학문 분야로서 성장해나가기 위해 서비스 공학이나 서비스 경영 등 서비스를\n                                연구하던 기존 학문 영역과의 관계 속에서 서비스디자인의 역할을 규정하는\n                                연구도 활발히 이루어지고 있다.\n\n                                산업에서의 논의\n92                              2 0 0 1년 서 비 스 디 자 인 전 문 기 업 을 표 방 한 디 자 인 컨 설 턴 트 회 사 인\n윤성원(2017), 《보이지 않는 서비스\n보이는 디자인》                        리브워크(Livework)가 런던에 설립되었다. 이후 약 10여 년간 영국과 유럽을\n                                중심으로 서비스 경험을 디자인하는 전문 기업들이 생겨났다. 국내의 업계에서\n                                서비스디자인을 주목하게 된 배경에는 서비스 혁신 필요성을 인식한 정부의\n                                노력이 큰 역할을 하였다. 2009년 정보통신산업진흥원의 주관으로 개최된\n                                서비스 R&D 국제 콘퍼런스를 통해 그 개념이 알려지게 되었고, 2010년부터\n                                산업부와 한 국디자인진흥원의 시범 사업 및 R&D 과제로 서비스디자인의\n                                사례들이 실행되었다. 92 민간에서는 금 융 산업과 의료서비스 영역에서부터\n                                서비스디자인에 대한 관심이 나타나기 시작하였고, 제조업에서는 삼성전자가 가장\n                                먼저 서비스디자인 조직을 갖추었다. 공공 영역에서도 기존의 공급자 중심이던\n                                공공서비스를 사용자 중심으로 혁신하기 위한 방안으로 서비스디자인을 활용하기\n                                시작하였다.\n\n\n\n78     Part 2. 서비스·경험디자인은 무엇인가?\n\f                           현재 에너지, 보건의료, 복지, 산업단지, 전통시장, 학교 등 다양한 공공분야에서\n                           서비스디자인을 통한 혁신 사례들이 생겨나고 있다.\n\n\n                           서비스디자인은 다양한 기관, 기업, 학계에서 정의되고 있다.\n\n          제목                                            내용\n\n\n                            서비스를 설계하고 전달하는 과정 전반에 디자인 방법을 적용하여 사용자의 생각과 행동을\n                            변화시키고 경험을 향상하게 하는 분야로서 사용자 중심의 리서치가 강화된 새로운 디자인\n 한국디자인진흥원(2012)\n                            방법에 제조 및 서비스를 접목하거나 신서비스 모델을 개발함으로써 새로운 부가가치를\n                            창출하는 것을 말한다.\n\n                            서비스디자인이란 고객이 서비스를 통해 경험하게 되는 모든 유무형의 요소(사람, 사물,\n                            행동, 감성, 공간, 커뮤니케이션, 도식 등) 및 모든 경로(프로세스, 시스템, 인터랙션, 감성\n                            로드맵 등)에 대해 고객 중심의 맥락적인(contextual) 리서치 방법을 활용하여 이해관계자\n한국서비스디자인협의회(2011)\n                            간에 잠재된 요구를 포착하고 이것을 창의적이고 다학제적, 협력적인 디자인 방법을 통해\n                            실체화(embodiment)함으로써 고객 및 서비스 제공자에게 효과적, 효율적이며 매력적인\n                            서비스 경험을 제공하고자 하는 방법 및 분야를 의미한다.\n\n\n                            서비스디자인은 고객에게 유용하고 효율적이자 효과적이며 매력적인 서비스를 만드는 것에 대한\n     디자인 카운슬\n                            모든 과정이다. 서비스디자인은 고객 또는 사용자에게 무형의 느낌만을 주는 것이 아닌 실제로\n  (Design Council, UK)\n                            존재하는 것으로써 서비스 접점이라고 부른다.\n\n\n                            서비스디자인은 유용성, 편의성, 효율성을 갖춘 바람직하고 효과적인 서비스 창출을 목적으로\n                            한다. 고객의 경험에 초점을 두고 서비스 이용 품질을 높이는 것을 핵심가치로 추구하는 인간\n   서비스디자인네트워크\n                            중심적인 접근 방식이며 통합적인 전략, 시스템, 프로세스, 접점 디자인 결정을 고려하는\n(Service Design Network)\n                            전체론적 접근 방식이다. 사용자 지향적이고 팀에 기반을 둔 학제 간 접근 방식과 지속적인 학습\n                            사이클을 통합한 체계적이고 반복적인 프로세스를 말한다.\n\n\n                            시간의 흐름에 따라 사람들이 다다르게 되는 다양한 서비스 접점(Touchpoint)을 디자인하여\n        리브워크\n                            고객이 다양한 경험을 할 수 있게 하는 것이다. 서비스 개발을 위한 디자인 프로세스와 역량인\n       (Livework)\n                            서비스디자인은 기존의 서비스를 개선하고 새롭게 혁신하기 위한 창조적이며 실질적인 방법이다.\n\n                            훌륭한 서비스를 개발해 제공하도록 돕는 전문 분야로 서비스디자인 프로젝트는 환경,\n          엔진                커뮤니케이션, 제품 등 디자인의 여러 분야를 포괄해 고객이 서비스를 쉽고, 만족스럽고,\n        (Engine)            효율적으로 누릴 수 있도록 각 요소를 개발하는 것이다. 더 중요한 것은 누가 이 서비스를\n                            개발하는지 잊지 않도록 각인시키는 것이다.\n\n                            팀워크와 공동창작에 중점을 둔 활동 기반 프로세스로써 서비스디자인씽킹을 통해\n   디자인씽커스그룹\n                            복잡한 문제에 대한 혁신적인 아이디어, 변화 및 솔루션을 개발하고 제공할 수 있다.\n(DesignThinkers Group)\n                            (designthinkersgroup.com)\n\n\n                            서비스디자인은 서비스 혁신을 위해 서비스를 이루는 모든 유무형 요소를 배열하고 이를 근거로\n      피어인사이트\n                            하여 디자인하는 것이다. 커뮤니케이션, 공간, 행동, 사람, 사물, 도시 등 서비스를 이루는 모든\n     (Peer Insight)\n                            요소를 리서치에 근거해 디자인하고 배열해 서비스의 혁신을 이루는 것이다.\n\n\n      비르깃 마거                서비스디자인은 고객의 관점에서는 유용하고 사용성이 편리해야 하며, 공급자의 관점에서는\n     (Birgit Mager)         효율적인 서비스를 만드는 것을 목적으로 한다.\n\n     스테판 모리츠                서비스디자인은 고객에게 유용하고 사용하기 편리하고, 조직에 효과적이다. 또한 기존의 것을\n      (Moritz)              개선하거나 혁신하여 통합하는 분야이다.\n\n\n\n\n                                                                   서비스·경험디자인 이론서     79\n\f93\n                                 서비스디자인 이해를 위한 3가지 관점 93\nSangiorgi, Daniela and\nPrendiville, Alison and Jung,\nJeyon and Yu, Eun(2015),\n<Design for Service Innovation\n                                 1. 스킬로서의 서비스디자인: Service Design as a skillset\n& Development>. Final Report.    서비스디자인에서 강조되는 사용자에 대한 조사, 공동 디자인(co-design),\nProject Report. Lancaster\nUniversity, Lancaster, UK.       시각화를 위한 도구들(사용자 고객 여정 지도, 서비스 청사진 등)을 활용할 때\n                                 디자이너가 가진 스킬에 중점을 두는 관점이다. 따라서 이러한 스킬을 활용한\n                                 결과물과 함께 제공되는 서비스 지향적인 사고가 강조되며 서비스 개발의 초기\n                                 단계(조사 및 디자인)에 기여하는 바가 크다. 디자이너와 서비스 조직이 각자\n                                 역할을 명확하게 분리하고 서로 다른 방식과 프로세스에 따라 작업을 진행하며\n                                 서비스디자인의 절차적 측면에 맞춰 조직이 변화하는 경우가 많다.\n\n\n\n\n                                 2. 체계적 프로세스로서의 서비스디자인: Service Design as a systematic\n                                    process\n                                 서비스 개발과 구현에 이르는 전 과정에 걸쳐 작용하는 서비스디자인의 역할은\n                                 조직의 문화에 맞는 체계적인 디자인 프로세스의 적용을 통해 변화를 이끌어내는\n                                 것이다. 의사결정을 거쳐 서비스 조직이나 프로젝트의 성격에 맞는 디자인\n                                 프로세스를 학습하면, 이는 조직 변화의 원동력으로 작용하여 서비스의 개발이나\n                                 혁신 과정을 이끈다. 디자이너와 서비스 조직이 밀접하게 공동창작하면서\n                                 디자이너가 공동의 프로세스를 이끌며 진행하는 방식이다.\n\n\n                                 3. 접근방식으로서의 서비스디자인: Service Design as an approach\n                                 서비스 디자이너 또는 서비스디자인 조직이 가지고 있는 변화와 혁신을 위한\n                                 접근 방식에 대해 높이 평가하는 관점이다. 이러한 접근 방식을 통해 서비스\n                                 제공자가 자신들이 제공하는 서비스에 대해 어떻게 생각하는지를 살펴봄으로써\n                                 장기적으로 변화하게 하는 것을 목표로 한다. 서비스 조직이 서비스디자인\n                                 과정에 참여함으로써 조직 내에 학습이 일어나게 되는데, 이 학습 과정에서\n                                 프 로 토타이핑은 서비스 조직이 기존에 일하던 방식과 프 로 세스를 새롭게\n                                 바라보고 혁신하기 위한 실험의 도구로써 활용되기도 한다. 눈에 보이는 뚜렷한\n                                 서비스디자인 결과물(deliverables)이 없는 경우가 종종 발생하기도 하며, 학습에\n                                 의해 조직 내부 또는 외부에서 변화가 일어나기도 한다. 서비스 디자이너가 서비스\n                                 조직에 소속되어 일하거나 양측이 통합된 형태로 프로젝트가 진행되는 경우가\n                                 주로 해당된다.\n\n\n\n\n80     Part 2. 서비스·경험디자인은 무엇인가?\n\f                                   1.3 사용자 경험디자인 정의\n94                                 사용자 경험(UX: User Experience)디자인은 사용자가 제품 및 시스템을\nInteraction Design Foundation\n“User Experience Design”           사용할 때 의미 있고 적절한 경험을 할 수 있도록 경험 전반을 디자인하는\n(https://www.interaction-\ndesign.org/literature/topics/ux-\n                                   분야이다. 이것은 브랜딩, 디자인, 사용성 및 기능의 측면과 제품을 획득하고\ndesign)\n                                   통합하 는 전체 프로세스 디자인 측면을 포함한다. 94 이때 시스템은 그래픽\n                                   인터페이스, 제품디자인, 물리적 인터랙션(interaction), 사용 설명서 등으로\n                                   구 성된다. 디자이너들은 상호작용을 통한 경험을 디자인하기 위해 사용자\n                                   경험의 질에 초점을 두고 프로세스에 적용되는 도구들을 활용한다. 사용자\n                                   경험디자인 관점에서의 성공은 디자인된 제품이나 서비스를 의뢰한 고객의 요구를\n                                   충족시키고 그것이 사용자에게 좋은 경험을 제공할 때이다. 결국, 상호작용을\n                                   위한 제품디자인의 과제는 결과적인 경험을 전면에 내세워 제품보다 먼저 경험을\n                                   설계하는 것이다.\n\n                                   학계에서의 논의\n95                                 사용자 경험디자인 개념은 HCI(Human-Computer Interaction) 및 인터랙션\nMarc Hassenzahl & Noam\nTractinsky(2006), <User\n                                   디자인 분야에서부터 시작되어 현재 디자인, 마케팅 등의 분야에서 널리 사용되고\nexperience - a research agenda>,\n                                   있다. 기술이 점점 더 빠르게 발전하고 사용자의 요구에 부합하는 상호작용적인\nBehaviour & Information\nTechnology, 25:2, pp. 91-97,       제품과 서비스에 대한 관심이 증가함에 따라 학계에서도 기존의 제품과 서비스가\nDOI:10.1080/014492905\n00330331                           수용하지 못하는 기술 사용의 다양성과 새로운 측면들에 대한 실행 가능한\n                                   대안으로써 사용자 경험디자인에 대한 관심이 높아지고 있다. 그렇기 때문에\n                                   사용자 경험디자인의 개념적 정의에 대한 활발한 논의가 이루어지고 있으며\n                                   다양한 의견과 견해들이 공존하고 있다. 사용자 경험디자인에 대한 초기 논의들은\n                                   무엇이 좋은 사용자 경험을 구성하는가에 대한 공통된 견해를 확립하기 위해\n                                   노력했다. 그러나 이러한 공통점 확립의 과정에서 경험적(empirical) 연구의\n                                   부족으로 인해 관련 학술지 등에 거의 게재되지 않고 있는 등 이론적 발전과\n                                   개념에 대한 이해를 제한하는 문제점이 지적되기도 한다.95\n\n                                   산업에서의 논의\n                                   사용자 경험디자인은 흔히 사용자 인터페이스(UI: User Interface) 디자인이나\n                                   사용성(Usability)과 같은 용어와 번갈아 사용된다. 하지만 사용자 경험디자인은\n                                   이 두 가지 중요한 개념을 포함하는 상위 개념으로서 광범위한 다른 영역도\n                                   포함한다. 사용자 경험 디자이너는 브랜딩, 디자인, 사용성 및 기능 측면을\n                                   포함하여 제품을 구입하고 통합하는 전체 프로세스를 다룬다. 전체 사용자 여정을\n                                   아우르기 때문에 시각디자인, 프로그래밍, 심리학 및 상호작용 디자인(Interaction\n                                   Design)과 같은 다 양한 영역을 배경으 로 한다. 일반적인 업무 는 사 용자\n                                   조사(User Research), 페르소나(Persona) 생성, 와이어 프레임(Wire frame) 및\n                                   대화형 프로토타입(Interactive Prototype) 제작 등을 포함하여 다양하다.\n\n                                                                          서비스·경험디자인 이론서    81\n\f                                     업무 영역은 조직마다 크게 다를 수 있지만 항상 사용자의 입장이 되어 모든\n                                     디자인 과정에 사용자 요구를 중심에 두고 최적의 방법으로 해결할 때까지 노력을\n                                     기울인다는 점에서 공통적이다. 사용자 경험디자인의 과정은 제품이나 서비스의\n                                     사용 상황이나 맥락에 대한 이해로부터 시작하여 사용자 요구를 파악하여\n                                     구체화하고 솔루션을 디자인한 뒤 다시 파악된 사용자 요구 사항에 맞게 평가하는\n                                     단계로 이루어진다.\n\n\n\n                                     사용자 경험디자인은 다양한 기관, 기업, 학계에서 다음과 같이 정의되고 있다.\n96\nLauralee Alben(1996), <Quality                  제목                                 내용\nof Experience>, Interactions,\n                                                                   사용자 경험디자인은 사용자가 어떤 제품이나 시스템,\n3(3), pp. 11-15\n                                                                   서비스를 직간접적으로 이용하면서 지각하고 반응하게 되는\n97                                         국제표준화기구                 경험을 사용자 경험으로 정의하고, 반복적으로 사용하는\nWikipedia, “User Experience             ISO 9241-210(2010)         상호작용 행위를 통해 학습과 경험을 바탕으로 사용자의\nDesign” (http://en.wikipedia.\n
