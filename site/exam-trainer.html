가 기능을 변경한 가족\n                                  제품/서비스 전개를 진행함.\n                                - \u0007쇠퇴기 (decline): 소비자의 선호 변화로 인해 매출이 하락하며 새로운\n                                  제품/서비스로 대체됨.128\n\n\n시장\n규모\n\n  20                                                    성숙기\n\n                                                                            쇠퇴기\n  15\n\n                                 성장기\n  10\n\n\n\n      5       도입기\n\n\n      0\n\n          0                1       2          3           4          5            6   시간(년)\n\n\n\n                               [ 제품수명주기 ] (출처: 조남재, 기술기획과 로드매핑, 시그마프레스)\n\n\n\n\n                                                                          서비스·경험디자인 이론서 159\n\f                               BCG 매트릭스 (성장 점유율 매트릭스: Growth Share Matrix)\n                               BCG 매트릭스는 보스턴컨설팅그룹(BCG)의 설립자 브루스 헨더슨이 1970년에\n                               에세이 “The Product Portfolio”를 발표한 이후 대중화된 개념으로, 기업 내\n                               다양한 사업의 우선순위를 정하기 위한 포트폴리오 관리 분석 방법이다.\n                               사업 경쟁력과 시장 매력도를 보여주는 지표인 ‘상대적 시장점유율’(Relative\n                               Market Share)과 성장률(Market Growth Rate)의 조합에 따라 사업을\n\n129\n                               네 가지 범주로 분류하고, 각 사분면은 수익성을 나타내는 기호로 표현한다.\nhttps://www.bcg.com/about/\n                               이 매트릭스는 기업에서 자원과 자본을 집중할 사업과 손실을 줄일 사업을\noverview/our-history/growth-\nshare-matrix                   결정하는 데 도움을 준다.129\n\n\n                                     - \u0007별 (Star): 높은 성장률, 높은 점유율. 미래 잠재력이 높으므로 투자해야\n                                      하는 사업.\n                                     - \u0007캐시카우 (Cash cow): 낮은 성장률, 높은 점유율. 재투자를 위한 현금을\n                                      확보할 수 있는 사업.\n                                     - \u0007물 음표 (Question mark): 높은 성장률, 낮은 점유율. 스타가 될 가능성에\n                                      따라 투자하거나 버려야 하는 사업.\n                                     - \u0007개 (Dog): 낮은 성장률, 낮은 점유율. 청산, 매각 또는 재포지셔닝해야 하는\n                                      사업.\n\n\n                                                                  시장 점유율\n\n                                                    높은                                   낮은\n\n\n\n\n                                      높은\n                                                     별                              물음표\n                                                   (Star)                       (Question mark)\n\n\n                               성장률\n\n\n\n\n                                      낮은\n                                                   캐시카우                                    개\n                                                 (Cash cow)                              (Dog)\n\n\n\n\n                                                [ BCG 매트릭스 ] (출처: https://www.bcg.com)\n\n\n\n\n160 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                  포터의 본원적 전략 (Three Generic Strategies)\n                                  본원적 전략은 마이클 포터가 1980년에 저술한 《경쟁전략》 에서 제안된\n130\nhttps://www.ifm.eng.cam.          개념이다. 기업이 산업 내에서 경쟁우위를 얻기 위한 사업 전략을 의미하며,\nac.uk/research/dstools/porters-\ngeneric-competitive-strategies/\n                                  일반적 경쟁전략으 로 도 불린다. 경쟁우 위의 기본 적인 유형은 저비용, 즉\nMichael E. Porter (1985),         원가우위 전략과 차별화 전략으 로, 비용 리더십, 차별화, 집중의 세 가지\nCompetitive Advantage, The\nFree Press                        경쟁우위와 범위를 설정하는 전략이다.130\n\n\n                                          - \u0007원가우위 전략 (Overall Cost Leadership): 해당 사업이 저비용 생산자가\n                                           되기 위해 노력함. 경쟁 사보다 더 낮은 가 격으 로 제품이나 서비스를\n                                           생산하여 비용 리더십을 획득함.\n131\nhttps://www.ifm.eng.cam.                  - \u0007차별화 전략 (Differentiation): 고객이 중요하게 여기는 속성을 파악하고\nac.uk/research/dstools/porters-\ngeneric-competitive-strategies/            제품이나 서비스를 차별화하여 독특함과 고유성으로 프리미엄을 확보함.131\n김명관 외 (2007), 《연구기획평가실\n                                          - \u0007집중화 전략 (Focus): 산업 내에서 좁은 경쟁 범위를 선택하여 세그먼트,\n무자를 위한 R&D기획》, 한국산업기\n술진흥협회, pp. 43-60                           즉 특정 구매자 집단이나 특정 제품이나 서비스, 특정 지역 등에 초점을\n                                           맞추어 제한된 시장에 집중함.\n\n\n                                                                              경쟁 우위\n\n                                                           원가 우위                                   차별화\n\n\n\n\n                                           넓은 범위           원가 우위                                  차별화\n\n\n\n\n                                  경쟁 범위\n\n\n\n\n                                           세분화된 범위\n                                                          원가 집중화                               차별적 집중화\n\n\n\n\n                                    [ 포터의 본원적 전략 ] (출처: Michael E. Porter (1985), Competitive Advantage, The Free Press)\n\n\n\n\n                                                                                             서비스·경험디자인 이론서 161\n\f                                     2.2 서비스·경험디자인 관찰조사\n                                     서비스 사용자의 잠재적 요구사항은 사용자의 생활 태도와 서비스 사용자의\n                                     경험에 대한 조사를 바탕으로 파악할 수 있다. 특히 현장 조사는 다양한 사용자\n                                     유형의 행동을 관찰하거나 조사자가 직접적인 체험을 병행할 수 있어 서비스\n                                     사용상의 문제점이나 사용자 요구사항에 대한 다양한 단서들을 도출할 수 있다.\n\n\n                                     2.2.1 자가 기록 연구(Self-ethnographic Approach)\n                                     A 자문화 기술지 / 자기민족지학(Autoethnography)\n\n정의                                   연구원이 특정 경험에 대해 직접 탐색하고 필드 노트(field notes), 오디오 기록,\n                                     비디오, 사진 등을 사용하여 스스로 문서화하는 방법으로, 자전적 이야기를\n                                     더 넓은 문화적, 정치적, 사회적 의미 혹은 이해와 연결하는 질적 연구의 한\n                                     형태이다.\n\n\n역 사132                               1975년 인류학자인 칼 하이더(Karl Heider)가 자문화 기술지라는 용어를\n132                                  처음 사용했지만, 현대적인 의미로는 데이비드 하야노(David Hayano)가 그의\n김영천(2013), 《질적연구방법론\nII: Methods》, 아카데미프레스.               연구를 통해 본격적으로 도입하였다. 이후 리드-다나해이(Reed-Danahay)와\n(https://socialinnovation.tistory.\n                                     엘리스와 보크너(Ellis & Bochner)에 의해 학문적 체계를 갖추었다.\ncom/297)\n\n\n                                     1980년대 학자들은 개인적인 측면을 통해 민족지학적 실천에 점차 참여하게\n                                     되면서 문화와 스토리텔링의 중요성에 관심을 갖게 되었다. 1990년대는 개인\n                                     내러티브와 자문화 기술지 사용의 확장에 중점을 두기 시작했다.\n\n\n사용 목적                                문화적 경험을 이해하기 위해 개인의 경험을 기술하고 체계적으로 분석하고자\n133                                  하는 연구와 글쓰기에 대한 접근 방법이라고 할 수 있다.133\nForum Qualiaive Sozial\nfor schung (https://www.\nqualitative-research.net/            자문화 기술지는 연구자가 참가자를 관찰할 때 보게 될 행동을 해석하는 데\nindex.php/fqs/article/\n                                     도움이 되며 연구자가 주제에 대해 사전에 대략적으로 이해하고 있으면 인터뷰를\nview/1589/3095)\n                                     보다 쉽고 포괄적으로 수행하는 데 도움이 된다. 또한 자문화 기술지는 모든\n                                     온·오프라인 채널에서 다른 사람 혹은 장치의 개입에 상관없이 이루어지는\n                                     행위를 포함하며 교차 채널 경험을 이해하기 위한 방법이다. 이러한 이유로\n                                     자문화 기술지는 연구 초기 단계에 유용하게 사용할 수 있는 방법 중 하나이다.\n\n                                     자문화 기술지는 온라인 채널과 같은 하나의 특정 채널에 집중하여 고객 여정\n                                     지도 내에서 세부적인 경험을 수행할 수도 있는데, 이러한 맥락에서 자문화\n                                     기술지와 온라인 에스노그래피를 함께 사용하기도 한다.\n\n\n\n\n162 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 방법 및 과정   연구자들은 이 방법을 통해 탐색을 위한 현장이나 조직 내에서 몇 달 혹은 그\n             이상의 기간에 걸쳐 연구에 집중할 수 있다. 서비스디자인에서는 주로 단기간에\n             수행하는 방법을 사용하며, 이때 팀 연구자들은 고객이나 직원이 되어 실제\n             상황에서 특정 경험을 직접 탐색한다.\n\n             자문화 기술지 연구는 공개적으로 수행하기도 하지만, 연구원의 존재만으로도\n             환경과 연구 참여자의 행동에 영향을 미칠 수 있기 때문에 은밀하게 수행하기도\n             한다.\n\n             1.\t\u0007질 문 정의: 연구를 수행하는 이유(탐색적 연구 vs. 확증적 연구)와 연구\n              결과를 통해 무엇을 하고 싶은지(페르소나, 여정 맵, 시스템 맵 등)를 고려하여\n              구체적인 질문이나 발견하고자 하는 것을 정의한다.\n\n             2. 계획 및 준비: 연구 질문을 기반으로 연구 수행 시기 및 장소를 결정한다.\n              수행 방법(명시적 방법 혹은 은밀한 방법)과 경험을 문서화하 는 방법을\n              결정하고 현장 메모 외에 추가적인 정보 수집(음성 녹음, 사진 또는 비디오\n              촬영)에 필요한 법적 계약을 설정한다.\n\n             3. 수행: 두 단계로 구분하여 수행한다. 첫 번째 단계는 “원시 데이터” 개념으로\n              객관적으로 보고 듣는 것을 기록한다. 두 번째 단계는 “해석”의 개념으로\n              연구원이 느낀 점과 경험한 것을 해석한다. 이 경우 현장 노트 작성 시에\n              노트의 왼쪽과 오른쪽에 이 두 가지 내용을 별도로 작성하는 방법이 활용될\n              수 있다.\n\n             4. 후속 작업: 관찰을 통해 개별 주요 학습 내용을 바로 작성하고, 다른 연구자가\n              동일한 연구를 수행한 경우 이를 비교한다. 모든 수집된 자료(현장 노트, 수기\n              자료, 사진, 오디오 및 비디오 기록 등)에 대해 목록을 만들고 이를 추적한다.\n              데이터를 검토해 보고 중요한 부분에 대해 강조 표시를 한다. 주요 원시\n              데이터를 사용하여 짧은 요약을 작성한다.\n\n\n\n결과물          - 원시 자료(현장 노트, 수기 자료, 사진, 오디오 및 비디오 기록) 및 목록\n             - 주요 이슈 요약\n             에스노그래피(Ethnography): 에스노그래피는 사용자 행동의 맥락과 그들의\n             잠재적 욕구를 파악하기 위한 현장 관찰 도구로, 관찰하는 사람들과의 공감을\n             통해 디자인 영감을 얻는 관찰 방법이다. 프 로젝트 특 성에 따라 사용자가\n             카메라를 보고 말하는 인터뷰, 활동 기록, 사용자 경험 여정 등에 따른 환경과\n             행동의 변화 기록 등 을 선택할 수 있다. 디자 인 프 로 세스의 초기 단계에\n             에스노그래피 인터뷰를 진행하면 사용자를 깊이 이해할 수 있을 뿐 아니라\n             사용자의 니즈와 목표를 파악할 수 있는 매우 값진 결과를 얻을 수 있다.\n\n                                             서비스·경험디자인 이론서 163\n\f변형된                 포괄적인 민족지학적 연구 외에도 서비스디자인에서 자문화 기술지 방법을\n자문화 기술지 연구          간략하게 사용하는 여러 가지 방법이 있다.\n\n                    미스터리 쇼핑(Myster y Shopping): 연구원은 고객으 로 행동하여 구매\n                    프로세스 또는 특정 고객 경험을 따르고 자신의 경험을 자체 문서화한다. 이\n                    연구에서는 고객으로 가장한 미스터리 쇼퍼(Mystery Shoppers)에게 특정\n                    작업 수행이 부여되기도 한다. 따라서 미스터리 쇼핑은 보다 평가적인 연구에\n                    자주 사용되는 접근 방식이다. 미스터리 쇼퍼가 실제 고객이 아니기 때문에\n                    연구자 들의 기대 및 요구, 궁 극적으 로 경험에 영향 을 미치게 되어 편향된\n                    데이터가 생산될 수 있다.\n\n                    미스터리 워킹(Mystery Working): 제한된 시간에 회사의 직원으로 위장하여\n                    에스노그래피 연구를 수행하는 것이다. 이 경우에도 미스터리 쇼핑과 같이\n                    연구자들이 자신의 경험을 문서화하므로 생산된 데이터가 편향될 우려가 있다.\n\n                    서비스 사파리(Service Safari): 한 무리의 사람들을 보내 특정 경험에 대한\n                    에스노그래피 연구를 수행하는 방법이다. 서비스 품질 이해를 통해 사용자의\n                    요구와 문제점을 발견하고자 참여자의 관점에서 선정한 좋거나 나쁜 서비스를\n                    실제 환경에서 체험한다. 사용자의 서비스 경험을 비디오카메라나 메모 등을\n                    이용해 기록한 후 사 용자 들이 지닌 공 통 적인 요구와 문제점을 발견한다.\n                    이 연구의 목표는 “야생(현장)”으로 나가서 스스로 주제를 탐색하고, “자연\n                    서식지(자연스러운 상황)”에서 고객을 관찰하고, “통찰력”을 기르면서 경험에\n                    몰입하는 것이다. 연구 조사자는 상황에 따라 예상되는 수요자의 행동들을\n                    예측하여 발생 가능한 돌발 상황에 대비해야 하며, 최대한 다른 사람들에게\n                    영향을 주지 않도록 행동하면서 사진, 메모, 녹음, 촬영 등 다양한 방법으로\n                    관찰 대상의 행동과 상황을 기록한다. 서비스 사파리 조사를 위한 팀은 직접\n                    체험하는 조사원과 이를 관찰하고 기록하는 조사원이 짝을 이루어 최소 2명\n                    이상으 로 구 성하 는 것이 좋다. 서비스 사파리에 경영진, 클라이언트 또는\n                    다양한 부서의 사람들이 참가하게 되면 특정 문제에 대한 추상적인 접근 대신\n                    참가자들이 해당 문제에 대한 공통된 이해를 통해 상황에 적합한 상향식 접근\n                    방식을 구축하게 되어 매우 강력한 도구가 된다.\n\n                    탐색적 서비스 사파리(Explorative Service Safari): 좋은 서비스 경험과 나쁜\n                    서비스 경험에 대한 몇 가지 예를 탐색하고 수집하기 위해 한 무리의 사람들을\n                    보내는 방법이다. 일반적으로 탐색 서비스 사파리는 다소 광범위하게 이루어져\n                    특정 연구 프로젝트에 대한 데이터의 수집에는 효과적이지 못한 반면 팀이\n                    자체 연구를 수행하기 위한 출발점을 탐색하거나 이후 연구에서 집중할 대상을\n                    결정하는 데 도움이 되는 경우가 많다.\n\n\n\n164 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f다 이어리 연구 (Diar y Studies): 참가자가 장기간 에 걸쳐 주제에 대한\n자 신의 경험을 기술하 는 추적 연구이다. 사 용자가 직접 참 여하 여 그들의\n일상생활과 그 안 에서의 사 용 경험 맥락을 기록하 는 것으 로, 일기장 이나\n일지를 이용하여 일상 속에서 일어나는 사건과 그에 대한 개인적인 생각들을\n손쉽게 표현하는 방법이다. 다이어리는 사람들에게 이벤트나 이벤트가 발생한\n날짜를 문서화할 때 사용하는데, 글과 사진으로 구성된 일기 형식이나 음성\n녹음 또는 비디오로 작성할 수 있다. 다이어리는 인터뷰에서 사람들이 삶에\n대해 말하 는 것보다 좀 더 친근한 생각이나 감정들을 드러낸다. 이 연구는\n연구원 스스로 에스노그래피를 통해 데이터 수집과 분석을 수행할 수도 있고,\n연구자가 참가자를 섭외하여 일기를 작성하게 한 후 이 데이터를 분석할 수도\n있다. 다이어리 연구는 일기를 기반으로 한 문화적 프로브(Cultural Probes)\n혹 은 심층 인터뷰의 일부로 사 용하기도 한다. 다이어리 연구 는 고전적인\n방식의 일기를 사용하거나 다이어리 연구 소프트웨어를 사용하여 온라인으로\n수행하기도 하고 일기 앱이나 모바일 에스노그래피 앱을 사용하여 스마트폰에서\n수행할 수 있다. 사용자 다이어리는 심층 인터뷰 관찰 전에 진행할 수 있으며,\n일기장 끝에 참가자의 소견을 묻는 간단한 질문이나 참가자의 나이, 성별 등\n인구통계학적 정보를 적는 페이지를 포함하기도 한다.\n\n탐문(Obtaining Information): 탐문은 추적의 한 형태로서 대상자의 활동\n장소에 가서 그 행동에 대한 질문을 던지는 것이다.\n\n인지적 시찰법(Cognitive Walkthrough): 제공하는 프로세스와 제품 또는\n서비스를 사용자가 쉽게 인지하고 사용하는지 평가하는 방법이다.\n\n크라우드 소싱(Crowd Sourcing): 대중(Crowd)과 아웃소싱(Outsourcing)의\n합성어로 기업 활동 일부 과정에 대중을 참여시켜 물건을 새로 만들 때나 서비스\n개선 시 참신한 아이디어와 실질적인 의견을 들을 수 있다.\n\n행위 매핑(Behavior Mapping): 특정 시간에 특정 환경에서 행동을 관찰하고\n기록하는 데 사용되는 연구 도구이다.\n\n\n\n\n                                    서비스·경험디자인 이론서 165\n\f                    B 온라인 에스노그래피(Online Ethnography)\n\n정의                  온라인 커뮤니티에서 사람들이 상호작용하는 방식을 조사하는 접근 방법으로\n                    사이버(Cyber), 가상(Virtual), 혹은 디지털(Digial) 에스노그래피라고도 한다.\n\n역사                  전통적인 민족지학 연구는 동일한 장소에서 개인 간의 상호작용을 관찰하는\n                    반면 온라인 에스노그래피는 기술을 통해 대면 상호작용을 대체하는 환경으로\n                    에스노그래피 연구의 공간을 확장한 개념이다. 우리는 온라인 에스노그래피를\n                    통해 물리적 공간으로 제한된 전통적인 공간 개념의 한계를 극복하고, 디지털\n                    방식의 상호작용이 이루어지는 온라인 커뮤니티를 통해 공유 문화가 만들어짐을\n                    이해할 수 있다.\n\n                    초기 온라인 에스노그래피는 인터넷이 사회를 근본적으로 변화시키는 방식을\n                    탐색할 수 있는 새로운 종류의 방법론으로 여겨졌다. 그러나 인터넷이 주류가\n                    되면서 전통적인 에스노그래피 방법이 새로운 맥락으로 전개되는 방식으로\n                    재구성되었다.\n\n수행 방법 및 과정          온라인 에스노그래피는 화면 공유를 통해 온라인으로 진행되는 문맥 인터뷰\n                    또는 다른 커뮤니티 구성원과의 심층 인터뷰와 같은 혼합 방법을 자주 사용한다.\n                    온라인 에스노그래피는 온라인 커뮤니티 내에서의 사회적 상호작용이나 실제\n                    생활공간과 온라인상에서 사람들의 자기 인식 비교 등 다양한 측면에 초점을\n                    맞추어 수행할 수 있다.\n\n                    1. 질문 정의: 연구를 수행하는 이유(탐색적 연구 vs. 확증적 연구)와 연구\n                       결과를 통해 무엇을 하고 싶은지(페르소나, 고객 여정 지도, 서비스 가치\n                       흐름도 등)를 고려하여 구체적인 질문이나 발견하고자 하는 것을 정의한다.\n\n                    2. 계획 및 준비: 연구 질문 을 기반으 로 연구 수행에 적합한 커뮤니티를\n                       결정한다. 수행 방법(명시적 방법 혹은 은밀한 방법)과 경험을 문서화하는\n                       방법을 결정하고 현장 메모 외에 추가적인 정보 수집(녹화 또는 스크린\n                       숏)에 필요한 법적 동의 내용을 확인한다. 연구가 이루어지는 국가 및 조직에\n                       따라 법적, 윤리적, 기밀 유지 계약이 필요한지 미리 확인하고, 필요한 경우\n                       연구 참가자에게 미리 통보한다.\n\n                    3. 수행: 두 단계로 구분하여 수행한다. 우선 객관적으 로 보 고 듣는 것을\n                       기록하고, 이를 통해 느낀 점과 경험한 것을 해석한다.\n\n                    4. 후속 작업: 데이터 검토 후 중요한 부분을 강조하여 표기한다. 다른 연구자가\n                       동일한 연구를 수행한 경우 이를 비교한다. 모든 수집된 자료(현장 메모,\n                       기록, 스크린 숏 및 녹음 등)에 대해 목록을 만들고 이를 추적한다. 인용문,\n\n\n\n166 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f            스크린 숏 또는 녹음과 같이 결합된 주요 결과의 주요 원시 데이터를 사용하여\n            짧은 요약을 작성한다.\n\n\n결과물         문서(인용, 스크립트, 현장 메모), 스크린 숏, 녹음(스크린 캐스트 또는 오디오\n            녹음) 주요 이슈 요약\n\n\n온라인         온라인 에스노그래피의 유형에는 다음의 방법을 포함해 다양한 수행 방법이\n에스노그래피 유형   있다.\n\n            • 자문화 기술지 : 연구자가 커뮤니티의 일부가 되어 자신의 경험을 기록\n\n            • 비참가 온라인 에스노그래피 : 연구자가 온라인 커뮤니티를 관찰\n\n            • 참가자 온라인 에스노그래피 : 연구자가 특정 참가자로 참가하여 그들의\n             온라인 활동을 탐색\n\n\n\n\n                                          서비스·경험디자인 이론서 167\n\f                    2.2.2 참여자 연구(Participant Approach)\n\n                    A 참여 관찰(Participant Observation)\n\n정의                  참여 관찰은 사람들의 상황과 행동을 제대로 이해하기 위해 직접 어떤 활동이나\n                    환경, 문화, 하위 문화 등의 일원이 되어 참여해 보는 몰입적이며 민족지학적인\n                    방법이다. 참여 관찰은 공동체를 이해하기 위해 정체성을 공유한 사람들의\n                    그룹에 들어가는 과정으로써, 연구자는 그룹의 사람들과 시간을 보내며 그들의\n                    행동과 언어 패턴, 규범 등을 면밀하게 관찰하는 경험을 통해 그룹을 이해할 수\n                    있다. 참여 관찰은 질적 연구 및 에스노그래피에 일반적으로 사용하는 데이터\n                    수집 방법의 한 유형으로 인류학, 사회학, 커뮤니케이션 연구, 인적 지리 및\n                    사회심리학 분야에서 특히 많이 사용된다.\n\n\n\n역사                  참 여 관 찰은 유럽과 미국의 과 학 탐사 항 해 와 관 련된 현장 연구 에 서\n                    인류학자들의 에스노그래피 연구에 대한 주요 접근 방식으로 등장하여 19세기\n                    후반에 광범위하게 사용되었고 20세기 초 비서구권으로 확대되었다.\n\n                    참여 관찰은 연구 집단과 함께 생활하며 그들의 사회생활을 관찰하고 삶에 대한\n                    직접적인 설명을 들으며 그 집단의 문화에 대해 배우는 방법으로, 이를 통해\n                    연구에 대한 새로운 통찰을 얻을 수 있다. 1980년대 이후, 일부 인류학자들과\n                    사회과학자 들 에 의해 이러한 참 여 관찰 이 다른 사 람들 을 이해하기 위한\n                    진정한 통찰력을 제공할 수 있는지에 대한 의문이 제기되었고 이점을 개선하여\n                    오늘날과 같은 방법으로 전문화되었다.\n\n\n\n\n168 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 방법 및 과정   참여 관찰은 일반적으로 종교, 직업, 혹은 그 하위문화나 커뮤니티 등과 같은\n             특정 그룹에 장기간에 걸쳐 자연스럽게 몰입하여 참여함으로써 그 그룹에 속한\n             사람들과 그들의 관행에 대해 친밀감을 형성하는 것이다.\n\n             참여 관찰은 비공식 인터뷰, 직접 관찰, 그룹 생활 참여, 집단 토론, 그룹 내에서\n             생성된 개인 문서나 온·오프라인에서 활동한 결과, 생활 이력에 대한 분석 등\n             다양한 방법이 포함된다. 이 방법은 일반적으로 정성적 연구로 규정되지만\n             정량적 요소를 포함하기도 한다.\n\n             1. 질문 정의 : 연구의 질문을 정의한다.\n\n             2. 참가자 선정 : 연구 질문 을 기반으 로 인터뷰 대상, 시간 및 장소 등 을\n              고려하여 적합한 참가자 선택 기준을 정의한다. 샘플링 기법을 사용하여\n              연구 참가자를 선정하고 내부 전문가 또는 외부 기관을 포함하여 참가자를\n              모집한다.\n\n             3. 계획 및 준비 : 연구 참가자 접촉 방법, 기대치에 대한 우선순위, 시작 및\n              종료 방법, 참가자 관찰 시간 등을 계획한다. 탐색 내용을 바탕으로 관찰\n              지침을 작성한다. 관찰 내용을 문서화하는 방식을 결정하고 현장 메모 외에\n              음성 녹음, 사진 또는 비디오 등 추가적인 정보 수집에 필요한 법적 동의\n              내용을 확인한다.\n\n             4. 수행 : 관찰을 수행하는 동안 효과적인 관찰을 위해 연구 참가자가 적절한\n              영향을 미치도록 참여 정도의 균형을 유지하도록 한다. 연구 피실험자들은\n              관찰되었다고 느끼는 순간 의식적으로 혹은 무의식적으로 다르게 행동하는\n              경우가 많아 연구원과 참가자 사이에 신뢰 구축이 중요하다. 참여 관찰을\n              맥락적 혹은 회고적 인터뷰 등과 같은 다른 방법과 병행하여 사용할 수 있다.\n              관찰하는 동안 편향되지 않은 원시 데이터를 최대한 많이 수집한다. 참여\n              관찰의 기간과 정도는 연구 목표에 따라 다르다. 고객 여정의 몇 가지 특정\n              순간을 15분 정도 신속하게 관찰하는 방법에서부터 며칠 혹은 몇 주에 걸친\n              관찰까지 다양하다.\n\n             5. 후속 작업 : 관찰 내용을 작성하고 다른 연구자가 동일한 연구를 수행한 경우\n              이를 비교한다. 데이터 검토 후 중요한 부분을 강조하여 표기한다. 모든\n              수집된 자료(현장 메모, 기록, 사진, 오디오 및 비디오 녹음, 수집된 자료\n              등)에 대해 목록을 만들고 이를 추적한다. 관찰 결과에 대해 주요 원시\n              데이터를 사용하여 짧은 요약을 작성한다.\n\n\n\n\n                                            서비스·경험디자인 이론서 169\n\f결과물                              - 문서(기록, 현장 노트), 오디오 녹음, 사진, 비디오, 기타 수집 자료\n                                 - 주요 이슈 요약\n\n\n\n참여 관찰 유형134                      - 비참여(Non-Participatory) : 사람들이나 연구 분야와의 접촉이 없음\n134                              - 수동적 참여(Passive Participation) : 연구원은 방관자 역할만 함\nSpradley, James P.(1980),\n《Participant Observation》.       - 적당한 참여(Moderate Participation) : 연구원은 \"내부자\"와 \"외부자\" 역할\nOrlando, Florida: Harcourt\n                                   사이의 균형을 유지함\nCollege Publishers. pp. 58–62.\nISBN 0-03-044501-9.              - 적극적인 참여(Active Participation) : 완전한 이해를 위해 연구원이 기술과\n                                   관습을 완전히 포용하여 그룹의 일원이 됨\n                                 - 완전한 참여(Complete Participation) : 사전에 연구원이 연구 모집단에\n                                   완전히 융합되어 있음(연구 대상인 특정 모집단의 구성원이 연구원인 경우)\n\n\n\n변형된                              참여 관찰은 섀도잉, 일상의 하루 또는 함께 작업하기와 같은 다양한 방법을\n참여자 관찰 연구                        포함하는 포괄적인 용어다.\n\n                                 이러한 관찰 방법들 간의 주요 차이점은 관찰 대상(예: 함께 작업하기), 시간의\n                                 경과(예: 일상의 하루) 그리고 다른 물리적 공간(예: 섀도잉)이지만, 폭넓게 보면\n                                 관찰 내용이 중복되며 동일한 의미로 사용되기도 한다.\n\n                                 일상의 하루(A Day in the Life) : 고객이 일상 또는 일과에서 특정 서비스와\n                                 상호작용하는 시간 외에 어떤 생각과 행동을 하는지에 대한 전반적인 이슈들을\n                                 발견하기 위해 그 고객과 관련된 자료를 수집하 는 방법이다. 몇 시간 에서\n                                 며칠까지 특정 기간 동안 사람들(대부분 고객)의 일상생활을 이해하기 위한\n                                 사 용자 참 여 관 찰 이다. 고객 요구 에 대한 폭넓은 맥락을 이해하기 위한\n                                 페르소나의 개발과 검증에 유용하다. 연구원은 주로 고객의 반복되는 일상,\n                                 의식, 행동, 환경, 상호작용, 대화 그리고 고객이 사용하는 제품에 중점을 둔다.\n                                 사람들의 일상에서 문제와 해결책을 발견함으로써 그들을 움직이게 하는 요인과\n                                 동기에 관한 총체적인 시각을 얻을 수 있다. 피험자의 특정 활동, 동기 및 태도를\n                                 이해하기 위해 맥락적 또는 회고적 인터뷰와 참여 관찰을 조합하여 사용하는\n                                 경우가 많다.\n\n\n\n\n170 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f함께 작업하기(Work-along) : 일상과 비공식 네트워크를 이해하기 위해 작업\n환경 내의 직원에 초점을 맞추는 방법이다. 이 방법은 대부분 참여 관찰과\n맥락적 인터뷰가 혼합되어 있지만, 전화 모니터링, 에스노그래피, 그리고 비참여\n관찰이 포함될 수 있다. 연구원은 연수생이나 인턴으로 며칠 동안 직원과 함께\n일하면서, 공식 및 비공식 네트워크, 기업 문화, 심지어 목소리 톤까지 포함한\n내부 프로세스를 이해하기 위해 직원들의 어깨 너머로 일상 업무 루틴과 동료\n직원, 고객 및 기타 이해관계자와의 상호작용 및 대화 방식에 대해 배운다. 또한\n연구원은 직원이 기존의 기업 구조 및 프로세스에 대처하기 위해 사용하는 해결\n방법에 주의를 기울인다. 이때 연구원은 같이 작업하는 참여자에 동화되기 쉽고,\n연구자의 존재가 관찰 대상자들의 행동에 영향을 미칠 수 있으므로 주의해야\n한다. 수집한 데이터의 질을 높이기 위해 지침, 내부 문서, 카탈로그, 이메일,\n기록 등과 같은 추가 자료를 수집할 수 있다.\n\n섀도잉(Shadowing) : 연구 대상(대부분 고객)의 행동을 관찰하고 프로세스와\n경 험 을 이 해 하기 위 해 연 구 원이 그림 자처럼 그 들 삶 의 물 리 적 공 간 을\n따라다니는 조사 방법이다. 섀도잉은 일반적으로 “함께 작업하기”보다 훨씬\n짧은 시간(몇 분 또는 최대 몇 시간)에 이루어진다. 이 방법은 연구 시작 전에\n모든 참가자와 연구자의 위치와 경계를 명확히 하는 것이 중요하다. 섀도잉을\n통해 연구자는 참가자의 관점에서 경험을 심층적으로 이해할 수 있다. 연구\n대상 에게 중요한 이슈가 발견되는 순 간 에는 맥락적 인터뷰를 수행하기도\n한다. 섀도잉은 연구 참여자가 익숙한 일상으로 인해 중요한 상황이 발생해도\n인식하지 못하거나 사회적 압력 등으로 진실을 말하지 않는 상황과 같이 단순한\n인터뷰에서는 찾을 수 없는 통찰을 발견하게 한다.\n\n\n\n\n                                 서비스·경험디자인 이론서 171\n\f                    B 맥락적 인터뷰(Contextual Interview)\n\n정의                  인터뷰는 면담자가 질문을 하고, 참가자가 답을 제공하는 구조화된 대화법이다.\n                    맥락적 인터뷰는 연구의 질문과 관련된 상황적 맥락에서 고객이나 직원 또는\n                    기타 이해관계자와 수행하 는 인터뷰이다. 이 방법은 인터뷰 참가자에 대한\n                    통찰과 서비스를 둘러싼 사회적·물리적인 환경 이해를 목적으로 서비스 과정\n                    가운데 특정 상황이나 맥락에서 이루어진다. 연구자는 인터뷰를 진행하면서\n                    에스노그래피 기법으로 특정 행동을 관찰하고 조사할 수 있다.\n\n\n\n배경                  인터뷰는 구조적 인터뷰, 반구조적 인터뷰, 비구조적 인터뷰가 있으며, 인터뷰의\n                    내용이 구 조 화 될수 록 인터뷰의 효율도 높 아진다. 또한 인터뷰 에 서 좋 은\n                    통찰(insight)을 얻기 위해서는 참여자의 선정이 중요하다.\n\n                    - 표준화 면접(Standardized Inter view) : 질문의 내용, 형 식, 순서\n                      등 에 대하 여 사 전에 작 성한 일 정에 따 라 인터 뷰 를 수행 하 는 것으 로\n                      구조 화 면접(Structured Inter view) 혹 은 통제화 면접(Controlled\n                      Interview)이라고도 한다. 이러한 인터뷰에 의한 자료 수집 방법은 미리 질문\n                      내용 을 결정하 여 질의를 하 는 것이므 로 넓은 의미의 질문지법에\n                      해당한다고 볼 수도 있다. 질문 내용을 미리 준비하면 대화를 잘 이끌어 나갈\n                      수 있고, 종합적인 관점에서 주제를 이해하기도 쉽다. 일례로 다양한 트렌드\n                      유형(기술,비즈니스, 사용자, 문화, 정책 등)에 초점을 맞춘 구조적 방식의\n                      인터뷰가 있다.\n\n                    - 비표준화 면접(Unstandardized Interview) : 질문의 내용, 형식, 순서등을\n                      미리 정하지 않고 상황 에 따 라 자유 롭게 인터뷰를 수행하 는\n                      것으 로 서,비 구 조 화 면 접 ( U n s t r u c t u r e d In te r v i e w) 혹 은 비 통 제\n                      면접(Uncontrolled Interview)이라고도 한다. 이러한 방식의 인터뷰는\n                      정형화된 틀이 없어 자유 응답 방식인 경우가 많으며, 대표적인 예로 심층\n                      인터뷰(In-depth Interview)가 있다.\n\n                    - 준표준화 면접(Semi-standardized Interview) : 표준화 면접과 비표준화\n                      면접을 결합한 형태로 대개 중요한 사항은 표준화하고 그 밖의 사항은\n                      비 표 준화 하 는 방 법이다. 주 제 와 내 용 등 을 표 준화 하 여 인터 뷰\n                      지침을 작성하고 이 지침의 범주 안에서 질문 순서나 형식 등은 면접자의\n                      재량으로 상황에 따라 융통성 있게 진행한다.\n\n\n\n\n172 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f        인터뷰의 질문 형식은 크게 폐쇄형과 개방형으로 구분된다.\n\n        - 개방형 질문(Open-ended Question) : 응답에 대한 특정 구조를 제시하지\n         않고 응답자가 아무런 제약 없이 자유롭게 응답하도록 구성된 질문이다.\n         비교적 자 유로운 의견 수렴이 가 능 하 여, 미리 예 상 하지 못한 문제 를\n         발굴하거나 새로운 정보를 얻을 수 있다. 따라서 조사자가 표본에 대한\n         정보를 가지고 있지 않거나 예비 조 사 및 탐색적 조 사 등 문제 핵심을\n         파악하고자 하 는 연구의 초기 단계에서 유 용하며, 폐쇄형 질문 이후에\n         응답자의 생각 을 심도 있게 파 악 하기 위해 사 용 하기도 한 다. 개방 형\n         질문은 응답자에게 심적 부담을 주고 응답의 해석에 편견이 개입될 소지가\n         있으며, 시간 이 많 이 걸리고능 력이 부 족한 응답자 에 게 적 용 하기에 는\n         적절하지 않다. 또한 개방형 질문의 답변은 분석하기에 어려우며, 폐쇄형\n         질문에 비해 무응답률이 높은 단점이 있다.\n\n        - 폐쇄형 질문(Close-ended Question) : 미리 제시한 응답 항목 중에서\n         선택하도록 구성된 질문으로 객관식 질문 또는 선택형 질문이라고도 한다.\n         개방형 질문에 비하여 응답하기 쉬워 무응답률이 낮고 짧은 시간에 많은\n         양의 정보 추출이 가능하며 조사 및 수집된 자료의 분석에 용이하다. 특히\n         수집된 자료 해석에 있어서 편견이 개입될 가능성이 낮고 정량적으로 분석할\n         수 있어 신뢰성이 높다는 장점이 있지만, 이러한 신뢰성과 타당성을 확보하기\n         위해서는 정밀한 사전감사를 거쳐야 한다. 폐쇄형 질문은 크게 이분법적\n         질문(Dichotomous Question)과 다항 선택형 질문(Multiple choice\n         question)으로 나눌 수 있으며 다항 선택형 질문에는 리커트 척도(Likert\n         Scale), 평가 척도(Rating Scale), 체크리스트(Checklist), 순위(Rank\n         Order) 유형 등이 있다.\n\n\n\n사용 목적   맥락적 인터뷰는 특정 그룹의 사람들을 더 잘 이해하기 위해 사용된다. 맥락적\n        인터뷰는 페르소나를 구축할 때 그들의 요구, 감정, 기대 및 환경을 이해하기\n        위해 사용하거나 서비스 가치 흐름도를 구축할 때 공식 혹은 비공식 네트워크와\n        특정 행위자 간에 숨겨진 이슈를 발견하기 위해 사용한다. 맥락적 인터뷰는\n        인터뷰 대상자가 구체적이고 맥락에서 행동 을 보여 줄 수 있어 고객 여정\n        지도에서 특정 경험을 이해하는 데 도움이 된다.\n\n\n\n\n                                            서비스·경험디자인 이론서 173\n\f수행방법 및 과정             서비스 와 인터뷰 대 상자 들 이 실 제 상 호작 용 하고 있 는 환 경에 서 인터뷰\n                      참가자들이 편안하게 인터뷰를 진행할 수 있도록 한다. 회고적 인터뷰와 달리\n                      맥락적 인터뷰는 현장에서 진행하기 때문에 연구자가 환경을 관찰할 수 있고\n                      인터뷰 대상자가 환경의 요소를 지적할 수 있다는 장점이 있다. 또한 인터뷰\n                      대상자는 친숙한 맥락에서 진행되는 인터뷰에 더욱 개방적으로 참여하기 때문에\n                      보다 능동적인 인터뷰가 이루어진다. 맥락적 인터뷰는 주요 연구 질문에 따라\n                      공개적으로 수행하거나 인터뷰 및 관찰 지침에 따라 반구조화된 방식으로\n                      수행할 수 있다. 맥락적 인터뷰는 인터뷰 대상자의 특정 행동에 대한 근본적인\n                      동기를 더 깊이 이해하기 위해 다섯 단계의 ‘왜’(Five Whys)와 같은 방법을\n                      사용하기도 한다. 맥락적 인터뷰는 상황적 맥락에 영향을 미칠 수 있는 계절,\n                      요일, 시간, 장소, 기상 조건, 다른 고객 등과 같은 요인과 함께 인터뷰 대상자의\n                      기분과 몸짓을 관찰하여 문서화하는 것이 중요하다.\n\n\n\n                      1. 연구 문제 구체화 : 연구를 수행하는 이유(탐색적 연구 vs. 확증적 연구),\n                         연구 결과를 바탕으로 수행하고 싶은 후속 연구(페르소나, 고객 여정 지도,\n                         서비스 가치 흐름도 등)와 샘플의 크기를 고려하여 발견하고자 하는 내용에\n                         대한 구체적인 질문을 결정한다.\n\n                      2. 인터뷰 대상자 선정 : 연구 질문을 기반으로 인터뷰 대상, 시간 및 장소 등을\n                         고려하여 적합한 참가자 선택 기준을 정한다. 샘플링 기법을 사용하여 연구\n                         참가자 를 선정하고 내부 전문가 또는 외부 기관 을 포함 하 여 참가자 를\n                         모집한다.\n\n                      3. 계획 및 준비 : 연구 참가자 접촉 방법, 기대치에 대한 우선순위, 시작 및\n                         종료 방법, 참가자 관찰 시간 등을 계획한다. 인터뷰 달성 목표에 따라 인터뷰\n                         가이드라인을 작성한다. 인터뷰를 문서화하는 방식을 결정하고 음성 녹음,\n                         사 진 또는 비디오 등 추가 적인 정보 수집에 필요한 법적 동의 내용 을\n                         확인한다.\n\n                      4. 수행 : 인터뷰 는 개방적이고 비주도적으 로 수행한다. 인터뷰 참가자의\n                         근본적인 동기를 알아내기 위해 다섯 단계의 ‘왜’(Five Whys)와 같은 특정\n                         인터뷰 기법도 사용한다. 또한 팀 내 질문, 관찰, 기록 역할 담당을 미리\n                         결 정하고 관 찰 하 는 동안 편 향 되 지 않 은 원 시 데이터 를 최대한 많 이\n                         수집한다. 인터뷰 시간과 정도는 연구 목표에 따라 결정한다.\n\n\n\n\n174   Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f      5. 후속 작 업 : 연구원들이 작성한 인터뷰 내용 을 대조한다. 수집된 모든\n       자료(현장 메모, 기록, 사진, 오디오 및 비디오 녹음, 수집된 자료 등)에\n       대해 목록을 만들고 이를 추적한다. 중요한 부분을 강조하여 표기하고 각\n       인터뷰 자료에 대해 인용 문, 사진 또는 비디오 등 을 포함한 주요 원시\n       데이터를 사용하여 짧은 요약을 작성한다.\n\n\n\n결과물   - 문서(기록, 현장 노트), 오디오 녹음, 사진, 비디오, 기타 수집 자료\n\n      - 주요 이슈 요약\n\n      다섯 단계의 ‘왜’(The Five Whys) : 겉으 로 드러나는 현상의 근본 적인\n      원인과 동기를 밝혀내기 위해 사용자 경험을 이용해 질문을 제기하는 것이다.\n      일반적으로 특정 문제를 더욱 깊이 연구하기 위해 사용하며, 이해관계자의\n      잠재적 동기를 밝히기 위한 목적으로도 사용한다. 질문 대상자에게 구체적인\n      행동이나 의견의 근본적인 원인을 찾을 때까지 계속해서 질문하게 되는데,\n      본래의 질문에서 너무 벗어나지 않고 관련성을 유지하기 위해 질문을 다섯\n      단계로 제한한다.\n\n      기대치 지도(Expectation Maps) : 고객이 서비스에 대해 갖는 기대를 조사하고\n      도식화하는 방법이다. 이 지도는 특정 서비스에 초점을 맞추거나 어떤 서비스\n      범주의 일반적 형태를 분석하기 위해 사용할 수 있다. 심층 인터뷰를 통해 특정\n      영역에 대한 세부적인 내용을 확인하며 고객이 지속해서 불편을 겪는 영역을\n      찾아낸다. 참여자들이 진솔한 감정을 공유할 수 있도록 개방적이고 재미있는\n      방식으로 기대치 지도를 만들어야 한다.\n\n\n\n\n                                       서비스·경험디자인 이론서 175\n\f                    C 심층 인터뷰(In-depth Interview)\n\n정의                  집중적인 개별 인터뷰를 수행하는 질적 연구 기법의 하나이다. 인터뷰 시간이\n                    길고 사용자 맥락이 포함된 인터뷰로 사용자의 의견, 잠재적 정보, 상호작용,\n                    아이디어를 발견하기에 좋은 방법이다. 심층 인터뷰는 가능한 한 실제 사람들의\n                    행동이 일어나는 현장이나 맥락에서 진행함으 로써 자신의 활동 을 조 사자\n                    앞에서 시연하고, 그 경험을 공유할 수 있도록 한다. 인위적이거나 불편한\n                    상황이 아닌 자신의 공간에서 사람들이 훨씬 더 편안하게 말하고 행동할 수\n                    있도록 하는 것이 중요하다.\n\n\n배경                  심층 인터뷰는 사용자의 동기나 태도, 의견에 대한 다양하고 심층적인 정보\n                    수 집이 가 능한 데, 조 사 원의 면접 및 분 석 능력이 조 사 결과의 신뢰성과\n                    타당성에 크게 영향을 미칠 수 있으므로 철저한 사전 준비와 시간이 필요하다.\n                    서비스디자인에서 심층 인터뷰는 질문과 관찰을 동시에 활용하여 사람들의\n                    행동과 동기를 파악하기 때문에 사용자 서비스 이용 특성 및 내재된 요구사항을\n                    파악하고 핵심 이슈를 추출할 수 있어 조사 단계에서 매우 중요한 역할을 한다.\n                    아울러, 다음과 같은 특징이 있다.\n\n                    - 구조적이지 않은 유연한 방식으로 진행된다.\n                    - 조사자와 인터뷰 대상자 간의 상호 신뢰 구축을 위한 친밀감(라포, Rapport)\n                      형성이 중요하다.\n                    - 구술 진술뿐 아니라 맥락적(표정, 제스처 등) 자료도 확보해야 한다.\n                    - 장시간 높은 수준의 내용을 다루므로 가급적 그 관련 산업에 대한 지식이나\n                      경험이 풍부한 사람을 피면접자로 선발하는 것이 유리하다.\n\n\n사용 목적               심층 인터뷰(In-depth Interview)는 소수의 개별 사용자에 대한 깊이 있는\n                    정보 수집을 목적으로 1명의 응답자와 일대일 면접을 통해 소비자의 심리를\n                    파악하는 조사법이다. 어떤 주제에 대해 응답자의 생각이나 느낌을 자유롭게\n                    이야기하게 함으로써 응답자 내면의 욕구·태도·감정 등을 발견하는 인터뷰이다.\n\n                    심층 인터뷰는 알아보고자 하는 분야에 대해 상당히 심도 있는 단계까지 들어가\n                    다양한 정보를 확보할 수 있는 방식이다. 따라서 인터뷰 시간이 길고 사용자\n                    맥락이 포함된 인터뷰로 사용자의 의견, 잠재적 정보, 상호작용, 아이디어를\n                    발견하기 좋은 방법이다. 또한 심층 인터뷰는 가능한 한 실제 사람들의 행동이\n                    일어나는 현장이나 맥락에서 진행함으로써 사용자가 자신의 활동을 조사자\n                    앞에서 시연하고, 그 경험을 공유할 수 있도록 한다.\n\n\n\n\n176 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f        조사자는 이러한 개방형 조사 방식을 통해서 사용자가 자신의 이야기를 할 수\n        있도록 격려함으로써 미리 정해진 질문을 하는 설문조사 방식에 비해 사람들의\n        삶을 보다 적극적으로 이해할 수 있다.\n\n\n수행 방법   연구원은 특정 주제에 대한 다양한 관점을 이해하기 위해 이해관계자 또는 외부\n        전문가와 여러 차례 심층 인터뷰를 수행할 수 있다. 심층 인터뷰를 통해 연구자는\n        다음에 대해 더 많은 사실을 발견할 수 있다.\n\n        - 연구와 관련한 특정 기대치, 경험, 제품, 서비스, 상품, 운영, 프로세스 및\n         우려 사항\n\n        - 개인의 태도, 문제, 필요, 아이디어 또는 환경\n\n        심층 인터뷰는 구조화, 반구조화 또는 비구조화 방식으로 수행할 수 있다.\n        인터뷰 질문은 일반적이고 광범위한 질문에서 시작하여 참가자가 인터뷰에\n        익숙해져 친밀감을 형성한 다음에는 연구 질문과 관련된 주제에 대해 좀\n        더 구체 적이고 자세하게 접근하 는 \"깔 때기\" 방식으 로 구 성된다. 인터뷰\n        가이드라인은 프로젝트 또는 인터뷰 대상자 그룹에 맞춤식으로 구축할 수도\n        있고 페르소나에 대한 데이터를 수집하기 위한 인터뷰 주제로 구성된 일반적인\n        템플릿을 따르기도 한다. 심층 인터뷰는 연구자가 보디랭귀지를 관찰하고 보다\n        친밀한 분위기를 조성하기 위해 주로 대면으로 이루어지나 온라인이나 전화로도\n        가능하다.\n\n\n수행 과정   심층 인터뷰 과정은 다음과 같다.\n        1. 응답자와 그들의 환경 맥락에 대해 필요한 정보를 얻는다.\n        2. 다루고 싶은 주제 목록이나 대본을 만든다. 이렇게 하면 보조 질문을 쉽게\n         추가할 수 있다.\n        3. 응답자가 선택한 시간과 날짜에 인터뷰 일정을 잡는다.\n        4. 자신 있게 대답할 수 있는 질문을 포함하여 면접관을 편안하게 느끼도록 하여\n         응답자도 자신감을 갖고 어려운 질문에 쉽게 대답할 수 있도록 한다.\n        5. 진행시간에 대한 부담이 느껴지지 않도록 한다.\n        6. 피면담자의 몸짓을 관찰하고 기록한다.\n        7. 프로세스 전반에 걸쳐 윤리를 유지하는 것이 중요하다.\n        8. 녹음을 필사하고 인터뷰 대상자와 확인한다.\n\n\n결과물     - 문서(기록, 현장 노트), 오디오 녹음, 사진, 비디오, 기타 수집 자료\n\n        - 주요 이슈 요약\n\n\n\n                                         서비스·경험디자인 이론서 177\n\f                    D 포커스 그룹 인터뷰(Focus Groups Interview)\n\n정의                  연구자가 한 그룹의 사 람들 을 초대하 여 특 정 제 품, 서비스, 상품, 개념,\n                    문제, 프 로 토타입, 광고 등에 대해 질문하 는 고전적인 질적 인터뷰 연구\n                    방법이다. 포커스 그룹 인터뷰는 마케팅 리서치의 대표적인 기법으로, 제품의\n                    대상 시장 에 맞는 사 용자 그룹 을 인구 통계 자료를 바탕으 로 선정한 뒤,\n                    퍼실리테이터(Facilitator)와 함께 모여 토론하는 것이다. 토론은 정해진 질문지와\n                    선택 가능한 답변에 따라 진행되며 토론하는 장면을 녹화한 뒤 분석을 하는\n                    경우가 많다. 포커스 그룹 인터뷰는 실제 사용자를 만나 제품에 대한 첫인상과\n                    디자인 등에 대해 어떻게 느끼는지 파악하는 데 유용하다. 또한 그동안 사용해 온\n                    제품에 대한 의견을 수집할 때 필요할 수 있다. 하지만 다수의 의견이나 목소리가\n                    큰 사용자의 주장이 전체의 의견이 될 소지가 있어 다양한 사용자의 패턴을\n                    정확히 파악하기 힘들 수도 있다.\n\n\n배경                  포커스 그룹 인터뷰는 주로 시장조사를 할 때 이용하며, 주의 깊게 모집한 참가자\n                    집단을 통해 제품 서비스, 마케팅 캠페인, 브랜드 등에 대한 의견, 느낌, 태도를\n                    측정하는 정성적 연구 방법이다. 연구원은 주로 초기 질문만 하고 그룹 토론과\n                    역동성을 관찰한다. 때로 연구원은 일련의 질문을 통해 그룹을 안내하는 중재자\n                    역할을 한다. 두 명의 중재자가 참여하는 경우 한 연구원은 프로세스를 촉진하고\n                    다른 연구원은 참가자 간의 상호작용을 관찰한다.\n\n\n사용 목적               연구자는 주어진 주제에 대한 인식, 의견, 아이디어 또는 태도를 이해하기 위해\n                    포커스 그룹 인터뷰를 사용한다. 포커스 그룹 인터뷰는 주로 회의실이나 원웨이\n                    미러(One-way Mirror)나 라이브 비디오를 통해 연구자가 비참여 방식으로\n                    상황을 관찰하도록 제작된 특별한 방과 같은 곳에서 수행한다. 목적은 참가자들이\n                    자신의 관점에서 주어진 주제에 대해 자유롭게 토론하는 것이다. 포커스 그룹\n                    인터뷰는 비즈니스 분야에서 자주 사용되지만, 서비스디자인에 적용할 수 있는\n                    범위는 제한적이다. 맥락에서 기존 경험을 이해해야 하는 경우 상황적 맥락이\n                    없는 실험실 환경에서 수행하는 것은 유용하지 않기 때문이다. 또한 인터뷰 결과가\n                    토론의 중재에 따라 달라지기 때문에 중재자는 관찰자 효과, 그룹 사고 또는\n                    사회적으로 바람직한 편향성과 같은 문제에 의해 편향된 결과가 도출되지 않도록\n                    주의해야 한다.\n\n\n\n\n178 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 방법 및 과정   포커스 그룹 인터뷰는 그룹당 6~12명 정도의 사용자로 구 성되고, 숙련된\n             진행자인 퍼실리테이터(Facilitator)가 참가자와 대화하며 요구사항을 이끌어낸다.\n             주로 인터뷰 과정에서 사용자 발언에 대한 녹취나 영상 촬영이 이루어지며\n             퍼실리테이터는 다음과 같은 내용을 고려하여 인터뷰를 진행한다.\n\n             - 포커스 그룹 인터뷰는 주제별로 시간을 정해 놓고 되도록 그 시간을 지킨다.\n             - 세션이 시작되면 워밍업(Warming up) 차원에서 참가자 모두에게 발언\n               기회를 준다.\n             - 빅 마우스(Big Mouse) 사용자가 인터뷰를 독점하거나 여론을 주도적으로\n               형성하지 않도록 진행자는 의도적으로 다른 사용자에게 발언권을 자연스럽게\n               넘기도록 한다.\n\n             부득이하게 실시간 화상 회의로 포커스 그룹 인터뷰(FGI)를 진행할 때는 다음과\n             같은 내용을 고려한다.\n             - 참여자가 개인 의견을 1:1 채팅으로 진행자에게 전달할 수 있도록 한다.\n             - 세션이 시작되면 아이스 브레이킹 차원에서 순서대로 자기소개를 요청한다.\n             - 네 트워 크나 컴 퓨 터 기 술 상 의 문제 로 로 그아 웃 된 참 여 자 의 재 입 장 을\n               허락한다.\n             - 오프라인 대면 포커스 그룹 인터뷰, 온라인 화상 회의 포커스 그룹 인터뷰 모두\n               기록을 위한 녹화·녹음을 하기 위해서는 참여자들의 사전 동의를 받아야 한다.\n\n\n결과물          - 문서(기록, 노트), 오디오 녹음, 사진, 비디오\n\n             - 주요 이슈 요약\n\n\n\n\n                                                서비스·경험디자인 이론서 179\n\f                    퍼 실리테이터(F a c ili t ato r) : 퍼 실리테이터 는 효 과 적인 공 동 창작 (C o -\n                    creation)을 위해 워크숍 참여자가 원하는 바를 달성할 수 있도록 촉진하고\n                    돕는 사람이다. 포커스 그룹 인터뷰(FGI)의 진행자를 의미하기도 한다. 집단이\n                    원하는 바를 달성할 수 있게 돕는 촉진 활동인 퍼실리테이션(Facilitation)을\n                    수행하며, 단순히 진행을 맡은 사회자의 역할만이 아니라 참여자들이 문제를\n                    해결하도록 돕는 데 집중한다. 조직의 문제와 비전에 대한 자신의 해결책을\n                    개인이나 집단이 스스로 개발하도록 자극하고 돕거나, 교육 훈련 프로그램의\n                    실행 과정에서 중재 및 조정 역할을 담당하기도 한다.\n\n                    언포커스 그룹 인터뷰(Unfocus Group Interview) : 주제에 대해 일반적인\n                    사용자의 시각에서 벗어난 관점의 의견을 얻기 위해 필드에서 각 분야의 전문가\n                    인터뷰를 통해 마니아, 예술가 등의 사람들이 각자 자신의 관점에서 그 주제나\n                    제품에 대해 이야기하게 한다. 이를 통해 제품 및 서비스에 대한 참여자의\n                    다양한 관점과 생각을 발견할 수 있다.\n\n                    전문가 인터뷰(Expert Interview) : 해당 분야 및 이와 관련된 트렌드를 잘\n                    아는 전문가와의 인터뷰는 주제와 관련된 동향을 빠르게 파악하는 데 도움을\n                    준다. 경제학자, 교수, 저자, 연구원처럼 특정 주제 영역의 전문가들과 대화를\n                    나눔으로써 과거와 현재의 사실뿐 아니라 미래에 대한 귀중한 통찰을 빠르게\n                    얻을 수 있고, 추가로 찾아야 하는 정보가 어디에 있는지 도움말을 얻을 수도\n                    있다. 인터뷰에서 질문할 내용들을 미리 준비해 간다면 대화를 잘 이끌어 나갈\n                    수 있고, 종합적인 관점에서 주제를 이해하기도 쉽다. 기술, 비즈니스, 사용자,\n                    문화, 정책 등 특정 트렌드 유형에 초점을 맞춘 구조적 방식의 대화를 진행할 수\n                    있다.\n\n\n\n\n180 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\fE 인터뷰 가이드라인\n\n다음은 인터뷰 수행 시 고려할 요소이다.\n\n- 신뢰 구축 : 인터뷰를 위해 안전하고 편안한 공간에서 연구자 를 포함한\n 참여자들을 소개한다. 인터뷰 대상자의 답변에 관심을 가지고 반응하며,\n 자신이 연구 가정을 검증하고 배우기 위해 이 자리에 있다는 것을 항상\n 명심한다.\n\n- 명확한 언어 사용 : 답변에 혼란이 생기지 않도록 한 번에 하나씩 명확한\n 언어로 질문한다. 속어나 기술적인 전문 용어는 사용하지 않도록 주의해서\n 말하도록 한다.\n\n- 폐쇄형 질문 회피 : 간단히 \"예\" 또는 \"아니오\"로 대답할 수 있는 폐쇄형 질문을\n 피한다. 질문은 인터뷰 대상자가 특정 주제에 대해 자세히 설명하도록 영감을\n 주어야 한다. 반구조화된 인터뷰 수행 시에는 인터뷰 지침을 따르되, 인터뷰\n 대상자의 다른 답변 방식을 따를 수도 있다.\n\n- 유도 질문 회피 : 특정한 가정이나 가설을 제안하여 인터뷰 대상자를 특정한\n 답변으로 이끄는 유도 질문을 피한다. 중복 인터뷰는 질문의 교차 확인을 통해\n 연구자의 확증 편향으로 인한 편견을 발견하는 데 도움이 된다.\n\n- 듣기 : 인터뷰 대상자에게 충분히 생각할 시간을 주고 즉시 대답하도록\n 강요하지 않는다. 때로 침묵의 순간은 인터뷰 대상자에게 생각을 구조화하고,\n 더 깊이 파고들고, 더 많은 생각을 개방하게 하는 데 도움이 된다.\n\n- 의역 : 연구원이 인터뷰 대상자가 방금 말한 것을 자신의 언어로 의역하여\n 설명하는 것이다. 이를 통해 연구원이 올바르게 이해했는지 또는 듣고 싶은\n 내용만 듣지는 않았는지 확인할 수 있다. 달리 말하면 인터뷰 대상자들이 방금\n 말한 내용을 되돌아보고 더 자세히 설명하도록 시간을 주는 것이다.\n\n- 다섯 단계의 ‘왜’(Five Whys) 사용 : 다섯 단계의 ‘왜’는 간단하지만 효과적인\n 인터뷰 기법이다. 각각의 연속적인 답변을 통해 인터뷰 대상자의 단순하고\n 피상적인 답변이 근본적인 동기와 원인으로 이동한다.\n\n- 인터뷰 질문 계획하기 : 인터뷰 질문은 연구 질문과 동일하지 않을 수 있지만,\n 주제에 간접적으로 접근할 수 있다.\n\n\n\n\n                                  서비스·경험디자인 이론서 181\n\f                         F 설문\n\n                         설문은 정량적 조사 기법으로 특정 주제에 관한 사람들의 행동, 태도를 이해하기\n                         위해 조사 초기 단계에서 사용된다. 잘 가다듬은 질문들을 많은 사람들에게\n                         배포하고 이후 취합된 답변들 속에서 패턴을 발견하기에 유용한 기법으로 고객\n                         만족도를 조사하는 경우뿐 아니라 다른 조사 기법 초기에도 많이 사용된다.\n\n\n                         G 조사윤리\n\n135                      IRB(Institutional Review Board)란 「생명 윤리 및 안전에 관한 법률」에 따른\n매경시사용어사전 (https://100.\ndaum.net/encyclopedia/   “기관생명윤리위원회”와 「약사법」에 따른 “임상시험심사위원회”를 의미한다.135\nview/31XXXXX19564)\n\n                         첫째, 기관생명윤리위원회는 인간 또는 인체 유래물을 대상으로 하는 연구나\n                         배아 또는 유전자 등을 취급하는 생명윤리 및 안전의 확보가 필요한 기관에서\n                         연구 계획서 심의 및 수행 중 연구 과정 및 결과에 대한 조사, 감독 등을 통해\n                         연구자 및 연구 대상자 등을 적절히 보호할 수 있도록 설치된 자율적•독립적\n                         윤리 기구를 말한다. 둘째, 임상시험심사위원회는 임상 계획서나 대상자로부터\n                         서면 동의를 얻기 위해 제공되는 정보나 사용 방법을 검토하고 지속적으로\n                         확인함으로써 임상 시험에 참여하는 대상자의 권리, 안전, 복지를 위하여 시험\n                         기관에 독립적으로 설치한 상설 위원회를 말한다.\n\n                         사람을 대상으로 하는 모든 연구는 조사윤리(IRB, Institutional Review\n                         Board) 심의가 필요하며 사람 대상 연구는 다음과 같다.\n                         - 사람을 대상으로 물리적으로 개입하는 연구(임상 실험)\n                         - 연구 대상자와 상호작용을 통해 자료를 모으는 경우(대면 설문 조사, 행동\n                           관찰, 신체검사)\n                         - 직접 만나지 않더라도 개인 정보를 사용하는 경우\n                         - 인체 유래물을 직접 조사·분석하는 연구\n\n                         사용자 조사를 위한 윤리적인 리서치 가이드라인은 다음과 같다.\n                         - 대상자들로부터 동의서를 받는다.\n                         - 연구의 이익과 위험 요소에 대해 설명한다.\n                         - 대상자의 개인 정보를 보호한다.\n                         - 대상자들의 시간을 보상한다.\n                         - 연구자는 인간 대상 연구와 관련된 사항을 기록·보관하여야 한다.\n                         - 대상자가 요구한다면, 그에게 얻은 데이터와 리서치 결과를 제공해야 한다.\n\n\n\n\n182 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f어떠한 경우든 대상자 모집 공고를 내는 경우 사전에 임상시험심사위원회의\n사전 심의를 거쳐야 한다. 직접 연구 대상자 를 만나지 않고 개인 정보를\n사용하는 연구라 하더라도 임상시험심사위원회 승인을 받아야 한다. 다만,\n연구자는 인간 대상 연구 또는 인체 유래물 연구라 할지라도, 법 제15조 제2항\n내지 제36조 제2항에 따라 연구 대상자 등 및 공공에 미치는 위험이 미미한\n경우”에 한하여 “국가위원회 심의를 거쳐 보건복지부령으로 정하는 연구”에\n대하여 연구 계획서 심의를 받지 않을 수 있다.\n\n\n\n\n                             서비스·경험디자인 이론서 183\n\f                    2.2.3 비참여자 연구(Non-participant Approach)\n\n                    A 비참여 관찰(Non-participant Observation)\n\n정의                  연 구자가 조 사 대 상 집단 의 구 성 원 역 할 을 수 행 하거 나 연 구 참 가 자 와\n                    적극적으로 상호작용하지 않고 제3자의 입장에서 조사 대상 집단 혹은 연구\n                    참가자 를 관찰 하여 데이터를 수집하 는 방법으 로, 연구자 는 “ fly on the\n                    wall”처럼 행동한다. 대개 서비스나 제품을 물리적 또는 디지털로 제공하고\n                    사용하는 것처럼 조성한 연구 문제와 관련된 상황에서 고객, 직원 또는 기타\n                    이해관계자를 살펴보기 위한 방법이다.\n\n\n\n배경                  비참여 관찰은 구 성원 역할을 수행하기 어려운 집단을 관찰 하고 자 할 때\n                    유용하다. 또한 관찰 활동에 제한을 받지 않으며 관찰의 객관성을 확보할 수\n                    있다.\n\n                    비참여 관찰은 명시적으로 또는 은밀하게 수행할 수 있다. 명시적인 관찰은\n                    연구원이 회의에 참여는 하지만 전혀 간섭하지 않는 경우처럼 연구 참가자가\n                    연구원의 존재는 알고 있지만 상호작용은 하지 않는 것을 말한다. 명시적인\n                    비참여 관찰에서 연구 참가자는 관찰자 효과로 인해 평소와는 다른 행동을\n                    할 수 있다. 한편 연구원의 존재로 인해 연구 참가자들이 영향을 받게 되는\n                    위험성을 최소화하기 위해 고객이나 행인처럼 행동하거나 원웨이 미러(One-\n                    way Mirror)를 사용하는 은밀한 관찰 방법도 있다.\n\n\n사용 목적               비 참 여 관 찰 은 관 찰 활 동 과 분 리된 상 태 에 서 관 련된 커 뮤 니티나 사 회\n                    시스템으로 들어가 현상을 이해하는 데 사용된다. 비참여 관찰은 다른 방법에서\n                    연구자의 편견을 제거하고, 사람들이 말하는 것과 실제로 행동하는 것 사이의\n                    차이점을 밝히는 데 많이 사용된다.\n\n\n수행 방법 및 과정          비참여 관찰은 사람들이 지시를 무시하거나 도움 요청을 자제하게 되지 않도록\n                    관찰하는 것이 중요하다. 수집하려는 데이터가 법적, 윤리적, 기밀 유지 계약을\n                    필요로 하는 것인지 연구가 수행되는 국가 기관 및 조직에 연락하여 사전에\n                    확인한다. 동의 없이 타인의 사진이나 동영상을 촬영해서는 안 되고, 사진이나\n                    동영상 촬영이 불가능한 경우 스케치를 사용하거나 나중에 동료와 함께 상황을\n                    재구성하여 기록한다.\n\n\n\n\n184 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f             1. 질문 정의 : 연구 수행 이유(탐색적 연구 vs. 확증적 연구)와 연구 결과\n              활용 방법(페르소나, 고객 여정 지도, 서비스 가치 흐름도 등), 샘플 크기\n              등을 고려하여 관심사를 중심으로 구체적인 질문이나 발견하고자 하는 바를\n              정의한다.\n\n             2. 계획 및 준비 : 연구 질문에 따라 비참여 관찰에 적합한 위치 및 상황 선정을\n              위한 기준을 마련한다. 수집 데이터의 유형과 비참가자 관찰 방식(명시적인\n              수행 혹은 은밀한 수행)을 결정한다. 연구원을 구성하고 관찰 지침을 정한다.\n\n             3. 수행 : 데이터를 수집하기 위해 스마트폰이나 눈에 잘 띄지 않는 장치를\n              사용하여 연구 대상에 영향을 미치는 상황을 최대한 피한다. 비참여 관찰은\n              심층(회고적) 인터뷰와 같은 다른 방법을 동시에 활용할 수 있다. 관찰은 고객\n              여정의 특정 순간에 몇 분에서부터 몇 주 동안 이루어질 수 있다.\n\n             4. 후속 작업 : 연구원들이 작성한 인터뷰 내용을 대조한다. 모든 데이터에\n              대해 목록을 작성하고 중요한 부분을 강조하여 표기한다. 데이터 내에서\n              패턴을 찾는다. 각 인터뷰 자료에 대해 인용문, 사진 또는 비디오 등을 포함한\n              주요 원시 데이터를 사용하여 짧은 요약을 작성한다.\n\n\n             통화 모니터링(Cell Monitoring) : 이 방법은 주로 콜센터에서 상담원과 고객\n             간의 대화를 조사하기 위해 사용된다. 통화 모니터링은 라이브로 진행하거나\n             녹음된 전화 통화를 기반으로 수행할 수 있다. 오늘날에는 AR 헤드셋, 웨어러블\n             센서 및 기타 녹음 장비들을 통해 새로운 유형의 데이터 수집이 가능하다.\n\n\n구성 요소(결과물)   - 문서(현장 노트), 사진, 비디오, 오디오 녹음, 스케치, 수집 자료, 통계 데이터\n\n             - 주요 이슈 요약\n\n\n\n\n                                              서비스·경험디자인 이론서 185\n\f                    B 모바일 에스노그래피(Mobile Ethnography)\n\n정의                  모바일 에스노그래피는 기술을 활용하여 실시간 고객 경험의 의미를 문서화,\n                    분석 및 도출하는 질적 연구 방법으로, 스마트폰과 같은 모바일 장치로 데이터를\n                    수집하는 연구 환경에서 이루어지는 종합적인 다수의 자문화 기술지 방법의\n                    하나이다. 모바일 에스노그래피는 참여자에게 스마트폰을 제공해 그들이 시간과\n                    장소에 관계없이 사용자 중심의 정보를 수집하도록 하 는 방법이다. 지리적\n                    위치에 영향을 받지 않고 연구자가 실제 조사에 참여하지 않는다는 점은 문화적\n                    프로브와 같지만, 통찰을 얻는 방법에서 참여자들이 연구자에게 지침을 받는\n                    대신 직접 연구의 구조를 선택하도록 한다는 것이 다르다.\n\n\n역사                  모바 일 에 스 노 그래피 는 서비스 제 공 과 정에 서 직 접 데이터를 수 집하기\n                    때문에 기존의 에스노그래피 연구에서 서비스 이용 후 경험을 회상해야 하는\n                    어려움을 극복할 수 있다. 또한 자문화 기술지(Autoethnography)의 한 형태로\n                    어디서든지 실시간으로 고객의 통찰 내용을 수집할 수 있다. 이 방법은 참가자가\n                    모바일 장치를 사용하는 능동적인 연구원의 역할을 하여 시간과 비용 면에서\n                    효율적이며, 참가자를 모집할 때 장소의 제약이 없다. 모바일 에스노그래피는\n                    서비스디자인의 맥락에서 자주 적용된다. 연구원이 관찰에 참석해야 하 는\n                    기존의 에스노그래피와 달리 모바일 에스노그래피는 참가자의 모바일 장치를\n                    사용하여 사용자 중심의 정보를 수집하기 때문이다. 또한 이 방법은 참가자가\n                    스스로 능동적인 연구자가 되어 사건이 일어나는 현장에서 자신의 경험을 바로\n                    기록하고 이를 스스로 구조화할 수 있도록 한다는 점에서 사용자 중심 디자인의\n                    원칙을 따른다고 볼 수 있다.\n\n\n사용 목적               모바일 에스노그래피는 고객의 입장에서 접점을 수집하므로 개인 고객 여정\n                    지도를 작성하기 위해 질적 마케팅 조사 및 고객 경험 관리 분야를 적용할\n                    수 있다. 모바일 에스노그래피는 주로 자신의 일상 및 특정 연구 과제에서\n                    주어진 연구 질문이나 주제와 관련하여 관심이 있을 수 있는 모든 것에 대해\n                    문서화 가능한 고객이나 직원에 초점을 맞춘다. 모바일 에스노그래피 전용\n                    앱을 통해 참가자는 전체 고객 여정과 모든 온·오프라인 채널에서의 거의 모든\n                    경험을 자체 문서화할 수 있다. 이러한 앱은 텍스트, 사진, 비디오 및 정량적\n                    평가 외에도 데이터를 여정 지도나 지리 지도로 시각화하는 데 필요한 시간\n                    및 위치 정보도 수집한다. 모바일 에스노그래피는 자체 구조화된 접근 방식에\n                    따라 참가자가 중요하다고 생각하는 모든 것을 문서화하도록 하며, 웹 기반\n                    소프트웨어로 수집된 데이터를 집계한다. 모바일 에스노그래피는 낯선 사람들과\n                    말하기 어려운 친밀한 주제뿐만 아니라 하루 또는 며칠에 걸친 장기간의 연구에\n                    적합하다. 수집된 시간 및 지리적 위치와 같은 메타 데이터는 관광 또는 도시\n                    경험과 같이 지리 요소가 중요한 프로젝트에서 활용될 수 있다.\n\n186 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f수행 방법 및 과정   참여자 들에게 스마트폰을 제공해 그들이 시간과 장소 와 관계없이 서비스\n             접점(Touch Point)에서 음성과 문자, 사진과 동영상 등을 이용해 그 내용을\n             기록하도록 한다. 이때 참여자가 직접 연구의 구조를 선택하여 기록한다.\n             연구자 들 은 참여자 들에게 약간의 지침을 제공할 수도 있지만, 그 과 정이\n             아주 체계적일 필요는 없다. 오히려 조사의 효과가 흐려지지 않도록 유연성을\n             유지하 는 것이 중요하다. 오늘날 에는 모바일 장치를 통해 서비스 접점을\n             수집하고 디지털 여정 매핑이 가능한 다양한 모바일 에스노그래피 소프트웨어가\n             있다.\n\n             1. 연구 문제 구체화 : 연구를 수행하는 이유, 연구 결과를 통해 수행하고 싶은\n              후속 연구와 샘플의 크기를 고려하여 발견하고자 하는 내용에 대한 구체적인\n              질문을 결정한다.\n\n             2. 계획 및 준비 : 연구 목표에 따라 샘플링 기술을 사용하여 연구 참가자를\n              선정한다. 참가자들의 인센티브 제공 계획을 세우고 프로젝트 전달 방식을\n              결정한다. 사진 또는 비디오 촬영에 대한 법적 규제를 확인하고 참가자의\n              동의 및 기밀 유지 계약 규정을 확인한다. 클라이언트나 프로젝트와 관련된\n              다른 부서 연구원의 포함 여부를 결정한다.\n\n             3. 프로젝트 준비 및 참가자 초대 : 모바일 에스노그래피 프로젝트에 적합한\n              소프트웨어를 선정하고 프로젝트를 준비한다. 참가자에게 제시할 작업은\n              짧고 명확하게 설정한다. 프로젝트의 목표와 작업 설명을 위한 초대장을\n              제작한다.\n\n              프로젝트 참여 방법, 경험 문서화 방법 및 인센티브에 대한 명확한 지침을\n              제공한다. 가능하면 연구 전에 참가자들과 인터뷰를 통해 연구 배경과 주제에\n              대해 명확히 전달한다.\n\n             4. 데이터 수집 : 참가자 를 초대하고 데이터 수집을 시작 하면 실시간으 로\n              데이터가 도착하는 것을 볼 수 있다. 수집된 데이터는 즉시 종합 및 분석하여\n              태그를 지정하고 코드화하여 고객 여정 지도를 제작할 수 있다. 정해진\n              시간에 참가자에게 푸시 알림을 보내는 유도 연구 접근 방식을 사용할 수도\n              있다. 참가자에게 데이터 수집 기한에 대한 정확한 정보를 전달한다.\n\n\n\n\n                                            서비스·경험디자인 이론서 187\n\f                    5. 후속 작업 : 수집된 데이터를 살펴보고 보고된 고객 여정 지도를 작성하고\n                       패턴을 찾는다. 필요한 경우 참가자와 후속 인터뷰를 수행하여 주요 문제에\n                       대해 더 자세히 조사한다. 정렬 및 필터링 옵션을 사용하여 참가자 프로필을\n                       기반으로 다른 그룹에 대한 다양한 문제를 탐색한다. 개별 분석 이후 주요\n                       탐색 내용을 작성하고 비교 분석한다. 데이터의 목록을 작성하고 주요 내용을\n                       강조하여 표기하며, 데이터와 모든 연구자 사이에서 패턴을 찾도록 한다.\n                       그리고 인용문, 사진 또는 비디오 등을 포함한 주요 원시 데이터를 사용하여\n                       짧은 요약을 작성한다. 또는 발견한 각 참가자 그룹에 대한 통합 고객 여정\n                       지도를 만든다.\n\n\n구성 요소(결과물)          - 문서, 사진, 비디오, 오디오 녹음, 날짜 및 시간, 지리적 위치, 참가자 프로필\n                       통계\n\n                    - 주요 이슈 요약\n\n\n                    비디오 에스노그래피(Video Ethnography) : 비디오 에스노그래피는 영상\n                    인류학 분야에서 차용된 방법이다. 연구 참가자의 이야기를 듣는 대신에 고정된\n                    카메라를 통해 그들의 행태를 촬영해 관찰하는 방법이다. 행동 패턴과 통찰을\n                    확인하기 위해 분석 가능한 비디오를 이용하여 상황 속에서 일어나는 사람들의\n                    활동과 사건을 포착하는 것이 이 방법의 목적이다.\n\n                    영상 에스노그래피(Visual Ethnography) 분야에서 차용된 방식으로 녹화를\n                    위한 가이드라인을 만들어 허락을 받은 다음 비디오를 녹화하고 추후 분석에\n                    활용한다. 비디오 에스노그래피의 진행 방식은 조사자가 영상을 직접 촬영할\n                    수도 있고, 참가자가 스스로 녹화하는 방식으로 진행될 수도 있다. 카메라를\n                    이용해 관찰자 없이 자연스러운 환경에서 관찰할 수 있다.\n\n                    집 이외의 다양한 환경을 관찰해야 한다면 여러 대의 카메라를 설치해 촬영할\n                    수 있다. 먼저 녹화 를 위한 가이드라인을 만들고 동의를 얻은 후, 비디오를\n                    녹화하 여 추 후 분 석에 활용한다. 고정된 카메라가 관찰자와 사 용 환경을\n                    지속적으로 기록하게 되므로 서비스를 이용할 때 이루어지는 여러 가지 행동을\n                    확인할 수 있다. 촬영 후 반복적으로 여러 사람이 확인할 수 있고, 현장에서\n                    실시간으로 진행되었다면 놓쳤을 수도 있는 부분을 찾아내거나 의도치 않은\n                    행동을 확인할 수 있다. 비디오 에스노그래피는 서비스 프로세스, 공공 장소\n                    같은 역동 적인 상황 및 대화나 사람들이 말로 설명할 수 없는 경험 등 을\n                    기록하는 데 편리하다. 반면에 이 방법은 사진 촬영에 비해 수집된 데이터를\n                    분석하는 데 시간이 많이 소요된다.\n\n\n\n\n188 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f     C 문화적 프로브(Cultural Probes)\n\n정의   문화적 프로브는 사용자 관점에 대한 깊이 있는 통찰을 얻기 위해 연구자가\n     제시한 특정 작업을 기반으로 한 사용자 정보를 수집하는 패키지이다. 이 방법은\n     정해진 기간에 참여자들이 간단한 일기 같은 것을 작성하도록 하며, 연구자가\n     현장에 직접 가지 않고서도 그에 대한 통찰을 얻는 방법이다.\n\n     연구자는 참여자에게 간단한 지시문과 개인의 실제 생활에 대한 정보(음성,\n     문자, 사진, 동영상 등)를 모으기 위한 패키지(카메라, 스크립트 등)를 제공하여\n     개인의 실제 생활을 기록하도록 한다.\n\n\n역사   문화적 프로브는 1999년 빌 게이버(Bill Gaver) 등에 의해 개발되었다. 문화적\n     프 로 브는 디자인 과 정에서 아이디어를 얻기 위해 사 용자의 생활, 가치와\n     생각들에 관한 데이터를 사용자가 직접 수집하도록 하 는 방법이다. 사용자\n     참여를 원칙으로 참여자들에게 탐구를 위한 충분한 시간을 제공하고 디자인에\n     영감을 주는 자료를 직접 창출하도록 한다. 사용자에게 지도, 엽서, 카메라,\n     다이어리 등 단순한 제시물 세트를 제공하고, 사용자의 일상 환경에서 특정\n     상황의 감정이나 상호작용을 기록하도록 한 후, 기록물의 조각들로부터 디자인\n     영감을 얻는다.\n\n     예술적 성향이 강했던 문화적 프로브 이후 사용자 중심 디자인 과정에 좀 더\n     적합하도록 변형시킨 디자인 프로브(Design Probe)가 개발되었다. 디자인\n     프 로 브는 사 용자의 경험에 대해 더 총체적이고 공 감적인 이해를 얻을 수\n     있는 자료를 제공한다. 이러한 프로브(Probe)는 각 프로젝트의 특성에 맞게\n     재구성되어야 한다.\n\n     요즘에는 온라인 일기 플랫폼이나 모바일 민족지 앱을 사용하여 가 상으로\n     문화 조사를 하는 경우가 많다. 연구 참가자는 주어진 지침을 따르고 현장\n     메모와 사진에 대한 특정 경험을 자체 문서화하고 자기민족지학적 접근 방식을\n     기반으로 관련 자료를 수집하도록 요청받는다.\n\n     문화적 프로브는 하루, 일주일 또는 몇 년 동안 보관된 일기가 포함될 수도 있다.\n     참가자들은 연구원이 정의한 간단한 스크립트에 따라 자신의 스마트폰으로\n     동영상을 찍거나 다양한 상황에서 특정 제품을 어떻게 사용하 는지 사진을\n     찍도록 요청받을 수도 있다. 이러한 문화적 프로브에는 다양한 변형이 있다.\n     문화 적 프 로 브에 서 파생된 조 사 방 법으 로 정 보 프 로 브(Informational\n     Probes), 기술 프 로 브( Technology Probes), 모바일 프 로 브(Mobile\n     Probes), 공감 프로브(Empathy Probes), 가정 프로브(Domestic Probes),\n\n\n\n\n                                           서비스·경험디자인 이론서 189\n\f                    도시 프 로 브(Urban Probes), 반사 프 로 브(Reflective Probes), 원시\n                    프로브(Primitive Probes) 등이 있다.\n\n                    문화적 프로브는 연구원이 물리적으로 관여하지 않은 가운데 참가자로부터\n                    가장 친밀한 통찰력을 얻기 위해 자주 사용된다. 이러한 문화 적 프 로 브를\n                    통해 연구원들은 문화적 경계를 극복하고 다양한 관점을 디자인 프로세스에\n                    도입하는 데 도움을 받는다.\n\n\n사용 목적               문화 적 프 로 브는 디자 인 프 로 세스에서 아 이디어 도출 에 영감을 주 는 데\n                    사용되는 기술로, 사람들의 삶, 가치 및 생각에 대한 영감을 주는 데이터를\n                    수집하 는 수단으로 사용된다. 문화적 프로브의 목적은 연구원이 참석하지\n                    않는 상황에서 참가자 자신이 수집한 편견 없는 데이터를 얻는 것이며, 문화적\n                    프로브의 목표는 사람들로부터 영감을 받는 반응을 끌어내어 그들의 문화, 생각,\n                    가치를 더 잘 이해하고 디자이너의 상상력을 자극하는 것이다.\n\n                    문화적 프로브는 참여자 관찰이나 공동창작 워크숍과 같은 다른 방법으로\n                    추가적인 연구를 수행하기 위한 의견을 제시하거나 심층 인터뷰에서 민감한\n                    문제를 다룰 때 사용된다.\n\n\n수행 방법 및 과정          1. 연구 문제 구체화 : 연구를 수행하는 이유(탐색적 연구 vs. 확증적 연구),\n                       연구 결과 를 통해 수행하고 싶은 후속 연구(페르 소나, 고객 여정 지도,\n                       서비스 가치 흐름도 등)와 샘플의 크기를 고려하여 발견하고자 하는 내용에\n                       대한 구체적인 질문을 결정한다.\n\n                    2. 인터뷰 대상자 선정 : 연구 질문을 기반으로 문화적 프로브 수행 대상, 시간\n                       및 장소 등을 고려하여 적합한 참가자 선택 기준을 정의한다. 샘플링 기법을\n                       사용하여 연구 참가자를 선정하고 내부 전문가 또는 외부 기관을 포함하여\n                       참가자를 모집한다.\n\n                    3. 계획 및 준비 : 연구 목표에 따라 문화적 프로브 패키지에 포함할 내용을\n                       계획하고 자세한 지침을 작성한다. 여기에는 다이어리 연구 지침, 사진\n                       촬영, 참가자가 제품/서비스/상품을 사용하는 방법, 경험 또는 시스템 매핑\n                       등이 포함될 수 있다. 연구원과 참가자 간의 오해 발생을 막기 위해 지침을\n                       테스트한다.\n\n                       참가자가 실제 일기, 온라인 블로그, 스마트폰 앱 또는 다양한 미디어를\n                       혼용하여 자신의 작업을 문서화하는 방법을 정의한다. 아울러 참가자에게\n                       연구 프로젝트에 대한 일반 정보 및 데이터 업로드 방법, 기한을 전달하며,\n                       참가자에 대한 인센티브를 결정한다.\n\n\n190 Part 3. 왜 서비스·경험디자인을 어떻게 실현하는가?\n\f             4. 문화적 프로브 패키지 전달: 회송받기 위한 주소가 적힌 반환 패키지를\n              포함하여 문화적 프로브 패키지를 전달한다. 참가자의 질문이나 패키지\n              내용물 분실에 대비하여 연락처 정보를 제공한다. 문화적 프로브의 기간은\n              연구 목표에 따라 하루에서 몇 주까지 다양하다.\n\n             5. 후속 작업 : 반환된 패키지를 검토하고 수집한 데이터의 목록을 작성한다.\n              주요 내용을 표시하고 데이터에서 패턴을 찾는다. 필요한 경우 참가자와 후속\n              인터뷰 일정을 잡는다. 작성 내용을 검토하고 주요 결과를 비교한다. 인용문,\n              사진 또는 비디오 등을 포함한 주요 원시 데이터를 사용하여 짧은 요약을\n              작성한다.\n\n             문화적 프로브는 자문화 기술지(Autoethnography), 다이어리 연구(Diary\n             Studies), 모바일 에스노그래피(Mobile Ethnography)와 같은 다양한 접근\n             방법과 함께 사용하는 경우가 많다.\n\n\n구성 요소(결과물)   - 문서(자술 메모, 일기), 사진, 비디오, 오디오 녹음, 수집 자료\n\n             - 주요 이슈 요약\n\n             장소 조사법(Town Watching) : 소비자 집단의 라이프 스타일 및 트렌드를\n             파악하기 위한 방법이다. 다양한 생활 구성 요소들이 상호작용을 만들어내는\n             거리에서 복합적인 기호와 상징을 관찰함으로써 트렌드와 소비자의 잠재적인\n             니즈를 파악한다. 연구에서 설정된 장소 및 기간에 실제 거리를 관찰하고 수집한\n             사진 및 영상 자료를 분석하여 도표나 지각도로 시각화하고, 여기서 핵심\n             키워드를 추출한 후 사용자의 잠재적 니즈를 추출한다.\n\n\n\n\n                                               서비스·경험디자인 이론서 191\n\f         [디자인과 행동경제학]\n         비이성적 행동의 법칙: 편향(Biases)136\n\n\n더 알아보기\n         136                               행동경제학은 심리학과 경제학이 결합하면서 탄생한 분야로 인지심리학이나\n         로버트 그린(2019), 《인간본성의 법\n         칙》, 위즈덤 하우스, pp. 55-59            인지과학의 중심에 있는 연구 분야이다. 행동경제학이란 인간이 실제로 어떻게\n\n         137\n                                           '선택'하고 행동하는지, 그 결과로 어떠한 사회현상이 발생하는지를 고찰하는\n         도모노 노리오(2007), 《행동경제학:\n                                           학문으 로, 인간 행동의 실제와 그 원인, 그것이 경제 사회에 미치는 영향,\n         경제를 움직이는 인간 심리의 모든\n         것》, p. 12, pp. 42-44              사람들의 행동을 조절하기 위한 정책 등에 관해서 심층적으로 규명하는 것을\n                                           목표로 한 경제학이다. 이는 경제학에서 오랫동안 축적된 이론에 인지심리학의\n                                           성과를 도입하여 개량한 것이기 때문에 심리학적 특성이 강하게 드러난다.137\n                                           디 자 인 은 기 본 적 으 로 사 용 자 의 행 동 이나 의 사 결 정 을 유도하기 위 해 서\n                                           그들을 이해할 수 있어야 하는데, 이에 도움을 줄 수 있는 내용들을 다룬 것이\n                                           행동경제학이라 할 수 있다.\n\n         138                               행 동 경 제학과 디 자 인의 연관 성은 다 학제 적 디 자 인(Multidisciplinar y\n         하버드 비즈니스리뷰(2017,1-2\n         월 합본), “디자인에 접목되는 행               Design)의 가치 와 관 련이 있다. 다 학제 적 접 근 이 가 진 중요한 가치 는\n         동경제학:습관의 의미”, 2021.10\n                                           다양한 시각으로 다양한 관점에서 문제를 해결하면 더욱더 유의미한 결과를\n         월 기준(https://www.hbrkorea.\n         com/article/view/atype/ma/        얻는 데에 도움이 된다는 것이다. 디자인의 가치를 한 단계 높여 비즈니스\n         category_id/3_1/article_no/891)\n                                           전략과 일치시키기 위해 서는, 인간의 심리에 대한 이해를 주력으 로 하 는\n                                           행동경제학138을 이해하는 것이 도움이 될 수 있다.\n\n                                           우리는 미처 인식하지 못하고 있지만 대부분의 비합리적, 비이성적 행동과\n                                           행위가 감정에 의해 결정되며, 이러한 감정들이 디자인 프로세스 과정에서\n                                           논리적 사고와 디자인 의사결정에 많은 영향 을 주고 있다. 인간의 감정적\n                                           측면과 이성적 측면은 분리되어 있는 것이 아니기 때문에 감정적인 결정이\n                                           비이성적이라고 단정하기 어렵고 꼭 실수를 유발하거나 나쁜 결과로 이어지는\n                                           것이라고 말할 수 없다.\n\n                                           하지만 현재 우리가 몰두하고 있는 일들에 대해 지나친 자신감이나 개인적인\n                                           경험을 바탕으로 감정적으로 대처하고 있는 것은 아닌지 생각해 보고 최대한\n                                           감정과 이성 사이에서 균형점을 찾아야 한다. 이러한 비이성적 성향을 인지하지\n                                           못해 발생할 수 있는 잘못된 디자인 결정들을 방지하기 위해 전체 디자인\n                                           프로세스 과정에서 흔히 발생할 수 있는 비이성적 행동의 법칙이 무엇인지 그\n                                           내용을 이해하고, 타인 또는 디자이너 본인 스스로가 그러한 행동을 하고 있는지\n                                           자각하고 개선하려는 노력이 필요하다.\n\n\n\n\n         192 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                         ​​확증 편향(Confirmation Bias)\n\n139                      보고 싶은 것만 보고, 듣고 싶은 것만 듣고, 믿고 싶은 것만 믿는 선택적 심리\n로버트 그린(2019), 《인간본성의 법\n칙》, 위즈덤 하우스, p. 55       현상을 말한다. 확증 편향은 어떤 계획을 세울 때 혹은 자신의 신념이나 생각에\n                         대한 증거 정보를 찾고 수집할 때 주로 발동되며, 이미 정해놓은 생각에 대해\n                         그 생각이 이성적이고 과학적으로 도출된 것이라고 나 자신을 설득하기 위해\n                         자신의 생각과 일치하는 증거에만 주목하는 것이다.139 이러한 확증 편향을\n                         극 복하기 위해 서는 먼저 스 스 로 가 확 증 편향 이 있을 수 있다 는 사 실을\n                         자각하고, 항상 자신이 믿는 것과 반대되는 다양한 관점을 수용하며 회의적인\n                         시각으로 자신의 직관, 감정들이 합리적인지 스스로 끊임없이 평가해야 한다.\n\n                         리서치에서 인터뷰 진행 시 발생할 수 있는 편향 사례로는 인터뷰 진행자가\n                         스 스 로의 생각과 일치하 는 내용에 더 반응 을 보이거나, 응답자의 대답을\n                         유도하 는 질문 또는 원하 는 답을 얻기 위한 유사 질문을 계속하여 대답을\n                         번복하게 하는 경우가 있다. 또한 인터뷰 결과를 분석할 때도 편향이 발생할 수\n                         있으므로, 스스로가 보고 싶은 것, 듣고 싶은 것, 또는 믿고 싶은 것에 치중되어\n                         있지 않은지 생각해 보고 영향을 받을 수 있는 부분들을 전체 맥락에서 신중히\n                         검토해야 한다. 이와 비슷한 편향으로는 확신 편향이 있다.\n\n\n                         확신 편향(Conviction Bias)\n\n                         누군가 어떤 의견을 열성적인 어조와 몸동작, 생생한 비유, 재미난 일화 를\n                         곁들여 자신 있게 확신을 가지고 이야기하면, 그 내용 을 면밀히 검토했기\n                         때 문 이라고 믿게 된다. 그리고 누 군가 좀 더 조 심스러운 태 도를 보이고\n                         머뭇거리면 확신이 없어서라고 생각 하 는 경향이 있다. 확신 편향 을 가 진\n                         사람들은 스스로를 설득하기 위해 조금은 불확실한 내용에 대해 목소리나\n                         몸짓을 강조하여 이야기하는 경향이 있다. 사 실상 이러한 사람들의 행동을\n                         모두 구분하기란 쉬운 일이 아니지만 누구에게나 있을 수 있는 편향이라는 것을\n                         염두에 두면 사용자 리서치를 진행할 때 도움이 될 수 있다.\n\n                         “내가 이렇게 확신한다면 틀림없이 이건 분명히 문제가 될거야.”라는 디자이너의\n                         주관적인 편향에 의해 문제가 없는 내용을 문제가 많은 것처럼 여기는 경우는\n                         사용자 리서치를 수행할 때 종종 발생하는 문제다. 이는 불필요한 근거 자료를\n                         수집하거나 연구를 잘못된 방향으로 이끌어 전체 인터뷰나 분석 결과에 영향을\n                         주기도 한다. 이는 주관적인 확신이 객관적인 정확도보다 상대적으로 큰 경우\n                         발생하는 것으로, 그 결과로 인해 자칫 치명적인 실수로 이어지기도 한다.\n\n\n\n\n                                                        서비스·경험디자인 이론서 193\n\f                    겉모습 편향(Appearance Bias)\n\n                    사람들은 본질적인 것이 아닌 겉으로 드러나는 ‘보이는 것’을 믿는 경향이 있다.\n                    사회생활을 하다 보면 사람들은 자신의 비이성적 행동을 감추기 위해 누군가가\n                    지켜볼 때 자신의 행동 들 을 조정하거나 순화하 는 호손 효과 를 보이는데,\n                    사람들은 이를 모두 실재라고 믿기 쉽다. 리서치를 수행할 때, 때로는 겉모습에\n                    편향되어 참여자의 외모가 훌륭하면 진실만을 대답할 것이라고 믿는다든지,\n                    또는 진행자가 좀 더 윤리적이고 도덕적인 사람으로 보여야 된다는 생각으로\n                    인터뷰 진행을 지루하게 만드는 일이 발생하지 않도록 주의해야 한다.\n\n\n                    집단 편향(Group Bias)\n\n                    우리는 태생적으로 사회적 동물이다. 나와 같은 방식으로 생각하는 사람을\n                    발견하면 안도감을 느끼고, 집단과 생각이 다르거나 혼자만 고립되었다는\n                    느낌이 들면 우울하고 겁먹기 마련이다. 하지만 우리는 이러한 행동을 쉽게\n                    자각하지 못하기 때문에 어떤 결정을 내릴 때 온전히 본인 스스로의 생각으로\n                    그 결론에 도달했다고 믿는다. 또는 특별한 환경의 영향이나 방침, 타인으로부터\n                    어떤 말을 듣지 않았음에도 자신도 모르게 마법처럼 타인과 의견이 일치되는\n                    현상이 종종 발생하는데, 이러한 현상을 그룹 편향 또는 집단 편향이라고 한다.\n                    사회 곳곳에서 발생하는 따돌림이나 편 가르기와 같이, 별다른 근거 없이 내가\n                    속한 집단의 사람들은 모두 긍정적이고 옳은 얘기만 한다고 믿고, 그 외 집단에\n                    속한 사람들은 배척하는 성향을 보이는 것을 말한다.\n\n\n                    탓하기 편향(Blame Bias)\n\n                    탓하기 편향은 내가 저지른 실수를 들여다보는 것이 불편하여 겉으로만 빠르게\n                    자 신의 잘못이라고 결론지어 버리고 속으 로는 다른 사람이나 환경, 혹 은\n                    순간적 오판을 탓하는 편향이다. 실제로 사람들은 자신의 경험과 실수에서\n                    많은 것을 배운다고 이야기하지만, 사람들은 현실을 그다지 자세히 들여다보고\n                    싶어하지 않기 때문에 자기성찰에는 한계가 있을 수 있다. 그래서 시간이 지나면\n                    잊어버리고 똑같은 실수를 다시 반복하는 경향이 있다. 이는 디자인 과정에서도\n                    흔히 발생하는 편향으로, 디자인 결과물에 대한 다양한 반대 의견이나 평가에\n                    대한 답변, 또는 실수로 인해 발생한 잘못된 결과에 대해 항상 외부 환경이나\n                    시스템 또는 이해관계자로부터 그 이유를 찾고 탓하는 경우가 있다. 디자인\n                    결과물은 디자이너 혼자만의 전유물이 아니기 때문에 잘못된 결과에 대해서\n                    실수 자체나 사람을 탓하기보다는 그 원인을 파악하는 데 초점을 두고 함께\n                    해결해 나가는 것이 바람직하다.\n\n\n\n\n194 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                         우월성 편향(Superiority Bias)\n\n140                      우월 성 편 향 은 자 신 은 남 들과 다 르 고 다 른 사 람 들보다 더 이 성 적이 고\n로버트 그린(2019), 《인간본성의 법\n칙》, 위즈덤 하우스, p. 59       윤리적이라고 믿는 현상이다. 우리는 우리 자신에게 너무나 익숙해져 있기\n                         때문에 자신이 범하는 잘못은 보지 못하고 잘못한 일들을 쉽게 정당화하며\n141\n로버트 그린(2019), 《인간본성의 법   남들의 비이성적인 행동만 잘 보는 경향이 있다.140\n칙》, 위즈덤 하우스, pp. 72-73\n\n                         이 편향 은 자 신이 기획하고 설계한 내용이 가 장 뛰어나고 체 계적이라고\n                         생각 하거나, 집단 편향과 유 사 하게 우리 팀이 낸 아 이디어가 가 장 좋고\n                         객관적이며 이성적인 판단에 의한 결과라고 믿는 경향을 말한다.\n\n                         전체 디자인 프로세스 과정에서 디자이너는 항상 사고와 감정 사이에서 최고의\n                         균형점을 찾는 것이 중요하다. 사람들은 충동에 쉽게 휘둘려 주관에 치우쳐\n                         행동하거나 집단적으로 똑같은 행동을 할 수 있으며, 우월감에 빠져 스스로를\n                         과신하고 비합리적으로 의사결정을 하기도 한다. 사고와 감정은 떼어 놓을 수\n                         없는 것이지만 상황에 따라 어느 한쪽이 더 우위를 차지하는 경우가 있으며,\n                         다른 사람에 비해 감정의 지배를 더 많이 받는 디자이너가 있을 수 있다. 이러한\n                         경우 효과적인 디자인을 위해서 필요한 것은 적절한 배분과 균형이며, 비이성적\n                         행동을 자각함으로써 감정적 자아를 길들이는 것이다. 이래야만 차분하고\n                         명료한 상태가 되어 효율적으로 행동할 수 있으며, 마음의 여유를 바탕으로\n                         자신감도 생겨 더욱 창의적인 사람이 될 수 있다.141\n\n\n\n\n                                                          서비스·경험디자인 이론서 195\n\f         [디자인과 행동경제학]\n         사용자 리서치와 설문 응답 편향(Survey Response Biases)142,143\n\n\n더 알아보기\n         142                               사용자 리서치를 수행하다 보면 사용자가 본인의 생각을 드러내는 대신 경험과\n         도모노 노리오(2007), 《행동 경제\n         학: 경제를 움직이는 인간 심리의 모              편견, 사회적 신념, 태도에 따라 응답을 변경하거나 또는 질문지의 순서나 형식에\n         든 것》, 지형\n                                           따라 결과가 왜곡되어 편향(biases)된 결과를 얻게 되는 경우가 발생한다.\n         143\n         Survey Response Biases in User    설문 조사의 경우에는 간혹 조사 결과를 쉽게 얻을 수 있도록 응답자가 좋은\n         Research, Alita Joyce, nngroup,\n         2021.9월 기준 (https://www.          의도로 거짓말을 하는 경우도 있고, 자신의 판단에 대해 선택적으로 임의대로\n         nngroup.com/videos/ survey-\n         response-biases)\n                                           응답을 조정하기도 한다. 이렇게 응답자 개인의 심리적인 상황이나 조건에 따라\n                                           다양한 편향이 발생할 수 있는데, 이러한 경우에는 리서치 결과 자체의 신뢰성과\n                                           가치를 떨어뜨리는 결과를 낳기도 한다. 이를 방지하기 위해 리서치 수행 시에는\n                                           두 명 이상의 조사자 또는 분석가가 크로스 체크를 하여 편향을 최소화하며,\n                                           언제든지 발생할 수 있는 여러 종류의 편향을 이해하고, 그 지식을 바탕으로\n                                           리서치를 설계하여 어느 정도 타당한 결과를 얻을 수 있도록 노력해야 한다.\n\n\n                                           동조 편향(Acquiescence Bias)\n\n                                           묵인 편향이라고도 하는 동조 편향은 설문 조사를 실시할 때 응답자가 깊이 있게\n                                           생각하거나 이성적으로 판단하기보다는 습관적으로 상대방의 생각에 동조하고,\n                                           모든 질문에 동의하는 경향을 말한다.\n\n                                           이러한 행동의 원인은 사회적 규범 때문이다. 사람들은 보통 설문 조사 를\n                                           일반적인 대화처럼 생각해, 질문 방식에 따라 다른 답변을 하기도 하고, 질문에\n                                           대해 대부분 긍정적이고 호의적인 답변을 하기도 한다. 하지만 간혹 예외의\n                                           상황도 있는데, 설문 조사를 할 때 응답자가 주의 깊게 내용을 읽어보기 전에\n                                           습관적으로 ‘동의함’ 또는 ‘예’를 체크하는 경향을 보일 때가 있다. 이는 단순히\n                                           응답자가 인터뷰를 빨리 끝내기 위해 이런 선택을 하는 경우일 수 있으니, 미리\n                                           알고 설문 결과에 미치는 영향을 최소화할 수 있도록 미리 대처하면 도움이 될\n                                           수 있다.\n\n\n\n\n         196 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f사회적 선망 편향(Social Desirability Bias)\n\n사 람 들 은 사회 적 통 념 가치 를 묻 는 질 문 에 대 하 여 통 념 적 사회 규 범에\n바람직하다고 생각하는 가치에 맞게 왜곡하여 표현을 하는 경향이 있다. 이는\n사회적 용인 편향이라고도 불리는데, 특히 개인적으로 민감한 질문이나 논쟁의\n여지가 있는 주제에 관한 질문에서 많이 발생한다.\n\n‘하루에 모바일 기기를 대략 몇 시간 사용하십니까?’라는 문항을 예로 들면,\n응답자 들 은 일반적 으 로 장 시간 의 모바 일 사 용 이 지니는 장점 을 취하고\n있으면서도, 이것이 사회적으로 바람직하지 않은 것으로 인식된 경우가 많기\n때문에 사용 시간을 줄여서 얘기할 가능성이 높다는 것이다.\n\n\n최신 편향(Recency Bias)\n\n사람들은 전체의 경험, 또는 과거의 경험보다 최신/최근 경험에 더 큰 비중을\n두는 경향이 있다. 설문 조사를 진행할 때 흔히 볼 수 있는 현상으로 어떤 질문에\n응답할 때에 많은 응답자들이 최근 경험에 의존하는 경향이 있는데, 그 주된\n이유는 사람들의 기억력에 한계가 있기 때문이다.\n\n이러한 현상은 전체 설문 조사 데이터의 결과에 긍정적 또는 부정적인 영향을\n미치기도 한다. 특히 객관적인 성능이나 결과를 측정하는 것이 아니라 사용자의\n인식을 측정하는 것을 목적으로 한 경우, 설문 조사의 질문은 가장 최근의\n경험을 떠올리게 하는 구체적인 질문으로 묘사하듯 상세한 응답을 이끌어내는\n것이 바람직할 수 있다. 하지만 이러한 편향이 일어난다고 해서 응답 결과가 모두\n의미 없는 것은 아니며, 이렇게 특정한 방식으로 반응하는 편향이 존재한다는\n것을 인지하고 부정적인 영향 을 미치지 않도록 노력하면 더 나은 디자인\n통찰력을 얻는 데 도움이 될 수 있다.\n\n\n\n\n                                      서비스·경험디자인 이론서 197\n\f         [디자인과 행동경제학]\n         잘못된 합의 효과(The False-consensus Effect)144,145\n\n\n더 알아보기\n         144                               잘못된 합의 효과(The False-consensus Effect)는 소위 ‘허위 일치성\n         Ross, Lee; Greene, David;\n         House, Pamela(1977), <The         편향’이라고 불리는 개념으로 자신의 의견이나 판단과 주위 사람들과 같을\n         'false consensus effect':\n         An egocentric bias in social\n                                           것이라고 착각하 는 경향 을 말한다. 이는 인지 편향(경험에 의한 비논리적\n         perception and attribution\n                                           추 론으 로 잘못된 판단을 하 는 것) 중의 하나로, 지나치게 일반화 된 고정\n         processes>, Journal of\n         Experimental Social Psychology,   관념으로 인해 발생하기도 한다.\n         13(3), pp. 279–301\n\n\n         145\n                                           디자이너와 개발자들도 마찬가지로 사용자들이 자신들(디자이너 또는 개발자)과\n         You Are Not the User: The         비슷하게 인터페이스를 사용할 것이라고 착각하는 경우가 많다. 오직 자신과\n         False-Consensus Effect, Raluca\n         Budiu, nngroup, 2021.9월 기준        매우 다른 성향인 사람만이 조금은 특별한, 다른 선택을 할 것이라고 믿는다.\n         (https://www.nngroup.com/\n         articles/false-consensus/)\n                                           이러한 현상은 가까운 동료 또는 친한 친구 사이에서 더 빈번하게 발생하는데\n                                           그 이유는 자신의 생각이나 경험을 공유할 때 가장 먼저 떠오르는 사람들이\n                                           주변의 가족, 친구, 가까운 동료이고, 이들과 일상적으로 가치관을 공유하고\n                                           있는 경우가 많기 때문에 자신의 사고·판단과 동일할 것이라 믿는 경우가 생기는\n                                           것이다.\n\n                                           이러한 잘못된 합의 효 과 는 그룹 의사 결정에서도 흔히 볼 수 있다. 소수\n                                           집단에서 어떤 합의가 이루어진 경우, 일반적인 그룹, 즉 대중이나 시민들도\n                                           동의할 것이라고 생각하 는 것이다. 특히 객관적인 통계나 설문조사에서 그\n                                           데이터 수가 적은 경우, 결과가 잘못되었다고 생각하기도 하고 그 로 인해\n                                           선입견이 생기면 나중에 객관적인 데이터를 얻게 되더라도 그 데이터를 신뢰하지\n                                           않는 경우도 발생하게 된다. 그러므로 디자이너는 특히 리서치에서 디자이너\n                                           스스로가 편견을 예측, 식별 및 극복하는 방법을 습득해야 한다.\n\n\n\n\n         198 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f잘못 된 합의 효 과 는 인간의 본 성에 깊이 새겨져 있는 편향 이다. 따 라서\n디자이너와 개발자는 사용자 평가를 진행할 때, 자신들에게 당연하게 여겨지는\n것들이 실제 사용자에게는 그렇지 않을 수 있다는 점을 염두에 두어야 한다.\n이것이 디자이너가 테스트를 꼭 실시해야 하는 이유이기도 하다. 디자이너와\n개발자가 이렇게 흔하게 발생할 수 있는 문제를 해결하기 위해서는\n\n• 자신들이 어떤 편견을 가지고 있는지 파악하고\n• 잘못된 편견이 있다면 빠르게 인정하고, 가설을 확인하기 위해 실제 사용자를\n 대상으로 테스트를 진행하며,\n• 테스트를 하기 전, 사용자의 반응이나 행동에 대해 미리 추측하는 행동을\n 배제하고,\n• 지속적이고 반복적인 테스트를 통해 얻은 사실적인 증거를 기반으로 디자인\n 결정을 해야한다.\n\n우리는 다른 사람의 생각을 정확하게 알 수 없기 때문에 본래 자신의 경험치와\n상대의 몸짓, 말을 통해 다른 사람의 생각을 추측하고 헤아릴 수밖에 없다.\n그러나 타인의 생각을 파악하기 위한 깊이 있는 연구 또는 객관적인 데이터가\n없는 상황에서 “남도 자신과 같이 생각하고 있는 것이 틀림없다”라고 믿어버리는\n태도는 디자이너와 개발자 모두가 경계해야 하는 부분이다. 중요한 것은 우리가\n이러한 편견을 가지고 있다는 것을 인지하고 최대한 객관적인 데이터를 확인하는\n습관을 길러 잘못된 합의 효과에 빠지지 않도록 노력해야 한다는 것이다. 우리가\n당연하다고 여기는 것이 항상 모두에게 당연한 것은 아니기 때문이다.\n\n\n\n\n                             서비스·경험디자인 이론서 199\n\f         [디자인과 행동경제학]\n         헤일로 효과(Halo Effect)/ 후광 효과146,147,148\n\n\n더 알아보기\n         146                              에드워드 손다이크(Edward Thorndike)가 주장한 후광 효과 또는 헤일로\n         The ‘Halo’ Effect in Digital\n         Product: From UI Design to       효과(Halo Effect)는 자신이 주목한 긍정적(또는 부정적) 특징에 영향을 받아\n         Customer Experience, Glovory\n         Design, 2021.9월 기준 (https://\n                                          다른 부분도 동일하게 긍정적(또는 부정적)으로 판단하게 되는 현상이다. 예를\n         glovorydesign.medium.com/\n                                          들어, 외모가 매우 뛰어난 한 이성을 보았을 때 영리함이나 정직함과 상관관계가\n         the-halo-effect-in-digital-\n         product-from-ui-design-          없더라도 “이 사람은 성격도 좋고, 지적이고 신뢰할 수 있는 사람일 것이야”라고\n         to-customer-experience-\n         ceb1ecaf0c0a)                    생각하는 현상으로 어떤 사람의 아직 보지 못한 부분까지 포괄해 모든 것을\n                                          좋아하는(또는 싫어하는) 편향을 말한다.149 이렇게 사람들이 일반적인 인상을\n         147\n         동아비즈니스리뷰(2009), <후광효             토대로 구체적인 특성을 추론하는 이유는 사람들의 인지적 자원이 한정되어\n         과의 함정에 빠지지 말라> 2021.9\n         월 기준 (https://dbr.donga.         있어 직접 평가하기 어려운 것들을 일종의 어림짐작으로 평가하기 때문이라고\n         com/article/view/1306/article_\n                                          심리학자들은 말한다.\n         no/1382/ac/magazine)\n\n\n         148                              후광 효과는 긍정적, 부정적 측면에 모두 영향을 미치는데, 사용자가 제품이나\n         UC Berkeley Extension, 11\n         Psychology Principles UX         서비스 의 한 측면을 만족하고 좋 아 했다면 다른 나머지 부 분 에 대해 서도\n         Designers Should Understand,\n                                          긍정적인 평가를 하거나 앞으로도 호의적인 태도로 이용할 가능성이 크다.\n         2021.9월 기준 (https://\n         bootcamp.berkeley.edu/blog/\n         psychology-principles-for-ux-    반대로 사용자가 제품이나 서비스에 대해 부정적인 경험을 했다면 앞으로도\n         designers/)\n                                          좋지 않은 경험을 할 것이고 더 이상 사용하지 않게 될 가능성이 크다는 것이다.\n         149\n                                          후자의 경우 나중에 더 나은 디자인으로 재설계되더라도 사용자는 후광 효과로\n         대니얼 카너먼(2018), 《생각에 관한\n         생각》, 김영사, pp. 130-131            인해 이전 경험에서 얻은 부정적인 기대를 계속 이어갈 것이라고 예측할 수 있다.\n\n\n\n\n         200 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f                                   사용자 경험 측면에서의 후광 효과\n\n                                   모바일의 사용자 경험디자인에서 사용자 계정 설정의 복잡한 절차는 나머지\n                                   서비스에 대한 사용자의 기대치를 떨어뜨리는 요소가 될 수 있다. 모바일 기기의\n                                   디자인과 성능이 아무리 좋다고 하더라도, 앱을 사용할 때에 원활한 계정\n                                   설정을 제공하지 못하는 사용자 경험은 사용성 뿐만 아니라 브랜드 이미지에도\n                                   부정적인 영향을 미칠 가능성이 높아, 이러한 경우 제품이나 브랜드에 대한\n                                   긍정적인 첫인상이 마지막까지 유지되기는 어렵다.\n\n150                                때때로 후광 효과는 단순히 시각적 매력에 충실한 디자인에 영향을 미치기도\nLindgaard, G., Fernandes, G.,\nDudek, C., & Brown, J.(2006),      한다. 2002년 린드가드와 두덱(Lindgaard and Dudek)150은 웹 디자인 그룹을\n《Attention web designers you\nhave 50 milliseconds to make a\n                                   대상으로 어떤 디자인이 심미성이 높은지 평가한 후, 시각적 매력 등급이 높은\ngood first impression》, Behavior\n                                   디자인에 대한 사용성 평가를 진행하였다. 그 결과 사용자들은 심미성이 높은\n& Information Technology\n                                   디자인에 대해서는 사용성이 떨어져 목적 달성률이 평균 50% 이하임에도\n                                   불구하고 여전히 높은 만족도를 나타났다. 이 연구를 통해 알 수 있는 것은\n                                   사용성이 제대로 설계되지 않았음에도 매력적인 디자인의 표현과 그 느낌이\n                                   후광 효과로 전체 사용자 경험에 영향을 끼쳤다는 점이다. 하지만, 디자인이\n                                   매력적이라고 해서 사용성이 좋은 것은 아니다.\n\n                                   디자이너가 기억해야 할 부 분 은 보기 좋은 디자인이 뇌에 긍정적 반응 을\n                                   일으키고 인지 능력을 높여 사용성이 더 뛰어나다는 생각이 들게 하기는 하지만,\n                                   실제로 사용성을 향상시키지는 않는다는 것이다. 이는 인지적 자원의 한계로\n                                   사용성을 평가하는 것보다는 심미성을 평가하는 것이 훨씬 간단하고 쉬워,\n                                   나머지 부분도 긍정적으로 평가하게 된 것일 뿐이다. 이러한 점은 디자이너가\n                                   후광 효과를 인지하고 다양한 테스트를 통해 모든 확률을 분석하고 개선해야\n                                   하는 이유이기도 하다.\n\n                                   사용자 경험을 설계하고, 인터페이스를 디자인하고, 핵심 성과 지표(KPI)를\n                                   정의하고, 사용성을 측정하는 이 모든 과정에서 후광 효과를 염두에 두는 것이\n                                   중요하다. 어떠한 단계에서든지 부정적인 경험은 모든 단계의 사용자 경험에\n                                   영향을 미치기 때문이다.\n\n\n\n\n                                                                      서비스·경험디자인 이론서 201\n\f         [디자인과 행동경제학]\n         점화/프라이밍 효과(Priming Effect) 151,152,153,154\n\n\n더 알아보기\n         151                             프라이밍 효과(Priming Effect)는 시간적으로 먼저 제시된 자극이 나중에\n         도모노 노리오(2007), 《행동 경제\n         학: 경제를 움직이는 인간 심리의 모            제시된 자극의 처리에 영향을 주는 현상을 말한다. 사물, 사건, 관념, 개념\n         든 것》, 지형, p. 159 월리엄 리드웰\n         외 2인(2012), 《디자인 불변의 법\n                                         등과 같은 자 극은 그와 연관된 자 극이나 정보 및 다양한 정신적 요소들이\n         칙 125가지》, 고려문화사, pp. 186-\n                                         발현되는 데 일시적 또는 지속적으로 영향을 미친다. 이때 먼저 제시된 자극을\n         187\n                                         프라임(Prime) 자극, 나중에 제시된 자극을 표적(Target) 자극이라 한다. 점화\n         152\n         Priming and User Interfaces,    효과는 암묵 기억(Intrinsic Memory : 과거의 어떤 경험이나 학습 등에 의해\n         Raluca Budiu, nngroup, 2021.9\n                                         뇌에 저장되어 있다가 무의식적으로 나타나는 기억)에 저장되어 있던 심리적\n         월 기준 (https://www.nngroup.\n         com/articles/priming/))         요소들이 연관 자극에 의해 촉발되어 무의식적으로 작동하는 것이다.\n\n         153\n         Using the Priming Effect to\n                                         디자인에서의 활용\n         Improve UX, David Teodorescu,\n         medium.com, 2021.9월 기           1) 리서치 수행 시 프라이밍 패턴(Priming Pattern)을 찾는다.\n         준 (https://medium.com/@\n         davidteodorescu/using-the-\n                                         리서치 수행 시 경쟁사 벤치마킹은 태스크의 흐름에서 사용자에게 영향을 주어\n         priming-effect-to-improve-ux-   행동을 특별하게 만든 자극을 찾는 데 효율적인 방법 중의 하나이다. 태스크\n         30095c028d45)\n                                         흐름의 패턴을 파악하고 숨겨진 아이디어를 발견하여 이해하는 데 도움을 주기\n         154\n         월리엄 리드웰 외 2인(2012),\n                                         때문이다.\n         《디자인 불변의 법칙 125가지》,\n         고려문화사, pp. 186-187              디자이너는 리서치 수행 시에 스스로가 프라이밍 효과에 영향을 받는다는 사실조차\n                                         깨닫지 못했을 가능성이 있으므로 이점을 인지하여 활용하고 디자인에 영향을 준\n                                         초기 자극과 그 영향으로 내린 결정을 구분하고 기억할 수 있어야 한다. 현재 잘\n                                         운영되고 있는 디자인을 개선하기 위해 사용성 휴리스틱 분석이나 전문가 리뷰\n                                         등을 수행할 경우에도 프라이밍 패턴을 찾는 노력을 꾸준히 해야 한다.\n\n                                         2) 태스크 플로우는 프라임(Primes, 자극들)을 긍정적인 결과로 이끌어 낼 수\n                                         있는 시작 단계이다.\n                                         태스크 플로우는 단일한 플로우를 통해 사용자들이 보이는 유사한 특정 행동의\n                                         흐름을 파악하는 것으로, 주로 시작 단계의 태스크를 성공시키기 위해 사용자의\n                                         활동을 최적화하는 것이 목적이다. 프라이밍 효과는 \"기억의 무의식적 형태\"이기\n                                         때문에 사용자는 경험에 의한 기억과 관심에 직접적으로 영향을 받으므로,\n                                         태스크 플로우 시각화 작업 시 프라이밍 효과를 통합할 수 있는 위치나 상황을\n                                         파악하여 설계하고 이를 통해 긍정적인 결과를 도출할 수 있도록 한다. 아직은\n                                         간단 하게 흐름 을 볼 수 있는 시각화의 초기 단계이고 다른 요구사항들이\n                                         더 중요할 수 있기 때문에 실제로 완성된 프라이밍 효과에 대한 구체적인\n                                         인터랙션은 필요하지 않다. 그러나 어떻게 구현할 수 있는지에 대한 아이디어가\n                                         있으면 나중에 통합하기 위해 기록해 두는 것이 도움이 된다.\n\n\n         202 Part 3. 서비스·경험디자인을 어떻게 실행하는가?\n\f3) 페르소나는 프라임(Primes, 자극들)을 사용할 때 고려해야 하는 요소이다.\n많은 사람들은 제각기 다양한 유형의 자극에 반응한다. 사람들은 취미, 관심사,\n경험, 지식의 깊이가 제각기 다르고, 지역, 문화, 성별, 세대에 따라 그 반응도\n다르게 나타나는 경향이 있다. 이러한 이유로 사용자를 정확히 파악하고 그에\n따른 특징과 행동에 맞게 프라임을 활용해야 한다.\n\n4) 정보 아키텍처(Information Architecture) 설계 단계에도 프라임(Primes,\n자극들)을 기획할 수 있다.\n정보 아키텍처는 사용자 요구사항 수집, 이해관계자와의 소통을 통해 전체적인\n맥락을 이해하고, 실제 사용자와 함께 우선순위가 높은 카테고리가 어떤 것인지\n카드소팅과 아이템 탐색 등과 같은 작업을 수행한다. 그런 다음 이 요소들이 어떤\n단계에서 특정 프라임의 영향을 받아 행동을 하는지에 대해 생각해 보아야 한다.\n사용자와 상호작용하는 패턴을 찾는 것은 주로 사용하는 용어나 시각적 요소 간에\n형성되는 사람들의 정신적 연결을 이해하는 좋은 시작점이라고 할 수 있다.\n\n5) 프로토타입핑(Prototyping) 단계에서 프라이밍을 다듬고 개선해야 한다.\n프 로 토타 이핑 단계에 서는 프라 이밍을 디자 인에 어떻게 적용할지에 대한\n아이디어가 있어야 한다. 프로토타입 전체에 프라임을 적용한다 하더라도 모든\n구성 요소를 나열하여 사용자 인터페이스 디자이너가 중요성을 이해할 수 있도록\n해야 한다. 또한 프라임을 사용한 근거, 각 구성 요소가 어떻게 디자인되어야 하고,\n작동해야 하는지, 그리고 이렇게 디자인함으로써 사용자 행동에 어떤 영향을\n미치는지, 이에 따른 발생 효과, 이유 등을 설명할 수 있어야 한다.\n\n\n          점화/프라이밍 효과                           디자인에 적용할 수 있는 요소들\n\n\n         감각적 인지 점화                        버튼(Buttons), 링크(Links), 색상(Colors),\n       (Perceptual primes)             모양(shapes), 패턴(patterns), 배경(Backgrounds),\n   시각과 시각 자극으로 나타나는 효과                        로고(Logos), 스케치(Sketches)\n\n\n                                            알림(Notifications), 제목(Titles),\n         개념적인 점화\n                                     제안(Suggestions), 아이콘(Icons), 이미지(Images),\n      (Conceptual primes)\n                                     미리보기( Thumbnails), 표 시자 (Placeholders),\n  의미적인 부분을 기초로 나타나는 효과\n                                                  도구설명(Tooltips)\n\n\n[ 프라이밍 디자인에 적용가능한 요소 ]\n*출처 : David Teodorescu, Using the Priming Effect to Improve UX.\n\n\n이러 한 프 라 이밍 효 과 를 디 자 인 프 로 세 스 의 초 기 단 계 부 터 고 려 하 여\n디자인한다면 사용자의 의사 결정에 잠재적으로 영향을 미치는 요소로 작용할\n수 있다. 사용자 의사 결정의 흐름에서 가능한 최상의 선택을 하도록 돕고,\n실패를 최소화하여 빠른 결정을 내리는 데 도움이 되는 요소로 작용할 수 있는\n것이다.\n\n\n\n                                                         서비스·경험디자인 이론서 203\n\f         다크패턴 디자인 (Dark Pattern Design)\n\n\n\n더 알아보기\n         155                                 다크패턴(Dark Pattern) 디자인은 사용자의 의사결정을 왜곡하거나 비합리적인\n         국은숙. (2021). 다크 패턴(눈속임\n         설계) 실태조사. 한국소비자원                    행동 을 유도하도록 설계된 디자인을 말 한다. 주로 사 용자의 상품 구매를\n         https://www.kca.go.kr/\n         smartconsumer/sub.do?menuke\n
