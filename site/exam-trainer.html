) (https://designfirm.kidp.or.kr/)\n\n• 한국디자인진흥원-우수디자인(GD) (https://award.kidp.or.kr/)\n\n\n\n\n                                                                                       서비스·경험디자인 이론서 389\n\f집필 총괄\n\n\n\n            최 민 영 교수\n            성신여자대학교 서비스·디자인공학과\n            한국서비스디자인학회 회장과 한국HCI학회 부회장으로서 디자인과 기술을 융합하여 인간\n            중심 서비스 개발과 사용자 경험디자인의 전문가로서 활동하고 있다. 행정안전부 <디지털정부\n            서비스혁신 TFT> 분과장으로서 공공부문의 발전에 기여하고 있으며, 현대자동차, 삼성전자,\n            LG전자 등과 미래 서비스와 비즈니스 디자인에 대한 다수의 프로젝트를 수행하였다. 저서로는\n            <디자인비즈니스기획>, <기초조형 프로덕션> 등이 있으며, <신기술분야 융합디자인 전문인력양성>\n            사업단장으로서 AI기술과 서비스디자인의 융합 인재 교육에 힘쓰고 있다.\n\n\n\n\n저자 소개\n\n\n\n            강 명 지 교수\n            경일대학교 디지털미디어디자인학과\n            카이스트 산업디자인학과에서 석사학위를 취득한 후 13년간 삼성전자의 무선사업부, 디자인경영센터,\n            디자인연구소, 가전사업부의 책임디자이너로 재직하며 휴대폰과 가전제품 등 삼성그룹 내 다양한\n            제품 및 서비스의 디자인전략, 사용자리서치, 사용성평가, 트렌드예측, 선행/상품화 UX디자인\n            프로젝트들을 총괄 수행했다. 한국디자인진흥원이 발간한 “서비스•경험디자인기사 핵심키워드\n            핸드북”을 공저하였으며, 우수디자인(GD)상품선정과 대한민국디자인전람회의 심사위원,\n            대구광역시 도시계획위원회위원, 대구광역시와 하남시 공공디자인진흥위원, 한국서비스디자인학회와\n            한국상품문화디자인학회의 이사로 활동 중이다.\n\n\n\n\n            구 유 리 교수\n            홍익대학교 산업미술대학원 서비스디자인전공\n            영국 랑카스터(Lancaster) 대학에서 글로벌 IT기업들의 공유가치 창출을 위한 신제품 및\n            서비스 개발에 대한 연구로 박사학위를 받았다. 삼성에버랜드에서 테마존 디자인콘텐츠 기획을\n            담당하였으며, 삼성전자 Eco UX Design 전략 및 LG브랜딩전략개발 등에 참여하였다. 사회\n            문제해결디자인 및 공공디자인평가 관련 다수의 프로젝트들을 수행하였다. 현재 수요자 중심\n            서비스 경험혁신과 코크리에이션, 제품-서비스-시스템 플랫폼 디자인, 사회혁신디자인 등을\n            가르치고 있으며, 의료경험혁신 연구 등을 진행하고 있다. 국제디자인리서치협회 IASDR 프로그램\n            조직위원, 행정안전부 공공서비스디자인 자문위원, 서울시 공공디자인진흥위원 등으로 활동하고\n            있다.\n\n\n\n\n390 저자 소개\n\f김 선 아 교수\n금오공과대학교 산업공학부 디자인공학전공\n한국서비스디자인협의회 대구·경북 지회 설립을 시작으로 서비스디자인 사회적협동조합 설립\n등 지역의 서비스디자인 발전을 위해 활동하고 있다. 국민디자인단 지자체 활동에 기여한 공로로\n근정포장을 수상하였다. 금오공대에서는 디자인 기획과 전략, UX/서비스디자인, CMF 디자인 등\n디자인 리서치와 사용자 경험을 위한 디자인을 가르치고 연구하고 있다. 저서로는 서비스디자인\n노트 외 다수가 있으며, 디자인과 공학, 사회과학 간의 균형적인 접근과 디자인의 사회적 가치에\n대해 관심이 많다.\n\n\n\n\n김 원 섭 교수\n서울과학기술대학교 디자인학과 산업디자인 전공\n자동차디자인 실무 경력과 다년간 로봇 디자인 연구 및 개발을 수행하였다. 현재 대학에서\n인터랙션디자인 및 프로토타이핑 개발, 로봇 디자인 등을 가르치고 있으며 유니버설디자인,\n서비스디자인, 업사이클디자인 분야의 교육 및 과제에 관여하고 있다. 저서로는 키네틱플레이 외\n공학 비전공자를 위한 공학 기초 입문을 다룬 이론서와 실습서가 다수 있으며, 실습을 위한 키트를\n지속적으로 개발하고 있다.\n\n\n\n\n김 현 석 교수\n성신여자대학교 서비스디자인공학과\n기계공학과 산업디자인을 전공하고 초기 웹에이전시에서 커리어를 시작했다. 두 개의 뉴미디어\n중심 디자인 회사를 창업하여 CEO이자 크리에이티브 디렉터로 활동하였고 겸임교수를 거쳐\n현재 성신여자대학교 서비스디자인공학과에 조교수로 재직 중이다. 인텔리전스서비스디자인,\nVR컨텐츠디자인, 서비스 플랫폼디자인, 3D모델링과시뮬레이션(3D프린팅) 등을 가르치고 있으며\n삼성, LG, 현대자동차, SKT 등과 로봇, AI, AR/VR, 모바일/웨어러블, IoT/스마트홈, 플렉시블/투명\n디스플레이 등 차세대 미래 기술을 기반으로 한 다수의 UI/UX, 미래비젼 프로젝트를 진행하였다.\n\n\n\n\n                                             서비스·경험디자인 이론서 391\n\f저자 소개\n\n\n\n            박 남 춘 교수\n            서울여자대학교 산업디자인학과\n            서울여자대학교 산업디자인학과에서 UX디자인과 서비스디자인 관련 연구를 하고 있으며,\n            UX디자인랩을 운영하고 있다. 삼성전자 네트워크디자인그룹에서 책임디자이너로 UX디자인을\n            담당하였으며, 코넬대학교 교환교수, 한국서비스디자인학회 부회장과 한국디자인학회 상임이사\n            등의 활동과 함께 다양한 기업과의 산학프로젝트를 진행하고 있다. 현재 서울여자대학교\n            미래산업융합대학 학장과 사회적가치 실현을 위한 사회혁신 교육기관인 서울여자대학교 SI(Social\n            Innovation)교육센터 센터장을 맡고 있다.\n\n\n\n\n            송 소 희 매니저\n            GS리테일\n            영국 Lancaster University에서 디자인경영과 정책(Management & Policy)석사학위 취득 후,\n            런던에서 앱 개발 및 데이터분석을 통한 잠재고객 활성화 플랫폼 개발에 디자인 책임자로 일했다.\n            Wizwid(SK DtoD), KT Commerce 에서 디자인 책임자로 활동하였고, 그외 다수의 SMEs에서\n            IT플랫폼 전략, 커머스 서비스디자인 기획, UX/UI, 미래 비젼 프로젝트 등을 수행하면서 다양한\n            경험을 쌓았다. 한국디자인진흥원(KIDP)에서 자문위원으로서 중소기업의 디자인 관련 애로사항과\n            문제점을 종합적으로 진단하고 해결책을 제시해주는 컨설턴트 역할을 거쳐, 현재 GS Retail에 재직\n            중이며 한국서비스디자인학회 이사로 역임 중이다.\n\n\n\n\n            연 명 흠 교수\n            국민대학교 공업디자인학과\n            서울대학교 산업디자인과를 졸업한 후, 대우전자 디자인연구센터에 재직했으며, 일본\n            쓰쿠바대학에서 석사와 박사학위를 받았다. 현재 대학에서 사용자경험디자인, 인터랙션디자인\n            관련 교육을 담당하고 있으며, (사)한국디자인학회 부회장 및 ADR논문편집위원,\n            디자인트렌드학회 논문편집위원 등을 맡고 있다. <기초 디자인 교과서>,\n            <디지털 시대의 메이커 교육>, <디자인의 이해>를 공동 저술하였다.\n\n\n\n\n392 저자 소개\n\f유       은 교수\n서울과학기술대학교 디자인학과\n홍익대학교 시각디자인 전공으로 학사, 석사를 마치고 ㈜안그라픽스와 ㈜엔씨소프트에서\nUX디자이너로 일하였다. 영국 랑카스터 대학교에서 서비스디자인으로 박사학위를 받은 후\n서울과학기술대학교 디자인학과 교수로 UX/서비스디자인 교육을 담당하고 있으며, 동시에\n국제 서비스디자인 커뮤니티에서 활발한 연구 및 학술활동을 하고 있다. Journal of Service\nResearch, Design Studies, Design Issues, Design Journal 등 서비스와 디자인 분야의 상위\n국제학술지에 논문을 출판하였다.\n\n\n\n\n이 여 름 교수\n성신여자대학교 서비스·디자인공학과\n대한민국 차세대 디자인 리더로 선정되었으며 다양한 디자인 경험을 쌓았다. 이후 네덜란드의\nTU Delft 산업디자인공학과 대학원에서 인터랙션 디자인 트랙 석사 프로그램을 이수하고,\n헬스 관련 HCI를 주로 연구하여 카이스트에서 산업디자인 박사 학위를 받았다. 실무에서\n서비스 디자인 전략 및 리서치 경력을 쌓아 실제 서비스 및 제품을 양산한 경험을 바탕으로 현재\n성신여자대학교에서 AI 기반 서비스 디자인 관련 교과목 등을 가르치고 있다.\n\n\n\n\n윤 재 영 교수\n홍익대학교 시각디자인과, 영상·커뮤니케이션대학원 인터랙션디자인 전공\n로드아일랜드 디자인스쿨(RISD)에서 시각디자인 학사를, 카네기멜론대학교(Carnegie\nMellon University)에서 Human Computer Interaction(HCI) 석사와 Computational\nDesign 박사학위를 받았다. 이후 실리콘밸리에서 UX 디자인리서처로 근무했다. 주 연구분야는\n사용자 경험(UX), 인터랙션 디자인(HCI), 행동 변화를 위한 디자인 등이며, 한국디자인학회,\n디자인융복합학회, 한국HCI학회에서 활동 중이다. 저서로는 『디자인 트랩』과\n『디자인 딜레마』가 있다.\n\n\n\n\n                                                     서비스·경험디자인 이론서 393\n\f            이 연 준 교수\n            홍익대학교 시각디자인과, 산업미술대학원 서비스디자인학과\n            현재 홍익대학교 시각디자인학과 조교수로 재직중이며, 시각디자인학과와 산업미술대학원\n            서비스 디자인학과에서 서비스디자인과 브랜딩디자인을 가르치고 있다. 프랫 인스티튜트에서\n            커뮤니케이션디자인 MSc를 졸업하고 랑카스터 대학(영국)에서 디자인학 박사학위를 받았다.\n            브랜드 아이덴티티 개발, 서비스 디자인과 디자이너다운 접근방식에 대한 폭넓은 경험을 가지고\n            있으며, 주된 연구 관심사는 디자인이 어떻게 전통적 경계를 넘어 자신의 역할을 향상시키고 점점\n            더 복잡한 학문적 상황에 어떻게 대처할 수 있는지를 연구하는 데 있다. 현재 한국디자인학회,\n            조형디자인학회 편집위원, 서비스 디자인학회 부회장으로 활동 중이다.\n\n\n\n\n            이 정 연 교수\n            서울미디어대학원대학교 미디어비즈니스과\n            뉴미디어융합교육 대학원인 서울미디어대학원대학교(SMIT)에서 미디어비즈니스과에서\n            디자인사고, 서비스디자인, 사회적디자인등의 수업을 진행하고 있다. 서강대학교에서 미디어공학\n            석사학위를 홍익대학교에서 영상학 박사학위를 받았다. ㈜LG전자 디자인경영센터 디지털 미디어\n            프로젝트 리더, KISD(Koln International School of Design) 방문 교수등을 지냈다. 웹을 포함한\n            디지털 기기의 UI/UX, 다문화가정, 풍물 시장, 관세청, 통계청등의 다양한 서비스디자인과제를\n            수행하였고 현재는 자치인재개발원 서비스디자인 관련 교육를 운영하였으며 서울디자인\n            서비스디자인 컨설턴트, 행안부 국민디자인단 자문위원, 관광스타트업 컨설턴트, 사회적 기업\n            컨설턴트, 한국서비스디자인학회 이사 등을 역임하고 있다.\n\n\n\n\n            이 현 정 교수\n            동아대학교 산업디자인학과\n            ㈜팀인터페이스와 ㈜삼성전자 디자인센터를 거쳐 현재 부산 동아대학교 조교수로 재직중이다.\n            SKT, iMBC, HP 등의 기업과 사용성평가 및 UX컨설팅을 진행했으며, 삼성 MP3 Player, AV기기\n            등의 디자인전략,기획 프로젝트와 삼성디자인아이덴티티 수립 프로젝트 등을 수행했다. 현재는\n            디자인창업, 서비스디자인, UX디자인에 대한 교과목 등을 가르치고 있다.\n\n\n\n\n394 저자 소개\n\f정 재 희 교수\n홍익대학교 산업미술대학원 서비스디자인 전공\n독일 부퍼탈 대학교(BergischeUniversitat Wuppertal)에서 커뮤니케이션 디자인 박사 학위를\n받았다. 현재 홍익대학교 산업미술대학원 서비스디자인 전공 교수로 재직 중이다. LG 전자에서\n스마트폰, 스마트 TV, 스마트 홈의 제품과 서비스를 기획했고, GS 홈쇼핑에서 신규 사업 기획과 마케팅\n업무를 담당했다. 아이데오(IDEO), 프로그디자인(frog design), 스마트디자인(Smart Design),\n메소드(Method) 등 글로벌 디자인 에이전시와 함께 다양한 프로젝트를 진행했다. LG전자, LG생활건강,\n현대자동차, KT 등 다수의 기업과도 혁신 제품과 서비스 기획 프로젝트를 수행했다. 인천 국제공항,\n서울디자인재단, 국민디자인단의 디자인 자문위원, 한국서비스디자인학회, 한국공간디자인학회,\n한국산업디자이너협회의 이사로 활동 중이다. 저서로는 <디자인 싱킹>이 있다.\n\n\n\n\n정 지 연 교수\n경희대학교 시각디자인학과\n영국 랭커스터 대학(Lancaster University)에서 디자인학 박사 학위를 받았다. 같은 대학의 디자인\n연구소인 이매지네이션 랩(ImaginationLancaster)에서 선임연구원으로 재직하며 서비스디자인,\n디자인 전략, 지속가능디자인 등 다양한 주제의 영국 정부 지원 프로젝트를 수행하였다. 그 전에는\n이화여자대학교에서 시각디자인 전공으로 학사 학위를 디자인경영 전공으로 석사 학위를 받았다.\n실무에서 브랜드 전략 및 실행, 통합 마케팅 커뮤니케이션, 서비스 마케팅 분야에서 활동한 경험을\n가지고 있으며, 현재 디자인 경영, 디자인적 사고, 디자인 마케팅 등의 강의를 하고 있다.\n\n\n\n\n조 유 정 교수\n화성의과학대학교 서비스디자인학과\n로레알코리아와 리치몬트 코리아를 거쳐 미미박스(현: MBX)에서 비즈니스 전반을 담당하며,\n신규 브랜드 런칭, 고객 분석, 고객 경험 혁신 등 다양한 프로젝트를 수행하였다.\n이후 영국에서 다수의 서비스디자인 잼, 페스티벌, 컨퍼런스 등에 참여하며 최신 동향을 직접\n체감하고, University of the Arts London(UAL)에서 Service Design and Innovation 석사\n학위를 취득하였다. 졸업 후에는 서비스디자인 전문 컨설팅 기업인 livework에서 실무 경험을\n쌓으며 다양한 글로벌 프로젝트들을 수행하였다. 현재는 화성의과학대학교 서비스디자인학과에서\n학생들을 가르치고 있으며 동시에 서울과학기술대학교에서 박사과정을 통해 서비스디자인과\n시스템적 사고를 기반으로 한 연구를 진행중이다.\n\n\n\n\n                                                       서비스·경험디자인 이론서 395\n\f서비스·경험디자인 이론서\n\n초판 발행   2022년 3월 2일\n\n개정 발행   2025년 5월 23일\n\n주무부처    산업통상부(엔지니어링디자인과)\n\n발행처     한국디자인진흥원\n\n저자      기획\u001a검토    서비스디자인실\n\n        집필 총괄    최민영\n\n        집필       강명지, 구유리, 김선아, 김원섭, 김현석, 박남춘,\n                 송소희, 연명흠, 유 은, 윤재영, 이여름, 이연준,\n                 이정연, 이현정, 정재희, 정지연, 조유정, 최민영\n\n        감수       박남춘, 이연준\n\n\n윤문      김혜진, 이효정, 진가연\n\n편집디자인   LAY.D STUDIO(김승헌, 천병민, 유송희, 이은지, 김광민), 우다해, 유하늬, 이도연\n\n\n\n\n                       ⓒ 한국디자인진흥원\n                       이 책의 저작권 및 판권은 한국디자인진흥원에 있습니다.\n\f서비스·경험디자인 이론서\n\n\n\n\nⓒ 한국디자인진흥원\n이 책의 저작권 및 판권은 한국디자인진흥원에 있습니다.\n\f";
  var origFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('service-exam-guide.txt') !== -1) {
      return Promise.resolve(new Response(GUIDE_TEXT, { status: 200, headers: { 'Content-Type': 'text/plain; charset=utf-8' } }));
    }
    return origFetch(input, init);
  };
})();

andom()*a.length)](hu()),id:`${b()}-extra`};r.push(Qs(c))}return En(r).slice(0,e).map(s=>({...s,id:s.id.includes("-")?s.id:b()}))},gu=(e=Ie.length,t="hard")=>t==="memory"?Xm(e):Gm(e,t),Zl=e=>e.toLowerCase().replaceAll(/\s+/g,"").replaceAll(" ",""),Jl=(e,t)=>{const n=Zl(t);if(e.type==="mcq"){const s=n===Zl(e.correctChoice??"");return{status:s?"correct":"wrong",score:s?3:0,max:3,matched:s?e.mustInclude:[],feedback:s?"핵심 항목을 정확히 선택했습니다.":"해당 출제기준의 대표 키워드와 산출물을 다시 확인하세요."}}const i=e.mustInclude.filter(s=>n.includes(Zl(s))),r=i.length,l=e.mustInclude.length;return r===l?{status:"correct",score:r,max:l,matched:i,feedback:"핵심 항목을 빠짐없이 정리했습니다."}:r>=Math.max(1,Math.floor(l*.6))?{status:"partial",score:r,max:l,matched:i,feedback:"핵심이 일부 들어있습니다. 키워드가 더 빠져 있습니다."}:{status:"wrong",score:r,max:l,matched:i,feedback:"요지 정리가 부족합니다. 문제의 핵심 항목을 더 넣어 보완하세요."}},Zt=e=>Ie.find(t=>t.id===e),pr=[{id:1,ko:"가설",en:"Hypothesis",initial:"ㄱ",definition:"서비스 및 경험디자인(experience design) 개발 과정의 불확실성을 해소하고 문제와 해결책의 유효성을 확인하기 위해 논리적 검증이 가능하도록 구체화한 잠정적 추측이자 가정.",description:"아직 검증되지 않은 잠정적 주장으로, 관찰이나 경험(experience)을 토대로 수립되며 이후 검증 과정을 통해 채택되거나 기각된다. 통계적 관점에서는 효과가 없음을 전제하는 귀무가설과 연구자가 입증하려는 대립가설로 구분된다. 디자인 및 비즈니스 실무에서는 이러한 형식적 구분보다 가설(hypothesis)의 구성 요소에 주목하는데 일반적으로 표적 사용자, 제공할 가치나 기능, 기대되는 결과의 세 요소를 포함하는 형태로 가설을 구체화한다. 이를 통해 실현 가능성과 사업적 지속성을 사전에 명확히 정의하고 검증의 방향을 설정한다.",same:[],similar:["가정","명제"],related:["가설 검증","최소 기능 제품(MVP)"]},{id:2,ko:"가설 검증",en:"Validation of hypothesis, Hypothesis test",initial:"ㄱ",definition:"입증하고자 하는 잠정적 추측이나 아이디어의 타당성을 확인하기 위해 실제 수집한 데이터와 기대했던 결과의 차이를 분석하고 평가하여 객관적인 결론을 도출하는 체계적인 과정.",description:"수립된 가설(hypothesis)이 실제로 유효한지 확인하는 절차이다. 검증은 단순한 사실 확인이 아니라, 수집된 근거를 바탕으로 가설을 채택, 수정, 폐기하는 합리적 의사결정 과정 전체를 포함한다. 디자인 맥락(context)에서는 프로토타입 시연, 사용성 평가(usability evaluation), A/B 테스트, 현장 관찰 등의 방법을 통해 실제 사용 환경에서 기대한 효과가 나타나는지를 측정한다. 검증 결과는 가설 자체의 수정뿐 아니라 서비스의 방향 전환(피벗) 또는 개발 지속 여부 결정의 근거로 활용되므로, 검증의 기준과 측정 지표를 사전에 명확히 설정하는 것이 중요하다.",same:[],similar:["가설 유효성 확인"],related:["사용성 테스트","타당성 조사","실증 조사","지표","성과지표","유의수준"]},{id:3,ko:"가시선",en:"Line of visibility",initial:"ㄱ",definition:"서비스 청사진(service blueprint) 상에서 고객 경험이 직접 발생하는 전방 영역(front stage)과 이를 지원하지만, 이용자에게는 노출되지 않는 후방 영역(back stage)을 개념적으로 구분하는 가상의 경계.",description:"이 선을 기점으로 위쪽은 이용자가 직접 인지하고 접점(touchpoint) 직원과 상호작용을 하는 노출된 공간에 해당하며, 아래쪽은 내부 운영 시스템이나 지원 프로세스 등 서비스 제공을 위해 이면에서 이루어지는 활동 공간을 의미한다. 서비스디자인(service design) 관점에서는 이 경계를 명확히 파악함으로써 고객의 서비스 경험을 원활하게 설계하는 동시에, 내부 자원의 배치와 운영 구조를 개선하는 데 활용한다.",same:["무대 분리선"],similar:[],related:["전방 영역","후방 영역","서비스 청사진"]},{id:4,ko:"가치 기반 수용 모델",en:"Value-based adoption model",initial:"ㄱ",definition:"기존 기술 수용 모델의 한계를 보완하여 사용자가 체감하는 긍정적 혜택과 부정적 희생 요소를 비교하고 평가한 결과를 바탕으로 새로운 제품, 서비스에 대한 수용 의도를 설명하는 이론적 틀.",description:"기존의 기술 수용 모델이 주로 시스템의 업무 효율성이나 기능적 유용성에 치우쳤던 단점을 극복하기 위해 제안되었다. 새로운 기술이나 서비스를 받아들이는 과정을 이익과 비용의 교환이라는 다층적 관점에서 접근하며, 실용성, 즐거움 같은 긍정적 혜택 요소와 금전적 지출, 인지적 노력, 기술적 복잡성 등 부정적 희생 요소를 함께 분석하는 것이 특징이다.",same:["VAM","가치 중심 수용 모델"],similar:["기술 수용 모델(TAM)","통합 기술 수용이론(UTAUT)"],related:["지각된 가치","지각된 혜택","지각된 희생","수용 의도"]},{id:5,ko:"가치평가",en:"Value assessment",initial:"ㄱ",definition:"서비스가 이용자, 조직, 이해관계자(stakeholder)에게 미치는 유무형의 효용을 다각적 기준에서 체계적으로 측정하는 활동.",description:"이용자 관점의 경험적 혜택과 조직 관점의 서비스 성과를 균형 있게 다루기 위해 정성적, 정량적 지표를 통합적으로 분석하여 서비스의 가치를 파악한다. 기능적, 감정적, 사회적 효용을 포함한 이용자 측면의 가치와 품질, 만족도, 시스템 성능 등 조직 측면의 목표가 긴밀하게 정렬되는 것을 초점을 둔다. 이를 위해 이용자 여정을 기반으로 경험(experience)의 흐름을 추적하여 기대 수준과 실제 제공되는 효용 간 불일치 지점을 찾아내고 이해관계자(stakeholder) 간의 상충하는 요구를 조율하며, 평가 기준과 측정 지표를 수립한다.",same:[],similar:["가치 측정","비용 대비 편익 분석"],related:["밸류에이션","사회적 가치평가","투자수익률(ROI)","고객 가치 제안"]},{id:6,ko:"감성 디자인",en:`Design for emotion,
Emotional design`,initial:"ㄱ",definition:"인간의 감정적 반응을 이해하고 그 통찰을 제품 및 서비스와의 상호작용 과정에 반영하여 사용자에게 긍정적인 경험과 즐거움을 제공하는 접근 방식.",description:"인간의 인지(cognition)와 정서 구조를 파악하여 기획 및 개발 과정에 반영하고 유의미한 경험(experience)을 제공한다. 사용자의 반응을 시각적 매력에 반응하는 본능적 단계, 기능 수행과 관련된 행동적 단계와 의미와 기억을 형성하는 반성적 단계로 구분하여 접근한다. 기능적 편리함을 넘어 잠재적 및 무의식적 요구까지 충족하여 대상에 대한 애착을 형성하며, 기술 평준화로 기능적 차별화가 어려워진 시장 환경에서 새로운 경쟁력을 확보하는 수단이 되고 긍정적 정서를 바탕으로 사용자와 지속 가능한 관계를 구축한다.",same:["정서적 디자인","이모셔널 디자인"],similar:["공감 디자인","칸세이 디자인"],related:["도널드 노먼의 3단계 모델","사용자 애착","긍정 정서"]},{id:7,ko:"감성적 어포던스",en:"Emotional affordance",initial:"ㄱ",definition:"사용자의 흥미와 신뢰 등 정서적 반응을 이끌어내어 대상과의 연결과 몰입(flow)을 촉진하는 특성",description:"하트슨과 필라(Hartson & Pyla)가 확장한 어포던스(affordance) 유형 중 하나로, 정해진 기능 수행을 넘어 사용자가 대상에 몰입하고 심리적 애착을 형성하도록 돕는다. 시각적 매력이나 감각적 즐거움을 통해 자발적 참여를 촉진하고 긍정적 경험(experience)을 형성한다.",same:["감성적 행동 유도성"],similar:["심미적 어포던스","감성 디자인","감성적 몰입 요소"],related:["감성 디자인","매력성","유대감","본능적 디자인","마이크로 인터랙션","UX 라이팅","피크 엔드 법칙"]},{id:8,ko:"거시적 관점",en:"Macro perspective",initial:"ㄱ",definition:"개별 사용자나 단편적인 상호작용을 넘어 제품과 서비스가 속한 산업 생태계, 사회·문화적 배경, 경제 구조 등 광범위한 환경을 분석 단위로 삼아 현상의 원인과 영향을 파악하는 접근 방식.",description:"개인의 심리나 행동 단위에 집중하는 미시적 접근과 대조적으로 사회 구조, 조직, 역사적 맥락 등 광범위한 거시적 틀을 분석 단위로 삼는다. 서비스디자인(service design) 영역에서는 생태계 전체를 조망하는 분석 틀로 활용되며, 단일 접점(touchpoint)의 개선을 넘어 시스템 차원의 변화를 지향하고 장기적인 발전 방향을 설정하는 데 적용된다.",same:[],similar:["전체론적 관점","생태계적 관점","환경적 관점","전략적 관점","시스템적 관점","구조적 관점"],related:["서비스 생태계","PEST 분석","STEEP 분석"]},{id:9,ko:"게슈탈트 이론",en:"Gestalt theory",initial:"ㄱ",definition:"대상을 인지(cognition)할 때 개별 부분의 단순한 합이 아닌 조직화된 전체 구조로 파악하려는 인간의 지각 경향성을 바탕으로 한 심리학 이론.",description:"여러 시각적 요소를 볼 때 근접성, 유사성, 연속성 등의 여러 지각 원리에 따라 요소를 그룹화하여 하나의 형태로 인식하는 특성에 주목한다. 서비스·경험디자인(experience design) 분야에서는 이용자의 지각 특성을 반영한 구조화된 화면과 환경을 설계하는 기준으로 활용된다.",same:["형태 심리학","게슈탈트 법칙"],similar:["시지각 조직화","시각적 위계"],related:["근접성의 원리","유사성의 원리","연속성의 원리","폐쇄성의 원리","공동 운명의 법칙","도형과 배경의 원리","인지 부하"]},{id:10,ko:"게이미피케이션",en:"Gamification",initial:"ㄱ",definition:"비게임 분야의 문제 해결이나 사용자 참여 촉진을 위해 게임적 사고방식과 기법을 서비스나 사회적 맥락에 적용하는 전략적 접근 방식.",description:"서비스의 본질적인 가치에 놀이적 요소를 결합하여 포인트, 배지, 순위표 같은 외적 보상 기제를 활용하는 동시에 사용자의 내적 동기를 함께 자극한다. 교육, 금융, 헬스케어 등 다양한 산업군에서 지루하거나 반복적인 과업을 즐거운 경험(experience)으로 전환하여 사용자의 지속적인 참여를 이끌어내는 서비스 전략으로 활용되며, 보상과 성취감을 매개로 사용자 행동 변화를 지원한다.",same:["게임화"],similar:["기능성 게임","에듀테인먼트"],related:["동기 부여","몰입","행동경제학","피드백 루프","보상체계","넛지"]},{id:11,ko:"게이미피케이션 디자인",en:"Gamification design",initial:"ㄱ",definition:"게이미피케이션(gamification)을 구현하기 위해 메커닉스, 다이내믹스, 에스테틱스 등 게임 구성 요소를 체계적으로 디자인하고 시스템화하는 디자인 접근 방식.",description:"사용자를 플레이어로 상정하고 목표 달성을 위한 규칙, 피드백 루프, 난이도 조절 등의 시스템 구조를 디자인한다. 포인트, 배지, 순위표 같은 시각적 보상 체계뿐만 아니라 도전 과제와 스토리텔링(storytelling)을 통해 사용자의 심리적 몰입(flow) 흐름을 설계하며 기획 의도가 실제 사용자의 경험(experience)으로 구현될 수 있도록 상호작용의 구조를 디자인하고, 데이터 분석을 통해 보상 균형을 최적화하는 구현 단계를 포괄한다.",same:["게임화 디자인"],similar:["게임 메커니즘 디자인","인센티브 디자인"],related:["행동디자인","넛지 디자인","플레이풀 디자인","몰입 이론","피드백 루프","옥탈리시스"]},{id:12,ko:"경험",en:"Experience",initial:"ㄱ",definition:"사용자가 제품, 서비스, 시스템 등 환경 요소와 상호작용을 하는 과정과 그 결과로 축적되는 인지적, 정서적 반응의 총체.",description:"기능적 활용이나 물리적 접촉에 국한되지 않고 상호작용 중 발생하는 주관적 인지(cognition)와 감정적 반응까지 아우르며, 개별적인 기능 제공이나 물질적 소유보다 특정한 사용 맥락(context) 속에서 형성되는 심리적 만족과 가치에 주목한다.",same:[],similar:["체험","상호작용","행동"],related:["고객 여정","접점","맥락","가치","기대","반응","만족감"]},{id:13,ko:"경험 가치 평가 모델",en:"Experience value assessment model",initial:"ㄱ",definition:"대상 서비스가 지닌 효용을 사용자가 체감하는 주관적 혜택과 조직이 달성하려는 서비스 성과라는 두 축으로 구분하여 진단하는 분석 모델.",description:"제공물 자체의 기능적 속성을 넘어 서비스 접점에서의 상호작용 과정에서 파생되는 인지적, 정서적 반응 등을 측정한다. 금전적 또는 정량적 지표에 집중하는 조직의 성과 기준과 달리 가시화되지 않는 주관적 효용을 포착하여 의사결정 지표로 변환한다. 사용자 여정과 접점(touchpoint)에서 나타나는 행동, 감정, 태도의 변화를 추적하며 맥락(context) 요소를 종합하여 분석한다. 도출된 결과는 서비스 품질(service quality) 개선을 위한 척도로 활용된다.",same:[],similar:["경험 가치 측정 프레임워크","서비스 품질 모델"],related:["브랜드 경험 평가 모델","UX 평가 모델","UX 허니콤","Kano 모델","순 추천 지수(NPS)"]},{id:14,ko:"경험 경제",en:"Experience economy",initial:"ㄱ",definition:"제품과 서비스의 기능을 넘어 이용자가 겪는 의미 있는 시간과 활동 자체를 상품화하여 새로운 가치를 창출하는 경제 패러다임.",description:"파인과 길모어(Pine & Gilmore)가 주창한 이론으로 가치 창출 방식이 원재료, 공산품, 무형의 서비스를 제공하는 단계를 지나 고객의 심리적 반응과 활동을 상품화하는 경험(experience) 단계로 진화했음을 설명한다. 기능 위주의 기존 산업 구조와 달리, 대상과 상호작용을 하며 축적되는 기억과 정서적 만족을 주요 제공물로 삼으며, 상품을 소품으로, 서비스를 무대로 활용하여 개인화된 맥락(context)을 조성한다. 서비스디자인(service design) 영역에서는 이를 기반으로 고객을 수동적 구매자가 아닌 능동적 참여자로 규정하며 여정 전반의 접점을 설계하여 유대감을 형성하고 실질적인 효용을 이끌어내는 이론적 토대로 활용된다.",same:["경험 중심 경제"],similar:["가치 중심 경제","감성 경제","체험 마케팅"],related:["서비스 주도 논리","부가가치","개인화"]},{id:15,ko:"경험디자인",en:"Experience design",initial:"ㄱ",definition:"사용자가 제품이나 서비스를 인지하고 이용하는 전 과정의 흐름과 맥락(context)을 기획하여 의미 있는 경험(experience)을 창출하는 디자인 접근 방식.",description:"시각적 형태나 기능적 편의를 넘어 사용자가 대상과 만나는 모든 접점(touchpoint)에서 발생하는 효용을 높인다. 심리적 특성과 환경 요인을 분석하여 대상을 처음 접하는 순간부터 이용을 마칠 때까지의 전 과정을 일관되게 연결한다. 단편적인 요구(needs) 충족에 그치지 않고 상호작용 과정에서 긍정적인 정서가 형성되도록 하여 사용자의 행동과 의사결정에 영향을 미친다.",same:["XD"],similar:["사용자경험(UX)디자인","서비스디자인","인간 중심 디자인"],related:["인터랙션디자인","고객 경험 관리","고객 여정 지도","접점","상호작용","맥락"]},{id:16,ko:"경험 품질",en:"Quality of experience, QoE",initial:"ㄱ",definition:"이용자가 서비스 이용 과정 전반에서 얻은 인상과 감정을 바탕으로 형성되는 주관적 우수성으로 향후 재구매나 추천 같은 행동 의도와 충성도에 영향을 미치는 요인.",description:"접점(touchpoint)과 물리적 인터페이스는 물론 공간의 분위기나 주변인의 존재 같은 맥락적 환경 요소까지 포괄하여 영향받는다. 단일 시점의 일회적 진단에 머물지 않고 시간 흐름에 따른 여정 전반의 누적된 변화를 반영하는 통시적 특성을 보인다. 제공자의 기능적 기준에 맞춰진 객관적 척도와 달리 이용자가 내면에서 느끼는 효용과 만족도에 초점을 맞춘다.",same:[],similar:["지각된 품질","서비스 품질","서비스 품질(QoS)","감성 품질"],related:["사용성","기대-일치 이론","순 추천 지수(NPS)"]},{id:17,ko:"고객",en:"Customer",initial:"ㄱ",definition:"제공자의 제품이나 서비스를 구매하며 여러 접점(touchpoint)을 통해 조직과 상호작용하고 경험 가치를 교환하는 주체.",description:"기능적 유용성을 주로 추구하는 사용자와 구별되어 경제적 대가를 지불하고 제공자와 거래 관계를 맺는 당사자를 뜻하며 내재된 요구와 기대를 반영한다. 물리적 결과물은 물론 탐색부터 구매 이후까지 이어지는 서비스 여정 전반에서 정서적 만족감을 주요 혜택으로 인식하며, 서비스 과정에서 피드백과 행동 데이터를 생성하는 원천이다. 서비스디자인(service design) 영역에서는 일방적인 재화 소비자를 넘어 제공자와 함께 경험 가치를 공동 창출(co-creation)하는 능동적 참여자로 다루어진다.",same:["커스터머"],similar:["사용자","소비자","클라이언트","이해관계자","이용객"],related:["고객 여정 지도","접점","충성도","퍼소나"]},{id:18,ko:"고객 세그먼트",en:"Customer segment",initial:"ㄱ",definition:"전체 시장에서 공통된 속성과 요구를 지닌 이용자를 구분한 집단.",description:"인구통계학적 지표를 비롯해 행동 양식, 태도, 이용 맥락(context) 등의 기준에 의해 정의된다. 제공자와 이용자 간의 관계를 규명하여 서비스 전략을 수립하고 차별화된 가치를 제공할 목표 집단을 선정하는 토대로 활용된다. 마케팅 관점의 시장 분할에 그치지 않고 분류된 결과를 퍼소나(persona) 모델링으로 발전시키거나 고객 여정 지도(customer journey map) 및 가치 네트워크 분석의 기초 데이터로 활용된다.",same:[],similar:["컨슈머 세그먼트","사용자 세그먼트","퍼소나 세그먼트","표적 집단","사용자 집단","사용자 아키타입","고객 클러스터"],related:["가치 제안","퍼소나","코호트","극단적 사용자"]},{id:19,ko:"고객 여정 지도",en:"Customer journey map",initial:"ㄱ",definition:"특정 퍼소나(persona)의 관점에서 서비스와 상호작용을 하는 전체 과정을 시간순으로 배열하여 행동, 생각, 감정의 변화를 시각화한 도구.",description:"단계별 접점(touchpoint)에서 발생하는 상호작용을 파악하는 데 활용되며, 인지적, 정서적 흐름을 추적해 불편 지점(pain point)을 찾아내고 잠재적 요구(latent needs)와 기회 영역을 발견하여 개선 가능성을 확인한다. 현재 시스템의 문제점을 진단하거나 미래 시나리오를 기획할 때 적용되며 디자이너와 이해관계자(stakeholder)의 합리적 의사결정을 돕는다.",same:["고객 여정 맵","저니 맵","여정 지도"],similar:["고객 경험 지도","서비스 흐름도","사용자 여정 지도","서비스 여정 지도"],related:["접점","페인포인트","진실의 순간(MOT)","서비스 청사진"]},{id:20,ko:"공공디자인",en:`Public design,
Design for public`,initial:"ㄱ",definition:"국가나 지역 사회가 안고 있는 복합적 문제를 디자인적 관점에서 접근하고 해결하여 시민의 삶의 질을 높이고 공동체에 이로운 가치를 실현하는 디자인 분야.",description:"과거 시설물 조성이나 물리적 환경 미화에 국한되지 않고 제반 사회 문제를 디자인 관점에서 다루며 거주자의 편익을 향상하는 데 목적을 둔다. 관 주도의 하향식 방식에서 벗어나 이해관계자(stakeholder)의 참여와 협력을 바탕으로 공공 문제를 해결하며 다양한 영역에 적용되어 지속 가능한 시스템을 구축한다. 외형적 심미성보다 공동체가 공유하는 환경과 공간을 조성함으로써 구성원 간의 유대를 강화하는 기반으로 기능한다. 서비스 전달 체계와 정책 실행 과정을 대상으로 하는 공공서비스디자인과 구별된다.",same:[],similar:["사회적 디자인","시민 중심 디자인"],related:["참여 디자인","사회 혁신","지속 가능성","거버넌스","공공성","유니버설 디자인","포용적 디자인","정책디자인"]},{id:21,ko:"공공서비스디자인",en:"Public service design",initial:"ㄱ",definition:"정부, 지방자치단체, 공공기관 등 공공 부문이 시민과 다양한 이해관계자(stakeholder)를 중심에 두고 공공 정책과 서비스를 설계하고 전달하기 위한 디자인 분야.",description:"이용자의 실제 요구(needs)와 맥락(context)을 파악하고, 공동 창출(co-creation) 방식으로 공동디자인(co-design), 리빙랩(living lab) 등 참여적 방법론을 적용하여 문제를 발굴하고 서비스를 개선한다. 시민 중심의 서비스 경험을 실현하고 지속 가능한 서비스 생태계(service ecosystem)와 운영 체계를 구축한다. 이윤 극대화보다 공공 가치의 실현과 사회적 형평성을 우선한다는 점에서 민간 서비스디자인(service design)과 구별되며, 물리적 환경과 시각적 결과물을 주된 대상으로 하는 공공디자인과는 서비스 전달 체계와 정책 경험에 초점을 맞춘다는 점에서 구별된다.",same:[],similar:["정책디자인","사회적 디자인","인간 중심 디자인","시민 참여 디자인"],related:["국민디자인단","공동디자인","리빙랩","공동 창출","서비스 생태계","민간 서비스디자인"]},{id:22,ko:"공감",en:"Empathy",initial:"ㄱ",definition:"디자인사고(design thinking) 및 사용자 경험(user experience) 프로세스 전반에서 대상자의 관점에서 경험(experience), 감정, 생각을 온전히 이해하는 태도이자 과정.",description:"단일한 초기 단계에 국한되지 않고 프로젝트 전체를 관통하는 기본 원칙으로 작용하며, 단순한 정서적 동의를 넘어 면접(interview)이나 관찰 등의 정성적 조사 방법을 통해 대상이 처한 환경과 맥락(context)을 파악한다. 겉으로 드러나지 않은 잠재적 요구(latent needs)와 문제의 근본 원인을 발견하는 공감의 과정을 통해 이용자의 상황과 감정에 대한 깊은 이해가 형성되며, 사용자 중심의 해결책을 기획하고 디자인하는 데 필요한 인사이트를 도출한다.",same:[],similar:["사용자 이해","동정","연민"],related:["디자인사고","맥락적 조사","사용자 조사","잠재적 요구"]},{id:23,ko:"공감 지도",en:"Empathy map",initial:"ㄱ",definition:"정성적 조사로 수집한 대상자의 데이터를 발화, 행동, 생각, 감정, 고충, 혜택의 여섯 가지 영역으로 분류하여 경험(experience)을 재구성하고 시각화하는 분석 도구.",description:"프로젝트 초기 단계에서 면접(interview)이나 관찰 결과를 정리하고 퍼소나(persona)를 구체화하는 데 활용된다. 표면적으로 드러난 행동 패턴은 물론, 내면의 심리와 잠재적 요구(latent needs)를 파악할 수 있다. 대상이 겪는 고충과 얻고자 하는 혜택을 구조화하여 문제 정의를 위한 인사이트를 제공한다.",same:["공감 맵"],similar:[],related:["멘탈 모델","퍼소나","면접","고객 여정 지도"]},{id:24,ko:"공동디자인",en:"Co-design",initial:"ㄱ",definition:"디자이너, 이용자, 이해관계자(stakeholder)가 디자인 과정 전반에 걸쳐 협력자로 참여하여 문제를 함께 해결하는 협력적 디자인 방식.",description:"다양한 이해관계자(stakeholder)가 각자의 경험(experience)과 지식을 바탕으로, 능동적으로 기여하며 워크숍과 디자인 도구(design toolkit)를 활용하여 서로의 아이디어를 발전시키고 결과물을 함께 만들어낸다.",same:["코디자인"],similar:["참여 디자인","공동 창출","협력적 디자인"],related:["디자인 워크숍","디자인 촉진","생성적 도구","수평적 협업"]},{id:25,ko:"공동디자인 워크숍",en:"Co-design workshop",initial:"ㄱ",definition:"이용자와 이해관계자(stakeholder) 등 다양한 참여자가 디자인 도구(design toolkit)를 활용해 아이디어를 함께 만들어 나가는 협력적 디자인 활동.",description:"사전 과제를 통해 참여자의 몰입(flow)을 촉진하고 중립적 공간 조성을 통해 위계를 없애는 퍼실리테이션(facilitation) 전략을 기반으로 하며 언어로 표현하기 어려운 잠재 요구(latent needs)를 포착하기 위해 워크시트, 카드 등의 시각화 도구와 콜라주(collage), 블록 조립 등의 시각적 표현 기법을 활용하여 발상을 지원한다. 참여자의 경험(experience) 공유와 디자이너의 공감적 경청을 통해 상호 이해를 형성하며 아이디어 확산, 수렴과 선택, 정제 과정을 반복한다.",same:["코디자인 워크숍"],similar:["협업 디자인 워크숍","공동 창출 워크숍"],related:["아이스브레이킹","퍼실리테이션","잠재적 요구","가치 공동 창출","디자인 도구 모음"]},{id:26,ko:"공동 창출",en:"Co-creation",initial:"ㄱ",definition:"다양한 주체가 집단지성을 바탕으로 협력해 가치를 공동으로 만들어내는 창의적 방식.",description:"생산자와 이용자를 아우르는 여러 주체가 각자의 관점과 지식을 모아 집단지성을 발휘하는 활동으로 디자인 외 분야에서도 폭넓게 활용된다. 참여자 간 상호작용을 통해 개별 주체가 단독으로 도달하기 어려운 결과를 만들어내며 각 주체의 요구(needs)와 경험(experience)이 결과물에 직접 반영된다.",same:["코크리에이션"],similar:["공동디자인","참여 디자인","가치 공동 창출"],related:["디자인 워크숍","생성적 도구","이해관계자","집단지성","오픈 이노베이션"]},{id:27,ko:"공동 창출 워크숍",en:"Co-creation workshop",initial:"ㄱ",definition:"다양한 이해관계자(stakeholder)가 협력하여 가치를 함께 만들어내는 창의적 활동.",description:"집단지성을 실현하는 장으로 다양한 지식과 경험(experience)을 가진 참여자들이 대화를 통해 공감(empathy) 형성과 경험 공유를 이루며 공동의 목표와 비전을 수립하고 새로운 콘셉트를 도출한다. 이 과정에서 공동디자인(co-design)의 디자인적 도구를 활용하기도 한다.",same:["코크리에이션 워크숍"],similar:["협업 디자인 워크숍","공동디자인 워크숍"],related:["아이스브레이킹","디자인 도구 모음","가치 공동 창출","메이크툴즈","퍼실리테이션"]},{id:28,ko:"국민디자인단",en:"Citizens policy design group",initial:"ㄱ",definition:"서비스 수요자인 국민, 정책 담당 공무원, 서비스 디자이너가 협력하여 공공 정책과 서비스를 기획, 개발하고 개선하는 국민 참여형 워킹그룹.",description:"2014년 안전행정부가 도입한 국민 참여형 정책 협력 운영 체계로 공공서비스디자인(public service design) 방법론을 활용하여 현장 조사를 수행하고, 수요자 중심의 서비스 개선을 추구한다. 정책 기획에서 실행에 이르는 전 과정에 걸쳐 다양한 주체가 함께 참여하는 참여 기반 공공 운영 체계로 기능한다.",same:[],similar:["리빙랩","정책 실험실"],related:["공공서비스디자인","공동디자인","이해관계자 참여","행정안전부"]},{id:29,ko:"관찰법",en:"Observation method",initial:"ㄱ",definition:"대상이 실제 환경에서 물리적 요소 및 주변과 상호작용을 하는 과정을 관찰하여 언어로 표현되지 않은 잠재적 요구(latent needs)를 발견하는 정성적 연구 방법론.",description:"관찰 프레임워크(framework)를 바탕으로 대상의 표정, 비언어적 신호, 상황적 맥락(context)을 포착하여 기록한다. 확보한 데이터를 해석하여 반복되는 행동 패턴과 그 이면에 숨겨진 동기를 규명하고, 이용 과정에서 겪는 불편 지점(pain point)과 제약 요소를 파악한다. 조사자의 주관적 가정을 배제하고 현상 자체에 집중함으로써, 면접(interview) 같은 언어 기반 조사 방법만으로는 확인하기 어려운 행동의 실제 맥락을 도출하는 데 목적을 둔다.",same:[],similar:["관찰 조사","현장 관찰","참여 관찰"],related:["서비스 사파리","에스노그라피","섀도잉","AEIOU 프레임워크"]},{id:30,ko:"관여도",en:"Engagement",initial:"ㄱ",definition:"고객이 브랜드나 서비스 등과 상호작용을 하며 맺는 자발적인 관계 수준.",description:"노출이나 관심을 넘어 내재적 동기에 바탕을 둔 감성적 연결과 심리적 몰입(flow) 상태를 포괄하며, 소셜미디어 공유, 추천, 서비스 이용 같은 행동적 참여로 구체화한다. 고객의 주도적 활동을 바탕으로 상호작용을 반복해 유대감을 강화함으로써 서비스 가치를 높이고 이용자와의 지속적 관계를 형성하는 토대가 된다.",same:["인게이지먼트"],similar:["몰두","참여"],related:["충성도","리텐션","몰입","감정적 디자인"]},{id:31,ko:"귀납적 연구",en:"Inductive research",initial:"ㄱ",definition:"개별적인 관찰과 사실에서 출발하여 내재된 패턴을 분석하고 일반적 원리나 새로운 가설(hypothesis)을 도출하는 상향식 추론 방법.",description:"설정된 가설(hypothesis)을 검증하는 연역적 접근과 달리 수집된 현장 데이터를 바탕으로 개별 사례의 숨겨진 규칙성을 발견하여 현상을 이해하고 설명하는 데 활용된다. 서비스디자인(service design) 영역에서는 프로젝트 초기 탐색 단계에서 대상의 행동을 분석할 때 활용되며, 이용 경험(experience)의 맥락(context)을 해석하여 문제 해결을 위한 인사이트를 도출한다. 기존 이론이 부재하거나 복합적인 현상을 탐구하는 발견 지향적 연구에 적합하다.",same:[],similar:["정성 연구","질적 연구","상향식 연구","데이터 기반 연구"],related:["패턴 인식","사용자 인사이트","추론"]},{id:32,ko:"기능적 요구",en:"Functional needs",initial:"ㄱ",definition:"사용자가 직면한 문제를 해결하고 과업을 수행하기 위한 동기이자 제공물이 갖추어야 할 실질적 속성과 품질 요소.",description:"일상에서 마주하는 문제나 갈등 상황을 해결하고 목표 상태를 유지하기 위해 제공물이 갖추어야 할 요건으로, 위험을 예방하고 당면한 목적을 달성하는 데 필요한 이용자의 일차적 선택 기준이자 디자인 요건이다. 정서적 만족감보다는 효율성, 편의성, 안전성 등 실용적 가치를 우선한다.",same:["기능적 니즈"],similar:["기능 요구사항"],related:["기본 기능","기능 명세","유효성","사용성","성능"]},{id:33,ko:"기능적 어포던스",en:"Functional affordance",initial:"ㄱ",definition:"사용자가 시스템을 통해 의도한 목적을 달성하고 과업을 완수하도록 돕는 속성.",description:"하트슨(Hartson)이 분류한 어포던스(affordance) 유형 중 하나로, 단순히 버튼을 누르는 물리적 조작을 넘어 해당 조작이 실제 목표 달성으로 이어지게 하는 유용성(usefulness)을 가리킨다. 시각적 단서나 물리적 감각의 제공 여부와 무관하게, 기능이 의도한 대로 작동하여 원하는 결과로 이어진다는 점에서 사용성(usability)의 구성 요소로 다루어진다.",same:["기능적 행동 유도성"],similar:["실용적 어포던스","물리적 어포던스","조작적 어포던스","기능적 유용성"],related:["사용성","효과성","도구적 가치","유용성"]},{id:34,ko:"기록지",en:"Field note",initial:"ㄱ",definition:"현장 조사나 맥락적 면접(contextual interview) 과정에서 프레임워크(framework) 및 체크리스트를 기반으로 대상자의 발화와 상황적 세부 사항을 기록하는 문서화 도구.",description:"녹화나 녹음 장비가 담아내지 못하는 비언어적 표현과 현장 분위기를 포착하며, AEIOU 프레임워크 등을 적용하여 내용을 구조화하고 대상자의 주요 발화를 실시간으로 기록한다. 기록된 내용은 연구 결과의 신뢰도와 투명성을 확보하는 근거로 활용된다.",same:[],similar:["현장 노트","관찰 로그"],related:["AEIOU 프레임워크","삼각 측정법"]},{id:35,ko:"넛지",en:"Nudge",initial:"ㄴ",definition:"행동을 강제하거나 선택지를 제한하지 않고 환경을 재구성하여 사용자가 바람직한 선택을 내리도록 긍정적인 행동 변화를 지원하는 개입 방식.",description:"팔꿈치로 찌르다'라는 어원적 의미를 지니며 탈러와 선스타인(Thaler & Sunstein)이 행동경제학 관점에서 제시한 개념으로 서비스 기획 및 디자인 영역에 적용하여 강압적 규제 대신 물리적 공간이나 인터페이스의 구조를 재구성하는 선택 설계를 바탕으로 사용자의 행동 변화를 유도한다. 인간의 인지적 편향과 휴리스틱을 활용하여 자발적 행동을 촉진하므로 공공 정책이나 사용자 경험(user experience) 개선을 위한 실천적 방식으로 다루어진다.",same:["행동 유도"],similar:["행동 유도 디자인","어포던스","유도 설계"],related:["행동 경제학","다크넛지","인지 편향","선택 설계"]},{id:36,ko:"다크 패턴",en:"Dark pattern",initial:"ㄷ",definition:"사용자의 착각이나 실수를 유도하는 기만적 인터페이스 패턴으로, 넛지(nudge) 원리를 역이용해 자율적 선택을 방해하고 특정 행동을 강제하는 방식.",description:"UX 컨설턴트 브리그널(Brignull)이 처음 정의하고 유형화한 개념으로, 인지적 편향을 악용하는 행동경제학 원리를 바탕으로 이용자가 의도치 않은 결정을 내리도록 구성된 인터페이스이다. 가입 절차에 비해 탈퇴 경로를 숨겨두거나 결제 단계에서 추가 비용을 기본값으로 포함하는 사례가 대표적이다. 신뢰를 훼손하고 서비스 이탈을 초래하며, 자율적 의사결정권을 침해하고 금전적 피해를 유발하여 전반적인 브랜드와 서비스 경험에 부정적 영향을 미친다.",same:["기만적 디자인"],similar:["사용자 기만 디자인","다크 넛지","디지털 기만","안티 패턴"],related:["인지적 조작","디자인 윤리","넛지","사용자 자율성"]},{id:37,ko:"대화형 에이전트",en:"Conversational agent",initial:"ㄷ",definition:"이용자의 언어를 이해하고 상호작용을 하며 목적 달성을 돕거나 과업을 대행하는 인공지능 기반 도구.",description:"챗봇, 음성 에이전트 등을 포괄하는 개념으로 기계가 인간의 언어를 이해하고 소통하는 인터페이스 역할을 넘어 이용자의 목적 달성을 대행한다. 사전 정의된 규칙 기반의 응답 방식에서 벗어나 자연어 처리 및 기계학습을 통해 문맥과 숨은 의도를 파악하고 요구(needs)를 처리한다. 상호작용 과정에서 수집된 데이터를 바탕으로 맞춤형 서비스를 제안하며 과업 실행을 돕는다. 텍스트, 음성 등 여러 방식을 결합한 다중 양식으로 진화하여 서비스 경험 전반에서 인지적 부담을 줄이고 편의를 높이는 데 활용된다.",same:[],similar:["챗봇","가상 비서","대화형 인공지능"],related:["에이전트","대화형 인터페이스","보이스 유저 인터페이스","내추럴 유저 인터페이스","멀티모달 인터페이스","맥락 인식","개인화"]},{id:38,ko:"데이터 중심 디자인",en:"Data-driven design",initial:"ㄷ",definition:"정량적 데이터와 정성적 데이터를 통합적으로 활용하여 근거 기반의 의사결정을 내리는 디자인 접근법.",description:`빅데이터¹ 와 두꺼운 데이터²를 상호 보완적으로 활용하는 것을 핵심 원칙으로 삼는다. 빅데이터는 사용자 행동 로그, 클릭 패턴, 전환율 등 정량적 수치를 통해 '무엇이' 일어나고 있는지를 파악하고, 두꺼운 데이터는 면접(interview), 현장 관찰, 맥락(context) 조사 등 정성적 방법을 통해 '왜' 그러한 행동이 발생하는지를 이해하는 데 활용된다. 텍스트 마이닝, 기계학습 알고리즘 등 분석 기술을 설계 프로세스에 접목하는 한편, 사용자의 맥락과 경험(experience)에서 도출되는 정성적 인사이트를 동등한 근거로 삼아 잠재적 요구(latent needs)를 파악하고 행동 패턴을 해석한다. 콘셉트 설정부터 개발 방향 수립까지 근거 기반의 의사결정을 체계적으로 수행하여 기획 전반의 불확실성을 줄이고 실효성 있는 결과물을 도출하는 것을 지향한다.

각주 
1. 빅데이터(big data): 가트너(Gartner)의 레이니(Laney)가 제시한 개념으로 기존 데이터 처리 방식으로는 다루기 어려운 방대한 규모의 정형, 비정형 데이터를 지칭한다. 데이터의 양, 속도, 다양성을 핵심 특성으로 하며, 사용자 행동 로그, 클릭 패턴, 전환율 등의  정량적 수치를 통해 현상을 파악한다.
2. 두꺼운 데이터(thick data): 왕(Wang)이 제안한 개념으로 면접·현장 관찰·맥락 조사 등 정성적 방법을 통해 수집되는 데이터를 지칭한다. 빅데이터가 포착하지 못하는 인간의 감정, 동기, 맥락적 의미를 담아내어 사용자 행동의 이유를  깊이 있게 이해하는 근거로 활용된다.`,same:["데이터 주도 디자인","데이터 기반 디자인"],similar:["증거 기반 디자인","데이터 참고 디자인","알고리즘 디자인"],related:["텍스트 마이닝","머신러닝 알고리즘","사용자 로그 분석","그로스 해킹","정성 데이터","정량데이터"]},{id:39,ko:"데스크 리서치",en:"Desk research",initial:"ㄷ",definition:"문헌 검토 및 정보 검색을 통해 기존에 축적된 2차 데이터를 수집하고 분석하는 연구 방법.",description:"통계, 문헌, 고객의 소리 등 외부 출처 및 내부 축적 데이터를 활용하므로 데이터의 신뢰성 검증이 필요하다. 디자인 프로젝트에서는 정책 변화, 경쟁사 동향, 벤치마킹 요소 등을 분석하여 시장 환경과 흐름을 파악한다. 수집된 배경지식은 이후 진행될 심층 면접(in-depth interview)이나 관찰 조사의 방향을 설정하는 토대가 되며, 대상자의 서비스 이용 맥락(context)을 이해하는 기초 근거로 기능한다.",same:["2차 리서치","세컨더리리서치"],similar:["문헌 연구","트렌드 분석","경쟁사 분석"],related:["1차 리서치","프라이머리 리서치","사전 연구"]},{id:40,ko:"더블 다이아몬드 모델",en:"Double diamond model",initial:"ㄷ",definition:"영국 디자인 카운슬이 제시한 발견, 정의, 개발, 전달의 4단계를 거쳐 문제를 규명하고 해결책을 도출하는 디자인 프로세스(design process) 모델.",description:"발산과 수렴의 사고 과정이 두 번 반복되어 다이아몬드 형태를 띠는 구조에서 명칭이 유래했다. 크게 두 영역으로 나뉘며, 첫 번째 영역은 조사를 통해 현상을 탐색하는 발견 단계와 도출된 데이터를 바탕으로 문제를 규정하는 정의 단계로 구성된다. 두 번째 영역은 규정된 문제를 해결할 아이디어를 구상하는 개발 단계와 이를 검증하여 결과물을 완성하는 전달 단계로 이어진다. 사용자 조사(user research)와 공감(empathy)을 바탕으로 하며, 디자인 프로세스의 인지 구조를 기술하는 개념적 모델인 동시에 실무에 적용할 수 있는 프레임워크로 기능한다.",same:["더블 다이아몬드 프로세스","4D 프로세스"],similar:["발산-수렴 프로세스","디자인사고 프로세스"],related:["발산과 수렴","발견하기","정의하기","개발하기","전달하기"]},{id:41,ko:"도시 이동 수단 시스템",en:"Urban mobility system",initial:"ㄷ",definition:"지리적 공간 내에서 이용자의 이동을 지원하는 물리적 인프라, 정보 기술, 운영 체계가 결합한 통합 서비스 환경.",description:"단순한 교통수단이나 공학적 기반 시설을 넘어 이용자 경험(experience)과 사회적 맥락(context)을 포괄하는 서비스디자인(service design) 관점에서 다루어진다. 물리적 요소와 디지털 플랫폼(platform) 및 데이터 네트워크가 얽힌 사회기술적 구조를 지닌다. 기존의 공급자 중심 교통 관점에서 벗어나 이용자의 이동 여정 전반에 걸친 요구(needs)가 반영된 시나리오 기획과 이동 서비스 간의 연계를 지향한다. 다수 이해관계자(stakeholder)의 입장을 조정하고 상호작용을 설계하여 단절 없는 이동 수단 이용 경험과 지속 가능한 도시 환경 구축에 기여한다.",same:["도시 모빌리티 시스템"],similar:["지능형 교통 체계","스마트 교통"],related:["통합 교통 서비스(MaaS)","개인 이동 수단(PM)","마이크로 모빌리티"]},{id:42,ko:"도시재생 디자인",en:"Urban regeneration design",initial:"ㄷ",definition:"쇠퇴한 지역의 물리적 환경 개선을 넘어 사회·경제적 요소를 통합하여 지속 가능한 생태계를 구축하고 하드웨어와 소프트웨어를 결합해 도시 기능을 재활성화하는 실천 분야.",description:"기존 건축물을 전면 철거하는 물리적 재개발과 달리 보존과 활용에 무게를 두며, 낙후된 기반 시설을 정비하는 하드웨어(공간 및 환경 개선) 영역과 지역 공동체의 유대감을 회복하고 경제를 활성화하는 소프트웨어(커뮤니티 및 문화 프로그램) 영역을 결합한다. 해당 지역의 고유한 역사와 문화를 유지하면서 현대적 요구(needs)를 수용하여 환경적 지속 가능성을 지향한다. 다수 이해관계자(stakeholder)가 참여하는 거버넌스를 바탕으로 젠트리피케이션을 방지하고 거주민의 삶의 질 향상과 일자리 확대 등 사회적 과제에 대응하며 자생적 지역 생태계를 구축한다.",same:["도시 재활성화 디자인"],similar:["지속 가능한 도시 디자인"],related:["플레이스메이킹","커뮤니티디자인","로컬 브랜딩","지역 서비스 생태계","거버넌스"]},{id:43,ko:"디자인 거버넌스",en:"Design governance",initial:"ㄷ",definition:"공공, 민간, 시민 등 여러 이해관계자(stakeholder)가 참여해 사회 문제를 해결하는 협력적 의사결정 체계.",description:"행정 기관 주도의 하향식 정책 시행에서 벗어나 시민, 전문가, 공공 부문이 연대하는 협치 구조를 지향한다. 일반적인 거버넌스와 달리 디자인사고(design thinking)와 공동디자인(co-design) 방식을 의사결정 과정에 적용해 문제를 구조화하고 해결 방향을 탐색한다는 점에서 구별된다. 당면한 사회 현안을 해결하기 위한 실천 도구로 디자인 방법론(design methodology)을 활용하며, 정책 수립부터 실행, 평가에 이르는 전 과정에 다수의 주체가 함께 참여해 변화를 지향한다. 도시 계획, 공공서비스 혁신, 사회적 인프라 설계 등 다양한 공공 영역에 걸쳐 적용되며 투명한 합의 과정을 통해 산출물(output)의 사회적 수용도를 높이고 공동체의 삶의 질 향상을 목적으로 한다.",same:[],similar:["디자인 공동 의사 결정 체계","디자인 관리 체계","디자인 운영 모델","디자인 정책"],related:["참여형 디자인 프레임워크","공동 창출","사회 혁신 디자인","공공서비스디자인","정책디자인","리빙 랩","사회적 가치"]},{id:44,ko:"디자인 도구 모음",en:"Design toolkit",initial:"ㄷ",definition:"아이디어 발상 및 문제 해결 과정을 체계적으로 진행하도록 관련 디자인 방법론(design methodology)과 지침을 집약한 체계적으로 엮어 구성한 모음.",description:"인간 중심 디자인(human centered design) 철학을 바탕으로 현안 해결과 혁신적 접근을 지원하기 위해 개발된 방법론과 가이드로 구성된다.팀 단위 협업(collaboration)을 촉진하고 현장 실천 기반의 과제 수행을 지원하며, 과업 목적에 따라 관찰 기법 및 워크숍 방식 등을 상황에 맞게 선택하고 조합해 활용한다. 공개 자료 형태로 제공되기도 한다.",same:["디자인 툴킷"],similar:["디자인 키트"],related:["퍼실리테이션","공동디자인","공동 창출"]},{id:45,ko:"디자인 방법론",en:"Design methodology",initial:"ㄷ",definition:"인간 중심의 관점에서 주어진 과제를 해결하기 위해 데이터를 수집, 분석하고 작업 절차를 구조화하는 디자인 고유의 체계적 접근 방법.",description:"직관적 접근에만 의존하지 않고 작업 절차에 논리적으로 접근하는 체계로 디자인 과정 전반의 불확실성을 낮춰 과업 성공 확률을 높이는 기반이 된다. 단순한 형태 구현뿐만 아니라 새로운 가치를 창출하는 체계적이고 창의적인 문제 해결 수단으로 기능한다.",same:[],similar:["디자인 프로세스","디자인 프레임워크"],related:["디자인사고","디자인연구","디자인 전략","연구 조사 방법론","디자인 도구"]},{id:46,ko:"디자인사고",en:"Design thinking",initial:"ㄷ",definition:"인간에 대한 공감(empathy)을 바탕으로 현안을 해결하는 디자이너의 사고방식이자 문제 해결 접근법.",description:"인간의 잠재적 요구(latent needs)를 파악하는 단계에서 출발하며 당면 과제를 규정하고 해결안을 구상한 뒤, 프로토타입(prototype)을 제작해 검증하는 과정을 순환한다. 실행과 시행착오 기반의 학습을 중시하며, 결과물을 지속적으로 개선하는 실천 태도를 지향하고, 제품과 서비스디자인(service design) 뿐만 아니라 비즈니스 전략 수립이나 사회 해결 등 다양한 영역에 적용된다.",same:["디자인 씽킹"],similar:["디자이너적 사고"],related:["시스템 사고","비판적 사고","창의적 문제 해결","귀추적 사고","더블 다이아몬드 프로세스"]},{id:47,ko:"디자인 심의",en:"Design approval",initial:"ㄷ",definition:"조직 내부 또는 외부의 독립적 심의자¹가 정해진 기준에 따라 기획안과 산출물의 적합성을 검토하고 승인하는 의사결정 과정.",description:`결과물의 질적 향상과 목적 부합 여부를 확인하고자 위원회를 구성해 평가를 수행하는 절차로 의사결정 권한을 수반한다. 정량적 규정 적용에 그치지 않고 재량적 판단²을 활용해 미적 가치와 사용자 경험(user experience) 등 정성적 요소를 함께 검토한다. 일관성과 공정성 확보를 위해 적법한 절차 준수를 요구하며, 사전 협의나 서면 의견 교환 등을 거쳐 최종 의사결정을 내린다. 공공 부문에서는 도시 맥락(context)과의 조화 및 공공 이익 실현을 지향하고 민간 영역에서는 브랜드 정체성 유지 및 서비스 품질(service quality) 관리를 목적으로 한다.

각주
1. 독립적 심의자(independent reviewer): 조직 외부의 디자이너 및 교수 등 민간 전문가를 위촉해 객관적인 평가를 확보하는 방식이다.
2. 재량적 판단(discretionary judgment): 수치화된 기준에 의존하지 않고 위원의 전문성을 바탕으로 환경과의 조화 및 질적 가치를 종합해 판별한다.`,same:[],similar:["디자인 심사","디자인 자문","디자인 평가"],related:["심의 위원회","심의 기준","조건부 의결","재심의","심의 자료"]},{id:48,ko:"디자인연구",en:"Design research",initial:"ㄷ",definition:`[1] 디자인 현상, 방법론, 이론을 체계적으로 탐구하는 학문적 활동으로, 디자인 행위 자체를 연구 대상으로 삼거나 디자인 실천을 통해 지식을 생성하는 연구 분야. 
[2] 대상과 주변 환경을 이해하기 위해 디자인 프로세스 전반에서 수행하는 탐구 활동으로, 잠재적 요구(latent needs)를 발견하고 과제를 규정해 인간 중심의 해결책을 도출하는 실천적 과정.`,description:`[1] 디자인연구는 탐구 목적과 방법에 따라 다양한 유형으로 전개되며, 인문, 사회과학, 공학 등 인접 분야와 교차하는 학제적 성격을 지닌다. 디자인 현상을 분석 대상으로 삼는 이론적 연구부터 실천 행위를 통해 지식을 생성하는 실험적 연구까지 포괄한다.
[2] 대상자의 요구(needs) 사항과 기술적, 물리적 상황을 포괄하여 파악하는 탐구 절차로 정량 기법과 정성 기법을 병행해 현상 이면의 원인을 분석한다. 수집한 데이터를 바탕으로 당면 과제를 규정하고 아이디어를 구체화할 논리적 근거를 마련한다. 단순한 사용자 조사(user research)를 넘어 사회문화적 흐름과 조형적 가치까지 탐구하며, 산출물(output)의 완성도를 높이는 실증적 토대로 작용한다.`,same:["디자인 리서치"],similar:["디자인 조사"],related:["디자인에 관한 연구","디자인을 위한 연구","디자인을 통한 연구","탐색적 연구","사용자 연구","더블 다이아몬드 프로세스"]},{id:49,ko:"디자인 원칙",en:"Design principles",initial:"ㄷ",definition:"과업이 추구하는 가치를 규정하고 콘셉트 및 해결안 탐색의 방향을 제시하는 규범적 기준.",description:"대상자의 요구(needs)와 기회 영역을 반영해 도출한다. 조사를 통해 얻은 인사이트를 실행 가능한 지침으로 전환하여 팀 합의와 우선순위 설정을 이끌며, 향후 아이디어 발상 및 콘셉트 선택 과정에서 의사결정의 준거가 된다.",same:[],similar:["디자인 가이드라인","디자인 시스템","디자인 철학"],related:["디자인 전략","휴리스틱","의사결정 기준"]},{id:50,ko:"디자인 저작권",en:"Design copyright",initial:"ㄷ",definition:"저작권법에 따라 사상이나 감정을 표현한 창작물에 부여하는 권리로, 구체적으로 표현된 독창적 결과물을 보호하는 제도.",description:"미술, 도형, 건축물, 사용자 경험(user experience) 구현을 위한 컴퓨터 프로그램 등의 저작물을 보호 대상으로 삼는다. 행정 등록 절차 없이 창작과 동시에 권리가 발생하며, 한국 저작권법상 사후 70년까지 효력을 유지한다. 보호 범위는 기획 자체가 아닌 시각화된 결과물에 한정된다. 예컨대 대상을 캐릭터로 만들자는 기획안은 누구나 활용할 수 있으나 이를 시각화한 작업물은 독자성을 인정받는다. 원본을 변형해 새로운 조형성을 더한 파생 작업물 역시 독립된 권리로 보장된다.",same:[],similar:[],related:["저작재산권","디자인권","지식재산권(IP)","상표권","특허권","실용신안권","2차적 저작물","디자인보호법"]},{id:51,ko:"디자인 지침",en:"Design guidelines",initial:"ㄷ",definition:"산출물(output)의 일관성과 품질을 확보하기 위해 디자인 및 적용 전반에 걸쳐 준수해야 할 원칙과 기준을 정리한 문서.",description:`결과물이 지향하는 가치와 원칙을 제시함으로써 작업의 적용과 재사용을 지원한다. 프로젝트 초기 단계에서 브리프 역할을 수행해 기획 방향을 설정하고 심의 및 평가 단계에서는 자의적 판단을 배제한 객관적 기준을 제공한다. 공공 영역에서는 디자인 코드¹와 결합해 법적 지위를 가지며 사적 개발 행위가 공공 이익에 부합하도록 지원하는 정책 도구로 기능한다.

각주
1. 디자인 코드(design code): 디자인 지침(design guidelines)보다 엄격하고 구체적인 규제 수단으로 수치화된 도면이나 그림으로 표현되며 강제성을 띤다.`,same:["디자인 가이드라인","디자인 가이드북"],similar:["디자인 매뉴얼","디자인 시스템","스타일 가이드","브랜드 가이드라인","유니버설 디자인 가이드라인","디자인 표준"],related:["디자인 원칙","컴포넌트 라이브러리","에셋"]},{id:52,ko:"디자인 컨설팅",en:"Design consulting",initial:"ㄷ",definition:"디자인 전문가 또는 전문 조직이 방법론적 지식과 경험을 바탕으로 조직의 당면 과제를 해결하고 사업과 조직의 혁신을 이끄는 자문 활동.",description:"디자인 방법론(design methodology)을 활용해 조직의 현안을 분석하고 전략과 해결책을 제시한다. 인간 중심 접근을 통해 산출물(output)의 가치를 높이고 의뢰인의 경쟁 우위 확보를 돕는다. 자문 영역은 제품, 서비스의 콘셉트 기획부터 조직 문화와 실행 절차 개선에 이르기까지 폭넓게 아우른다. 디자인사고(design thinking)를 경영 전반에 통합해 성장과 혁신을 도모하는 전략적 협력 관계를 지향한다.",same:[],similar:["디자인 경영","혁신 컨설팅","디자인 전략 컨설팅"],related:["디자인사고","비즈니스 모델 혁신","기업 역량 강화","디자인 로드맵"]},{id:53,ko:"디자인 프로세스",en:"Design process",initial:"ㄷ",definition:"인간 중심으로 과제를 해결하기 위해 디자인 관점에서 사고와 행위의 절차적 체계.",description:"문제 탐색과 해결안 도출을 오가는 확산과 수렴 단계를 반복하며 진행하며 단계를 순서대로 밟는 선형 절차가 아니라 필요에 따라 이전 단계로 되돌아가는 반복적이고 비선형적 특성을 보인다. 초기에 대상자 조사를 수행해 공감(empathy)을 형성하고 목표를 규정하는 데 집중하며 이후 발산 단계를 거쳐 가능성을 탐색하고 분석 및 검증을 통해 해결안으로 좁혀 나간다. 이 순환 절차는 불확실성을 낮추고 결과물(output)의 완성도를 높여 대상자에게 효용을 제공하는 기반으로 작용한다.",same:["디자인 과정"],similar:["디자인 워크플로우"],related:["더블 다이아몬드 모델","인간 중심 설계 프로세스","사용자 중심 설계 프로세스"]},{id:54,ko:"디자인 평가 모델",en:"Design evaluation model",initial:"ㄷ",definition:"인공물이 실제 환경 맥락에서 의도한 목적에 부합하는지 확인하고자 유용성(usefulness), 효과성, 품질 등 기준과 지표를 엮어 구성한 측정 체계.",description:"심미적 요소뿐만 아니라 대상자가 겪는 경험 가치와 산출물(output)의 기능을 검증한다. 과업 목적에 따라 적합한 측정 방법론과 척도를 선별해 적용하며 목표로 설정한 기준과 실제 결과물을 대조해 효용을 파악한다. 사용성(usability)과 만족도 등 대상자 중심 지표는 물론 확장성과 완전성 등 기술적 완성도까지 포괄한다.",same:[],similar:["디자인 검증 모델","사용성 테스트","휴리스틱 평가","A/B 테스트","디자인 감사"],related:["정량적 평가","정성적 평가","심미적 평가","비즈니스 평가"]},{id:55,ko:"디자인 출원",en:"Design application",initial:"ㄷ",definition:"디자인보호법에 따라 창작물에 대한 배타적 디자인권¹을 획득하고자 주무 관청에 도면과 서류를 제출해 신규성²과 창작성³을 입증하고 심사를 요청하는 행정 절차.",description:`창작물이 산업재산권⁴으로 법적 보호를 받고자 거치는 심사 요청 과정이다. 보호 대상 범위는 제조 물품을 넘어 사용자 경험(user experience) 요소인 그래픽 사용자 인터페이스 등을 포함하는 방향으로 확장되었다. 심사 전 창작물이 대중에 공개되면 신규성을 상실해 등록이 거절될 수 있다. 이 경우 공지증명제도⁵와 신규성 상실 예외 조항⁶을 활용해 한국 디자인보호법상 공개일로부터 12개월 이내에 서류를 접수하면 권리를 보전할 수 있다.

각주
1. 디자인권(design right): 물품의 외관 형상, 모양, 색채에 대해 창작자가 가지는 독점적 권리이며 타인의 무단 사용을 방지한다.
2. 신규성(novelty): 심사 대상이 기존에 공개된 적 없는 새로운 상태여야 한다는 요건이다.
3. 창작성(creativity): 그 디자인이 속하는 분야에서 통상의 지식을 가진 자가 용이하게 창작할 수 없는 수준을 요구하는 요건이다.
4. 산업재산권(industrial property right): 특허권, 실용신안권, 디자인권, 상표권을 포괄하며 산업 활동과 관련된 창작물에 부여하는 무형 재산권이다.
5. 공지증명제도(design disclosure certification): 전시회, 인터넷 등을 통해 창작물이 대중에 먼저 공개된 경우 이를 스스로 증명해 신규성 상실 예외를 인정받는 제도이다.
6. 신규성 상실 예외(grace period): 창작물이 사전 공개된 경우 공개일로부터 12개월 이내에 심사를 요청하면 신규성을 인정하는 제도이다.`,same:["디자인 등록 신청"],similar:["디자인 등록","특허출원","상표 출원"],related:["출원서","우선권 주장","공지증명제도","비밀디자인 설정"]},{id:56,ko:"라이프로깅",en:"Lifelogging",initial:"ㄹ",definition:"1인칭 관점에서 개인의 일상과 경험(experience)을 수집·기록하여 기억 보조와 경험 관리를 돕는 정보 저장 활동.",description:`편재형 컴퓨팅 기술¹과 착용형 기기 등을 활용해 시공간 정보와 결합한 다중 매체 보관소 형태로 구축되며, 무작위 수집을 넘어 주관적 의도를 담아 포착한 캡타² 성격을 지닌 자서전적 산물이다. 축적한 데이터는 지능형 인덱싱³을 거쳐 검색 편의성을 확보하며, 과거 경험(experience)을 불러오는 인지(cognition) 지원 및 관리 시스템으로 작용한다. 일종의 디지털 평행 기억⁴으로 기능해 대상자의 인지적 효율 향상과 삶의 질 개선에 기여한다.

각주
1. 편재형 컴퓨팅 기술(pervasive computing): 일상 공간 사물이나 환경에 연산 장치가 스며들어 사용자가 의식하지 않고 정보 처리 환경을 이용하게 돕는 기술이다.
2. 캡타(capta): 주관적 의도를 담아 수많은 데이터 중 선택해 포착한 산물이며 객관적 측정치와 대비되는 개념이다.
3. 지능형 인덱싱(Intelligent Indexing): 인공지능 기술을 활용해 방대한 데이터를 분석, 분류하고 목차와 색인을 만들어 검색 접근성을 높이는 작업이다.
4. 디지털 평행 기억(digital parallel memory): 생물학적 기억과 나란히 작동하며 과거 경험(experience)을 저장, 관리하고 회상하게 돕는 보조적 인지(cognition) 체계이다.`,same:[],similar:["디지털 로깅","개인 정보학"],related:["웨어러블 컴퓨팅"]},{id:57,ko:"라포",en:"Rapport",initial:"ㄹ",definition:"심리치료 및 상담 분야에서 발원한 개념으로 상호작용을 통해 형성되는 신뢰와 친밀감에 기반한 유대 관계.",description:"정서적 공감과 인지적 이해를 바탕으로 신뢰가 점진적으로 구축되는 관계적 상태를 가리킨다. 질적 조사에서 조사자와 대상자 사이에 이와 같은 관계가 형성되면 솔직하고 풍부한 응답을 이끌어낼 수 있으며 심층적인 맥락(context) 정보를 수집하기 위한 전제 조건이 된다.",same:[],similar:["신뢰 관계","유대 관계","공감","신뢰","친밀감"],related:["심층 면접","맥락 조사","정서적 공감","사용자 리서치"]},{id:58,ko:"래피드 퍼소나",en:"Rapid persona",initial:"ㄹ",definition:"시간 부족 등 제한된 환경에서 실증 조사 없이 작업자의 경험(experience)과 가정에 의존해 구축한 가상 인물 모형.",description:"작업자의 경험(experience)을 바탕으로 대상자 특성을 구성해 과업 초기 방향성을 설정하는 데 활용하는 도구이다. 실증 조사를 바탕으로 구축하는 정식 퍼소나(persona)의 임시 대안으로 시간, 예산 등 자원이 제한된 초기 단계에서 주로 활용된다. 객관적 데이터 수집 절차를 생략해 잘못된 가설(hypothesis)을 포함할 위험이 있다. 정식 조사 기반 산출물(output)을 대체하기 어려우며 추후 실증 검증을 전제로 제한적 목적으로 도입된다.",same:["프로토 퍼소나"],similar:["애자일 퍼소나","경험 기반 퍼소나"],related:["가설 시나리오","이해관계자 워크숍"]},{id:59,ko:"리빙 랩",en:"Living lab",initial:"ㄹ",definition:"실제 생활 현장을 실험 환경으로 삼아 이용자, 공공기관, 기업, 지역 사회가 협력하여 사회 과제를 함께 탐구하고 해결책을 검증하는 참여형 연구 체계.",description:"일상 공간을 실험 현장으로 삼아 공공기관, 기업, 지역 사회가 협력망을 구축해 사회 과제 해결을 위한 기술과 서비스를 함께 기획, 개발하는 방식으로 운영한다. 참여자가 생활 현장에서 프로토타입(prototype)을 직접 사용해 의견을 제공하고, 연구자는 이를 바탕으로 해결 방향을 도출한다. 이론적 검증을 넘어 문제를 발견하고 현장에 적용할 수 있는 해결책을 도출하는 공동 창출(co-creation) 과정에 중점을 둔다. 이를 통해 산출물(output)의 사회적 수용성을 높이고 공동체 삶의 질 개선에 기여한다.",same:["생활 실험실"],similar:["사용자 참여형 혁신 공간","시민 참여형 혁신 플랫폼"],related:["사회 혁신","공공서비스디자인","공동 창출","사회적 수용","적정 기술"]},{id:60,ko:"리커트 척도",en:"Likert scale",initial:"ㄹ",definition:"제시한 진술문에 대한 대상자의 동의 정도를 수치화하는 측정 척도로, 주로 5점 또는 7점 단계로 구성.",description:"리커트(Likert)가 대상자 태도를 측정하고자 고안한 측정 방식으로, 심리학, 사회과학 등 다양한 분야에서 광범위하게 활용되며 디자인 분야에서도 만족도, 사용성(usability) 등 주관적 경험(experience)을 정량화하는 데 활용한다. 서열 척도 형태를 띠지만 연구 과정에서는 항목 간격이 동일하다고 전제해 등간 척도로 취급한다.",same:[],similar:["등간 척도"],related:["평점 척도","의미 분별 척도","숫자 등급 척도","서열 척도"]},{id:61,ko:"린 원칙",en:"Lean principle",initial:"ㄹ",definition:"낭비를 제거하고 가치 흐름을 최적화하는 원칙에 기반하여 문제를 해결하는 방법론.",description:"도요타 생산 방식에서 유래하였으며 워맥과 존스(Womack & Jones)가 이를 '린'으로 개념화한 이후 제조업을 넘어 소프트웨어 개발, 스타트업 등 다양한 산업 영역으로 확산되었다. 리스(Ries)는 린 원칙을 스타트업에 적용한 린 스타트업으로 발전시켜 최소 기능 제품을 빠르게 개발한 후 고객 반응을 측정·검증하는 빌드-측정-학습 순환 과정을 체계화하였다.",same:["린 방법론","린 사고"],similar:["애자일 방법론","지속적 개선","린 스타트업"],related:["도요타 생산 방식(TPS)","최소 기능 제품(MVP)","빌드-측정-학습","프로토타이핑","반복 설계"]},{id:62,ko:"마이크로 인터랙션",en:"Micro-interaction",initial:"ㅁ",definition:"단일 과업 수행 맥락(context)에서 이용자와 시스템 간에 발생하는 세부 상호작용 요소.",description:`사용자가 제품, 시스템과 교류할 때 특정 과업에 맞춰 수행하는 세부 기능이다. 대상자 행동 및 시스템 상태 변화 등 촉발 조건에 의해 시작되어 정해진 규칙에 따라 실행된다. 시각 효과와 움직임을 활용해 현재 상태를 전달하며 결과를 인지하게 돕는다. 루프¹와 모드²를 포함한 체계적 구조를 바탕으로 시스템과 사용자 간 소통을 지원한다. 

각주
1. 루프(loop): 교류 지속 시간 및 반복 방식을 결정하는 상위 규칙이다.
2. 모드(mode): 데이터 입력 및 설정 변경 등 일반 규칙이 일시적으로 변경되거나 제한되는 특수 상태이다.`,same:["미세 상호작용"],similar:["반응형 요소"],related:["UI 애니메이션","시각적 피드백","어포던스","직관성","감성적 유대","트리거","루프 및 모드","상태 표시","모션 그래픽"]},{id:63,ko:"마인드맵",en:"Mindmap",initial:"ㅁ",definition:"중심 개념으로부터 파생되는 아이디어를 방사형 구조로 연결하여 확장하는 시각적 사고 구조화 도구.",description:"인간의 연상적 사고방식과 유사한 비선형적 체계를 활용하여 복합적인 정보의 계층구조와 연관성을 파악하도록 돕는다. 중심 개념에서 뻗어 나온 하위 항목을 색상, 기호 등을 결합해 아이디어를 구체화하고 사고 확장을 돕는다. 디자인 초기 단계의 아이디어 도출과 개념 정리, 응용 프로그램 구조 설계 등 정보 구조화 작업에서 활용된다.",same:[],similar:["비주얼 씽킹 맵"],related:["개념도","친화도 맵","브레인스토밍","비선형 사고","아이디어 시각화"]},{id:64,ko:"맥락",en:"Context",initial:"ㅁ",definition:"대상자 행동에 의미를 부여하는 시공간 및 사회 문화적 환경을 포괄하는 상황적 조건.",description:"제품 및 서비스 이용 시 특정 행동이 발생한 원인을 파악하게 한다. 동일한 행동도 맥락(context)에 따라 의미와 의도가 달라지므로 경험디자인(experience design) 시 핵심 판단 준거로 작용한다. 현장 관찰과 심층 면접(in-depth interview)을 통해 대상자가 처한 맥락 단서가 파안된다.",same:["컨텍스트"],similar:["사용자 환경","사용 정황","사회 문화적 여건","시공간적 제약"],related:["맥락적 조사","에스노그라피","퍼소나","고객 여정 지도","시나리오"]},{id:65,ko:"맥락적 면접",en:"Contextual interview",initial:"ㅁ",definition:"대상자가 제품 및 서비스를 이용하는 현장을 방문해 행동 관찰과 면접(interview)을 병행하며 경험(experience) 이면의 상황 조건을 파악하는 정성 조사 기법.",description:"에스노그라피(ethnography) 조사 방법론에 기반을 두며, 맥락적 탐구라고도 지칭한다. 통제 환경을 벗어나 대상자가 처한 물리적 및 사회적 환경 내에서 진행해 발화로 드러나지 않는 잠재 문제와 행동 동기를 발견할 수 있다. 반구조화 면접(semi-structured interview) 형식을 활용하며, 관찰한 행동에 5 why 기법 등을 적용해 심층 질문을 수행한다.",same:["맥락적 면접"],similar:["현장 조사"],related:["섀도잉","정성 연구","에스노그라피","현장 연구"]},{id:66,ko:"면접",en:"Interview",initial:"ㅁ",definition:"조사 목적에 부합하는 대상자와 유연하게 설계된 질의응답을 거쳐 표면적 진술 이면에 숨겨진 근본 원인과 미충족 요구를 파악하는 정성 연구 방법.",description:"참여 인원과 형식에 따라 일대일 심층 면접(in-depth interview)이나 포커스 그룹 면접으로 나뉘며 질문의 체계화 수준에 따라 구조화, 반구조화, 비구조화 방식으로 구분한다. 사전 기획된 가이드라인을 바탕으로 개방형 문항과 리커트 척도(Likert scale), 체크리스트 등 폐쇄형 문항을 교차 구성할 수 있다. 면접(interview) 시, 대상자와의 신뢰 관계를 형성해 심층 발화를 촉진하고 연구 윤리를 준수한다.",same:["인터뷰"],similar:["정성 사용자 조사","맥락적 탐구"],related:["질문지","면접자","피면접자"]},{id:67,ko:"면접 질문지",en:"Interview script",initial:"ㅁ",definition:"정성적 조사에서 연구 질문을 면담용 언어로 변환하여 질문의 표현, 순서, 흐름을 구체적으로 작성한 문서.",description:`면접 가이드¹나 면접 프로토콜²로도 불리며, 면접자가 대상자와의 상호작용에 집중하면서도 동일한 정보 영역을 누락 없이 포괄할 수 있도록 돕는다. 라포(rapport) 형성을 위한 시작 질문부터 개방형 질문³·그랜드 투어 질문⁴과 같은 심층 탐색 질문, 종료 문구까지 순서에 따라 배열되며 응답 기록 공간을 포함한 구조화된 문서 형식을 띤다.

각주
1. 면접 가이드(interview guide): 질문할 주제나 개요를 적은 목록으로 순서나 표현을 유연하게 조정할 수 있는 형태이다.
2. 면접 프로토콜(interview protocol): 면접 절차, 규칙, 질문 리스트, 기록 양식 등을 포함하는 포괄적 지침서이다.
3. 개방형 질문(open-ended question): 네·아니오로 대답할 수 없고 대상자가 자기 생각이나 경험을 자유롭게 서술하도록 설계된 질문이다.
4. 그랜드 투어 질문(grand tour question): 특정 공간, 시간, 사건의 흐름을 가이드 투어하듯 전반적으로 묘사해 달라고 요청하는 질문 기법이다.`,same:[],similar:["질문가이드","체크리스트"],related:["설문지","설문","서베이","문항","파일럿 테스트","응답 편향"]},{id:68,ko:"멘탈 모델",en:"Mental model",initial:"ㅁ",definition:"과거 경험(experience)과 지식을 바탕으로 대상의 작동 방식을 예측하고 기대하는 사용자 내면의 인지(cognition) 체계.",description:"새로운 대상을 접할 때 정보를 해석하고 행동 방향을 결정하는 기준이 된다. 제공 환경이 사용자의 멘탈모델(mental model)과 일치할수록 실제 작동 방식과 기대치 사이의 인지적 불일치가 줄어들어 과업 수행이 원활해진다.",same:["심리 모형"],similar:["인지 구조 모델","인지 구조 모형"],related:["사용자 모델","시스템 이미지","직관성","어포던스","학습 용이성","퍼소나","스키마"]},{id:69,ko:"메타 분석",en:"Meta-analysis",initial:"ㅁ",definition:"특정 주제에 관한 다수 문헌의 연구 결과물을 수집하고 통계적 기법을 적용해 하나의 통합된 결론으로 종합함으로써 정밀도와 객관성을 갖춘 근거를 도출하는 통합적 연구 방법론.",description:"기존 개별 연구들을 재분석하는 방법론으로, 주관 개입의 여지가 있는 서사적 검토 방식과 달리 효과 크기 산출 및 다변량 통계 등 수학적 기법을 적용해 연구 간 데이터 이질성과 복잡성을 체계적으로 조정한다. 파편화된 연구 정보를 체계적 지식 구조로 조직화해 기존 연구만으로는 도출하기 어려운 통찰과 함의를 제시한다.",same:[],similar:[],related:["통합적 연구 분석","체계적 문헌 고찰"]},{id:70,ko:"명시적 요구",en:"Explicit needs",initial:"ㅁ",definition:"대상자가 겪는 문제 및 결핍을 인지(cognition)해 언어나 행동으로 표출하는 요구(needs)사항.",description:"결핍 상태를 인지해 외부로 드러내는 요구(needs)사항을 뜻한다. 기능 개선 및 가격 인하 등 표면적 해결책을 바라는 형태를 띠며 설문조사(survey) 및 면담(interview)을 통해 비교적 수집하기 용이하다. 도출한 결과를 바탕으로 서비스의 단점을 보완해 단기적 만족도를 향상할 수 있다. 다만 겉으로 드러난 현상에 국한되므로 차별화된 경험(experience)을 설계하는 데 한계를 지닌다. 따라서 서비스 기획 단계에서 맥락(context) 관찰, 심층 면접(in-depth interview) 등을 병행해 발화 이면에 숨겨진 잠재적 동기와 본질적 목적을 파악하는 단서로 활용한다.",same:["명시적 니즈"],similar:["외재적 요구","직설적 요구","기능적 요구"],related:["사용자 피드백","맥락적 조사","투사적 기법","관찰 섀도잉","에스노그라피"]},{id:71,ko:"모달리티",en:"Modality",initial:"ㅁ",definition:"대상자와 시스템이 상호작용을 하는 과정에서 정보 전달 및 의미 교환에 사용되는 소통 채널의 유형.",description:"시각, 청각, 촉각 등 감각 기관을 거쳐 교환하는 정보 형태와 방식을 뜻한다. 음성 및 동작 등 복수 입력 신호를 통합 해석해 상호작용 환경을 구현하며, 각 소통 방식이 지닌 상호 보완성을 활용해 인지(cognition) 오류를 줄이고, 음성과 동작 신호를 결합해 제스처가 가리키는 방향이나 위치 등 공간적 맥락을 파악하고 의미 해석의 정확도를 향상한다. 대상자의 표현력을 확장하고 시스템 사용성(usability)을 개선한다.",same:[],similar:["감각 채널"],related:["매체","어포던스","멀티모달","상호작용"]},{id:72,ko:"몰입",en:`[1] Flow
[2]Immersion`,initial:"ㅁ",definition:`[1] 대상자가 특정 과업에 완전히 집중하는 심리 상태.
[2] 연구자, 기획자가 조사 대상 환경에 깊이 동화되어 통찰을 도출하는 연구 방법론적 태도.`,description:`[1] 칙센트미하이(Csikszentmihalyi)가 제시한 플로우(flow) 이론에 기반한다. 서비스 및 환경과 상호작용을 하며 시간 흐름을 인지하지 못할 만큼 활동에 완전히 집중하는 현상을 뜻하 디자인 분야에서 긍정적 감정을 촉진하고 사용성(usability)을 높인다.
[2] 연구자와 기획자가 대상자의 상황과 맥락으로 직접 들어가 관찰하고 공감함으로써 표면적 발화로는 드러나지 않는 잠재 요구를 발굴하는 연구 태도이다.`,same:["[1] 플로우","[2] 몰두","이멀전"],similar:["관여도","집중"],related:["현존감","게이미피케이션","인지적 부하 조절"]},{id:73,ko:"무어의 법칙",en:"Moore's law",initial:"ㅁ",definition:"반도체 집적도가 약 2년마다 2배로 증가한다는 기술 성장 속도에 관한 경험적 예측이자 반도체 산업의 발전 방향을 견인한 산업적 준거.",description:"인텔 공동 창업자 고든 무어(Moore)가 1965년 반도체 집적도에 대한 관찰을 토대로 처음 제시하였으며, 1975년 수정 예측을 거쳐 널리 통용되었다. 이후 컴퓨팅 성능 전반이 같은 주기로 향상된다는 해석으로 확장되어 회로 선폭의 미세화를 통해 메모리 반도체 등 핵심 부품의 성능 향상을 촉진하며 기술 산업 성장의 지표로 기능해 왔다. 디자인에서 기술적 맥락을 이해하는 주요 참조 개념으로 다루어진다.",same:[],similar:["황의 법칙","쿠르츠와일의 법칙","기술 가속"],related:["반도체 집적도","트렌지스터","도요타 생산 방식(TPS)","디지털 전환","컴퓨팅 비용 절감"]},{id:74,ko:"무장애 디자인",en:"Barrier free design",initial:"ㅁ",definition:"사회적 약자가 겪는 물리적·심리적 장벽을 제거하여 안전하고 편리한 이용 환경을 조성하는 디자인.",description:"장애인, 고령자 등 신체적, 인지적 기능 제한이 있는 대상자가 겪는 불편을 해소하고자 환경 내 방해 요소를 제거하는 디자인 접근법이다. 건축 및 도로 같은 물리 공간을 넘어 디지털 기기 인터페이스 및 정보 접근성 영역까지 적용 범위를 확장해 보편적 이용 환경을 보장한다. 건축, 도로 같은 물리 공간을 넘어 디지털 기기 인터페이스 및 정보 접근성 영역까지 적용 범위를 확장하며, 누구나 제약 없이 참여할 수 있는 보편적 이용 환경을 보장한다.",same:["배리어 프리 디자인","장벽 없는 디자인"],similar:["유니버설 디자인","포용적 디자인"],related:["사회적 약자","접근성","이동권 보장","보조 공학","고령 친화 디자인"]},{id:75,ko:"물리적 서비스스케이프",en:"Physical servicescape",initial:"ㅁ",definition:"대상자와 서비스 제공자 간 상호작용이 발생하는 물리적 환경 요소로, 오감을 자극해 서비스 경험 품질 인식과 행동에 영향을 미치는 공간적 맥락.",description:"비트너(Bitner)가 체계화한 개념으로 서비스가 생산되고 소비되는 장소와 시설을 의미한다. 디지털 환경에서 이루어지는 가상 교류와 대비되는 현실 세계의 물리적 접점(touchpoint)이다. 온도, 소음, 조명 등을 포괄하는 주변 조건, 공간 배치와 기능성, 기호와 상징물 등 인공물의 세 가지 차원으로 구성된다. 대상자와 직원이 상호작용을 하는 바탕이 되며, 전반적인 경험 품질을 평가하는 단서로 기능한다.",same:["물리적 서비스 환경"],similar:["접점","환경 디자인","리테일 환경"],related:["주변 조건","공간적 배치 및 기능성","기호/상징 및 조형물","앰비언스"]},{id:76,ko:"물리적 어포던스",en:"Physical affordance",initial:"ㅁ",definition:"물리적 외형 특성을 바탕으로 대상자의 특정 행위를 유도하며 직관적 조작 방식을 암시하는 디자인 기제.",description:"노먼(Norman)의 어포던스(affordance) 논의에서 분화된 개념으로 하트슨(Hartson)이 물리적 어포던스(physical affordance)로 명명하고 체계화하였다. 제품, 공간 등 서비스 제공 환경이 지닌 형태적 특성을 활용해 대상자의 구체적인 행동을 자연스럽게 이끌어내는 원리이다. 돌출된 형태, 재질, 크기 등 시각과 촉각 단서를 통해 사용 방식을 직관적으로 전달하며, 사전 학습 없이도 기능을 파악하고 시스템과 상호작용을 하도록 돕는다. 이를 통해 대상자의 인지 부하(cognitive load)를 줄이고 행동 오류를 방지한다.",same:["물리적 행동 유도성","실체적 어포던스"],similar:["지각된 어포던스","내재적 어포던스","촉각적 단서"],related:["인간공학적 설계","햅틱 인터페이스","기표"]},{id:77,ko:"미시적 관점",en:"Micro perspective",initial:"ㅁ",definition:"대상자와 제공 환경 사이에서 발생하는 단일 접점(touchpoint) 단위의 교류를 분석해 경험(experience) 흐름을 파악하는 분석 방식.",description:"전체 시스템 구조보다 단일 대상자가 한정된 상황에서 겪는 인지(cognition) 과정과 행동 변화를 탐구하는 데 집중한다. 제공자와 이용자 사이에서 일어나는 상호작용 패턴을 추적해 경험 구성 방식을 파악한다. 주변 환경을 지각해 의미를 구성하는 주체적 선택 과정을 파악한다.",same:[],similar:["상향식 접근"],related:["거시적 관점"]},{id:78,ko:"밀러의 법칙",en:"Miller's law",initial:"ㅁ",definition:"인간의 단기 기억이 한 번에 파지할 수 있는 정보 덩어리의 수가 7±2개로 제한된다는 인지심리학적 원리.",description:"인지심리학자 조지 밀러(Miller)가 1956년 논문 「마법의 숫자 7, 더하거나 빼기 2」(The Magical Number Seven, Plus or Minus Two)에서 처음 제시한 경험적 연구로, 인간 인지(cognition) 용량의 한계를 규명하였다. 정보를 의미적 연관성에 따라 하나의 단위로 묶는 청킹을 활용하면 인지 부하(cognitive load)를 줄여 정보 처리의 효율을 높일 수 있다. 디자인에서는 내비게이션 항목 수 제한, 메뉴 구조화, 정보 그룹핑 등 사용자 인터페이스 및 정보 구조 설계 원칙으로 적용된다.",same:["마법의 숫자 7","7±2 법칙"],similar:["인지 부하 이론","작업 기억","힉의 법칙"],related:["청킹","단기 기억","정보 구조 설계","내비게이션 설계","인지 부하","사용자 인터페이스 설계"]},{id:79,ko:"바디스토밍",en:"Bodystorming",initial:"ㅂ",definition:"실제와 유사한 환경을 조성하고 신체를 활용해 물리적 탐색을 수행해 개념을 구체화하는 체험형 발상 방법론.",description:"현실 상황 재현 및 환경 모사를 바탕으로 기획자와 참여자의 몰입을 촉진하는 과정이다. 소품을 활용해 시나리오 기반 동작 실험을 수행하며, 관찰을 거쳐 물리적 제약을 파악하고 개선점을 도출한다. 머릿속 구상에 머무르지 않고 실제 행동 패턴을 분석해 아이디어를 검증하고 대안을 탐색한다. 진행 과정을 영상과 사진으로 기록해 추후 분석의 근거로 삼는다.",same:["체험적 아이데이션","신체 기반 브레인스토밍"],similar:["서비스 역할놀이"],related:["시나리오","경험 프로토타이핑"]},{id:80,ko:"반구조화 면접",en:"Semi-structured interview",initial:"ㅂ",definition:"사전에 설정한 문항 및 주제를 토대로 진행하며 대상자 반응과 현장 상황에 맞춰 순서와 형식을 조절해 대화를 확장하는 정성 조사 기법.",description:"정해진 틀을 따르는 구조화 방식과 제약이 없는 비구조화 방식의 특성을 결합한 혼합 형태이다. 사전 지침을 바탕으로 조사 목적을 유지하며 흐름에 맞춰 문항을 가감하고 새로운 의제를 탐색한다. 대상자 발화를 촉진해 경험과 잠재적 요구(latent needs) 심층적으로 파악한다.",same:["반구조화 인터뷰"],similar:[],related:["구조화 면접","비구조화 면접"]},{id:81,ko:"반응형 인터페이스",en:"Responsive interface",initial:"ㅂ",definition:"사용자가 접속하는 기기 화면 규격 및 해상도에 맞춰 정보 배치 및 구성요소를 조정해 일관된 교류 환경을 제공하는 디자인 방식.",description:"화면 전환 기준점 및 격자 체계를 바탕으로 접속 매체 조건에 맞는 화면 구조를 구현한다. 시각 탐색 경로를 고려해 구성요소 노출 우선순위를 결정하며, 환경 유연성을 확보해 단절 없는 서비스 이용을 돕는다. 접근 형태에 구애받지 않고 동일한 가치와 편의를 전달한다.",same:["가변형 인터페이스"],similar:["반응형 웹 디자인","적응형 인터페이스"],related:["모바일 퍼스트","미디어 쿼리","가변 그리드","뷰포트","중단점"]},{id:82,ko:"범죄예방 디자인",en:"CPTED design",initial:"ㅂ",definition:"도시 환경 디자인을 통해 범죄 유발 요인을 제거하고 범죄를 예방하는 접근 방식.",description:"도시 생활 공간에 존재하는 위험 요소를 분석하고 물리적 환경 설계를 통해 범죄 가능성을 사전에 차단하는 공공디자인(public design)의 한 형태이다. 조도를 높이거나 시야 차단물을 제거해 감시 기능을 강화하는 물리적 개선을 포함하며, 단순 시설 보수를 넘어 거주자 간 교류를 촉진해 사회적 안전망을 형성한다. 낙후 구역에 개입해 거주자 불안을 해소하고 관계망 복원을 병행함으로써 정주 여건을 개선한다.",same:["셉테드 디자인"],similar:["공공 안전 디자인","방범 디자인"],related:["사회 혁신 디자인","깨진 유리창 이론","상황적 범죄예방","영역성 강화","공동체 활성화"]},{id:83,ko:"비주얼 스토리텔링",en:"Visual storytelling",initial:"ㅂ",definition:"시각 매체를 활용하여 정보와 경험(experience)을 직관적으로 전달하는 기법.",description:"단순한 대상의 재현을 넘어 기호와 상징을 통해 서사(narrative)와 의미를 전달하는 소통 방식으로, 시각 매체가 이야기를 이끌며 수용자의 직관적 이해와 상상력을 자극한다. 복잡한 개념이나 추상적 아이디어를 시각화해 이해관계자(stakeholder) 간 소통을 돕는다.",same:[],similar:["비주얼 내러티브","비주얼 커뮤니케이션","디지털 스토리텔링"],related:["메타포","기호학","비주얼 랭귀지","시각적 계층 구조","스토리보드","비주얼 메타포"]},{id:84,ko:"브레인스토밍",en:"Brainstorming",initial:"ㅂ",definition:"자유로운 분위기 속에서 비판 없이 자유 발상과 연상 작용을 통해 다양한 아이디어를 최대한 도출하는 창의 발상 기법.",description:`비판 금지, 독창적 의견 수용, 다량 도출과 결합 확장을 기본 원칙으로 삼으며, 시각적 도구를 활용해 아이디어를 가시화한다. 아이디어에 대한 심리 장벽 완화를 위해 도입부에서 브레인덤프¹를 병행할 수 있다. 개인 단위로 수행하거나 집단으로 진행할 수 있으며, 집단으로 진행할 경우 진행자가 의제 이탈을 방지하고 참여자 간 교류를 촉진해 개념 조합을 이끈다.
각주
1. 브레인덤프(brain dump): 구상 초기 단계에 제한 시간 내에 보유한 생각을 기록하는 활동. 사고 흐름을 방해하는 자기 검열을 제어하고 발상의 단초를 확보하는 준비 과정이다.`,same:[],similar:["아이디에이션","발산적 사고"],related:["브레인라이팅","어피니티 다이어그램"]},{id:85,ko:"비즈니스 모델",en:"Business model",initial:"ㅂ",definition:"기업이 목표 고객에게 가치 제안을 제공하고, 수익 구조를 통해 해당 활동을 지속적으로 유지하는 전략적 운영 체계",description:"가치 제안, 수익 구조, 핵심 자원, 고객 관계 등 서로 연결된 구성요소로 이루어지며, 경제적 가치와 고객 가치를 통합적으로 실현하는 경영 체계이다. 서비스디자인(service design)에서는 서비스의 가치 구조를 분석하고 혁신 기회를 탐색하는 준거로 활용되며, 오스터왈더(Osterwalder)와 피뇨르(Pigneur)의 비즈니스 모델 캔버스가 대표적 분석 도구로 쓰인다.",same:["BM","수익 모델"],similar:["서비스 모델","운영 모델","가치 창출 모델"],related:["비즈니스 모델 캔버스","가치 제안","수익 구조","서비스디자인","가치 흐름","린 스타트업","이해관계자"]},{id:86,ko:"사례 연구",en:"Case study",initial:"ㅅ",definition:"현상과 맥락(context)의 경계가 불분명한 대상을 실제 발생 환경 안에서 깊이 있게 탐구해 지식을 확장하는 맥락 기반 경험적 연구 방법",description:"인(Yin)의 학술적 정의에 따르면, 일반 통계로 파악하기 어려운 맥락(context) 지식을 도출하기 위해 특정 현상을 실제 발생 환경 내에서 깊이 파악하는 접근 방식이다. 개인 및 조직 등 분석 단위를 설정해 정성과 정량 데이터를 수집하고 분석한다. 다각적으로 수집한 데이터를 교차 검증해 결과의 타당성을 확보하며, 통제된 실험 환경과 달리 현실의 복잡성을 수용해 대상의 본질을 규명한다.",same:["케이스 스터디"],similar:["사례 조사","질적 사례 조사"],related:["사례 조사지","분석 프레임워크"]},{id:87,ko:"사례 분석",en:"Case analysis",initial:"ㅅ",definition:"일상에서 접하는 서비스, 제품 사례 등 이미 발생한 사건이나 상황을 탐색, 수집하고 분석하는 활동.",description:"실제로 적용된 방식을 파악하는 현장 탐색 과정이다. 표면적 형태 관찰에 그치지 않고 문헌 연구에서 도출한 객관적 틀을 적용해 문제 원인을 진단하고 개선안을 도출하며, 서비스 동향과 패턴을 파악한다. 맥락(context)의 심층 탐구를 지향하는 사례 연구(case study)와 구별되며, 주로 사례 수집과 비교 분석에 중점을 둔다.",same:[],similar:["레퍼런스 조사","경쟁사 분석"],related:["데스크 리서치"]},{id:88,ko:"사변적 디자인",en:"Speculative design",initial:"ㅅ",definition:"기술 발전이 초래할 파급력을 탐구하고 가상의 시나리오와 모형을 활용해 의문을 제기하며 사회 논의를 촉발하는 디자인 접근 방식.",description:"현재 기술 및 사회 조건을 바탕으로 가상 시나리오를 구성해 다가올 변화를 탐구한다. 상업 과제 해결에 집중하는 전통 방식과 달리 사회 및 윤리 쟁점을 가상 모형으로 시각화해 제시하며, 기술 도입이 일상에 미치는 영향을 묻고 성찰을 촉진한다. 기술이 지닌 이면과 부작용을 드러내 공론화를 이끌고 바람직한 미래상 모색을 촉구하며 기술 개발 방향을 재설정하는 계기를 제공한다. 확정된 해답을 제시하기보다 논의해야 할 화두를 던지는 사유 도구로 기능한다.",same:["스페큘레이티브 디자인"],similar:["비판적 디자인","디자인 픽션"],related:["미래의 원뿔","다이제틱 프로토타입","프로보토타입","윤리적 디자인","사회적 담론"]},{id:89,ko:"사람 중심 디자인",en:"People-centered design",initial:"ㅅ",definition:"인간을 인지적, 생리적 기능을 수행하는 보편적 사용자로 규정하는 것을 넘어, 고유한 삶의 서사와 복잡한 감정, 사회적 관계망을 가진 전인적 존재로 바라보는 접근 방식.",description:`전문가가 사전에 정의된 인간공학적 데이터를 기반으로 해결책을 제공하는 방식과 달리, 대상자의 삶에 내재된 잠재적 욕구(latent needs)와 사회적 행동 양식을 탐구하는 과정이다. 언어적 소통의 한계를 넘어 면접 조사, 조형 활동 등 다양한 발현 매개체¹를 활용해 개인의 일상적 경험(experience)과 이를 둘러싼 사회적 관계망을 입체적으로 파악한다. 디자이너는 해결책의 제시자가 아닌 조력자 역할을 수행하며, 대상자가 자신의 문제와 열망을 드러낼 수 있도록 돕는다.

각주
1. 발현 매개체(expressive tools): 언어 및 문자로 의사를 전달하기 어려울 때 사진 및 모형 등을 이용해 내면의 생각을 구체화하도록 돕는 수단이다.`,same:[],similar:["인간 중심 디자인","사용자 중심 디자인","고객 중심 디자인"],related:["공공디자인","커뮤니티디자인","공공서비스디자인","포용적 디자인","유니버설 디자인","참여 디자인"]},{id:90,ko:"사용성",en:"Usability",initial:"ㅅ",definition:"사용자가 특정 환경에서 목적을 달성하는 과정에서 나타나는 효과성, 효율성, 만족도를 포괄하는 품질 속성.",description:"효과성은 과업의 완수 여부를, 효율성은 목적 달성에 투입되는 자원의 적절성을, 만족도는 사용 과정에서 나타나는 주관적 반응을 가리킨다. 학습 용이성, 오류 발생률, 오류 회복 가능성 등이 사용성 평가(usability evaluation)의 항목으로 활용된다.",same:[],similar:["유용성","직관성","학습 용이성","기억 용이성","효율성"],related:["사용성 테스트","제이콥 닐슨의 10가지 휴리스틱","정서적 만족도","인지적 부하","어포던스"]},{id:91,ko:"사용성 평가",en:"Usability evaluation",initial:"ㅅ",definition:"사용자가 제품 또는 프로토타입(prototype)을 대상으로 사전에 설계된 과업을 수행하는 과정에서 사용성(usability) 목표의 달성 수준을 진단하고 측정하는 평가 방법.",description:"ISO 9241-11이 규정한 효과성, 효율성, 만족도를 주요 측정 지표로 활용한다. 평가 목적에 따라 형성적 평가와 총괄적 평가로 구분된다. 형성적 평가는 기획 및 개발 과정 전반에서 반복적으로 수행되며, 사용성(usability) 문제를 파악하고 개선 방향을 도출하는 데 목적이 있다. 총괄적 평가는 개발 완료 단계 또는 출시 이후에 최종 결과물의 사용성 수준을 정량적으로 검증하는 데 목적이 있다.",same:["UT"],similar:["사용자 경험 평가","휴리스틱 평가","인지적 워크스루"],related:["형성적 평가","총괄적 평가","효과성","효율성","만족도","소리 내어 생각하기","과업 시나리오","프로토타입"]},{id:92,ko:"사용자",en:"User",initial:"ㅅ",definition:"제공된 서비스 및 기기와 상호작용을 하며 고유한 생활 맥락(context) 및 잠재 욕구를 지닌 이용 주체.",description:"특정 환경 및 대상물과 상호작용을 하며 고유한 행동 양식을 보이고, 기획 방향성의 준거로 기능한다. 퍼소나(persona) 설정 및 행동 모델링 기법을 적용해 명시적 또는 잠재적 요구(latent needs)와 행동 동기를 파악하기 위한 대상이 되며, 그들로부터 수집된 맥락(context)과 행동 데이터는 이용 경험(experience) 최적화의 준거로 활용된다. 해결책을 먼저 요구하는 선도 사용자와 이례적 행태를 보이는 극단적 사용자는 서비스 개선 단서를 제공한다.",same:["유저","이용자"],similar:["고객","소비자"],related:["퍼소나","사용자 경험","리드 사용자","엔드 유저"]},{id:93,ko:"사용자 경험",en:"User experience",initial:"ㅅ",definition:"사용자가 제공물 및 서비스와 상호작용을 하는 전 과정에서 나타나는 감정, 태도, 행동 아우르는 반응 체계.",description:"동일한 제공물에 대해서도 개인이 처한 환경과 맥락(context)에 따라 다른 경험이 형성된다. 기능 작동 여부나 조작 효율성에 국한되지 않으며, 감정, 태도, 행동을 포괄한다. 서비스디자인(service design) 관점에서는 접점(touchpoint)을 아우르는 여정 전체를 다루며, 사용자가 서비스와 맺는 관계의 총체로 이해된다. 이러한 긍정적 경험의 축적은 브랜드와의 정서적 유대 형성으로 이어진다.",same:["UX"],similar:["고객 경험(CX)","서비스 경험","브랜드 경험","사용자 체감 품질"],related:["멘탈 모델","감성 경험","사용성","상호작용"]},{id:94,ko:"사용자경험(UX)디자인",en:"User experience design",initial:"ㅅ",definition:"사용자가 제공물 및 시스템과 상호작용을 하는 과정을 기획 및 디자인하고, 사용자의 요구(needs)를 파악해 해결책을 제시하는 디자인 분야",description:"제공물 및 기기 체계와 상호작용하는 과정 전반을 기획하는 활동이다. 외형 구성을 넘어 대상자가 지닌 심리 및 행동 동기를 분석해 잠재 욕구(latent needs)를 파악하는 단계에서 출발한다. 기술 구현 가능성 및 조작 편의성을 바탕으로 가설(hypothesis)을 설정하고 실사용자 의견을 수렴해 검증 과정을 거친다. 단순 기능 구현을 벗어나 목적 달성을 돕는 조작 체계 및 인터페이스 구조를 디자인한다.",same:["UX 디자인","사용자 중심 디자인"],similar:["인간 중심 디자인","사용자 인터랙션디자인","서비스디자인","사용자인터페이스(UI)디자인"],related:["사용자 인터페이스","고객 여정 지도","정보 구조"]},{id:95,ko:"사용자 모델링",en:"User modeling",initial:"ㅅ",definition:"사용자의 특성을 파악하고 구조화하여 시스템과 사용자 간 상호작용을 이해하는 분석 활동.",description:`정적 정보¹와 동적 정보²를 수집해 사용자 지식, 능력, 행동 양식을 정의한다. 수집된 정보에 내재된 의도 및 정서 상태를 파악하는 추론 과정을 수반한다. 인간-컴퓨터 상호작용 분야 초기에는 확률적 추론³을 적용해 불확실한 수치를 바탕으로 요구(needs)를 예측하는 용도로 활용됐다. 서비스 기획 영역에서는 퍼소나(persona), 멘탈 모델(mental model) 등 실무 도구를 도출하는 기반이 된다. 

각주
1. 정적 정보(static information): 성별, 국적, 직업 등 시간이 지나도 변하지 않는 사용자 고유 정보이다.
2. 동적 정보(dynamic information): 접속 위치, 탐색 경로, 검색어 등 상황에 따라 실시간으로 변동하는 행동 데이터이다.
3. 확률적 추론(probabilistic inference): 수집 데이터가 부족한 상황에서 사용자가 특정 항목을 원할 확률을 수치화해 예측하는 기법이다.`,same:[],similar:["UX 모델링","사용자 프로파일링"],related:["멘탈 모델","행동 모델링","퍼소나","사용자 아키타입"]},{id:96,ko:"사용자인터페이스(UI)디자인",en:"User interface design",initial:"ㅅ",definition:"사용자가 디지털 환경과 상호작용을 하도록 화면의 시각 요소와 구조를 다루는 디자인 분야.",description:`기획된 경험(experience)에 시각적 구체성을 부여해 기기와 소통하는 환경을 조성하는 과정이다. 각 요소가 인지적 오류 없이 기능하도록 구조를 정의하고, 버튼·서체·색상 등 화면을 구성하는 그래픽 요소를 구현하며, 디자인 시스템¹을 구축하여 정보 흐름을 전달하고 목적 달성을 위한 행동을 지원한다.

각주 
1. 디자인 시스템(design system): 일관성 유지와 협업을 위해 재사용 가능한 시각 요소나 패턴 및 지침 등을 문서화한 통합 관리 체계이다.`,same:[],similar:["그래픽 사용자 인터페이스(GUI) 디자인","웹 디자인","모바일 디자인"],related:["사용자경험(UX)디자인","인터랙션디자인","디자인 시스템","반응형 UI","시각적 위계"]},{id:97,ko:"사용자 조사",en:"User research",initial:"ㅅ",definition:"제공물 및 서비스와 상호작용을 하는 사용자의 행동 양식, 반응, 맥락(context)을 파악해 기획 및 개선의 근거를 마련하는 실증적 조사 활동.",description:"실제 환경과 통제된 환경에서 정성적, 정량적 방법론을 목적에 따라 적용해 데이터를 수집한다. 수집된 데이터는 사용자의 인지(cognition)와 행동 특성을 분석하고 문제점 도출의 근거로 활용된다. 기획 초기 단계의 방향 설정부터 구현 결과물의 검증까지 디자인 과정 전반에 걸쳐 적용된다.",same:["유저 리서치"],similar:["수요자 조사","사용성 테스트","사용자 행태 분석","현장 조사"],related:["맥락적 조사","퍼소나","관찰 조사","사용자 여정"]},{id:98,ko:"사용자 평가",en:"User evaluation",initial:"ㅅ",definition:"개발된 제공물 및 구현물이 사용자의 욕구 및 이용 맥락(context)에 부합하는지 검증하는 조사 활동.",description:"기획 중·후반 단계에서 수립된 가설(hypothesis) 및 구현 결과물의 적합성을 확인하는 데 목적이 있다. 사용성 테스트, 전문가 검토, 접근성 평가, A/B 테스트 등 검증 목적 및 모형 완성도에 따라 적절한 방법론을 적용한다. 정성 조사와 정량 조사를 병행하거나 단계에 따라 순차적으로 활용하며, 도출된 문제점을 진단해 개선 우선순위를 설정하는 근거로 기능한다.",same:["사용자 테스트","유저 테스트"],similar:["사용성 테스트","사용성 평가"],related:["프로토타입","측정 지표","태스크"]},{id:99,ko:"사회적 서비스스케이프",en:"Social servicescape",initial:"ㅅ",definition:"제공 공간 내 존재하는 인원과 상호작용을 포괄하는 환경 요인이며 물리적 구성을 넘어 이용 경험(experience)과 만족도에 영향을 미치는 인적 환경 요인의 총체.",description:"기존 서비스스케이프(servicescape) 개념을 확장해 가시적 형태에 국한된 공간 개념을 넘어, 체류 인원과 상호작용을 포괄하는 인적 환경을 지칭한다. 서비스 제공자와 이용자 간 관계, 공간을 공유하는 타인의 존재, 밀도, 행동 특성까지 아우른다. 인적 단서를 통해 장소의 정체성을 인지하고 타인과의 유사성을 비교하며 제공물의 가치를 평가하게 된다. 물리적 시설물 구축을 넘어 인원 간 교류가 창출하는 무형의 요소를 디자인의 대상으로 다루는 관점을 제시한다.",same:[],similar:["사회적 서비스 환경","인적 서비스 환경"],related:["사회적 환경","사회적 단서","서비스 접점","공동 가치 창출","고객 간 인터랙션","사회적 밀도"]},{id:100,ko:"사회적 인터랙션",en:"Social interaction",initial:"ㅅ",definition:"타인 및 기술 매개체와 관계를 구축하는 과정에서 수반되는 행동 양식과 심리 반응.",description:"사람 간 교류를 비롯해 기술 발전으로 등장한 로봇 및 인공지능 등 지능형 객체와 교감 과정을 포괄한다. 언어 소통과 상황에 적합한 역할 수행을 통해 상호 존재감을 인지(cognition)하고 관계망을 형성한다. 서비스 기획과 심리 연구 영역에서는 해당 양식을 분석해 자연스러운 관계 형성을 지원하는 디자인 대상으로 다루며, 디자인 영역에서는 사람과 지능형 객체 간 상호작용 양식을 분석해 이를 인터페이스 및 경험 구조 디자인에 활용한다.",same:["사회적 상호작용"],similar:["대인 인터랙션","관계적 소통","사회적 교류"],related:["상호호혜성","사회적 자본","사회적 존재감","공동의 관심사","공감","역할 수행","커뮤니티디자인"]},{id:101,ko:"사회적 협업 모델",en:"Social collaboration model",initial:"ㅅ",definition:"다수 주체가 정보를 교환하고 행동을 조율해 공동 목표를 달성하는 구조적 틀.",description:"다수 주체가 과업을 분담하고 의견 수렴과 정교화 단계를 거쳐 이견을 조율하며 공통 인식을 유지하는 순환 구조를 기반으로 한다. 행동 투명성과 의사결정 가시성을 확보해 참여자 전반이 공유하는 멘탈 모델(mental model)을 형성한다. 서비스디자인(service design) 영역에서는 개별 기여가 전체 산출물(output)로 환원되는 구조를 설계해 참여자 주도의 가치 생성과 지식 융합을 지향한다.",same:["사회적 협력 모델"],similar:["민관 협력 거버넌스"],related:["공동 창출","컬렉티브 임팩트","오픈 이노베이션"]},{id:102,ko:"산점도",en:"Scatter plot",initial:"ㅅ",definition:"두 측정 지표 간의 연관성을 파악하고자 직교 좌표 상에 데이터를 점으로 표시해 시각화하는 분석 기법.",description:"사용자 조사(user research) 및 사용성 평가(usability testing)를 통해 수집한 수치 데이터의 분포 형태를 직관적으로 파악하는 데 활용한다. 가로축과 세로축에 각 지표를 배정하고 점의 분포 양상을 관찰해 양 및 음의 상관관계 혹은 무관성을 확인한다. 군집 형태와 이상치를 식별해 사용자 특성을 분석하는 기반을 마련한다.",same:["산포도","분산형 그래프","스캐터 차트"],similar:["데이터 시각화"],related:["이상치","상관계수","변수","상관 분석","회귀 분석"]},{id:103,ko:"산출물",en:"Output",initial:"ㅅ",definition:"디자인 과업 전반에 걸쳐 도출되는 가시적 형태의 인공물로, 물리적 기기, 디지털 환경, 서비스 체계가 결합한 통합 시스템을 아우르는 결과물.",description:"수행 단계에 따라 형태를 달리하며 완성된다. 조사, 형상화, 기획 등 각 단계에서 해당 목적에 부합하는 형태로 산출된다. 구축된 실체 자체를 의미하며, 해당 매개체가 형성하는 파급력과 효용을 뜻하는 성과와 구분된다.",same:["딜리버러블"],similar:["결과물","성과"],related:["최종 보고서","마일스톤","프로토타입","증거물"]},{id:104,ko:"섀도잉",en:"Shadowing",initial:"ㅅ",definition:"조사 대상의 동선을 동행하며 일상 환경 내에서 발생하는 행동과 경험(experience)을 관찰해 잠재적 요구(latent needs) 및 시사점을 도출하는 현장 조사 기법.",description:"대상자의 이동 경로와 시간 흐름에 따라 비노출 또는 동행 형태로 주변 환경과의 상호작용과 정서 변화를 포착한다. 유사한 맥락을 공유하며 표면적으로 드러나지 않는 불편 지점(pain point)와 이용 양상을 파악하는 데 활용된다. 사생활 침해 소지가 있어 사전 윤리적 동의 절차가 수반되며, 영상 기기 등 기록 도구를 활용해 현장 상황을 수집한다. 수집된 맥락적 단서를 바탕으로 숨은 문제점을 발견하고 개선 방향의 도출의 근거 자료로 활용된다.",same:[],similar:["비참여 관찰","밀착 관찰","동행 관찰"],related:["맥락적 면접"]},{id:105,ko:"서사",en:"Narrative",initial:"ㅅ",definition:"이용자 경험(experience)의 시간 흐름 속 사건들을 인과관계로 엮은 구조화된 이야기로, 이용자의 정서적 반응을 유발해 관계를 형성하는 디자인 도구이자 내적 표상.",description:"이용자가 이용 과정에서 겪는 개별 사건을 논리적 연결고리로 엮어낸 구조적 맥락(context)을 지칭한다. 기능적 정보 나열을 넘어 시각 자극 및 상호작용 요소와 결합해 인지적 몰입을 촉진하며 행위의 의미를 해석해 내적 인지(cognition) 체계를 구축하는 계기를 마련한다. 서비스디자인(service design) 영역에서는 흩어진 단편적 요소들을 일관된 방향으로 통합해 유의미한 맥락(context)을 제공하는 프레임워크(framework)로 다루며, 정서적 교감을 촉진해 제공 주체와 이용자 간 지속적인 유대 관계 형성을 지원한다.",same:["내러티브"],similar:["이야기","줄거리","스토리텔링","시나리오","플롯"],related:["퍼소나","스토리보드","고객 여정","인과관계","맥락","내적 표상","감정적 몰입"]},{id:106,ko:"서비스",en:"Service",initial:"ㅅ",definition:"제공자가 수혜자에게 무형의 가치와 혜택을 전달하는 행위이자 과정.",description:"물리적 제품과 달리 무형성, 이질성, 비분리성, 소멸성을 특징으로 한다. 과거에는 용역 개념에 한정되었다. 현대에는 유무형 요소가 결합해 총체적 경험(experience)을 제공하는 시스템으로 확장되었고, 관계를 기반으로 고객의 문제를 해결하고 가치를 형성하는 과정으로 이해된다.",same:[],similar:["경험","오퍼링","무형자산"],related:["IHIP 특성","서비스 청사진","접점","가치 공동 창출"]},{id:107,ko:"서비스디자인",en:"Service design",initial:"ㅅ",definition:"고객이 서비스를 이용하는 모든 맥락(context)과 접점에서의 경험(experience)을 총체적으로 분석하고 설계하는 디자인 분야이자 학문.",description:"이용 과정과 상호작용 접점(touchpoint)을 파악해 고객에게 유의미한 경험(experience)을 제공 조직에는 효율적 운영 체계를 구축하는 디자인 활동이다. 인간 중심 철학과 맥락(context) 기반 조사를 바탕으로 여러 이해관계자(stakeholder)의 요구(needs)를 조율하며 공동 참여 방법론을 적용한다. 무형의 과정을 시각화하거나 프로토타입(prototype)으로 실체화해 문제점을 발견하고 개선안을 도출하며, 경영, 심리 등 인접 학문과 결합한 다학제적 접근을 취한다. 고객과 서비스 제공 주체 모두에게 효용을 제공해 서비스 생태계(service ecosystem)를 형성한다.",same:[],similar:["고객 경험 관리","사용자경험(UX)디자인"],related:["서비스 청사진","접점","공동디자인","이해관계자 지도","다학제적 협업"]},{id:108,ko:"서비스디자인 도구 모음",en:"Service design toolkit",initial:"ㅅ",definition:"서비스를 기획, 개선, 개발하는 과정에서 활용되는 방법론, 템플릿, 가이드 등의 체계적 디자인 도구모음(design toolkit).",description:"인간 중심 철학 및 디자인사고(design thinking)을 바탕으로 프로젝트 단계별 주요 요인을 분석하고 해결책 도출을 지원하는 길잡이 역할을 한다. 조사 및 분석, 아이디어 발산, 구체화 등 각 단계의 목적에 따라 적합한 도구를 선택적으로 적용하며, 제조업의 서비스화(servitization)를 비롯한 산업 구조 변화 등 다양한 영역에 걸쳐 활용된다.",same:["서비스디자인 툴킷"],similar:["서비스디자인 키트"],related:["퍼실리테이션","공동디자인","공동창출"]},{id:109,ko:"서비스 로드맵",en:"Service roadmap",initial:"ㅅ",definition:"수혜자 요구(needs)사항을 충족하고자 제공물의 개발, 전달, 진화 과정을 단기 및 중장기 시간 흐름에 따라 시각화하는 전략 도구.",description:"단일 일정표를 넘어 제품-서비스 통합(product-service system, PSS) 체계 관점에서 구성 요소와 기술 연계 방안을 종합해 작성한다. 초기 서비스 구현부터 시범 운영, 최종 출시에 이르는 전 과정을 포괄한다. 해당 기간에 투입되는 자원을 산정하고 운영 조직 인수인계 절차 및 유통 방안과 소통 전략을 명시해 이해관계자(stakeholder) 간 정보 공유와 실행 계획의 근거로 기능한다. 단기 및 중장기 목표를 연계해 환경 변화에 대응하고 일관된 경험(experience)을 유지하는 디자인 방향을 제시한다.",same:["서비스 전략 로드맵"],similar:["경험 로드맵","제품 로드맵"],related:["최소 기능 제품(MVP)","마일스톤","제품-서비스 시스템(PSS)"]},{id:110,ko:"서비스 모델링",en:"Service modelling",initial:"ㅅ",definition:"무형의 서비스 프로세스와 시스템을 구체적으로 구조화하고 시각화하는 방법론.",description:"서비스를 구성하는 요소, 흐름, 관계를 구조화해 가시적 형태로 표현하는 활동이다. 서비스 청사진(service blueprint), 서비스 시스템 지도(service system map), 이해관계자 지도(stakeholder map) 등 목적과 분석 범위에 따라 다양한 도구를 선택적으로 적용한다. 고객 경험과 이를 뒷받침하는 조직 구조, 운영 프로세스를 통합적으로 파악해 잠재적 문제점을 발견하거나 새로운 서비스 구조를 제안하는 근거로 활용된다.",same:[],similar:["서비스 흐름도"],related:["가시선","상호작용선","전방 영역","후방 영역"]},{id:111,ko:"서비스 브리프",en:"Service brief",initial:"ㅅ",definition:"기획 및 개발 전반에 걸쳐 이해관계자(stakeholder)의 요구(needs), 목표, 제약 조건 등을 합의해 기록한 문서로, 창의적 문제 해결의 방향성을 제시하고 산출물(output)의 타당성을 판단하는 준거 지표.",description:"제안 요청서를 바탕으로 초기 착수 시점에 작성하거나, 탐색 조사를 거쳐 문제를 정의한 후 세부 방향성을 수립하는 등 각 단계의 목적에 따라 유연하게 작성된다. 조직 배경, 목표 시장, 해결 과제 등 주요 정보를 담아 서비스의 기틀을 설정하고, 진행 과정에서 새롭게 발견된 시사점을 반영해 내용을 갱신함으로써 참여 인력 간 시각 차이를 조율하는 역할을 한다. 도출된 해결책이 최초 의도에 부합하는지 점검하고 최종 결과물을 평가하는 척도로 활용된다.",same:["서비스 기획서","서비스 개요서"],similar:["디자인 브리프","프로젝트 브리프","제안 요청서(RFP)","제품 요구사항 문서(PRD)","요구사항 명세서"],related:["마일스톤","서비스 프로젝트"]},{id:112,ko:"서비스 사파리",en:"Service safari",initial:"ㅅ",definition:"연구자가 실제 현장에 진입해 이용자 시각에서 제공물을 체험하고 관찰하며 접점(touchpoint) 내 잠재적 요구(latent needs)와 문제점을 파악하는 탐색 조사 기법.",description:"에스노그라피(ethnography)를 응용한 현장 몰입형 조사 방식으로, 실제 이용자 신분으로 전체 여정을 단계별로 수행한다. 해당 과정에서 사진 촬영, 영상 녹화, 메모 작성 등 다각적 수단으로 체감 내용을 수집하며 디지털 기록 방식을 병행하기도 한다. 현장 내 돌발 변수와 대상의 행동 양식을 포착해 간접 조사로 획득하기 어려운 실증적 시사점을 도출한다.",same:[],similar:["미스터리 쇼핑","몰입 조사"],related:["에스노그라피","섀도잉","벤치마킹","고객 여정 지도"]},{id:113,ko:"서비스 생태계",en:"Service ecosystem",initial:"ㅅ",definition:"서비스와 연관된 모든 주체가 효용을 교환하며 상호작용하는 체계로, 관계망을 도식화해 지속 가능한 경험(experience)을 기획하는 통합 관점.",description:"하나의 제공물을 중심으로 이용자, 기업, 이해관계자(stakeholder)가 연결되어 영향을 주고받는 환경을 의미한다. 접점(touchpoint) 너머에 존재하는 후방 영역(back stage)의 관계와 흐름까지 포괄하는 시각이다. 복잡한 상호 교류를 파악하고자 전체 맥락(context)을 지도 형태로 시각화하는 과정을 거쳐 요소 간 연결 구조를 분석한다. 개별 문제 해결을 넘어 시스템 순환 구조를 조정하고 연속성 있는 가치를 창출하는 데 기여한다.",same:["서비스 에코시스템"],similar:["서비스 네트워크","서비스 시스템","비즈니스 생태계","플랫폼 생태계"],related:["서비스 지배 논리","이해관계자","가치 공동 창출","상호 의존성","가치 사슬"]},{id:114,ko:"서비스 생태계 지도",en:"Service ecosystem map",initial:"ㅅ",definition:"서비스가 존재하는 거시적 환경을 바탕으로 직간접적인 이해관계자(stakeholder)와 행위자¹ 간의 관계 및 가치 교환을 시각화한 지도.",description:`제공자와 수혜자의 단편적 관계를 넘어 서비스에 영향을 미치는 광범위한 외부 환경을 조망한다. 다양한 참여자 사이에 발생하는 서비스의 가치 흐름²을 규명해, 기회 발굴과 전략 수립에 활용된다. 서비스가 사회·경제적 맥락(context) 속에서 작동하는 방식을 파악해, 환경 변화에 유연하게 대응할 수 있다.

각주
1. 행위자(actor): 생태계 내에서 자원을 결합하고 효용을 창출하는 참여 주체로, 개인과 기업뿐만 아니라 정부 기관, 지역사회, 거시적 기술 인프라 등을 포함한다.
2. 가치 흐름(value flow): 금전적 수익, 정보, 데이터뿐만 아니라 경험, 신뢰, 평판 등 유무형의 다양한 가치가 생태계 내 주체들 사이를 이동하는 과정이다.`,same:["서비스 생태계 맵"],similar:[],related:["이해관계자 지도","서비스 시스템 지도"]},{id:115,ko:"서비스 시나리오",en:"Service scenario",initial:"ㅅ",definition:"퍼소나(persona)가 새로운 제공물을 이용해 목표를 달성하는 상호작용 과정과 경험(experience)을 시간 흐름에 따라 묘사한 서사(narrative) 도구로, 문제 해결 구상을 이해관계자(stakeholder)에게 전달하고 의사결정 준거를 제시하는 방법.",description:"디자인 목적과 단계에 따라 기회 영역 탐색, 상호작용 흐름 구체화, 결과물 검토 등 서로 다른 초점으로 작성되며, 후반 단계로 갈수록 세부 접점에 집중하는 경향이 있다. 문자, 이미지, 동영상, 스토리보드 형태로 제작하며 프로토타입(prototype) 제작과 이용자 테스트의 기초 자료로 활용된다.",same:[],similar:["이용 시나리오","사용자 시나리오","맥락 시나리오","주요 경로 시나리오"],related:["퍼소나","접점","검증 시나리오","스토리보드","고객 여정 지도"]},{id:116,ko:"서비스 시스템",en:"Service system",initial:"ㅅ",definition:"서비스 구현을 위해 참여 주체의 역할과 활동을 정의하고 상호작용 하도록 구성한 복합 체계로, 유무형 자원을 활용해 가치를 공동 창출(co-creation)하고 경험(experience)을 전달하는 구조.",description:"제공자, 이용자, 이해관계자(stakeholder)가 인적 자원, 기술, 절차를 결합해 각자 역할을 수행하며 교류하는 방식을 규정한다. 물리적 환경부터 정보통신 기술, 디지털 콘텐츠 등 무형 자원까지 다양한 요소를 포함한다. 변동하는 환경에서 일정한 품질을 유지하고 이용자에게 유의미한 경험(experience) 가치를 전달하는 토대가 된다.",same:["서비스 구성 체계","서비스 전달 시스템"],similar:["서비스 생태계","서비스 프로세스","비즈니스 모델"],related:["서비스 공급자","서비스 생산자","서비스 수요자","자원 통합"]},{id:117,ko:"서비스 시스템 지도",en:"Service system map",initial:"ㅅ",definition:"특정 서비스가 이용자에게 전달되는 데 필요한 핵심 구성 요소 간 연결 구조와 내부 작동 원리를 도식화한 운영 체계 지도.",description:`서비스 생태계 지도(service ecosystem map)보다 미시적이고 구체적인 관점에서 서비스 제공에 직접 관여하는 이해관계자(stakeholder)와 행위자¹ 간의 상호작용과 프로세스 흐름을 다룬다. 이용자와 제공 주체가 대면하는 전방 영역(front stage)(접점(touchpoint)), 채널부터 이를 지원하는 후방 영역(back stage)(내부 인프라, 시스템)까지 통합해 물리적 자원과 정보가 이동하는 양상을 추적한다. 서비스 전달 체계의 병목 현상이나 문제점을 파악하고, 추상적인 가치 연결망을 실질적으로 작동 가능한 운영 체계로 구현하는 데 활용된다.

각주
1. 행위자(actor): 서비스 운영 체계 내에서 실질적인 전달 과정을 수행하는 직접적인 참여 주체로, 이용자, 내부 직원, 아웃소싱 인력, 특정 기계, 소프트웨어 시스템 등을 포함한다.`,same:["서비스 시스템 맵"],similar:[],related:["서비스 생태계 지도","행위자","가치 흐름"]},{id:118,ko:"서비스 시스템 아키텍처",en:"Service system architecture",initial:"ㅅ",definition:"운영 체계의 골격으로서 내부 구성 요소와 자원 배치를 규정하며 전방 영역(front stage)과 후방 영역(back stage)을 연계해 설계하는 구조적 틀.",description:"인적 자원, 운영 절차, 물리적 환경, 기술 등 제반 자원의 조합으로 규정되며 경험(experience) 전반에 걸친 접점(touchpoint) 및 지원 체계에 대한 포괄적 시각을 제시한다. 고객 여정 지도(customer journey map)로 파악한 상호작용 창구를 후방 영역(back stage)의 업무 처리 및 기반 기술과 연결해 일관된 경험 품질을 유지하고 운영 효율화의 근거로 기능한다.",same:["서비스 아키텍처"],similar:["서비스 청사진","시스템 구성도"],related:["정보 구조","마이크로 서비스 아키텍쳐","레이어드 아키텍쳐"]},{id:119,ko:"서비스 오퍼링",en:"Service offering",initial:"ㅅ",definition:"고객의 잠재적 요구(latent needs)를 충족하고 유의미한 가치를 전달하고자 기획한 유무형의 통합 제공물.",description:"제공자가 전달할 효용을 담아 유무형 산출물을 결합하고, 도입부터 종료에 이르는 서비스 수명주기 전반의 경험(experience)과 상호작용 과정을 고려해 추상적 구상을 실체화한다. 단순한 기능 나열을 넘어 잠재적 요구(latent needs)를 파악해 실질적 편익을 제공하는 데 목적을 둔다.",same:[],similar:["서비스 솔루션","서비스 패키지"],related:["서비스 콘셉트","핵심 서비스","보조 서비스","가치 제안","전달 채널","서비스 수명주기","수익 모델"]},{id:120,ko:"서비스 인카운터",en:"Service encounter",initial:"ㅅ",definition:"고객이 제공 주체 및 운영 체계와 접촉해 교류를 경험하는 결정적 접촉 시점¹이자 특정 시간적 구간.",description:`전통적 대면 방식 및 이원적 상호작용²을 넘어 디지털 환경과 자동화 시스템을 포함한 다채널 환경의 제반 접점(touchpoint)을 포괄한다. 고객은 물리적 환경, 인공물³ 등 유형 단서⁴와 서비스 스크립트⁵에 따른 역할 수행을 바탕으로 제공물의 완성도를 가늠한다. 제공 과정에서 발생하는 이질성⁶을 통제하고 고객에게 일관되고 개인화된 경험(experience) 가치를 전달하기 위한 서비스디자인의 분석 단위로 활용된다.

각주
1. 결정적 접촉 시점(moment of truth, MOT): 고객이 제공물과 접촉하는 순간 서비스 전반에 대한 인상이 결정되는 시점이다.
2. 이원적 상호작용(dyadic interaction): 현장에서 고객과 제공자 두 당사자 간 발생하는 직접적 소통 및 교류이다.
3. 인공물(artifact): 공간 내 존재하는 가구, 장식, 안내판 등 인위적으로 제작된 물리적 사물로 서비스의 성격이나 분위기를 전달하는 유형 단서로 기능한다.
4. 유형적 단서(tangible cues): 무형의 서비스를 이용자가 평가하도록 돕는 시각적, 물리적 증거이다.
5. 서비스 스크립트(service script): 고객을 대면할 때 수행할 언어 및 행동 순서를 미리 규정한 행동 지침이다.
6. 이질성(heterogeneity): 제공 인력, 상황, 시간에 따라 품질이 변동될 수 있는 성질이다.`,same:[],similar:["서비스 접점","접점","진실의 순간(MOT)"],related:["서비스 청사진","고객 여정 지도","상호작용"]},{id:121,ko:"서비스 주도 논리",en:"Service dominant logic, S-D logic",initial:"ㅅ",definition:"서비스를 모든 경제적 교환의 기본 단위로 보며 고객과의 상호작용을 통해 가치가 공동으로 창출되는 경제적 패러다임.",description:"바고와 러시(Vargo & Lusch)가 제안한 개념으로 사물 중심 경제관을 탈피해 무형적 교류를 본질로 파악하는 이론이다. 완성된 산출물(output)을 전달한다는 기존 시각에서 벗어나 고객의 지식, 기술 자원을 활용하는 과정에서 효용이 발현된다고 본다. 제공자와 고객을 생산자와 구매자로 이분화하지 않고 협력적 동반자 관계로 재정의한다. 효용은 물질적 소유가 아닌 사용 과정에서 발생하는 맥락적 가치로 규정된다. 서비스 제공 주체가 단순 판매 역할을 넘어 가치 제안자로서 고객과 공동 창출(co-creation) 생태계에 참여하는 관점을 제시한다.",same:["S-D 로직","서비스 중심 논리","서비스 지배 논리"],similar:["서비타이제이션","서비스 주도 성장","제품-서비스 시스템(PSS)","경험 경제"],related:["가치 공동 창출","사용 가치","자원 통합","피어 투 피어(P2P) 네트워크"]},{id:122,ko:"서비스 청사진",en:"Service blueprint",initial:"ㅅ",definition:"고객 여정에 따른 서비스 전달 과정을 전방 영역(front stage), 후방 영역(back stage), 지원 체계로 구분해 시간 흐름에 따라 시각화한 운영 구조 도식.",description:"고객 행동, 이에 대응하는 물리적 증거, 제공자 활동을 구조화하는 경험디자인(experience design) 도구이다. 각 영역은 상호작용선(line of interaction), 가시선(line of visibility), 내부 상호작용선(line of internal interaction)으로 경계를 나눈다. 접점(touchpoint) 내 교류 양상과 내부 지원망을 바탕으로 제공 흐름상 병목 구간을 진단하거나 신규 서비스의 전달 구조를 디자인 도구로 활용된다.",same:["서비스 블루프린트"],similar:["서비스 흐름도"],related:["프론트 스테이지","백 스테이지","가시선","물리적 증거","상호작용","고객 여정 지도"]},{id:123,ko:"서비스 콘셉트",en:"Service concept",initial:"ㅅ",definition:"제공할 가치와 속성을 정의해 시스템 구축과 세부 조건 결정까지 실행 방향성을 제시하는 전략적 구상.",description:"에드바르드손과 올슨(Edvardsson & Olsson)이 제시한 개념에 따르면, 기획 단계에서 고객의 요구에 맞는 집중성, 차별성, 일관성을 갖추는 것을 전제로 한다. 브리프나 스케치 등의 형태로 시각화되어 이해관계자(stakeholder) 사이의 인식을 조율하는 소통 도구로 활용되며, 아이디어 단계를 넘어 시스템 구축과 세부 조건 결정을 이끄는 지침으로 기능한다.",same:[],similar:["가치 제안","서비스 원형"],related:["디자인 원칙","서비스 슬로건"]},{id:124,ko:"서비스 타깃",en:"Service target",initial:"ㅅ",definition:"경험 가치를 전달하기 위해 행동 데이터와 요구 사항을 분석하여 디자인 방향과 자원 배분의 우선순위를 결정하는 준거나 되는 고객 집단.",description:"인구통계학적 기준을 넘어 요구 사항, 행동 패턴, 심리적 특성을 반영해 세분화되며 퍼소나(persona) 설정과 고객 여정 설계의 바탕이 된다. 자원을 집중하고 고객 중심 경험(experience)을 기획하는 출발점이자 서비스 설계의 효율성을 높이는 준거로 기능한다.",same:["서비스 표적"],similar:["목표 사용자","핵심 사용자","사용자 세그먼트","잠재 고객"],related:["고객 세분화","고객 요구 분석","행동 데이터","퍼소나","고객 여정"]},{id:125,ko:"서비스 타깃팅",en:"Service targeting",initial:"ㅅ",definition:"특정 고객 집단을 선정해 요구와 상황에 부합하는 방향을 수립하고 맞춤형 경험(experience)을 디자인하는 과정.",description:"단순히 대상을 선정하는 데 그치지 않고, 선정된 고객 집단의 요구, 행동 패턴, 맥락을 분석해 제공할 가치와 부가 요소를 결합하는 전략적 판단을 포함한다. 이를 바탕으로 여정 내 모든 접점(touchpoint)에서 일관된 고객 중심 경험(experience)이 구현되도록 디자인 방향을 구체화한다.",same:[],similar:["서비스 포지셔닝","타깃 세그먼트 정의","표적 고객 선정"],related:["가치 제안","시장 세분화","STP분석"]},{id:126,ko:"서비스 품질",en:"Service quality",initial:"ㅅ",definition:"사전 기대와 전달 과정에서 지각한 성과 사이의 격차를 분석해 이용자의 만족 수준을 결정하고 전달 체계의 개선 지점을 도출하는 평가 준거.",description:"파라수라만과 자이타믈과 베리(Parasuraman, Zeithaml & Berry)가 제안한 갭 모델을 토대로 고객 기대, 경영진 인식, 서비스 사양, 전달, 소통 영역으로 세분화해 기대와 지각 사이의 불일치를 설명한다. 분석 결과는 내부 기준과 운영 구조를 재정립하는 동시에 실패 상황에 대비한 회복 전략을 수립과 고객 경험 개선의 준거로 활용된다.",same:[],similar:["서비스 우수성","사용자 경험 품질"],related:["SERVQUAL","SERVPERF","고객 만족도","서비스 신뢰도"]},{id:127,ko:"서비스 흐름도",en:"Service flow map",initial:"ㅅ",definition:"고객 경험을 구성하는 접점(touchpoint)과 상호작용 단계를 순서도 기호로 표현해 분기 조건을 포함한 서비스 전달 구조를 시각화한 도식.",description:"고객 여정과 연결된 제공자 행동을 구조적으로 표현하되, 진행 단계의 순서와 조건 분기를 중심으로 프로세스 논리를 나타낸다. 잠재적 실패 지점 및 병목 구간을 식별해 경험(experience) 개선과 서비스 전달 체계 검증의 준거로 활용된다.",same:[],similar:["UX 플로우","워크플로우","고객 여정 지도","서비스 청사진","사용자 플로우"],related:["접점","의사결정 분기점"]},{id:128,ko:"서비스스케이프",en:"Servicescape",initial:"ㅅ",definition:"제공자와 고객이 대면하는 지점에서 상호작용을 매개하고 인식, 행동, 동선에 영향을 주도록 설계된 물리적 환경.",description:"비트너(Bitner)가 제안한 개념으로 생산과 소비가 동시에 발생하는 장소이자 접점(touchpoint)으로서 조명·음악·향기 등 주변 조건, 공간 배치와 기능성, 안내 사인·상징·인공물의 세 차원으로 구성된다. 조성된 물리적 환경은 품질을 가늠하는 단서를 제공해 신뢰를 형성하고 행동을 촉진하는 기제로 기능한다. 동선을 관리하고 서비스 전달 과정을 지원하는 동시에 경험을 구체화하고 상호작용을 실체화하는 바탕이 된다.",same:["서비스 환경"],similar:["오프라인 접점","환경 디자인"],related:["주변 조건","공간적 배치 및 기능성","기호/상징 및 조형물","앰비언스"]},{id:129,ko:"서비스화",en:"Servitization",initial:"ㅅ",definition:"제조업 기반 제품 판매 구조에서 벗어나 고객 경험과 무형 가치를 결합한 통합적 제품-서비스 시스템(product-service system, PSS)을 제공하는 방향으로 전환하는 과정.",description:"반더메르베와 라다(Vandermerwe & Rada)가 제시한 개념으로, 소유 중심 방식에서 사용 및 공유 기반 통합 솔루션 제공으로의 전환을 의미하며, 제품-서비스 시스템(product-service system, PSS) 형태로 구현된다. 접점(touchpoint)과 상호작용을 기획하는 경험디자인(experience design) 방법론과 연결되며, 제조와 서비스의 경계를 허물고 고객 요구(needs)를 충족하는 지속적 관계 구축의 바탕이 된다.",same:[],similar:["제품-서비스 시스템(PSS)","구독 경제","공유 경제"],related:["서비스 주도 논리","디지털 전환","고객 생애 가치(LTV)"]},{id:130,ko:"서브퀄",en:"SERVQUAL",initial:"ㅅ",definition:"고객이 서비스 접촉 이전에 형성한 기대 수준과 서비스 이용 후 지각한 성과 사이의 격차를 측정하여 서비스 품질을 평가하는 척도이자 진단 모형.",description:"파라수라만과 자이다믈과 베리(Parasuraman, Zeithaml & Berry)가 개발한 서비스 품질 측정 척도로, 유형성, 신뢰성, 반응성, 확신성, 공감성의 5개 핵심 차원으로 구성된다. 기대와 지각 성과 간의 격차를 문항으로 측정하여 서비스 품질 수준을 점수화하며 기업, 의료, 공공, 복지 기관 등 다양한 영역에서 서비스 품질(service quality)을 진단하고 개선하는 데 활용된다.",same:["서비스 품질 측정 척도","PZB 모형"],similar:["SERVPERF","고객 만족도 조사"],related:["서비스 품질","격차 모형","고객 기대","지각된 성과","리커트 척도","고객 경험","사용성 평가"]},{id:131,ko:"설문조사",en:"Survey",initial:"ㅅ",definition:"현상을 파악하거나 가설(hypothesis)을 검증하기 위해 다수 응답자에게 표준화된 질문을 제시하여 데이터를 수집하고 통계적으로 분석하는 정량 조사 방법으로, 주로 정량 데이터 수집에 활용.",description:"대상 집단의 특성, 태도, 행동 패턴을 규명하는 데 활용되며 목적에 따라 인식 측정, 원인 파악, 성과 비교, 의견 수집에 적용된다. 분석 목적에 부합하는 문항 설계가 선행되며, 온라인, 대면, 매체 활용 등의 방식으로 진행된다. 정량 데이터를 기반으로 하되 서술형 답변으로 결과를 보완하기도 한다.",same:["서베이"],similar:["정량 사용자 조사"],related:["설문지","표본 추출","표본 편향"]},{id:132,ko:"설문지",en:"Questionnaire",initial:"ㅅ",definition:"가설(hypothesis)을 검증하고 응답 결과를 수치화하기 위해 측정 변수에 부합하는 문항을 개발해 구성한 정량 데이터 수집 도구.",description:"선택형 문항, 리커트 척도(Likert scale), 매트릭스 형태의 폐쇄형 질문을 바탕으로 개방형 질문을 혼합해 구성하며, 중립적 표현을 사용해 응답 편향과 기억 오차를 통제한다. 응답자 부담을 줄이도록 분량을 조절하고 중복 문항을 제외하며, 문항 순서와 배치를 통해 논리적 흐름을 구축한다. 스크리너 문항으로 분석 대상자를 선별하고 배포 전 예비 조사(pilot test)를 거쳐 타당성을 확보한다.",same:[],similar:["질문지"],related:["스크리너","응답 편향","리커트 척도","데이터 정제"]},{id:133,ko:"소비자",en:"Consumer",initial:"ㅅ",definition:"시장 경제 체제에서 제품과 서비스 가치를 선택하고 소비하며 경험(experience)을 완성하는 경제적 주체.",description:"전통적으로 수동적인 구매자 역할에 머물렀으나, 요구(needs)와 행동 패턴으로 시장 흐름에 영향을 미치며 경험디자인(experience design) 과정에 참여하는 주체로 재정의되고 있다. 개인 취향과 가치관을 소비 행위로 표현해 사회 트렌드와 기술 발전에 관여하며, 제공자와의 상호작용을 통해 새로운 경험 가치를 형성하는 데 기여한다.",same:[],similar:["고객","사용자","구매자","수요자"],related:["생산자","프로슈머","시장","트렌드"]},{id:134,ko:"스토리보드",en:"Storyboard",initial:"ㅅ",definition:"시나리오를 바탕으로 사용자가 서비스를 이용하며 겪는 경험(experience)과 행동 흐름을 연속된 프레임 안에 묘사해 여정의 맥락(context)과 콘셉트를 전달하는 시각화 도구.",description:"영화 제작 기법을 차용해 퍼소나(persona)와 제공자 간 상호작용과 접점(touchpoint)을 묘사함으로써 서비스 경험(experience)을 가시화한다. 서사(narrative) 전달력을 높이기 위해 설정, 대립, 해결의 3막 구조를 따르기도 한다. 스케치, 그래픽, 스크린샷, 하이브리드 형태로 활용되며 초기 단계 프로토타입(prototype) 제작에 앞서 시스템을 구체화하는 바탕이 된다.",same:[],similar:["시각적 시나리오","UX 스토리보드","사용자 여정 지도"],related:["컷/프레임","접점","맥락","피드백"]},{id:135,ko:"스토리텔링",en:"Storytelling",initial:"ㅅ",definition:"리서치로 도출된 인사이트를 서사(narrative) 구조로 재구성해 이해관계자(stakeholder)와 공감(empathy)을 형성하고 경험 비전을 전달하는 소통 기법",description:"리서치 과정에서 포착한 사용자 심리, 정보, 맥락(context)을 서사(narrative)적 구조로 재구성해 공감(empathy)을 끌어내며, 아이데이션(ideation)부터 최종 제안까지 프로젝트 전 과정에 걸쳐 활용한다. 정량적 지표나 기능 명세서로 전달하기 어려운 참여자의 세밀한 감정과 처한 상황을 묘사함으로써 이해관계자(stakeholder)의 지지를 확보하고, 추상적인 미래 콘셉트를 직관적인 형태로 가시화한다. 문제 발견과 해결의 흐름을 연결해 참여자의 상상력을 자극하고 비전을 공유한다.",same:[],similar:["시나리오","스토리보딩","서사","플롯"],related:["퍼소나","공감","가치제안","설득적 커뮤니케이션","시각적 스토리텔링"]},{id:136,ko:"스키마",en:"Schema",initial:"ㅅ",definition:"인간이 과거 경험(experience)과 학습을 바탕으로 지식과 정보를 구조화한 인지적 틀.",description:"새로운 대상을 접했을 때 기존 기억 패턴을 대입해 대상을 인식하게 하는 기제로 유사한 경험과 범주를 연결하며 상황에 맞춰 작동한다. 매번 새로운 정보를 처음부터 학습하지 않고도 맥락(context)을 이해하고 결과를 예측하도록 지원한다. 이러한 인지적 특성은  낯선 서비스 환경이나 인터페이스를 마주했을 때 기존 경험(experience)을 환기해 원활한 상호작용을 이끄는 바탕이 된다.",same:["인지적 틀","인지 도식"],similar:["내적 표상","프레임"],related:["멘탈 모델","기대치","관습","스테레오타입","인지 부하","어포던스","패턴 인식"]},{id:137,ko:"스캠퍼",en:"SCAMPER",initial:"ㅅ",definition:"기존 제품이나 서비스 구성 요소를 일곱 가지 질문으로 재구성해 새로운 아이디어와 개선안을 도출하는 창의적 발상 도구.",description:"사고가 정체되었을 때 정해진 질문을 던져 관점을 전환하는 사고 틀로 활용된다. 대체, 결합, 응용, 수정, 다른 용도, 제거, 재배열의 체크리스트를 통해 대상을 다각도로 분석함으로써 기존 제공 방식이나 기능을 새로운 시각으로 재해석한다. 개인 영감에 의존하지 않고 검증된 가이드라인에 따라 문제를 체계적으로 검토해, 해결안을 구체화하는 브레인스토밍(brainstorming) 발상 도구로 기능한다.",same:[],similar:["발상 전환 질문법","브레인스토밍","수평적 사고"],related:["아이데이션","트리즈","마인드맵"]},{id:138,ko:"시나리오 기획",en:"Scenario planning",initial:"ㅅ",definition:"미래에 발생할 수 있는 복수의 상황을 맥락에 따라 구성해 불확실성에 대비하고 서비스의 중장기 방향성을 도출하는 전략적 기획 방법.",description:"단일한 예측에 의존하지 않고 트렌드, 변수, 사전 결정 요소를 조합해 복수의 상황을 구조화하는 한편, 참여자의 고착된 세계관과 멘탈 모델(mental model)을 전환해 새로운 인사이트를 도출한다. 이를 위해 불확실성 요인을 식별하고 시나리오 간 내적 일관성을 점검하는 과정을 거친다.",same:["미래 시나리오 기획"],similar:[],related:["스펙큘러티브 디자인","백캐스팅"]},{id:139,ko:"시선 추적",en:"Eye tracking",initial:"ㅅ",definition:"사용자의 눈 움직임을 감지해 응시 위치와 지속 시간을 수치화함으로써 시각적 주의 패턴을 파악하는 정량적 조사 방법.",description:`전용 장비나 카메라를 이용해 눈의 움직임을 감지하고 시선이 고정되는 지점과 이동 경로를 측정해 주의 집중 영역을 분석한다. 수집된 데이터는 시선이 머문 정도를 색상으로 나타내는 히트맵¹이나 탐색 순서를 선과 원으로 연결한 게이즈 플롯²으로 시각화된다. 응시 지속 시간과, 첫 응시 시간, 재방문 횟수 같은 지표를 통해 정보 처리 방식과 인지 과정을 파악한다.

각주 
1. 히트맵(heatmap): 시선이 집중된 정도를 색상 온도로 나타낸 분포도로, 오래 머물거나 자주 닿은 영역은 붉은색, 상대적으로 덜 머문 영역은 푸른색이나 무색으로 표시해 관심도를 파악한다.
